version: 0.2

env:
  shell: bash
  variables:
    NODE_ENV: "production"
    AWS_REGION: "us-east-1"

    # Frontend
    S3_BUCKET: "dev-mvx-developer-hub"

    # Lambda@Edge
    LAMBDA_NAME: "developer-hub-dev-basic-auth"
    ROLE_NAME: "developer-hub-dev-us-east-1-lambdaRole"
    DISTRIBUTION_ID: "EWGY1JYSRFKJQ"

    KEEP_LAST_N: "2"
    DRY_RUN: "false"

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "========================================"
      - echo "INSTALL PHASE"
      - echo "========================================"
      - node --version
      - npm --version
      - apt-get update
      - apt-get install -y jq zip

  pre_build:
    commands:
      - echo "========================================"
      - echo "PRE_BUILD PHASE"
      - echo "========================================"
      - npm ci --prefix api-center --include=dev
      - npm install @aws-sdk/client-lambda --no-fund --no-audit

  build:
    commands:
      - echo "========================================"
      - echo "BUILD PHASE"
      - echo "========================================"
      - npm --prefix api-center run build
      - echo "Verifying build output"
      - ls -la api-center
      - ls -la api-center/dist
      - test -f api-center/dist/index.html
      - test -d api-center/dist/assets
      - echo "Generated asset references:"
      - cat api-center/dist/index.html | grep assets || true
      - echo "Generated files:"
      - find api-center/dist -type f | head -50

  post_build:
    commands:
      - echo "========================================"
      - echo "POST_BUILD PHASE"
      - echo "========================================"

      #########################################################
      # Cleanup Lambda versions
      #########################################################
      - echo "Running Lambda cleanup"
      - node ./scripts/lambda-version.cleanup.js || true

      #########################################################
      # Validate variables
      #########################################################
      - echo "Validating variables"
      - test -n "$AWS_REGION"
      - test -n "$LAMBDA_NAME"
      - test -n "$ROLE_NAME"
      - test -n "$DISTRIBUTION_ID"
      - test -n "$S3_BUCKET"

      #########################################################
      # Account ID
      #########################################################
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - echo "ACCOUNT_ID=$ACCOUNT_ID"

      #########################################################
      # Upload frontend
      #########################################################
      - echo "========================================"
      - echo "DEPLOYING FRONTEND"
      - echo "========================================"
      - echo "Uploading hashed assets"
      - |
        aws s3 sync \
          api-center/dist/assets \
          s3://$S3_BUCKET/assets \
          --region "$AWS_REGION" \
          --cache-control "public,max-age=31536000,immutable"
      - echo "Uploading favicon"
      - |
        if [ -f "api-center/dist/favicon.ico" ]; then
          aws s3 cp \
            api-center/dist/favicon.ico \
            s3://$S3_BUCKET/favicon.ico \
            --region "$AWS_REGION" \
            --cache-control "public,max-age=86400"
        fi
      - echo "Uploading other static files"
      - |
        aws s3 sync \
          api-center/dist \
          s3://$S3_BUCKET \
          --region "$AWS_REGION" \
          --exclude "assets/*" \
          --exclude "index.html" \
          --cache-control "no-cache,no-store,must-revalidate"
      - echo "Uploading index.html LAST"
      - |
        aws s3 cp \
          api-center/dist/index.html \
          s3://$S3_BUCKET/index.html \
          --region "$AWS_REGION" \
          --content-type "text/html" \
          --cache-control "no-cache,no-store,must-revalidate"

      #########################################################
      # Verify uploaded HTML
      #########################################################
      - echo "Verifying uploaded index"
      - |
        aws s3 cp \
          s3://$S3_BUCKET/index.html \
          --region "$AWS_REGION" \
          - | grep assets || true
      - echo "Uploaded asset list"
      - |
        aws s3 ls \
          s3://$S3_BUCKET/assets/ \
          --region "$AWS_REGION" \
          --recursive | head -20

      #########################################################
      # IAM Role
      #########################################################
      - |
        if aws iam get-role --role-name "$ROLE_NAME" >/dev/null 2>&1
        then
          echo "IAM role exists"
        else
          echo "Creating IAM role"
          printf '%s\n' \
          '{' \
          '  "Version":"2012-10-17",' \
          '  "Statement":[{' \
          '    "Effect":"Allow",' \
          '    "Principal":{' \
          '      "Service":[' \
          '        "lambda.amazonaws.com",' \
          '        "edgelambda.amazonaws.com"' \
          '      ]' \
          '    },' \
          '    "Action":"sts:AssumeRole"' \
          '  }]' \
          '}' > trust.json
          aws iam create-role \
            --role-name "$ROLE_NAME" \
            --assume-role-policy-document file://trust.json
          aws iam attach-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-arn arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
          sleep 20
        fi

      #########################################################
      # Package Lambda
      #########################################################
      - cd api-center/edge-auth
      - rm -f function.zip
      - zip -r function.zip . >/dev/null
      - cd -

      #########################################################
      # Deploy Lambda
      #########################################################
      - |
        if aws lambda get-function \
        --function-name "$LAMBDA_NAME" \
        --region "$AWS_REGION" >/dev/null 2>&1
        then
          echo "Updating Lambda"
          aws lambda update-function-code \
            --function-name "$LAMBDA_NAME" \
            --zip-file fileb://api-center/edge-auth/function.zip \
            --region "$AWS_REGION"
        else
          echo "Creating Lambda"
          aws lambda create-function \
            --function-name "$LAMBDA_NAME" \
            --runtime nodejs18.x \
            --handler index.handler \
            --role arn:aws:iam::$ACCOUNT_ID:role/$ROLE_NAME \
            --zip-file fileb://api-center/edge-auth/function.zip \
            --region "$AWS_REGION"
        fi
      - aws lambda wait function-updated \
          --function-name "$LAMBDA_NAME" \
          --region "$AWS_REGION"

      #########################################################
      # Publish Lambda
      #########################################################
      - |
        VERSION=$(aws lambda publish-version \
          --function-name "$LAMBDA_NAME" \
          --region "$AWS_REGION" \
          --query 'Version' \
          --output text)

      #########################################################
      # Update CloudFront
      #########################################################
      - aws cloudfront get-distribution-config \
          --id "$DISTRIBUTION_ID" > cf.json
      - ETAG=$(jq -r '.ETag' cf.json)
      - jq '.DistributionConfig' cf.json > dist.json
      - |
        LAMBDA_ARN="arn:aws:lambda:$AWS_REGION:$ACCOUNT_ID:function:$LAMBDA_NAME:$VERSION"
        jq ".DefaultCacheBehavior.LambdaFunctionAssociations={
            \"Quantity\":1,
            \"Items\":[
              {
                \"EventType\":\"viewer-request\",
                \"LambdaFunctionARN\":\"$LAMBDA_ARN\"
              }
            ]
          }" dist.json > updated.json
      - |
        aws cloudfront update-distribution \
          --id "$DISTRIBUTION_ID" \
          --if-match "$ETAG" \
          --distribution-config file://updated.json

      #########################################################
      # Invalidate cache ONLY ONCE
      #########################################################
      - echo "Invalidating CloudFront"
      - |
        aws cloudfront create-invalidation \
          --distribution-id "$DISTRIBUTION_ID" \
          --paths "/" "/index.html" "/favicon.ico"
      - echo "Deployment completed"

artifacts:
  base-directory: api-center/dist
  files:
    - "**/*"

cache:
  paths:
    - /root/.npm/**/*
