version: 0.2

env:
shell: bash
variables:
NODE_ENV: "production"
AWS_REGION: "us-east-1" 
S3_BUCKET: "dev-ccm-localization"
S3_PREFIX: "dev-mvx-developer-hub"
SPECS_PREFIX: "specs-store"

VITE_PUBLIC_BASE_PATH: "/dev-mvx-developer-hub/"

DISTRIBUTION_ID: "E8KSJDLFA898A"

LAMBDA_NAME: "developer-hub-dev-basic-auth"
ROLE_NAME: "developer-hub-dev-us-east-1-lambdaRole"

SPEC_API_LAMBDA_NAME: "developer-hub-dev-spec-api"
SPEC_API_ROLE_NAME: "developer-hub-dev-spec-api-role"

KEEP_LAST_N: "2"
DRY_RUN: "false" 
phases:
install:
runtime-versions:
nodejs: 22
commands:
- node --version
- npm --version
- apt-get update
- apt-get install -y jq zip

pre_build:
  commands:
  - npm --prefix api-center install --include=dev
  - npm install @aws-sdk/client-lambda --no-fund --no-audit


  - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

  - |
    SPEC_API_ENV="Variables={S3_BUCKET=$S3_BUCKET,S3_APP_PREFIX=$S3_PREFIX,SPECS_PREFIX=$SPECS_PREFIX,CLOUDFRONT_DISTRIBUTION_ID=$DISTRIBUTION_ID}"

    if aws lambda get-function \
      --function-name "$SPEC_API_LAMBDA_NAME" \
      --region "$AWS_REGION" >/dev/null 2>&1; then

      echo "Updating Spec API Lambda"

      aws lambda update-function-code \
        --function-name "$SPEC_API_LAMBDA_NAME" \
        --zip-file fileb://api-center/spec-api/function.zip \
        --region "$AWS_REGION"

    fi
 

build:
  commands:
  - source api-center/.spec-api-env.sh || true


  - echo "Building frontend"

  - npm --prefix api-center run build

  - test -f api-center/dist/index.html
  - test -d api-center/dist/assets

  - echo "Generated assets:"
  - cat api-center/dist/index.html | grep assets || true
 

post_build:
  commands:

 
  - node ./scripts/lambda-version.cleanup.js || true

  - test -n "$AWS_REGION"
  - test -n "$S3_BUCKET"
  - test -n "$S3_PREFIX"
  - test -n "$DISTRIBUTION_ID"

  - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

  - |
    S3_DEST="s3://${S3_BUCKET}/${S3_PREFIX}"

    echo "Deploying frontend to ${S3_DEST}"

    aws s3 sync \
      api-center/dist/assets \
      "${S3_DEST}/assets" \
      --region "$AWS_REGION" \
      --cache-control "public,max-age=31536000,immutable"

    if [ -f "api-center/dist/favicon.ico" ]; then
      aws s3 cp \
        api-center/dist/favicon.ico \
        "${S3_DEST}/favicon.ico" \
        --region "$AWS_REGION" \
        --cache-control "public,max-age=86400"
    fi

    aws s3 sync \
      api-center/dist \
      "${S3_DEST}" \
      --region "$AWS_REGION" \
      --exclude "assets/*" \
      --exclude "index.html" \
      --cache-control "no-cache,no-store,must-revalidate"

    aws s3 cp \
      api-center/dist/index.html \
      "${S3_DEST}/index.html" \
      --region "$AWS_REGION" \
      --content-type "text/html" \
      --cache-control "no-cache,no-store,must-revalidate"

  - echo "Verifying uploaded HTML"

  - |
    aws s3 cp \
      "${S3_DEST}/index.html" \
      - \
      --region "$AWS_REGION" | grep assets || true

  - |
    if aws iam get-role \
      --role-name "$ROLE_NAME" >/dev/null 2>&1
    then
      echo "Role exists"
    else

      printf '%s\n' \
      '{' \
      '  "Version":"2012-10-17",' \
      '  "Statement":[{' \
      '      "Effect":"Allow",' \
      '      "Principal":{' \
      '          "Service":["lambda.amazonaws.com","edgelambda.amazonaws.com"]' \
      '      },' \
      '      "Action":"sts:AssumeRole"' \
      '  }]' \
      '}' > trust.json

      aws iam create-role \
        --role-name "$ROLE_NAME" \
        --assume-role-policy-document file://trust.json

      aws iam attach-role-policy \
        --role-name "$ROLE_NAME" \
        --policy-arn arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      sleep 20
    fi

  - cd api-center/edge-auth
  - rm -f function.zip
  - zip -rq function.zip .
  - cd -

  - |
    if aws lambda get-function \
      --function-name "$LAMBDA_NAME" \
      --region "$AWS_REGION" >/dev/null 2>&1
    then

      aws lambda update-function-code \
        --function-name "$LAMBDA_NAME" \
        --zip-file fileb://api-center/edge-auth/function.zip \
        --region "$AWS_REGION"

      aws lambda wait function-updated \
        --function-name "$LAMBDA_NAME" \
        --region "$AWS_REGION"

    else

      aws lambda create-function \
        --function-name "$LAMBDA_NAME" \
        --runtime nodejs18.x \
        --handler index.handler \
        --role "arn:aws:iam::${ACCOUNT_ID}:role/${ROLE_NAME}" \
        --zip-file fileb://api-center/edge-auth/function.zip \
        --region "$AWS_REGION"

      aws lambda wait function-active \
        --function-name "$LAMBDA_NAME" \
        --region "$AWS_REGION"

    fi

  - |
    VERSION=$(aws lambda publish-version \
      --function-name "$LAMBDA_NAME" \
      --region "$AWS_REGION" \
      --query Version \
      --output text)

  - |
    aws cloudfront get-distribution-config \
      --id "$DISTRIBUTION_ID" > cf.json

    ETAG=$(jq -r '.ETag' cf.json)

    jq '.DistributionConfig' cf.json > dist.json

    LAMBDA_ARN="arn:aws:lambda:${AWS_REGION}:${ACCOUNT_ID}:function:${LAMBDA_NAME}:${VERSION}"

    jq --arg LAMBDA_ARN "$LAMBDA_ARN" '
    .DefaultCacheBehavior.LambdaFunctionAssociations = {
      "Quantity":1,
      "Items":[
        {
          "EventType":"viewer-request",
          "LambdaFunctionARN":$LAMBDA_ARN
        }
      ]
    }
    |
    .DefaultCacheBehavior.AllowedMethods = {
      "Quantity":7,
      "Items":[
        "GET",
        "HEAD",
        "OPTIONS",
        "PUT",
        "POST",
        "PATCH",
        "DELETE"
      ],
      "CachedMethods":{
        "Quantity":2,
        "Items":[
          "GET",
          "HEAD"
        ]
      }
    }
    ' dist.json > updated.json

    aws cloudfront update-distribution \
      --id "$DISTRIBUTION_ID" \
      --if-match "$ETAG" \
      --distribution-config file://updated.json

  - |
    aws cloudfront create-invalidation \
      --distribution-id "$DISTRIBUTION_ID" \
      --paths \
      "/${S3_PREFIX}" \
      "/${S3_PREFIX}/" \
      "/${S3_PREFIX}/index.html" \
      "/${S3_PREFIX}/favicon.ico" \
      "/${S3_PREFIX}/assets/*"

  - echo "App URL:"
  - echo "https://d2p9v61861q1ox.cloudfront.net/${S3_PREFIX}/"


artifacts:
base-directory: api-center/dist
files:
- "**/*"

cache:
paths:
- /root/.npm/**/*
