version: 0.2

env:
  variables:
    NODE_ENV: production
    AWS_REGION: us-east-1
    LAMBDA_NAME: cf-basic-auth
    ROLE_NAME: developer-hub-dev-us-east-1-lambdaRole
    DISTRIBUTION_ID: E2IR80EP36T2RA
    KEEP_LAST_N: 2
    DRY_RUN: false

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - "echo Node $(node --version)"
      - "echo NPM $(npm --version)"
      - "apt-get update && apt-get install -y jq zip"

  pre_build:
    commands:
      - "echo Installing dependencies"
      - "npm --prefix api-center install --include=dev"
      - "npm install @aws-sdk/client-lambda"

  build:
    commands:
      - "echo Building frontend"
      - "npm --prefix api-center run build"

  post_build:
    commands:
      - "echo Running cleanup"
      - "node ./scripts/lambda-version.cleanup.js || true"

      - "echo Validating environment"
      - "echo LAMBDA_NAME=$LAMBDA_NAME"
      - "echo ROLE_NAME=$ROLE_NAME"
      - "echo DISTRIBUTION_ID=$DISTRIBUTION_ID"

      - "test -n \"$LAMBDA_NAME\""
      - "test -n \"$ROLE_NAME\""
      - "test -n \"$DISTRIBUTION_ID\""

      - "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)"
      - "echo ACCOUNT_ID=$ACCOUNT_ID"

      # IAM ROLE
      - |
        if aws iam get-role --role-name "$ROLE_NAME" >/dev/null 2>&1; then
          echo "IAM role exists"
        else
          echo "Creating IAM role..."
          echo '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":["lambda.amazonaws.com","edgelambda.amazonaws.com"]},"Action":"sts:AssumeRole"}]}' > trust.json
          aws iam create-role --role-name "$ROLE_NAME" --assume-role-policy-document file://trust.json
          aws iam attach-role-policy --role-name "$ROLE_NAME" --policy-arn arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
          sleep 15
        fi

      # PACKAGE
      - "echo Packaging Lambda"
      - "cd api-center/edge-auth"
      - "zip -r function.zip . >/dev/null"
      - "cd -"

      # DEPLOY
      - |
        if aws lambda get-function --function-name "$LAMBDA_NAME" --region "$AWS_REGION" >/dev/null 2>&1; then
          echo "Updating Lambda..."
          aws lambda update-function-code --function-name "$LAMBDA_NAME" --zip-file "fileb://api-center/edge-auth/function.zip" --region "$AWS_REGION"
        else
          echo "Creating Lambda..."
          aws lambda create-function --function-name "$LAMBDA_NAME" --runtime nodejs18.x --handler index.handler --role "arn:aws:iam::$ACCOUNT_ID:role/$ROLE_NAME" --zip-file "fileb://api-center/edge-auth/function.zip" --region "$AWS_REGION"
        fi

      # PUBLISH
      - "VERSION=$(aws lambda publish-version --function-name \"$LAMBDA_NAME\" --region \"$AWS_REGION\" --query 'Version' --output text)"
      - "echo Version=$VERSION"

      # CLOUDFRONT
      - "aws cloudfront get-distribution-config --id \"$DISTRIBUTION_ID\" > cf.json"
      - "ETAG=$(jq -r '.ETag' cf.json)"
      - "jq '.DistributionConfig' cf.json > dist.json"

      - |
        LAMBDA_ARN="arn:aws:lambda:$AWS_REGION:$ACCOUNT_ID:function:$LAMBDA_NAME:$VERSION"
        jq ".DefaultCacheBehavior.LambdaFunctionAssociations = {\"Quantity\":1,\"Items\":[{\"EventType\":\"viewer-request\",\"LambdaFunctionARN\":\"$LAMBDA_ARN\"}]}" dist.json > updated.json

      - "aws cloudfront update-distribution --id \"$DISTRIBUTION_ID\" --if-match \"$ETAG\" --distribution-config file://updated.json"

      # INVALIDATE
      - "aws cloudfront create-invalidation --distribution-id \"$DISTRIBUTION_ID\" --paths \"/*\""

artifacts:
  base-directory: api-center/dist
  files:
    - '**/*'

cache:
  paths:
    - /root/.npm/**/*