version: 0.2

env:
  variables:
    NODE_ENV: "production"
    AWS_REGION: "us-east-1"

    # Frontend
    S3_BUCKET: "dev-mvx-developer-hub"

    # Lambda@Edge
    LAMBDA_NAME: "developer-hub-dev-basic-auth"
    ROLE_NAME: "developer-hub-dev-us-east-1-lambdaRole"
    DISTRIBUTION_ID: "EWGY1JYSRFKJQ"

    KEEP_LAST_N: "2"
    DRY_RUN: "false"

phases:
  install:
    runtime-versions:
      nodejs: 22

    commands:
      - echo "========================================"
      - echo "INSTALL PHASE"
      - echo "========================================"

      - echo "Node Version"
      - node --version

      - echo "NPM Version"
      - npm --version

      - apt-get update
      - apt-get install -y jq zip

  pre_build:
    commands:
      - echo "========================================"
      - echo "PRE_BUILD PHASE"
      - echo "========================================"

      - echo "Installing frontend dependencies"

      - npm --prefix api-center install --include=dev

      - echo "Installing Lambda cleanup dependency"

      - npm install @aws-sdk/client-lambda

   
  
  build:
  commands:
    - echo "========================================"
    - echo "BUILD PHASE"
    - echo "========================================"

    - echo "Current directory"
    - pwd

    - echo "Root files"
    - ls -la

    - echo "API Center files"
    - ls -la api-center

    - echo "Building frontend"
    - npm --prefix api-center run build

    # ------------------------------------
    # DEBUG DIST CONTENT
    # ------------------------------------
    - echo "========================================"
    - echo "DIST DEBUGGING"
    - echo "========================================"

    - echo "Listing api-center/dist"
    - ls -lah api-center/dist || true

    - echo "Listing api-center/dist/assets"
    - ls -lah api-center/dist/assets || true

    - echo "Recursive dist listing"
    - find api-center/dist -type f

    - echo "File sizes"
    - find api-center/dist -type f -exec ls -lh {} \;

    - echo "Index.html content"
    - cat api-center/dist/index.html

    - echo "JS file preview"
    - |
      JS_FILE=$(find api-center/dist/assets -name "*.js" | head -1)

      echo "JS_FILE=$JS_FILE"

      if [ -f "$JS_FILE" ]; then
        ls -lh "$JS_FILE"
        head -20 "$JS_FILE"
      else
        echo "NO JS FILE FOUND"
        exit 1
      fi

    - echo "CSS file preview"
    - |
      CSS_FILE=$(find api-center/dist/assets -name "*.css" | head -1)

      echo "CSS_FILE=$CSS_FILE"

      if [ -f "$CSS_FILE" ]; then
        ls -lh "$CSS_FILE"
        head -20 "$CSS_FILE"
      else
        echo "NO CSS FILE FOUND"
      fi

    - test -f api-center/dist/index.html

  post_build:
    commands:
      - echo "========================================"
      - echo "POST_BUILD PHASE"
      - echo "========================================"

      # Cleanup
      - echo "Running Lambda cleanup"

      - node ./scripts/lambda-version.cleanup.js || true

      # Validate env
      - echo "Validating environment variables"

      - echo "AWS_REGION=$AWS_REGION"
      - echo "LAMBDA_NAME=$LAMBDA_NAME"
      - echo "ROLE_NAME=$ROLE_NAME"
      - echo "DISTRIBUTION_ID=$DISTRIBUTION_ID"
      - echo "S3_BUCKET=$S3_BUCKET"

      - test -n "$AWS_REGION"
      - test -n "$LAMBDA_NAME"
      - test -n "$ROLE_NAME"
      - test -n "$DISTRIBUTION_ID"
      - test -n "$S3_BUCKET"

      # Account
      - echo "Fetching AWS account ID"

      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

      - echo "ACCOUNT_ID=$ACCOUNT_ID"

      # Upload frontend
      - echo "========================================"
      - echo "DEPLOYING FRONTEND TO S3"
      - echo "========================================"

      # Upload assets first
      - |
        aws s3 sync \
          api-center/dist/assets \
          s3://$S3_BUCKET/assets \
          --delete \
          --cache-control "no-cache,no-store,must-revalidate" \
          --content-type "text/html"

      # Upload remaining files
      - |
        aws s3 sync \
          api-center/dist \
          s3://$S3_BUCKET \
          --exclude "assets/*" \
          --cache-control "no-cache,no-store,must-revalidate"
          --content-type "text/html" \

      - echo "Uploaded frontend successfully"
      - echo "========================================"
      - echo "VERIFYING S3 CONTENT"
      - echo "========================================"

      - echo "Listing S3 root"
      - aws s3 ls s3://$S3_BUCKET/

      - echo "Listing S3 assets"
      - aws s3 ls s3://$S3_BUCKET/assets/ --recursive

      - echo "Checking uploaded JS object metadata"

      - |
        JS_OBJECT=$(aws s3 ls s3://$S3_BUCKET/assets/ --recursive | grep ".js" | head -1 | awk '{print $4}')

        echo "JS_OBJECT=$JS_OBJECT"

        aws s3api head-object \
          --bucket "$S3_BUCKET" \
          --key "$JS_OBJECT"

      - echo "Downloading uploaded JS for verification"

      - |
        aws s3 cp s3://$S3_BUCKET/$JS_OBJECT /tmp/test.js

        ls -lh /tmp/test.js

        head -20 /tmp/test.js

      # Verify upload
      - |
        aws s3 ls \
          s3://$S3_BUCKET/assets/ \
          --recursive | head -20

      # IAM role
      - echo "========================================"
      - echo "VERIFYING IAM ROLE"
      - echo "========================================"

      - |
        if aws iam get-role --role-name "$ROLE_NAME" >/dev/null 2>&1; then
          echo "IAM role already exists"
        else
          echo "Creating IAM role"

          printf '%s\n' \
          '{' \
          '  "Version": "2012-10-17",' \
          '  "Statement": [' \
          '    {' \
          '      "Effect": "Allow",' \
          '      "Principal": {' \
          '        "Service": [' \
          '          "lambda.amazonaws.com",' \
          '          "edgelambda.amazonaws.com"' \
          '        ]' \
          '      },' \
          '      "Action": "sts:AssumeRole"' \
          '    }' \
          '  ]' \
          '}' > trust.json

          aws iam create-role \
            --role-name "$ROLE_NAME" \
            --assume-role-policy-document file://trust.json

          aws iam attach-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-arn arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

          echo "Waiting for IAM propagation"

          sleep 20
        fi

      # Package Lambda
      - echo "========================================"
      - echo "PACKAGING LAMBDA"
      - echo "========================================"

      - cd api-center/edge-auth

      - rm -f function.zip

      - zip -r function.zip . >/dev/null

      - ls -lh function.zip

      - cd -

      # Deploy Lambda
      - echo "========================================"
      - echo "DEPLOYING LAMBDA"
      - echo "========================================"

      - |
        if aws lambda get-function \
          --function-name "$LAMBDA_NAME" \
          --region "$AWS_REGION" >/dev/null 2>&1; then

          echo "Updating existing Lambda"

          aws lambda update-function-code \
            --function-name "$LAMBDA_NAME" \
            --zip-file fileb://api-center/edge-auth/function.zip \
            --region "$AWS_REGION"

        else

          echo "Creating new Lambda"

          aws lambda create-function \
            --function-name "$LAMBDA_NAME" \
            --runtime nodejs18.x \
            --handler index.handler \
            --role arn:aws:iam::$ACCOUNT_ID:role/$ROLE_NAME \
            --zip-file fileb://api-center/edge-auth/function.zip \
            --region "$AWS_REGION"
        fi

      # Wait
      - echo "Waiting for Lambda update"

      - |
        aws lambda wait function-updated \
          --function-name "$LAMBDA_NAME" \
          --region "$AWS_REGION"

      - echo "Lambda update completed"

      # Publish version
      - echo "Publishing Lambda version"

      - |
        VERSION=$(aws lambda publish-version \
          --function-name "$LAMBDA_NAME" \
          --region "$AWS_REGION" \
          --query 'Version' \
          --output text)

        echo "Published Version=$VERSION"

      # Update CloudFront
      - echo "========================================"
      - echo "UPDATING CLOUDFRONT"
      - echo "========================================"

      - |
        aws cloudfront get-distribution-config \
          --id "$DISTRIBUTION_ID" > cf.json

      - ETAG=$(jq -r '.ETag' cf.json)

      - jq '.DistributionConfig' cf.json > dist.json

      - |
        LAMBDA_ARN="arn:aws:lambda:$AWS_REGION:$ACCOUNT_ID:function:$LAMBDA_NAME:$VERSION"

        echo "Using Lambda ARN: $LAMBDA_ARN"

        jq ".DefaultCacheBehavior.LambdaFunctionAssociations = {
          \"Quantity\": 1,
          \"Items\": [
            {
              \"EventType\": \"viewer-request\",
              \"LambdaFunctionARN\": \"$LAMBDA_ARN\"
            }
          ]
        }" dist.json > updated.json

      - |
        aws cloudfront update-distribution \
          --id "$DISTRIBUTION_ID" \
          --if-match "$ETAG" \
          --distribution-config file://updated.json

      # Invalidate cache
      - echo "========================================"
      - echo "INVALIDATING CACHE"
      - echo "========================================"

      - |
        aws cloudfront create-invalidation \
          --distribution-id "$DISTRIBUTION_ID" \
          -paths "/index.html" "/"

      - echo "Deployment completed successfully"

artifacts:
  base-directory: api-center/dist

  files:
    - "**/*"

cache:
  paths:
    - /root/.npm/**/*