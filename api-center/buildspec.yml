version: 0.2

env:
  variables:
    NODE_ENV: production
    AWS_REGION: us-east-1
    KEEP_LAST_N: 2
    DRY_RUN: false

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "Using Node $(node --version)"
      - echo "Using npm $(npm --version)"
      - echo "Installing jq..."
      - apt-get update && apt-get install -y jq

  pre_build:
    commands:
      - echo "Installing api-center dependencies..."
      - npm --prefix api-center install --include=dev

      - echo "Installing cleanup dependencies..."
      - npm install @aws-sdk/client-lambda

  build:
    commands:
      - echo "Building frontend (api-center)..."
      - npm --prefix api-center run build

  post_build:
    commands:
      - echo "Starting Lambda version cleanup..."
      - node ./scripts/lambda-version.cleanup.js || true
      - echo "Cleanup done"

      - |
        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        export ACCOUNT_ID

      # -----------------------------
      # 🔐 CREATE IAM ROLE
      # -----------------------------
      - |
        if aws iam get-role --role-name $ROLE_NAME >/dev/null 2>&1; then
          echo "IAM role exists"
        else
          echo "Creating IAM role..."
          TRUST='{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":["lambda.amazonaws.com","edgelambda.amazonaws.com"]},"Action":"sts:AssumeRole"}]}'
          echo "$TRUST" > trust.json

          aws iam create-role \
            --role-name $ROLE_NAME \
            --assume-role-policy-document file://trust.json

          aws iam attach-role-policy \
            --role-name $ROLE_NAME \
            --policy-arn arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

          echo "Waiting for IAM propagation..."
          sleep 10
        fi

      # -----------------------------
      # 📦 PACKAGE LAMBDA
      # -----------------------------
      - ls -la edge-auth
      - cd edge-auth
      - zip -r function.zip . >/dev/null
      - cd ..

      # -----------------------------
      # 🚀 DEPLOY LAMBDA
      # -----------------------------
      - |
        if aws lambda get-function --function-name $LAMBDA_NAME --region $AWS_REGION >/dev/null 2>&1; then
          echo "Updating Lambda..."
          aws lambda update-function-code \
            --function-name $LAMBDA_NAME \
            --zip-file fileb://edge-auth/function.zip \
            --region $AWS_REGION
        else
          echo "Creating Lambda..."
          aws lambda create-function \
            --function-name $LAMBDA_NAME \
            --runtime nodejs18.x \
            --handler index.handler \
            --role arn:aws:iam::$ACCOUNT_ID:role/$ROLE_NAME \
            --zip-file fileb://edge-auth/function.zip \
            --region $AWS_REGION
        fi

      # Publish version (MANDATORY)
      - echo "Publishing Lambda version..."

      - |
        VERSION=$(aws lambda publish-version \
          --function-name $LAMBDA_NAME \
          --region $AWS_REGION \
          --query 'Version' \
          --output text)
        echo "Lambda version: $VERSION"

      # -----------------------------
      # 🌍 UPDATE CLOUDFRONT
      # -----------------------------
      - echo "Updating CloudFront distribution..."

      - |
        aws cloudfront get-distribution-config \
          --id $DISTRIBUTION_ID > cf.json

      - export ETAG=$(jq -r '.ETag' cf.json)

      - jq '.DistributionConfig' cf.json > dist-config.json

      - |
        LAMBDA_ARN="arn:aws:lambda:$AWS_REGION:$ACCOUNT_ID:function:$LAMBDA_NAME:$VERSION"
        echo "Lambda ARN: $LAMBDA_ARN"

      - |
        jq "
        .DefaultCacheBehavior.LambdaFunctionAssociations = {
          Quantity: 1,
          Items: [{
            EventType: \"viewer-request\",
            LambdaFunctionARN: \"$LAMBDA_ARN\"
          }]
        }
        " dist-config.json > updated-config.json

      - |
        aws cloudfront update-distribution \
          --id $DISTRIBUTION_ID \
          --if-match $ETAG \
          --distribution-config file://updated-config.json

      - echo "CloudFront updated"

      # -----------------------------
      # 🔄 INVALIDATE CACHE
      # -----------------------------
      - echo "Invalidating CloudFront cache..."

      - |
        aws cloudfront create-invalidation \
          --distribution-id $DISTRIBUTION_ID \
          --paths "/*"

artifacts:
  base-directory: api-center/dist
  files:
    - '**/*'

cache:
  paths:
    - /root/.npm/**/*
