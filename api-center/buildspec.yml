version: 0.2

env:
  variables:
    VITE_S3_BUCKET_NAME: dev-mvx-developer-hub
    VITE_S3_SPECS_PREFIX: specs
    VITE_S3_FIGMA_DESIGNS_KEY: figma/designs.json

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - 'echo "Using Node $(node --version)"'
      - 'echo "Using npm $(npm --version)"'
  pre_build:
    commands:
      - |
        export DEPLOY_BUCKET="${DEPLOY_BUCKET:-${VITE_S3_BUCKET_NAME:-}}"
        if [ -z "${DEPLOY_BUCKET}" ]; then
          echo "DEPLOY_BUCKET or VITE_S3_BUCKET_NAME is required."
          exit 1
        fi
      - 'echo "Resolved deploy bucket: ${DEPLOY_BUCKET}"'
      - 'echo "Installing api-center dependencies..."'
      - npm --prefix api-center install --include=dev
  build:
    commands:
      - export NODE_ENV=production
      - 'echo "Building api-center..."'
      - npm --prefix api-center run build
  post_build:
    commands:
      - 'echo "Deploying api-center/dist/ to s3://${DEPLOY_BUCKET}"'
      - aws s3 sync api-center/dist/ "s3://${DEPLOY_BUCKET}" --delete --exclude "specs/*"
      - |
        if [ -n "${CLOUDFRONT_DISTRIBUTION_ID:-}" ]; then
          echo "Invalidating CloudFront distribution ${CLOUDFRONT_DISTRIBUTION_ID}..."
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
        else
          echo "Skipping CloudFront invalidation; CLOUDFRONT_DISTRIBUTION_ID not set."
        fi

artifacts:
  base-directory: api-center/dist
  files:
    - '**/*'

cache:
  paths:
    - /root/.npm/**/*