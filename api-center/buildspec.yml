version: 0.2

env:
  variables:
    AWS_REGION: us-east-1
    S3_BUCKET: dev-mvx-developer-hub
    CLOUDFRONT_DIST_ID: ""
    VITE_S3_BUCKET_NAME: dev-mvx-developer-hub
    VITE_S3_SPECS_PREFIX: specs
    VITE_S3_FIGMA_DESIGNS_KEY: figma/designs.json
    # CloudFront distribution for the built Developer Hub (api-center)
    VITE_CLOUDFRONT_URL: https://d28d5t5u0n3bd1.cloudfront.net

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - 'echo "Using Node $(node --version)"'
      - 'echo "Using npm $(npm --version)"'
  pre_build:
    commands:
      - |
        if [ -z "${AWS_REGION:-}" ]; then
          echo "AWS_REGION is required."
          exit 1
        fi
        if [ -z "${S3_BUCKET:-}" ]; then
          echo "S3_BUCKET is required."
          exit 1
        fi
      - 'echo "Skipping Lambda@Edge update/publish in this pipeline run."'
      - 'echo "Installing api-center dependencies..."'
      - npm --prefix api-center install --include=dev
  build:
    commands:
      - export NODE_ENV=production
      - 'echo "Building frontend (api-center)..."'
      - npm --prefix api-center run build
  post_build:
    commands:
      - 'echo "Deploying api-center/dist/ to s3://${S3_BUCKET}"'
      - 'echo "CloudFront app URL (VITE_CLOUDFRONT_URL): ${VITE_CLOUDFRONT_URL}"'
      - aws s3 sync api-center/dist/ "s3://${S3_BUCKET}" --delete --exclude "specs/*"
      - |
        if [ -n "${CLOUDFRONT_DIST_ID:-}" ]; then
          echo "Invalidating CloudFront distribution ${CLOUDFRONT_DIST_ID}..."
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DIST_ID}" \
            --paths "/*"
        else
          echo "Skipping CloudFront invalidation; CLOUDFRONT_DIST_ID not set."
        fi
      - 'echo "CloudFront Lambda association is intentionally not modified by this pipeline."'

artifacts:
  base-directory: api-center/dist
  files:
    - '**/*'

cache:
  paths:
    - /root/.npm/**/*