components:
  parameters:
    TemplateId:
      in: path
      name: templateId
      required: true
      schema:
        type: string
      example: CP-HTN-001
    VersionId:
      in: path
      name: versionId
      required: true
      schema:
        type: string
      description: Version identifier — e.g. V01 or 001 (zero-padded for correct sort order in DynamoDB SK)
      example: V01
    OrganizationId:
      in: path
      name: organizationId
      required: true
      schema:
        type: string
      description: Organization identifier — part of org template partition key `ORG_TMPL#<organizationId>#<templateId>`
      example: org-apollo-001
    EnablementId:
      in: path
      name: enablementId
      required: true
      schema:
        type: string
      description: Stable id of an org–master enablement row
      example: ENB-APOLLO-HTN-001
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            message: Validation failed
            error:
              code: VALIDATION_ERROR
              details:
                - field: description
                  message: Description must not exceed 300 characters
                - field: duration
                  message: Duration must match linked package duration
    Unauthorized:
      description: Unauthorized — missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            message: Unauthorized
            error:
              code: UNAUTHORIZED
    NotFound:
      description: Template or version not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            message: Template not found
            error:
              code: NOT_FOUND
    Conflict:
      description: |
        Conflict — possible causes:
        - Attempting to update a PUBLISHED (immutable) version
        - Duplicate template ID
        - Status transition not allowed from current state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            message: Template version is published and immutable. Clone to create a new version.
            error:
              code: IMMUTABLE_VERSION
  schemas:
    TemplateType:
      type: string
      enum:
        - CARE_PLAN
        - OKR
        - TASK
        - SYMPTOM
        - PACKAGE
    TemplateStatus:
      type: string
      enum:
        - DRAFT
        - SAVED
        - IN_REVIEW
        - PUBLISHED
        - ARCHIVED
        - DEPRECATED
      description: |
        DRAFT / SAVED = authoring (interchangeable on create; clients may send either).
        IN_REVIEW = submitted for approval.
        PUBLISHED = live, immutable.
        ARCHIVED = retired but preserved.
        DEPRECATED = superseded by newer version.
    TemplateCategory:
      type: string
      enum:
        - CHRONIC_DISEASE
        - POST_OP
        - RISK_ASSESSMENT
        - SURVEY
      example: CHRONIC_DISEASE
    Condition:
      type: string
      enum:
        - HYPERTENSION
        - DIABETES
        - ANNUAL_WELLNESS
        - CUSTOM
      description: Phase 1 supports 4 conditions. Extensible in future.
    DurationType:
      type: string
      enum:
        - DAYS_30
        - DAYS_90
        - MONTHS_6
        - YEAR_1
        - CUSTOM
        - 90D
        - 6M
      description: >
        Canonical values: `DAYS_30`, `DAYS_90`, `MONTHS_6`, `YEAR_1`, `CUSTOM`.

        Flat care-plan payloads and metadata allocation may use compact codes `90D` / `6M` (same semantics as `DAYS_90`
        / `MONTHS_6`).

        CUSTOM requires full care plan creation from scratch — Phase 1 = false.

        Duration must match linked package duration.
    ShareScope:
      type: string
      enum:
        - PLATFORM
        - ORG
        - PRIVATE
        - SHAREABLE
      description: |
        PLATFORM / ORG / PRIVATE = visibility scope on stored records.
        SHAREABLE = flat-document flag indicating the template may be shared per product rules.
    TemplateSource:
      type: string
      enum:
        - MASTER
        - ORG
      description: MASTER = platform template; ORG = organization-owned template.
    ReviewStatus:
      type: string
      enum:
        - NOT_SUBMITTED
        - IN_REVIEW
        - APPROVED
        - REJECTED
        - CHANGES_REQUESTED
      description: Workflow state on the flat template document; pairs with `reviewRequired` / `approvalWorkflowEnabled`.
    ReviewCadenceFrequency:
      type: string
      enum:
        - DAILY
        - WEEKLY
        - BIWEEKLY
        - MONTHLY
        - QUARTERLY
        - ANNUALLY
      description: How often a care plan instance should be formally reviewed when cadence is enabled.
    MetadataMode:
      type: string
      enum:
        - FIXED
        - EXPANDABLE
      description: |
        FIXED = org cannot add values beyond what is defined.
        EXPANDABLE = org can add additional values.
    DownstreamControl:
      type: string
      enum:
        - 'NO'
        - ADMIN
        - ALL
      description: |
        NO = field cannot be changed downstream.
        ADMIN = only org admin can change.
        ALL = any org role can change.
    ApiError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
    ApiSuccessEnvelope:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          nullable: true
        meta:
          type: object
          properties:
            correlationId:
              type: string
            requestId:
              type: string
    AuditEntry:
      type: object
      required:
        - action
        - performedBy
        - performedAt
      properties:
        action:
          type: string
          enum:
            - TEMPLATE_CREATED
            - TEMPLATE_UPDATED
            - TEMPLATE_SUBMITTED_FOR_REVIEW
            - TEMPLATE_PUBLISHED
            - TEMPLATE_REJECTED
            - TEMPLATE_ARCHIVED
            - TEMPLATE_DEPRECATED
            - TEMPLATE_CLONED
          example: TEMPLATE_CREATED
        performedBy:
          type: string
          example: user-uuid
        performedAt:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00Z'
        comment:
          type: string
          nullable: true
    TemplateMeta:
      type: object
      required:
        - templateId
        - templateVersionId
        - templateType
        - templateName
        - category
        - condition
        - countries
        - version
        - status
        - isMaster
        - createdBy
        - createdAt
      properties:
        templateId:
          type: string
          example: CP-HTN-001
        templateVersionId:
          type: string
          example: CP-HTN-001-V01
        templateType:
          $ref: '#/components/schemas/TemplateType'
        templateName:
          type: string
          maxLength: 150
          example: Hypertension Management Plan
        category:
          $ref: '#/components/schemas/TemplateCategory'
        condition:
          $ref: '#/components/schemas/Condition'
        countries:
          type: array
          items:
            type: string
          example:
            - IN
        states:
          type: array
          items:
            type: string
          description: Defaults to ALL for phase 1. Pulled from org address.
          example:
            - ALL
        languages:
          type: array
          items:
            type: string
          example:
            - en
        specialty:
          type: array
          items:
            type: string
            enum:
              - CARDIOLOGY
              - ENDOCRINOLOGY
              - HEMATOLOGY
              - NEPHROLOGY
              - PULMONOLOGY
              - RHEUMATOLOGY
              - FAMILY_MEDICINE
              - INTERNAL_MEDICINE
              - OBS_AND_GYN
              - SURGERY
              - DERMATOLOGY
              - PSYCHIATRY
          description: Optional. Multi-select.
          example:
            - CARDIOLOGY
            - INTERNAL_MEDICINE
        version:
          type: integer
          minimum: 1
          description: Monotonically increasing. Never reused.
          example: 1
        status:
          $ref: '#/components/schemas/TemplateStatus'
        isActive:
          type: boolean
          description: Only one version can be active per template at a time.
          example: true
        deprecatedAt:
          type: string
          format: date-time
          nullable: true
        isMaster:
          type: boolean
          example: true
        ownerOrgId:
          type: string
          nullable: true
          description: Null for master templates. Set for org templates.
        masterTemplateVersionId:
          type: string
          nullable: true
          description: Set on org templates to track which master version they were derived from.
        derivedFromTemplateVersionId:
          type: string
          nullable: true
          description: Set when cloned from another template version.
        shareScope:
          $ref: '#/components/schemas/ShareScope'
        description:
          type: string
          maxLength: 300
          description: No emoji allowed. Max 300 characters.
          example: Master template for hypertension management.
        riskLevel:
          type: string
          nullable: true
          enum:
            - LOW
            - MEDIUM
            - HIGH
            - CRITICAL
        createdBy:
          type: string
          example: user-uuid
        createdAt:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00Z'
        lastModifiedBy:
          type: string
          example: user-uuid
        lastModifiedAt:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00Z'
        publishedBy:
          type: string
          nullable: true
        publishedAt:
          type: string
          format: date-time
          nullable: true
        auditTrail:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
    MasterTemplateRecord:
      type: object
      description: |
        Full DynamoDB document. PK/SK are stored in DB but may be stripped from API responses
        depending on implementation preference.
      required:
        - PK
        - SK
        - entityType
        - meta
      properties:
        PK:
          type: string
          description: DynamoDB partition key
          example: MASTER_TMPL#CP-HTN-001
        SK:
          type: string
          description: DynamoDB sort key
          example: VERSION#001
        entityType:
          type: string
          enum:
            - MASTER_TEMPLATE
            - ORG_TEMPLATE
          example: MASTER_TEMPLATE
        schemaRef:
          type: string
          nullable: true
          description: S3 URI. Present when schema exceeds 50 KB. Null when stored inline.
          example: s3://templates/CP-HTN-001/v1.json
        schemaHash:
          type: string
          nullable: true
          description: sha256 of schema body. Verified on every read.
          example: sha256:e3b0c44...
        schemaSize:
          type: integer
          nullable: true
          description: Size in bytes. Threshold is 50000 bytes.
          example: 142000
        meta:
          $ref: '#/components/schemas/TemplateMeta'
        carePlanAttributes:
          $ref: '#/components/schemas/CarePlanAttributes'
        sharedComponents:
          $ref: '#/components/schemas/SharedComponents'
        links:
          $ref: '#/components/schemas/TemplateLinks'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/CarePlanStep'
        templateTypeConfig:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TemplateTypeConfigEntry'
    CarePlanAttributes:
      type: object
      properties:
        durationType:
          type: object
          properties:
            isMetadataDriven:
              type: boolean
            display:
              type: string
              enum:
                - MAIN
                - SETTINGS
            required:
              type: boolean
            metadataConfig:
              type: object
              properties:
                metadataType:
                  type: string
                  example: DURATION_TYPE
                selectedValues:
                  type: array
                  items:
                    $ref: '#/components/schemas/DurationType'
                  example:
                    - DAYS_30
                    - DAYS_90
                    - MONTHS_6
                    - YEAR_1
                defaultValue:
                  $ref: '#/components/schemas/DurationType'
                metadataMode:
                  $ref: '#/components/schemas/MetadataMode'
                minSelections:
                  type: integer
        customDurationAllowed:
          type: object
          properties:
            type:
              type: string
            display:
              type: string
            defaultValue:
              type: boolean
              description: Phase 1 = false. DB must support for future.
            platformFlagRequired:
              type: boolean
        maxObjectivesAllowed:
          type: object
          properties:
            type:
              type: string
            display:
              type: string
            defaultValue:
              type: integer
              example: 10
            constraints:
              type: object
              properties:
                minValue:
                  type: integer
                maxValue:
                  type: integer
    SharedComponents:
      type: object
      description: Reusable field type and common field definitions referenced by $ref in steps
      properties:
        fieldTypes:
          type: object
          additionalProperties:
            type: object
            properties:
              component:
                type: string
        commonFields:
          type: object
          properties:
            frequency:
              $ref: '#/components/schemas/FieldDefinition'
            duration:
              $ref: '#/components/schemas/FieldDefinition'
            notes:
              $ref: '#/components/schemas/FieldDefinition'
            priority:
              $ref: '#/components/schemas/FieldDefinition'
            assignedTo:
              $ref: '#/components/schemas/FieldDefinition'
            reminders:
              $ref: '#/components/schemas/FieldDefinition'
    FieldDefinition:
      type: object
      description: Generic field definition used in steps and sections
      properties:
        id:
          type: string
        label:
          type: string
        type:
          type: string
          enum:
            - text
            - number
            - select
            - multiSelect
            - date
            - toggle
            - textarea
            - radio
            - table
            - yesNo
            - scale
            - object
            - fileUpload
        display:
          type: string
          enum:
            - MAIN
            - SETTINGS
        required:
          type: boolean
        isMetadataDriven:
          type: boolean
          default: false
        metadataConfig:
          type: object
          nullable: true
          properties:
            metadataType:
              type: string
            selectedValues:
              type: array
              items:
                type: string
            defaultValue:
              type: string
              nullable: true
            metadataMode:
              $ref: '#/components/schemas/MetadataMode'
            minSelections:
              type: integer
            maxSelections:
              type: integer
              nullable: true
        constraints:
          type: object
          nullable: true
          additionalProperties: true
        downstream:
          type: object
          nullable: true
          properties:
            update:
              $ref: '#/components/schemas/DownstreamControl'
            remove:
              $ref: '#/components/schemas/DownstreamControl'
        defaultValue:
          nullable: true
        dependsOn:
          type: object
          nullable: true
          properties:
            field:
              type: string
            value: {}
        validationNote:
          type: string
          nullable: true
        dataSource:
          type: string
          nullable: true
          description: API path or constant e.g. /api/org/devices/active
        phaseSupport:
          type: string
          nullable: true
          enum:
            - PHASE_1
            - FUTURE
        fields:
          type: array
          nullable: true
          description: For type=object — nested field definitions
          items:
            $ref: '#/components/schemas/FieldDefinition'
    TemplateLinks:
      type: object
      properties:
        okrTemplate:
          type: object
          properties:
            linkType:
              type: string
              enum:
                - DIRECT
                - DERIVED
            mandatory:
              type: boolean
            linkedVersionId:
              type: string
              nullable: true
            maxAllowed:
              type: integer
              nullable: true
        taskTemplates:
          type: object
          properties:
            linkType:
              type: string
              enum:
                - DIRECT
            mandatory:
              type: boolean
            linkedVersionIds:
              type: array
              items:
                type: string
            minRequired:
              type: integer
            maxAllowed:
              type: integer
              nullable: true
            autoCreateAtActivation:
              type: boolean
            control:
              type: object
              properties:
                add:
                  $ref: '#/components/schemas/DownstreamControl'
                remove:
                  $ref: '#/components/schemas/DownstreamControl'
        symptomTemplates:
          type: object
          properties:
            linkType:
              type: string
            mandatory:
              type: boolean
            linkedVersionIds:
              type: array
              items:
                type: string
            maxQuestionsPerForm:
              type: integer
              description: Max 10 questions per symptom form
              example: 10
            control:
              type: object
              properties:
                add:
                  $ref: '#/components/schemas/DownstreamControl'
                remove:
                  $ref: '#/components/schemas/DownstreamControl'
        packageLinks:
          type: object
          required:
            - mandatory
            - durationMustMatch
          properties:
            linkType:
              type: string
              enum:
                - REQUIRED
            mandatory:
              type: boolean
              description: Care plan cannot be used without a linked package.
              example: true
            linkedPackageIds:
              type: array
              items:
                type: string
            durationMustMatch:
              type: boolean
              description: Package duration must equal care plan duration. If mismatch, no care plan shown.
              example: true
            control:
              type: object
              properties:
                add:
                  $ref: '#/components/schemas/DownstreamControl'
                remove:
                  $ref: '#/components/schemas/DownstreamControl'
        thresholdResolution:
          type: object
          properties:
            linkType:
              type: string
              enum:
                - DERIVED
            resolutionKey:
              type: string
              example: appliesToType+linkedEntityCode
    CarePlanStep:
      type: object
      required:
        - stepId
        - stepNumber
        - label
      properties:
        stepId:
          type: string
          enum:
            - plan_overview
            - medication
            - lab_diagnostics
            - rpm_and_devices
            - baseline_assessment
            - vitals_monitoring
            - okr_and_tasks
