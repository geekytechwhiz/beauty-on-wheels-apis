openapi: 3.0.3
info:
  title: Template Service — Care Plan (Master / Org / Lifecycle)
  description: >
    OpenAPI spec for **Template Service (Care Plan)** derived from:

    - `Template_service_Endpoints-2.pdf` (Confluence export — inferred URIs)

    - `Template+Service+DB+design+and++Access+Patterns.pdf` / `Template_Service_DB_design_and_Access_Patterns.doc`
    (DynamoDB single-table keys, GSIs, flat template document)

    - `template_master_corrected.json` (corrected master template document shape)

    - `template_data_9april_2.json` (original senior dev JSON — reference only)


    **DB Design:** DynamoDB single-table. Every template record carries `PK`, `SK`, and `entityType`.

    Master templates: `PK = MASTER_TMPL#<templateId>`, `SK = VERSION#<versionId>`.

    Org templates: `PK = ORG_TMPL#<orgId>#<templateId>`, `SK = VERSION#<versionId>`.

    List/filter access uses **GSI-1** (`PK = orgId`, …) and **GSI-2** (`PK = type`, `SK = publishedAt`, …) as described
    in the DB design doc.


    **Lifecycle:** Authoring may use `DRAFT` or `SAVED` (same phase); workflow then `IN_REVIEW` → `PUBLISHED`. End
    states: `ARCHIVED`, `DEPRECATED`.

    **Review** state on the flat document is carried in `reviewStatus` (orthogonal to `status` where applicable).


    **Clone path fix:** Confluence doc had typo `orgnizationId`. Corrected to `organizations/{organizationId}`.


    **Duration values:** Canonical enums include `DAYS_30`, `DAYS_90`, `MONTHS_6`, `YEAR_1`, `CUSTOM`. Flat care-plan
    documents and `metadataAllocation` may also use compact codes `90D`, `6M` (same semantics as `DAYS_90`, `MONTHS_6`).


    **Required authoring and lifecycle (canonical HTTP — these two are part of the product contract):**

    1. **`PUT /templates/org/{templateId}/versions/{versionId}`** — *Update organization template.* Body
    **`OrgTemplateUpdateRequest`**. Persists to **`ORG_TMPL#<organizationId>#<templateId>`** with
    **`VERSION#<versionId>`** (and **`META`** when merged). **`organizationId`** from **JWT / org context** unless the
    gateway documents an explicit override. Downstream field rules match **`GET
    /templates/organizations/{organizationId}/{templateId}/versions`**.

    2. **`POST /templates/{templateId}/versions/{versionId}/status`** — *Transition template status* (**DRAFT / SAVED /
    IN_REVIEW / PUBLISHED**, plus **ARCHIVED** / **DEPRECATED**). Body **`TemplateStatusTransitionRequest`**. Updates
    **`SK=META`**; **`PUBLISH`** may add an immutable **`VERSION#`**. **Master vs org** `PK` follows **caller scope**
    plus route ids (full rules under `paths` for that operation).


    Full request and response shapes, examples, and error codes live only under **`paths`** for those two operations;
    this numbered list is the **contract index** so reviewers do not rely on informal notes outside this YAML.


    **Additional access-pattern APIs (PDF / single-table):** consolidated reads — both **master** and **org** use **`GET
    .../versions`** with optional query `version`: omit → list `VERSION#*`; `version=latest` → latest snapshot;
    **`version=meta`** (org only) → `SK=META`; any other `version` → point read by id. Enablement **update and revoke**
    share **`PATCH /org-enablements/id/{enablementId}`** with body `action` (`UPDATE` \| `REVOKE`). Enablement
    **search** (`GET /org-enablements`) remains separate from `GET /org-enablements/{orgId}`.


    **API catalog (this file = Swagger source of truth):** every operation below is defined under `paths` with DynamoDB
    intent called out in each summary/description. **Rows marked (required contract)** are the org update and lifecycle
    endpoints above — they are not optional add-ons.


    | Method | Path | Primary access pattern |

    | ------ | ---- | ------------------------ |

    | POST | `/templates/master` | Create `META` + first `VERSION#` |

    | GET | `/templates/master` | **GSI-2** (type / publishedAt) + optional **GSI-1** / filters (`organizationId`,
    `templateType`, `language`, `specialty`, `templateCode`, …) |

    | GET | `/templates/master/{templateId}/meta` | `PK=MASTER_TMPL#id`, `SK=META` |

    | GET | `/templates/master/{templateId}/versions` | **Unified:** omit `version` → list `VERSION#*`; `version=latest`
    → latest snapshot; `version={id}` → point read; **PUT** same path+`versionId` updates |

    | GET/PUT | `/templates/master/{templateId}/versions/{versionId}` | **PUT only** — update `VERSION#` (+ META rules);
    GET uses query on parent `/versions` |

    | POST | `/templates/organizations/.../clone` | Write `ORG_TMPL#...` new partition |

    | GET | `/templates/organizations/{organizationId}/{templateId}/versions` | **Unified (same pattern as master):**
    omit `version` → list; `version=latest` → latest; **`version=meta`** → META row; `version={id}` → point read |

    | GET | `/templates/org` | **GSI-1** org index; optional `templateType`, `specialty`, … |

    | PUT | `/templates/org/{templateId}/versions/{versionId}` | **(required contract)** **Org update** — `UpdateItem`
    on `ORG_TMPL#<org>#<templateId>` + `VERSION#…` / `META` per rules; `organizationId` from token |

    | POST | `/templates/{templateId}/versions/{versionId}/status` | **(required contract)** **Lifecycle** —
    `SUBMIT_REVIEW` / `PUBLISH` / `REJECT` / `ARCHIVE` / `DEPRECATE`; master or org resolved from **caller scope** + ids
    |

    | POST | `/org-enablements` | Create enablement row (+ projections per design) |

    | GET | `/org-enablements` | Filter enablements (query; GSI-backed) |

    | GET | `/org-enablements/{orgId}` | List by org (**GSI-1 PK = orgId**) |

    | GET/PATCH | `/org-enablements/id/{enablementId}` | Get by id; **PATCH** with `action=UPDATE` (dates) or
    `action=REVOKE` replaces legacy DELETE |

    | GET | `/templates/compatible` | **GSI-2** published templates for linking |


    **Swagger preview:** Import this YAML into Swagger UI or Redoc — it is the **machine-readable** contract for
    clients.


    **PDF vs YAML:** The PDF cannot be auto-ingested here; if it lists extra routes, GSIs, or query keys, export it to
    text/Markdown and extend `paths` plus this catalog so Swagger stays aligned.
  version: 2.0.5
servers:
  - url: https://api.example.com/v1
    description: Replace with API Gateway base URL + stage
tags:
  - name: MasterTemplateManagement
    description: Platform-owned master templates (META row, version list, CRUD, clone)
  - name: OrgTemplateManagement
    description: >-
      Organization-scoped templates (GET organizations/.../versions with query `version` like master + `meta`;
      short-path PUT /templates/org/.../versions/...; GSI list)
  - name: Lifecycle
    description: >-
      DRAFT / SAVED / IN_REVIEW / PUBLISHED (and ARCHIVED / DEPRECATED) via POST status — applies to master or org
      template per caller scope
  - name: OrgEnablement
    description: Org–master enablements (create, search, list by org, get by id, PATCH update window or revoke)
  - name: ValidationLinking
    description: Compatible published templates for package linking
paths:
  /templates/master:
    post:
      tags:
        - MasterTemplateManagement
      summary: Create master template
      description: >
        Create a new platform-owned master care plan template using the flat **Care Plan template document**

        (`#/components/schemas/CarePlanTemplateDocument` — same keys as the JSON contract).

        The service persists header and version rows (`SK=META` and `SK=VERSION#001`); if the document exceeds 50 KB,
        `schemaRef` is returned on success.
      operationId: createMasterTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterTemplateCreateRequest'
            examples:
              cp_htn_standard_create:
                summary: Hypertension standard care plan — flat create body
                value:
                  templateCode: CP_HTN_STANDARD
                  templateName: Hypertension Standard Care Plan
                  templateDescription: Standard hypertension management care plan for chronic disease patients.
                  templateType: CARE_PLAN
                  templateSource: MASTER
                  status: DRAFT
                  category:
                    - CHRONIC_DISEASE
                  conditions:
                    - HYPERTENSION
                  countries:
                    - US
                    - IN
                  languages:
                    - EN
                  specialties:
                    - CARDIOLOGY
                    - INTERNAL_MEDICINE
                  shareScope: SHAREABLE
                  tags:
                    - HTN
                    - CARDIAC
                    - RPM
                  version: 1
                  isLatestVersion: true
                  isLatestPublishedVersion: false
                  isActiveVersion: false
                  previousVersion: null
                  latestVersion: 1
                  ownerOrgId: null
                  masterTemplateVersionId: null
                  derivedFromTemplateVersionId: null
                  reviewRequired: true
                  approvalWorkflowEnabled: true
                  reviewStatus: IN_REVIEW
                  reviewComments: null
                  effectiveStartDate: '2026-01-01T00:00:00Z'
                  effectiveEndDate: null
                  publishAt: null
                  archiveAt: null
                  metadataContext:
                    templateType: CARE_PLAN
                    categories:
                      - CHRONIC_DISEASE
                    conditions:
                      - HYPERTENSION
                    countries:
                      - US
                      - IN
                    languages:
                      - EN
                  enabledScope:
                    sections:
                      - sectionCode: CAREPLAN_OVERVIEW
                        enabled: true
                        mandatory: true
                        allowOrgAdd: false
                        allowOrgRemove: false
                        allowOrgUpdate: true
                      - sectionCode: RPM_MONITORING
                        enabled: true
                        mandatory: false
                        allowOrgAdd: true
                        allowOrgRemove: true
                        allowOrgUpdate: true
                    linkedTemplates:
                      allowOKRTemplates: true
                      allowTaskTemplates: true
                      allowSymptomTemplates: true
                      allowThresholdTemplates: true
                      allowAlertPolicyTemplates: true
                  manageability:
                    allowOrgCustomization: true
                    allowOrgMetadataExpansion: true
                    allowOrgVersioning: true
                    allowOrgPublish: true
                    allowOrgArchive: false
                    allowOrgClone: true
                    allowOrgOverrideDefaults: true
                    allowOrgAddSections: true
                    allowOrgRemoveSections: false
                    allowOrgUpdateSections: true
                    allowOrgAddFields: true
                    allowOrgRemoveFields: false
                    allowOrgUpdateFields: true
                  metadataAllocation:
                    durationTypes:
                      metadataType: DurationType
                      metadataMode: FIXED
                      selectedValues:
                        - 90D
                        - 6M
                      defaultValues:
                        - 90D
                      minSelections: 1
                      maxSelections: 1
                    devices:
                      metadataType: Device
                      metadataMode: EXPANDABLE
                      selectedValues:
                        - BP_MONITOR
                        - WEIGHT_SCALE
                      defaultValues:
                        - BP_MONITOR
                      minSelections: 1
                      maxSelections: 5
                    dataSourceTypes:
                      metadataType: DataSourceType
                      metadataMode: FIXED
                      selectedValues:
                        - DEVICE
                        - MANUAL
                      defaultValues:
                        - DEVICE
                      minSelections: 1
                      maxSelections: 2
                  carePlanConfiguration:
                    duration:
                      durationType: 90D
                      customDurationDays: null
                    reviewCadence:
                      enabled: true
                      frequency: MONTHLY
                    rpmMonitoring:
                      enabled: true
                      devices:
                        - BP_MONITOR
                        - WEIGHT_SCALE
                      dataSourceTypes:
                        - DEVICE
                        - MANUAL
                  linkedTemplates:
                    okrTemplates:
                      - templateVersionId: OKR_HTN_BP_CONTROL_V1
                        mandatory: true
                        sortOrder: 1
                    taskTemplates:
                      - templateVersionId: TASK_DAILY_BP_CHECK_V1
                        mandatory: true
                        sortOrder: 1
                    symptomTemplates:
                      - templateVersionId: SYM_HEADACHE_MONITORING_V1
                        mandatory: false
                        sortOrder: 1
                    thresholdTemplates:
                      - templateVersionId: THR_BP_CRITICAL_V1
                        mandatory: true
                        sortOrder: 1
                    alertPolicyTemplates:
                      - templateVersionId: ALT_BP_ESCALATION_POLICY_V1
                        mandatory: true
                        sortOrder: 1
                  visibilityRules:
                    orgTypes:
                      - HOSPITAL
                      - CLINIC
                    allowedCountries:
                      - US
                      - IN
                    allowedSpecialties:
                      - CARDIOLOGY
                  compliance:
                    hipaaCompliant: true
                    gdprCompliant: true
                    auditRequired: true
                    approvalRequired: true
                  searchMetadata:
                    searchKeywords:
                      - hypertension
                      - blood pressure
                      - rpm
                      - cardiology
                  auditInformation:
                    createdBy: platform-admin
                    createdAt: '2026-05-13T10:00:00Z'
                    changeReason: Initial master template creation.
                    requestId: req-123456
                    correlationId: corr-123456
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessTemplateCreated'
              example:
                success: true
                message: Master template created successfully
                data:
                  templateId: CP-HTN-001
                  templateVersionId: CP-HTN-001-V01
                  version: 1
                  status: DRAFT
                  schemaRef: s3://templates/CP-HTN-001/v1.json
                  createdAt: '2024-01-01T00:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags:
        - MasterTemplateManagement
      summary: List master templates
      description: |
        Retrieve master templates with optional filters.
        Uses **GSI-2** (`PK = type, SK = publishedAt`) for type-based queries.
        Uses **GSI-1** (`PK = orgId`) when filtering by org.
      operationId: listMasterTemplates
      parameters:
        - in: query
          name: organizationId
          required: false
          schema:
            type: string
          description: When set, scopes catalog templates visible to that org (often via **GSI-1** + enablement join semantics).
          example: org-apollo-001
        - in: query
          name: category
          schema:
            $ref: '#/components/schemas/TemplateCategory'
          example: CHRONIC_DISEASE
        - in: query
          name: condition
          schema:
            $ref: '#/components/schemas/Condition'
          example: HYPERTENSION
        - in: query
          name: country
          schema:
            type: string
          example: IN
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/TemplateStatus'
          example: PUBLISHED
        - in: query
          name: templateType
          schema:
            $ref: '#/components/schemas/TemplateType'
          description: Filter by template type (aligns with **GSI-2** partition key for type-scoped listings).
        - in: query
          name: language
          schema:
            type: string
          description: ISO-ish language tag filter (e.g. `EN`, `en`) — secondary filter on projected attributes.
          example: EN
        - in: query
          name: specialty
          schema:
            type: string
          description: Single specialty code filter (e.g. `CARDIOLOGY`).
        - in: query
          name: templateCode
          schema:
            type: string
          description: Exact or prefix match on business `templateCode` when present in index projection.
        - in: query
          name: nextToken
          schema:
            type: string
          description: Pagination token from previous response
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessMasterTemplateList'
              example:
                success: true
                message: Master templates retrieved successfully
                data:
                  items:
                    - templateId: CP-HTN-001
                      templateVersionId: CP-HTN-001-V01
                      templateName: Hypertension Management Plan
                      templateType: CARE_PLAN
                      category: CHRONIC_DISEASE
                      condition: HYPERTENSION
                      countries:
                        - IN
                      version: 1
                      status: PUBLISHED
                      isActive: true
                      publishedAt: '2024-02-01T00:00:00Z'
                  nextToken: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /templates/master/{templateId}/meta:
    get:
      tags:
        - MasterTemplateManagement
      summary: Get master template META row
      description: |
        Returns the logical **header** item for a master template (`SK=META`).
        DynamoDB: `PK = MASTER_TMPL#<templateId>`, `SK = META`.
        Prefer this for lightweight reads (current flags, pointers) without loading a full `VERSION#` snapshot body.
      operationId: getMasterTemplateMeta
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessMasterTemplateMeta'
              example:
                success: true
                message: Master template META retrieved successfully
                data:
                  PK: MASTER_TMPL#CP-HTN-001
                  SK: META
                  entityType: MASTER_TEMPLATE
                  meta:
                    templateId: CP-HTN-001
                    templateVersionId: CP-HTN-001-V02
                    templateName: Hypertension Management Plan
                    templateType: CARE_PLAN
                    category: CHRONIC_DISEASE
                    condition: HYPERTENSION
                    countries:
                      - IN
                    states:
                      - ALL
                    languages:
                      - en
                    version: 2
                    status: PUBLISHED
                    isActive: true
                    isMaster: true
                    shareScope: PLATFORM
                    publishedAt: '2024-04-01T00:00:00Z'
                    publishedBy: admin-uuid
                    createdBy: admin-uuid
                    createdAt: '2024-01-01T00:00:00Z'
                  schemaRef: s3://templates/CP-HTN-001/latest.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /templates/master/{templateId}/versions:
    get:
      tags:
        - MasterTemplateManagement
      summary: Master template versions — list, latest, or point read (query `version`)
      description: >
        **Single read endpoint** for master template version data under `PK = MASTER_TMPL#<templateId>`.


        **Query `version` (optional):**

        - **Omitted or empty** — list all `SK` beginning with `VERSION#` (paginated). Use `nextToken`, `limit`,
        `status`.

        - **`latest`** — return one full **version snapshot** (same shape as point read). Use optional `resolve`
        (`ACTIVE`, `LATEST_PUBLISHED`, `LATEST_ANY`) to choose which snapshot.

        - **Any other value** — treat as `versionId` (e.g. `V01`, `001`) for a single `GetItem` on `SK =
        VERSION#<version>`.


        Pagination filters apply only to the **list** mode.
      operationId: getMasterTemplateVersionsQuery
      parameters:
        - $ref: '#/components/parameters/TemplateId'
        - in: query
          name: version
          required: false
          schema:
            type: string
          description: >
            Omit for **list**. Use `latest` for latest/active snapshot. Otherwise pass the path-style **versionId**
            (e.g. `V01`).
          example: latest
        - in: query
          name: resolve
          required: false
          schema:
            type: string
            enum:
              - ACTIVE
              - LATEST_PUBLISHED
              - LATEST_ANY
            default: ACTIVE
          description: Only used when `version=latest`. See previous `/versions/latest` semantics.
        - in: query
          name: nextToken
          schema:
            type: string
          description: Pagination token — **list mode only** (ignored when `version` is set).
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: '**List mode only**.'
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/TemplateStatus'
          description: '**List mode only** — filter summaries by stored status.'
      responses:
        '200':
          description: |
            **List mode** — `ApiSuccessTemplateVersionSummaryList`.  
            **Latest or point-read mode** — `ApiSuccessMasterTemplateVersion`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiSuccessTemplateVersionSummaryList'
                  - $ref: '#/components/schemas/ApiSuccessMasterTemplateVersion'
              examples:
                list:
                  summary: List (no version query)
                  value:
                    success: true
                    message: Master template versions retrieved successfully
                    data:
                      items:
                        - templateId: CP-HTN-001
                          templateVersionId: CP-HTN-001-V02
                          organizationId: null
                          version: 2
                          status: PUBLISHED
                          isActive: true
                          publishedAt: '2024-04-01T00:00:00Z'
                          createdAt: '2024-04-01T00:00:00Z'
                          schemaRef: s3://templates/CP-HTN-001/v2.json
                      nextToken: null
                single:
                  summary: Point read (version=V01) or latest (version=latest)
                  value:
                    success: true
                    message: Template version retrieved successfully
                    data:
                      PK: MASTER_TMPL#CP-HTN-001
                      SK: VERSION#001
                      entityType: MASTER_TEMPLATE
                      meta:
                        templateId: CP-HTN-001
                        templateVersionId: CP-HTN-001-V01
                        templateName: Hypertension Management Plan
                        templateType: CARE_PLAN
                        category: CHRONIC_DISEASE
                        condition: HYPERTENSION
                        countries:
                          - IN
                        states:
                          - ALL
                        languages:
                          - en
                        version: 1
                        status: PUBLISHED
                        isActive: true
                        isMaster: true
                        shareScope: PLATFORM
                        publishedAt: '2024-02-01T00:00:00Z'
                        publishedBy: admin-uuid
                      schemaRef: s3://templates/CP-HTN-001/v1.json
                      schemaHash: sha256:e3b0c44...
                      schemaSize: 142000
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /templates/master/{templateId}/versions/{versionId}:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
      - $ref: '#/components/parameters/VersionId'
    put:
      tags:
        - MasterTemplateManagement
      summary: Update master template version
      description: >
        Update a master template in place.

        **Allowed only if status is `DRAFT`, `SAVED`, or `IN_REVIEW`.**

        Published versions are immutable — clone instead.

        Updates `SK=META` header row and writes a new `SK=VERSION#` snapshot row.

        Increments `version` on the META row. Does not change `versionId` until published.


        **Reads** use `GET /templates/master/{templateId}/versions` with query `version` (omit for list, `latest`, or
        this same `versionId`).
      operationId: updateMasterTemplateVersion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterTemplateUpdateRequest'
            example:
              meta:
                templateName: Hypertension Management Plan v2
                description: Updated with new BP threshold rules
                lastModifiedBy: user-uuid
                lastModifiedAt: '2024-03-01T00:00:00Z'
              steps:
                - stepId: plan_overview
                  stepNumber: 1
                  label: Plan Overview
                  isCommon: true
                  sections: []
              links:
                packageLinks:
                  mandatory: true
                  durationMustMatch: true
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessTemplateSummary'
              example:
                success: true
                message: Template updated successfully
                data:
                  templateId: CP-HTN-001
                  templateVersionId: CP-HTN-001-V01
                  version: 1
                  status: SAVED
                  schemaRef: s3://templates/CP-HTN-001/v1-updated.json
                  updatedAt: '2024-03-01T00:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /templates/organizations/{organizationId}/{templateId}/versions/{versionId}/clone:
    post:
      tags:
        - MasterTemplateManagement
      summary: Clone template version for an org
      description: |
        Clone a **published** master template into a new org-level template in `SAVED` state.
        Published versions are immutable — this is the only way to create a new editable version.
        Writes new DynamoDB rows: `PK = ORG_TMPL#<orgId>#<newTemplateId>`, `SK = VERSION#001`.
        Copies S3 schema file to new path.
      operationId: cloneTemplateVersion
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/TemplateId'
        - $ref: '#/components/parameters/VersionId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloneTemplateRequest'
            example:
              newTemplateName: Apollo Hospital – Hypertension Plan
              inheritLinks: true
      responses:
        '201':
          description: Cloned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessTemplateCreated'
              example:
                success: true
                message: Template cloned successfully
                data:
                  templateId: CP-HTN-ORG-APOLLO-001
                  templateVersionId: CP-HTN-ORG-APOLLO-001-V01
                  version: 1
                  status: SAVED
                  derivedFromTemplateVersionId: CP-HTN-001-V01
                  schemaRef: s3://templates/org-apollo/CP-HTN-ORG-APOLLO-001/v1.json
                  createdAt: '2024-03-15T00:00:00Z'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /templates/organizations/{organizationId}/{templateId}/versions:
    get:
      tags:
        - OrgTemplateManagement
      summary: Org template versions — list, latest, META, or point read (query `version`)
      description: >
        **Single read endpoint** for org template data under `PK = ORG_TMPL#<organizationId>#<templateId>` — same
        **query `version`** pattern as **`GET /templates/master/{templateId}/versions`**, plus org **`META`**.


        **Query `version` (optional):**

        - **Omitted or empty** — list all `SK` beginning with `VERSION#` (paginated). Use `nextToken`, `limit`,
        `status`.

        - **`latest`** — one full **version snapshot** (`ApiSuccessOrgTemplateVersion`). Use optional `resolve`
        (`ACTIVE`, `LATEST_PUBLISHED`, `LATEST_ANY`).

        - **`meta`** — `GetItem` **`SK=META`** (`ApiSuccessOrgTemplateMeta`). **Reserved** — not a `VERSION#` id.

        - **Any other value** — treat as `versionId` (e.g. `V01`, `001`) for `SK = VERSION#<version>`.


        Pagination filters apply only when listing (no `version` set).
      operationId: getOrgTemplateVersionsQuery
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/TemplateId'
        - in: query
          name: version
          required: false
          schema:
            type: string
          description: >
            Omit for **list**. Use `latest` for latest snapshot. Use **`meta`** for the **META** header row. Otherwise
            pass a **versionId** for a point read.
          example: latest
        - in: query
          name: resolve
          required: false
          schema:
            type: string
            enum:
              - ACTIVE
              - LATEST_PUBLISHED
              - LATEST_ANY
            default: ACTIVE
          description: Only used when `version=latest`.
        - in: query
          name: nextToken
          schema:
            type: string
          description: Pagination token — **list mode only** (ignored when `version` is set).
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: '**List mode only**.'
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/TemplateStatus'
          description: '**List mode only** — filter summaries by stored status.'
      responses:
        '200':
          description: |
            **List mode** — `ApiSuccessTemplateVersionSummaryList`.  
            **`version=meta`** — `ApiSuccessOrgTemplateMeta`.  
            **`version=latest`** or concrete version id — `ApiSuccessOrgTemplateVersion`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiSuccessTemplateVersionSummaryList'
                  - $ref: '#/components/schemas/ApiSuccessOrgTemplateMeta'
                  - $ref: '#/components/schemas/ApiSuccessOrgTemplateVersion'
              examples:
                meta:
                  summary: version=meta (META row)
                  value:
                    success: true
                    message: Org template META retrieved successfully
                    data:
                      PK: ORG_TMPL#org-apollo-001#CP-HTN-ORG-APOLLO-001
                      SK: META
                      entityType: ORG_TEMPLATE
                      meta:
                        templateId: CP-HTN-ORG-APOLLO-001
