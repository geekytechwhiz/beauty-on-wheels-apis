      type: object
      description: Partial update — only send fields that changed. meta.templateId and meta.templateVersionId are immutable.
      properties:
        meta:
          type: object
          description: Subset of TemplateMeta. templateId and templateVersionId cannot be changed.
          properties:
            templateName:
              type: string
              maxLength: 150
            description:
              type: string
              maxLength: 300
            specialty:
              type: array
              items:
                type: string
            riskLevel:
              type: string
              nullable: true
            lastModifiedBy:
              type: string
            lastModifiedAt:
              type: string
              format: date-time
        steps:
          type: array
          items:
            $ref: '#/components/schemas/CarePlanStep'
        links:
          $ref: '#/components/schemas/TemplateLinks'
        carePlanAttributes:
          $ref: '#/components/schemas/CarePlanAttributes'
        templateTypeConfig:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TemplateTypeConfigEntry'
    OrgTemplateUpdateRequest:
      type: object
      description: |
        Org template update. Each field change is validated against master `downstream` control limits.
        Fields with `downstream.update = NO` will be rejected.
      properties:
        meta:
          type: object
          properties:
            templateName:
              type: string
              maxLength: 150
            description:
              type: string
              maxLength: 300
            specialty:
              type: array
              items:
                type: string
            lastModifiedBy:
              type: string
            lastModifiedAt:
              type: string
              format: date-time
        overrides:
          type: object
          description: Org-specific overrides for field default values (e.g. careTeam, devices)
          additionalProperties: true
        steps:
          type: array
          items:
            $ref: '#/components/schemas/CarePlanStep'
        links:
          $ref: '#/components/schemas/TemplateLinks'
    CloneTemplateRequest:
      type: object
      properties:
        newTemplateName:
          type: string
          maxLength: 150
          description: Optional. If not provided, server uses source template name with org suffix.
        inheritLinks:
          type: boolean
          default: true
          description: Copy all linked template version IDs from source into the clone.
    TemplateStatusTransitionRequest:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum:
            - SUBMIT_REVIEW
            - PUBLISH
            - REJECT
            - ARCHIVE
            - DEPRECATE
          description: |
            SUBMIT_REVIEW: DRAFT or SAVED → IN_REVIEW
            PUBLISH: IN_REVIEW → PUBLISHED (creates new immutable VERSION# row)
            REJECT: IN_REVIEW → DRAFT or SAVED (no new version created)
            ARCHIVE: PUBLISHED → ARCHIVED
            DEPRECATE: PUBLISHED → DEPRECATED
        comment:
          type: string
          nullable: true
          description: Optional approval or archive comment
        reason:
          type: string
          nullable: true
          description: Required when action = REJECT
    OrgEnablementCreateRequest:
      type: object
      required:
        - organizationId
        - masterTemplateVersionId
      properties:
        organizationId:
          type: string
          example: org-apollo-001
        masterTemplateVersionId:
          type: string
          description: Must reference a PUBLISHED master template version
          example: CP-HTN-001-V01
        effectiveFrom:
          type: string
          format: date-time
          example: '2024-04-01T00:00:00Z'
        effectiveTo:
          type: string
          format: date-time
          nullable: true
    OrgEnablementUpdateRequest:
      type: object
      description: |
        **`UPDATE`** (default) — send at least one of `effectiveFrom` / `effectiveTo` to change the window.  
        **`REVOKE`** — omit dates; revokes the enablement (same intent as legacy `DELETE` on this resource).
      properties:
        action:
          type: string
          enum:
            - UPDATE
            - REVOKE
          default: UPDATE
        effectiveFrom:
          type: string
          format: date-time
          nullable: true
        effectiveTo:
          type: string
          format: date-time
          nullable: true
    TemplateMetaRow:
      type: object
      description: DynamoDB META row shape returned by META read APIs (`SK=META`).
      required:
        - PK
        - SK
        - entityType
        - meta
      properties:
        PK:
          type: string
          description: Partition key (`MASTER_TMPL#...` or `ORG_TMPL#...`)
        SK:
          type: string
          description: Sort key — always `META` for this response
          example: META
        entityType:
          type: string
          enum:
            - MASTER_TEMPLATE
            - ORG_TEMPLATE
        meta:
          $ref: '#/components/schemas/TemplateMeta'
        schemaRef:
          type: string
          nullable: true
          description: Optional pointer to latest or default large payload in S3
    TemplateVersionSummary:
      type: object
      description: One `VERSION#*` row summary (list-versions APIs).
      properties:
        templateId:
          type: string
        templateVersionId:
          type: string
        organizationId:
          type: string
          nullable: true
          description: Set for org template lists; null for master template lists
        version:
          type: integer
        status:
          $ref: '#/components/schemas/TemplateStatus'
        isActive:
          type: boolean
        publishedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        schemaRef:
          type: string
          nullable: true
    TemplateSummaryData:
      type: object
