                        languages:
                          - en
                        version: 1
                        status: IN_REVIEW
                        isActive: true
                        isMaster: false
                        ownerOrgId: org-apollo-001
                        masterTemplateVersionId: CP-HTN-001-V01
                        derivedFromTemplateVersionId: CP-HTN-001-V01
                        shareScope: ORG
                        createdBy: org-admin-uuid
                        createdAt: '2024-03-15T00:00:00Z'
                      schemaRef: s3://templates/org-apollo/CP-HTN-ORG-APOLLO-001/latest.json
                list:
