    StepSection:
      type: object
      properties:
        sectionId:
          type: string
        sectionName:
          type: string
        isMandatory:
          type: boolean
        displayOrder:
          type: integer
        fieldLayout:
          type: string
          enum:
            - default
            - table
          nullable: true
        control:
          type: object
          properties:
            add:
              $ref: '#/components/schemas/DownstreamControl'
            remove:
              $ref: '#/components/schemas/DownstreamControl'
            update:
              $ref: '#/components/schemas/DownstreamControl'
            min:
              type: integer
              nullable: true
            max:
              type: integer
              nullable: true
        fields:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/FieldDefinition'
        columns:
          type: array
          nullable: true
          description: Used when fieldLayout = table
          items:
            $ref: '#/components/schemas/FieldDefinition'
        objectiveConfig:
          type: object
          nullable: true
          description: Present only on okr_and_tasks step
          properties:
            maxObjectives:
              type: integer
              example: 10
            fields:
              type: array
              items:
                $ref: '#/components/schemas/FieldDefinition'
            keyResultConfig:
              type: object
              properties:
                minPerObjective:
                  type: integer
                  example: 1
                maxPerObjective:
                  type: integer
                  nullable: true
                fields:
                  type: array
                  items:
                    $ref: '#/components/schemas/FieldDefinition'
                taskConfig:
                  type: object
                  properties:
                    minPerKR:
                      type: integer
                      description: Each KR must have at least one task
                      example: 1
                    maxPerKR:
                      type: integer
                      nullable: true
                    fields:
                      type: array
                      items:
                        $ref: '#/components/schemas/FieldDefinition'
        formConfig:
          type: object
          nullable: true
          description: Present only on symptom_forms step
          properties:
            maxQuestionsPerForm:
              type: integer
              example: 10
            questionTypes:
              type: array
              items:
                type: string
                enum:
                  - NUMERIC
                  - YES_NO
                  - MULTI_SELECT
                  - SINGLE_SELECT
                  - SCALE_1_TO_5
                  - SCALE_1_TO_10
                  - LOW_MID_HIGH
                  - FREE_TEXT
            fields:
              type: array
              items:
                $ref: '#/components/schemas/FieldDefinition'
    TemplateTypeConfigEntry:
