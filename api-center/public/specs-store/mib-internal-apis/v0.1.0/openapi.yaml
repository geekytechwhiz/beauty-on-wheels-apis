  /templates/org/{templateId}/versions/{versionId}:
    put:
      tags:
        - OrgTemplateManagement
      summary: Update organization template
      description: >
        **Org-scoped authoring update** (short URL). Persists changes on the org template partition

        `PK = ORG_TMPL#<organizationId>#<templateId>`, `SK = VERSION#<versionId>` (and **`META`** when the
        implementation merges header fields).


        **`organizationId`** is normally inferred from the **JWT / session org context** (same convention as **`GET
        /templates/org`**). Platform or support callers may use an agreed override (e.g. optional `organizationId`
        query) only if your API gateway documents it.


        Changes are validated against the master template's control limits:

        - Fields with `downstream.update = "NO"` cannot be changed

        - Fields with `downstream.update = "ADMIN"` can only be changed by org admin

        - Fields with `downstream.update = "ALL"` can be changed by any org role


        **Allowed only if** stored status is `DRAFT`, `SAVED`, or `IN_REVIEW`. Use **`POST
        /templates/{templateId}/versions/{versionId}/status`** for workflow transitions (`SUBMIT_REVIEW`, `PUBLISH`,
        etc.).


        **Reads** use **`GET /templates/organizations/{organizationId}/{templateId}/versions`** with query `version`
        (omit for list, `latest`, **`meta`**, or a concrete version id) — same pattern as master **`GET
        /templates/master/{templateId}/versions`**.
      operationId: updateOrgTemplateVersion
      parameters:
        - $ref: '#/components/parameters/TemplateId'
        - $ref: '#/components/parameters/VersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgTemplateUpdateRequest'
            example:
              meta:
                templateName: Apollo Hospital – Hypertension Plan
                specialty:
                  - CARDIOLOGY
                description: Customised hypertension plan for Apollo Ahmedabad patients
                lastModifiedBy: org-admin-uuid
                lastModifiedAt: '2024-03-16T00:00:00Z'
              overrides:
                careTeam:
                  doctor:
                    id: DOC101
                    name: Dr Raj Sharma
                  careManager:
                    id: CM101
                    name: Anjali Patel
              steps:
                - stepId: rpm_and_devices
                  stepNumber: 3
                  label: RPM & Devices
                  isCommon: false
                  sections:
                    - sectionId: CP-HTN-ORG-APOLLO-001-V01-SEC-RPM
                      sectionName: Remote Patient Monitoring
                      isMandatory: false
                      displayOrder: 1
                      fields:
                        - id: deviceRecommended
                          label: Device Recommended
                          type: yesNo
                          defaultValue: true
                        - id: primaryDevice
                          label: Primary Device
                          type: select
                          defaultValue: BP_MONITOR
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessTemplateSummary'
              example:
                success: true
                message: Org template updated successfully
                data:
                  templateId: CP-HTN-ORG-APOLLO-001
                  templateVersionId: CP-HTN-ORG-APOLLO-001-V01
                  version: 1
                  status: SAVED
                  updatedAt: '2024-03-16T00:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /templates/{templateId}/versions/{versionId}/status:
    post:
      tags:
        - Lifecycle
      summary: Transition template status (DRAFT / SAVED / IN_REVIEW / PUBLISHED)
      description: >
        **Lifecycle API** for **DRAFT / SAVED / IN_REVIEW / PUBLISHED** (and **ARCHIVED** / **DEPRECATED**).


        **Partition resolution:** The same path serves **master** and **org** templates. The implementation selects

        `PK = MASTER_TMPL#<templateId>` vs `PK = ORG_TMPL#<organizationId>#<templateId>` from **caller scope**

        (e.g. platform admin / service role → master; org-authenticated user → that user's `organizationId`) plus route
        `templateId` and `versionId`. If your deployment splits these into two URLs instead, keep request/response
        bodies aligned with **`TemplateStatusTransitionRequest`** / **`ApiSuccessTemplateSummary`**.


        Valid flows:

        - `DRAFT` or `SAVED` → `IN_REVIEW` (action: `SUBMIT_REVIEW`)

        - `IN_REVIEW` → `PUBLISHED` (action: `PUBLISH`) — writes new `VERSION#` row, increments version

        - `IN_REVIEW` → `DRAFT` or `SAVED` (action: `REJECT`) — does NOT create new version

        - `PUBLISHED` → `ARCHIVED` (action: `ARCHIVE`)

        - `PUBLISHED` → `DEPRECATED` (action: `DEPRECATE`)


        Publishing is the only action that creates a new immutable `VERSION#` row.

        All other transitions only update the `SK=META` status field.
      operationId: transitionTemplateStatus
      parameters:
        - $ref: '#/components/parameters/TemplateId'
        - $ref: '#/components/parameters/VersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateStatusTransitionRequest'
            examples:
              submit_for_review:
                summary: Submit DRAFT or SAVED template for review
                value:
                  action: SUBMIT_REVIEW
                  comment: Ready for platform review
              publish:
                summary: Approve and publish
                value:
                  action: PUBLISH
                  comment: Approved for platform rollout
              reject:
                summary: Reject and send back to DRAFT or SAVED
                value:
                  action: REJECT
                  reason: Threshold rules incomplete. Please add critical BP alert.
              archive:
                summary: Archive a published template
                value:
                  action: ARCHIVE
                  comment: Superseded by version 2
      responses:
        '200':
          description: Status transitioned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessTemplateSummary'
              example:
                success: true
                message: Template status updated to PUBLISHED
                data:
                  templateId: CP-HTN-001
                  templateVersionId: CP-HTN-001-V02
                  version: 2
                  status: PUBLISHED
                  publishedAt: '2024-04-01T00:00:00Z'
                  publishedBy: reviewer-uuid
                  schemaRef: s3://templates/CP-HTN-001/v2.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
