version: 0.2

env:
  shell: bash
  variables:
    STAGE: 'dev'
    DEPLOYMENT_BUCKET: 'dev-mvx-alert-service-bucket'
    STACK_NAME: 'dev-alert-service'

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies..."
      - npm install --legacy-peer-deps

  pre_build:
    commands:
      - echo "Making scripts executable..."
      - chmod +x apps/alert-service/ci/*.sh

  build:
    commands:
      - echo "Starting build..."
      - apps/alert-service/ci/build.sh

  post_build:
    commands:
      - echo "Running deployment verification..."
      - apps/alert-service/ci/verify-artifacts.sh

artifacts:
  files:
    - apps/alert-service/packaged.yaml
    - apps/alert-service/.serverless/**/*
  discard-paths: no 