version: 0.2

env:
  variables:
    STAGE: 'dev'
    DEPLOYMENT_BUCKET: 'dev-mvx-alert-service-bucket'
    STACK_NAME: 'dev-alert-service'

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - npm install -g serverless@3 --force
      - npm install --legacy-peer-deps

  build:
    commands:
      - cd apps/alert-service
      - export NODE_OPTIONS="${NODE_OPTIONS:-} --max-old-space-size=4096"
      - rm -rf .serverless && npx serverless package --stage "$STAGE" --package .serverless

      # select create vs update template, then package → packaged.yaml + S3 uploads
      - |
        if [ -f .serverless/cloudformation-template-update-stack.json ]; then
          TEMPLATE=".serverless/cloudformation-template-update-stack.json"
        elif [ -f .serverless/cloudformation-template-create-stack.json ]; then
          TEMPLATE=".serverless/cloudformation-template-create-stack.json"
        else
          echo "ERROR: No CloudFormation template found in .serverless"
          ls -la .serverless || true
          exit 1
        fi
        aws cloudformation package \
          --template-file "$TEMPLATE" \
          --s3-bucket "$DEPLOYMENT_BUCKET" \
          --output-template-file packaged.yaml \
          --force-upload

      - echo "🔍 S3Key entries in packaged.yaml:"
      - grep 'S3Key:' packaged.yaml | awk '{print $2}'

      - echo "🔑 Verifying each baked-in key exists:"
      - |
        grep 'S3Key:' packaged.yaml | awk '{print $2}' \
          | while read key; do
              printf " → %-80s " "$key"
              if aws s3api head-object --bucket "$DEPLOYMENT_BUCKET" --key "$key" >/dev/null 2>&1; then
                echo "FOUND"
              else
                echo "MISSING!"
              fi
            done

      - echo "➤ Pushing any missing function ZIPs into their exact S3Key paths…"
      - |
        grep 'S3Key:' packaged.yaml \
          | awk '{print $2}' \
          | while read key; do
              name=$(basename "$key")
              echo "Uploading .serverless/$name → s3://$DEPLOYMENT_BUCKET/$key"
              aws s3 cp ".serverless/$name" "s3://$DEPLOYMENT_BUCKET/$key"
            done

      - echo "➤ Verifying upload…"
      - aws s3 ls "s3://$DEPLOYMENT_BUCKET/$(dirname $(grep 'S3Key:' packaged.yaml | head -1 | awk '{print $2}'))/" --recursive

  post_build:
    commands:
      - echo "✅ Build done, artifacts ready in packaged.yaml"

artifacts:
  files:
    - apps/alert-service/packaged.yaml
  discard-paths: no

cache:
  paths:
    - node_modules/**/*
