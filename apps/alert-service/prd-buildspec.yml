version: 0.2
# Split pipeline: build uploads Lambda zips to DEPLOYMENT_BUCKET and emits packaged.yaml.
# Deploy must (1) use the artifact template at apps/alert-service/packaged.yaml (see artifacts.files),
# (2) use the same AWS account and region as this build so S3 keys in the template resolve.
# Deploy CodeBuild: set ALERT_DEPLOY_GUARD_ONLY=true to run only the S3 head-object guard (before CF deploy).
# Optional: PACKAGED_TEMPLATE (default apps/alert-service/packaged.yaml, relative to CODEBUILD_SRC_DIR).

env:
  shell: bash
  variables:
    STAGE: 'prd'
    DEPLOYMENT_BUCKET: 'prd-mvx-alert-service-bucket'
    STACK_NAME: 'prd-alert-service' 
    NPM_TOKEN: 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

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "=== npm registry debug (pre-install) ==="
      - pwd
      - ls -la
      - ls -la .npmrc || echo "WARN no .npmrc in $(pwd)"
      - cat .npmrc || true
      - cat ~/.npmrc 2>/dev/null || echo "no ~/.npmrc"
      - npm config list
      - npm config get registry
      - npm config get @myvitalrx:registry || true
      - echo "NPM_TOKEN set=${NPM_TOKEN:+yes}"
      - echo "Installing dependencies..."
      - npm install --legacy-peer-deps

  pre_build:
    commands:
      - echo "Making scripts executable..."
      - chmod +x apps/alert-service/ci/*.sh

  build:
    commands:
      - echo "Starting build..."
      - apps/alert-service/ci/build.sh

  post_build:
    commands:
      - echo "Running deployment verification..."
      - apps/alert-service/ci/verify-artifacts.sh

artifacts:
  files:
    - apps/alert-service/packaged.yaml
    - apps/alert-service/.serverless/**/*
  discard-paths: no 