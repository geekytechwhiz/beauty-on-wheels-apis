service: alert-service

# Serverless 3.x JSON schema may lag new runtimes; AWS still accepts them (same pattern as user-service).
configValidationMode: warn
frameworkVersion: '3.x'

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-auto-swagger
  - serverless-offline

provider:
  name: aws
  runtime: nodejs22.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  deploymentBucket:
    name: ${self:provider.stage}-mvx-alert-service-bucket
    serverSideEncryption: AES256
  memorySize: 512
  timeout: 30

  # tracing:
  #   lambda: true
  #   apiGateway: true

  # logRetentionInDays: 14

  environment:
    REGION: ${self:provider.region}
    STAGE: ${self:provider.stage}
    NODE_ENV: ${self:provider.stage}
    SERVICE_NAME: ${self:service}
    ALERT_TABLE: !Ref AlertDynamoTable
    ALERT_INGEST_QUEUE_URL: !Ref AlertIngestQueue
    ALERT_PROCESSING_DLQ_URL: !Ref AlertProcessingDLQ
    # After this many receives on the intake queue, failed messages go to Processing DLQ (not Intake DLQ).
    ALERT_FORWARD_TO_PROCESSING_DLQ_AFTER_RECEIVES: ${env:ALERT_FORWARD_TO_PROCESSING_DLQ_AFTER_RECEIVES, '5'}
    ALERT_EVENT_BUS_NAME: !Ref AlertServiceEventBus
    ALERT_EVENT_BUS_ARN: !GetAtt AlertServiceEventBus.Arn
    LOG_LEVEL: ${self:custom.logLevel.${self:provider.stage}, 'info'}
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
    ERROR_MESSAGES_CDN_URL: https://d2p9v61861q1ox.cloudfront.net
    # Same base URLs as sso-integration `custom.stageUrls` (optional; use env to override per deploy).
    # Patient/org existence checks call user-service `GET .../user/organization/{org}/{userId}` and
    # organization-service `GET .../organization/{organizationId}`.
    USER_SERVICE_BASE_URL: ${env:USER_SERVICE_BASE_URL, self:custom.stageUrls.${self:provider.stage}.USER_SERVICE_BASE_URL}
    ORGANIZATION_SERVICE_BASE_URL: ${env:ORGANIZATION_SERVICE_BASE_URL, self:custom.stageUrls.${self:provider.stage}.ORGANIZATION_SERVICE_BASE_URL}
    USER_SERVICE_TIMEOUT_MS: ${env:USER_SERVICE_TIMEOUT_MS, '8000'}
    ORGANIZATION_SERVICE_TIMEOUT_MS: ${env:ORGANIZATION_SERVICE_TIMEOUT_MS, '8000'}

  tags:
    Service: ${self:service}
    Stage: ${self:provider.stage}
    ManagedBy: serverless

  iamRoleStatements:
    # CloudWatch Logs (explicit; matches sso-integration pattern; Lambdas also get basic execution via AWS)
    - Effect: Allow
      Action:
        - logs:CreateLogGroup
        - logs:CreateLogStream
        - logs:PutLogEvents
      Resource: '*'

    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:Query
        - dynamodb:BatchGetItem
        - dynamodb:TransactWriteItems
        - dynamodb:DescribeTable
      Resource:
        - !GetAtt AlertDynamoTable.Arn
        - !Sub '${AlertDynamoTable.Arn}/index/*'
    - Effect: Allow
      Action:
        - sqs:ReceiveMessage
        - sqs:DeleteMessage
        - sqs:GetQueueAttributes
        - sqs:ChangeMessageVisibility
        - sqs:GetQueueUrl
      Resource:
        - !GetAtt AlertIngestQueue.Arn
        - !GetAtt AlertIngestDLQ.Arn
        - !GetAtt AlertProcessingDLQ.Arn
    - Effect: Allow
      Action:
        - sqs:SendMessage
        - sqs:GetQueueAttributes
      Resource:
        - !GetAtt AlertIngestQueue.Arn
        - !GetAtt AlertProcessingDLQ.Arn
    - Effect: Allow
      Action:
        - events:PutEvents
      Resource:
        - !GetAtt AlertServiceEventBus.Arn
    - Effect: Allow
      Action:
        - xray:PutTraceSegments
        - xray:PutTelemetryRecords
      Resource: '*'

package:
  individually: true
  patterns:
    - '!**/*.test.ts'
    - '!**/*.spec.ts'

custom:
  # Per-stage API bases (aligned with services/sso-integration/serverless.yml custom.stageUrls)
  stageUrls:
    dev:
      USER_SERVICE_BASE_URL: 'https://e5gv0qum80.execute-api.us-east-1.amazonaws.com/dev'
      ORGANIZATION_SERVICE_BASE_URL: 'https://9qe3rgipg3.execute-api.us-east-1.amazonaws.com/dev'
    stg:
      USER_SERVICE_BASE_URL: 'https://z79yqfg5n5.execute-api.us-east-1.amazonaws.com/stg'
      ORGANIZATION_SERVICE_BASE_URL: 'https://sqxxye6yl4.execute-api.us-east-1.amazonaws.com/stg'
    prd:
      USER_SERVICE_BASE_URL: 'https://jtoofsw556.execute-api.us-east-1.amazonaws.com/prd'
      ORGANIZATION_SERVICE_BASE_URL: 'https://3i3mbzftx9.execute-api.us-east-1.amazonaws.com/prd'
  logLevel:
    dev: debug
    stg: info
    prd: warn
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    format: cjs
    tsconfig: ../../tsconfig.base.json
    external:
      - aws-sdk
    keepNames: true
    concurrency: 8
    zipConcurrency: 8
    plugins: esbuild-plugins.js
    resolveExtensions:
      - '.ts'
      - '.tsx'
      - '.js'
      - '.jsx'
      - '.json'

  autoswagger:
    title: Alert Service API
    description: Patient-centric alerts, org queue, user queue, idempotent create, async SQS ingest (direct)
    version: 1.0.0
    apiType: http
    basePath: /${self:provider.stage}
    schemes:
      - https
      - http
    host: ${self:custom.apiHost, ''}
    generateSwaggerOnDeploy: true
    swaggerFiles:
      - swagger.json
    useStage: true
    swaggerPath: swagger
    excludeStages:
      - prd

functions:
  health:
    handler: src/handlers/http/health.main
    events:
      - http:
          path: /health
          method: get
          cors: true

  createAlert:
    handler: src/handlers/http/createAlert.main
    events:
      - http:
          path: /alerts
          method: post
          cors: true

  getAlert:
    handler: src/handlers/http/getAlert.main
    events:
      - http:
          path: /alerts/{alertId}
          method: get
          cors: true

  listPatientAlerts:
    handler: src/handlers/http/listPatientAlerts.main
    events:
      - http:
          path: /patients/{patientId}/alerts
          method: get
          cors: true

  listOrgAlerts:
    handler: src/handlers/http/listOrgAlerts.main
    events:
      - http:
          path: /organizations/{organizationId}/alerts
          method: get
          cors: true

  listUserAlerts:
    handler: src/handlers/http/listUserAlerts.main
    events:
      - http:
          path: /users/{userId}/alerts
          method: get
          cors: true

  patchAlert:
    handler: src/handlers/http/patchAlert.main
    events:
      - http:
          path: /alerts/{alertId}
          method: patch
          cors: true

  # Ingest queue → validate payload / idempotency / Dynamo (same path as HTTP POST /alerts)
  processAlertProcessing:
    handler: src/handlers/sqs/processAlertProcessing.main
    timeout: 60
    events:
      - sqs:
          arn: !GetAtt AlertIngestQueue.Arn
          batchSize: 10
          functionResponseType: ReportBatchItemFailures

  replayIntakeFromDlq:
    handler: src/handlers/sqs/replayIntakeFromDlq.main
    timeout: 60
    reservedConcurrency: 2
    events:
      - sqs:
          arn: !GetAtt AlertIngestDLQ.Arn
          batchSize: 5
          functionResponseType: ReportBatchItemFailures

  replayProcessingFromDlq:
    handler: src/handlers/sqs/replayProcessingFromDlq.main
    timeout: 60
    reservedConcurrency: 2
    events:
      - sqs:
          arn: !GetAtt AlertProcessingDLQ.Arn
          batchSize: 5
          functionResponseType: ReportBatchItemFailures

resources:
  Resources:
    AlertDynamoTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: alert-service-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
          - AttributeName: gsi1pk
            AttributeType: S
          - AttributeName: gsi1sk
            AttributeType: S
          - AttributeName: gsi2pk
            AttributeType: S
          - AttributeName: gsi2sk
            AttributeType: S
          - AttributeName: gsi3pk
            AttributeType: S
          - AttributeName: gsi3sk
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: gsi1pk
                KeyType: HASH
              - AttributeName: gsi1sk
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: GSI2
            KeySchema:
              - AttributeName: gsi2pk
                KeyType: HASH
              - AttributeName: gsi2sk
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: GSI3
            KeySchema:
              - AttributeName: gsi3pk
                KeyType: HASH
              - AttributeName: gsi3sk
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    AlertIngestDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: alert-service-ingest-dlq-${self:provider.stage}
        VisibilityTimeout: 360
        MessageRetentionPeriod: 1209600
        SqsManagedSseEnabled: true
        Tags:
          - Key: Service
            Value: ${self:service}
          - Key: Stage
            Value: ${self:provider.stage}
          - Key: ManagedBy
            Value: serverless

    # Application-level DLQ: processing Lambda forwards poison / exhausted retries here; replay sends back to ingest.
    AlertProcessingDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: alert-service-processing-dlq-${self:provider.stage}
        VisibilityTimeout: 360
        MessageRetentionPeriod: 1209600
        SqsManagedSseEnabled: true
        Tags:
          - Key: Service
            Value: ${self:service}
          - Key: Stage
            Value: ${self:provider.stage}
          - Key: ManagedBy
            Value: serverless

    AlertIngestQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: alert-service-ingest-${self:provider.stage}
        VisibilityTimeout: 360
        ReceiveMessageWaitTimeSeconds: 20
        MessageRetentionPeriod: 1209600
        SqsManagedSseEnabled: true
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt AlertIngestDLQ.Arn
          maxReceiveCount: 5
        Tags:
          - Key: Service
            Value: ${self:service}
          - Key: Stage
            Value: ${self:provider.stage}
          - Key: ManagedBy
            Value: serverless

    # Allow user-service (and other same-account Lambdas) to publish alert payloads to intake
    AlertIngestQueuePolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref AlertIngestQueue
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Sid: AllowUserServiceLambdaSendMessage
              Effect: Allow
              Principal:
                AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
              Action:
                - sqs:SendMessage
                - sqs:GetQueueAttributes
              Resource: !GetAtt AlertIngestQueue.Arn
              Condition:
                ArnLike:
                  aws:PrincipalArn: !Sub 'arn:aws:sts::${AWS::AccountId}:assumed-role/user-service-${self:provider.stage}-*/*'
            - Sid: AllowSsoIntegrationLambdaSendMessage
              Effect: Allow
              Principal:
                AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
              Action:
                - sqs:SendMessage
                - sqs:GetQueueAttributes
              Resource: !GetAtt AlertIngestQueue.Arn
              Condition:
                ArnLike:
                  aws:PrincipalArn: !Sub 'arn:aws:sts::${AWS::AccountId}:assumed-role/sso-integration-${self:provider.stage}-*/*'

    AlertServiceEventBus:
      Type: AWS::Events::EventBus
      Properties:
        Name: alert-service-bus-${self:provider.stage}
        Tags:
          - Key: Service
            Value: ${self:service}
          - Key: Stage
            Value: ${self:provider.stage}
          - Key: ManagedBy
            Value: serverless

  Outputs:
    AlertIngestQueueUrl:
      Description: URL of the alert intake SQS queue (async producers)
      Value: !Ref AlertIngestQueue
      Export:
        Name: ${self:provider.stage}-alert-service-IngestQueueUrl
    AlertIngestQueueArn:
      Description: ARN of the alert intake SQS queue
      Value: !GetAtt AlertIngestQueue.Arn
      Export:
        Name: ${self:provider.stage}-alert-service-IngestQueueArn

    AlertServiceEventBusArn:
      Description: ARN of the alert service custom event bus
      Value: !GetAtt AlertServiceEventBus.Arn
      Export:
        Name: ${self:provider.stage}-alert-service-EventBusArn
    AlertServiceEventBusName:
      Description: Name of the alert service custom event bus
      Value: !Ref AlertServiceEventBus
      Export:
        Name: ${self:provider.stage}-alert-service-EventBusName

    AlertDynamoTableName:
      Description: Name of the main alert DynamoDB table
      Value: !Ref AlertDynamoTable
      Export:
        Name: ${self:provider.stage}-alert-service-AlertDynamoTableName
    AlertDynamoTableArn:
      Description: ARN of the main alert DynamoDB table
      Value: !GetAtt AlertDynamoTable.Arn
      Export:
        Name: ${self:provider.stage}-alert-service-AlertDynamoTableArn
    AlertIngestDLQArn:
      Description: ARN of the alert intake dead-letter queue
      Value: !GetAtt AlertIngestDLQ.Arn
      Export:
        Name: ${self:provider.stage}-alert-service-IngestDLQArn
    AlertProcessingDLQUrl:
      Description: URL of the alert processing dead-letter queue
      Value: !Ref AlertProcessingDLQ
      Export:
        Name: ${self:provider.stage}-alert-service-ProcessingDLQUrl
    AlertProcessingDLQArn:
      Description: ARN of the alert processing dead-letter queue
      Value: !GetAtt AlertProcessingDLQ.Arn
      Export:
        Name: ${self:provider.stage}-alert-service-ProcessingDLQArn
