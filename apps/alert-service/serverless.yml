service: alert-service

# Serverless 3.40 JSON schema may lag new Lambda runtimes (e.g. nodejs22.x); AWS still accepts them.
configValidationMode: warn

frameworkVersion: '3.x'

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-auto-swagger
  - serverless-offline

provider:
  name: aws
  runtime: nodejs22.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  deploymentBucket:
    name: ${self:provider.stage}-mvx-alert-service-bucket
    serverSideEncryption: AES256
  memorySize: 512
  timeout: 30

  tracing:
    lambda: true
    apiGateway: true

  logRetentionInDays: 14
  
  environment:
    REGION: ${self:provider.region}
    STAGE: ${self:provider.stage}
    NODE_ENV: ${self:provider.stage}
    SERVICE_NAME: ${self:service}
    # Table must exist before deploy; name from custom.alertDynamoTableName.
    ALERT_TABLE: ${self:custom.alertDynamoTableName}
    LOG_LEVEL: ${self:custom.logLevel.${self:provider.stage}, 'info'}
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
    ERROR_MESSAGES_CDN_URL: https://d2p9v61861q1ox.cloudfront.net
    # Same base URLs as services/sso-integration `custom.stageUrls`.
    USER_SERVICE_BASE_URL: ${self:custom.stageUrls.${self:provider.stage}.USER_SERVICE_BASE_URL}
    ORGANIZATION_SERVICE_BASE_URL: ${self:custom.stageUrls.${self:provider.stage}.ORGANIZATION_SERVICE_BASE_URL}
    USER_SERVICE_TIMEOUT_MS: '8000'
    ORGANIZATION_SERVICE_TIMEOUT_MS: '8000'
    ALERT_EVENT_BUS_NAME: ${self:custom.eventBusName}
    ALERT_EVENTS_TOPIC_ARN: ${env:ALERT_EVENTS_TOPIC_ARN, ''}
    DLQ_QUEUE_URL: !Ref AlertCreateConsumerDLQ
    EVENT_DLQ_QUEUE_URL: !Ref AlertCreateConsumerDLQ
    FILE_BUCKET: dev-mvx-developer-hub

  tags:
    Service: ${self:service}
    Stage: ${self:provider.stage}
    ManagedBy: serverless

  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:Query
        - dynamodb:BatchGetItem
        - dynamodb:TransactWriteItems
        - dynamodb:DescribeTable
      Resource:
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:custom.alertDynamoTableName}
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:custom.alertDynamoTableName}/index/*

    - Effect: Allow
      Action:
        - sqs:SendMessage
        - sqs:GetQueueAttributes
      Resource:
        - !GetAtt AlertCreateConsumerDLQ.Arn
        - !GetAtt RealtimeAggregationQueue.Arn

    - Effect: Allow
      Action:
        - sqs:ReceiveMessage
        - sqs:DeleteMessage
        - sqs:GetQueueAttributes
        - sqs:ChangeMessageVisibility
      Resource:
        - !GetAtt RealtimeAggregationQueue.Arn
        - !GetAtt RealtimeAggregationDLQ.Arn

    - Effect: Allow
      Action:
        - dynamodb:Query
      Resource:
        - Fn::Sub:
            - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RealtimeTableName}
            - RealtimeTableName:
                Fn::ImportValue: ${self:provider.stage}-chat-service-RealtimeConnectionsTableName
        - Fn::Sub:
            - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RealtimeTableName}/index/*
            - RealtimeTableName:
                Fn::ImportValue: ${self:provider.stage}-chat-service-RealtimeConnectionsTableName

    - Effect: Allow
      Action:
        - execute-api:ManageConnections
      Resource:
        - !Join
          - ''
          - - 'arn:aws:execute-api:'
            - ${self:provider.region}
            - ':'
            - ${aws:accountId}
            - ':'
            - Fn::ImportValue: ${self:provider.stage}-chat-service-WebSocketApiId
            - '/'
            - ${self:provider.stage}
            - '/POST/@connections/*'

    # Outbound domain events (EventBridgeAdapter → PutEvents on this stack's bus)
    - Effect: Allow
      Action:
        - events:PutEvents
      Resource:
        - arn:aws:events:${self:provider.region}:${aws:accountId}:event-bus/${self:custom.eventBusName}

    # X-Ray
    - Effect: Allow
      Action:
        - xray:PutTraceSegments
        - xray:PutTelemetryRecords
      Resource: '*'

package:
  individually: true
  patterns:
    - '!**/*.test.ts'
    - '!**/*.spec.ts'

custom:
  # Same CORS + authorizer event shape as user-service (cors before authorizer on each http event).
  # YAML anchor: JSON schema expects a real object for `http.cors`, not `cors: ${...}` (seen as string).
  cors: &httpApiCors
    origin: ${env:CORS_ORIGIN, '*'}
    headers:
      - Content-Type
      - X-Amz-Date
      - Authorization
      - X-Api-Key
      - X-Correlation-Id
      - X-Request-Id
      - X-Requested-With
      - Sec-Ch-Ua
      - Sec-Ch-Ua-Mobile
      - Sec-Ch-Ua-Platform

  alertDynamoTableName: alert-service-${self:provider.stage}

  # Inbound EventBridge bus owned by alert-service. Upstream producers PutEvents here;
  # bus name + ARN are exported for cross-stack ImportValue.
  eventBusName: alert-service-bus-${self:provider.stage}

  # Generic create-alert ingest: one envelope detail-type (`CreateAlert.v1`); payload carries
  # `inputType` + `sourceType`. Extend EventBridge sources as new producers are onboarded.
  alertCreateIngest:
    eventBridgeDetailType: CreateAlert.v1
    sources:
      - alert-service
      - monitoring-service
      - device-monitoring
      - device-workflow
      - symptom-engine
      - engagement-service

  # Disable sourcemaps for staging/prod to reduce memory in CI (avoids esbuild "The service was stopped: write EPIPE")
  sourcemapsByStage:
    dev: true
    stg: false
    prd: false

  esbuild:
    bundle: true
    minify: false
    sourcemap: ${self:custom.sourcemapsByStage.${self:provider.stage}, false}
    target: node22
    platform: node
    format: cjs
    tsconfig: ../../tsconfig.base.json
    external:
      - aws-sdk
    keepNames: true
    # Limit concurrent bundles to avoid OOM/EPIPE in CodeBuild (serverless-esbuild + esbuild docs)
    concurrency: 8
    zipConcurrency: 8
    # Resolve NX workspace dependencies (@api-hub/* packages)
    plugins: esbuild-plugins.js
    # Ensure proper module resolution
    resolveExtensions:
      - '.ts'
      - '.tsx'
      - '.js'
      - '.jsx'
      - '.mjs'
      - '.json'

  autoswagger:
    title: Alert Service API
    description: Operational alert HTTP API (create, get, list, workflow, assignment). Swagger 2 merge file for serverless-auto-swagger.
    version: 1.0.0
    apiType: http
    basePath: /${self:provider.stage}
    schemes:
      - https
      - http
    host: ${self:custom.apiHost, ''}
    generateSwaggerOnDeploy: true
    swaggerFiles:
      - swagger.json
    useStage: true
    swaggerPath: swagger
    excludeStages:
      - production
      

  logLevel:
    dev: debug
    stg: info
    prd: warn

  dotenv:
    logging: false

  serverless-offline:
    httpPort: 3000
    noPrependStageInUrl: true

  # Per-stage API bases (aligned with services/sso-integration/serverless.yml custom.stageUrls)
  stageUrls:
    dev:
      USER_SERVICE_BASE_URL: 'https://e5gv0qum80.execute-api.us-east-1.amazonaws.com/dev'
      ORGANIZATION_SERVICE_BASE_URL: 'https://9qe3rgipg3.execute-api.us-east-1.amazonaws.com/dev'
    stg:
      USER_SERVICE_BASE_URL: 'https://z79yqfg5n5.execute-api.us-east-1.amazonaws.com/stg'
      ORGANIZATION_SERVICE_BASE_URL: 'https://sqxxye6yl4.execute-api.us-east-1.amazonaws.com/stg'
    prd:
      USER_SERVICE_BASE_URL: 'https://jtoofsw556.execute-api.us-east-1.amazonaws.com/prd'
      ORGANIZATION_SERVICE_BASE_URL: 'https://3i3mbzftx9.execute-api.us-east-1.amazonaws.com/prd'

# REST + CORS; secured routes: cors block first, then shared token authorizer (same as user-service).
functions:
  health:
    handler: src/handlers/http/health.main
    events:
      - http:
          path: /health
          method: get
          cors: true
  getUploadUrl:
    handler: src/handlers/http/getUploadUrl.handler
    events:
      - http:
          path: upload-url
          method: post
          cors: true
          bodyType: UploadUrlRequest
          summary: Get upload URL for a file
          description: Get an upload URL for a file
          responses:
            "200": OK
            "400": Bad request
            "401": Unauthorized
            "403": Forbidden
            "500": Server error

  # Postman → publish CreateAlert.v1 to alert bus (dev manual test; no authorizer).
  testPublishCreateAlertIngest:
    handler: src/handlers/http/testPublishCreateAlertIngest.main
    events:
      - http:
          path: dev/events/ingest/create-alert
          method: post
          cors: true

  createAlert:
    handler: src/handlers/http/createAlert.main
    events:
      - http:
          path: alerts
          method: post
          # serverless-auto-swagger: body shows in Swagger UI as #/definitions/CreateAlertRequest
          bodyType: CreateAlertRequest
          summary: Create alert
          description: Requires `inputEventId` (client/UI idempotency key), `inputType`, `sourceType`, `patientId`, `triggerTimestamp`, and `evidencePayload`. Organization scope is taken from the JWT only, not the body.
          cors: *httpApiCors
             # authorizer:
          #   name: common_authorizer
          #   type: token
          #   identitySource: method.request.header.Authorization
          #   arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
          #   resultTtlInSeconds: 0
          responses:
            "200": OK — AlertDetail in envelope (new alert or same-org idempotent replay on inputEventId)
            "400": Bad request
            "401": Unauthorized
            "403": Forbidden
            "409": Conflict (e.g. IDEMPOTENCY_KEY_IN_USE for different org)
            "422": Validation or business rule error
            "500": Server error

  listAlerts:
    handler: src/handlers/http/listAlerts.main
    events:
      - http:
          path: alerts
          method: get
          summary: List alerts (Team, My, or Patient)
          description: >
            Use query `queue=TEAM` (default), `MY`, or `PATIENT`. For `queue=PATIENT`, `patientId` is required.
            For `TEAM` or `MY`, do not send `patientId` (patient timeline uses `queue=PATIENT` only).
            Organization scope from JWT; results are restricted to that org.
          queryStringParameters:
            queue:
              required: false
              type: string
              description: TEAM (default), MY, or PATIENT
            patientId:
              required: false
              type: string
              description: Required when queue=PATIENT; omit for TEAM and MY
            state:
              required: false
              type: string
              description: Filter by alert workflow/UI state — UNASSIGNED, ASSIGNED, IN_PROGRESS, WAITING, RESOLVED, DISMISSED
            priority:
              required: false
              type: string
            inputType:
              required: false
              type: string
            assignment:
              required: false
              type: string
              description: Assignee user id to filter by (persisted assignedToUserId — same id as workflow ASSIGN)
            dateFrom:
              required: false
              type: string
            dateTo:
              required: false
              type: string
            search:
              required: false
              type: string
            pageSize:
              required: false
              type: integer
            nextToken:
              required: false
              type: string
          cors: *httpApiCors
          # authorizer:
          #   name: common_authorizer
          #   type: token
          #   identitySource: method.request.header.Authorization
          #   arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
          #   resultTtlInSeconds: 0
          responses:
            "200": OK
            "400": Bad request
            "401": Unauthorized
            "403": Forbidden
            "500": Server error

  getAlertMetadata:
    handler: src/handlers/http/getAlertMetadata.main
    events:
      - http:
          path: alerts/metadata
          method: get
          summary: Alert UI metadata (workaround)
          description: >
            Static lists for priorities, workflow statuses, resolve reasons, and dismiss reasons until a metadata
            registry is available. Organization scope from JWT; response is the same for all tenants.
          cors: *httpApiCors
             # authorizer:
          #   name: common_authorizer
          #   type: token
          #   identitySource: method.request.header.Authorization
          #   arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
          #   resultTtlInSeconds: 0
          responses:
            "200": OK
            "401": Unauthorized
            "403": Forbidden
            "500": Server error

  getAlert:
    handler: src/handlers/http/getAlert.main
    events:
      - http:
          path: alerts/{alertId}
          method: get
          summary: Get alert by id
          description: Alert detail for the authenticated organization (tenant from JWT only).
          cors: *httpApiCors
             # authorizer:
          #   name: common_authorizer
          #   type: token
          #   identitySource: method.request.header.Authorization
          #   arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
          #   resultTtlInSeconds: 0
          responses:
            "200": OK
            "401": Unauthorized
            "403": Forbidden
            "404": Not found
            "500": Server error

  updateAlertWorkflow:
    handler: src/handlers/http/updateAlertWorkflow.main
    events:
      - http:
          path: alerts/workflow
          method: post
          summary: Apply alert workflow command
          description: >
            Command-style workflow for one alert. Body requires `action` (START_WORK, WAIT, RESUME, RESOLVE, DISMISS,
            or aliases ASSIGN, MOVE_TO_WAITING, RESUME_WORK). RESOLVE/DISMISS require `reasonCode`; when reasonCode is
            OTHER, `comment` or `closureComment` is required. ASSIGN requires `assignedToUserId`. Organization from JWT only.
          cors: *httpApiCors
             # authorizer:
          #   name: common_authorizer
          #   type: token
          #   identitySource: method.request.header.Authorization
          #   arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
          #   resultTtlInSeconds: 0
          responses:
            "200": OK — updated alert detail in envelope `data`
            "400": Bad request (e.g. missing path context)
            "401": Unauthorized
            "403": Forbidden
            "404": Alert not found

  updateAlertAssignment:
    handler: src/handlers/http/updateAlertAssignment.main
    events:
      - http:
          path: alerts/assignment
          method: post
          summary: Apply alert assignment action
          description: >
            Assignment actions for one or many alerts. Body requires `alertIds` and `action` (ASSIGN, REASSIGN, UNASSIGN, ASSIGN_TO_SELF).
            ASSIGN/REASSIGN require `assignToUserId`. ASSIGN_TO_SELF derives assignee from JWT. **All-or-nothing**: if any alert fails,
            none are updated. Organization from JWT only.
          cors: *httpApiCors
             # authorizer:
          #   name: common_authorizer
          #   type: token
          #   identitySource: method.request.header.Authorization
          #   arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
          #   resultTtlInSeconds: 0
          responses:
            "200": OK — updated alert detail for single-select, or `{ alertIds }` for multi-select
            "401": Unauthorized
            "403": Forbidden
            "404": Alert not found
            "409": Not allowed from terminal state
            "422": Validation error

  updateAlertPriority:
    handler: src/handlers/http/updateAlertPriority.main
    events:
      - http:
          path: alerts/priority
          method: patch
          summary: Update alert priority
          description: >
            Priority update for one or many alerts. Body requires `alertIds` and `priority` (P0..P3).
            **All-or-nothing**: if any alert fails, none are updated. Organization from JWT only.
          cors: *httpApiCors
             # authorizer:
          #   name: common_authorizer
          #   type: token
          #   identitySource: method.request.header.Authorization
          #   arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
          #   resultTtlInSeconds: 0
          responses:
            "200": OK — updated alert detail for single-select, or `{ alertIds }` for multi-select
            "401": Unauthorized
            "403": Forbidden
            "404": Alert not found
            "422": Validation error
  addAlertNote:
    handler: src/handlers/http/addAlertNote.main
    events:
      - http:
          path: alerts/{alertId}/notes
          method: post
          summary: Add an operational note
          description: Add a note to the alert activity timeline. Organization comes from JWT.
          bodyType: NoteRequest
          cors: *httpApiCors
             # authorizer:
          #   name: common_authorizer
          #   type: token
          #   identitySource: method.request.header.Authorization
          #   arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
          #   resultTtlInSeconds: 0
          responses:
            "201": Created (NOTE_ADDED activity)
            "400": Bad request
            "401": Unauthorized
            "403": Forbidden
            "404": Not found
            "409": Illegal state transition (ILLEGAL_TRANSITION)
            "422": Validation (body, reason codes, OTHER without comment, MISSING_REASON_CODE)
            "500": Server error

  getAlertActivity:
    handler: src/handlers/http/getAlertActivity.main
    events:
      - http:
          path: alerts/{alertId}/activity
          method: get
          summary: Get alert activity timeline
          description: >
            Activity / audit list for the alert (newest first; no pagination). Tenant from JWT only. Optional query
            Optional query `notesOnly=true` or `false` (`true` = NOTE_ADDED only). 404 when alert not found for org.
          cors: *httpApiCors
             # authorizer:
          #   name: common_authorizer
          #   type: token
          #   identitySource: method.request.header.Authorization
          #   arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
          #   resultTtlInSeconds: 0
          responses:
            "200": OK
            "401": Unauthorized
            "403": Forbidden
            "404": Not found
            "500": Server error

  # ──────────────────────────────────────────────────────────────────────────────
  # EventBridge consumers — generic alert create ingest (CreateAlert.v1 envelope).
  # Trigger kind is in payload.inputType (e.g. THRESHOLD_BREACH, MISSED_READING).
  # ──────────────────────────────────────────────────────────────────────────────
  onCreateAlert:
    # No hyphens/extra dots in filename — Lambda parses handler as file.export (see createAlert.main).
    handler: src/handlers/events/consumer/event-bridge/createAlertConsumer.main
    environment:
      REALTIME_AGGREGATION_QUEUE_URL:
        Ref: RealtimeAggregationQueue
      ALERT_REALTIME_ENABLED: ${env:ALERT_REALTIME_ENABLED, 'true'}
    maximumRetryAttempts: 2
    destinations:
      onFailure:
        type: sqs
        arn:
          Fn::GetAtt:
            - AlertCreateConsumerDLQ
            - Arn
    events:
      - eventBridge:
          eventBus:
            Fn::GetAtt:
              - AlertServiceBus
              - Arn
          pattern:
            source: ${self:custom.alertCreateIngest.sources}
            detail-type:
              - ${self:custom.alertCreateIngest.eventBridgeDetailType}

  # Logs outbound events from alert-service (e.g. Alert.Created.v1 after ingest).
  testEchoOutboundEvents:
    handler: src/handlers/events/testEchoOutboundEvents.main
    events:
      - eventBridge:
          eventBus:
            Fn::GetAtt:
              - AlertServiceBus
              - Arn
          pattern:
            source:
              - alert-service
            detail-type:
              - Alert.Created.v1
              - Alert.AssignmentChanged.v1
              - Alert.StateChanged.v1
              - Alert.Resolved.v1
              - Alert.Dismissed.v1
              - Alert.PriorityChanged.v1
              - Alert.NoteAdded.v1
  realtimeAggregation:
    handler: src/handlers/realtime/realtime-aggregation.main
    timeout: 30
    memorySize: 512

    environment:
      REALTIME_CONNECTIONS_TABLE:
        Fn::ImportValue: ${self:provider.stage}-chat-service-RealtimeConnectionsTableName
      REALTIME_SOCKET_ENABLED: ${env:REALTIME_SOCKET_ENABLED, 'true'}
      EVENT_DLQ_QUEUE_URL:
        Ref: RealtimeAggregationDLQ
      DLQ_QUEUE_URL:
        Ref: RealtimeAggregationDLQ
      WEBSOCKET_API_ENDPOINT:
        Fn::ImportValue: ${self:provider.stage}-chat-service-WebSocketApiEndpoint

    events:
      - sqs:
          arn:
            Fn::GetAtt:
              - RealtimeAggregationQueue
              - Arn

          batchSize: 20
          maximumBatchingWindow: 2
          functionResponseType: ReportBatchItemFailures
resources:
  Resources:
    GatewayResponseUnauthorized:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseType: UNAUTHORIZED
        StatusCode: '401'
        ResponseParameters:
          gatewayresponse.header.X-Content-Type-Options: "'nosniff'"
          gatewayresponse.header.X-XSS-Protection: "'1'"
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.X-Frame-Options: "'DENY'"
        ResponseTemplates:
          application/json: "{\"success\":false,\"message\":$context.error.messageString,\"errorCode\":\"INVALID_TOKEN\",\"statusCode\":401}"

    AlertCreateConsumerDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:provider.stage}-${self:service}-create-alert-dlq
        MessageRetentionPeriod: 1209600
        Tags:
          - Key: Service
            Value: ${self:service}
          - Key: Stage
            Value: ${self:provider.stage}
          - Key: Purpose
            Value: DLQ

    # EventBridge bus that all upstream alert-trigger producers publish to.
    AlertServiceBus:
      Type: AWS::Events::EventBus
      Properties:
        Name: ${self:custom.eventBusName}
        Tags:
          - Key: Service
            Value: ${self:service}
          - Key: Stage
            Value: ${self:provider.stage}
          - Key: ManagedBy
            Value: serverless

    # Explicit Lambda ← EventBridge permissions (required when using a custom bus name).
    # Rule names: <service>-<stage>-<functionName>-rule-1
    OnCreateAlertInvokePermission:
      Type: AWS::Lambda::Permission
      Properties:
        Action: lambda:InvokeFunction
        FunctionName: !GetAtt OnCreateAlertLambdaFunction.Arn
        Principal: events.amazonaws.com
        SourceAccount: ${aws:accountId}
        SourceArn: arn:aws:events:${self:provider.region}:${aws:accountId}:rule/${self:custom.eventBusName}/${self:service}-${self:provider.stage}-onCreateAlert-rule-1

    TestEchoOutboundEventsInvokePermission:
      Type: AWS::Lambda::Permission
      Properties:
        Action: lambda:InvokeFunction
        FunctionName: !GetAtt TestEchoOutboundEventsLambdaFunction.Arn
        Principal: events.amazonaws.com
        SourceAccount: ${aws:accountId}
        SourceArn: arn:aws:events:${self:provider.region}:${aws:accountId}:rule/${self:custom.eventBusName}/${self:service}-${self:provider.stage}-testEchoOutboundEvents-rule-1

    RealtimeAggregationDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:provider.stage}-${self:service}-realtime-aggregation-dlq
        MessageRetentionPeriod: 1209600


    RealtimeAggregationQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:provider.stage}-${self:service}-realtime-aggregation

        VisibilityTimeout: 180

        ReceiveMessageWaitTimeSeconds: 20

        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt:
              - RealtimeAggregationDLQ
              - Arn

          maxReceiveCount: 3


    # OnThresholdBreachInvokePermission:
    #   Type: AWS::Lambda::Permission
    #   Properties:
    #     Action: lambda:InvokeFunction
    #     FunctionName: !GetAtt OnThresholdBreachLambdaFunction.Arn
    #     Principal: events.amazonaws.com
    #     SourceAccount: ${aws:accountId}
    #     SourceArn: arn:aws:events:${self:provider.region}:${aws:accountId}:rule/${self:custom.eventBusName}/${self:service}-${self:provider.stage}-onThresholdBreach-rule-1

    # OnMissedReadingInvokePermission:
    #   Type: AWS::Lambda::Permission
    #   Properties:
    #     Action: lambda:InvokeFunction
    #     FunctionName: !GetAtt OnMissedReadingLambdaFunction.Arn
    #     Principal: events.amazonaws.com
    #     SourceAccount: ${aws:accountId}
    #     SourceArn: arn:aws:events:${self:provider.region}:${aws:accountId}:rule/${self:custom.eventBusName}/${self:service}-${self:provider.stage}-onMissedReading-rule-1

    # OnMissingDeviceInvokePermission:
    #   Type: AWS::Lambda::Permission
    #   Properties:
