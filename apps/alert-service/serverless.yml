service: alert-service

# Serverless 3.x JSON schema may lag new runtimes; AWS still accepts them (same pattern as user-service).
configValidationMode: warn
frameworkVersion: '3.x'

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-auto-swagger
  - serverless-offline

provider:
  name: aws
  runtime: nodejs22.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  deploymentBucket:
    name: ${self:provider.stage}-mvx-alert-service-bucket
    serverSideEncryption: AES256
  memorySize: 512
  timeout: 30

  # tracing:
  #   lambda: true
  #   apiGateway: true

  # logRetentionInDays: 14

  environment:
    REGION: ${self:provider.region}
    STAGE: ${self:provider.stage}
    NODE_ENV: ${self:provider.stage}
    SERVICE_NAME: ${self:service}
    # Table must exist before deploy; name from custom.alertDynamoTableName.
    ALERT_TABLE: ${self:custom.alertDynamoTableName}
    # Optional async ingest (SQS): add ALERT_INGEST_QUEUE_URL, ALERT_PROCESSING_DLQ_URL,
    # ALERT_FORWARD_TO_PROCESSING_DLQ_AFTER_RECEIVES when queues are defined in resources.
    # Optional EventBridge: add ALERT_EVENT_BUS_NAME, ALERT_EVENT_BUS_ARN when AWS::Events::EventBus is in resources.
    LOG_LEVEL: ${self:custom.logLevel.${self:provider.stage}, 'info'}
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
    ERROR_MESSAGES_CDN_URL: https://d2p9v61861q1ox.cloudfront.net
    # Same base URLs as sso-integration `custom.stageUrls`.
    # Patient/org existence checks call user-service `GET .../user/organization/{org}/{userId}` and
    # organization-service `GET .../organization/{organizationId}`.
    USER_SERVICE_BASE_URL: ${self:custom.stageUrls.${self:provider.stage}.USER_SERVICE_BASE_URL}
    ORGANIZATION_SERVICE_BASE_URL: ${self:custom.stageUrls.${self:provider.stage}.ORGANIZATION_SERVICE_BASE_URL}
    USER_SERVICE_TIMEOUT_MS: '8000'
    ORGANIZATION_SERVICE_TIMEOUT_MS: '8000'

  tags:
    Service: ${self:service}
    Stage: ${self:provider.stage}
    ManagedBy: serverless

  iamRoleStatements:
    # CloudWatch Logs (explicit; matches sso-integration pattern; Lambdas also get basic execution via AWS)
    - Effect: Allow
      Action:
        - logs:CreateLogGroup
        - logs:CreateLogStream
        - logs:PutLogEvents
      Resource: '*'

    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:Query
        - dynamodb:BatchGetItem
        - dynamodb:TransactWriteItems
        - dynamodb:DescribeTable
      Resource:
        - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${self:custom.alertDynamoTableName}'
        - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${self:custom.alertDynamoTableName}/index/*'
    # Optional: grant sqs:ReceiveMessage/DeleteMessage/SendMessage on ingest + DLQs when SQS is enabled.
    # Optional: grant events:PutEvents on custom bus ARN when EventBridge is enabled.
    - Effect: Allow
      Action:
        - xray:PutTraceSegments
        - xray:PutTelemetryRecords
      Resource: '*'

package:
  individually: true
  patterns:
    - '!**/*.test.ts'
    - '!**/*.spec.ts'

custom:
  alertDynamoTableName: alert-service-${self:provider.stage}
  # Per-stage API bases (aligned with services/sso-integration/serverless.yml custom.stageUrls)
  stageUrls:
    dev:
      USER_SERVICE_BASE_URL: 'https://e5gv0qum80.execute-api.us-east-1.amazonaws.com/dev'
      ORGANIZATION_SERVICE_BASE_URL: 'https://9qe3rgipg3.execute-api.us-east-1.amazonaws.com/dev'
    stg:
      USER_SERVICE_BASE_URL: 'https://z79yqfg5n5.execute-api.us-east-1.amazonaws.com/stg'
      ORGANIZATION_SERVICE_BASE_URL: 'https://sqxxye6yl4.execute-api.us-east-1.amazonaws.com/stg'
    prd:
      USER_SERVICE_BASE_URL: 'https://jtoofsw556.execute-api.us-east-1.amazonaws.com/prd'
      ORGANIZATION_SERVICE_BASE_URL: 'https://3i3mbzftx9.execute-api.us-east-1.amazonaws.com/prd'
  logLevel:
    dev: debug
    stg: info
    prd: warn
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    format: cjs
    tsconfig: ../../tsconfig.base.json
    external:
      - aws-sdk
    keepNames: true
    concurrency: 8
    zipConcurrency: 8
    plugins: esbuild-plugins.js
    resolveExtensions:
      - '.ts'
      - '.tsx'
      - '.js'
      - '.jsx'
      - '.json'

  autoswagger:
    title: Alert Service API
    description: Patient-centric alerts, org queue, user queue, idempotent create (HTTP); optional SQS ingest via comments in serverless.yml
    version: 1.0.0
    apiType: http
    basePath: /${self:provider.stage}
    schemes:
      - https
      - http
    host: ${self:custom.apiHost, ''}
    generateSwaggerOnDeploy: true
    swaggerFiles:
      - swagger.json
    useStage: true
    swaggerPath: swagger
    excludeStages:
      - prd

functions:
  health:
    handler: src/handlers/http/health.main
    events:
      - http:
          path: /health
          method: get
          cors: true

  createAlert:
    handler: src/handlers/http/createAlert.main
    events:
      - http:
          path: /alerts
          method: post
          cors: true

  getAlert:
    handler: src/handlers/http/getAlert.main
    events:
      - http:
          path: /alerts/{alertId}
          method: get
          cors: true

  listPatientAlerts:
    handler: src/handlers/http/listPatientAlerts.main
    events:
      - http:
          path: /patients/{patientId}/alerts
          method: get
          cors: true

  listOrgAlerts:
    handler: src/handlers/http/listOrgAlerts.main
    events:
      - http:
          path: /organizations/{organizationId}/alerts
          method: get
          cors: true

  listUserAlerts:
    handler: src/handlers/http/listUserAlerts.main
    events:
      - http:
          path: /users/{userId}/alerts
          method: get
          cors: true

  patchAlert:
    handler: src/handlers/http/patchAlert.main
    events:
      - http:
          path: /alerts/{alertId}
          method: patch
          cors: true

  # --- Optional SQS (disabled): ingest queue, intake + processing DLQs, replay Lambdas, queue policy, outputs ---
  # processAlertProcessing: handler src/handlers/sqs/processAlertProcessing.main; sqs: AlertIngestQueue; batch 10; ReportBatchItemFailures
  # replayIntakeFromDlq: handler src/handlers/sqs/replayIntakeFromDlq.main; sqs: AlertIngestDLQ
  # replayProcessingFromDlq: handler src/handlers/sqs/replayProcessingFromDlq.main; sqs: AlertProcessingDLQ
  # Env: ALERT_INGEST_QUEUE_URL, ALERT_PROCESSING_DLQ_URL, ALERT_FORWARD_TO_PROCESSING_DLQ_AFTER_RECEIVES
  # Resources: AlertIngestDLQ, AlertProcessingDLQ, AlertIngestQueue (redrive to ingest DLQ), AlertIngestQueuePolicy
  #
  # --- Optional EventBridge (disabled): custom bus + exports for cross-stack consumers ---
  # Resources.AlertServiceEventBus: Type AWS::Events::EventBus, Name alert-service-bus-${stage}
  # provider.environment: ALERT_EVENT_BUS_NAME: !Ref AlertServiceEventBus, ALERT_EVENT_BUS_ARN: !GetAtt AlertServiceEventBus.Arn
  # iamRoleStatements: events:PutEvents on !GetAtt AlertServiceEventBus.Arn
  # Outputs: Export ${stage}-alert-service-EventBusArn, ${stage}-alert-service-EventBusName
