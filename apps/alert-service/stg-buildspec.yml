version: 0.2
# Split pipeline: build uploads Lambda zips to DEPLOYMENT_BUCKET and emits packaged.yaml.
# Deploy must (1) use the artifact template at apps/alert-service/packaged.yaml (see artifacts.files),
# (2) use the same AWS account and region as this build so S3 keys in the template resolve.
# Deploy CodeBuild: set ALERT_DEPLOY_GUARD_ONLY=true to run only the S3 head-object guard (before CF deploy).
# Optional: PACKAGED_TEMPLATE (default apps/alert-service/packaged.yaml, relative to CODEBUILD_SRC_DIR).

env:
  variables:
    STAGE: 'stg'
    DEPLOYMENT_BUCKET: 'stg-mvx-alert-service-bucket'
    STACK_NAME: 'stg-alert-service'

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - |
        if [ "${ALERT_DEPLOY_GUARD_ONLY:-}" = "true" ]; then
          echo "ALERT_DEPLOY_GUARD_ONLY=true: skipping Serverless/npm install"
        else
          npm install -g serverless@3 --force
          npm install --legacy-peer-deps
        fi

  build:
    commands:
      - |
        set -e
        if [ "${ALERT_DEPLOY_GUARD_ONLY:-}" = "true" ]; then
          set -euo pipefail
          TEMPLATE="${PACKAGED_TEMPLATE:-apps/alert-service/packaged.yaml}"
          if [ "${TEMPLATE#/}" != "$TEMPLATE" ]; then
            TEMPLATE_ABS="$TEMPLATE"
          else
            TEMPLATE_ABS="$CODEBUILD_SRC_DIR/$TEMPLATE"
          fi
          if [ ! -f "$TEMPLATE_ABS" ]; then
            echo "ERROR: Template not found: $TEMPLATE_ABS"
            echo "Set PACKAGED_TEMPLATE (repo-relative under CODEBUILD_SRC_DIR, or absolute path)."
            find "$CODEBUILD_SRC_DIR" -name packaged.yaml 2>/dev/null | head -30 || true
            exit 1
          fi
          echo "Using template: $TEMPLATE_ABS"
          BUCKET=$(grep 'S3Bucket:' "$TEMPLATE_ABS" | awk '{print $2}' | tr -d "'\"" | awk 'NF' | head -1)
          if [ -z "$BUCKET" ]; then
            echo "ERROR: Could not parse S3Bucket from $TEMPLATE_ABS"
            exit 1
          fi
          BUCKET_COUNT=$(grep 'S3Bucket:' "$TEMPLATE_ABS" | awk '{print $2}' | tr -d "'\"" | awk 'NF' | sort -u | wc -l | tr -d ' ')
          if [ "$BUCKET_COUNT" != "1" ]; then
            echo "WARN: Multiple distinct S3Bucket values ($BUCKET_COUNT); using first bucket only: $BUCKET"
          fi
          echo "Verifying Lambda artifacts under s3://$BUCKET/ ..."
          grep 'S3Key:' "$TEMPLATE_ABS" | awk '{print $2}' | awk 'NF' | tr -d "'\"" | sort -u > /tmp/alert-s3keys.txt
          if [ ! -s /tmp/alert-s3keys.txt ]; then
            echo "ERROR: No S3Key entries in $TEMPLATE_ABS"
            exit 1
          fi
          missing=0
          while read -r key; do
            [ -z "$key" ] && continue
            if aws s3api head-object --bucket "$BUCKET" --key "$key" >/dev/null 2>&1; then
              echo "FOUND s3://$BUCKET/$key"
            else
              echo "MISSING s3://$BUCKET/$key"
              missing=1
            fi
          done < /tmp/alert-s3keys.txt
          if [ "$missing" -ne 0 ]; then
            echo "ERROR: Deploy blocked — objects missing (wrong account/region, wrong artifact template, or build did not upload)."
            exit 1
          fi
          echo "OK: All referenced Lambda packages exist. Proceed with cloudformation deploy using $TEMPLATE_ABS"
          exit 0
        fi

        cd "$CODEBUILD_SRC_DIR/apps/alert-service"
        export NODE_OPTIONS="${NODE_OPTIONS:-} --max-old-space-size=4096"
        rm -rf .serverless && npx serverless package --stage "$STAGE" --package .serverless

        if [ -f .serverless/cloudformation-template-update-stack.json ]; then
          TEMPLATE=".serverless/cloudformation-template-update-stack.json"
        elif [ -f .serverless/cloudformation-template-create-stack.json ]; then
          TEMPLATE=".serverless/cloudformation-template-create-stack.json"
        else
          echo "ERROR: No CloudFormation template found in .serverless"
          ls -la .serverless || true
          exit 1
        fi

        aws cloudformation package \
          --template-file "$TEMPLATE" \
          --s3-bucket "$DEPLOYMENT_BUCKET" \
          --output-template-file packaged.yaml \
          --force-upload

        echo "🔍 S3Key entries in packaged.yaml:"
        grep 'S3Key:' packaged.yaml | awk '{print $2}' | awk 'NF' || true
        grep 'S3Key:' packaged.yaml | awk '{print $2}' | awk 'NF' | sort -u > .serverless/s3keys.txt
        if [ ! -s .serverless/s3keys.txt ]; then
          echo "ERROR: No S3Key entries found in packaged.yaml; Lambda artifacts would not be uploaded."
          exit 1
        fi

        echo "🔑 Verifying each baked-in key exists:"
        while read -r key; do
          [ -z "$key" ] && continue
          printf " → %-80s " "$key"
          if aws s3api head-object --bucket "$DEPLOYMENT_BUCKET" --key "$key" >/dev/null 2>&1; then
            echo "FOUND"
          else
            echo "MISSING!"
          fi
        done < .serverless/s3keys.txt

        echo "➤ Pushing any missing function ZIPs into their exact S3Key paths…"
        while read -r key; do
          [ -z "$key" ] && continue
          name=$(basename "$key")
          if [ -f ".serverless/$name" ]; then
            echo "Uploading .serverless/$name → s3://$DEPLOYMENT_BUCKET/$key"
            aws s3 cp ".serverless/$name" "s3://$DEPLOYMENT_BUCKET/$key"
          else
            echo "ERROR: local artifact missing (.serverless/$name), cannot upload $key"
            exit 1
          fi
        done < .serverless/s3keys.txt

        echo "➤ Verifying upload…"
        missing=0
        while read -r key; do
          [ -z "$key" ] && continue
          printf " → %-80s " "$key"
          if aws s3api head-object --bucket "$DEPLOYMENT_BUCKET" --key "$key" >/dev/null 2>&1; then
            echo "FOUND"
          else
            echo "MISSING!"
            missing=1
          fi
        done < .serverless/s3keys.txt
        if [ "$missing" -ne 0 ]; then
          echo "ERROR: One or more Lambda artifacts are missing in s3://$DEPLOYMENT_BUCKET."
          exit 1
        fi

  post_build:
    commands:
      - |
        set -e
        if [ "${ALERT_DEPLOY_GUARD_ONLY:-}" = "true" ]; then
          echo "Deploy guard-only job complete (skipping post_build artifact sync)."
          exit 0
        fi
        mkdir -p "$CODEBUILD_SRC_DIR/apps/alert-service"
        cd "$CODEBUILD_SRC_DIR/apps/alert-service"
        DEST="$CODEBUILD_SRC_DIR/apps/alert-service/packaged.yaml"
        if [ -f packaged.yaml ] && [ ! packaged.yaml -ef "$DEST" ] 2>/dev/null; then
          cp packaged.yaml "$DEST"
        fi
        ARTIFACT_FILE="$CODEBUILD_SRC_DIR/apps/alert-service/packaged.yaml"
        if [ ! -f "$ARTIFACT_FILE" ]; then
          echo "ERROR: Artifact file not found at $ARTIFACT_FILE (CODEBUILD_SRC_DIR=$CODEBUILD_SRC_DIR)"
          ls -la "$CODEBUILD_SRC_DIR" "$CODEBUILD_SRC_DIR/apps" 2>/dev/null || true
          exit 1
        fi
        echo "✅ Artifact verified: $ARTIFACT_FILE"
        echo "✅ Build done, artifacts ready for CodePipeline (apps/alert-service/packaged.yaml)"

artifacts:
  files:
    - apps/alert-service/packaged.yaml
  discard-paths: no

cache:
  paths:
    - node_modules/**/*
