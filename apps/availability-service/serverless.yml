service: availability-service

frameworkVersion: "3"

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-auto-swagger
  - serverless-offline
  - serverless-openapi-documenter

provider:
  name: aws
  runtime: nodejs22.x
  stage: ${opt:stage,'dev'}
  region: ${opt:region,'us-east-1'}
  versionFunctions: false
  environment:
    CORS_ALLOWED_ORIGINS: ${self:custom.corsAllowedOrigins}
    SERVICE_NAME: availability-service
    LOG_LEVEL: INFO
    DYNAMODB_TABLE_NAME: availability-table-${self:provider.stage}
    SLOT_HOLD_TTL_SECONDS: "600"
    EXPIRY_LOOKBACK_HOURS: "48"
    EVENT_BUS_NAME:
      Fn::ImportValue: nv${self:provider.stage}-bw-vendor-event-bus-name
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:BatchGetItem
            - dynamodb:BatchWriteItem
            - dynamodb:TransactWriteItems
            - dynamodb:TransactGetItems
            - dynamodb:DescribeTable
          Resource:
            - !GetAtt AvailabilityTable.Arn
            - !Join ["/", [!GetAtt AvailabilityTable.Arn, "index", "*"]]
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource:
            - arn:aws:logs:${aws:region}:${aws:accountId}:*
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource:
            - !GetAtt AvailabilityBookingReadinessStreamDlq.Arn
        - Effect: Allow
          Action:
            - events:PutEvents
          Resource:
            - Fn::Sub:
                - arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/${BusName}
                - BusName:
                    Fn::ImportValue: nv${self:provider.stage}-bw-vendor-event-bus-name
        - Effect: Allow
          Action:
            - xray:PutTraceSegments
            - xray:PutTelemetryRecords
          Resource: "*"

custom:
  resourcePrefix: nv${self:provider.stage}-bw
  httpCors: ${file(../../infra/serverless/config/rest-api-cors.yml)}
  corsAllowedOrigins: ${file(../../infra/serverless/config/cors-allowed-origins.yml):value}
  securedAuthorizer: ${file(../../infra/serverless/config/http-api-authorizer.yml)}
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    concurrency: 10
    plugins: ./esbuild-plugins.js
  autoswagger:
    title: "Beauty on Wheels - Availability Service API"
    apiType: http
    basePath: /${self:provider.stage}
    schemes:
      - https
      - http
    generateSwaggerOnDeploy: true
    swaggerFiles:
      - swagger.json
    useStage: true
    swaggerPath: swagger
    typefiles:
      - ./src/types/api-types.d.ts
    excludeStages:
      - production
  documentation:
    version: "1.0.0"
    title: "Beauty on Wheels - Availability Service API"
    description: "Manage vendor schedules, slots, holidays, and slot holidays."
    securitySchemes:
      bearerAuth:
        type: http
        scheme: bearer
        bearerFormat: JWT
    security:
      - bearerAuth: []
    servers:
      - url: https://{apiId}.execute-api.us-east-1.amazonaws.com/{stage}
        description: Deployed API Gateway stage
        variables:
          apiId:
            default: localhost
            description: API Gateway id
          stage:
            default: dev
            description: Deployment stage
    tags:
      - name: Holds
        description: Temporary slot holds
      - name: Slots
        description: Generated bookable slots
      - name: Holidays
        description: Vendor holiday dates
      - name: Availability
        description: Weekly working hours
    models:
      - name: Slot
        description: Bookable slot
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                vendorId:
                  type: string
                date:
                  type: string
                  format: date
                startTime:
                  type: string
                endTime:
                  type: string
                capacity:
                  type: integer
                available:
                  type: integer
                status:
                  type: string
                  enum:
                    - available
                    - full
                    - blocked
      - name: SlotPage
        description: Page of slots
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      vendorId:
                        type: string
                      date:
                        type: string
                        format: date
                      startTime:
                        type: string
                      endTime:
                        type: string
                      capacity:
                        type: integer
                      available:
                        type: integer
                      status:
                        type: string
                        enum:
                          - available
                          - full
                          - blocked
      - name: SlotHold
        description: Temporary hold on a slot
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                vendorId:
                  type: string
                slotId:
                  type: string
      - name: Holiday
        description: Vendor holiday
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                vendorId:
                  type: string
                date:
                  type: string
                  format: date
      - name: HolidayPage
        description: Page of holidays
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      vendorId:
                        type: string
                      date:
                        type: string
                        format: date
      - name: ErrorResponse
        description: Platform error envelope
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                statusCode:
                  type: integer
                message:
                  type: object
                  properties:
                    title:
                      type: string
                    description:
                      type: string
                    severity:
                      type: string
                data:
                  type: object
                  nullable: true
                error:
                  type: object
                  properties:
                    code:
                      type: string
                    details:
                      type: array
                      items:
                        type: object
                meta:
                  type: object
                  properties:
                    correlationId:
                      type: string
                    timestamp:
                      type: string
                    version:
                      type: string
      - name: WorkingHours
        description: Weekly working hours
        content:
          application/json:
            schema:
              type: object
              properties:
                vendorId:
                  type: string
                dayOfWeek:
                  type: string
                  enum:
                    - MON
                    - TUE
                    - WED
                    - THU
                    - FRI
                    - SAT
                    - SUN
                openTime:
                  type: string
                closeTime:
                  type: string

functions:
  postslotholds:
    handler: src/handlers/holidays.handlePostslotholds
    events:
      - http:
          path: /slot-holds
          method: post
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Create slot hold"
          swaggerTags:
            - Holds
          responseData:
            201:
              description: "Hold created"
              bodyType: SlotHold
          documentation:
            summary: "Create slot hold"
            tags:
              - Holds
            requestBody:
              description: "Slot hold to create"
              required: true
            requestModels:
              application/json: SlotHold
            methodResponses:
              - statusCode: "201"
                responseBody:
                  description: "Hold created"
                responseModels:
                  application/json: SlotHold
              - statusCode: "400"
                responseBody:
                  description: "Request failed"
                responseModels:
                  application/json: ErrorResponse

  deleteslothold:
    handler: src/handlers/holidays.handleDeleteslothold
    events:
      - http:
          path: /slot-holds/{holdId}
          method: delete
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Release slot hold"
          swaggerTags:
            - Holds
          responseData:
            204:
              description: "Hold released"
          documentation:
            summary: "Release slot hold"
            tags:
              - Holds
            pathParams:
              - name: holdId
                description: "Slot hold id"
                schema:
                  type: string
            methodResponses:
              - statusCode: "204"
                responseBody:
                  description: "Hold released"
              - statusCode: "400"
                responseBody:
                  description: "Request failed"
                responseModels:
                  application/json: ErrorResponse

  getslothold:
    handler: src/handlers/holidays.handleGetslothold
    events:
      - http:
          path: /slot-holds/{holdId}
          method: get
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Get slot hold"
          swaggerTags:
            - Holds
          responseData:
            200:
              description: "Hold"
              bodyType: SlotHold
          documentation:
            summary: "Get slot hold"
            tags:
              - Holds
            pathParams:
              - name: holdId
                description: "Slot hold id"
                schema:
                  type: string
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: "Hold"
                responseModels:
                  application/json: SlotHold
              - statusCode: "400"
                responseBody:
                  description: "Request failed"
                responseModels:
                  application/json: ErrorResponse

  getslots:
    handler: src/handlers/slots.handleGetslots
    events:
      - http:
          path: /vendors/{vendorId}/slots
          method: get
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "List slots"
          swaggerTags:
            - Slots
          responseData:
            200:
              description: "Slots"
              bodyType: SlotPage
          documentation:
            summary: "List slots"
            tags:
              - Slots
            pathParams:
              - name: vendorId
                description: "Vendor id"
                schema:
                  type: string
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: "Slots"
                responseModels:
                  application/json: SlotPage
              - statusCode: "400"
                responseBody:
                  description: "Request failed"
                responseModels:
                  application/json: ErrorResponse

  postslots:
    handler: src/handlers/slots.handlePostslots
    events:
      - http:
          path: /vendors/{vendorId}/slots
          method: post
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Generate slots"
          swaggerTags:
            - Slots
          responseData:
            200:
              description: "Slots generated"
              bodyType: SlotPage
          documentation:
            summary: "Generate slots"
            tags:
              - Slots
            pathParams:
              - name: vendorId
                description: "Vendor id"
                schema:
                  type: string
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: "Slots generated"
                responseModels:
                  application/json: SlotPage
              - statusCode: "400"
                responseBody:
                  description: "Request failed"
                responseModels:
                  application/json: ErrorResponse

  getslotid:
    handler: src/handlers/slots.handleGetslotid
    events:
      - http:
          path: /slots/{slotId}
          method: get
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Get slot"
          swaggerTags:
            - Slots
          responseData:
            200:
              description: "Slot"
              bodyType: Slot
          documentation:
            summary: "Get slot"
            tags:
              - Slots
            pathParams:
              - name: slotId
                description: "Slot id"
                schema:
                  type: string
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: "Slot"
                responseModels:
                  application/json: Slot
              - statusCode: "400"
                responseBody:
                  description: "Request failed"
                responseModels:
                  application/json: ErrorResponse

  postblock:
    handler: src/handlers/slots.handlePostblock
    events:
      - http:
          path: /slots/{slotId}/block
          method: post
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Block slot"
          swaggerTags:
            - Slots
          responseData:
            200:
              description: "Blocked"
              bodyType: Slot
          documentation:
            summary: "Block slot"
            tags:
              - Slots
            pathParams:
              - name: slotId
                description: "Slot id"
                schema:
                  type: string
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: "Blocked"
                responseModels:
                  application/json: Slot
              - statusCode: "400"
                responseBody:
                  description: "Request failed"
                responseModels:
                  application/json: ErrorResponse

  postunblock:
    handler: src/handlers/slots.handlePostunblock
    events:
      - http:
          path: /slots/{slotId}/unblock
          method: post
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Unblock slot"
          swaggerTags:
            - Slots
          responseData:
            200:
              description: "Unblocked"
              bodyType: Slot
          documentation:
            summary: "Unblock slot"
            tags:
              - Slots
            pathParams:
              - name: slotId
                description: "Slot id"
                schema:
                  type: string
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: "Unblocked"
                responseModels:
                  application/json: Slot
              - statusCode: "400"
                responseBody:
                  description: "Request failed"
                responseModels:
                  application/json: ErrorResponse

  getholidays:
    handler: src/handlers/holidays.handleGetholidays
    events:
      - http:
          path: /vendors/{vendorId}/holidays
          method: get
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "List holidays"
          swaggerTags:
            - Holidays
          responseData:
            200:
              description: "Holiday list"
              bodyType: HolidayPage
          documentation:
            summary: "List holidays"
            tags:
              - Holidays
            pathParams:
              - name: vendorId
                description: "Vendor id"
                schema:
                  type: string
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: "Holiday list"
                responseModels:
                  application/json: HolidayPage
              - statusCode: "400"
                responseBody:
                  description: "Request failed"
                responseModels:
                  application/json: ErrorResponse

  postholidays:
    handler: src/handlers/holidays.handlePostholidays
    events:
      - http:
          path: /vendors/{vendorId}/holidays
          method: post
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Add holiday"
          swaggerTags:
            - Holidays
          responseData:
            200:
              description: "Holiday added"
              bodyType: Holiday
          documentation:
            summary: "Add holiday"
            tags:
              - Holidays
            pathParams:
              - name: vendorId
                description: "Vendor id"
                schema:
                  type: string
            requestBody:
              description: "Holiday to add"
              required: true
            requestModels:
              application/json: Holiday
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: "Holiday added"
                responseModels:
                  application/json: Holiday
              - statusCode: "400"
                responseBody:
                  description: "Request failed"
                responseModels:
                  application/json: ErrorResponse

  patchholiday:
    handler: src/handlers/holidays.handlePatchholiday
    events:
      - http:
          path: /vendors/{vendorId}/holidays/{holidayId}
          method: patch
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Update holiday"
          swaggerTags:
            - Holidays
          responseData:
            200:
              description: "Holiday updated"
              bodyType: Holiday
          documentation:
            summary: "Update holiday"
            tags:
              - Holidays
            pathParams:
              - name: vendorId
                description: "Vendor id"
                schema:
                  type: string
              - name: holidayId
                description: "Holiday id"
                schema:
                  type: string
            requestBody:
              description: "Holiday fields to update"
              required: true
            requestModels:
              application/json: Holiday
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: "Holiday updated"
                responseModels:
                  application/json: Holiday
              - statusCode: "400"
                responseBody:
                  description: "Request failed"
                responseModels:
                  application/json: ErrorResponse

  deleteholiday:
    handler: src/handlers/holidays.handleDeleteholiday
    events:
      - http:
          path: /vendors/{vendorId}/holidays/{holidayId}
          method: delete
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Remove holiday"
          swaggerTags:
            - Holidays
          responseData:
            204:
              description: "Holiday removed"
          documentation:
            summary: "Remove holiday"
            tags:
              - Holidays
            pathParams:
              - name: vendorId
                description: "Vendor id"
                schema:
                  type: string
              - name: holidayId
                description: "Holiday id"
                schema:
                  type: string
            methodResponses:
              - statusCode: "204"
                responseBody:
                  description: "Holiday removed"
              - statusCode: "400"
                responseBody:
                  description: "Request failed"
                responseModels:
                  application/json: ErrorResponse

  getavailability:
    handler: src/handlers/availability.handleGetavailability
    events:
      - http:
          path: /vendors/{vendorId}/availability
          method: get
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "List bookable availability for a vendor"
          swaggerTags:
            - Availability
          responseData:
            200:
              description: "Bookable visit occurrences or slots"
              bodyType: SlotPage
          documentation:
            summary: "List bookable community visit occurrences (communityId) or legacy branch slots (branchId)"
            description: >
              Canonical vendor-scoped availability. Prefer communityId with fromDate/toDate (or date)
              to return bookable dated community visit occurrences. Pass communityId+serviceId+date
              for service-visit time slices. branchId+date remains supported for legacy clients.
            tags:
              - Availability
            pathParams:
              - name: vendorId
                description: "Vendor id"
                schema:
                  type: string
            queryParams:
              - name: communityId
                required: false
                description: "Community id for community-visit availability"
                schema:
                  type: string
              - name: fromDate
                required: false
                description: "Range start YYYY-MM-DD (preferred with communityId)"
                schema:
                  type: string
              - name: toDate
                required: false
                description: "Range end YYYY-MM-DD"
                schema:
                  type: string
              - name: date
                required: false
                description: "Single date (alias for fromDate=toDate=date)"
                schema:
                  type: string
              - name: branchId
                required: false
                description: "Legacy branch-scoped slot listing"
                schema:
                  type: string
              - name: serviceId
                schema:
                  type: string
              - name: vehicleTypeId
                schema:
                  type: string
              - name: limit
                schema:
                  type: integer
              - name: nextToken
                schema:
                  type: string
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: "Bookable visit occurrences or slots"
                responseModels:
                  application/json: SlotPage
              - statusCode: "400"
                responseBody:
                  description: "Request failed"
                responseModels:
                  application/json: ErrorResponse

  listCommunityAvailability:
    handler: src/handlers/community-visits.handleListCommunityAvailability
    events:
      - http:
          path: /communities/{communityId}/availability
          method: get
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "List bookable community visit occurrences"
          swaggerTags:
            - Availability
          documentation:
            summary: "Canonical customer availability by community and date range"
            description: >
              Returns eligible, bookable dated community visit occurrences with remaining capacity.
              Optional vendorId filters to a selected vendor. serviceId/vehicleTypeId are accepted
              for forward compatibility and do not currently filter community visit capacity.
            tags:
              - Availability
            pathParams:
              - name: communityId
                description: "Community id"
                schema:
                  type: string
            queryParams:
              - name: fromDate
                required: false
                schema:
                  type: string
              - name: toDate
                required: false
                schema:
                  type: string
              - name: date
                required: false
                description: "Single-day alias when fromDate/toDate omitted"
                schema:
                  type: string
              - name: vendorId
                required: false
                schema:
                  type: string
              - name: serviceId
                required: false
                schema:
                  type: string
              - name: vehicleTypeId
                required: false
                schema:
                  type: string
              - name: limit
                schema:
                  type: integer
              - name: nextToken
                schema:
                  type: string
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: "Bookable community visit occurrences"
              - statusCode: "400"
                responseBody:
                  description: "Request failed"
                responseModels:
                  application/json: ErrorResponse

  expireHolds:
    handler: src/handlers/internal.expireHolds
    description: "Release capacity for holds whose expiresAt has passed"
    events:
      - schedule:
          rate: rate(1 minute)
          enabled: true

  consumeHold:
    handler: src/handlers/internal.consumeHold
    description: "Internal invoke. Booking confirmation consumes an active hold and creates an allocation."

  reserveBooking:
    handler: src/handlers/internal.reserveBooking
    description: "Internal invoke. Booking creation atomically reserves validated capacity without a customer hold."

  releaseAllocation:
    handler: src/handlers/internal.releaseAllocation
    description: "Internal invoke. Booking cancellation releases a confirmed allocation and restores capacity."

  findBookableOfferings:
    handler: src/handlers/internal.findBookableOfferings
    description: "Internal invoke. Reports which offerings have a bookable slot on one date. No public route."
    timeout: 15
    memorySize: 512

  getBookingReadinessFacts:
    handler: src/handlers/internal.getBookingReadinessFacts
    description: "Internal invoke. Publishes the authoritative valid community visit schedule count."
    timeout: 30

  onBookingReadinessChanged:
    handler: src/handlers/booking-readiness-stream.handler
    description: "Publishes a visit-schedule readiness summary after schedule or visit changes."
    timeout: 60
    events:
      - stream:
          type: dynamodb
          arn: !GetAtt AvailabilityTable.StreamArn
          filterPatterns:
            - eventName: [INSERT, MODIFY]
              dynamodb:
                NewImage:
                  entityType:
                    S: [CommunityVisitSchedule, CommunityVisit]
            - eventName: [REMOVE]
              dynamodb:
                OldImage:
                  entityType:
                    S: [CommunityVisitSchedule, CommunityVisit]
          batchSize: 10
          startingPosition: LATEST
          bisectBatchOnFunctionError: true
          maximumRetryAttempts: 3
          functionResponseType: ReportBatchItemFailures
          destinations:
            onFailure:
              arn: !GetAtt AvailabilityBookingReadinessStreamDlq.Arn
              type: sqs

  reconcileServiceVisits:
    handler: src/handlers/reconcile-service-visits.handleReconcileServiceVisits
    events:
      - http:
          path: /vendors/{vendorId}/service-visit-projections/reconcile
          method: post
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Reconcile service visit projections"

  onServiceVisitProjection:
    handler: src/handlers/service-visit-projection.handler
    description: "Applies ServiceVisit lifecycle events onto the availability read model."

  getworkinghours:
    handler: src/handlers/availability.handleGetworkinghours
    events:
      - http:
          path: /vendors/{vendorId}/working-hours
          method: get
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Get working hours (deprecated)"
          swaggerTags:
            - Availability
          responseData:
            200:
              description: "Working hours"
              bodyType: WorkingHours
          documentation:
            summary: "Deprecated. Bookable time comes from service visits. This schedule remains for vendors that have not activated a visit."
            tags:
              - Availability
            pathParams:
              - name: vendorId
                description: "Vendor id"
                schema:
                  type: string
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: "Working hours"
                responseModels:
                  application/json: WorkingHours
              - statusCode: "400"
                responseBody:
                  description: "Request failed"
                responseModels:
                  application/json: ErrorResponse

  putworkinghours:
    handler: src/handlers/availability.handlePutworkinghours
    events:
      - http:
          path: /vendors/{vendorId}/working-hours
          method: put
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Update working hours"
          swaggerTags:
            - Availability
          bodyType: WorkingHours
          responseData:
