resources:
  Resources:
    ServiceVisitProjectionDlq:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${self:provider.stage}-service-visit-dlq
        MessageRetentionPeriod: 1209600
        SqsManagedSseEnabled: true

    ServiceVisitProjectionDlqPolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref ServiceVisitProjectionDlq
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: events.amazonaws.com
              Action: sqs:SendMessage
              Resource: !GetAtt ServiceVisitProjectionDlq.Arn
              Condition:
                StringEquals:
                  aws:SourceAccount: !Ref AWS::AccountId

    ServiceVisitProjectionRule:
      Type: AWS::Events::Rule
      DependsOn:
        - ServiceVisitProjectionDlqPolicy
      Properties:
        Name: ${self:service}-${self:provider.stage}-service-visit
        Description: Projects service visit configurations for slot calculation
        EventBusName:
          Fn::ImportValue: nv${self:provider.stage}-bw-vendor-event-bus-name
        EventPattern:
          source:
            - service-catalog-service
          detail-type:
            - ServiceVisit.Created
            - ServiceVisit.Updated
            - ServiceVisit.Activated
            - ServiceVisit.Paused
            - ServiceVisit.Archived
        State: ENABLED
        Targets:
          - Id: AvailabilityServiceVisitProjection
            Arn: !GetAtt OnServiceVisitProjectionLambdaFunction.Arn
            DeadLetterConfig:
              Arn: !GetAtt ServiceVisitProjectionDlq.Arn
            RetryPolicy:
              MaximumRetryAttempts: 3

    ServiceVisitProjectionPermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !GetAtt OnServiceVisitProjectionLambdaFunction.Arn
        Action: lambda:InvokeFunction
        Principal: events.amazonaws.com
        SourceArn: !GetAtt ServiceVisitProjectionRule.Arn

    AvailabilityBookingReadinessStreamDlq:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.resourcePrefix}-availability-booking-readiness-stream-dlq
        MessageRetentionPeriod: 1209600
        SqsManagedSseEnabled: true

    AvailabilityTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: availability-table-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        SSESpecification:
          SSEEnabled: true
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: GSI1PK
            AttributeType: S
          - AttributeName: GSI1SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH
              - AttributeName: GSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        Tags:
          - Key: Service
            Value: ${self:service}
          - Key: Environment
            Value: ${self:provider.stage}
          - Key: ManagedBy
            Value: Serverless

    GatewayResponseDefault4XX: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseDefault4XX}

    GatewayResponseDefault5XX: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseDefault5XX}

    GatewayResponseUnauthorized: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseUnauthorized}

    GatewayResponseAccessDenied: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseAccessDenied}

    GatewayResponseMissingAuthenticationToken: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseMissingAuthenticationToken}
    GatewayResponseExpiredToken: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseExpiredToken}
    GatewayResponseIntegrationFailure: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseIntegrationFailure}
    GatewayResponseIntegrationTimeout: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseIntegrationTimeout}

