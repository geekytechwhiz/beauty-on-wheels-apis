    listvendorpackagevisits:
      handler: src/handlers/vendor-package-visits.handleListVendorPackageVisits
      events:
        - http:
            path: /vendors/{vendorId}/package-visits
            method: get
            cors: ${self:custom.httpCors}
            authorizer: ${self:custom.securedAuthorizer}
            summary: "List vendor package visits"
            description: "Owner-only package-visit work queue. Omit date filters to list all vendor package visits on GSI1 (scheduled + UNSCHEDULED, any community). Pass date or fromDate/toDate for a dated board (GSI3 single day / GSI1 range; scheduled only). Optional communityId, visitWindowId, status, and search filter in memory. Staff and other vendors receive 403."
            swaggerTags:
              - Customer Plans
            queryStringParameters:
              date:
                required: false
                type: string
                description: Exact scheduled date YYYY-MM-DD. When omitted with fromDate/toDate also omitted, returns the full vendor work queue.
              fromDate:
                required: false
                type: string
                description: Inclusive start date. Cannot be combined with date.
              toDate:
                required: false
                type: string
                description: Inclusive end date.
              communityId:
                required: false
                type: string
                description: Filter to one community after the vendor query.
              visitWindowId:
                required: false
                type: string
              status:
                required: false
                type: string
                description: SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED, MISSED, BLOCKED, or UNSCHEDULED. UNSCHEDULED cannot be combined with a date filter.
              search:
                required: false
                type: string
                description: Case-insensitive vehicle registration substring.
              limit:
                required: false
                type: integer
                description: Page size 1-50. Default 20.
              nextToken:
                required: false
                type: string
                description: Opaque pagination token.
            responseData:
              200:
                description: "Vendor package visits"
              400:
                description: "Invalid filter"
              401:
                description: "Unauthenticated"
              403:
                description: "Staff, another vendor, or no membership"
            documentation:
              summary: List vendor package visits
              description: Owner-only package-visit work queue (scheduled and unscheduled when no date filter). Does not change GET /vendors/{vendorId}/bookings.
              tags:
                - Customer Plans
              queryParams:
                - name: date
                  required: false
                  schema:
                    type: string
                - name: fromDate
                  required: false
                  schema:
                    type: string
                - name: toDate
                  required: false
                  schema:
                    type: string
                - name: communityId
                  required: false
                  schema:
                    type: string
                - name: visitWindowId
                  required: false
                  schema:
                    type: string
                - name: status
                  required: false
                  schema:
                    type: string
                    enum: [SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED, MISSED, BLOCKED, UNSCHEDULED]
                - name: search
                  required: false
                  schema:
                    type: string
                - name: limit
                  required: false
                  schema:
                    type: integer
                    minimum: 1
                    maximum: 50
                - name: nextToken
                  required: false
                  schema:
                    type: string
              methodResponses:
                - statusCode: "200"
                  responseBody:
                    description: items and nextToken
                - statusCode: "400"
                  responseBody:
                    description: Invalid filter
                  responseModels:
                    application/json: ErrorResponse
                - statusCode: "403"
                  responseBody:
                    description: Forbidden
                  responseModels:
                    application/json: ErrorResponse
              pathParams:
                - name: vendorId
                  description: Vendor id. Must match the caller's owner membership.
                  schema:
                    type: string

