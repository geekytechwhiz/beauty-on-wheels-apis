  resources:
    Resources:
      PartnerBffManagerReadInvokePermission:
        Type: AWS::Lambda::Permission
        Properties:
          FunctionName: !GetAtt PartnerManagerReadLambdaFunction.Arn
          Action: lambda:InvokeFunction
          Principal: !Sub arn:aws:iam::${AWS::AccountId}:role/partner-bff-${self:provider.stage}-execution

      GatewayResponseDefault4XX: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseDefault4XX}

      GatewayResponseDefault5XX: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseDefault5XX}

      GatewayResponseUnauthorized: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseUnauthorized}

      GatewayResponseAccessDenied: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseAccessDenied}

      GatewayResponseMissingAuthenticationToken: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseMissingAuthenticationToken}
      GatewayResponseExpiredToken: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseExpiredToken}
      GatewayResponseIntegrationFailure: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseIntegrationFailure}
      GatewayResponseIntegrationTimeout: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseIntegrationTimeout}

      BookingEvidenceBucket:
        Type: AWS::S3::Bucket
        DeletionPolicy: Retain
        UpdateReplacePolicy: Retain
        Properties:
          PublicAccessBlockConfiguration:
            BlockPublicAcls: true
            BlockPublicPolicy: true
            IgnorePublicAcls: true
            RestrictPublicBuckets: true
          BucketEncryption:
            ServerSideEncryptionConfiguration:
              - ServerSideEncryptionByDefault:
                  SSEAlgorithm: AES256
          CorsConfiguration:
            CorsRules:
              - AllowedOrigins:
                  - '*'
                AllowedMethods:
                  - GET
                  - PUT
                  - HEAD
                AllowedHeaders:
                  - '*'
                MaxAge: 3000

      BookingTable:
        Type: AWS::DynamoDB::Table
        DeletionPolicy: Retain
        UpdateReplacePolicy: Retain

        Properties:
          TableName: ${self:custom.booking}

          BillingMode: PAY_PER_REQUEST

          PointInTimeRecoverySpecification:
            PointInTimeRecoveryEnabled: true

          SSESpecification:
            SSEEnabled: true

          StreamSpecification:
            StreamViewType: NEW_IMAGE

          AttributeDefinitions:
            - AttributeName: PK
              AttributeType: S

            - AttributeName: SK
              AttributeType: S

            - AttributeName: GSI1PK
              AttributeType: S

            - AttributeName: GSI1SK
              AttributeType: S

            - AttributeName: GSI2PK
              AttributeType: S

            - AttributeName: GSI2SK
              AttributeType: S

            - AttributeName: GSI3PK
              AttributeType: S

            - AttributeName: GSI3SK
              AttributeType: S

            - AttributeName: GSI4PK
              AttributeType: S

            - AttributeName: GSI4SK
              AttributeType: S

          KeySchema:
            - AttributeName: PK
              KeyType: HASH

            - AttributeName: SK
              KeyType: RANGE

          GlobalSecondaryIndexes:

            - IndexName: GSI1

              KeySchema:
                - AttributeName: GSI1PK
                  KeyType: HASH

                - AttributeName: GSI1SK
                  KeyType: RANGE

              Projection:
                ProjectionType: ALL

            - IndexName: GSI2

              KeySchema:
                - AttributeName: GSI2PK
                  KeyType: HASH

                - AttributeName: GSI2SK
                  KeyType: RANGE

              Projection:
                ProjectionType: ALL

            - IndexName: GSI3

              KeySchema:
                - AttributeName: GSI3PK
                  KeyType: HASH

                - AttributeName: GSI3SK
                  KeyType: RANGE

              Projection:
                ProjectionType: ALL

            # Dated package visits for operations dispatch and demand.
            # OPS_SCHEDULE#<YYYY-MM-DD> / <communityId>#<visitWindowId>#<vendorId>#<status>#<start>#<visitId>
            - IndexName: GSI4

              KeySchema:
                - AttributeName: GSI4PK
                  KeyType: HASH

                - AttributeName: GSI4SK
                  KeyType: RANGE

              Projection:
                ProjectionType: ALL

          Tags:
            - Key: Service
              Value: booking

            - Key: Environment
              Value: ${self:provider.stage}

            - Key: ManagedBy
              Value: Serverless
