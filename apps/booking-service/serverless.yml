service: booking-service

frameworkVersion: "3"

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-auto-swagger
  - serverless-offline
provider:
  name: aws
  runtime: nodejs22.x

  stage: ${opt:stage,'dev'}

  region: ${opt:region,'us-east-1'}

  versionFunctions: false

  environment:

    SERVICE_NAME: booking-service
    LOG_LEVEL: ${ssm:/common/log-level}
    DYNAMODB_TABLE_NAME: ${ssm:/common/dynamodb/table}
    EVENT_BUS_NAME: ${ssm:/common/eventbus/name}

custom:


  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    concurrency: 10
    plugins: ./esbuild-plugins.js

  autoswagger:
    title: "Beauty on Wheels - Booking Service API"
    apiType: http
    basePath: /${self:provider.stage}
    schemes:
      - https
      - http
    generateSwaggerOnDeploy: true
    swaggerFiles:
      - swagger.json
    useStage: true
    swaggerPath: swagger
    typefiles:
      - ./src/types/api-types.d.ts
    excludeStages:
      - production


functions:


  getbookings:
    handler: src/handlers/bookings.handler.handleGetbookings
    events:
      - http:
          path: /bookings
          method: get
          cors: true
          summary: "List bookings"
          swaggerTags:
            - Bookings
          responseData:
            200:
              description: "Booking list"


  postbookings:
    handler: src/handlers/bookings.handler.handlePostbookings
    events:
      - http:
          path: /bookings
          method: post
          cors: true
          summary: "Create booking"
          swaggerTags:
            - Bookings
          bodyType: Booking
          responseData:
            201:
              description: "Booking created"


  getbookingid:
    handler: src/handlers/bookings.handler.handleGetbookingid
    events:
      - http:
          path: /bookings/{bookingId}
          method: get
          cors: true
          summary: "Get booking"
          swaggerTags:
            - Bookings
          responseData:
            200:
              description: "Booking"
              bodyType: Booking


  putbookingid:
    handler: src/handlers/bookings.handler.handlePutbookingid
    events:
      - http:
          path: /bookings/{bookingId}
          method: put
          cors: true
          summary: "Update booking"
          swaggerTags:
            - Bookings
          bodyType: Booking
          responseData:
            200:
              description: "Updated"


  deletebookingid:
    handler: src/handlers/bookings.handler.handleDeletebookingid
    events:
      - http:
          path: /bookings/{bookingId}
          method: delete
          cors: true
          summary: "Cancel booking"
          swaggerTags:
            - Bookings
          responseData:
            204:
              description: "Cancelled"


  postconfirm:
    handler: src/handlers/bookings.handler.handlePostconfirm
    events:
      - http:
          path: /bookings/{bookingId}/confirm
          method: post
          cors: true
          summary: "Confirm booking"
          swaggerTags:
            - Bookings
          responseData:
            200:
              description: "Confirmed"


  postcheckin:
    handler: src/handlers/bookings.handler.handlePostcheckin
    events:
      - http:
          path: /bookings/{bookingId}/check-in
          method: post
          cors: true
          summary: "Customer check-in"
          swaggerTags:
            - Bookings
          responseData:
            200:
              description: "Checked in"


  poststart:
    handler: src/handlers/bookings.handler.handlePoststart
    events:
      - http:
          path: /bookings/{bookingId}/start
          method: post
          cors: true
          summary: "Start service"
          swaggerTags:
            - Bookings
          responseData:
            200:
              description: "In progress"


  postcomplete:
    handler: src/handlers/bookings.handler.handlePostcomplete
    events:
      - http:
          path: /bookings/{bookingId}/complete
          method: post
          cors: true
          summary: "Complete booking"
          swaggerTags:
            - Bookings
          responseData:
            200:
              description: "Completed"


  postcancel:
    handler: src/handlers/bookings.handler.handlePostcancel
    events:
      - http:
          path: /bookings/{bookingId}/cancel
          method: post
          cors: true
          summary: "Cancel booking"
          swaggerTags:
            - Bookings
          responseData:
            200:
              description: "Cancelled"


  getcustomerbookings:
    handler: src/handlers/bookings.handler.handleGetbookings
    events:
      - http:
          path: /customers/{customerId}/bookings
          method: get
          cors: true
          summary: "Customer booking history"
          swaggerTags:
            - Bookings
          responseData:
            200:
              description: "History"


  getvendorbookings:
    handler: src/handlers/bookings.handler.handleGetbookings
    events:
      - http:
          path: /vendors/{vendorId}/bookings
          method: get
          cors: true
          summary: "Vendor bookings"
          swaggerTags:
            - Bookings
          responseData:
            200:
              description: "Vendor bookings"


iamRoleStatements:

  - Effect: Allow
    Action:
      - logs:CreateLogGroup
      - logs:CreateLogStream
      - logs:PutLogEvents
    Resource:
      - arn:aws:logs:${aws:region}:${aws:accountId}:*
  - Effect: Allow
    Action:
      - xray:PutTraceSegments
      - xray:PutTelemetryRecords
    Resource: '*'


resources:
  Resources:
    GatewayResponseDefault4XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: DEFAULT_4XX
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: >-
            'Content-Type,Authorization,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent,Sec-Ch-Ua,Sec-Ch-Ua-Mobile,Sec-Ch-Ua-Platform'
          gatewayresponse.header.Access-Control-Allow-Methods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"

    GatewayResponseDefault5XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: DEFAULT_5XX
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: >-
            'Content-Type,Authorization,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent,Sec-Ch-Ua,Sec-Ch-Ua-Mobile,Sec-Ch-Ua-Platform'
          gatewayresponse.header.Access-Control-Allow-Methods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"

    GatewayResponseUnauthorized:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: UNAUTHORIZED
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: >-
            'Content-Type,Authorization,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent,Sec-Ch-Ua,Sec-Ch-Ua-Mobile,Sec-Ch-Ua-Platform'
          gatewayresponse.header.Access-Control-Allow-Methods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"

    GatewayResponseAccessDenied:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: ACCESS_DENIED
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: >-
            'Content-Type,Authorization,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent,Sec-Ch-Ua,Sec-Ch-Ua-Mobile,Sec-Ch-Ua-Platform'
          gatewayresponse.header.Access-Control-Allow-Methods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"