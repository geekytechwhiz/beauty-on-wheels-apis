                      minLength: 1
                      maxLength: 500
                      description: Required blocking reason persisted on the visit
            responseData:
              200:
                description: "Visit blocked"
              400:
                description: "Missing reason"
              403:
                description: "Not a vendor manager for this plan"
              409:
                description: "Invalid transition or already blocked with a different reason"
            documentation:
              summary: Block a package visit
              description: Vendor manager only. Persists SCHEDULED → BLOCKED with a required reason. Does not infer BLOCKED from issues or missing crew.
