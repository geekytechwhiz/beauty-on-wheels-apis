  service: booking-service

  frameworkVersion: "3"

  plugins:
    - serverless-esbuild
    - serverless-dotenv-plugin
    - serverless-auto-swagger
    - serverless-openapi-documenter
    - serverless-offline


  provider:
    name: aws
    runtime: nodejs22.x

    stage: ${opt:stage,'dev'}
    profile:  carish-new
    region: ${opt:region,'ap-south-1'}

    versionFunctions: false

    environment:
      CORS_ALLOWED_ORIGINS: ${self:custom.corsAllowedOrigins}

      SERVICE_NAME: booking-service
      STAGE: ${self:provider.stage}
      # LOG_LEVEL: ${ssm:/common/log-level}
      REGION: ${self:provider.region}
      DEFAULT_REGION: ${self:provider.region}
      DYNAMODB_TABLE_NAME: ${self:provider.environment.BOOKING_TABLE}
      BOOKING_TABLE: booking-table-${self:provider.stage}
      CATALOG_BASE_URL: ${env:CATALOG_BASE_URL, ''}
      VENDOR_BASE_URL: ${env:VENDOR_BASE_URL, ''}
      VENDOR_CHECKOUT_ELIGIBILITY_FUNCTION: aps1dev-carish-vendor-${self:provider.stage}-getCheckoutEligibility
      VENDOR_OPERATIONAL_ACCESS_FUNCTION:  aps1dev-carish-vendor-${self:provider.stage}-getOperationalAccess
      VENDOR_SCHEDULING_CREWS_FUNCTION:  aps1dev-carish-vendor-${self:provider.stage}-listSchedulingCrews
      VENDOR_RESERVE_CAPACITY_FUNCTION: aps1dev-carish-vendor-${self:provider.stage}-reserveSoldCapacity
      VENDOR_HOLD_CAPACITY_FUNCTION: aps1dev-carish-vendor-${self:provider.stage}-holdSoldCapacity
      VENDOR_CONFIRM_CAPACITY_FUNCTION: aps1dev-carish-vendor-${self:provider.stage}-confirmSoldCapacity
      VENDOR_RELEASE_CAPACITY_FUNCTION: aps1dev-carish-vendor-${self:provider.stage}-releaseSoldCapacity
      TRAVEL_BUFFER_MINUTES: ${env:TRAVEL_BUFFER_MINUTES, '30'}
      USER_BASE_URL: ${env:USER_BASE_URL, ''}
      VEHICLE_BASE_URL: ${env:VEHICLE_BASE_URL, ''}
      AVAILABILITY_BASE_URL: ${env:AVAILABILITY_BASE_URL, ''}
      AVAILABILITY_RESERVE_BOOKING_FUNCTION: aps1dev-availability-api-${self:provider.stage}-reserveBooking
      AVAILABILITY_CONSUME_HOLD_FUNCTION: aps1dev-availability-api-${self:provider.stage}-consumeHold
      AVAILABILITY_RELEASE_ALLOCATION_FUNCTION: aps1dev-availability-api-${self:provider.stage}-releaseAllocation
      # Turn on only after catalog GSI3 is ACTIVE, the backfill is verified, and catalog enforcement is on.
      COMMUNITY_OFFERING_ENFORCEMENT: 'false'
      # Sandbox payment completion for local/dev/staging. Set false when a real gateway owns confirmation.
      PAYMENT_SANDBOX_ENABLED: ${env:PAYMENT_SANDBOX_ENABLED, 'true'}
      # Local/test only: permits an ONLINE selection without fabricating payment success.
      # The Lambda startup guard rejects this setting for prod/production.
      ALLOW_UNPAID_ONLINE_BOOKING: ${env:ALLOW_UNPAID_ONLINE_BOOKING, 'false'}
      PAYMENT_PROVIDER: ${env:PAYMENT_PROVIDER, 'SANDBOX'}
      RAZORPAY_KEY_ID: ${env:RAZORPAY_KEY_ID, ''}
      RAZORPAY_KEY_SECRET: ${env:RAZORPAY_KEY_SECRET, ''}
      RAZORPAY_WEBHOOK_SECRET: ${env:RAZORPAY_WEBHOOK_SECRET, ''}
      EVIDENCE_BUCKET: !Ref BookingEvidenceBucket
      EVIDENCE_UPLOAD_URL_EXPIRY: '900'
      # Booking.Confirmed is consumed asynchronously by Email Service.
      EVENT_BUS_NAME:
        Fn::ImportValue: nv${self:provider.stage}-bw-vendor-event-bus-name

    iam:
      role:
        statements:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:BatchGetItem
              - dynamodb:BatchWriteItem
              - dynamodb:TransactWriteItems
              - dynamodb:TransactGetItems
              - dynamodb:DescribeTable
            Resource:
              - !GetAtt BookingTable.Arn
              - !Join [ "/", [ !GetAtt BookingTable.Arn, "index", "*" ] ]
          - Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
            Resource:
              - !Join [ "", [ !GetAtt BookingEvidenceBucket.Arn, "/visit-evidence/*" ] ]
              - !Join [ "", [ !GetAtt BookingEvidenceBucket.Arn, "/issues/*" ] ]
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource:
              - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:provider.environment.AVAILABILITY_RESERVE_BOOKING_FUNCTION}
              - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:provider.environment.AVAILABILITY_CONSUME_HOLD_FUNCTION}
              - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:provider.environment.AVAILABILITY_RELEASE_ALLOCATION_FUNCTION}
              - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:provider.environment.VENDOR_CHECKOUT_ELIGIBILITY_FUNCTION}
              - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:provider.environment.VENDOR_OPERATIONAL_ACCESS_FUNCTION}
              - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:provider.environment.VENDOR_SCHEDULING_CREWS_FUNCTION}
              - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:provider.environment.VENDOR_RESERVE_CAPACITY_FUNCTION}
              - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:provider.environment.VENDOR_HOLD_CAPACITY_FUNCTION}
              - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:provider.environment.VENDOR_CONFIRM_CAPACITY_FUNCTION}
              - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:provider.environment.VENDOR_RELEASE_CAPACITY_FUNCTION}
          - Effect: Allow
            Action:
              - events:PutEvents
            Resource:
              Fn::Sub:
                - arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/${BusName}
                - BusName:
                    Fn::ImportValue: nv${self:provider.stage}-bw-vendor-event-bus-name

  custom:
    httpCors: ${file(../../infra/serverless/config/rest-api-cors.yml)}
    corsAllowedOrigins: ${file(../../infra/serverless/config/cors-allowed-origins.yml):value}

    securedAuthorizer: ${file(../../infra/serverless/config/http-api-authorizer.yml)}


    esbuild:
      bundle: true
      minify: false
      sourcemap: true
      target: node22
      platform: node
      concurrency: 10
      plugins: ./esbuild-plugins.js
    booking: booking-table-${self:provider.stage}
    autoswagger:
      title: "Beauty on Wheels - Booking Service API"
      apiType: http
      basePath: /${self:provider.stage}
      schemes:
        - https
        - http
      generateSwaggerOnDeploy: true
      swaggerFiles:
        - swagger.json
      useStage: true
      swaggerPath: swagger
      typefiles:
        - ./src/types/api-types.d.ts
      excludeStages:
        - production


    documentation:
      version: 1.0.0
      title: Beauty on Wheels - Booking Service API
      description: Create and manage customer bookings and booking lifecycle transitions.
      securitySchemes:
        bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      security:
        - bearerAuth: []
      servers:
        - url: https://{apiId}.execute-api.ap-south-1.amazonaws.com/{stage}
          description: Deployed API Gateway stage
          variables:
            apiId:
              default: localhost
              description: API Gateway id
            stage:
              default: dev
              description: Deployment stage
      tags:
        - name: Bookings
          description: Customer and vendor bookings
        - name: Payments
          description: Customer booking payments
        - name: Reviews
          description: Customer booking reviews
        - name: Customer Plans
          description: Recurring package plans (never ON_DEMAND bookings)
        - name: Booking Changes
          description: Preview and commit a provider or service change
      models:
        - name: VehicleDetails
          description: Vehicle snapshot stored on a booking
          content:
            application/json:
              schema:
                type: object
                properties:
                  bodyCategory:
                    type: string
                  makeModel:
                    type: string
                  saveToGarage:
                    type: boolean
        - name: CreateBookingRequest
          description: Create booking. Price and customer identity are server-assigned.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - vendorId
                  - branchId
                  - vehicleId
                  - offeringId
                  - schedule
                  - location
                  - addOnIds
                  - expectedPrice
                properties:
                  vendorId:
                    type: string
                  branchId:
                    type: string
                  vehicleId:
                    type: string
                  offeringId:
                    type: string
                  schedule:
                    type: object
                    required:
                      - date
                      - startTime
                      - timezone
                    properties:
                      date:
                        type: string
                        format: date
                      startTime:
                        type: string
                        pattern: '^\\d{2}:\\d{2}$'
                      timezone:
                        type: string
                  location:
                    type: object
                    required:
                      - fulfilmentType
                    properties:
                      fulfilmentType:
                        type: string
                        enum:
                          - community
                          - address
                          - COMMUNITY
                          - ADDRESS
                      communityId:
                        type: string
                      addressId:
                        type: string
                  addOnIds:
                    type: array
                    items:
                      type: string
                  expectedPrice:
                    type: object
                    required:
                      - totalMinor
                      - currency
                    properties:
                      totalMinor:
                        type: integer
                        minimum: 0
                      currency:
                        type: string
                        pattern: '^[A-Za-z]{3}$'
                  paymentMethod:
                    type: string
                    enum:
                      - CASH_ON_SERVICE
                      - ONLINE
                    description: Cash confirms with payment PENDING; ONLINE requires configured Razorpay or the non-production unpaid-booking flag.
                  notes:
                    type: string
                    maxLength: 2000
        - name: Booking
          description: Customer booking
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  reference:
                    type: string
                  customerId:
                    type: string
                  vendorId:
                    type: string
                  vendorName:
                    type: string
                  vehicleId:
                    type: string
                  branchName:
                    type: string
                  vehicleDetails:
                    type: object
                    properties:
                      bodyCategory:
                        type: string
                      makeModel:
                        type: string
                      type:
                        type: string
                      brand:
                        type: string
                      model:
                        type: string
                      registrationNumber:
                        type: string
                      saveToGarage:
                        type: boolean
                  serviceIds:
                    type: array
                    items:
                      type: string
                  bookingDate:
                    type: string
                  slotId:
                    type: string
                  branchId:
                    type: string
                  offeringId:
                    type: string
                  offeringVersion:
                    type: integer
                  service:
                    type: object
                    properties:
                      serviceId:
                        type: string
                      name:
                        type: string
                      categoryId:
                        type: string
                      offeringId:
                        type: string
                      durationMinutes:
                        type: integer
                  addOns:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        price:
                          type: number
                        priceMinor:
                          type: integer
                  schedule:
                    type: object
                    properties:
                      date:
                        type: string
                        format: date
                      startTime:
                        type: string
                      endTime:
                        type: string
                      durationMinutes:
                        type: integer
                      timezone:
                        type: string
                      startAtUtc:
                        type: string
                        format: date-time
                      endAtUtc:
                        type: string
                        format: date-time
                  holdId:
                    type: string
                  location:
                    type: object
                    properties:
                      fulfilmentType:
                        type: string
                        enum:
                          - community
                          - address
                      communityId:
                        type: string
                      addressId:
                        type: string
                      details:
                        type: object
                        additionalProperties:
                          type: string
                  pricingSnapshot:
                    type: object
                    properties:
                      offeringId:
                        type: string
                      offeringVersion:
                        type: integer
                        description: Effective offering revision returned by Service Catalog pricing.
                      catalogVersion:
                        type: integer
                        description: Catalog service version captured with the price.
                      vendorPricingVersion:
                        type: integer
                        minimum: 0
                        description: Vendor overlay version captured with the price. Zero means no overlay.
                      baseAmount:
                        type: number
                      addOnAmount:
                        type: number
                      subtotalAmount:
                        type: number
                      discountAmount:
                        type: number
                      taxAmount:
                        type: number
                      totalAmount:
                        type: number
                      baseMinor:
                        type: integer
                      addOnMinor:
                        type: integer
                      subtotalMinor:
                        type: integer
                      discountMinor:
                        type: integer
                      taxMinor:
                        type: integer
                      totalMinor:
                        type: integer
                      currency:
                        type: string
                  totalAmount:
                    type: number
                  paymentMethod:
                    type: string
                    enum:
                      - CASH_ON_SERVICE
                      - ONLINE
                  notes:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  paymentStatus:
                    type: string
                    enum:
                      - PENDING
                      - PAID
                      - FAILED
                      - REFUNDED
                  slotReserved:
                    type: boolean
                    description: True when Availability capacity was reserved for this booking.
                  bookingStatus:
                    type: string
                    enum:
                      - CREATED
                      - PENDING
                      - PENDING_PAYMENT
                      - CONFIRMED
                      - CHECKED_IN
                      - IN_PROGRESS
                      - COMPLETED
                      - CANCELLED
        - name: BookingPage
          description: Page of bookings
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        customerId:
                          type: string
                        vendorId:
                          type: string
                        vendorName:
                          type: string
                        branchId:
                          type: string
                        branchName:
                          type: string
                        vehicleId:
                          type: string
                        vehicleDetails:
                          type: object
                          properties:
                            bodyCategory:
                              type: string
                            makeModel:
                              type: string
                            saveToGarage:
                              type: boolean
                        serviceIds:
                          type: array
                          items:
                            type: string
                        bookingDate:
                          type: string
                        schedule:
                          type: object
                          properties:
                            date:
                              type: string
                            startTime:
                              type: string
                            endTime:
                              type: string
                            timezone:
                              type: string
                        slotId:
                          type: string
                        totalAmount:
                          type: number
                        pricingSnapshot:
                          type: object
                          properties:
                            totalMinor:
                              type: integer
                            currency:
                              type: string
                        paymentMethod:
                          type: string
                        paymentStatus:
                          type: string
                          enum:
                            - PENDING
                            - PAID
                            - FAILED
                            - REFUNDED
                        bookingStatus:
                          type: string
                          enum:
                            - CREATED
                            - PENDING
                            - PENDING_PAYMENT
                            - CONFIRMED
                            - CHECKED_IN
                            - IN_PROGRESS
                            - COMPLETED
                            - CANCELLED
        - name: VendorOperationsSummaryResponse
          description: Manager Home operations summary for package visits and one-time bookings
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - fromDate
                  - toDate
                  - timezone
                  - metrics
                  - needsAttention
                  - communities
                properties:
                  fromDate:
                    type: string
                    format: date
                  toDate:
                    type: string
                    format: date
                  timezone:
                    type: string
                    description: Resolved vendor IANA timezone
                  metrics:
                    type: object
                    additionalProperties: false
                    required:
                      - expected
                      - completed
                      - inProgress
                      - waiting
                      - missed
                      - cancelled
                    properties:
                      expected:
                        type: integer
                        minimum: 0
                      completed:
                        type: integer
                        minimum: 0
                      inProgress:
                        type: integer
                        minimum: 0
                      waiting:
                        type: integer
                        minimum: 0
                      missed:
                        type: integer
                        minimum: 0
                      cancelled:
                        type: integer
                        minimum: 0
                  needsAttention:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - communityId
                        - visitWindowId
                        - visitWindowName
                        - waiting
                      properties:
                        communityId:
                          type: string
                          nullable: true
                        visitWindowId:
                          type: string
                          nullable: true
                        visitWindowName:
                          type: string
                          nullable: true
                        waiting:
                          type: integer
                          minimum: 1
                  communities:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - communityId
                        - scheduled
                        - completed
                        - inProgress
                        - waiting
                      properties:
                        communityId:
                          type: string
                        scheduled:
                          type: integer
                          minimum: 0
                        completed:
                          type: integer
                          minimum: 0
                        inProgress:
                          type: integer
                          minimum: 0
                        waiting:
                          type: integer
                          minimum: 0
        - name: VendorHomeSummaryResponse
          description: Vendor manager home dashboard for one civil day plus upcoming package visits
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - vendorId
                  - timezone
                  - date
                  - today
                  - tomorrow
                  - upcoming
                properties:
                  vendorId:
                    type: string
                  timezone:
                    type: string
                    description: Resolved vendor IANA timezone
                  date:
                    type: string
                    format: date
                  today:
                    type: object
                    additionalProperties: false
                    required:
                      - visits
                      - crew
                      - completion
                      - needsAttention
                    properties:
                      visits:
                        type: object
                        additionalProperties: false
                        required:
                          - total
                          - completed
                          - inProgress
                          - notStarted
                          - blocked
                          - missed
                          - cancelled
                        properties:
                          total:
                            type: integer
                            minimum: 0
                            description: SCHEDULED+IN_PROGRESS+COMPLETED+BLOCKED+MISSED. Excludes CANCELLED and UNSCHEDULED.
                          completed:
                            type: integer
                            minimum: 0
                          inProgress:
                            type: integer
                            minimum: 0
                          notStarted:
                            type: integer
                            minimum: 0
                            description: SCHEDULED visits
                          blocked:
                            type: integer
                            minimum: 0
                            description: Persisted BLOCKED status only
                          missed:
                            type: integer
                            minimum: 0
                          cancelled:
                            type: integer
                            minimum: 0
                            description: Visible separately; excluded from total
                      crew:
                        type: object
                        additionalProperties: false
                        required:
                          - assigned
                          - unassigned
                        properties:
                          assigned:
                            type: integer
                            minimum: 0
                          unassigned:
                            type: integer
                            minimum: 0
                      completion:
                        type: object
                        additionalProperties: false
                        required:
                          - completed
                          - total
                          - percentage
                        properties:
                          completed:
                            type: integer
                            minimum: 0
                          total:
                            type: integer
                            minimum: 0
                            description: Same denominator as today.visits.total
                          percentage:
                            type: integer
                            minimum: 0
                            description: Round(100*completed/total), or 0 when total is 0
                      needsAttention:
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          required:
                            - communityId
                            - visitWindowId
                            - visitCount
                            - blockedCount
                            - unassignedCount
                          properties:
                            communityId:
                              type: string
                            communityName:
                              type: string
                            visitWindowId:
                              type: string
                            visitWindowName:
                              type: string
                            visitCount:
                              type: integer
                              minimum: 1
                            blockedCount:
                              type: integer
                              minimum: 0
                            unassignedCount:
                              type: integer
                              minimum: 0
                  tomorrow:
                    type: object
                    additionalProperties: false
                    required:
                      - date
                      - totalVisits
                      - assignedVisits
                      - unassignedVisits
                    properties:
                      date:
                        type: string
                        format: date
                      totalVisits:
                        type: integer
                        minimum: 0
                      assignedVisits:
                        type: integer
                        minimum: 0
                      unassignedVisits:
                        type: integer
                        minimum: 0
                  upcoming:
                    type: object
                    additionalProperties: false
                    required:
                      - fromDate
                      - toDate
                      - days
                    properties:
                      fromDate:
                        type: string
                        format: date
                      toDate:
                        type: string
                        format: date
                      days:
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          required:
                            - date
                            - totalVisits
                            - assignedVisits
                            - unassignedVisits
                            - communities
                          properties:
                            date:
                              type: string
                              format: date
                            totalVisits:
                              type: integer
                              minimum: 0
                            assignedVisits:
                              type: integer
                              minimum: 0
                            unassignedVisits:
                              type: integer
                              minimum: 0
                            communities:
                              type: array
                              items:
                                type: object
                                additionalProperties: false
                                required:
                                  - communityId
                                  - visitCount
                                  - unassignedCount
                                properties:
                                  communityId:
                                    type: string
                                  communityName:
                                    type: string
                                  visitCount:
                                    type: integer
                                    minimum: 1
                                  unassignedCount:
                                    type: integer
                                    minimum: 1
        - name: ErrorResponse
          description: Platform error envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  statusCode:
                    type: integer
                  message:
                    type: object
                    properties:
                      title:
                        type: string
                      description:
                        type: string
                      severity:
                        type: string
                  data:
                    type: object
                    properties: {}
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      details:
                        type: array
                        items:
                          type: object
                          properties:
                            field:
                              type: string
                            message:
                              type: string
                  meta:
                    type: object
                    properties:
                      correlationId:
                        type: string
                      timestamp:
                        type: string
                      version:
                        type: string
        - name: PlanVisitWindow
          description: Provider-coordinated recurring visit window
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [preferredDays, startTime, endTime, timezone]
                properties:
                  preferredDays:
                    type: array
                    minItems: 1
                    items:
                      type: string
                      enum: [MON, TUE, WED, THU, FRI, SAT, SUN]
                  startTime:
                    type: string
                    pattern: '^\\d{2}:\\d{2}$'
                  endTime:
                    type: string
                    pattern: '^\\d{2}:\\d{2}$'
                  timezone:
                    type: string
        - name: CreateCustomerPlanRequest
          description: >
            Purchase a catalog PACKAGE offering as a customer plan. Not an ON_DEMAND booking
            and not Availability slot or branch reservation. visitWindowId is a catalog preference;
            the provider coordinates exact visit times. Final price comes from the offering
            vehicle price for the selected vehicle. Community eligibility is validated against
            the offering; branchId is not accepted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [vendorId, vehicleId, location, visitWindowId, autoRenew, expectedPrice]
                properties:
                  vendorId:
                    type: string
                  offeringId:
                    type: string
                    description: Catalog PACKAGE offering id (preferred).
                  packageId:
                    type: string
                    description: Alias of offeringId for UI compatibility.
                  vehicleId:
                    type: string
                  location:
                    type: object
                    additionalProperties: false
                    required: [fulfilmentType]
                    properties:
                      fulfilmentType:
                        type: string
                        enum: [community, address, COMMUNITY, ADDRESS]
                      communityId:
                        type: string
                      addressId:
                        type: string
                      parkingBay:
                        type: string
                        pattern: '^[A-Za-z0-9][A-Za-z0-9 #/._-]{0,31}$'
                        description: Optional bay label inside the community. Copied to each visit for the partner work list; no address lines are shared.
                  visitWindowId:
                    type: string
                    description: Stable id from the offering visitWindows preference list.
                  autoRenew:
                    type: boolean
                    description: Customer renewal choice; applied only when true.
                  expectedPrice:
                    type: object
                    additionalProperties: false
                    required: [totalMinor, currency]
                    properties:
                      totalMinor:
                        type: integer
                        minimum: 0
                        description: >
                          Final customer price for the selected vehicle after catalog minor→major
                          conversion (INR rupees integer). Must match the resolved offering price.
                      currency:
                        type: string
                        pattern: '^[A-Za-z]{3}$'
                example:
                  vendorId: vend_demo_001
                  offeringId: offr_premium_weekly_wash
                  vehicleId: veh_customer_001
                  location:
                    fulfilmentType: community
                    communityId: comm_demo_001
                  visitWindowId: morning
                  autoRenew: true
                  expectedPrice:
                    totalMinor: 1499
                    currency: INR
        - name: CustomerPlan
          description: >
            Saved package plan. Billing period start/end and ACTIVE status are set when the
            linked first job starts (IN_PROGRESS), not at plan creation or payment time.
            Package plans are community-based; branchId is not required.
          content:
            application/json:
              schema:
                type: object
                properties:
                  planId:
                    type: string
                  offeringId:
                    type: string
                  packageId:
                    type: string
                  packageName:
                    type: string
                  vendorId:
                    type: string
                  vehicleId:
                    type: string
                  vehicleType:
                    type: string
                  status:
                    type: string
                    enum: [PENDING_PAYMENT, AWAITING_FIRST_JOB, ACTIVE]
                  paymentStatus:
                    type: string
                    enum: [PENDING, PAID]
                  billingPeriod:
                    type: string
                    enum: [oneTime, weekly, monthly, yearly]
                  cadence:
                    type: string
                    enum: [WEEKLY, BIWEEKLY, MONTHLY, YEARLY, ONE_TIME]
                  remainingVisits:
                    type: integer
                  entitlements:
                    type: array
                    items:
                      type: object
                      properties:
                        serviceId:
                          type: string
                        quantity:
                          type: integer
                  includedServices:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        description:
                          type: string
                        categoryId:
                          type: string
                        tags:
                          type: array
                          items:
                            type: string
                        visitsPerPeriod:
                          type: integer
                        durationMinutes:
                          type: integer
                          description: One visit duration
                  visitWindowId:
                    type: string
                  visitWindow:
                    type: object
                    properties:
                      visitWindowId:
                        type: string
                      label:
                        type: string
                      allDay:
                        type: boolean
                      startTime:
                        type: string
                      endTime:
                        type: string
                      preferredDays:
                        type: array
                        items:
                          type: string
                      timezone:
                        type: string
                  location:
                    type: object
                    properties:
                      fulfilmentType:
                        type: string
                      communityId:
                        type: string
                      addressId:
                        type: string
                  pricingSnapshot:
                    type: object
                    properties:
                      totalAmount:
                        type: number
                      totalMinor:
                        type: integer
                      currency:
                        type: string
                      packageId:
                        type: string
                      offeringId:
                        type: string
                      packageName:
                        type: string
                      packageVersion:
                        type: integer
                      vehicleType:
                        type: string
                      durationMinutes:
                        type: integer
                        description: Package-total duration for the selected vehicle
                  autoRenew:
                    type: boolean
                  firstJobId:
                    type: string
                  billingPeriodStart:
                    type: string
                    description: Set when the first job starts
                  billingPeriodEnd:
                    type: string
                  createdAt:
                    type: string
                  updatedAt:
                    type: string
                  activatedAt:
                    type: string
                    description: Payment completion time (plan may still await first job)
                example:
                  planId: plan_demo_001
                  offeringId: offr_premium_weekly_wash
                  packageId: offr_premium_weekly_wash
                  packageName: Premium weekly wash
                  vendorId: vend_demo_001
                  vehicleId: veh_customer_001
                  vehicleType: HATCHBACK
                  status: AWAITING_FIRST_JOB
                  paymentStatus: PAID
                  billingPeriod: weekly
                  cadence: WEEKLY
                  remainingVisits: 6
                  entitlements:
                    - serviceId: Exterior wash
                      quantity: 4
                    - serviceId: Interior vacuum
                      quantity: 2
                  includedServices:
                    - name: Exterior wash
                      description: Foam wash and dry
                      categoryId: cat_wash
                      tags:
                        - exterior
                      visitsPerPeriod: 4
                      durationMinutes: 30
                    - name: Interior vacuum
                      categoryId: cat_detail
                      visitsPerPeriod: 2
                      durationMinutes: 25
                  visitWindowId: morning
                  visitWindow:
                    visitWindowId: morning
                    label: Morning (8:00–12:00)
                    startTime: '08:00'
                    endTime: '12:00'
                  location:
                    fulfilmentType: community
                    communityId: comm_demo_001
                  pricingSnapshot:
                    totalAmount: 1499
                    totalMinor: 1499
                    currency: INR
                    packageId: offr_premium_weekly_wash
                    offeringId: offr_premium_weekly_wash
                    packageName: Premium weekly wash
                    packageVersion: 1
                    vehicleType: HATCHBACK
                    durationMinutes: 170
                  autoRenew: true
                  firstJobId: book_first_job_001
                  createdAt: '2026-10-28T11:00:00.000Z'
                  updatedAt: '2026-10-28T11:05:00.000Z'
                  activatedAt: '2026-10-28T11:05:00.000Z'
        - name: BookingChangeRequest
          description: Preview or commit a provider/service change on an owned PENDING_PAYMENT or CONFIRMED booking.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [changeType, vendorId, branchId, offeringId, schedule]
                properties:
                  changeType:
                    type: string
                    enum: [PROVIDER, SERVICE]
                  vendorId:
                    type: string
                  branchId:
                    type: string
                  offeringId:
                    type: string
                  schedule:
                    type: object
                    additionalProperties: false
                    required: [date, startTime, timezone]
                    properties:
                      date:
                        type: string
                        format: date
                      startTime:
                        type: string
                        pattern: '^\\d{2}:\\d{2}$'
                      timezone:
                        type: string
                  expectedPrice:
                    type: object
                    additionalProperties: false
                    description: Optional on preview, required on commit.
                    required: [totalMinor, currency]
                    properties:
                      totalMinor:
                        type: integer
                        minimum: 0
                      currency:
                        type: string
                  holdId:
                    type: string
        - name: BookingChangePreview
          description: Current vs proposed booking snapshots with price delta and payment impact. Reports impact only; no money moves.
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookingId:
                    type: string
                  changeType:
                    type: string
                  current:
                    type: object
                  proposed:
                    type: object
                  priceDeltaMinor:
                    type: integer
                  currency:
                    type: string
                  paymentImpact:
                    type: string
                    enum: [CHARGE, REFUND, NONE]
                  bookingPaymentStatus:
                    type: string
                  refundPolicy:
                    type: string
                    enum: [UNRESOLVED]
                  settlementExecuted:
                    type: boolean
        - name: BookingChangeResult
          description: Committed booking change with the updated booking
          content:
            application/json:
              schema:
                type: object
                properties:
                  changeId:
                    type: string
                  bookingId:
                    type: string
                  changeType:
                    type: string
                  booking:
                    type: object
                    description: Updated booking (see Booking)
                  priceDeltaMinor:
                    type: integer
                  currency:
                    type: string
                  paymentImpact:
                    type: string
                    enum: [CHARGE, REFUND, NONE]
                  refundPolicy:
                    type: string
                    enum: [UNRESOLVED]
                  settlementExecuted:
                    type: boolean
        - name: CrewAssignmentRequest
          description: Schedule selected package visits into a date range and visit window, and assign them to a crew
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - scheduleStartDate
                  - scheduleEndDate
                  - communityId
                  - visitWindowId
                  - crewId
                  - visitIds
                properties:
                  scheduleStartDate:
                    type: string
                    description: Inclusive YYYY-MM-DD commitment start
                  scheduleEndDate:
                    type: string
                    description: Inclusive YYYY-MM-DD commitment end (max 7 calendar days from start)
                  communityId:
                    type: string
                  visitWindowId:
                    type: string
                    description: Must match the customer preference stored on each visit
                  crewId:
                    type: string
                    description: Vendor team/crew id (not a staff id)
                  visitIds:
                    type: array
                    minItems: 1
                    maxItems: 25
                    items:
                      type: string
                  replaceExisting:
                    type: boolean
                    description: Required to move a SCHEDULED visit from another crew
        - name: CreateVendorIssueRequest
          description: Details for a vendor or crew issue
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [type, description]
                properties:
                  type:
                    type: string
                    enum: [ACCESS_PROBLEM, CUSTOMER_UNAVAILABLE, EQUIPMENT_PROBLEM, SAFETY_CONCERN, VEHICLE_DAMAGE, CAPACITY_SHORTFALL, PAYMENT_QUERY, OTHER]
                  description:
                    type: string
                    minLength: 1
                    maxLength: 2000
                  requestedHelp:
                    type: string
                    minLength: 1
                    maxLength: 1000
                  visitId:
                    type: string
                    minLength: 1
                    maxLength: 128
                  communityId:
                    type: string
                    minLength: 1
                    maxLength: 128
                  commitmentId:
                    type: string
                    minLength: 1
                    maxLength: 128
        - name: IssueAttachmentUploadUrlRequest
          description: Content type for a vendor issue attachment
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [contentType]
                properties:
                  contentType:
                    type: string
                    enum: [image/jpeg, image/png, image/webp, application/pdf]
        - name: ConfirmIssueAttachmentRequest
          description: Uploaded vendor issue attachment to register
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [objectKey, contentType]
                properties:
                  objectKey:
                    type: string
                    minLength: 1
                    maxLength: 512
                  contentType:
                    type: string
                    enum: [image/jpeg, image/png, image/webp, application/pdf]
        - name: VisitEvidenceUploadUrlRequest
          description: Content type for visit completion evidence
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [contentType]
                properties:
                  contentType:
                    type: string
                    enum: [image/jpeg, image/png, image/webp, application/pdf]
        - name: TriageIssueRequest
          description: Optional note when triaging an issue
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  note:
                    type: string
                    minLength: 1
                    maxLength: 1000
        - name: AssignIssueRequest
          description: Assign an issue to an operations user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [assigneeUserId]
                properties:
                  assigneeUserId:
                    type: string
                    minLength: 1
                    maxLength: 128
                  note:
                    type: string
                    minLength: 1
                    maxLength: 1000
        - name: ResolveIssueRequest
          description: Resolution outcome and optional note
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [outcome]
                properties:
                  outcome:
                    type: string
                    minLength: 1
                    maxLength: 1000
                  note:
                    type: string
                    minLength: 1
                    maxLength: 1000
        - name: RequestIssueActionRequest
          description: Required action requested from the vendor
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [note]
                properties:
                  note:
                    type: string
                    minLength: 1
                    maxLength: 1000
        - name: CompletionReviewRequest
          description: Decision for reviewing a completed package visit
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [decision]
                properties:
                  decision:
                    type: string
                    enum: [APPROVED, REJECTED]
                  note:
                    type: string
                    minLength: 1
                    maxLength: 1000
        - name: StaffAssignedWork
          description: Visits assigned to the signed-in staff member's active crews
          content:
            application/json:
              schema:
                type: object
                properties:
                  timezone:
                    type: string
                  fromDate:
                    type: string
                  toDate:
                    type: string
                  staffId:
                    type: string
                  reason:
                    type: string
                    enum: [noCrewAssignment]
                  complete:
                    type: boolean
                  ordering:
                    type: string
                    enum: [list]
                  crews:
                    type: array
                    items:
                      type: object
                  metrics:
                    type: object
                  items:
                    type: array
                    items:
                      type: object
                  nextToken:
                    type: string
                    nullable: true
        - name: StaffVisitAction
          description: Staff package-visit status change. Does not include customer identity.
          content:
            application/json:
              schema:
                type: object
                required:
                  - visitId
                  - status
                  - entitlementConsumed
                  - idempotent
                properties:
                  visitId:
                    type: string
                  status:
                    type: string
                    enum: [SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED, MISSED, BLOCKED, UNSCHEDULED]
                  startedAt:
                    type: string
                  completedAt:
                    type: string
                  missedAt:
                    type: string
                  blockedAt:
                    type: string
                  entitlementConsumed:
                    type: boolean
                  idempotent:
                    type: boolean
        - name: OpsDispatchVisitListResponse
          description: Cross-vendor dispatch page. assignedCrew is visit assignment, not capacity allocation.
          content:
            application/json:
              schema:
                type: object
                example:
                  definition: Operations dispatch queue of scheduled package visits across vendors.
                  items:
                    - visitId: visit-1
                      planId: plan-1
                      vendorId: vendor-1
                      communityId: community-1
                      visitWindowId: morning
                      visitWindowName: Morning
                      status: SCHEDULED
                      scheduledDate: '2026-11-03'
                      startTime: '08:00'
                      serviceName: Exterior wash
                      durationMinutes: 45
                      slotUnits: 2
                      registrationNumber: KL07AB1234
                      assignedCrew:
                        crewId: crew-1
                        assignedAt: '2026-11-02T10:00:00.000Z'
                  pagination:
                    limit: 50
                    nextCursor: null
                    hasMore: false
                    total: null
                    totalAvailability: unavailable
                    totalReason: items.length is not the day’s visit population.
                  coverage:
                    source: packageVisitOpsScheduleIndex
                    includesVisitsWrittenBeforeIndex: false
                    reason: Visits saved before the operations schedule index are absent.
        - name: OpsPackageVisitDemandResponse
          description: Booked package-visit demand. Not committed supply.
          content:
            application/json:
              schema:
                type: object
                example:
                  communityId: community-1
                  fromDate: '2026-11-01'
                  toDate: '2026-11-07'
                  definition: Booked package-visit demand.
                  unit:
                    name: slotUnit
                    minutes: 30
                    compareWith: Vendor Service commitment quantity for an overlapping service window.
                  completeness: indexedRows
                  completenessReason: Visits written before the operations schedule index are omitted.
                  totals:
                    demandVisits: 12
                    demandSlotUnits: 18
                    scheduled: 8
                    inProgress: 1
                    completed: 2
                    missed: 1
                    cancelled: 0
                  byWindow:
                    - visitWindowId: morning
                      visitWindowName: Morning
                      demandVisits: 12
                      demandSlotUnits: 18
                      scheduled: 8
                      inProgress: 1
                      completed: 2
                      missed: 1
                      cancelled: 0
  functions:


    getbookings:
      handler: src/handlers/bookingsHandler.handleGetbookings
      events:
        - http:
            path: /bookings
            method: get
            cors: ${self:custom.httpCors}
            authorizer: ${self:custom.securedAuthorizer}
            summary: "List my bookings"
            description: "Lists bookings owned by the authenticated customer. Customer and vendor identifiers in query parameters are not accepted."
            swaggerTags:
              - Bookings
            responseData:
              200:
                description: "Booking list"
            documentation:
              summary: List my bookings
              description: Lists bookings owned by the authenticated customer.
              tags:
                - Bookings
              methodResponses:
                - statusCode: "200"
                  responseBody:
                    description: Booking list
                  responseModels:
                    application/json: BookingPage
                - statusCode: "400"
                  responseBody:
                    description: Request failed
                  responseModels:
                    application/json: ErrorResponse
    postbookings:
      handler: src/handlers/bookingsHandler.handlePostbookings
      events:
        - http:
            path: /bookings
            method: post
            cors: ${self:custom.httpCors}
            authorizer: ${self:custom.securedAuthorizer}
            summary: "Create booking"
            description: "Creates a booking from a selected civil date/time. CASH_ON_SERVICE confirms an unpaid booking; ONLINE remains pending until verified Razorpay confirmation unless the non-production unpaid-online flag is enabled. Customer identity, service details, capacity, and pricing are validated server-side. Idempotency-Key is required."
            swaggerTags:
              - Bookings
            bodyType: CreateBookingRequest
            responseData:
              201:
                description: "Booking created"
            documentation:
              summary: Create booking
              description: Creates a booking from a selected civil date/time. The response separately reports bookingStatus, paymentMethod, paymentStatus, and slotReserved. Customer identity and authoritative price are server-assigned; Idempotency-Key is required.
              requestModels:
                application/json: CreateBookingRequest
              tags:
                - Bookings
              methodResponses:
                - statusCode: "201"
                  responseBody:
                    description: Booking created
                  responseModels:
                    application/json: Booking
                - statusCode: "400"
                  responseBody:
                    description: Request failed
                  responseModels:
                    application/json: ErrorResponse
              requestBody:
                description: Create booking request. Does not accept quoteId or totalAmount.
                required: true


    getbookingid:
      handler: src/handlers/bookingsHandler.handleGetbookingid
      events:
        - http:
            path: /bookings/{bookingId}
            method: get
            cors: ${self:custom.httpCors}
            authorizer: ${self:custom.securedAuthorizer}
            summary: "Get booking"
            swaggerTags:
              - Bookings
            responseData:
              200:
                description: "Booking"
                bodyType: Booking
            documentation:
              summary: Get booking
              description: Get booking
              tags:
                - Bookings
              methodResponses:
                - statusCode: "200"
                  responseBody:
                    description: Booking
                  responseModels:
                    application/json: Booking
                - statusCode: "400"
                  responseBody:
                    description: Request failed
                  responseModels:
                    application/json: ErrorResponse
              pathParams:
                - name: bookingId
                  description: bookingId
                  schema:
                    type: string


    deletebookingid:
      handler: src/handlers/bookingsHandler.handleDeletebookingid
      events:
        - http:
            path: /bookings/{bookingId}
            method: delete
            cors: ${self:custom.httpCors}
            authorizer: ${self:custom.securedAuthorizer}
            summary: "Cancel booking"
            swaggerTags:
              - Bookings
            responseData:
              204:
                description: "Cancelled"
            documentation:
              summary: Cancel booking
              description: Cancel booking
              tags:
                - Bookings
              methodResponses:
                - statusCode: "204"
                  responseBody:
                    description: Cancelled
                - statusCode: "400"
                  responseBody:
                    description: Request failed
                  responseModels:
                    application/json: ErrorResponse
              pathParams:
                - name: bookingId
                  description: bookingId
                  schema:
                    type: string


    confirmPaidBooking:
      handler: src/handlers/internal.confirmPaidBooking

    failPaymentBooking:
      handler: src/handlers/internal.failPaymentBooking

    partnerManagerRead:
      handler: src/handlers/internal.partnerManagerRead
      description: Legacy IAM invoke for Partner BFF manager reads. Prefer the HTTP internal route.

    partnerManagerReadHttp:
      handler: src/handlers/internal-http.handlePartnerManagerRead
      timeout: 20
      description: Internal HTTP Partner BFF manager reads (overview/work/planning). Auth is the platform internal bearer.
      events:
        - http:
            path: /internal/partner/manager/read
            method: post
            cors: ${self:custom.httpCors}
            authorizer: ${self:custom.securedAuthorizer}
            summary: "Internal partner manager read"
            swaggerTags:
              - Internal
            documentation:
              summary: Internal partner manager read
              description: >
                Partner BFF only. Authorization is the platform internal service token.
                Body carries the delegated actor plus action overview|work|planning and query filters.
                Membership is revalidated inside Booking before any visit data is returned.
              tags:
                - Internal
              methodResponses:
                - statusCode: "200"
                  responseBody:
                    description: Manager read payload
                - statusCode: "401"
                  responseBody:
                    description: Missing or invalid internal token
                  responseModels:
                    application/json: ErrorResponse
                - statusCode: "403"
                  responseBody:
                    description: Caller is not the internal service principal
                  responseModels:
                    application/json: ErrorResponse

    publishBookingConfirmedEvent:
      handler: src/handlers/booking-confirmed-event.handleBookingConfirmedEvent
      timeout: 30
      events:
        - stream:
            type: dynamodb
            arn:
              Fn::GetAtt:
                - BookingTable
                - StreamArn
            batchSize: 10
            # Never discard a committed booking event because EventBridge is down.
            maximumRetryAttempts: -1
            bisectBatchOnFunctionError: true
            filterPatterns:
              - eventName:
                  - INSERT
                dynamodb:
                  NewImage:
                    entityType:
                      S:
                        - BookingConfirmationOutbox


    postcheckin:
      handler: src/handlers/bookingsHandler.handlePostcheckin
      events:
        - http:
            path: /bookings/{bookingId}/check-in
            method: post
            cors: ${self:custom.httpCors}
            authorizer: ${self:custom.securedAuthorizer}
            summary: "Customer check-in"
            swaggerTags:
              - Bookings
            responseData:
              200:
                description: "Checked in"
            documentation:
              summary: Customer check-in
              description: Customer check-in
              tags:
                - Bookings
              methodResponses:
                - statusCode: "200"
                  responseBody:
                    description: Checked in
                  responseModels:
                    application/json: Booking
                - statusCode: "400"
                  responseBody:
                    description: Request failed
                  responseModels:
                    application/json: ErrorResponse
              pathParams:
                - name: bookingId
                  description: bookingId
                  schema:
                    type: string


    poststart:
      handler: src/handlers/bookingsHandler.handlePoststart
      events:
        - http:
            path: /bookings/{bookingId}/start
            method: post
            cors: ${self:custom.httpCors}
            authorizer: ${self:custom.securedAuthorizer}
            summary: "Start service"
            swaggerTags:
              - Bookings
            responseData:
              200:
                description: "In progress"
            documentation:
              summary: Start service
              description: Start service
              tags:
                - Bookings
              methodResponses:
                - statusCode: "200"
                  responseBody:
                    description: In progress
                  responseModels:
                    application/json: Booking
                - statusCode: "400"
                  responseBody:
                    description: Request failed
                  responseModels:
                    application/json: ErrorResponse
              pathParams:
                - name: bookingId
                  description: bookingId
                  schema:
                    type: string


    postcomplete:
      handler: src/handlers/bookingsHandler.handlePostcomplete
      events:
        - http:
            path: /bookings/{bookingId}/complete
            method: post
            cors: ${self:custom.httpCors}
            authorizer: ${self:custom.securedAuthorizer}
            summary: "Complete booking"
            swaggerTags:
              - Bookings
            responseData:
              200:
                description: "Completed"
            documentation:
              summary: Complete booking
              description: Complete booking
              tags:
                - Bookings
              methodResponses:
                - statusCode: "200"
                  responseBody:
                    description: Completed
                  responseModels:
                    application/json: Booking
                - statusCode: "400"
                  responseBody:
                    description: Request failed
                  responseModels:
                    application/json: ErrorResponse
              pathParams:
                - name: bookingId
                  description: bookingId
                  schema:
                    type: string


    postcancel:
      handler: src/handlers/bookingsHandler.handlePostcancel
      events:
        - http:
            path: /bookings/{bookingId}/cancel
            method: post
            cors: ${self:custom.httpCors}
            authorizer: ${self:custom.securedAuthorizer}
            summary: "Cancel booking"
            swaggerTags:
              - Bookings
            responseData:
              200:
                description: "Cancelled"
            documentation:
              summary: Cancel booking
              description: Cancel booking
              tags:
                - Bookings
              methodResponses:
                - statusCode: "200"
                  responseBody:
                    description: Cancelled
                  responseModels:
                    application/json: Booking
                - statusCode: "400"
                  responseBody:
                    description: Request failed
                  responseModels:
                    application/json: ErrorResponse
              pathParams:
                - name: bookingId
                  description: bookingId
                  schema:
                    type: string


    getcustomerbookings:
      handler: src/handlers/bookingsHandler.handleGetbookings
      events:
        - http:
            path: /customers/{customerId}/bookings
            method: get
            cors: ${self:custom.httpCors}
            authorizer: ${self:custom.securedAuthorizer}
            summary: "Customer booking history"
            swaggerTags:
              - Bookings
            responseData:
              200:
                description: "History"
            documentation:
              summary: Customer booking history
              description: Customer booking history
              tags:
                - Bookings
              methodResponses:
                - statusCode: "200"
