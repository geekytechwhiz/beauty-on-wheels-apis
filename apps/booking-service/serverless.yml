service: booking-service

frameworkVersion: "3"

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-auto-swagger
  - serverless-offline
provider:
  name: aws
  runtime: nodejs22.x

  stage: ${opt:stage,'dev'}

  region: ${opt:region,'us-east-1'}

  versionFunctions: false

  environment:

    SERVICE_NAME: booking-service
    # LOG_LEVEL: ${ssm:/common/log-level}
    DYNAMODB_TABLE_NAME: ${self:provider.environment.BOOKING_TABLE}
    BOOKING_TABLE: booking-table-${self:provider.stage}
    # EVENT_BUS_NAME: ${ssm:/common/eventbus/name}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:BatchGetItem
            - dynamodb:BatchWriteItem
            - dynamodb:TransactWriteItems
            - dynamodb:TransactGetItems
            - dynamodb:DescribeTable
          Resource:
            - !GetAtt BookingTable.Arn
            - !Join [ "/", [ !GetAtt BookingTable.Arn, "index", "*" ] ]

custom:


  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    concurrency: 10
    plugins: ./esbuild-plugins.js
  booking: booking-table-${self:provider.stage}
  autoswagger:
    title: "Beauty on Wheels - Booking Service API"
    apiType: http
    basePath: /${self:provider.stage}
    schemes:
      - https
      - http
    generateSwaggerOnDeploy: true
    swaggerFiles:
      - swagger.json
    useStage: true
    swaggerPath: swagger
    typefiles:
      - ./src/types/api-types.d.ts
    excludeStages:
      - production


functions:


  getbookings:
    handler: src/handlers/bookingsHandler.handleGetbookings
    events:
      - http:
          path: /bookings
          method: get
          cors: true
          summary: "List bookings"
          swaggerTags:
            - Bookings
          responseData:
            200:
              description: "Booking list"


  postbookings:
    handler: src/handlers/bookingsHandler.handlePostbookings
    events:
      - http:
          path: /bookings
          method: post
          cors: true
          summary: "Create booking"
          swaggerTags:
            - Bookings
          bodyType: Booking
          responseData:
            201:
              description: "Booking created"


  getbookingid:
    handler: src/handlers/bookingsHandler.handleGetbookingid
    events:
      - http:
          path: /bookings/{bookingId}
          method: get
          cors: true
          summary: "Get booking"
          swaggerTags:
            - Bookings
          responseData:
            200:
              description: "Booking"
              bodyType: Booking


  putbookingid:
    handler: src/handlers/bookingsHandler.handlePutbookingid
    events:
      - http:
          path: /bookings/{bookingId}
          method: put
          cors: true
          summary: "Update booking"
          swaggerTags:
            - Bookings
          bodyType: Booking
          responseData:
            200:
              description: "Updated"


  deletebookingid:
    handler: src/handlers/bookingsHandler.handleDeletebookingid
    events:
      - http:
          path: /bookings/{bookingId}
          method: delete
          cors: true
          summary: "Cancel booking"
          swaggerTags:
            - Bookings
          responseData:
            204:
              description: "Cancelled"


  postconfirm:
    handler: src/handlers/bookingsHandler.handlePostconfirm
    events:
      - http:
          path: /bookings/{bookingId}/confirm
          method: post
          cors: true
          summary: "Confirm booking"
          swaggerTags:
            - Bookings
          responseData:
            200:
              description: "Confirmed"


  postcheckin:
    handler: src/handlers/bookingsHandler.handlePostcheckin
    events:
      - http:
          path: /bookings/{bookingId}/check-in
          method: post
          cors: true
          summary: "Customer check-in"
          swaggerTags:
            - Bookings
          responseData:
            200:
              description: "Checked in"


  poststart:
    handler: src/handlers/bookingsHandler.handlePoststart
    events:
      - http:
          path: /bookings/{bookingId}/start
          method: post
          cors: true
          summary: "Start service"
          swaggerTags:
            - Bookings
          responseData:
            200:
              description: "In progress"


  postcomplete:
    handler: src/handlers/bookingsHandler.handlePostcomplete
    events:
      - http:
          path: /bookings/{bookingId}/complete
          method: post
          cors: true
          summary: "Complete booking"
          swaggerTags:
            - Bookings
          responseData:
            200:
              description: "Completed"


  postcancel:
    handler: src/handlers/bookingsHandler.handlePostcancel
    events:
      - http:
          path: /bookings/{bookingId}/cancel
          method: post
          cors: true
          summary: "Cancel booking"
          swaggerTags:
            - Bookings
          responseData:
            200:
              description: "Cancelled"


  getcustomerbookings:
    handler: src/handlers/bookingsHandler.handleGetbookings
    events:
      - http:
          path: /customers/{customerId}/bookings
          method: get
          cors: true
          summary: "Customer booking history"
          swaggerTags:
            - Bookings
          responseData:
            200:
              description: "History"


  getvendorbookings:
    handler: src/handlers/bookingsHandler.handleGetbookings
    events:
      - http:
          path: /vendors/{vendorId}/bookings
          method: get
          cors: true
          summary: "Vendor bookings"
          swaggerTags:
            - Bookings
          responseData:
            200:
              description: "Vendor bookings"


resources:
  Resources:
    GatewayResponseDefault4XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: DEFAULT_4XX
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: >-
            'Content-Type,Authorization,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent,Sec-Ch-Ua,Sec-Ch-Ua-Mobile,Sec-Ch-Ua-Platform'
          gatewayresponse.header.Access-Control-Allow-Methods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"

    GatewayResponseDefault5XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: DEFAULT_5XX
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: >-
            'Content-Type,Authorization,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent,Sec-Ch-Ua,Sec-Ch-Ua-Mobile,Sec-Ch-Ua-Platform'
          gatewayresponse.header.Access-Control-Allow-Methods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"

    GatewayResponseUnauthorized:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: UNAUTHORIZED
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: >-
            'Content-Type,Authorization,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent,Sec-Ch-Ua,Sec-Ch-Ua-Mobile,Sec-Ch-Ua-Platform'
          gatewayresponse.header.Access-Control-Allow-Methods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"

    GatewayResponseAccessDenied:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: ACCESS_DENIED
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: >-
            'Content-Type,Authorization,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent,Sec-Ch-Ua,Sec-Ch-Ua-Mobile,Sec-Ch-Ua-Platform'
          gatewayresponse.header.Access-Control-Allow-Methods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"

  
    BookingTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain

      Properties:
        TableName: ${self:custom.booking}

        BillingMode: PAY_PER_REQUEST

        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

        SSESpecification:
          SSEEnabled: true

        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S

          - AttributeName: SK
            AttributeType: S

          - AttributeName: GSI1PK
            AttributeType: S

          - AttributeName: GSI1SK
            AttributeType: S

          - AttributeName: GSI2PK
            AttributeType: S

          - AttributeName: GSI2SK
            AttributeType: S

          - AttributeName: GSI3PK
            AttributeType: S

          - AttributeName: GSI3SK
            AttributeType: S

        KeySchema:
          - AttributeName: PK
            KeyType: HASH

          - AttributeName: SK
            KeyType: RANGE

        GlobalSecondaryIndexes:

          - IndexName: GSI1

            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH

              - AttributeName: GSI1SK
                KeyType: RANGE

            Projection:
              ProjectionType: ALL

          - IndexName: GSI2

            KeySchema:
              - AttributeName: GSI2PK
                KeyType: HASH

              - AttributeName: GSI2SK
                KeyType: RANGE

            Projection:
              ProjectionType: ALL

          - IndexName: GSI3

            KeySchema:
              - AttributeName: GSI3PK
                KeyType: HASH

              - AttributeName: GSI3SK
                KeyType: RANGE

            Projection:
              ProjectionType: ALL

        Tags:
          - Key: Service
            Value: booking

          - Key: Environment
            Value: ${self:provider.stage}

          - Key: ManagedBy
            Value: Serverless