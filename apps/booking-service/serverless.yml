service: booking-service

frameworkVersion: "3"

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-auto-swagger
  - serverless-openapi-documenter
  - serverless-offline


provider:
  name: aws
  runtime: nodejs22.x

  stage: ${opt:stage,'dev'}

  region: ${opt:region,'us-east-1'}

  versionFunctions: false

  environment:

    SERVICE_NAME: booking-service
    # LOG_LEVEL: ${ssm:/common/log-level}
    DYNAMODB_TABLE_NAME: ${self:provider.environment.BOOKING_TABLE}
    BOOKING_TABLE: booking-table-${self:provider.stage}
    CATALOG_BASE_URL: ${env:CATALOG_BASE_URL, ''}
    VENDOR_BASE_URL: ${env:VENDOR_BASE_URL, ''}
    VENDOR_CHECKOUT_ELIGIBILITY_FUNCTION: vendor-service-api-${self:provider.stage}-getCheckoutEligibility
    USER_BASE_URL: ${env:USER_BASE_URL, ''}
    VEHICLE_BASE_URL: ${env:VEHICLE_BASE_URL, ''}
    AVAILABILITY_BASE_URL: ${env:AVAILABILITY_BASE_URL, ''}
    AVAILABILITY_RESERVE_BOOKING_FUNCTION: availability-service-${self:provider.stage}-reserveBooking
    AVAILABILITY_RELEASE_ALLOCATION_FUNCTION: availability-service-${self:provider.stage}-releaseAllocation
    # EVENT_BUS_NAME: ${ssm:/common/eventbus/name}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:BatchGetItem
            - dynamodb:BatchWriteItem
            - dynamodb:TransactWriteItems
            - dynamodb:TransactGetItems
            - dynamodb:DescribeTable
          Resource:
            - !GetAtt BookingTable.Arn
            - !Join [ "/", [ !GetAtt BookingTable.Arn, "index", "*" ] ]
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource:
            - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:provider.environment.AVAILABILITY_RESERVE_BOOKING_FUNCTION}
            - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:provider.environment.AVAILABILITY_RELEASE_ALLOCATION_FUNCTION}
            - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:provider.environment.VENDOR_CHECKOUT_ELIGIBILITY_FUNCTION}

custom:

  securedAuthorizer: ${file(../../infra/serverless/config/http-api-authorizer.yml)}


  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    concurrency: 10
    plugins: ./esbuild-plugins.js
  booking: booking-table-${self:provider.stage}
  autoswagger:
    title: "Beauty on Wheels - Booking Service API"
    apiType: http
    basePath: /${self:provider.stage}
    schemes:
      - https
      - http
    generateSwaggerOnDeploy: true
    swaggerFiles:
      - swagger.json
    useStage: true
    swaggerPath: swagger
    typefiles:
      - ./src/types/api-types.d.ts
    excludeStages:
      - production


  documentation:
    version: 1.0.0
    title: Beauty on Wheels - Booking Service API
    description: Create and manage customer bookings and booking lifecycle transitions.
    securitySchemes:
      bearerAuth:
        type: http
        scheme: bearer
        bearerFormat: JWT
    security:
      - bearerAuth: []
    servers:
      - url: https://{apiId}.execute-api.us-east-1.amazonaws.com/{stage}
        description: Deployed API Gateway stage
        variables:
          apiId:
            default: localhost
            description: API Gateway id
          stage:
            default: dev
            description: Deployment stage
    tags:
      - name: Bookings
        description: Customer and vendor bookings
    models:
      - name: VehicleDetails
        description: Vehicle snapshot stored on a booking
        content:
          application/json:
            schema:
              type: object
              properties:
                bodyCategory:
                  type: string
                makeModel:
                  type: string
                saveToGarage:
                  type: boolean
      - name: CreateBookingRequest
        description: Create booking. Price and customer identity are server-assigned.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - vendorId
                - branchId
                - vehicleId
                - offeringId
                - schedule
                - location
                - addOnIds
                - expectedPrice
              properties:
                vendorId:
                  type: string
                branchId:
                  type: string
                vehicleId:
                  type: string
                offeringId:
                  type: string
                schedule:
                  type: object
                  required:
                    - date
                    - startTime
                    - timezone
                  properties:
                    date:
                      type: string
                      format: date
                    startTime:
                      type: string
                      pattern: '^\\d{2}:\\d{2}$'
                    timezone:
                      type: string
                location:
                  type: object
                  required:
                    - fulfilmentType
                  properties:
                    fulfilmentType:
                      type: string
                      enum:
                        - community
                        - address
                        - COMMUNITY
                        - ADDRESS
                    communityId:
                      type: string
                    addressId:
                      type: string
                addOnIds:
                  type: array
                  items:
                    type: string
                expectedPrice:
                  type: object
                  required:
                    - totalMinor
                    - currency
                  properties:
                    totalMinor:
                      type: integer
                      minimum: 0
                    currency:
                      type: string
                      pattern: '^[A-Za-z]{3}$'
                notes:
                  type: string
                  maxLength: 2000
      - name: Booking
        description: Customer booking
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                reference:
                  type: string
                customerId:
                  type: string
                vendorId:
                  type: string
                vendorName:
                  type: string
                vehicleId:
                  type: string
                branchName:
                  type: string
                vehicleDetails:
                  type: object
                  properties:
                    bodyCategory:
                      type: string
                    makeModel:
                      type: string
                    type:
                      type: string
                    brand:
                      type: string
                    model:
                      type: string
                    registrationNumber:
                      type: string
                    saveToGarage:
                      type: boolean
                serviceIds:
                  type: array
                  items:
                    type: string
                bookingDate:
                  type: string
                slotId:
                  type: string
                branchId:
                  type: string
                offeringId:
                  type: string
                offeringVersion:
                  type: integer
                service:
                  type: object
                  properties:
                    serviceId:
                      type: string
                    name:
                      type: string
                    categoryId:
                      type: string
                    offeringId:
                      type: string
                    durationMinutes:
                      type: integer
                addOns:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      price:
                        type: number
                      priceMinor:
                        type: integer
                schedule:
                  type: object
                  properties:
                    date:
                      type: string
                      format: date
                    startTime:
                      type: string
                    endTime:
                      type: string
                    durationMinutes:
                      type: integer
                    timezone:
                      type: string
                    startAtUtc:
                      type: string
                      format: date-time
                    endAtUtc:
                      type: string
                      format: date-time
                holdId:
                  type: string
                location:
                  type: object
                  properties:
                    fulfilmentType:
                      type: string
                      enum:
                        - community
                        - address
                    communityId:
                      type: string
                    addressId:
                      type: string
                    details:
                      type: object
                      additionalProperties:
                        type: string
                pricingSnapshot:
                  type: object
                  properties:
                    offeringId:
                      type: string
                    offeringVersion:
                      type: integer
                      description: Effective offering revision returned by Service Catalog pricing.
                    catalogVersion:
                      type: integer
                      description: Catalog service version captured with the price.
                    vendorPricingVersion:
                      type: integer
                      minimum: 0
                      description: Vendor overlay version captured with the price. Zero means no overlay.
                    baseAmount:
                      type: number
                    addOnAmount:
                      type: number
                    subtotalAmount:
                      type: number
                    discountAmount:
                      type: number
                    taxAmount:
                      type: number
                    totalAmount:
                      type: number
                    baseMinor:
                      type: integer
                    addOnMinor:
                      type: integer
                    subtotalMinor:
                      type: integer
                    discountMinor:
                      type: integer
                    taxMinor:
                      type: integer
                    totalMinor:
                      type: integer
                    currency:
                      type: string
                totalAmount:
                  type: number
                paymentMethod:
                  type: string
                notes:
                  type: string
                createdAt:
                  type: string
                  format: date-time
                updatedAt:
                  type: string
                  format: date-time
                paymentStatus:
                  type: string
                  enum:
                    - PENDING
                    - PAID
                    - FAILED
                    - REFUNDED
                bookingStatus:
                  type: string
                  enum:
                    - CREATED
                    - PENDING
                    - PENDING_PAYMENT
                    - CONFIRMED
                    - CHECKED_IN
                    - IN_PROGRESS
                    - COMPLETED
                    - CANCELLED
      - name: BookingPage
        description: Page of bookings
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      customerId:
                        type: string
                      vendorId:
                        type: string
                      vendorName:
                        type: string
                      branchId:
                        type: string
                      branchName:
                        type: string
                      vehicleId:
                        type: string
                      vehicleDetails:
                        type: object
                        properties:
                          bodyCategory:
                            type: string
                          makeModel:
                            type: string
                          saveToGarage:
                            type: boolean
                      serviceIds:
                        type: array
                        items:
                          type: string
                      bookingDate:
                        type: string
                      schedule:
                        type: object
                        properties:
                          date:
                            type: string
                          startTime:
                            type: string
                          endTime:
                            type: string
                          timezone:
                            type: string
                      slotId:
                        type: string
                      totalAmount:
                        type: number
                      pricingSnapshot:
                        type: object
                        properties:
                          totalMinor:
                            type: integer
                          currency:
                            type: string
                      paymentMethod:
                        type: string
                      paymentStatus:
                        type: string
                        enum:
                          - PENDING
                          - PAID
                          - FAILED
                          - REFUNDED
                      bookingStatus:
                        type: string
                        enum:
                          - CREATED
                          - PENDING
                          - PENDING_PAYMENT
                          - CONFIRMED
                          - CHECKED_IN
                          - IN_PROGRESS
                          - COMPLETED
                          - CANCELLED
      - name: ErrorResponse
        description: Platform error envelope
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                statusCode:
                  type: integer
                message:
                  type: object
                  properties:
                    title:
                      type: string
                    description:
                      type: string
                    severity:
                      type: string
                data:
                  type: object
                  properties: {}
                error:
                  type: object
                  properties:
                    code:
                      type: string
                    details:
                      type: array
                      items:
                        type: object
                        properties:
                          field:
                            type: string
                          message:
                            type: string
                meta:
                  type: object
                  properties:
                    correlationId:
                      type: string
                    timestamp:
                      type: string
                    version:
                      type: string
functions:


  getbookings:
    handler: src/handlers/bookingsHandler.handleGetbookings
    events:
      - http:
          path: /bookings
          method: get
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "List my bookings"
          description: "Lists bookings owned by the authenticated customer. Customer and vendor identifiers in query parameters are not accepted."
          swaggerTags:
            - Bookings
          responseData:
            200:
              description: "Booking list"
          documentation:
            summary: List my bookings
            description: Lists bookings owned by the authenticated customer.
            tags:
              - Bookings
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Booking list
                responseModels:
                  application/json: BookingPage
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
  postbookings:
    handler: src/handlers/bookingsHandler.handlePostbookings
    events:
      - http:
          path: /bookings
          method: post
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Create booking"
          description: "Creates a PENDING_PAYMENT booking from a selected civil date/time. Customer identity, service details, capacity, and pricing are validated server-side; slotId, holdId, quoteId, and offeringVersion are not accepted. Idempotency-Key is required."
          swaggerTags:
            - Bookings
          bodyType: CreateBookingRequest
          responseData:
            201:
              description: "Booking created"
          documentation:
            summary: Create booking
            description: Creates a PENDING_PAYMENT booking from a selected civil date/time. Customer identity and authoritative price are server-assigned; slotId, holdId, quoteId, and offeringVersion are not accepted. Idempotency-Key is required.
            requestModels:
              application/json: CreateBookingRequest
            tags:
              - Bookings
            methodResponses:
              - statusCode: "201"
                responseBody:
                  description: Booking created
                responseModels:
                  application/json: Booking
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
            requestBody:
              description: Create booking request. Does not accept quoteId or totalAmount.
              required: true


  getbookingid:
    handler: src/handlers/bookingsHandler.handleGetbookingid
    events:
      - http:
          path: /bookings/{bookingId}
          method: get
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Get booking"
          swaggerTags:
            - Bookings
          responseData:
            200:
              description: "Booking"
              bodyType: Booking
          documentation:
            summary: Get booking
            description: Get booking
            tags:
              - Bookings
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Booking
                responseModels:
                  application/json: Booking
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
            pathParams:
              - name: bookingId
                description: bookingId
                schema:
                  type: string


  deletebookingid:
    handler: src/handlers/bookingsHandler.handleDeletebookingid
    events:
      - http:
          path: /bookings/{bookingId}
          method: delete
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Cancel booking"
          swaggerTags:
            - Bookings
          responseData:
            204:
              description: "Cancelled"
          documentation:
            summary: Cancel booking
            description: Cancel booking
            tags:
              - Bookings
            methodResponses:
              - statusCode: "204"
                responseBody:
                  description: Cancelled
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
            pathParams:
              - name: bookingId
                description: bookingId
                schema:
                  type: string


  confirmPaidBooking:
    handler: src/handlers/internal.confirmPaidBooking

  failPaymentBooking:
    handler: src/handlers/internal.failPaymentBooking


  postcheckin:
    handler: src/handlers/bookingsHandler.handlePostcheckin
    events:
      - http:
          path: /bookings/{bookingId}/check-in
          method: post
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Customer check-in"
          swaggerTags:
            - Bookings
          responseData:
            200:
              description: "Checked in"
          documentation:
            summary: Customer check-in
            description: Customer check-in
            tags:
              - Bookings
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Checked in
                responseModels:
                  application/json: Booking
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
            pathParams:
              - name: bookingId
                description: bookingId
                schema:
                  type: string


  poststart:
    handler: src/handlers/bookingsHandler.handlePoststart
    events:
      - http:
          path: /bookings/{bookingId}/start
          method: post
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Start service"
          swaggerTags:
            - Bookings
          responseData:
            200:
              description: "In progress"
          documentation:
            summary: Start service
            description: Start service
            tags:
              - Bookings
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: In progress
                responseModels:
                  application/json: Booking
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
            pathParams:
              - name: bookingId
                description: bookingId
                schema:
                  type: string


  postcomplete:
    handler: src/handlers/bookingsHandler.handlePostcomplete
    events:
      - http:
          path: /bookings/{bookingId}/complete
          method: post
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Complete booking"
          swaggerTags:
            - Bookings
          responseData:
            200:
              description: "Completed"
          documentation:
            summary: Complete booking
            description: Complete booking
            tags:
              - Bookings
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Completed
                responseModels:
                  application/json: Booking
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
            pathParams:
              - name: bookingId
                description: bookingId
                schema:
                  type: string


  postcancel:
    handler: src/handlers/bookingsHandler.handlePostcancel
    events:
      - http:
          path: /bookings/{bookingId}/cancel
          method: post
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Cancel booking"
          swaggerTags:
            - Bookings
          responseData:
            200:
              description: "Cancelled"
          documentation:
            summary: Cancel booking
            description: Cancel booking
            tags:
              - Bookings
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Cancelled
                responseModels:
                  application/json: Booking
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
            pathParams:
              - name: bookingId
                description: bookingId
                schema:
                  type: string


  getcustomerbookings:
    handler: src/handlers/bookingsHandler.handleGetbookings
    events:
      - http:
          path: /customers/{customerId}/bookings
          method: get
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Customer booking history"
          swaggerTags:
            - Bookings
          responseData:
            200:
              description: "History"
          documentation:
            summary: Customer booking history
            description: Customer booking history
            tags:
              - Bookings
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: History
                responseModels:
                  application/json: BookingPage
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
            pathParams:
              - name: customerId
                description: customerId
                schema:
                  type: string


  getvendorbookings:
    handler: src/handlers/bookingsHandler.handleGetbookings
    events:
      - http:
          path: /vendors/{vendorId}/bookings
          method: get
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Vendor bookings"
          swaggerTags:
            - Bookings
          responseData:
            200:
              description: "Vendor bookings"
          documentation:
            summary: Vendor bookings
            description: Vendor bookings
            tags:
              - Bookings
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Vendor bookings
                responseModels:
                  application/json: BookingPage
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
            pathParams:
              - name: vendorId
                description: vendorId
                schema:
                  type: string


resources:
  Resources:
    GatewayResponseDefault4XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: DEFAULT_4XX
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: >-
            'Content-Type,Authorization,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent,Sec-Ch-Ua,Sec-Ch-Ua-Mobile,Sec-Ch-Ua-Platform'
          gatewayresponse.header.Access-Control-Allow-Methods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"

    GatewayResponseDefault5XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: DEFAULT_5XX
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: >-
            'Content-Type,Authorization,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent,Sec-Ch-Ua,Sec-Ch-Ua-Mobile,Sec-Ch-Ua-Platform'
          gatewayresponse.header.Access-Control-Allow-Methods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"

    GatewayResponseUnauthorized:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: UNAUTHORIZED
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: >-
            'Content-Type,Authorization,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent,Sec-Ch-Ua,Sec-Ch-Ua-Mobile,Sec-Ch-Ua-Platform'
          gatewayresponse.header.Access-Control-Allow-Methods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"

    GatewayResponseAccessDenied:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: ACCESS_DENIED
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: >-
            'Content-Type,Authorization,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent,Sec-Ch-Ua,Sec-Ch-Ua-Mobile,Sec-Ch-Ua-Platform'
          gatewayresponse.header.Access-Control-Allow-Methods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"

  
    BookingTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain

      Properties:
        TableName: ${self:custom.booking}

        BillingMode: PAY_PER_REQUEST

        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

        SSESpecification:
          SSEEnabled: true

        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S

          - AttributeName: SK
            AttributeType: S

          - AttributeName: GSI1PK
            AttributeType: S

          - AttributeName: GSI1SK
            AttributeType: S

          - AttributeName: GSI2PK
            AttributeType: S

          - AttributeName: GSI2SK
            AttributeType: S

          - AttributeName: GSI3PK
            AttributeType: S

          - AttributeName: GSI3SK
            AttributeType: S

        KeySchema:
          - AttributeName: PK
            KeyType: HASH

          - AttributeName: SK
            KeyType: RANGE

        GlobalSecondaryIndexes:

          - IndexName: GSI1

            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH

              - AttributeName: GSI1SK
                KeyType: RANGE

            Projection:
              ProjectionType: ALL

          - IndexName: GSI2

            KeySchema:
              - AttributeName: GSI2PK
                KeyType: HASH

              - AttributeName: GSI2SK
                KeyType: RANGE

            Projection:
              ProjectionType: ALL

          - IndexName: GSI3

            KeySchema:
              - AttributeName: GSI3PK
                KeyType: HASH

              - AttributeName: GSI3SK
                KeyType: RANGE

            Projection:
              ProjectionType: ALL

        Tags:
          - Key: Service
            Value: booking

          - Key: Environment
            Value: ${self:provider.stage}

          - Key: ManagedBy
            Value: Serverless
