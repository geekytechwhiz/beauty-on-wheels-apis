service: booking-service

frameworkVersion: "3"

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-auto-swagger
  - serverless-openapi-documenter
  - serverless-offline


provider:
  name: aws
  runtime: nodejs22.x

  stage: ${opt:stage,'dev'}

  region: ${opt:region,'us-east-1'}

  versionFunctions: false

  environment:
    CORS_ALLOWED_ORIGINS: ${self:custom.corsAllowedOrigins}

    SERVICE_NAME: booking-service
    # LOG_LEVEL: ${ssm:/common/log-level}
    DYNAMODB_TABLE_NAME: ${self:provider.environment.BOOKING_TABLE}
    BOOKING_TABLE: booking-table-${self:provider.stage}
    CATALOG_BASE_URL: ${env:CATALOG_BASE_URL, ''}
    VENDOR_BASE_URL: ${env:VENDOR_BASE_URL, ''}
    VENDOR_CHECKOUT_ELIGIBILITY_FUNCTION: vendor-service-api-${self:provider.stage}-getCheckoutEligibility
    USER_BASE_URL: ${env:USER_BASE_URL, ''}
    VEHICLE_BASE_URL: ${env:VEHICLE_BASE_URL, ''}
    AVAILABILITY_BASE_URL: ${env:AVAILABILITY_BASE_URL, ''}
    AVAILABILITY_RESERVE_BOOKING_FUNCTION: availability-service-${self:provider.stage}-reserveBooking
    AVAILABILITY_CONSUME_HOLD_FUNCTION: availability-service-${self:provider.stage}-consumeHold
    AVAILABILITY_RELEASE_ALLOCATION_FUNCTION: availability-service-${self:provider.stage}-releaseAllocation
    # Turn on only after catalog GSI3 is ACTIVE, the backfill is verified, and catalog enforcement is on.
    COMMUNITY_OFFERING_ENFORCEMENT: 'false'
    # Sandbox payment completion for local/dev/staging. Set false when a real gateway owns confirmation.
    PAYMENT_SANDBOX_ENABLED: ${env:PAYMENT_SANDBOX_ENABLED, 'true'}
    # EVENT_BUS_NAME: ${ssm:/common/eventbus/name}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:BatchGetItem
            - dynamodb:BatchWriteItem
            - dynamodb:TransactWriteItems
            - dynamodb:TransactGetItems
            - dynamodb:DescribeTable
          Resource:
            - !GetAtt BookingTable.Arn
            - !Join [ "/", [ !GetAtt BookingTable.Arn, "index", "*" ] ]
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource:
            - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:provider.environment.AVAILABILITY_RESERVE_BOOKING_FUNCTION}
            - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:provider.environment.AVAILABILITY_CONSUME_HOLD_FUNCTION}
            - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:provider.environment.AVAILABILITY_RELEASE_ALLOCATION_FUNCTION}
            - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:provider.environment.VENDOR_CHECKOUT_ELIGIBILITY_FUNCTION}

custom:
  httpCors: ${file(../../infra/serverless/config/rest-api-cors.yml)}
  corsAllowedOrigins: ${file(../../infra/serverless/config/cors-allowed-origins.yml):value}

  securedAuthorizer: ${file(../../infra/serverless/config/http-api-authorizer.yml)}


  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    concurrency: 10
    plugins: ./esbuild-plugins.js
  booking: booking-table-${self:provider.stage}
  autoswagger:
    title: "Beauty on Wheels - Booking Service API"
    apiType: http
    basePath: /${self:provider.stage}
    schemes:
      - https
      - http
    generateSwaggerOnDeploy: true
    swaggerFiles:
      - swagger.json
    useStage: true
    swaggerPath: swagger
    typefiles:
      - ./src/types/api-types.d.ts
    excludeStages:
      - production


  documentation:
    version: 1.0.0
    title: Beauty on Wheels - Booking Service API
    description: Create and manage customer bookings and booking lifecycle transitions.
    securitySchemes:
      bearerAuth:
        type: http
        scheme: bearer
        bearerFormat: JWT
    security:
      - bearerAuth: []
    servers:
      - url: https://{apiId}.execute-api.us-east-1.amazonaws.com/{stage}
        description: Deployed API Gateway stage
        variables:
          apiId:
            default: localhost
            description: API Gateway id
          stage:
            default: dev
            description: Deployment stage
    tags:
      - name: Bookings
        description: Customer and vendor bookings
      - name: Payments
        description: Customer booking payments
      - name: Reviews
        description: Customer booking reviews
      - name: Customer Plans
        description: Recurring package plans (never ON_DEMAND bookings)
      - name: Booking Changes
        description: Preview and commit a provider or service change
    models:
      - name: VehicleDetails
        description: Vehicle snapshot stored on a booking
        content:
          application/json:
            schema:
              type: object
              properties:
                bodyCategory:
                  type: string
                makeModel:
                  type: string
                saveToGarage:
                  type: boolean
      - name: CreateBookingRequest
        description: Create booking. Price and customer identity are server-assigned.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - vendorId
                - branchId
                - vehicleId
                - offeringId
                - schedule
                - location
                - addOnIds
                - expectedPrice
              properties:
                vendorId:
                  type: string
                branchId:
                  type: string
                vehicleId:
                  type: string
                offeringId:
                  type: string
                schedule:
                  type: object
                  required:
                    - date
                    - startTime
                    - timezone
                  properties:
                    date:
                      type: string
                      format: date
                    startTime:
                      type: string
                      pattern: '^\\d{2}:\\d{2}$'
                    timezone:
                      type: string
                location:
                  type: object
                  required:
                    - fulfilmentType
                  properties:
                    fulfilmentType:
                      type: string
                      enum:
                        - community
                        - address
                        - COMMUNITY
                        - ADDRESS
                    communityId:
                      type: string
                    addressId:
                      type: string
                addOnIds:
                  type: array
                  items:
                    type: string
                expectedPrice:
                  type: object
                  required:
                    - totalMinor
                    - currency
                  properties:
                    totalMinor:
                      type: integer
                      minimum: 0
                    currency:
                      type: string
                      pattern: '^[A-Za-z]{3}$'
                notes:
                  type: string
                  maxLength: 2000
      - name: Booking
        description: Customer booking
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                reference:
                  type: string
                customerId:
                  type: string
                vendorId:
                  type: string
                vendorName:
                  type: string
                vehicleId:
                  type: string
                branchName:
                  type: string
                vehicleDetails:
                  type: object
                  properties:
                    bodyCategory:
                      type: string
                    makeModel:
                      type: string
                    type:
                      type: string
                    brand:
                      type: string
                    model:
                      type: string
                    registrationNumber:
                      type: string
                    saveToGarage:
                      type: boolean
                serviceIds:
                  type: array
                  items:
                    type: string
                bookingDate:
                  type: string
                slotId:
                  type: string
                branchId:
                  type: string
                offeringId:
                  type: string
                offeringVersion:
                  type: integer
                service:
                  type: object
                  properties:
                    serviceId:
                      type: string
                    name:
                      type: string
                    categoryId:
                      type: string
                    offeringId:
                      type: string
                    durationMinutes:
                      type: integer
                addOns:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      price:
                        type: number
                      priceMinor:
                        type: integer
                schedule:
                  type: object
                  properties:
                    date:
                      type: string
                      format: date
                    startTime:
                      type: string
                    endTime:
                      type: string
                    durationMinutes:
                      type: integer
                    timezone:
                      type: string
                    startAtUtc:
                      type: string
                      format: date-time
                    endAtUtc:
                      type: string
                      format: date-time
                holdId:
                  type: string
                location:
                  type: object
                  properties:
                    fulfilmentType:
                      type: string
                      enum:
                        - community
                        - address
                    communityId:
                      type: string
                    addressId:
                      type: string
                    details:
                      type: object
                      additionalProperties:
                        type: string
                pricingSnapshot:
                  type: object
                  properties:
                    offeringId:
                      type: string
                    offeringVersion:
                      type: integer
                      description: Effective offering revision returned by Service Catalog pricing.
                    catalogVersion:
                      type: integer
                      description: Catalog service version captured with the price.
                    vendorPricingVersion:
                      type: integer
                      minimum: 0
                      description: Vendor overlay version captured with the price. Zero means no overlay.
                    baseAmount:
                      type: number
                    addOnAmount:
                      type: number
                    subtotalAmount:
                      type: number
                    discountAmount:
                      type: number
                    taxAmount:
                      type: number
                    totalAmount:
                      type: number
                    baseMinor:
                      type: integer
                    addOnMinor:
                      type: integer
                    subtotalMinor:
                      type: integer
                    discountMinor:
                      type: integer
                    taxMinor:
                      type: integer
                    totalMinor:
                      type: integer
                    currency:
                      type: string
                totalAmount:
                  type: number
                paymentMethod:
                  type: string
                notes:
                  type: string
                createdAt:
                  type: string
                  format: date-time
                updatedAt:
                  type: string
                  format: date-time
                paymentStatus:
                  type: string
                  enum:
                    - PENDING
                    - PAID
                    - FAILED
                    - REFUNDED
                bookingStatus:
                  type: string
                  enum:
                    - CREATED
                    - PENDING
                    - PENDING_PAYMENT
                    - CONFIRMED
                    - CHECKED_IN
                    - IN_PROGRESS
                    - COMPLETED
                    - CANCELLED
      - name: BookingPage
        description: Page of bookings
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      customerId:
                        type: string
                      vendorId:
                        type: string
                      vendorName:
                        type: string
                      branchId:
                        type: string
                      branchName:
                        type: string
                      vehicleId:
                        type: string
                      vehicleDetails:
                        type: object
                        properties:
                          bodyCategory:
                            type: string
                          makeModel:
                            type: string
                          saveToGarage:
                            type: boolean
                      serviceIds:
                        type: array
                        items:
                          type: string
                      bookingDate:
                        type: string
                      schedule:
                        type: object
                        properties:
                          date:
                            type: string
                          startTime:
                            type: string
                          endTime:
                            type: string
                          timezone:
                            type: string
                      slotId:
                        type: string
                      totalAmount:
                        type: number
                      pricingSnapshot:
                        type: object
                        properties:
                          totalMinor:
                            type: integer
                          currency:
                            type: string
                      paymentMethod:
                        type: string
                      paymentStatus:
                        type: string
                        enum:
                          - PENDING
                          - PAID
                          - FAILED
                          - REFUNDED
                      bookingStatus:
                        type: string
                        enum:
                          - CREATED
                          - PENDING
                          - PENDING_PAYMENT
                          - CONFIRMED
                          - CHECKED_IN
                          - IN_PROGRESS
                          - COMPLETED
                          - CANCELLED
      - name: ErrorResponse
        description: Platform error envelope
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                statusCode:
                  type: integer
                message:
                  type: object
                  properties:
                    title:
                      type: string
                    description:
                      type: string
                    severity:
                      type: string
                data:
                  type: object
                  properties: {}
                error:
                  type: object
                  properties:
                    code:
                      type: string
                    details:
                      type: array
                      items:
                        type: object
                        properties:
                          field:
                            type: string
                          message:
                            type: string
                meta:
                  type: object
                  properties:
                    correlationId:
                      type: string
                    timestamp:
                      type: string
                    version:
                      type: string
      - name: PlanVisitWindow
        description: Provider-coordinated recurring visit window
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [preferredDays, startTime, endTime, timezone]
              properties:
                preferredDays:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: [MON, TUE, WED, THU, FRI, SAT, SUN]
                startTime:
                  type: string
                  pattern: '^\\d{2}:\\d{2}$'
                endTime:
                  type: string
                  pattern: '^\\d{2}:\\d{2}$'
                timezone:
                  type: string
      - name: CreateCustomerPlanRequest
        description: >
          Purchase a catalog PACKAGE offering as a customer plan. Not an ON_DEMAND booking
          and not Availability slot or branch reservation. visitWindowId is a catalog preference;
          the provider coordinates exact visit times. Final price comes from the offering
          vehicle price for the selected vehicle. Community eligibility is validated against
          the offering; branchId is not accepted.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [vendorId, vehicleId, location, visitWindowId, autoRenew, expectedPrice]
              properties:
                vendorId:
                  type: string
                offeringId:
                  type: string
                  description: Catalog PACKAGE offering id (preferred).
                packageId:
                  type: string
                  description: Alias of offeringId for UI compatibility.
                vehicleId:
                  type: string
                location:
                  type: object
                  additionalProperties: false
                  required: [fulfilmentType]
                  properties:
                    fulfilmentType:
                      type: string
                      enum: [community, address, COMMUNITY, ADDRESS]
                    communityId:
                      type: string
                    addressId:
                      type: string
                visitWindowId:
                  type: string
                  description: Stable id from the offering visitWindows preference list.
                autoRenew:
                  type: boolean
                  description: Customer renewal choice; applied only when true.
                expectedPrice:
                  type: object
                  additionalProperties: false
                  required: [totalMinor, currency]
                  properties:
                    totalMinor:
                      type: integer
                      minimum: 0
                      description: >
                        Final customer price for the selected vehicle after catalog minor→major
                        conversion (INR rupees integer). Must match the resolved offering price.
                    currency:
                      type: string
                      pattern: '^[A-Za-z]{3}$'
              example:
                vendorId: vend_demo_001
                offeringId: offr_premium_weekly_wash
                vehicleId: veh_customer_001
                location:
                  fulfilmentType: community
                  communityId: comm_demo_001
                visitWindowId: morning
                autoRenew: true
                expectedPrice:
                  totalMinor: 1499
                  currency: INR
      - name: CustomerPlan
        description: >
          Saved package plan. Billing period start/end and ACTIVE status are set when the
          linked first job starts (IN_PROGRESS), not at plan creation or payment time.
          Package plans are community-based; branchId is not required.
        content:
          application/json:
            schema:
              type: object
              properties:
                planId:
                  type: string
                offeringId:
                  type: string
                packageId:
                  type: string
                packageName:
                  type: string
                vendorId:
                  type: string
                vehicleId:
                  type: string
                vehicleType:
                  type: string
                status:
                  type: string
                  enum: [PENDING_PAYMENT, AWAITING_FIRST_JOB, ACTIVE]
                paymentStatus:
                  type: string
                  enum: [PENDING, PAID]
                billingPeriod:
                  type: string
                  enum: [oneTime, weekly, monthly, yearly]
                cadence:
                  type: string
                  enum: [WEEKLY, BIWEEKLY, MONTHLY, YEARLY, ONE_TIME]
                remainingVisits:
                  type: integer
                entitlements:
                  type: array
                  items:
                    type: object
                    properties:
                      serviceId:
                        type: string
                      quantity:
                        type: integer
                includedServices:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      description:
                        type: string
                      categoryId:
                        type: string
                      tags:
                        type: array
                        items:
                          type: string
                      visitsPerPeriod:
                        type: integer
                      durationMinutes:
                        type: integer
                        description: One visit duration
                visitWindowId:
                  type: string
                visitWindow:
                  type: object
                  properties:
                    visitWindowId:
                      type: string
                    label:
                      type: string
                    allDay:
                      type: boolean
                    startTime:
                      type: string
                    endTime:
                      type: string
                    preferredDays:
                      type: array
                      items:
                        type: string
                    timezone:
                      type: string
                location:
                  type: object
                  properties:
                    fulfilmentType:
                      type: string
                    communityId:
                      type: string
                    addressId:
                      type: string
                pricingSnapshot:
                  type: object
                  properties:
                    totalAmount:
                      type: number
                    totalMinor:
                      type: integer
                    currency:
                      type: string
                    packageId:
                      type: string
                    offeringId:
                      type: string
                    packageName:
                      type: string
                    packageVersion:
                      type: integer
                    vehicleType:
                      type: string
                    durationMinutes:
                      type: integer
                      description: Package-total duration for the selected vehicle
                autoRenew:
                  type: boolean
                firstJobId:
                  type: string
                billingPeriodStart:
                  type: string
                  description: Set when the first job starts
                billingPeriodEnd:
                  type: string
                createdAt:
                  type: string
                updatedAt:
                  type: string
                activatedAt:
                  type: string
                  description: Payment completion time (plan may still await first job)
              example:
                planId: plan_demo_001
                offeringId: offr_premium_weekly_wash
                packageId: offr_premium_weekly_wash
                packageName: Premium weekly wash
                vendorId: vend_demo_001
                vehicleId: veh_customer_001
                vehicleType: HATCHBACK
                status: AWAITING_FIRST_JOB
                paymentStatus: PAID
                billingPeriod: weekly
                cadence: WEEKLY
                remainingVisits: 6
                entitlements:
                  - serviceId: Exterior wash
                    quantity: 4
                  - serviceId: Interior vacuum
                    quantity: 2
                includedServices:
                  - name: Exterior wash
                    description: Foam wash and dry
                    categoryId: cat_wash
                    tags:
                      - exterior
                    visitsPerPeriod: 4
                    durationMinutes: 30
                  - name: Interior vacuum
                    categoryId: cat_detail
                    visitsPerPeriod: 2
                    durationMinutes: 25
                visitWindowId: morning
                visitWindow:
                  visitWindowId: morning
                  label: Morning (8:00–12:00)
                  startTime: '08:00'
                  endTime: '12:00'
                location:
                  fulfilmentType: community
                  communityId: comm_demo_001
                pricingSnapshot:
                  totalAmount: 1499
                  totalMinor: 1499
                  currency: INR
                  packageId: offr_premium_weekly_wash
                  offeringId: offr_premium_weekly_wash
                  packageName: Premium weekly wash
                  packageVersion: 1
                  vehicleType: HATCHBACK
                  durationMinutes: 170
                autoRenew: true
                firstJobId: book_first_job_001
                createdAt: '2026-10-28T11:00:00.000Z'
                updatedAt: '2026-10-28T11:05:00.000Z'
                activatedAt: '2026-10-28T11:05:00.000Z'
      - name: BookingChangeRequest
        description: Preview or commit a provider/service change on an owned PENDING_PAYMENT or CONFIRMED booking.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [changeType, vendorId, branchId, offeringId, schedule]
              properties:
                changeType:
                  type: string
                  enum: [PROVIDER, SERVICE]
                vendorId:
                  type: string
                branchId:
                  type: string
                offeringId:
                  type: string
                schedule:
                  type: object
                  additionalProperties: false
                  required: [date, startTime, timezone]
                  properties:
                    date:
                      type: string
                      format: date
                    startTime:
                      type: string
                      pattern: '^\\d{2}:\\d{2}$'
                    timezone:
                      type: string
                expectedPrice:
                  type: object
                  additionalProperties: false
                  description: Optional on preview, required on commit.
                  required: [totalMinor, currency]
                  properties:
                    totalMinor:
                      type: integer
                      minimum: 0
                    currency:
                      type: string
                holdId:
                  type: string
      - name: BookingChangePreview
        description: Current vs proposed booking snapshots with price delta and payment impact. Reports impact only; no money moves.
        content:
          application/json:
            schema:
              type: object
              properties:
                bookingId:
                  type: string
                changeType:
                  type: string
                current:
                  type: object
                proposed:
                  type: object
                priceDeltaMinor:
                  type: integer
                currency:
                  type: string
                paymentImpact:
                  type: string
                  enum: [CHARGE, REFUND, NONE]
                bookingPaymentStatus:
                  type: string
                refundPolicy:
                  type: string
                  enum: [UNRESOLVED]
                settlementExecuted:
                  type: boolean
      - name: BookingChangeResult
        description: Committed booking change with the updated booking
        content:
          application/json:
            schema:
              type: object
              properties:
                changeId:
                  type: string
                bookingId:
                  type: string
                changeType:
                  type: string
                booking:
                  type: object
                  description: Updated booking (see Booking)
                priceDeltaMinor:
                  type: integer
                currency:
                  type: string
                paymentImpact:
                  type: string
                  enum: [CHARGE, REFUND, NONE]
                refundPolicy:
                  type: string
                  enum: [UNRESOLVED]
                settlementExecuted:
                  type: boolean
functions:


  getbookings:
    handler: src/handlers/bookingsHandler.handleGetbookings
    events:
      - http:
          path: /bookings
          method: get
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "List my bookings"
          description: "Lists bookings owned by the authenticated customer. Customer and vendor identifiers in query parameters are not accepted."
          swaggerTags:
            - Bookings
          responseData:
            200:
              description: "Booking list"
          documentation:
            summary: List my bookings
            description: Lists bookings owned by the authenticated customer.
            tags:
              - Bookings
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Booking list
                responseModels:
                  application/json: BookingPage
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
  postbookings:
    handler: src/handlers/bookingsHandler.handlePostbookings
    events:
      - http:
          path: /bookings
          method: post
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Create booking"
          description: "Creates a PENDING_PAYMENT booking from a selected civil date/time. Customer identity, service details, capacity, and pricing are validated server-side; slotId, holdId, quoteId, and offeringVersion are not accepted. Idempotency-Key is required."
          swaggerTags:
            - Bookings
          bodyType: CreateBookingRequest
          responseData:
            201:
              description: "Booking created"
          documentation:
            summary: Create booking
            description: Creates a PENDING_PAYMENT booking from a selected civil date/time. Customer identity and authoritative price are server-assigned; slotId, holdId, quoteId, and offeringVersion are not accepted. Idempotency-Key is required.
            requestModels:
              application/json: CreateBookingRequest
            tags:
              - Bookings
            methodResponses:
              - statusCode: "201"
                responseBody:
                  description: Booking created
                responseModels:
                  application/json: Booking
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
            requestBody:
              description: Create booking request. Does not accept quoteId or totalAmount.
              required: true


  getbookingid:
    handler: src/handlers/bookingsHandler.handleGetbookingid
    events:
      - http:
          path: /bookings/{bookingId}
          method: get
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Get booking"
          swaggerTags:
            - Bookings
          responseData:
            200:
              description: "Booking"
              bodyType: Booking
          documentation:
            summary: Get booking
            description: Get booking
            tags:
              - Bookings
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Booking
                responseModels:
                  application/json: Booking
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
            pathParams:
              - name: bookingId
                description: bookingId
