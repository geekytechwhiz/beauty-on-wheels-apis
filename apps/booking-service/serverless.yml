              - Customer Plans
            responseData:
              200:
                description: "Assignment removed"
              403:
                description: "Forbidden"
              404:
                description: "Visit not found"
              409:
                description: "Visit is not scheduled, or it changed concurrently"
            documentation:
              summary: Remove a crew assignment
              description: "Owner-only. Does not cancel the visit or release the availability reservation. In-progress and completed visits cannot be unassigned."
              tags:
                - Customer Plans
              methodResponses:
                - statusCode: "200"
                  responseBody:
                    description: Removal result
                - statusCode: "403"
                  responseBody:
                    description: Forbidden
                  responseModels:
                    application/json: ErrorResponse
                - statusCode: "404"
                  responseBody:
                    description: Visit not found
                  responseModels:
                    application/json: ErrorResponse
                - statusCode: "409"
                  responseBody:
                    description: Conflict
                  responseModels:
                    application/json: ErrorResponse
              pathParams:
                - name: vendorId
                  description: Vendor id. Must match the caller's owner membership.
                  schema:
                    type: string
                - name: visitId
                  description: Package visit id.
                  schema:
                    type: string

    liststaffassignedwork:
      handler: src/handlers/staff-assigned-work.handleListStaffAssignedWork
      events:
        - http:
            path: /staff/me/package-visits
            method: get
            cors: ${self:custom.httpCors}
            authorizer: ${self:custom.securedAuthorizer}
            summary: "List the signed-in staff member's assigned package visits"
            description: "Authenticated staff only. The caller cannot send vendorId, staffId, or crewId. Identity userId is resolved to an active staff record and that staff member's active crews. Owners, inactive staff, and other vendors receive 403. No crew assignment returns 200 with reason noCrewAssignment and an empty list. Defaults to today in Asia/Kolkata. Metrics count the full filtered range, not the current page. ordering is list, not an optimized wash sequence. Missing visit-window clocks are omitted rather than inferred from a label or a slot time. Vehicle registration, display name, and type are returned when stored on the visit. communityId is returned when stored. Customer name, street address, coordinates, and community name are not on the package visit and are omitted."
            swaggerTags:
              - Customer Plans
            queryStringParameters:
              date:
                required: false
                type: string
                description: Exact scheduled date YYYY-MM-DD. Defaults to today in Asia/Kolkata. Cannot be combined with fromDate or toDate.
              fromDate:
                required: false
                type: string
                description: Inclusive start date. Maximum range is 14 days.
              toDate:
                required: false
                type: string
                description: Inclusive end date.
              status:
                required: false
                type: string
                description: SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED, MISSED, BLOCKED, or UNSCHEDULED.
              limit:
                required: false
                type: integer
                description: Page size 1-50. Default 20. Metrics still cover the full range.
              nextToken:
                required: false
                type: string
                description: Opaque pagination token for the next page of items.
            responseData:
              200:
                description: "Assigned visits for the caller's crews"
              400:
                description: "Invalid date, status, limit, or nextToken"
              401:
                description: "Unauthenticated"
              403:
                description: "Owner, inactive staff, inactive vendor, or no staff membership"
              409:
                description: "Date range is too large to total"
            documentation:
              summary: List assigned package visits for the signed-in staff member
              description: "Resolves staff membership from the authorizer user id through Vendor Service. Returns visits whose crewAssignment matches an active crew that includes this active staff member. Community names are not looked up. windowTimeKnown is false when the plan did not store a start and end. crossesMidnight is true when the stored end is earlier than the start on the clock."
              tags:
                - Customer Plans
              queryParams:
                - name: date
                  required: false
                  schema:
                    type: string
                - name: fromDate
                  required: false
                  schema:
                    type: string
                - name: toDate
                  required: false
                  schema:
                    type: string
                - name: status
                  required: false
                  schema:
                    type: string
                    enum: [SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED, MISSED, BLOCKED, UNSCHEDULED]
                - name: limit
                  required: false
                  schema:
                    type: integer
                    minimum: 1
                    maximum: 50
                - name: nextToken
                  required: false
                  schema:
                    type: string
              methodResponses:
                - statusCode: "200"
                  responseBody:
                    description: "crews, metrics for the full range, items for this page, and nextToken. reason noCrewAssignment when the staff member has no active crew."
                  responseModels:
                    application/json: StaffAssignedWork
                - statusCode: "400"
                  responseBody:
                    description: Invalid filter
                  responseModels:
                    application/json: ErrorResponse
                - statusCode: "401"
                  responseBody:
                    description: Unauthenticated
                  responseModels:
                    application/json: ErrorResponse
                - statusCode: "403"
                  responseBody:
                    description: Forbidden
                  responseModels:
                    application/json: ErrorResponse
                - statusCode: "409"
                  responseBody:
                    description: Range is too large to total
                  responseModels:
                    application/json: ErrorResponse

    startstaffpackagevisit:
      handler: src/handlers/staff-assigned-work.handleStartStaffVisit
      events:
        - http:
            path: /staff/me/package-visits/{visitId}/start
            method: post
            cors: ${self:custom.httpCors}
            authorizer: ${self:custom.securedAuthorizer}
            summary: "Start an assigned package visit"
            description: "Authenticated staff only. Resolves the caller from the authorizer user id. Ignores any staffId, vendorId, or timestamp in the body. The visit must be assigned to an active crew that includes this active staff member. SCHEDULED becomes IN_PROGRESS. An in-progress visit returns idempotent true without another write. Server startedAt and startedBy are stored. One-time bookings are not updated."
            swaggerTags:
              - Customer Plans
            responseData:
              200:
                description: "Visit is in progress"
              401:
                description: "Unauthenticated"
              403:
                description: "Not active staff, or the visit is not on the caller's crew"
              404:
                description: "Visit not found for this staff member's vendor"
              409:
                description: "Status cannot move to IN_PROGRESS"
            documentation:
              summary: Start an assigned package visit
              description: "SCHEDULED to IN_PROGRESS using the server clock. Already in progress is idempotent. Does not consume entitlement."
              tags:
                - Customer Plans
              pathParams:
                - name: visitId
                  description: Package visit id.
                  schema:
                    type: string
              methodResponses:
                - statusCode: "200"
                  responseBody:
                    description: "visitId, status IN_PROGRESS, startedAt, entitlementConsumed false, and idempotent."
                  responseModels:
                    application/json: StaffVisitAction
                - statusCode: "403"
                  responseBody:
                    description: Forbidden
                  responseModels:
                    application/json: ErrorResponse
                - statusCode: "404"
                  responseBody:
                    description: Visit not found
                  responseModels:
                    application/json: ErrorResponse
                - statusCode: "409"
                  responseBody:
                    description: Invalid transition
                  responseModels:
                    application/json: ErrorResponse

    completestaffpackagevisit:
      handler: src/handlers/staff-assigned-work.handleCompleteStaffVisit
      events:
        - http:
            path: /staff/me/package-visits/{visitId}/complete
            method: post
            cors: ${self:custom.httpCors}
            authorizer: ${self:custom.securedAuthorizer}
            summary: "Complete an assigned package visit"
            description: "Authenticated staff only. Same identity rules as start. Requires Idempotency-Key. IN_PROGRESS becomes COMPLETED and consumes one package entitlement. A visit that is already COMPLETED with entitlementConsumed returns idempotent true and does not consume again. A client timestamp is ignored. One-time booking completion is a different route and is not called. Body is required: checklist (non-empty, every item done true) and optional evidenceObjectKeys uploaded through the evidence upload-url route. A blocking OPEN, TRIAGED or ACTION_REQUIRED issue on the visit returns 409 BLOCKING_ISSUE_OPEN. The visit becomes COMPLETED with validationStatus PENDING_REVIEW and payoutEligible false until ops approve it."
            swaggerTags:
              - Customer Plans
            responseData:
              200:
                description: "Visit is completed"
              400:
                description: "Idempotency-Key is missing"
              401:
                description: "Unauthenticated"
              403:
                description: "Not active staff, or the visit is not on the caller's crew"
              404:
                description: "Visit not found for this staff member's vendor"
              409:
                description: "Status cannot move to COMPLETED, or a concurrent write conflict"
            documentation:
              summary: Complete an assigned package visit
              description: "IN_PROGRESS to COMPLETED. Entitlement is consumed once by the existing package-visit completion write. Body is required: checklist (non-empty, every item done true) and optional evidenceObjectKeys uploaded through the evidence upload-url route. A blocking OPEN, TRIAGED or ACTION_REQUIRED issue on the visit returns 409 BLOCKING_ISSUE_OPEN. The visit becomes COMPLETED with validationStatus PENDING_REVIEW and payoutEligible false until ops approve it."
              tags:
                - Customer Plans
              pathParams:
                - name: visitId
                  description: Package visit id.
                  schema:
                    type: string
              requestHeaders:
                - name: Idempotency-Key
                  description: Required. Retries of an already completed visit return the stored visit.
                  schema:
                    type: string
              methodResponses:
                - statusCode: "200"
                  responseBody:
                    description: "visitId, status COMPLETED, completedAt, entitlementConsumed true, and idempotent."
                  responseModels:
                    application/json: StaffVisitAction
                - statusCode: "400"
                  responseBody:
                    description: Missing idempotency key, or an invalid or incomplete checklist
                  responseModels:
                    application/json: ErrorResponse
                - statusCode: "409"
                  responseBody:
                    description: Invalid transition, open blocking issue, evidence not uploaded, or concurrent conflict
                  responseModels:
                    application/json: ErrorResponse

    missstaffpackagevisit:
      handler: src/handlers/staff-assigned-work.handleMissStaffVisit
      events:
        - http:
            path: /staff/me/package-visits/{visitId}/miss
            method: post
            cors: ${self:custom.httpCors}
            authorizer: ${self:custom.securedAuthorizer}
            summary: "Mark an assigned package visit missed"
            description: "Authenticated staff only. Same identity rules as start. SCHEDULED becomes MISSED only when the server clock is past the stored visit-window end. A missing window clock returns 409 WINDOW_CLOCK_UNKNOWN. An open window returns 409 WINDOW_NOT_ELAPSED. Body timestamps are ignored. entitlementConsumed stays false, so the entitlement is not consumed. The availability reservation is not released. Already missed returns idempotent true. IN_PROGRESS cannot move to MISSED."
            swaggerTags:
              - Customer Plans
            responseData:
              200:
                description: "Visit is missed"
              401:
                description: "Unauthenticated"
              403:
                description: "Not active staff, or the visit is not on the caller's crew"
              404:
                description: "Visit not found for this staff member's vendor"
              409:
                description: "Window has not ended, the clock is unknown, or the status cannot move to MISSED"
            documentation:
              summary: Mark an assigned package visit missed
              description: "SCHEDULED to MISSED using the stored window and the server clock. Does not consume entitlement."
              tags:
                - Customer Plans
              pathParams:
                - name: visitId
                  description: Package visit id.
                  schema:
                    type: string
              methodResponses:
                - statusCode: "200"
                  responseBody:
                    description: "visitId, status MISSED, missedAt, entitlementConsumed false, and idempotent."
                  responseModels:
                    application/json: StaffVisitAction
                - statusCode: "409"
                  responseBody:
                    description: Window or transition conflict
                  responseModels:
                    application/json: ErrorResponse

