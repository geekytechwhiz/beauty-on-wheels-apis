          path: /customer-plans/{planId}/visits/{visitId}/complete
          method: post
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Complete a package visit"
          description: "Vendor staff only. Idempotent entitlement consumption; Idempotency-Key required. Customers cannot complete visits."
          swaggerTags:
            - Customer Plans
          responseData:
            200:
              description: "Visit completed"
          documentation:
            summary: Complete a package visit
            description: Vendor staff only. Idempotent entitlement consumption; Idempotency-Key required. Customers cannot complete visits.
            tags:
              - Customer Plans
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Visit completed
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
            pathParams:
              - name: planId
                description: planId
                schema:
                  type: string
              - name: visitId
                description: visitId
                schema:
                  type: string

  confirmplanvisitschedules:
    handler: src/handlers/customer-plans.handleConfirmPlanVisitSchedules
    events:
      - http:
          path: /customer-plans/{planId}/visits/confirm-schedules
          method: post
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Confirm schedules for multiple package visits"
          description: "Vendor staff only. Sequentially reserves each visit. Returns PARTIAL scheduleState when some reservations fail; never marks COMPLETE while UNSCHEDULED visits remain. Idempotency-Key required."
          swaggerTags:
            - Customer Plans
          responseData:
            201:
              description: "Schedule confirmation result"
          documentation:
            summary: Confirm schedules for multiple package visits
            description: Vendor staff only. Sequentially reserves each visit. Returns PARTIAL scheduleState when some reservations fail; never marks COMPLETE while UNSCHEDULED visits remain. Idempotency-Key required.
            tags:
              - Customer Plans
            methodResponses:
              - statusCode: "201"
                responseBody:
                  description: Schedule confirmation result
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
            pathParams:
              - name: planId
                description: planId
                schema:
                  type: string

  postbookingchangepreview:
    handler: src/handlers/booking-changes.handlePostBookingChangePreview
    events:
      - http:
          path: /bookings/{bookingId}/changes/preview
          method: post
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Preview booking provider/service change"
          description: "Owner-only. PENDING_PAYMENT or CONFIRMED bookings only. Returns current vs proposed snapshots, priceDeltaMinor and paymentImpact (CHARGE, REFUND, NONE). Reports impact only; no money moves and refund policy is unresolved."
          swaggerTags:
            - Booking Changes
          bodyType: BookingChangeRequest
          responseData:
            200:
              description: "Preview booking provider/service change"
          documentation:
            summary: Preview booking provider/service change
            description: Owner-only. PENDING_PAYMENT or CONFIRMED bookings only. Returns current vs proposed snapshots, priceDeltaMinor and paymentImpact (CHARGE, REFUND, NONE). Reports impact only; no money moves and refund policy is unresolved.
            tags:
              - Booking Changes
            requestModels:
              application/json: BookingChangeRequest
            requestBody:
              description: Owner-only. PENDING_PAYMENT or CONFIRMED bookings only. Returns current vs proposed snapshots, priceDeltaMinor and paymentImpact (CHARGE, REFUND, NONE). Reports impact only; no money moves and refund policy is unresolved.
              required: true
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Preview booking provider/service change
                responseModels:
                  application/json: BookingChangePreview
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
            pathParams:
              - name: bookingId
                description: bookingId
                schema:
                  type: string

  postbookingchange:
    handler: src/handlers/booking-changes.handlePostBookingChange
    events:
      - http:
          path: /bookings/{bookingId}/changes
          method: post
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Commit booking provider/service change"
          description: "Owner-only. Revalidates coverage, price and availability, reserves new capacity, swaps the snapshot and releases the old allocation. On failure the original booking is kept. Idempotency-Key and expectedPrice are required. Package-plan bookings return 409 PACKAGE_CHANGE_NOT_ALLOWED."
          swaggerTags:
            - Booking Changes
          bodyType: BookingChangeRequest
          responseData:
            200:
              description: "Commit booking provider/service change"
          documentation:
            summary: Commit booking provider/service change
            description: Owner-only. Revalidates coverage, price and availability, reserves new capacity, swaps the snapshot and releases the old allocation. On failure the original booking is kept. Idempotency-Key and expectedPrice are required. Package-plan bookings return 409 PACKAGE_CHANGE_NOT_ALLOWED.
            tags:
              - Booking Changes
            requestModels:
              application/json: BookingChangeRequest
            requestBody:
              description: Owner-only. Revalidates coverage, price and availability, reserves new capacity, swaps the snapshot and releases the old allocation. On failure the original booking is kept. Idempotency-Key and expectedPrice are required. Package-plan bookings return 409 PACKAGE_CHANGE_NOT_ALLOWED.
              required: true
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Commit booking provider/service change
                responseModels:
                  application/json: BookingChangeResult
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
            pathParams:
              - name: bookingId
                description: bookingId
                schema:
                  type: string


resources:
  Resources:
    GatewayResponseDefault4XX: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseDefault4XX}

    GatewayResponseDefault5XX: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseDefault5XX}

    GatewayResponseUnauthorized: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseUnauthorized}

    GatewayResponseAccessDenied: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseAccessDenied}

    GatewayResponseMissingAuthenticationToken: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseMissingAuthenticationToken}
    GatewayResponseExpiredToken: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseExpiredToken}
    GatewayResponseIntegrationFailure: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseIntegrationFailure}
    GatewayResponseIntegrationTimeout: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseIntegrationTimeout}

    BookingTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain

      Properties:
        TableName: ${self:custom.booking}

        BillingMode: PAY_PER_REQUEST

        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

        SSESpecification:
          SSEEnabled: true

        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S

          - AttributeName: SK
            AttributeType: S

          - AttributeName: GSI1PK
            AttributeType: S

          - AttributeName: GSI1SK
            AttributeType: S

          - AttributeName: GSI2PK
            AttributeType: S

          - AttributeName: GSI2SK
            AttributeType: S

          - AttributeName: GSI3PK
            AttributeType: S

          - AttributeName: GSI3SK
            AttributeType: S

        KeySchema:
          - AttributeName: PK
            KeyType: HASH

          - AttributeName: SK
            KeyType: RANGE

        GlobalSecondaryIndexes:

          - IndexName: GSI1

            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH

              - AttributeName: GSI1SK
                KeyType: RANGE

            Projection:
              ProjectionType: ALL

          - IndexName: GSI2

            KeySchema:
              - AttributeName: GSI2PK
                KeyType: HASH

              - AttributeName: GSI2SK
                KeyType: RANGE

            Projection:
              ProjectionType: ALL

          - IndexName: GSI3

            KeySchema:
              - AttributeName: GSI3PK
                KeyType: HASH

              - AttributeName: GSI3SK
                KeyType: RANGE

            Projection:
              ProjectionType: ALL

        Tags:
          - Key: Service
            Value: booking

          - Key: Environment
            Value: ${self:provider.stage}

          - Key: ManagedBy
            Value: Serverless
