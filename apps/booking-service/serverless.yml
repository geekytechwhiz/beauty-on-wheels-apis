            path: /vendors/{vendorId}/package-visits/assignments
            method: get
            cors: ${self:custom.httpCors}
            authorizer: ${self:custom.securedAuthorizer}
            summary: "List crew assignments"
            description: "Owner-only crew assignments for scheduled package visits. Grouped by date, community, and visit window. Workload uses stored visit durations. Van labels are display text and are not conflict-checked. Staff cannot call this route."
            swaggerTags:
              - Customer Plans
            queryStringParameters:
              fromDate:
                required: false
                type: string
                description: Inclusive YYYY-MM-DD. Defaults to today in Asia/Kolkata.
              toDate:
                required: false
                type: string
                description: Inclusive YYYY-MM-DD. Defaults to two days after fromDate. Maximum 14 days.
            responseData:
              200:
                description: "Assignment schedule"
              400:
                description: "Invalid range"
              403:
                description: "Staff or another vendor"
            documentation:
              summary: List crew assignments
              description: "Reads PackageVisit rows on GSI3. Does not create a schedule table. Capacity and travel-buffer results are advisory. Overlap conflicts already stored are reported on each day. vanIdentity is displayLabelOnly because crews have no stable van id."
              tags:
                - Customer Plans
              queryParams:
                - name: fromDate
                  required: false
                  schema:
                    type: string
                - name: toDate
                  required: false
                  schema:
                    type: string
              methodResponses:
                - statusCode: "200"
                  responseBody:
                    description: Days, groups, workload, travel warnings, and conflicts
                - statusCode: "403"
                  responseBody:
                    description: Forbidden
                  responseModels:
                    application/json: ErrorResponse
              pathParams:
                - name: vendorId
                  description: Vendor id. Must match the caller's owner membership.
                  schema:
                    type: string

    assignvendorpackagevisits:
      handler: src/handlers/crew-assignments.handleAssignCrew
      events:
        - http:
            path: /vendors/{vendorId}/package-visits/assignments
            method: put
            cors: ${self:custom.httpCors}
            authorizer: ${self:custom.securedAuthorizer}
            summary: "Schedule and assign package visits"
            description: "Canonical manager action for community package visits. Schedules selected UNSCHEDULED (or reschedules SCHEDULED) visits into an inclusive date range of at most seven days and a visit window, and assigns them to a crew in one transaction. Does not call Availability or invent exact arrival times. Requires Idempotency-Key. visitWindowId must match the customer preference on each visit. replaceExisting is required to move a visit off another crew. Unassign uses DELETE /vendors/{vendorId}/package-visits/{visitId}/assignment."
            swaggerTags:
              - Customer Plans
            responseData:
              200:
                description: "Visits scheduled and assigned"
              400:
                description: "Invalid body or missing Idempotency-Key"
              403:
                description: "Staff, another vendor, or a visit from another vendor"
              404:
                description: "Crew or visit not found"
              409:
                description: "Inactive crew, crew size, window mismatch, overlap, idempotency conflict, or concurrent update"
            documentation:
              summary: Schedule and assign package visits
              description: "Owner-only bulk schedule-and-assign. Persists SCHEDULED status with scheduleStartDate, scheduleEndDate, visitWindowId, and crewAssignment on each PackageVisit. Authorization uses the existing custom authorizer plus vendor membership lookup already used by this route."
              tags:
                - Customer Plans
              requestHeaders:
                - name: Idempotency-Key
                  description: Required. Replay with the same key and body returns the original result.
                  schema:
                    type: string
              requestModels:
                application/json: CrewAssignmentRequest
              requestBody:
                description: "communityId, scheduleStartDate, scheduleEndDate, visitWindowId, crewId, visitIds. Optional replaceExisting."
                required: true
              methodResponses:
                - statusCode: "200"
                  responseBody:
                    description: scheduleId, range, window, crew, scheduledVisitCount, and per-visit status
                - statusCode: "400"
                  responseBody:
                    description: Invalid body
                  responseModels:
                    application/json: ErrorResponse
                - statusCode: "403"
                  responseBody:
                    description: Forbidden
                  responseModels:
                    application/json: ErrorResponse
                - statusCode: "404"
                  responseBody:
                    description: Crew or visit not found
                  responseModels:
                    application/json: ErrorResponse
                - statusCode: "409"
                  responseBody:
                    description: Conflict
                  responseModels:
                    application/json: ErrorResponse
              pathParams:
                - name: vendorId
                  description: Vendor id. Must match the caller's owner membership.
                  schema:
                    type: string

    unassignvendorpackagevisit:
      handler: src/handlers/crew-assignments.handleUnassignCrew
      events:
        - http:
            path: /vendors/{vendorId}/package-visits/{visitId}/assignment
            method: delete
            cors: ${self:custom.httpCors}
            authorizer: ${self:custom.securedAuthorizer}
            summary: "Remove a crew assignment"
            description: "Clears crewAssignment on one SCHEDULED visit. The customer visit and availability reservation stay in place. Already-clear visits succeed without another write."
