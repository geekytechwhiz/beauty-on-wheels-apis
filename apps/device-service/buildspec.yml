version: 0.2

env:
  shell: bash
  variables:
    STAGE: 'dev'
    DEPLOYMENT_BUCKET: 'dev-mvx-device-service-bucket'
    STACK_NAME: 'dev-device-service'
    # Set SEED_META=true in pipeline/CodeBuild to run device list seed (dev default: skip)
    SEED_META: 'false'
    NODE_OPTIONS: '--max-old-space-size=2048'

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "Installing dependencies..."
      - npm install -g serverless@3 --force
      - npm install --legacy-peer-deps

  pre_build:
    commands:
      - echo "Making scripts executable..."
      - chmod +x apps/device-service/ci/*.sh

  build:
    commands:
      - echo "Starting build..."
      - apps/device-service/ci/build.sh

  post_build:
    commands:
      - echo "Running deployment verification..."
      - apps/device-service/ci/verify-artifacts.sh
      - |
        if [ "$SEED_META" = "true" ]; then
          DEVICES_FILE=$(find "$CODEBUILD_SRC_DIR" -path '*/src/utils/devices.json' -type f 2>/dev/null | head -1)
          if [ -z "$DEVICES_FILE" ] || [ ! -f "$DEVICES_FILE" ]; then
            echo "ERROR: devices.json not found under $CODEBUILD_SRC_DIR"
            find "$CODEBUILD_SRC_DIR" -name devices.json 2>/dev/null | head -20
            exit 1
          fi
          export DEVICES_FILE
          export DEVICE_SERVICE_ROOT="$(cd "$(dirname "$DEVICES_FILE")/../.." && pwd)"
          cd "$DEVICE_SERVICE_ROOT"
          export DEVICE_TABLE=$(npx serverless print --stage "$STAGE" 2>/dev/null | awk '/DEVICE_TABLE:/{gsub(/[\047"]/,""); print $2; exit}')
          [ -z "$DEVICE_TABLE" ] && export DEVICE_TABLE="device-table-$STAGE"
          export REGION="${REGION:-us-east-1}"
          echo "🌱 Seeding device list metadata into $DEVICE_TABLE (stage=$STAGE)"
          echo "   DEVICES_FILE=$DEVICES_FILE"
          echo "   DEVICE_SERVICE_ROOT=$DEVICE_SERVICE_ROOT"
          echo "🔨 Compiling TypeScript..."
          npx tsc --project deviceScripts/device-list/tsconfig.json || {
            echo "⚠️ TypeScript compilation failed - trying local install..."
            cd deviceScripts/device-list
            npm install --legacy-peer-deps
            npx tsc --project tsconfig.json || {
              echo "⚠️ TypeScript compilation failed"
              exit 1
            }
            cd "$DEVICE_SERVICE_ROOT"
          }
          echo "🚀 Running device list seed script..."
          node deviceScripts/device-list/dist/index.js --env "$STAGE" || {
            echo "⚠️ Device list seed failed (check CodeBuild role has dynamodb:PutItem/BatchWriteItem on $DEVICE_TABLE; see CODEBUILD-IAM.md)"
            exit 1
          }
        else
          echo "⏭️ Device list seed skipped (SEED_META not true)."
        fi
      - echo "✅ Build done, artifacts ready in packaged.yaml"

artifacts:
  files:
    - apps/device-service/packaged.yaml
    - apps/device-service/.serverless/**/*
  discard-paths: no

cache:
  paths:
    - node_modules/**/*
