bundle: true
minify: false
sourcemap: ${self:custom.sourcemapsByStage.${self:provider.stage}, false}
target: node22
platform: node
format: cjs
tsconfig: ../../tsconfig.base.json
external:
  - aws-sdk
  - fhir-tool
keepNames: ${self:custom.keepNamesByStage.${self:provider.stage}, true}
skipRebuild: true
disposeContext: true
concurrency: 1
zipConcurrency: 1
plugins: esbuild-plugins.js
resolveExtensions:
  - '.ts'
  - '.tsx'
  - '.js'
  - '.jsx'
  - '.json'
loader:
  '.json': 'json'
