# Set AWS_ACCOUNT_ID in .env for local offline/package without live STS (see .env.example).
awsAccountId: ${env:AWS_ACCOUNT_ID, aws:accountId}

deviceTableName: device-table-${self:provider.stage}
eventBusName: device-service-bus-${self:provider.stage}

logLevel:
  dev: debug
  stg: info
  prd: warn
