Effect: Allow
Action:
  - dynamodb:GetItem
  - dynamodb:PutItem
  - dynamodb:UpdateItem
  - dynamodb:DeleteItem
  - dynamodb:Query
  - dynamodb:BatchGetItem
  - dynamodb:BatchWriteItem
  - dynamodb:DescribeTable
Resource:
  - arn:aws:dynamodb:${self:provider.region}:${self:custom.bundle.awsAccountId}:table/${self:custom.bundle.deviceTableName}
  - arn:aws:dynamodb:${self:provider.region}:${self:custom.bundle.awsAccountId}:table/${self:custom.bundle.deviceTableName}/index/*
