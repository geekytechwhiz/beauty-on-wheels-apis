service: device-service

frameworkVersion: '3.x'

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-auto-swagger
  - serverless-offline

provider:
  name: aws
  runtime: nodejs22.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  deploymentBucket:
    name: ${self:provider.stage}-mvx-device-service-bucket
    serverSideEncryption: AES256
  memorySize: 512
  timeout: 30

  tracing:
    lambda: true
    apiGateway: true

  logRetentionInDays: 14

  environment:
    REGION: ${self:provider.region}
    DEVICE_TABLE: device-table-${self:provider.stage}
    EVENT_BUS: device-service-bus-${self:provider.stage}
    NOTIFICATION_TOPIC_ARN: arn:aws:sns:${self:provider.region}:${aws:accountId}:user-events-topic-${self:provider.stage}
    ERROR_MESSAGES_CDN_URL: https://d2p9v61861q1ox.cloudfront.net
    LOG_LEVEL: ${self:custom.logLevel.${self:provider.stage}, 'info'}
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
    DEFAULT_REGION: ${self:provider.region}
    COMPLETE_TASK_LAMBDA: ${self:provider.stage}_complete_user_task

  tags:
    Service: ${self:service}
    Stage: ${self:provider.stage}
    ManagedBy: serverless

  iamRoleStatements:
    # DynamoDB
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:Query
        - dynamodb:BatchGetItem
        - dynamodb:BatchWriteItem
        - dynamodb:DescribeTable
      Resource:
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/device-table-${self:provider.stage} 
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/device-table-${self:provider.stage}/index/*

    # EventBridge
    - Effect: Allow
      Action:
        - events:PutEvents
      Resource:
        - arn:aws:events:${self:provider.region}:${aws:accountId}:event-bus/device-service-bus-${self:provider.stage}

    # SNS (publish to user-service notification topic for Email/SMS/push)
    - Effect: Allow
      Action:
        - sns:Publish
      Resource:
        - arn:aws:sns:${self:provider.region}:${aws:accountId}:user-events-topic-${self:provider.stage}

    # Lambda (for backward compatibility with complete_user_task)
    - Effect: Allow
      Action:
        - lambda:InvokeFunction
      Resource:
        - arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_complete_user_task

    # SQS (Vital Reading DLQ)
    - Effect: Allow
      Action:
        - sqs:ReceiveMessage
        - sqs:DeleteMessage
        - sqs:GetQueueAttributes
      Resource: !GetAtt VitalReadingsDLQ.Arn

    # SES (Vital Reading DLQ email after 3 retries)
    - Effect: Allow
      Action:
        - ses:SendEmail
        - ses:SendRawEmail
      Resource: '*'

    # X-Ray
    - Effect: Allow
      Action:
        - xray:PutTraceSegments
        - xray:PutTelemetryRecords
      Resource: '*'

package:
  individually: true
  patterns:
    - 'src/utils/devices.json'
    - '!**/*.test.ts'
    - '!**/*.spec.ts'

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node18
    platform: node
    format: cjs
    tsconfig: ../../tsconfig.base.json
    external:
      - aws-sdk
    keepNames: true
    plugins: esbuild-plugins.js
    resolveExtensions:
      - '.ts'
      - '.tsx'
      - '.js'
      - '.jsx'
      - '.json'
    loader:
      '.json': 'json'
  autoswagger:
    title: Device Service API
    description: RESTful API for managing devices, device-user mappings, organization devices, and recommendations
    version: 1.0.0
    apiType: http
    basePath: /${self:provider.stage}
    schemes:
      - https
      - http
    host: ${self:custom.apiHost, ''}
    generateSwaggerOnDeploy: true
    type: openapi3
    swaggerFiles:
      - swagger.json
    useStage: true
    swaggerPath: swagger
    excludeStages:
      - production
    swaggerOutputPath: swagger.json
    tags:
      - name: Devices
        description: Device management operations
      - name: Organization Devices
        description: Organization-device relationship operations
      - name: Recommendations
        description: Device recommendation operations

  logLevel:
    dev: debug
    stg: info
    prd: warn

functions:
  health:
    handler: src/handlers/health.handler
    events:
      - http:
          path: /health
          method: get
          cors: true

  deviceRegister:
    handler: src/handlers/deviceRegister.handler
    events:
      - http:
          path: devices/register
          method: post
          cors: true
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0

  errorNotification:
    handler: src/handlers/errorNotification.handler
    events:
      - http:
          path: devices/error-notification
          method: post
          cors: true

  deviceGet:
    handler: src/handlers/deviceGet.handler
    events:
      - http:
          path: devices/{deviceId}
          method: get
          cors: true

  deviceUpdate:
    handler: src/handlers/deviceUpdate.handler
    events:
      - http:
          path: devices/{deviceId}
          method: put
          cors: true

  deviceDelete:
    handler: src/handlers/deviceDelete.handler
    events:
      - http:
          path: devices/{deviceId}
          method: delete
          cors: true

  deviceDeleteMultiple:
    handler: src/handlers/deviceDeleteMultiple.handler
    events:
      - http:
          path: devices/delete-multiple
          method: post
          cors: true

  deviceUserDelete:
    handler: src/handlers/deviceUserDelete.handler
    events:
      - http:
          path: devices/user/delete
          method: post
          cors: true
    description: Delete single user-device mapping by userId and configDevice id

  deviceList:
    handler: src/handlers/deviceList.handler
    events:
      - http:
          path: devices/list
          method: post
          cors: true

  deviceSearch:
    handler: src/handlers/deviceSearch.handler
    events:
      - http:
          path: devices/search
          method: post
          cors: true

  orgDeviceManage:
    handler: src/handlers/orgDeviceManage.handler
    events:
      - http:
          path: devices/org/manage
          method: post
          cors: true

  deviceRecommendationAdd:
    handler: src/handlers/deviceRecommendationAdd.handler
    events:
      - http:
          path: devices/recommendations/add
          method: post
          cors: true

  deviceRecommendationRemove:
    handler: src/handlers/deviceRecommendationRemove.handler
    events:
      - http:
          path: devices/recommendations/remove
          method: post
          cors: true

  deviceGlobalRegister:
    handler: src/handlers/deviceGlobalRegister.handler
    events:
      - http:
          path: devices/global/register
          method: post
          cors: true

  # Device-User Mapping APIs
  deviceUserAssign:
    handler: src/handlers/deviceUserAssign.handler
    events:
      - http:
          path: devices/{deviceId}/users/{userId}
          method: post
          cors: true

  deviceUserRemove:
    handler: src/handlers/deviceUserRemove.handler
    events:
      - http:
          path: devices/{deviceId}/users/{userId}
          method: delete
          cors: true

  deviceUserList:
    handler: src/handlers/deviceUserList.handler
    events:
      - http:
          path: devices/{deviceId}/users
          method: get
          cors: true

  # Device-Organization Mapping APIs
  deviceOrgAssign:
    handler: src/handlers/deviceOrgAssign.handler
    events:
      # Bulk device assignment: POST /devices/organizations
      - http:
          path: devices/organizations
          method: post
          cors: true

  deviceOrgRemove:
    handler: src/handlers/deviceOrgRemove.handler
    events:
      # Bulk device removal: POST /devices/remove/organizations
      - http:
          path: devices/remove/organizations
          method: post
          cors: true

  deviceOrgList:
    handler: src/handlers/deviceOrgList.handler
    events:
      - http:
          path: devices/{deviceId}/organizations
          method: get
          cors: true

getOrganizationDevice:
    handler: src/handlers/getOrganizationDevice.handler
    events:
      - http:
          path: devices/org/{organizationId}
          method: get
          cors: true
  # Device Metadata API
deviceMetadataUpdate:
    handler: src/handlers/deviceMetadataUpdate.handler
    events:
      - http:
          path: devices/{deviceId}/metadata
          method: put
          cors: true

  # Device Reading Timestamp API (literal 'reading-timestamp' avoids API Gateway sibling variable conflict with devices/{deviceId})
deviceReadingTimestampUpdate:
    handler: src/handlers/deviceReadingTimestampUpdate.handler
    events:
      - http:
          path: devices/reading-timestamp/{userId}/{configDeviceId}/update
          method: put
          cors: true

  # Device Files API
deviceFileUpload: 
    handler: src/handlers/deviceFileUpload.handler
    events:
      - http:
          path: devices/{deviceId}/files
          method: post
          cors: true


resources:
  Resources:
    VitalReadingsDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: vital-readings-dlq-${self:provider.stage}
        MessageRetentionPeriod: 1209600
