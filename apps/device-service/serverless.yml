# CodeBuild (when SEED_META=true) runs scripts/device-list/insert-device-list.js and needs
# dynamodb:PutItem/BatchWriteItem on device-table-<stage>. See CODEBUILD-IAM.md for the CodeBuild role policy.
service: device-service

# Serverless 3.40 JSON schema may lag new Lambda runtimes (e.g. nodejs22.x); AWS still accepts them.
configValidationMode: warn

frameworkVersion: '3.x'

plugins: ${file(../../infra/serverless/plugins.yml)}
package: ${file(./infra/config/package.yml)}

provider:
  name: aws
  runtime: nodejs22.x
  versionFunctions: false
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  deploymentBucket:
    name: ${self:provider.stage}-mvx-device-service-bucket
    serverSideEncryption: AES256
  memorySize: 512
  timeout: 30

  tracing:
    lambda: true
    apiGateway: true

  logRetentionInDays: ${self:custom.logRetentionByStage.${self:provider.stage}, '14'}

  environment: ${file(./infra/environments/environment.yml)}

  tags:
    Service: ${self:service}
    Stage: ${self:provider.stage}
    ManagedBy: serverless

  iamRoleStatements:
    - ${file(./infra/permissions/dynamodb.yml)}
    - ${file(./infra/permissions/eventbridge.yml)}
    - ${file(./infra/permissions/sns.yml)}
    - ${file(./infra/permissions/lambda-invoke.yml)}
    - ${file(./infra/permissions/sqs.yml)}
    - ${file(./infra/permissions/ses.yml)}
    - ${file(../../infra/serverless/permissions/ssm-read.yml)}
    - ${file(../../infra/serverless/permissions/xray.yml)}

custom:
  # Pre-commit policy: keep existing route auth (3 secured routes). Hardening is a separate track.
  mvrxPolicy:
    requireAuthorizer: false

  sharedSsmPaths: ${file(../../infra/serverless/config/shared-ssm-paths.yml)}
  logRetentionByStage: ${file(../../infra/serverless/config/log-retention-by-stage.yml)}
  bundle: ${file(./infra/config/infra-custom.yml)}
  apiTitle: Device Service API

  securedAuthorizer: &securedAuthorizer
    name: common_authorizer
    type: token
    identitySource: method.request.header.Authorization
    arn: arn:aws:lambda:${self:provider.region}:${self:custom.bundle.awsAccountId}:function:${self:provider.stage}_global_user_package_custom_authorization
    resultTtlInSeconds: 0

  resourceRegistry:
    enabled: true
    platformOwner: device-service
    parameters:
      DEVICE_TABLE:
        value: ${self:custom.bundle.deviceTableName}
      EVENT_BUS:
        value: ${self:custom.bundle.eventBusName}
    include:
      - AWS::DynamoDB::Table
      - AWS::Events::EventBus
      - AWS::SQS::Queue
      - AWS::SNS::Topic

  sourcemapsByStage: ${file(../../infra/serverless/config/sourcemaps-by-stage.yml)}
  keepNamesByStage: ${file(../../infra/serverless/config/keep-names-by-stage.yml)}
  esbuild: ${file(./infra/config/esbuild.yml)}
  autoswagger: ${file(./infra/config/autoswagger.yml)}
  serverless-offline: ${file(../../infra/serverless/config/serverless-offline.yml)}

functions:
  health:
    handler: src/handlers/health.handler
    events:
      - http:
          path: /health
          method: get
          cors: true

  deviceRegister:
    handler: src/handlers/deviceRegister.handler
    events:
      - http:
          path: devices/register
          method: post
          cors: true
          authorizer: *securedAuthorizer

  errorNotification:
    handler: src/handlers/errorNotification.handler
    events:
      - http:
          path: devices/error-notification
          method: post
          cors: true

  deviceGet:
    handler: src/handlers/deviceGet.handler
    events:
      - http:
          path: devices/{deviceId}
          method: get
          cors: true

  deviceUpdate:
    handler: src/handlers/deviceUpdate.handler
    events:
      - http:
          path: devices/{deviceId}
          method: put
          cors: true

  deviceDelete:
    handler: src/handlers/deviceDelete.handler
    events:
      - http:
          path: devices/{deviceId}
          method: delete
          cors: true

  deviceDeleteMultiple:
    handler: src/handlers/deviceDeleteMultiple.handler
    events:
      - http:
          path: devices/delete-multiple
          method: post
          cors: true

  deviceUserDelete:
    handler: src/handlers/deviceUserDelete.handler
    events:
      - http:
          path: devices/user/delete
          method: post
          cors: true
          authorizer: *securedAuthorizer
    description: Delete user-device mapping(s) by userId (from Bearer token) and devices array

  deviceUserRegister:
    handler: src/handlers/deviceUserRegister.handler
    events:
      - http:
          path: devices/user/register
          method: post
          cors: true
          authorizer: *securedAuthorizer
    description: Patient-app device pairing/registration (legacy payload, correct table mapping)

  deviceList:
    handler: src/handlers/deviceList.handler
    events:
      - http:
          path: devices/list
          method: post
          cors: true

  deviceSearch:
    handler: src/handlers/deviceSearch.handler
    events:
      - http:
          path: devices/search
          method: post
          cors: true

  orgDeviceManage:
    handler: src/handlers/orgDeviceManage.handler
    events:
      - http:
          path: devices/org/manage
          method: post
          cors: true

  deviceRecommendationAdd:
    handler: src/handlers/deviceRecommendationAdd.handler
    events:
      - http:
          path: devices/recommendations/add
          method: post
          cors: true

  deviceRecommendationRemove:
    handler: src/handlers/deviceRecommendationRemove.handler
    events:
      - http:
          path: devices/recommendations/remove
          method: post
          cors: true

  deviceGlobalRegister:
    handler: src/handlers/deviceGlobalRegister.handler
    events:
      - http:
          path: devices/global/register
          method: post
          cors: true

  # Device-User Mapping APIs
  deviceUserAssign:
    handler: src/handlers/deviceUserAssign.handler
    events:
      - http:
          path: devices/{deviceId}/users/{userId}
          method: post
          cors: true

  deviceUserRemove:
    handler: src/handlers/deviceUserRemove.handler
    events:
      - http:
          path: devices/{deviceId}/users/{userId}
          method: delete
          cors: true

  deviceUserList:
    handler: src/handlers/deviceUserList.handler
    events:
      - http:
          path: devices/{deviceId}/users
          method: get
          cors: true

  # Device-Organization Mapping APIs
  deviceOrgAssign:
    handler: src/handlers/deviceOrgAssign.handler
    events:
      # Bulk device assignment: POST /devices/organizations
      - http:
          path: devices/organizations
          method: post
          cors: true

  deviceOrgRemove:
    handler: src/handlers/deviceOrgRemove.handler
    events:
      # Bulk device removal: POST /devices/remove/organizations
      - http:
          path: devices/remove/organizations
          method: post
          cors: true

  deviceOrgList:
    handler: src/handlers/deviceOrgList.handler
    events:
      - http:
          path: devices/{deviceId}/organizations
          method: get
          cors: true

  getOrganizationDevice:
    handler: src/handlers/getOrganizationDevice.handler
    events:
      - http:
          path: devices/org/{organizationId}
          method: get
          cors: true

  # Device Metadata API
  deviceMetadataUpdate:
    handler: src/handlers/deviceMetadataUpdate.handler
    events:
      - http:
          path: devices/{deviceId}/metadata
          method: put
          cors: true

  # Device Reading Timestamp API (literal 'reading-timestamp' avoids API Gateway sibling variable conflict with devices/{deviceId})
  deviceReadingTimestampUpdate:
    handler: src/handlers/deviceReadingTimestampUpdate.handler
    events:
      - http:
          path: devices/reading-timestamp/{userId}/{configDeviceId}/update
          method: put
          cors: true

  # Device Files API
  deviceFileUpload:
    handler: src/handlers/deviceFileUpload.handler
    events:
      - http:
          path: devices/{deviceId}/files
          method: post
          cors: true

resources:
  - ${file(./infra/resources/vital-readings-dlq.yml)}
