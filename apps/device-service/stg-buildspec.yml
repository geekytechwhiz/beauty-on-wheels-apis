version: 0.2

env:
  variables:
    STAGE: 'stg'
    DEPLOYMENT_BUCKET: 'stg-mvx-device-service-bucket'
    STACK_NAME: 'stg-device-service'
    SEED_META: 'true'

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - npm install -g serverless@3 --force
      - npm install --legacy-peer-deps

  build:
    commands:
      - cd apps/device-service
      - npx serverless package --stage "$STAGE" --package .serverless

      # 2) select create vs update s3 keys
      - |
        if [ -f .serverless/cloudformation-template-update-stack.json ]; then
          TEMPLATE=".serverless/cloudformation-template-update-stack.json"
        elif [ -f .serverless/cloudformation-template-create-stack.json ]; then
          TEMPLATE=".serverless/cloudformation-template-create-stack.json"
        else
          echo "ERROR: No CloudFormation template found in .serverless"
          ls -la .serverless || true
          exit 1
        fi

      # 3) push code & rewrite 
      - |
        aws cloudformation package \
          --template-file "$TEMPLATE" \
          --s3-bucket "$DEPLOYMENT_BUCKET" \
          --output-template-file packaged.yaml \
          --force-upload

      # 4) debug: what keys did CF bake in?
      - echo "🔍 S3Key entries in packaged.yaml:"
      - grep 'S3Key:' packaged.yaml | awk '{print $2}'

      # 5) debug: do they exist?
      - echo "🔑 Verifying each baked-in key exists:"
      - |
        grep 'S3Key:' packaged.yaml | awk '{print $2}' \
          | while read key; do
              printf " → %-80s " "$key"
              if aws s3api head-object --bucket "$DEPLOYMENT_BUCKET" --key "$key" >/dev/null 2>&1; then
                echo "FOUND"
              else
                echo "MISSING!"
              fi
            done

      # 6) debug: list entire directory
      # - echo "📦 Full directory on S3:"
      # - aws s3 ls "s3://$DEPLOYMENT_BUCKET/serverless/payments-service/$STAGE/" --recursive

      - echo "➤ Pushing any missing function ZIPs into their exact S3Key paths…"
      - |
        grep 'S3Key:' packaged.yaml \
          | awk '{print $2}' \
          | while read key; do
              name=$(basename "$key")
              echo "Uploading .serverless/$name → s3://$DEPLOYMENT_BUCKET/$key"
              aws s3 cp ".serverless/$name" "s3://$DEPLOYMENT_BUCKET/$key"
            done

      - echo "➤ Verifying upload…"
      - aws s3 ls "s3://$DEPLOYMENT_BUCKET/$(dirname $(grep 'S3Key:' packaged.yaml | head -1 | awk '{print $2}'))/" --recursive

  post_build:
    commands:
      - |
        if [ "$SEED_META" = "true" ]; then
          cd "$CODEBUILD_SRC_DIR/apps/device-service"
          export DEVICE_TABLE=$(npx serverless print --stage "$STAGE" 2>/dev/null | awk '/DEVICE_TABLE:/{gsub(/[\047"]/,""); print $2; exit}')
          [ -z "$DEVICE_TABLE" ] && export DEVICE_TABLE="device-table-$STAGE"
          echo "🌱 Seeding device list metadata into $DEVICE_TABLE (stage=$STAGE)"
          DEVICES_FILE="$CODEBUILD_SRC_DIR/apps/device-service/src/utils/devices.json"
          if [ ! -f "$DEVICES_FILE" ]; then
            echo "ERROR: Devices JSON not found: $DEVICES_FILE (ensure src/utils/devices.json is committed)"
            exit 1
          fi
          cd "$CODEBUILD_SRC_DIR/apps/device-service/deviceScripts/device-list"
          # Compile TypeScript to JavaScript (using root-level TypeScript if available)
          echo "🔨 Compiling TypeScript..."
          cd "$CODEBUILD_SRC_DIR/apps/device-service" && npx tsc --project deviceScripts/device-list/tsconfig.json || {
            echo "⚠️ TypeScript compilation failed - trying local install..."
            cd "$CODEBUILD_SRC_DIR/apps/device-service/deviceScripts/device-list"
            npm install --no-save typescript @types/node --legacy-peer-deps
            npx tsc --project tsconfig.json || {
              echo "⚠️ TypeScript compilation failed"
              exit 1
            }
          }
          # Run the compiled JavaScript
          echo "🚀 Running device list seed script..."
          cd "$CODEBUILD_SRC_DIR/apps/device-service/deviceScripts/device-list"
          node dist/index.js --env "$STAGE" || {
            echo "⚠️ Device list seed failed (check CodeBuild role has dynamodb:PutItem/BatchWriteItem on $DEVICE_TABLE)"
            exit 1
          }
        else
          echo "⏭️ Device list seed skipped (SEED_META not true)."
        fi
      - echo "✅ Build done, artifacts ready in packaged.yaml"

artifacts:
  files:
    - apps/device-service/packaged.yaml
  discard-paths: no

cache:
  paths:
    - node_modules/**/*
