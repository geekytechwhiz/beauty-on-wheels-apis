
openapi: 3.0.3
info:
  title: Identity Service API
  version: 1.0.0
  description: |
    Enterprise Identity Service for Beauty on Wheels.
    Covers authentication, authorization, user management,
    roles, sessions and OTP.

servers:
  - url: https://api.example.com/identity/v1

tags:
  - name: Authentication
  - name: Users
  - name: Roles
  - name: Sessions

paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a new customer, vendor or admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /auth/login:
    post:
      tags: [Authentication]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout current session
      responses:
        "204":
          description: Logged out
  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /auth/verify-otp:
    post:
      tags: [Authentication]
      summary: Verify OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        "200":
          description: OTP verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /users/me:
    get:
      tags: [Users]
      summary: Get current profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    put:
      tags: [Users]
      summary: Update current profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /roles:
    get:
      tags: [Roles]
      summary: List roles
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
  /sessions:
    get:
      tags: [Sessions]
      summary: Active sessions
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'

components:
  schemas:
    ApiResponse:
      type: object
      required: [success,message]
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          nullable: true

    RegisterRequest:
      type: object
      required:
        - firstName
        - lastName
        - email
        - phoneNumber
        - password
        - role
      properties:
        firstName: {type: string, description: "Mandatory"}
        lastName: {type: string, description: "Mandatory"}
        email: {type: string, format: email, description: "Mandatory"}
        phoneNumber: {type: string, description: "Mandatory"}
        password: {type: string, format: password, minLength: 8, description: "Mandatory"}
        role:
          type: string
          enum: [CUSTOMER,VENDOR,ADMIN]
        referralCode:
          type: string
          nullable: true
          description: Optional

    LoginRequest:
      type: object
      required: [username,password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        deviceId:
          type: string
          nullable: true
        rememberMe:
          type: boolean
          default: false

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    OtpVerifyRequest:
      type: object
      required: [referenceId,otp]
      properties:
        referenceId:
          type: string
        otp:
          type: string
          minLength: 6
          maxLength: 6

    UpdateProfileRequest:
      type: object
      properties:
        firstName: {type: string}
        lastName: {type: string}
        profileImageUrl: {type: string}
        language: {type: string}
        timezone: {type: string}

    AuthResponse:
      type: object
      required: [accessToken,refreshToken,user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          example: 3600
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      required: [id,firstName,lastName,email,role,status]
      properties:
        id: {type: string}
        firstName: {type: string}
        lastName: {type: string}
        email: {type: string, format: email}
        phoneNumber: {type: string}
        role:
          type: string
          enum: [CUSTOMER,VENDOR,ADMIN]
        status:
          type: string
          enum: [ACTIVE,INACTIVE,SUSPENDED]
        createdAt:
          type: string
          format: date-time

    Role:
      type: object
      required: [id,name]
      properties:
        id: {type: string}
        name: {type: string}
        permissions:
          type: array
          items:
            type: string

    Session:
      type: object
      required: [id,userId,status]
      properties:
        id: {type: string}
        userId: {type: string}
        device:
          type: string
        ipAddress:
          type: string
        status:
          type: string
          enum: [ACTIVE,EXPIRED,REVOKED]
        createdAt:
          type: string
          format: date-time
