service: identity-service
frameworkVersion: "3"
plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-auto-swagger
  - serverless-offline
  - serverless-openapi-documenter
  - ./serverless.fixed-otp-plugin.js
provider:
  name: aws
  runtime: nodejs22.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  versionFunctions: false
  # Native Serverless deployment bucket (not serverless-deployment-bucket plugin).
  # The existing stack already deploys artifacts here; naming it skips the
  # TemplateBody bucket-injection path that exceeds the 51,200-byte limit.
  # deploymentBucket:
  #   name: ${self:provider.stage}-mvx-identity-service-bucket-${aws:accountId}
  #   serverSideEncryption: AES256
  tracing:
    lambda: true
    apiGateway: true
  logRetentionInDays: 14
  tags:
    Service: ${self:service}
    Stage: ${self:provider.stage}
    ManagedBy: serverless
  stackTags:
    Service: ${self:service}
    Stage: ${self:provider.stage}
    ManagedBy: serverless
  environment:
    SERVICE_NAME: identity-v1-service
    REGION: ${self:provider.region}
    STAGE: ${self:provider.stage}
    # Development-only fixed OTP; deployment is rejected outside dev when enabled.
    FIXED_OTP_ENABLED: ${env:FIXED_OTP_ENABLED, 'true'}
    LOG_LEVEL: info
    DYNAMODB_TABLE_NAME: identity-table-${self:provider.stage}
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: "1"
    COGNITO_REGION: ${self:provider.region}
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID, 'us-east-1_LeQxyLZ3x'}
    COGNITO_APP_CLIENT_ID: ${env:COGNITO_APP_CLIENT_ID, '2npl84o4lc11hd3ras553u71o3'}
    # Required when the Cognito app client has a secret; used to compute SECRET_HASH.
    COGNITO_APP_CLIENT_SECRET: ''
    COGNITO_ISSUER: https://cognito-idp.${self:provider.region}.amazonaws.com/${env:COGNITO_USER_POOL_ID, 'us-east-1_LeQxyLZ3x'}
    COGNITO_JWKS_URI: https://cognito-idp.${self:provider.region}.amazonaws.com/${env:COGNITO_USER_POOL_ID, 'us-east-1_LeQxyLZ3x'}/.well-known/jwks.json
    # Required bw-user-pool attributes: email, phone_number, name. Applied only when input is missing.
    # {username} / {digits} keep alias attributes unique across users.
    COGNITO_DEFAULT_EMAIL: ${env:COGNITO_DEFAULT_EMAIL, 'dev+{username}@beautyonwheels.test'}
    COGNITO_DEFAULT_PHONE_NUMBER: ${env:COGNITO_DEFAULT_PHONE_NUMBER, '+1{digits}'}
    COGNITO_DEFAULT_NAME: ${env:COGNITO_DEFAULT_NAME, 'Beauty On Wheels User'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:BatchGetItem
            - dynamodb:BatchWriteItem
            - dynamodb:TransactWriteItems
            - dynamodb:TransactGetItems
            - dynamodb:DescribeTable
          Resource:
            - !GetAtt IdentityTable.Arn
            - !Join ["/", [!GetAtt IdentityTable.Arn, "index", "*"]]
        - Effect: Allow
          Action:
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminSetUserPassword
            - cognito-idp:AdminInitiateAuth
            - cognito-idp:AdminUpdateUserAttributes
            - cognito-idp:AdminUserGlobalSignOut
            - cognito-idp:ListUsers
            - cognito-idp:InitiateAuth
          Resource:
            - arn:aws:cognito-idp:${self:provider.region}:${aws:accountId}:userpool/${env:COGNITO_USER_POOL_ID, 'us-east-1_LeQxyLZ3x'}
custom:
  securedAuthorizer: ${file(../../infra/serverless/config/http-api-authorizer.yml)}
  deletionProtectionEnabled:
    prod: true
    production: true
  # Public routes (health, register, login, refresh, OTP) omit the authorizer.
  resourcePrefix: nv${self:provider.stage}-bw
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    concurrency: 10
    plugins: ./esbuild-plugins.js
  autoswagger:
    title: "Beauty on Wheels - Identity Service API"
    apiType: http
    basePath: /${self:provider.stage}
    schemes:
      - https
      - http
    generateSwaggerOnDeploy: true
    swaggerFiles:
      - swagger.json
    useStage: true
    swaggerPath: swagger
    typefiles:
      - ./src/types/api-types.d.ts
    excludeStages:
      - production
  documentation:
    version: 1.0.0
    title: Beauty on Wheels - Identity Service API
    description: Registration, login, OTP, sessions, profile, and application roles.
    securitySchemes:
      bearerAuth:
        type: http
        scheme: bearer
        bearerFormat: JWT
    security:
      - bearerAuth: []
    servers:
      - url: https://{apiId}.execute-api.us-east-1.amazonaws.com/{stage}
        description: Deployed API Gateway stage
        variables:
          apiId:
            default: localhost
            description: API Gateway id
          stage:
            default: dev
            description: Deployment stage
    tags:
      - name: Health
        description: Service health
      - name: Registration
        description: Public registration
      - name: Authentication
        description: Login, refresh, logout, and password change
      - name: OTP
        description: One-time passwords
      - name: Profile
        description: Current user profile
      - name: Sessions
        description: Refresh sessions
      - name: Roles
        description: Application roles
      - name: Permissions
        description: Application permissions
    models:
      - name: RegisterRequest
        description: Public registration
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                phone:
                  type: string
                password:
                  type: string
              required:
                - firstName
                - lastName
                - email
                - password
      - name: LoginRequest
        description: Username and password
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
              required:
                - username
                - password
      - name: TokenResponse
        description: Access and refresh tokens
        content:
          application/json:
            schema:
              type: object
              properties:
                accessToken:
                  type: string
                refreshToken:
                  type: string
                expiresIn:
                  type: integer
                tokenType:
                  type: string
      - name: RefreshTokenRequest
        description: Refresh token
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required:
                - refreshToken
      - name: SendOtpRequest
        description: Send an OTP. userType defaults to CUSTOMER. ADMIN cannot be self-registered.
        content:
          application/json:
            schema:
              type: object
              properties:
                destination:
                  type: string
                userType:
                  type: string
                  enum:
                    - CUSTOMER
                    - VENDOR
              required:
                - destination
      - name: VerifyOtpRequest
        description: Verify an OTP
        content:
          application/json:
            schema:
              type: object
              properties:
                destination:
                  type: string
                otp:
                  type: string
              required:
                - destination
                - otp
      - name: ChangePasswordRequest
        description: Change the current password
        content:
          application/json:
            schema:
              type: object
              properties:
                oldPassword:
                  type: string
                newPassword:
                  type: string
              required:
                - oldPassword
                - newPassword
      - name: User
        description: Identity user
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                email:
                  type: string
                phone:
                  type: string
                status:
                  type: string
                  enum:
                    - PENDING_VERIFICATION
                    - ACTIVE
                    - LOCKED
                    - DISABLED
                roles:
                  type: array
                  items:
                    type: string
      - name: AssignAdminRoleRequest
        description: Role assignment. Only ADMIN is accepted.
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum:
                    - ADMIN
              required:
                - role
      - name: Session
        description: Refresh session
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId:
                  type: string
                createdAt:
                  type: string
                expiresAt:
                  type: string
      - name: SessionList
        description: Refresh sessions
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      sessionId:
                        type: string
                      createdAt:
                        type: string
                      expiresAt:
                        type: string
      - name: RoleList
        description: Application roles
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                      description:
                        type: string
      - name: PermissionList
        description: Application permissions
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      permission:
                        type: string
                      description:
                        type: string
      - name: RoleAssignment
        description: Stored application role
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                role:
                  type: string
      - name: HealthStatus
        description: Service health
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
      - name: MessageResponse
        description: Acknowledgement
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
      - name: ErrorResponse
        description: Platform error envelope
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                statusCode:
                  type: integer
                message:
                  type: object
                  properties:
                    title:
                      type: string
                    description:
                      type: string
                    severity:
                      type: string
                data:
                  type: object
                  properties: {}
                error:
                  type: object
                  properties:
                    code:
                      type: string
                    details:
                      type: array
                      items:
                        type: object
                        properties:
                          field:
                            type: string
                          message:
                            type: string
                meta:
                  type: object
                  properties:
                    correlationId:
                      type: string
                    timestamp:
                      type: string
                    version:
                      type: string
functions:
  health:
    handler: src/handlers/health.handler
    events:
      - http:
          path: /health
          method: get
          cors: true
          documentation:
            summary: GET /health
            description: GET /health
            tags: []
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: GET /health
                responseModels:
                  application/json: HealthStatus
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
            security: []
  postregister:
    handler: src/handlers/registration.handler
    events:
      - http:
          path: /auth/register
          method: post
          cors: true
          summary: "Register a new user"
          description: "Public. HTTP 200 platform envelope. The created identity is in data (id, email, phone, status, roles). This call does not return tokens."
          swaggerTags:
            - Registration
          bodyType: RegisterRequest
          responseData:
            200:
              description: "User created"
              bodyType: User
          documentation:
            summary: Register a new user
            description: Public. HTTP 200 platform envelope. The created identity is in data (id, email, phone, status, roles). This call does not return tokens.
            tags:
              - Registration
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: User created
                responseModels:
                  application/json: User
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
            requestBody:
              description: Public. HTTP 200 platform envelope. The created identity is in data (id, email, phone, status, roles). This call does not return tokens.
              required: true
            requestModels:
              application/json: RegisterRequest
            security: []
  postlogin:
    handler: src/handlers/authentication.login
    events:
      - http:
          path: /auth/login
          method: post
          cors: true
          summary: "Login"
          swaggerTags:
            - Authentication
          bodyType: LoginRequest
          responseData:
            200:
              description: "Login successful"
              bodyType: TokenResponse
          documentation:
            summary: Login
            description: Login
            tags:
              - Authentication
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Login successful
                responseModels:
                  application/json: TokenResponse
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
            requestBody:
              description: Login
              required: true
            requestModels:
              application/json: LoginRequest
            security: []
  postrefreshtoken:
    handler: src/handlers/authentication.refreshToken
    events:
      - http:
          path: /auth/refresh-token
          method: post
          cors: true
          summary: "Refresh access token"
          swaggerTags:
            - Authentication
          bodyType: RefreshTokenRequest
          responseData:
            200:
              description: "Token refreshed"
              bodyType: TokenResponse
          documentation:
            summary: Refresh access token
            description: Refresh access token
            tags:
              - Authentication
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Token refreshed
                responseModels:
                  application/json: TokenResponse
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
            requestBody:
              description: Refresh access token
              required: true
            requestModels:
              application/json: RefreshTokenRequest
            security: []
  postlogout:
    handler: src/handlers/authentication.logout
    events:
      - http:
          path: /auth/logout
          method: post
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Logout current session"
          swaggerTags:
            - Authentication
          responseData:
            204:
              description: "Logged out"
          documentation:
            summary: Logout current session
            description: Logout current session
            tags:
              - Authentication
            methodResponses:
              - statusCode: "204"
                responseBody:
                  description: Logged out
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
  postchangepassword:
    handler: src/handlers/authentication.changePassword
    events:
      - http:
          path: /auth/change-password
          method: post
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Change password"
          swaggerTags:
            - Authentication
          bodyType: ChangePasswordRequest
          responseData:
            204:
              description: "Password changed"
          documentation:
            summary: Change password
            description: Change password
            tags:
              - Authentication
            methodResponses:
              - statusCode: "204"
                responseBody:
                  description: Password changed
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
            requestBody:
              description: Change password
              required: true
            requestModels:
              application/json: ChangePasswordRequest
  postsend:
    handler: src/handlers/otpHandler.handlePostsend
    events:
      - http:
          path: /otp/send
          method: post
          cors: true
          summary: "Send OTP"
          swaggerTags:
            - OTP
          bodyType: SendOtpRequest
          responseData:
            202:
              description: "OTP sent"
          documentation:
            summary: Send OTP
            description: Send OTP
            tags:
              - OTP
            methodResponses:
              - statusCode: "202"
                responseBody:
                  description: OTP sent
                responseModels:
                  application/json: MessageResponse
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
            requestBody:
              description: Send OTP
              required: true
            requestModels:
              application/json: SendOtpRequest
            security: []
  postverify:
    handler: src/handlers/otpHandler.handlePostverify
    events:
      - http:
          path: /otp/verify
          method: post
          cors: true
          summary: "Verify OTP"
          swaggerTags:
            - OTP
          bodyType: VerifyOtpRequest
          responseData:
            200:
              description: "OTP verified"
              bodyType: TokenResponse
          documentation:
            summary: Verify OTP
            description: Verify OTP
            tags:
              - OTP
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: OTP verified
                responseModels:
                  application/json: TokenResponse
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
            requestBody:
              description: Verify OTP
              required: true
            requestModels:
              application/json: VerifyOtpRequest
            security: []
  getme:
    handler: src/handlers/profile.handler
    events:
      - http:
          path: /me
          method: get
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Current authenticated user"
          swaggerTags:
            - Profile
          responseData:
            200:
              description: "Profile"
              bodyType: User
          documentation:
            summary: Current authenticated user
            description: Current authenticated user
            tags:
              - Profile
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Profile
                responseModels:
                  application/json: User
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
  getsessions:
    handler: src/handlers/sessions.handleGetsessions
    events:
      - http:
          path: /sessions
          method: get
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "List active sessions"
          swaggerTags:
            - Sessions
          responseData:
            200:
              description: "Sessions"
          documentation:
            summary: List active sessions
            description: List active sessions
            tags:
              - Sessions
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Sessions
                responseModels:
                  application/json: SessionList
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
  deletesessions:
    handler: src/handlers/sessions.handleDeletesessions
    events:
      - http:
          path: /sessions
          method: delete
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Logout from all devices"
          swaggerTags:
            - Sessions
          responseData:
            204:
              description: "All sessions revoked"
          documentation:
            summary: Logout from all devices
            description: Logout from all devices
            tags:
              - Sessions
            methodResponses:
              - statusCode: "204"
                responseBody:
                  description: All sessions revoked
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
  deletesessionid:
    handler: src/handlers/sessions.handleDeletesessionid
    events:
      - http:
          path: /sessions/{sessionId}
          method: delete
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Revoke a session"
          swaggerTags:
            - Sessions
          responseData:
            204:
              description: "Session revoked"
          documentation:
            summary: Revoke a session
            description: Revoke a session
            tags:
              - Sessions
            methodResponses:
              - statusCode: "204"
                responseBody:
                  description: Session revoked
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
            pathParams:
              - name: sessionId
                description: sessionId
                schema:
                  type: string
  getroles:
    handler: src/handlers/roles.handleGetroles
    events:
      - http:
          path: /roles
          method: get
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "List roles"
          swaggerTags:
            - Roles
          responseData:
            200:
              description: "Roles list"
          documentation:
            summary: List roles
            description: List roles
            tags:
              - Roles
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Roles list
                responseModels:
                  application/json: RoleList
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
  getpermissions:
    handler: src/handlers/permissions.handleGetpermissions
    events:
      - http:
          path: /permissions
          method: get
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "List permissions"
          swaggerTags:
            - Permissions
          responseData:
            200:
              description: "Permissions list"
          documentation:
            summary: List permissions
            description: List permissions
            tags:
              - Permissions
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Permissions list
                responseModels:
                  application/json: PermissionList
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
  # Cognito Pre Token Generation V2_0. Access-token \`roles\` requires a paid
  # Cognito feature plan (Essentials or Plus). This function does not replace
  # the user pool or any other trigger.
  preTokenGeneration:
    handler: src/handlers/pre-token-generation.handler
    description: Adds persisted identity classification and application role claims to Cognito access tokens.
    timeout: 5
    memorySize: 256
  attachPreTokenGeneration:
    handler: src/handlers/attach-pre-token-generation.handler
    description: Points the existing user pool pre-token trigger at V2_0.
    timeout: 60
    memorySize: 256
    role: !GetAtt AttachPreTokenGenerationRole.Arn
  backfillCustomerRoles:
    handler: src/handlers/backfill-customer-roles.handler
    description: One-shot backfill of CUSTOMER mappings for legacy users.
    timeout: 300
    memorySize: 256
  vendorEmailVerifiedRole:
    handler: src/handlers/vendor-email-verified-role.handler
    description: Grants VENDOR after Vendor Service has verified a completed vendor onboarding email.
    timeout: 30
    memorySize: 256
  postUserAdminRole:
    handler: src/handlers/roles.handleAssignAdminRole
    events:
      - http:
          path: /users/{userId}/roles
          method: post
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Assign the ADMIN application role"
          description: "Caller must already have ADMIN on the access token. The body role must be ADMIN. CUSTOMER and VENDOR are not assigned here."
          swaggerTags:
            - Roles
          responseData:
            200:
              description: "ADMIN role stored"
          documentation:
            summary: Assign the ADMIN application role
            description: Caller must already have ADMIN on the access token. The body role must be ADMIN. CUSTOMER and VENDOR are not assigned here.
            tags:
              - Roles
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: ADMIN role stored
                responseModels:
                  application/json: RoleAssignment
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
            pathParams:
              - name: userId
                description: userId
                schema:
                  type: string
            requestBody:
              description: Caller must already have ADMIN on the access token. The body role must be ADMIN. CUSTOMER and VENDOR are not assigned here.
              required: true
            requestModels:
              application/json: AssignAdminRoleRequest
  deleteUserAdminRole:
    handler: src/handlers/roles.handleRevokeAdminRole
    events:
      - http:
          path: /users/{userId}/roles/{role}
          method: delete
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Remove the ADMIN application role"
          description: "Caller must already have ADMIN on the access token. Only the ADMIN role can be removed through this route."
          swaggerTags:
            - Roles
          responseData:
            200:
              description: "ADMIN role removed"
          documentation:
            summary: Remove the ADMIN application role
            description: Caller must already have ADMIN on the access token. Only the ADMIN role can be removed through this route.
            tags:
              - Roles
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: ADMIN role removed
                responseModels:
                  application/json: RoleAssignment
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
            pathParams:
              - name: userId
                description: userId
                schema:
                  type: string
              - name: role
                description: role
                schema:
                  type: string
resources:
  Resources:
    IdentityTable: ${file(resources/dynamodb.yml):IdentityTable}
    AttachPreTokenGenerationRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          - PolicyName: attach-pre-token-generation
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - cognito-idp:DescribeUserPool
                    - cognito-idp:UpdateUserPool
                  Resource:
                    - arn:aws:cognito-idp:${self:provider.region}:${aws:accountId}:userpool/${env:COGNITO_USER_POOL_ID, 'us-east-1_LeQxyLZ3x'}
                - Effect: Allow
                  Action: iam:PassRole
                  # Pass only the existing Cognito SMS role
                  Resource: arn:aws:iam::${aws:accountId}:role/service-role/CognitoIdpSNSServiceRole
                - Effect: Allow
                  Action:
                    - xray:PutTraceSegments
                    - xray:PutTelemetryRecords
                  Resource: "*"
    PreTokenGenerationCognitoPermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !GetAtt PreTokenGenerationLambdaFunction.Arn
        Action: lambda:InvokeFunction
        Principal: cognito-idp.amazonaws.com
        SourceArn: arn:aws:cognito-idp:${self:provider.region}:${aws:accountId}:userpool/${env:COGNITO_USER_POOL_ID, 'us-east-1_LeQxyLZ3x'}
    AttachPreTokenGenerationTrigger:
      Type: AWS::CloudFormation::CustomResource
      DependsOn:
        - PreTokenGenerationCognitoPermission
      Properties:
        ServiceToken: !GetAtt AttachPreTokenGenerationLambdaFunction.Arn
        UserPoolId: ${env:COGNITO_USER_POOL_ID, 'us-east-1_LeQxyLZ3x'}
        FunctionArn: !GetAtt PreTokenGenerationLambdaFunction.Arn
    VendorRoleDlq:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.resourcePrefix}-identity-vendor-role-dlq
        MessageRetentionPeriod: 1209600
        SqsManagedSseEnabled: true
    VendorRoleDlqPolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref VendorRoleDlq
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: AllowEventBridgeSendToVendorRoleDlq
              Effect: Allow
              Principal:
                Service: events.amazonaws.com
              Action: sqs:SendMessage
              Resource: !GetAtt VendorRoleDlq.Arn
              Condition:
                StringEquals:
                  aws:SourceAccount: !Ref AWS::AccountId
    VendorRoleLifecycleRule:
      Type: AWS::Events::Rule
      DependsOn:
        - VendorRoleDlqPolicy
      Properties:
        Name: ${self:custom.resourcePrefix}-identity-vendor-role
        Description: Grants the VENDOR application role after authoritative vendor email verification
        EventBusName:
          Fn::ImportValue: ${self:custom.resourcePrefix}-vendor-event-bus-name
        EventPattern:
          source:
            - vendor-service
          detail-type:
            - Vendor.EmailVerified
        State: ENABLED
        Targets:
          - Id: IdentityVendorRole
            Arn: !GetAtt VendorEmailVerifiedRoleLambdaFunction.Arn
            DeadLetterConfig:
              Arn: !GetAtt VendorRoleDlq.Arn
            RetryPolicy:
              MaximumRetryAttempts: 3
    VendorRoleEventPermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !GetAtt VendorEmailVerifiedRoleLambdaFunction.Arn
        Action: lambda:InvokeFunction
        Principal: events.amazonaws.com
        SourceArn: !GetAtt VendorRoleLifecycleRule.Arn
    GatewayResponseDefault4XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: DEFAULT_4XX
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: >-
            'Content-Type,Authorization,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent,Sec-Ch-Ua,Sec-Ch-Ua-Mobile,Sec-Ch-Ua-Platform'
          gatewayresponse.header.Access-Control-Allow-Methods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"
    GatewayResponseDefault5XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: DEFAULT_5XX
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: >-
            'Content-Type,Authorization,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent,Sec-Ch-Ua,Sec-Ch-Ua-Mobile,Sec-Ch-Ua-Platform'
          gatewayresponse.header.Access-Control-Allow-Methods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"
    GatewayResponseUnauthorized:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: UNAUTHORIZED
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: >-
            'Content-Type,Authorization,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent,Sec-Ch-Ua,Sec-Ch-Ua-Mobile,Sec-Ch-Ua-Platform'
          gatewayresponse.header.Access-Control-Allow-Methods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"
    GatewayResponseAccessDenied:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: ACCESS_DENIED
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: >-
            'Content-Type,Authorization,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent,Sec-Ch-Ua,Sec-Ch-Ua-Mobile,Sec-Ch-Ua-Platform'
          gatewayresponse.header.Access-Control-Allow-Methods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"
  Outputs:
    IdentityTableName:
      Description: Name of the Identity Service DynamoDB table
      Value: !Ref IdentityTable
    IdentityTableArn:
      Description: ARN of the Identity Service DynamoDB table
      Value: !GetAtt IdentityTable.Arn
