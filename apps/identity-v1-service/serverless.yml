service: identity-v1-service

frameworkVersion: "3"

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-auto-swagger
  - serverless-offline

provider:
  name: aws
  runtime: nodejs22.x

  stage: ${opt:stage,'dev'}

  region: ${opt:region,'us-east-1'}

  environment:

    SERVICE_NAME: identity-v1-service
    LOG_LEVEL: ${ssm:/common/log-level}
    DYNAMODB_TABLE_NAME: ${ssm:/common/dynamodb/table}
    EVENT_BUS_NAME: ${ssm:/common/eventbus/name}

custom:


  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    concurrency: 10
    plugins: ./esbuild-plugins.js

  autoswagger:
    title: "Beauty on Wheels - Identity Service API"
    apiType: http
    basePath: /${self:provider.stage}
    schemes:
      - https
      - http
    generateSwaggerOnDeploy: true
    swaggerFiles:
      - swagger.json
    useStage: true
    swaggerPath: swagger
    typefiles:
      - ./src/types/api-types.d.ts
    excludeStages:
      - production


functions:


  postregister:
    handler: src/handlers/registration.handler.handlePostregister
    events:
      - http:
          path: /auth/register
          method: post
          cors: true
          summary: "Register a new user"
          swaggerTags:
            - Registration
          bodyType: RegisterRequest
          responseData:
            201:
              description: "User created"
              bodyType: User


  postlogin:
    handler: src/handlers/authentication.handler.handlePostlogin
    events:
      - http:
          path: /auth/login
          method: post
          cors: true
          summary: "Login"
          swaggerTags:
            - Authentication
          bodyType: LoginRequest
          responseData:
            200:
              description: "Login successful"
              bodyType: TokenResponse


  postrefreshtoken:
    handler: src/handlers/authentication.handler.handlePostrefreshtoken
    events:
      - http:
          path: /auth/refresh-token
          method: post
          cors: true
          summary: "Refresh access token"
          swaggerTags:
            - Authentication
          bodyType: RefreshTokenRequest
          responseData:
            200:
              description: "Token refreshed"
              bodyType: TokenResponse


  postlogout:
    handler: src/handlers/authentication.handler.handlePostlogout
    events:
      - http:
          path: /auth/logout
          method: post
          cors: true
          summary: "Logout current session"
          swaggerTags:
            - Authentication
          responseData:
            204:
              description: "Logged out"


  postchangepassword:
    handler: src/handlers/authentication.handler.handlePostchangepassword
    events:
      - http:
          path: /auth/change-password
          method: post
          cors: true
          summary: "Change password"
          swaggerTags:
            - Authentication
          bodyType: ChangePasswordRequest
          responseData:
            204:
              description: "Password changed"


  postsend:
    handler: src/handlers/otp.handler.handlePostsend
    events:
      - http:
          path: /otp/send
          method: post
          cors: true
          summary: "Send OTP"
          swaggerTags:
            - OTP
          bodyType: SendOtpRequest
          responseData:
            202:
              description: "OTP sent"


  postverify:
    handler: src/handlers/otp.handler.handlePostverify
    events:
      - http:
          path: /otp/verify
          method: post
          cors: true
          summary: "Verify OTP"
          swaggerTags:
            - OTP
          bodyType: VerifyOtpRequest
          responseData:
            204:
              description: "OTP verified"


  getme:
    handler: src/handlers/profile.handler.handleGetme
    events:
      - http:
          path: /me
          method: get
          cors: true
          summary: "Current authenticated user"
          swaggerTags:
            - Profile
          responseData:
            200:
              description: "Profile"
              bodyType: User


  getsessions:
    handler: src/handlers/sessions.handler.handleGetsessions
    events:
      - http:
          path: /sessions
          method: get
          cors: true
          summary: "List active sessions"
          swaggerTags:
            - Sessions
          responseData:
            200:
              description: "Sessions"


  deletesessions:
    handler: src/handlers/sessions.handler.handleDeletesessions
    events:
      - http:
          path: /sessions
          method: delete
          cors: true
          summary: "Logout from all devices"
          swaggerTags:
            - Sessions
          responseData:
            204:
              description: "All sessions revoked"


  deletesessionid:
    handler: src/handlers/sessions.handler.handleDeletesessionid
    events:
      - http:
          path: /sessions/{sessionId}
          method: delete
          cors: true
          summary: "Revoke a session"
          swaggerTags:
            - Sessions
          responseData:
            204:
              description: "Session revoked"


  getroles:
    handler: src/handlers/roles.handler.handleGetroles
    events:
      - http:
          path: /roles
          method: get
          cors: true
          summary: "List roles"
          swaggerTags:
            - Roles
          responseData:
            200:
              description: "Roles list"


  getpermissions:
    handler: src/handlers/permissions.handler.handleGetpermissions
    events:
      - http:
          path: /permissions
          method: get
          cors: true
          summary: "List permissions"
          swaggerTags:
            - Permissions
          responseData:
            200:
              description: "Permissions list"


iamRoleStatements:


    # IAM policies are injected from the enterprise template.


resources:
  Resources:
    GatewayResponseDefault4XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: DEFAULT_4XX
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: >-
            'Content-Type,Authorization,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent,Sec-Ch-Ua,Sec-Ch-Ua-Mobile,Sec-Ch-Ua-Platform'
          gatewayresponse.header.Access-Control-Allow-Methods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"

    GatewayResponseDefault5XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: DEFAULT_5XX
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: >-
            'Content-Type,Authorization,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent,Sec-Ch-Ua,Sec-Ch-Ua-Mobile,Sec-Ch-Ua-Platform'
          gatewayresponse.header.Access-Control-Allow-Methods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"

    GatewayResponseUnauthorized:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: UNAUTHORIZED
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: >-
            'Content-Type,Authorization,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent,Sec-Ch-Ua,Sec-Ch-Ua-Mobile,Sec-Ch-Ua-Platform'
          gatewayresponse.header.Access-Control-Allow-Methods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"

    GatewayResponseAccessDenied:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: ACCESS_DENIED
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: >-
            'Content-Type,Authorization,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent,Sec-Ch-Ua,Sec-Ch-Ua-Mobile,Sec-Ch-Ua-Platform'
          gatewayresponse.header.Access-Control-Allow-Methods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"