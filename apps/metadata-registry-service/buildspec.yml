version: 0.2

env:
  shell: bash
  parameter-store:
    NPM_TOKEN: /codebuild/github-packages-npm-token
  variables:
    STAGE: 'dev'
    DEPLOYMENT_BUCKET: 'dev-mvx-metadata-registry-service-bucket'
    STACK_NAME: 'dev-metadata-registry-service'

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "=== npm registry debug (pre-install) ==="
      - pwd
      - ls -la
      - ls -la .npmrc || echo "WARN no .npmrc in $(pwd)"
      - cat .npmrc || true
      - cat ~/.npmrc 2>/dev/null || echo "no ~/.npmrc"
      - npm config list
      - npm config get registry
      - npm config get @myvitalrx:registry || true
      - echo "NPM_TOKEN set=${NPM_TOKEN:+yes}"
      - echo "Installing dependencies..."
      - npm install --legacy-peer-deps

  pre_build:
    commands:
      - echo "Making scripts executable..."
      - chmod +x apps/metadata-registry-service/ci/*.sh

  build:
    commands:
      - echo "Starting build..."
      - apps/metadata-registry-service/ci/build.sh

  post_build:
    commands:
      - echo "Running deployment verification..."
      - apps/metadata-registry-service/ci/verify-artifacts.sh

artifacts:
  files:
    - apps/metadata-registry-service/packaged.yaml
    - apps/metadata-registry-service/.serverless/**/*
  discard-paths: no
