openapi: 3.0.3
info:
  title: Metadata Registry Service API
  description: |
    Centralized metadata type and value registry. List metadata values supports **optional**
    applicability filters (`module`, `category`, `condition`, `country`): only provided query
    parameters are applied; omitted dimensions are not filtered.

    Success and error bodies follow the shared `@api-hub/utils` envelope (`success`, `statusCode`,
    `message`, `data`, `error`, `meta`). Send `Authorization: Bearer <JWT>` when available so
    `createdBy` / `lastModifiedBy` can be derived from the token (handlers may still validate
    body fields per current Zod schemas).

    API Gateway often prefixes paths with the deployment stage (e.g. `/dev/metadata-types`).
    Set the **server** URL below to match your environment.
  version: 1.0.0

servers:
  - url: https://api.example.com/v1
    description: Replace with your API Gateway base URL (include stage prefix if used)

tags:
  - name: Health
    description: Health check
  - name: MetadataTypes
    description: Metadata type definitions
  - name: MetadataValues
    description: Metadata values and optional context filters

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: health
      responses:
        '200':
          description: Service is reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /metadata-types:
    get:
      tags: [MetadataTypes]
      summary: List metadata types (paginated)
      operationId: listMetadataTypes
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/NextToken'
        - $ref: '#/components/parameters/IncludeInactive'
      responses:
        '200':
          description: Paginated metadata types
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMetadataTypesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [MetadataTypes]
      summary: Create metadata type
      operationId: createMetadataType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMetadataTypeRequest'
      responses:
        '201':
          description: Metadata type created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataTypeCreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /metadata-types/{metadataTypeCode}:
    parameters:
      - $ref: '#/components/parameters/MetadataTypeCode'
    get:
      tags: [MetadataTypes]
      summary: Get metadata type by code
      operationId: getMetadataType
      responses:
        '200':
          description: Metadata type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataTypeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [MetadataTypes]
      summary: Update metadata type
      operationId: updateMetadataType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMetadataTypeRequest'
      responses:
        '200':
          description: Updated metadata type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataTypeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /metadata-types/{metadataTypeCode}/inactivate:
    patch:
      tags: [MetadataTypes]
      summary: Inactivate metadata type
      operationId: inactivateMetadataType
      parameters:
        - $ref: '#/components/parameters/MetadataTypeCode'
      responses:
        '200':
          description: Inactivated metadata type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataTypeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /metadata-types/{metadataTypeCode}/values:
    parameters:
      - $ref: '#/components/parameters/MetadataTypeCode'
    get:
      tags: [MetadataValues]
      summary: List metadata values (paginated, optional applicability filters)
      operationId: listMetadataValues
      description: |
        Optional query `module`, `category`, `condition`, `country` filter values in memory.
        If **none** of these are provided, no applicability filtering is applied.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/NextToken'
        - $ref: '#/components/parameters/IncludeInactive'
        - name: module
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: condition
          in: query
          schema:
            type: string
        - name: country
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated metadata values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMetadataValuesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [MetadataValues]
      summary: Create metadata value
      operationId: createMetadataValue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMetadataValueRequest'
      responses:
        '201':
          description: Metadata value created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataValueCreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /metadata-types/{metadataTypeCode}/values/{metadataValueCode}:
    parameters:
      - $ref: '#/components/parameters/MetadataTypeCode'
      - $ref: '#/components/parameters/MetadataValueCode'
    get:
      tags: [MetadataValues]
      summary: Get metadata value
      operationId: getMetadataValue
      responses:
        '200':
          description: Metadata value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataValueResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [MetadataValues]
      summary: Update metadata value
      operationId: updateMetadataValue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMetadataValueRequest'
      responses:
        '200':
          description: Updated metadata value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataValueResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /metadata-types/{metadataTypeCode}/values/{metadataValueCode}/inactivate:
    patch:
      tags: [MetadataValues]
      summary: Inactivate metadata value
      operationId: inactivateMetadataValue
      parameters:
        - $ref: '#/components/parameters/MetadataTypeCode'
        - $ref: '#/components/parameters/MetadataValueCode'
      responses:
        '200':
          description: Inactivated metadata value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataValueResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Optional; used to populate audit fields (e.g. createdBy, lastModifiedBy) when present

  parameters:
    MetadataTypeCode:
      name: metadataTypeCode
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    MetadataValueCode:
      name: metadataValueCode
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      description: Page size (1–100, default 50)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    NextToken:
      name: nextToken
      in: query
      description: Opaque pagination token from a previous response
      schema:
        type: string
    IncludeInactive:
      name: includeInactive
      in: query
      description: When true, include INACTIVE records
      schema:
        type: boolean
        default: false

  responses:
    BadRequest:
      description: Validation or bad input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Conflict:
      description: Conflict (e.g. duplicate code)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

  schemas:
    Message:
      type: object
      required: [title, description, severity]
      properties:
        title:
          type: string
        description:
          type: string
        severity:
          type: string
          enum: [SUCCESS, INFO, WARNING, ERROR]

    Meta:
      type: object
      required: [requestId, timestamp, version]
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
        version:
          type: string
          enum: [v1]

    ErrorBody:
      type: object
      properties:
        code:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    ApiErrorResponse:
      type: object
      required: [success, statusCode, message, data, error, meta]
      properties:
        success:
          type: boolean
          example: false
        statusCode:
          type: integer
        message:
          $ref: '#/components/schemas/Message'
        data:
          type: object
          nullable: true
          description: Always null on error responses
        error:
          $ref: '#/components/schemas/ErrorBody'
        meta:
          $ref: '#/components/schemas/Meta'

    ValueDataType:
      type: string
      enum: [Enum, Numeric, Boolean, Text]

    RegistryStatus:
      type: string
      enum: [ACTIVE, INACTIVE]

    MetadataType:
      type: object
      required:
        - metadataTypeCode
        - displayName
        - valueDataType
        - multiSelectAllowed
        - applicableModules
        - status
        - version
        - createdAt
        - lastModifiedAt
      properties:
        metadataTypeCode:
          type: string
        displayName:
          type: string
        description:
          type: string
        valueDataType:
          $ref: '#/components/schemas/ValueDataType'
        multiSelectAllowed:
          type: boolean
        applicableModules:
          type: array
          items:
            type: string
        attributeSchema:
          type: object
          additionalProperties: true
        status:
          $ref: '#/components/schemas/RegistryStatus'
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        lastModifiedAt:
          type: string
          format: date-time
        createdBy:
          type: string
        lastModifiedBy:
          type: string

    MetadataValue:
      type: object
      required:
        - metadataTypeCode
        - metadataValueCode
        - label
        - status
        - isGlobal
        - applicableModules
        - applicableCategories
        - applicableConditions
        - applicableCountries
        - valueAttributes
        - version
        - createdAt
        - lastModifiedAt
      properties:
        metadataTypeCode:
          type: string
        metadataValueCode:
          type: string
        label:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/RegistryStatus'
        isGlobal:
          type: boolean
        applicableModules:
          type: array
          items:
            type: string
        applicableCategories:
          type: array
          items:
            type: string
        applicableConditions:
          type: array
          items:
            type: string
        applicableCountries:
          type: array
          items:
            type: string
        valueAttributes:
          type: object
          additionalProperties: true
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        lastModifiedAt:
          type: string
          format: date-time
        createdBy:
          type: string
        lastModifiedBy:
          type: string

    PaginatedMetadataTypes:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MetadataType'
        nextToken:
          type: string
          description: Present when more pages exist

    PaginatedMetadataValues:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MetadataValue'
        nextToken:
          type: string

    CreateMetadataTypeRequest:
      type: object
      required:
        - metadataTypeCode
        - displayName
        - valueDataType
        - multiSelectAllowed
        - createdBy
      properties:
        metadataTypeCode:
          type: string
          minLength: 1
          maxLength: 256
        displayName:
          type: string
          minLength: 1
        description:
          type: string
        valueDataType:
          $ref: '#/components/schemas/ValueDataType'
        multiSelectAllowed:
          type: boolean
        applicableModules:
          type: array
          items:
            type: string
          default: []
        attributeSchema:
          type: object
          additionalProperties: true
        status:
          $ref: '#/components/schemas/RegistryStatus'
          default: ACTIVE

    UpdateMetadataTypeRequest:
      type: object
      required:
        - lastModifiedBy
      properties:
        displayName:
          type: string
          minLength: 1
        description:
          type: string
        valueDataType:
          $ref: '#/components/schemas/ValueDataType'
        multiSelectAllowed:
          type: boolean
        applicableModules:
          type: array
          items:
            type: string
        attributeSchema:
          type: object
          additionalProperties: true
        status:
          $ref: '#/components/schemas/RegistryStatus'
        lastModifiedBy:
          type: string

    CreateMetadataValueRequest:
      type: object
      required:
        - metadataValueCode
        - label
        - isGlobal
      properties:
        metadataValueCode:
          type: string
          minLength: 1
          maxLength: 256
        label:
          type: string
          minLength: 1
        description:
          type: string
        isGlobal:
          type: boolean
        applicableModules:
          type: array
          items:
            type: string
          default: []
        applicableCategories:
          type: array
          items:
            type: string
          default: []
        applicableConditions:
          type: array
          items:
            type: string
          default: []
        applicableCountries:
          type: array
          items:
            type: string
          default: []
        valueAttributes:
          type: object
          additionalProperties: true
          default: {}
        createdBy:
          type: string

    UpdateMetadataValueRequest:
      type: object
      properties:
        label:
          type: string
          minLength: 1
        description:
          type: string
        isGlobal:
          type: boolean
        applicableModules:
          type: array
          items:
            type: string
        applicableCategories:
          type: array
          items:
            type: string
        applicableConditions:
          type: array
          items:
            type: string
        applicableCountries:
          type: array
          items:
            type: string
        valueAttributes:
          type: object
          additionalProperties: true
        status:
          $ref: '#/components/schemas/RegistryStatus'
        lastModifiedBy:
          type: string

    HealthPayload:
      type: object
      required: [status, service, timestamp]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: metadata-registry-service
        timestamp:
          type: string
          format: date-time

    HealthResponse:
      type: object
      required: [success, statusCode, message, data, error, meta]
      properties:
        success:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 200
        message:
          $ref: '#/components/schemas/Message'
        data:
          $ref: '#/components/schemas/HealthPayload'
        error:
          type: object
          nullable: true
          description: Always null on success
        meta:
          $ref: '#/components/schemas/Meta'

    MetadataTypeResponse:
      type: object
      required: [success, statusCode, message, data, error, meta]
      properties:
        success:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 200
        message:
          $ref: '#/components/schemas/Message'
        data:
          $ref: '#/components/schemas/MetadataType'
        error:
          type: object
          nullable: true
          description: Always null on success
        meta:
          $ref: '#/components/schemas/Meta'

    MetadataTypeCreatedResponse:
      type: object
      required: [success, statusCode, message, data, error, meta]
      properties:
        success:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 201
        message:
          $ref: '#/components/schemas/Message'
        data:
          $ref: '#/components/schemas/MetadataType'
        error:
          type: object
          nullable: true
          description: Always null on success
        meta:
          $ref: '#/components/schemas/Meta'

    ListMetadataTypesResponse:
      type: object
      required: [success, statusCode, message, data, error, meta]
      properties:
        success:
          type: boolean
        statusCode:
          type: integer
        message:
          $ref: '#/components/schemas/Message'
        data:
          $ref: '#/components/schemas/PaginatedMetadataTypes'
        error:
          type: object
          nullable: true
          description: Always null on success
        meta:
          $ref: '#/components/schemas/Meta'

    ListMetadataValuesResponse:
      type: object
      required: [success, statusCode, message, data, error, meta]
      properties:
        success:
          type: boolean
        statusCode:
          type: integer
        message:
          $ref: '#/components/schemas/Message'
        data:
          $ref: '#/components/schemas/PaginatedMetadataValues'
        error:
          type: object
          nullable: true
          description: Always null on success
        meta:
          $ref: '#/components/schemas/Meta'

    MetadataValueResponse:
      type: object
      required: [success, statusCode, message, data, error, meta]
      properties:
        success:
          type: boolean
        statusCode:
          type: integer
        message:
          $ref: '#/components/schemas/Message'
        data:
          $ref: '#/components/schemas/MetadataValue'
        error:
          type: object
          nullable: true
          description: Always null on success
        meta:
          $ref: '#/components/schemas/Meta'

    MetadataValueCreatedResponse:
      type: object
      required: [success, statusCode, message, data, error, meta]
      properties:
        success:
          type: boolean
        statusCode:
          type: integer
          example: 201
        message:
          $ref: '#/components/schemas/Message'
        data:
          $ref: '#/components/schemas/MetadataValue'
        error:
          type: object
          nullable: true
          description: Always null on success
        meta:
          $ref: '#/components/schemas/Meta'
