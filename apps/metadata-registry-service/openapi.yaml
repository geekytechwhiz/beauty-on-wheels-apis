openapi: 3.0.3
info:
  title: Metadata Registry Service API (draft)
  description: |
    Draft specification generated for review. TODO — align with official OpenAPI when published.
    List metadata types unions legacy catalog rows (`METADATA_REGISTRY#CATALOG` / `METADATA_TYPE#…`), any existing
    `METADATA_TYPES` / `TYPE#…` index rows (read-only for old data), and type entities under `METADATA_TYPE#<code>`
    (scan). The service does not write new `METADATA_TYPES` catalog items.
  version: 0.1.0
servers:
  - url: https://api.example.com/{stage}
    variables:
      stage:
        default: dev

paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /metadata/{entityType}/status:
    patch:
      summary: Activate / inactivate type or value (new version)
      description: |
        `entityType=type`: body must include `metadataTypeCode` and `status` (`PatchMetadataTypeStatusRequest`).
        `entityType=value`: body must include `metadataTypeCode`, `status`, and `metadataValueCode` or `valueCode` (`PatchMetadataValueStatusRequest`).
      parameters:
        - name: entityType
          in: path
          required: true
          schema:
            type: string
            enum: [type, value]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/PatchMetadataTypeStatusRequest'
                - $ref: '#/components/schemas/PatchMetadataValueStatusRequest'
      responses:
        '200':
          description: |
            When `entityType` is `type`, the full updated metadata type record. When `entityType` is `value`, `MetadataValueResponse`.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: Updated metadata type record
                    additionalProperties: true
                  - $ref: '#/components/schemas/MetadataValueResponse'
  /metadata-values/{metadataTypeCode}/{metadataValueCode}/delete:
    patch:
      summary: Soft-delete metadata value (new immutable version, status DELETED)
      description: |
        Does not physically delete DynamoDB items or prior versions. Optional JSON body `reason` (trimmed, max 2000 chars).
      parameters:
        - name: metadataTypeCode
          in: path
          required: true
          schema: { type: string }
        - name: metadataValueCode
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 2000
      responses:
        '200':
          description: Flattened metadata value (`MetadataValueResponse`) at latest version (DELETED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataValueResponse'
        '404':
          description: Type or value not found
        '409':
          description: Already deleted or type inactive for mutation
  /metadata/{entityType}/audit:
    get:
      summary: Audit trail for a metadata type or value
      description: |
        `entityType=type`: query `metadataTypeCode` (required). `entityType=value`: query `metadataTypeCode` and
        `metadataValueCode` (or `valueCode` alias) required.
      parameters:
        - name: entityType
          in: path
          required: true
          schema:
            type: string
            enum: [type, value]
        - in: query
          name: metadataTypeCode
          required: true
          description: Always required. Identifies the parent type.
          schema: { type: string }
        - in: query
          name: metadataValueCode
          required: false
          description: Required when `entityType=value`. Identifies the value within the type.
          schema: { type: string }
        - in: query
          name: valueCode
          required: false
          description: Alias for `metadataValueCode` when `entityType=value`.
          schema: { type: string }
      responses:
        '200':
          description: List of audit records

  /metadata/{entityType}:
    get:
      summary: Get a single metadata type or value
      description: |
        `entityType=type`: query `metadataTypeCode` (required). `entityType=value`: query `metadataTypeCode` and
        `metadataValueCode` (or `valueCode`) required. Optional `status` filters the latest record (default ACTIVE).
        ALL returns ACTIVE and INACTIVE only; use status=DELETED for soft-deleted values.
      parameters:
        - name: entityType
          in: path
          required: true
          schema:
            type: string
            enum: [type, value]
        - in: query
          name: metadataTypeCode
          required: false
          schema: { type: string }
        - in: query
          name: metadataValueCode
          required: false
          schema: { type: string }
        - in: query
          name: valueCode
          required: false
          description: Alias for `metadataValueCode` when `entityType=value`.
          schema: { type: string }
        - in: query
          name: status
          description: >-
            Optional lifecycle filter. Default ACTIVE. ALL returns ACTIVE and INACTIVE only (excludes DELETED).
            Deleted records require status=DELETED explicitly.
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, DELETED, ALL]
      responses:
        '200':
          description: Metadata type or flattened metadata value
        '404':
          description: Not found
    post:
      summary: Create or update metadata type or value
      description: |
        Managed publish workflow for metadata types and values. The `action` query parameter is **required**;
        immediate publish without a change request is not supported.

        **`action=impact-preview`:** evaluates change impact against the internal change-policy catalog. Does **not**
        modify published metadata or save a draft unless previewing an existing draft by `changeRequestId`.

        **`action=publish`:** publishes a saved DRAFT change request into published metadata. Re-evaluates change
        impact at publish time (does not trust a prior preview). Body `{ "changeRequestId": "<id>" }` only.

        **Mode A (draft):** body `{ "changeRequestId": "<id>" }` — loads the saved DRAFT and previews its proposed payload.

        **Mode B (stateless):** body is the same metadata type/value payload as `action=draft` — validates input,
        compares against latest published metadata, returns impact summary without persisting.

        Path `entityType`: `type` — body `MetadataTypeCreateInput` / `MetadataTypeInput`. `value` — body
        `MetadataValueInput` (`metadataTypeCode` in body). For `action=draft`, `operation` is derived server-side:
        `Add` when the type/value does not exist yet (`baseVersion` null), `Update` when it exists (`baseVersion` =
        latest published version). Saving a new draft for the same entity replaces the prior active draft.
      parameters:
        - name: entityType
          in: path
          required: true
          schema:
            type: string
            enum: [type, value]
        - name: action
          in: query
          required: true
          description: |
            Publish workflow action. `draft` saves a change request without modifying published metadata.
            `impact-preview` returns change impact without publishing. `publish` activates a saved draft.
          schema:
            type: string
            enum: [draft, impact-preview, publish]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/MetadataTypeCreateInput'
                - $ref: '#/components/schemas/MetadataValueInput'
                - $ref: '#/components/schemas/ImpactPreviewDraftRequest'
                - $ref: '#/components/schemas/MetadataPublishRequest'
      responses:
        '200':
          description: |
            When `action=draft`, returns `ChangeRequestDraftResponse`. When `action=impact-preview`, returns
            `ImpactPreviewResponse`. When `action=publish`, returns `MetadataPublishResponse`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ChangeRequestDraftResponse'
                  - $ref: '#/components/schemas/ImpactPreviewResponse'
                  - $ref: '#/components/schemas/MetadataPublishResponse'
        '400':
          description: Validation error
        '404':
          description: Parent metadata type or update target not found
        '409':
          description: Conflict (e.g. value deleted, type inactive for value mutation)
  /metadata/{entityType}/list:
    get:
      summary: List metadata types or values for a type
      description: |
        `entityType=type`: `module`, `valueDataType` / `datatype`, and optional `status` lifecycle filter.
        Each type includes `metadataValueCount` (latest-version values for that type, using the same status rule as below).
        `entityType=value`: `metadataTypeCode` (required). Defaults to **ACTIVE** values only. Structured applicability
        filters: `applicableModules`, `applicableCategories`, `applicableConditions`, `applicableCountries`,
        `applicableLanguages` (comma-separated
        tokens, OR within a field, AND across fields; `isGlobal` values always included). The `search` query param is not supported.
      parameters:
        - name: entityType
          in: path
          required: true
          schema:
            type: string
            enum: [type, value]
        - in: query
          name: metadataTypeCode
          required: false
          description: Required when `entityType=value`.
          schema: { type: string }
        - in: query
          name: status
          description: >-
            Optional lifecycle filter; default ACTIVE. INACTIVE and DELETED list only that status.
            ALL returns ACTIVE and INACTIVE only (excludes DELETED). Deleted records require status=DELETED explicitly.
            When entityType=type, DELETED is not supported.
          schema:
            type: string
            enum:
              - ACTIVE
              - INACTIVE
              - DELETED
              - ALL
        - in: query
          name: module
          description: Used when `entityType=type` only.
          schema: { type: string }
        - in: query
          name: valueDataType
          description: Used when `entityType=type` only.
          schema: { type: string }
        - in: query
          name: datatype
          description: Used when `entityType=type` only.
          schema: { type: string }
        - in: query
          name: applicableModules
          description: When `entityType=value`; comma-separated enum tokens (e.g. `RPM` or `RPM,OP`).
          schema: { type: string }
        - in: query
          name: applicableCategories
          schema: { type: string }
        - in: query
          name: applicableConditions
          schema: { type: string }
        - in: query
          name: applicableCountries
          schema: { type: string }
        - in: query
          name: applicableLanguages
          description: >-
            When `entityType=value`; comma-separated language tokens (e.g. `EN` or `EN,FR`), same enum-token style as other applicability dimensions.
          schema: { type: string }
      responses:
        '200':
          description: Array of types or flattened values
  /metadata/relations:
    get:
      summary: List relations from a source value
      parameters:
        - in: query
          name: fromType
          required: true
          schema: { type: string }
        - in: query
          name: fromValue
          required: true
          schema: { type: string }
        - in: query
          name: relationType
          schema:
            type: string
            enum: [PARENT_CHILD, VALID_IN, SUPPORTED_BY, BELONGS_TO_CATEGORY]
        - in: query
          name: toType
          schema: { type: string }
      responses:
        '200':
          description: Wrapper object with `relations` array (see standard ApiResponse `data`)

  /metadata/values/related:
    get:
      summary: List related target values (minimal shape) for a source value
      parameters:
        - in: query
          name: fromType
          required: true
          schema: { type: string }
        - in: query
          name: fromValue
          required: true
          schema: { type: string }
        - in: query
          name: relationType
          schema:
            type: string
            enum: [PARENT_CHILD, VALID_IN, SUPPORTED_BY, BELONGS_TO_CATEGORY]
        - in: query
          name: toType
          schema: { type: string }
      responses:
        '200':
          description: Wrapper object with `values` array

  /metadata/relations/{id}:
    patch:
      summary: Update relation lifecycle status (activate, inactivate, or no-op)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            description: Opaque id returned by create / list (encodes PK/SK)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchRelationStatusRequest'
      responses:
        '200':
          description: Relation record after the requested status (unchanged on no-op)

components:
  parameters:
    metadataTypeCode:
      name: metadataTypeCode
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Z][A-Za-z0-9]*$'
    metadataValueCode:
      name: metadataValueCode
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Z0-9]+(_[A-Z0-9]+)*$'
  schemas:
    PatchStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: |
            Preferred values are `Active` and `Inactive` (UI / Figma). The service trims and
            case-normalizes; `ACTIVE` / `INACTIVE` and other casings are also accepted. Stored and
            response values remain uppercase `ACTIVE` or `INACTIVE`.
          enum: [Active, Inactive, ACTIVE, INACTIVE, active, inactive]
    PatchMetadataTypeStatusRequest:
      allOf:
        - type: object
          required: [metadataTypeCode]
          properties:
            metadataTypeCode:
              type: string
              description: Identifies the metadata type to update; not mutable via this endpoint
        - $ref: '#/components/schemas/PatchStatusRequest'
    PatchRelationStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          description: Target lifecycle status for the relation row (no-op when already at this status).
    PatchMetadataValueStatusRequest:
      oneOf:
        - allOf:
            - type: object
              required: [metadataTypeCode, metadataValueCode]
              properties:
                metadataTypeCode:
                  type: string
                  description: Parent type; required for every value status change
                metadataValueCode:
                  type: string
            - $ref: '#/components/schemas/PatchStatusRequest'
        - allOf:
            - type: object
              required: [metadataTypeCode, valueCode]
              properties:
                metadataTypeCode:
                  type: string
                  description: Parent type; required for every value status change
                valueCode:
                  type: string
                  description: Alias for `metadataValueCode`
            - $ref: '#/components/schemas/PatchStatusRequest'
    Applicability:
      type: object
      required: [module, category, condition, country]
      properties:
        module:
          type: array
          items: { type: string }
        category:
          type: array
          items: { type: string }
        condition:
          type: array
          items: { type: string }
        country:
          type: array
          items: { type: string }
        language:
          type: array
          items: { type: string }
    MetadataTypeInput:
      type: object
      description: |
        Upsert body for `POST /metadata/type`. **First create** requires: `metadataTypeCode`, `displayName` (max 100),
        `valueDataType`, `multiSelectAllowed`, `status` (ACTIVE|INACTIVE). `applicableModules` is optional (empty or omitted
        means the type is not restricted to specific platform modules — stored as `[]`).
        `description` and `attributeSchema` are optional. **Updates** may send a partial body; see `MetadataTypeCreateInput`
      properties:
        metadataTypeCode:
          type: string
          pattern: '^[A-Z][A-Za-z0-9]*$'
          description: Unique across registry; immutable after publish
        displayName:
          type: string
          maxLength: 100
        valueDataType:
          type: string
          enum: [Enum, Numeric, Boolean, Text]
        multiSelectAllowed: { type: boolean }
        applicableModules:
          type: array
          items: { type: string }
          description: Platform module tokens; omit or send `[]` when not module-scoped
        attributeSchema:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        supportsRelations: { type: boolean }
        relationFieldLabel: { type: string, nullable: true, maxLength: 150 }
        targetMetadataTypeCode:
          type: string
          nullable: true
          pattern: '^[A-Z][A-Za-z0-9]*$'
        selectionMode:
          type: string
          nullable: true
          enum: [SINGLE, MULTI]
        relationRequired: { type: boolean, nullable: true }
        relationType:
          $ref: '#/components/schemas/RelationType'
          nullable: true
        createdBy: { type: string }
        lastModifiedBy: { type: string }
    MetadataTypeCreateInput:
      type: object
      description: Strict shape for **creating** a metadata type (what the runtime requires on first insert).
      required:
        - metadataTypeCode
        - displayName
        - valueDataType
        - multiSelectAllowed
        - status
      properties:
        metadataTypeCode:
          type: string
          pattern: '^[A-Z][A-Za-z0-9]*$'
          description: Unique across registry; immutable after publish
        displayName:
          type: string
          maxLength: 100
        description: { type: string }
        valueDataType:
          type: string
          enum: [Enum, Numeric, Boolean, Text]
        multiSelectAllowed: { type: boolean }
        applicableModules:
          type: array
          items: { type: string }
          description: Optional; empty means not restricted to modules
        attributeSchema:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        supportsRelations: { type: boolean }
        relationFieldLabel: { type: string, nullable: true }
        targetMetadataTypeCode: { type: string, nullable: true }
        selectionMode:
          type: string
          nullable: true
          enum: [SINGLE, MULTI]
        relationRequired: { type: boolean, nullable: true }
        relationType:
          $ref: '#/components/schemas/RelationType'
          nullable: true
        createdBy: { type: string }
        lastModifiedBy: { type: string }
    MetadataRelationshipInputItem:
      type: object
      required: [targetMetadataValueCode]
      properties:
        targetMetadataValueCode:
          type: string
          description: Code of the related metadata value on the configured target metadata type
    RelationSelectionMode:
      type: string
      enum: [SINGLE, MULTI]
    MetadataValueInput:
      type: object
      description: |
        Upsert body for `POST /metadata/value` (include `metadataTypeCode` in the body).
        `valueCode` is immutable after the value is first published (create a new value for a new code).
        On **create**, `isGlobal` is required. On update, omitted fields keep existing values.
        **Request aliases** (same semantics): `metadataValueCode` ↔ `valueCode`; `valueAttributes` ↔ `attributes`;
        flat `applicable*` arrays ↔ nested `applicability` when the nested object is omitted.
        **Responses** use a single shape: `metadataValueCode`, `valueAttributes`, and flat `applicable*` only.
      required: [label]
      properties:
        valueCode:
          type: string
          description: MetadataValueCode; immutable after publish
        metadataValueCode:
          type: string
          description: Alias for `valueCode` (use one or the other)
        label:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
          maxLength: 2000
        sortOrder: { type: integer }
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        isGlobal:
          type: boolean
          description: Required on create
        attributes:
          type: object
          additionalProperties: true
          description: ValueAttributes; must match parent type AttributeSchema when defined
        valueAttributes:
          type: object
          additionalProperties: true
          description: Alias for `attributes`
        applicableModules:
          type: array
          items: { type: string }
        applicableCategories:
          type: array
          items: { type: string }
        applicableConditions:
          type: array
          items: { type: string }
        applicableCountries:
          type: array
          items: { type: string }
        applicableLanguages:
          type: array
          items: { type: string }
          description: Maps to applicability.language; token lists are normalized to uppercase
        applicability:
          $ref: '#/components/schemas/Applicability'
        relationships:
          type: array
          description: |
            UI-facing related values (codes only). Backend derives persisted relation direction from the parent metadata type.
            Omit on PATCH to leave existing relations unchanged.
          items:
            $ref: '#/components/schemas/MetadataRelationshipInputItem'
        createdBy:
          type: string
          description: Optional override for audit actor when not using API user context
    MetadataValueRelationshipResolved:
      type: object
      required: [metadataTypeCode, metadataValueCode, label]
      properties:
        metadataTypeCode: { type: string }
        metadataValueCode: { type: string }
        label: { type: string }
    MetadataValueResponse:
      type: object
      description: |
        Value resource as returned by GET / list / search / POST / PATCH. Flat applicability only (`applicable*` arrays);
        `metadataValueCode` and `valueAttributes` (no `valueCode`, `attributes`, or nested `applicability`).
      required:
        - metadataTypeCode
        - metadataValueCode
        - version
        - label
        - sortOrder
        - status
        - isGlobal
        - valueAttributes
        - applicableModules
        - applicableCategories
        - applicableConditions
        - applicableCountries
        - applicableLanguages
        - applSkKeys
        - createdAt
        - lastModifiedAt
      properties:
        metadataTypeCode: { type: string }
        metadataValueCode: { type: string }
        version: { type: integer }
        label: { type: string, maxLength: 150 }
        description: { type: string, maxLength: 2000 }
        sortOrder: { type: integer }
        status:
          type: string
          enum: [ACTIVE, INACTIVE, DELETED]
        isGlobal: { type: boolean }
        valueAttributes:
          type: object
          additionalProperties: true
        applicableModules:
          type: array
          items: { type: string }
        applicableCategories:
          type: array
          items: { type: string }
        applicableConditions:
          type: array
          items: { type: string }
        applicableCountries:
          type: array
          items: { type: string }
        applicableLanguages:
          type: array
          items: { type: string }
        applSkKeys:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        lastModifiedAt: { type: string, format: date-time }
        createdBy: { type: string }
        lastModifiedBy: { type: string }
        relationships:
          type: array
          description: Resolved neighbors when the parent metadata type has supportsRelations
          items:
            $ref: '#/components/schemas/MetadataValueRelationshipResolved'
        deletedAt:
          type: string
          format: date-time
          description: Present on soft-deleted latest versions only
        deletedBy:
          type: string
          description: Actor who performed soft delete
        deleteReason:
          type: string
          maxLength: 2000
          description: Optional reason from delete request body
        previousStatus:
          type: string
          enum: [ACTIVE, INACTIVE]
          description: Status immediately before transition to DELETED
    MetadataValueRecord:
      type: object
      description: |
        Persistence / domain shape (nested `applicability`, `valueCode`, `attributes`). HTTP value responses
        use schema `MetadataValueResponse` (flat `applicable*` and `metadataValueCode` / `valueAttributes` only).
      required:
        - metadataTypeCode
        - valueCode
        - version
        - label
        - sortOrder
        - status
        - isGlobal
        - attributes
        - applicability
        - applSkKeys
        - createdAt
        - lastModifiedAt
      properties:
        metadataTypeCode: { type: string }
        valueCode: { type: string }
        version: { type: integer }
        label: { type: string, maxLength: 150 }
        description: { type: string, maxLength: 2000 }
        sortOrder: { type: integer }
        status:
          type: string
          enum: [ACTIVE, INACTIVE, DELETED]
        isGlobal: { type: boolean }
        attributes:
          type: object
          additionalProperties: true
        applicability:
          $ref: '#/components/schemas/Applicability'
        applSkKeys:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        lastModifiedAt: { type: string, format: date-time }
        createdBy: { type: string }
        lastModifiedBy: { type: string }
        deletedAt: { type: string, format: date-time }
        deletedBy: { type: string }
        deleteReason: { type: string, maxLength: 2000 }
        previousStatus:
          type: string
          enum: [ACTIVE, INACTIVE]
    ValueSearchFilter:
      type: object
      properties:
        module:
          type: array
          items: { type: string }
        category:
          type: array
          items: { type: string }
        condition:
          type: array
          items: { type: string }
        country:
          type: array
          items: { type: string }
        language:
          type: array
          items: { type: string }
        status:
          type: string
          enum: [ACTIVE, INACTIVE, DELETED]

    ChangeRequestDraftResponse:
      type: object
      description: |
        Response for `POST /metadata/{entityType}?action=draft`. Represents a saved change request; published metadata
        is unchanged until a later publish step.
      required:
        - changeRequestId
        - status
        - entityType
        - operation
        - metadataTypeCode
        - baseVersion
        - createdAt
        - lastModifiedAt
      properties:
        changeRequestId:
          type: string
          description: Opaque draft identifier (ULID); use for impact preview and publish
        status:
          type: string
          enum: [DRAFT]
          description: Always `DRAFT` for this endpoint
        entityType:
          type: string
          enum: [type, value]
        operation:
          type: string
          enum: [Add, Update]
          description: |
            `Add` when no published type/value exists yet (`baseVersion` null). `Update` when editing existing published
            metadata (`baseVersion` is the latest published version at draft save time).
        metadataTypeCode:
          type: string
        metadataValueCode:
          type: string
          nullable: true
          description: Present when `entityType=value`; null when `entityType=type`
        baseVersion:
          type: integer
          nullable: true
          description: Latest published version at draft time; null for `operation=Add`
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        lastModifiedAt:
          type: string
          format: date-time

    ImpactPreviewDraftRequest:
      type: object
      description: Body for `POST /metadata/{entityType}?action=impact-preview` when previewing a saved draft.
      required: [changeRequestId]
      properties:
        changeRequestId:
          type: string
          description: Draft id returned from `action=draft`

    ImpactPreviewResponse:
      type: object
      description: |
        Response for `POST /metadata/{entityType}?action=impact-preview`. Published metadata is not modified.
      required:
        - entityType
        - operation
        - metadataTypeCode
        - baseVersion
        - nextVersion
        - changedFields
        - impactSummary
        - confirmationRequired
        - affectedConsumers
      properties:
        entityType:
          type: string
          enum: [type, value]
        operation:
          type: string
          enum: [Add, Update]
        metadataTypeCode:
          type: string
        metadataValueCode:
          type: string
          nullable: true
        changeRequestId:
          type: string
          nullable: true
          description: Present when preview is from a saved draft
        baseVersion:
          type: integer
          nullable: true
        nextVersion:
          type: integer
          nullable: true
          description: Version after publish — 1 for Add; baseVersion+1 when a new version is required; unchanged otherwise
        changedFields:
          type: array
          items:
            type: object
            required: [objectPath, operation, policyGroup]
            properties:
              objectPath: { type: string }
              operation:
                type: string
                enum: [Add, Update, Inactivate, Retire, Publish]
              oldValue: {}
              newValue: {}
              policyGroup:
                type: string
                description: Governed policy group (no ruleId exposed)
        impactSummary:
          type: object
          required:
            - policyGroups
            - versionImpact
            - requiresMetadataVersion
            - requiresTemplateAdoption
            - requiresOrgCapabilityReevaluation
            - runtimeImpact
            - mergeBehavior
            - uxDiffRequired
          properties:
            policyGroups:
              type: array
              items: { type: string }
            versionImpact:
              type: string
              enum: [Descriptive, Additive, Breaking]
            requiresMetadataVersion: { type: boolean }
            requiresTemplateAdoption: { type: boolean }
            requiresOrgCapabilityReevaluation: { type: boolean }
            runtimeImpact:
              type: string
              enum: [None, DisplayOnly, ReviewRequired, MigrationRequired]
            mergeBehavior:
              type: string
              enum: [SilentDisplayRefresh, AddOnly, PreserveOrgOverride, ManualReview, Block]
            uxDiffRequired: { type: boolean }
        confirmationRequired:
          type: boolean
          description: True when publish confirmation is recommended (breaking/template/org/runtime impact)
        affectedConsumers:
          type: array
          items: { type: string }
          description: Downstream areas that may need to react (Template, OrgCapability, Runtime, etc.)

    MetadataPublishRequest:
      type: object
      description: Body for `POST /metadata/{entityType}?action=publish`.
      required: [changeRequestId, confirmationAcknowledged, expectedBaseVersion]
      properties:
        changeRequestId:
          type: string
          description: Draft id returned from `action=draft`
        confirmationAcknowledged:
          type: boolean
          description: |
            Must be `true` when impact preview reported `confirmationRequired` (breaking/template/org/runtime impact).
            May be `false` for display-only or low-impact changes.
        expectedBaseVersion:
          type: integer
          nullable: true
          description: |
            Optimistic lock — latest published version the client expects. Must be `null` for `operation=Add`.
            For `Update`, must match the current published version or publish returns 409.

    MetadataPublishResponse:
      type: object
      description: |
        Response for `POST /metadata/{entityType}?action=publish`. Published metadata is updated; change request
        status becomes PUBLISHED. Impact is re-evaluated at publish time (no ruleId exposed).
      required:
        - changeRequestId
        - changeRevision
        - entityType
        - operation
        - metadataTypeCode
        - publishStrategy
        - version
        - impactSummary
        - published
      properties:
        changeRequestId:
          type: string
        changeRevision:
          type: integer
          minimum: 1
          description: |
            Monotonic registry-wide revision assigned at publish commit. Reused by downstream
            `MetadataChangePublished` events (addendum §6).
        entityType:
          type: string
          enum: [type, value]
        operation:
          type: string
          enum: [Add, Update]
        metadataTypeCode:
          type: string
        metadataValueCode:
          type: string
          nullable: true
        publishStrategy:
          type: string
          enum: [IN_PLACE, NEW_VERSION]
          description: IN_PLACE when display-only update; NEW_VERSION when policy requires a new metadata version
        version:
          type: integer
          description: Published metadata version after this publish
        impactSummary:
          type: object
          required:
            - policyGroups
            - versionImpact
            - requiresMetadataVersion
            - requiresTemplateAdoption
            - requiresOrgCapabilityReevaluation
            - runtimeImpact
            - mergeBehavior
            - uxDiffRequired
          properties:
            policyGroups:
              type: array
              items: { type: string }
            versionImpact:
              type: string
              enum: [Descriptive, Additive, Breaking]
            requiresMetadataVersion: { type: boolean }
            requiresTemplateAdoption: { type: boolean }
            requiresOrgCapabilityReevaluation: { type: boolean }
            runtimeImpact:
              type: string
              enum: [None, DisplayOnly, ReviewRequired, MigrationRequired]
            mergeBehavior:
              type: string
              enum: [SilentDisplayRefresh, AddOnly, PreserveOrgOverride, ManualReview, Block]
            uxDiffRequired: { type: boolean }
        published:
          description: Published metadata entity (`MetadataTypeInput` for type; `MetadataValueResponse` for value)
          oneOf:
            - $ref: '#/components/schemas/MetadataTypeInput'
            - $ref: '#/components/schemas/MetadataValueResponse'

    RelationType:
      type: string
      enum: [PARENT_CHILD, VALID_IN, SUPPORTED_BY, BELONGS_TO_CATEGORY]
    MetadataRelationRecord:
      type: object
      properties:
        id: { type: string }
        relationType: { $ref: '#/components/schemas/RelationType' }
        fromMetadataTypeCode: { type: string }
        fromMetadataValueCode: { type: string }
        toMetadataTypeCode: { type: string }
        toMetadataValueCode: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }
    RelatedValueRef:
      type: object
      properties:
        metadataTypeCode: { type: string }
        metadataValueCode: { type: string }
