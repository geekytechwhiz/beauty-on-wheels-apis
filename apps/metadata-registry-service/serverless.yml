service: metadata-registry-service
frameworkVersion: '3'
plugins:
  - serverless-dotenv-plugin
  - serverless-esbuild
  - serverless-offline
provider:
  name: aws
  runtime: nodejs22.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 30
  tracing:
    lambda: true
    apiGateway: true
  logRetentionInDays: 14
  environment:
    REGION: ${self:provider.region}
    METADATA_REGISTRY_TABLE: MetadataRegistry-${self:provider.stage}
    LOG_LEVEL: ${self:custom.logLevel.${self:provider.stage}, 'info'}
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
    DEFAULT_REGION: ${self:provider.region}
    ERROR_MESSAGES_CDN_URL: https://d2p9v61861q1ox.cloudfront.net
  tags:
    Service: ${self:service}
    Stage: ${self:provider.stage}
    ManagedBy: serverless
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:Query
        - dynamodb:Scan
        - dynamodb:BatchGetItem
        - dynamodb:BatchWriteItem
        - dynamodb:TransactWriteItems
        - dynamodb:DescribeTable
      Resource:
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/MetadataRegistry-${self:provider.stage}
    - Effect: Allow
      Action:
        - xray:PutTraceSegments
        - xray:PutTelemetryRecords
      Resource: '*'
package:
  individually: true
  patterns:
    - '!**/*.test.ts'
    - '!**/*.spec.ts'
custom:
  logLevel:
    dev: debug
    stg: info
    prd: warn
  deploymentBucket:
    dev: dev-mvx-metadata-registry-service-bucket
    stg: nvstg-mvx-metadata-registry-service-bucket
    prd: nvprd-mvx-metadata-registry-service-bucket
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    format: cjs
    tsconfig: ../../tsconfig.base.json
    external:
      - aws-sdk
    keepNames: true
    plugins: esbuild-plugins.js
    resolveExtensions:
      - .ts
      - .tsx
      - .js
      - .jsx
      - .json
    loader:
      .json: json
  cors:
    origin: ${env:CORS_ORIGIN, '*'}
    headers:
      - Content-Type
      - X-Amz-Date
      - Authorization
      - X-Api-Key
      - X-Correlation-Id
functions:
  healthV1:
    handler: src/handlers/v1/health.main
    events:
      - http:
          path: v1/health
          method: get
          cors: ${self:custom.cors}
  postMetadataV1:
    handler: src/handlers/v1/postMetadata.main
    events:
      - http:
          path: v1/metadata/{entityType}
          method: post
          cors: ${self:custom.cors}
  patchMetadataStatusV1:
    handler: src/handlers/v1/patchMetadataStatus.main
    events:
      - http:
          path: v1/metadata/{entityType}/status
          method: patch
          cors: ${self:custom.cors}
  getMetadataV1:
    handler: src/handlers/v1/getMetadata.main
    events:
      - http:
          path: v1/metadata/{entityType}
          method: get
          cors: ${self:custom.cors}
  listMetadataV1:
    handler: src/handlers/v1/listMetadata.main
    events:
      - http:
          path: v1/metadata/{entityType}/list
          method: get
          cors: ${self:custom.cors}
  listMetadataAuditV1:
    handler: src/handlers/v1/listMetadataAudit.main
    events:
      - http:
          path: v1/metadata/{entityType}/audit
          method: get
          cors: ${self:custom.cors}
  postMetadataRelationV1:
    handler: src/handlers/v1/postRelation.main
    events:
      - http:
          path: v1/metadata/relations
          method: post
          cors: ${self:custom.cors}
  getMetadataRelationsV1:
    handler: src/handlers/v1/getRelations.main
    events:
      - http:
          path: v1/metadata/relations
          method: get
          cors: ${self:custom.cors}
  getMetadataRelatedValuesV1:
    handler: src/handlers/v1/getRelatedValues.main
    events:
      - http:
          path: v1/metadata/values/related
          method: get
          cors: ${self:custom.cors}
  patchMetadataRelationV1:
    handler: src/handlers/v1/patchRelation.main
    events:
      - http:
          path: v1/metadata/relations/{id}
          method: patch
          cors: ${self:custom.cors}

resources:
  Resources:
    MetadataRegistryTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: MetadataRegistry-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST

        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
          - AttributeName: gsi1pk
            AttributeType: S
          - AttributeName: gsi1sk
            AttributeType: S
          - AttributeName: entityType
            AttributeType: S
          - AttributeName: sk1
            AttributeType: S
          - AttributeName: sk2
            AttributeType: S
          - AttributeName: sk3
            AttributeType: S
          - AttributeName: sk4
            AttributeType: S
          - AttributeName: sk5
            AttributeType: S

        KeySchema:
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE

        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: gsi1pk
                KeyType: HASH
              - AttributeName: gsi1sk
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

          - IndexName: GSI2
            KeySchema:
              - AttributeName: entityType
                KeyType: HASH
            Projection:
              ProjectionType: ALL

        LocalSecondaryIndexes:
          - IndexName: pk-sk1-index
            KeySchema:
              - AttributeName: pk
                KeyType: HASH
              - AttributeName: sk1
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

          - IndexName: pk-sk2-index
            KeySchema:
              - AttributeName: pk
                KeyType: HASH
              - AttributeName: sk2
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

          - IndexName: pk-sk3-index
            KeySchema:
              - AttributeName: pk
                KeyType: HASH
              - AttributeName: sk3
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

          - IndexName: pk-sk4-index
            KeySchema:
              - AttributeName: pk
                KeyType: HASH
              - AttributeName: sk4
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

          - IndexName: pk-sk5-index
            KeySchema:
              - AttributeName: pk
                KeyType: HASH
              - AttributeName: sk5
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: false

        SSESpecification:
          SSEEnabled: true
