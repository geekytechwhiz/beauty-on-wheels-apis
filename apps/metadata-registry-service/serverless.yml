service: metadata-registry-service

frameworkVersion: '3'

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-auto-swagger
  - serverless-offline

provider:
  name: aws
  runtime: nodejs22.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  deploymentBucket:
    name: ${self:provider.stage}-mvx-metadata-registry-service-bucket
    serverSideEncryption: AES256
  memorySize: 512
  timeout: 30

  tracing:
    lambda: true
    apiGateway: true

  logRetentionInDays: 14

  environment:
    REGION: ${self:provider.region}
    DEFAULT_REGION: ${self:provider.region}
    METADATA_REGISTRY_TABLE: MetadataRegistry-${self:provider.stage}
    EVENT_BUS: ${self:provider.stage}-metadata-registry-bus
    ERROR_MESSAGES_CDN_URL: https://d2p9v61861q1ox.cloudfront.net
    LOG_LEVEL: ${self:custom.logLevel.${self:provider.stage}, 'info'}
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'

  tags:
    Service: ${self:service}
    Stage: ${self:provider.stage}
    ManagedBy: serverless

  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:Query
        - dynamodb:BatchGetItem
        - dynamodb:BatchWriteItem
        - dynamodb:DescribeTable
      Resource:
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/MetadataRegistry-${self:provider.stage}
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/MetadataRegistry-${self:provider.stage}/index/*

    - Effect: Allow
      Action:
        - xray:PutTraceSegments
        - xray:PutTelemetryRecords
      Resource: '*'

    - Effect: Allow
      Action:
        - events:PutEvents
      Resource: '*'

package:
  individually: true
  patterns:
    - '!**/*.test.ts'
    - '!**/*.spec.ts'

custom:
  logLevel:
    dev: debug
    stg: info
    prd: warn
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    format: cjs
    tsconfig: ../../tsconfig.base.json
    external:
      - aws-sdk
    keepNames: true
    plugins: esbuild-plugins.js
    resolveExtensions:
      - '.ts'
      - '.tsx'
      - '.js'
      - '.jsx'
      - '.json'
    loader:
      '.json': 'json'

  autoswagger:
    title: Metadata Registry Service API
    description: Centralized metadata type and value registry with applicability filtering
    version: 1.0.0
    apiType: http
    basePath: /${self:provider.stage}
    schemes:
      - https
      - http
    generateSwaggerOnDeploy: true
    useStage: true
    swaggerPath: swagger
    excludeStages:
      - prd
    tags:
      - name: Health
        description: Health check endpoints
      - name: MetadataTypes
        description: Metadata type definitions
      - name: MetadataValues
        description: Metadata value operations with applicability filtering

functions:
  health:
    handler: src/handlers/health.main
    events:
      - http:
          path: /health
          method: get
          cors: true

  createMetadataType:
    handler: src/handlers/createMetadataType.main
    events:
      - http:
          path: /metadata-types
          method: post
          cors: true

  updateMetadataType:
    handler: src/handlers/updateMetadataType.main
    events:
      - http:
          path: /metadata-types/{metadataTypeCode}
          method: put
          cors: true

  inactivateMetadataType:
    handler: src/handlers/inactivateMetadataType.main
    events:
      - http:
          path: /metadata-types/{metadataTypeCode}/inactivate
          method: patch
          cors: true

  getMetadataType:
    handler: src/handlers/getMetadataType.main
    events:
      - http:
          path: /metadata-types/{metadataTypeCode}
          method: get
          cors: true

  listMetadataTypes:
    handler: src/handlers/listMetadataTypes.main
    events:
      - http:
          path: /metadata-types
          method: get
          cors: true

  createMetadataValue:
    handler: src/handlers/createMetadataValue.main
    events:
      - http:
          path: /metadata-types/{metadataTypeCode}/values
          method: post
          cors: true

  updateMetadataValue:
    handler: src/handlers/updateMetadataValue.main
    events:
      - http:
          path: /metadata-types/{metadataTypeCode}/values/{metadataValueCode}
          method: put
          cors: true

  inactivateMetadataValue:
    handler: src/handlers/inactivateMetadataValue.main
    events:
      - http:
          path: /metadata-types/{metadataTypeCode}/values/{metadataValueCode}/inactivate
          method: patch
          cors: true

  getMetadataValue:
    handler: src/handlers/getMetadataValue.main
    events:
      - http:
          path: /metadata-types/{metadataTypeCode}/values/{metadataValueCode}
          method: get
          cors: true

  listMetadataValues:
    handler: src/handlers/listMetadataValues.main
    events:
      - http:
          path: /metadata-types/{metadataTypeCode}/values
          method: get
          cors: true

resources:
  Resources:
    MetadataRegistryEventBus:
      Type: AWS::Events::EventBus
      Properties:
        Name: ${self:provider.stage}-metadata-registry-bus

    MetadataRegistryEventsDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: metadata-registry-events-dlq-${self:provider.stage}
