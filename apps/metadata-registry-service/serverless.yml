service: metadata-registry-service

frameworkVersion: '3'

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-auto-swagger
  - serverless-offline

provider:
  name: aws
  runtime: nodejs22.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  deploymentBucket:
    name: ${self:provider.stage}-mvx-metadata-registry-service-bucket
    serverSideEncryption: AES256
  memorySize: 512
  timeout: 30

  tracing:
    lambda: true
    apiGateway: true

  logRetentionInDays: 14

  environment:
    REGION: ${self:provider.region}
    DEFAULT_REGION: ${self:provider.region}
    METADATA_REGISTRY_TABLE: MetadataRegistry-${self:provider.stage}
    EVENT_BUS: ${self:provider.stage}-metadata-registry-bus
    ERROR_MESSAGES_CDN_URL: https://d2p9v61861q1ox.cloudfront.net
    LOG_LEVEL: ${self:custom.logLevel.${self:provider.stage}, 'info'}
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'

  tags:
    Service: ${self:service}
    Stage: ${self:provider.stage}
    ManagedBy: serverless

  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:Query
        - dynamodb:BatchGetItem
        - dynamodb:BatchWriteItem
        - dynamodb:DescribeTable
      Resource:
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/MetadataRegistry-${self:provider.stage}
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/MetadataRegistry-${self:provider.stage}/index/*

    - Effect: Allow
      Action:
        - xray:PutTraceSegments
        - xray:PutTelemetryRecords
      Resource: '*'

    - Effect: Allow
      Action:
        - events:PutEvents
      Resource: '*'

package:
  individually: true
  patterns:
    - '!**/*.test.ts'
    - '!**/*.spec.ts'

custom:
  logLevel:
    dev: debug
    stg: info
    prd: warn
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    format: cjs
    tsconfig: ../../tsconfig.base.json
    external:
      - aws-sdk
    keepNames: true
    plugins: esbuild-plugins.js
    resolveExtensions:
      - '.ts'
      - '.tsx'
      - '.js'
      - '.jsx'
      - '.json'
    loader:
      '.json': 'json'

  autoswagger:
    title: Metadata Registry Service API
    description: Centralized metadata type and value registry with applicability filtering
    version: 1.0.0
    apiType: http
    basePath: /${self:provider.stage}
    schemes:
      - https
      - http
    generateSwaggerOnDeploy: true
    useStage: true
    swaggerPath: swagger
    excludeStages:
      - prd
    tags:
      - name: Health
        description: Health check endpoints
      - name: MetadataTypes
        description: Metadata type definitions
      - name: MetadataValues
        description: Metadata value operations with applicability filtering

functions:
  health:
    handler: src/handlers/health.main
    events:
      - http:
          path: /health
          method: get
          cors: true

  createMetadataType:
    handler: src/handlers/createMetadataType.main
    events:
      - http:
          path: /metadata-types
          method: post
          cors: true

  updateMetadataType:
    handler: src/handlers/updateMetadataType.main
    events:
      - http:
          path: /metadata-types/{metadataTypeCode}
          method: put
          cors: true

  inactivateMetadataType:
    handler: src/handlers/inactivateMetadataType.main
    events:
      - http:
          path: /metadata-types/{metadataTypeCode}/inactivate
          method: patch
          cors: true

  getMetadataType:
    handler: src/handlers/getMetadataType.main
    events:
      - http:
          path: /metadata-types/{metadataTypeCode}
          method: get
          cors: true

  listMetadataTypes:
    handler: src/handlers/listMetadataTypes.main
    events:
      - http:
          path: /metadata-types
          method: get
          cors: true

  createMetadataValue:
    handler: src/handlers/createMetadataValue.main
    events:
      - http:
          path: /metadata-types/{metadataTypeCode}/values
          method: post
          cors: true

  updateMetadataValue:
    handler: src/handlers/updateMetadataValue.main
    events:
      - http:
          path: /metadata-types/{metadataTypeCode}/values/{metadataValueCode}
          method: put
          cors: true

  inactivateMetadataValue:
    handler: src/handlers/inactivateMetadataValue.main
    events:
      - http:
          path: /metadata-types/{metadataTypeCode}/values/{metadataValueCode}/inactivate
          method: patch
          cors: true

  getMetadataValue:
    handler: src/handlers/getMetadataValue.main
    events:
      - http:
          path: /metadata-types/{metadataTypeCode}/values/{metadataValueCode}
          method: get
          cors: true

  listMetadataValues:
    handler: src/handlers/listMetadataValues.main
    events:
      - http:
          path: /metadata-types/{metadataTypeCode}/values
          method: get
          cors: true

resources:
  Resources:
    MetadataRegistryTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: MetadataRegistry-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
          - AttributeName: gsi1pk
            AttributeType: S
          - AttributeName: gsi1sk
            AttributeType: S
          - AttributeName: sk1
            AttributeType: S
          - AttributeName: sk2
            AttributeType: S
          - AttributeName: sk3
            AttributeType: S
          - AttributeName: sk4
            AttributeType: S
          - AttributeName: sk5
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: gsi1pk
                KeyType: HASH
              - AttributeName: gsi1sk
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        LocalSecondaryIndexes:
          # sk1 = status – filter items by ACTIVE/INACTIVE within a
          # metadata-type partition without a GSI1 round-trip.
          - IndexName: pk-sk1-index
            KeySchema:
              - AttributeName: pk
                KeyType: HASH
              - AttributeName: sk1
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          # sk2 = createdAt – order items by creation timestamp for
          # audit trails and chronological listings.
          - IndexName: pk-sk2-index
            KeySchema:
              - AttributeName: pk
                KeyType: HASH
              - AttributeName: sk2
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          # sk3 = updatedAt – order items by last-update timestamp for
          # change-tracking and "recently modified" queries.
          - IndexName: pk-sk3-index
            KeySchema:
              - AttributeName: pk
                KeyType: HASH
              - AttributeName: sk3
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          # sk4 = metadataValueCode – look up all items (especially APPL
          # rows) sharing a value code, used by deleteAllApplForValue.
          - IndexName: pk-sk4-index
            KeySchema:
              - AttributeName: pk
                KeyType: HASH
              - AttributeName: sk4
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          # sk5 = entityType – separate METADATA_TYPE, METADATA_VALUE,
          # and METADATA_APPL items within a partition efficiently.
          - IndexName: pk-sk5-index
            KeySchema:
              - AttributeName: pk
                KeyType: HASH
              - AttributeName: sk5
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        Tags:
          - Key: Service
            Value: ${self:service}
          - Key: Stage
            Value: ${self:provider.stage}

    MetadataRegistryEventBus:
      Type: AWS::Events::EventBus
      Properties:
        Name: ${self:provider.stage}-metadata-registry-bus

    MetadataRegistryEventsDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: metadata-registry-events-dlq-${self:provider.stage}
