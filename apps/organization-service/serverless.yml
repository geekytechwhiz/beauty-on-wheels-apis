resources:
  Resources:
    GatewayResponseDefault4XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: DEFAULT_4XX
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: >-
            'Content-Type,Authorization,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent'
          gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"

    GatewayResponseDefault5XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: DEFAULT_5XX
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: >-
            'Content-Type,Authorization,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent'
          gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"


    # EventBridge Event Bus
    OrganizationServiceBus:
      Type: AWS::Events::EventBus
      Properties:
        Name: organization-service-bus-${self:provider.stage}
        Tags:
          - Key: Service
            Value: ${self:service}
          - Key: Stage
            Value: ${self:provider.stage}
          - Key: ManagedBy
            Value: serverless

    # SNS Topic for Organization Events
    OrganizationEventsTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: organization-events-topic-${self:provider.stage}
        DisplayName: Organization Events Topic
        Tags:
          - Key: Service
            Value: ${self:service}
          - Key: Stage
            Value: ${self:provider.stage}
          - Key: ManagedBy
            Value: serverless

  Outputs:
    OrganizationServiceBusName:
      Description: Name of the Organization Service Event Bus
      Value: !Ref OrganizationServiceBus
      Export:
        Name: ${self:provider.stage}-${self:service}-EventBusName

    OrganizationEventsTopicArn:
      Description: ARN of the Organization Events SNS Topic
      Value: !Ref OrganizationEventsTopic
      Export:
        Name: ${self:provider.stage}-${self:service}-OrganizationEventsTopicArn
