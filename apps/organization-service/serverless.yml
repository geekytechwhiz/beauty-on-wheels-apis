  listOrganizationUsers:
    handler: src/handlers/listOrganizationUsers.main
    timeout: 5
    memorySize: 256
    events:
      - http:
          path: organization/{organizationId}/users
          method: get
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          documentation:
            summary: List organization users
            description: Retrieves all users associated with an organization
            tags:
              - Organizations
              - Users
            pathParameters:
              - name: organizationId
                description: Unique identifier of the organization (UUID format)
                required: true
                schema:
                  type: string
                  format: uuid
            responses:
              200:
                description: Organization users retrieved successfully
              400:
                description: Bad request
              404:
                description: Organization not found
              500:
                description: Internal server error

  assignDeviceToOrganization:
    handler: src/handlers/assignDeviceToOrganization.main
    timeout: 10
    memorySize: 256
    events:
      - http:
          path: organization/{organizationId}/device/{deviceId}
          method: post
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}
          documentation:
            summary: Assign device to organization
            description: Assigns a device to an organization
            tags:
              - Organizations
              - Devices
            pathParameters:
              - name: organizationId
                description: Unique identifier of the organization (UUID format)
                required: true
                schema:
                  type: string
                  format: uuid
              - name: deviceId
                description: Unique identifier of the device (UUID format)
                required: true
                schema:
                  type: string
                  format: uuid
            responses:
              200:
                description: Device assigned to organization successfully
              400:
                description: Bad request
              404:
                description: Organization not found
              500:
                description: Internal server error

  removeDeviceFromOrganization:
    handler: src/handlers/removeDeviceFromOrganization.main
    timeout: 10
    memorySize: 256
    events:
      - http:
          path: organization/{organizationId}/device/{deviceId}
          method: delete
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}
          documentation:
            summary: Remove device from organization
            description: Removes a device from an organization
            tags:
              - Organizations
              - Devices
            pathParameters:
              - name: organizationId
                description: Unique identifier of the organization (UUID format)
                required: true
                schema:
                  type: string
                  format: uuid
              - name: deviceId
                description: Unique identifier of the device (UUID format)
                required: true
                schema:
                  type: string
                  format: uuid
            responses:
              200:
                description: Device removed from organization successfully
              400:
                description: Bad request
              404:
                description: Organization not found
              500:
                description: Internal server error

  listOrganizationDevices:
    handler: src/handlers/listOrganizationDevices.main
    timeout: 5
    memorySize: 256
    events:
      - http:
          path: organization/{organizationId}/devices
          method: get
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}
          documentation:
            summary: List organization devices
            description: Retrieves all devices associated with an organization
            tags:
              - Organizations
              - Devices
            pathParameters:
              - name: organizationId
                description: Unique identifier of the organization (UUID format)
                required: true
                schema:
                  type: string
                  format: uuid
            responses:
              200:
                description: Organization devices retrieved successfully
              400:
                description: Bad request
              404:
                description: Organization not found
              500:
                description: Internal server error

  updateOrganizationMetadata:
    handler: src/handlers/updateOrganizationMetadata.main
    timeout: 10
    memorySize: 256
    events:
      - http:
          path: organization/{organizationId}/metadata
          method: put
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}
          documentation:
            summary: Update organization metadata
            description: Updates custom metadata for an organization. Metadata can contain any key-value pairs.
            tags:
              - Organizations
              - Metadata
            pathParameters:
              - name: organizationId
                description: Unique identifier of the organization (UUID format)
                required: true
                schema:
                  type: string
                  format: uuid
            requestBody:
              description: Organization metadata object (key-value pairs)
              required: true
              content:
                application/json:
                  schema:
                    type: object
                    required:
                      - metadata
                    properties:
                      metadata:
                        type: object
                        description: Custom metadata as key-value pairs
                        additionalProperties: true
                      updatedBy:
                        type: string
                        description: Identifier of the user or system updating metadata
                      version:
                        type: number
                        description: Optional metadata version number
            responses:
              200:
                description: Organization metadata updated successfully
              400:
                description: Bad request
              404:
                description: Organization not found
              500:
                description: Internal server error

  listOrganizationFiles:
    handler: src/handlers/listOrganizationFiles.main
    timeout: 5
    memorySize: 256
    events:
      - http:
          path: organization/{organizationId}/files
          method: get
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}
          documentation:
            summary: List organization files
            description: Retrieves all files associated with an organization
            tags:
              - Organizations
              - Files
            pathParameters:
              - name: organizationId
                description: Unique identifier of the organization (UUID format)
                required: true
                schema:
                  type: string
                  format: uuid
            responses:
              200:
                description: Organization files retrieved successfully
              400:
                description: Bad request
              404:
                description: Organization not found
              500:
                description: Internal server error

  # S3 → EventBridge trigger
  uploadOrganizationFile:
    handler: src/handlers/s3/uploadOrganizationFile.main
    timeout: 30
    memorySize: 512
    events:
      - eventBridge:
          pattern:
            source:
              - aws.s3
            detail-type:
              - Object Created
            detail:
              bucket:
                name:
                  - organization-files-bucket-${self:provider.stage}

  organizationProfileStreamHandler:
    handler: src/handlers/stream/organizationProfileStreamHandler.main
    timeout: 30
    memorySize: 256
    # events:
    #   - stream:
    #       type: dynamodb
    #       arn:
    #         Fn::ImportValue: ${self:provider.stage}-OrganizationTableStreamArn
    #       batchSize: 10
    #       startingPosition: LATEST
    #       functionResponseType: ReportBatchItemFailures

resources:
  Resources:
    # EventBridge Event Bus
    OrganizationServiceBus:
      Type: AWS::Events::EventBus
      Properties:
        Name: organization-service-bus-${self:provider.stage}
        Tags:
          - Key: Service
            Value: ${self:service}
          - Key: Stage
            Value: ${self:provider.stage}
          - Key: ManagedBy
            Value: serverless

    # SNS Topic for Organization Events
    OrganizationEventsTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: organization-events-topic-${self:provider.stage}
        DisplayName: Organization Events Topic
        Tags:
          - Key: Service
            Value: ${self:service}
          - Key: Stage
            Value: ${self:provider.stage}
          - Key: ManagedBy
            Value: serverless

  Outputs:
    OrganizationServiceBusName:
      Description: Name of the Organization Service Event Bus
      Value: !Ref OrganizationServiceBus
      Export:
        Name: ${self:provider.stage}-${self:service}-EventBusName

    OrganizationEventsTopicArn:
      Description: ARN of the Organization Events SNS Topic
      Value: !Ref OrganizationEventsTopic
      Export:
        Name: ${self:provider.stage}-${self:service}-OrganizationEventsTopicArn
