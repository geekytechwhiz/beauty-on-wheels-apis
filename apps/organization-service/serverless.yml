# CodeBuild (when SEED_META=true) runs insert-org-vitals.js and needs dynamodb:PutItem on
# organization-table-<stage>. See CODEBUILD-IAM.md for the CodeBuild role policy.
service: organization-service

frameworkVersion: '3'

plugins:
  - serverless-plugin-warmup
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-auto-swagger
  - serverless-offline

provider:
  name: aws
  runtime: nodejs22.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  deploymentBucket:
    name: ${self:custom.deploymentBucket.${self:provider.stage}}
    serverSideEncryption: AES256
  memorySize: 512
  timeout: 30

  tracing:
    lambda: true
    apiGateway: true

  logRetentionInDays: 14

  environment:
    REGION: ${self:provider.region}
    ORGANIZATION_TABLE: organization-table-${self:provider.stage}
    ORGANIZATION_FILES_BUCKET: organization-files-bucket-${self:provider.stage}
    ORGANIZATION_EVENTS_TOPIC_ARN: arn:aws:sns:${self:provider.region}:${aws:accountId}:organization-events-topic-${self:provider.stage}
    EVENT_BUS: organization-service-bus-${self:provider.stage}
    LOG_LEVEL: ${self:custom.logLevel.${self:provider.stage}, 'info'}
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
    DEFAULT_REGION: ${self:provider.region}
    USER_SERVICE_URL: ${self:custom.userServiceUrl.${self:provider.stage}}
    ROLE_API_URL: ${self:custom.roleApiUrl.${self:provider.stage}}
    ERROR_MESSAGES_CDN_URL: https://d2p9v61861q1ox.cloudfront.net
    GET_ONBOARDING_SCREENS_LAMBDA: ${self:provider.stage}_global_get_onboarding_screens
    DEVICE_API_BASE_URL: ${self:custom.deviceApiUrl.${self:provider.stage}}
    SECRET_MANAGER_NAME: ${self:custom.SecretManagerService.${self:provider.stage}}

  tags:
    Service: ${self:service}
    Stage: ${self:provider.stage}
    ManagedBy: serverless

  iamRoleStatements:
    # DynamoDB
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:Query
        - dynamodb:BatchGetItem
        - dynamodb:BatchWriteItem
        - dynamodb:DescribeTable
      Resource:
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/organization-table-*
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/organization-table-*/index/*

    # S3 (organization files)
    - Effect: Allow
      Action:
        - s3:GetObject
        - s3:PutObject
        - s3:DeleteObject
        - s3:ListBucket
      Resource:
        - arn:aws:s3:::organization-files-bucket-${self:provider.stage}
        - arn:aws:s3:::organization-files-bucket-${self:provider.stage}/*

    # EventBridge
    - Effect: Allow
      Action:
        - events:PutEvents
      Resource:
        - arn:aws:events:${self:provider.region}:${aws:accountId}:event-bus/organization-service-bus-${self:provider.stage}

    # Secrets Manager (HMS API keys)
    - Effect: Allow
      Action:
        - secretsmanager:CreateSecret
        - secretsmanager:PutSecretValue
        - secretsmanager:GetSecretValue
      Resource:
        - arn:aws:secretsmanager:${self:provider.region}:${aws:accountId}:secret:${self:custom.SecretManagerService.${self:provider.stage}}
        - arn:aws:secretsmanager:${self:provider.region}:${aws:accountId}:secret:${self:custom.SecretManagerService.${self:provider.stage}}*

    # SNS (for organization events)
    - Effect: Allow
      Action:
        - sns:Publish
      Resource:
        - arn:aws:sns:${self:provider.region}:${aws:accountId}:organization-events-topic-${self:provider.stage}

    # X-Ray
    - Effect: Allow
      Action:
        - xray:PutTraceSegments
        - xray:PutTelemetryRecords
      Resource: '*'

    # Lambda (invoke onboarding screens lambda)
    - Effect: Allow
      Action:
        - lambda:InvokeFunction
      Resource:
        - arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_get_onboarding_screens
        - arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:dev_global_get_onboarding_screens

package:
  individually: true

custom:
  userServiceUrl:
    dev: https://e5gv0qum80.execute-api.us-east-1.amazonaws.com/dev/user
    stg: https://z79yqfg5n5.execute-api.us-east-1.amazonaws.com/stg/user
    prd: https://jtoofsw556.execute-api.us-east-1.amazonaws.com/prd/user
  roleApiUrl:
    dev: https://qtzgcngz60.execute-api.us-east-1.amazonaws.com/dev
    stg: https://qxsbrkassk.execute-api.us-east-1.amazonaws.com/stg
    prd: https://4dczf1vsgl.execute-api.us-east-1.amazonaws.com/prd
  deviceApiUrl:
    dev: https://qxsh98saok.execute-api.us-east-1.amazonaws.com/dev
    stg: https://0o74c84ww4.execute-api.us-east-1.amazonaws.com/stg
    prd: https://wrdiw6uwjl.execute-api.us-east-1.amazonaws.com/prd
  deploymentBucket:
    dev: dev-mvx-organization-service-bucket
    stg: nvstg-mvx-organization-service-bucket
    prd: nvprd-mvx-organization-service-bucket
  SecretManagerService:
    dev: DEV_DEMO_SECRETMANAGER
    stg: STG_DEMO_SECRETMANAGER
    prd: PRD_DEMO_SECRETMANAGER
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node18
    platform: node
    format: cjs
    tsconfig: ../../tsconfig.base.json
    external:
      - aws-sdk
    keepNames: true
    plugins: esbuild-plugins.js
    resolveExtensions:
      - '.ts'
      - '.tsx'
      - '.js'
      - '.jsx'
      - '.json'
    # Ensure .json (e.g. org-vitals.json) is inlined so health handler has default vitals in the bundle
    loader:
      .json: json
  autoswagger:
    title: Organization Service API
    description: RESTful API for managing organizations, users, metadata, and files
    version: 1.0.0
    apiType: http
    basePath: /${self:provider.stage}
    schemes:
      - https
      - http
    host: ${self:custom.apiHost, ''}
    generateSwaggerOnDeploy: true
    type: openapi3
    swaggerFiles:
      - swagger.json
    useStage: true
    swaggerPath: swagger
    excludeStages:
      - production
    swaggerOutputPath: swagger.json
    tags:
      - name: Health
        description: Health check endpoints
      - name: Organizations
        description: Organization management operations
      - name: Users
        description: Organization-user relationship operations
      - name: Metadata
        description: Organization metadata operations
      - name: Files
        description: Organization file management operations

  logLevel:
    dev: debug
    stg: info
    nvstg: info
    prd: warn

  # serverless-plugin-warmup: declare default warmer
  warmup:
    default: {}

  cors:
    origin: ${env:CORS_ORIGIN, '*'}
    headers:
      - Content-Type
      - X-Amz-Date
      - Authorization
      - X-Api-Key
      - X-Correlation-Id

functions:
  health:
    handler: src/handlers/health.main
    events:
      - http:
          path: /health
          method: get
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}
          documentation:
            summary: Health check endpoint
            description: Returns the health status of the service
            tags:
              - Health
            responses:
              200:
                description: Service is healthy
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        status:
                          type: string
                          example: "ok"

  createOrganization:
    handler: src/handlers/createOrganization.main
    timeout: 10
    memorySize: 256
    events:
      - http:
          path: organization
          method: post
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          documentation:
            summary: Create a new organization
            description: Creates a new organization in the system
            tags:
              - Organizations
            requestBody:
              description: Organization creation data
              required: true
              content:
                application/json:
                  schema:
                    type: object
                    required:
                      - name
                    properties:
                      organizationId:
                        type: string
                        format: uuid
                      name:
                        type: string
                        minLength: 1
                        maxLength: 255
                      email:
                        type: string
                        format: email
                      phone:
                        type: string
                      address:
                        type: string
                      city:
                        type: string
                      state:
                        type: string
                      country:
                        type: string
                      postalCode:
                        type: string
                      status:
                        type: string
                        enum: [ACTIVE, INACTIVE, SUSPENDED]
                      website:
                        type: string
                      taxId:
                        type: string
                      registrationNumber:
                        type: string
                      description:
                        type: string
                      industry:
                        type: string
                      size:
                        type: string
                        enum: [SMALL, MEDIUM, LARGE]
                        default: ACTIVE
            responses:
              201:
                description: Organization created successfully
              400:
                description: Bad request
              409:
                description: Organization already exists
              500:
                description: Internal server error

  getOrganization:
    handler: src/handlers/getOrganization.main
    warmup:
      default:
        enabled: true
    timeout: 30
    memorySize: 256
    events:
      - http:
          path: organization/{organizationId}
          method: get
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          documentation:
            summary: Get organization by ID
            description: Retrieves organization information by organization ID
            tags:
              - Organizations
            pathParameters:
              - name: organizationId
                description: Unique identifier of the organization (UUID format)
                required: true
                schema:
                  type: string
                  format: uuid
            responses:
              200:
                description: Organization retrieved successfully
              400:
                description: Bad request
              404:
                description: Organization not found
              500:
                description: Internal server error

  organizationList:
    handler: src/handlers/organizationList.main
    timeout: 5
    memorySize: 256
    events:
      - http:
          path: organization/list
          method: post
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          documentation:
            summary: List organizations
            description: Retrieves all organizations
            tags:
              - Organizations
            responses:
              200:
                description: Organizations retrieved successfully
              500:
                description: Internal server error

  updateOrganization:
    handler: src/handlers/updateOrganization.main
    timeout: 10
    memorySize: 256
    events:
      - http:
          path: organization/{organizationId}
          method: put
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          documentation:
            summary: Update organization information
            description: Updates organization information. Only provided fields will be updated.
            tags:
              - Organizations
            pathParameters:
              - name: organizationId
                description: Unique identifier of the organization (UUID format)
                required: true
                schema:
                  type: string
                  format: uuid
            requestBody:
              description: Organization update data (all fields are optional)
              required: true
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 255
                      email:
                        type: string
                        format: email
                      phone:
                        type: string
                      address:
                        type: string
                      city:
                        type: string
                      state:
                        type: string
                      country:
                        type: string
                      postalCode:
                        type: string
                      status:
                        type: string
                        enum: [ACTIVE, INACTIVE, SUSPENDED]
                      supportedVitals:
                        type: array
                        items:
                          type: string
            responses:
              200:
                description: Organization updated successfully
              400:
                description: Bad request
              404:
                description: Organization not found
              500:
                description: Internal server error

  deleteOrganization:
    handler: src/handlers/deleteOrganization.main
    timeout: 10
    memorySize: 256
    events:
      - http:
          path: organization/{organizationId}
          method: delete
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          documentation:
            summary: Delete an organization
            description: Deletes an organization from the system by organization ID (soft delete)
            tags:
              - Organizations
            pathParameters:
              - name: organizationId
                description: Unique identifier of the organization to delete (UUID format)
                required: true
                schema:
                  type: string
                  format: uuid
            responses:
              200:
                description: Organization deleted successfully
              400:
                description: Bad request
              404:
                description: Organization not found
              500:
                description: Internal server error

  linkUnlinkOrganization:
    handler: src/handlers/linkUnlinkOrganization.main
    timeout: 10
    memorySize: 256
    events:
      - http:
          path: organization/link-unlink
          method: post
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          documentation:
            summary: Link or unlink organizations
            description: Links or unlinks two organizations. ROOT_ADMIN only. For LINK, target org must be ACTIVE.
            tags:
              - Organizations
            requestBody:
              description: fromOrg, toOrg, action (LINK or UNLINK)
              required: true
              content:
                application/json:
                  schema:
                    type: object
                    required:
                      - fromOrg
                      - toOrg
                      - action
                    properties:
                      fromOrg:
                        type: string
                        description: Source organization ID
                      toOrg:
                        type: string
                        description: Target organization ID
                      action:
                        type: string
                        enum: [LINK, UNLINK]
            responses:
              201:
                description: Organizations linked or unlinked successfully
              400:
                description: Bad request (missing ids, invalid action, or target org not ACTIVE)
              403:
                description: Forbidden (not ROOT_ADMIN)
              404:
                description: Organization not found
              500:
                description: Internal server error

  setOrgStatus:
    handler: src/handlers/setOrgStatus.main
    timeout: 10
    memorySize: 256
    events:
      - http:
          path: organization/status
          method: post
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}
          documentation:
            summary: Set organization status
            description: Sets organization status (ACTIVE, HOLD, DISABLED). ROOT_ADMIN only.
            tags:
              - Organizations
            requestBody:
              description: organizationId, status
              required: true
              content:
                application/json:
                  schema:
                    type: object
                    required:
                      - organizationId
                      - status
                    properties:
                      organizationId:
                        type: string
                      status:
                        type: string
                        enum: [ACTIVE, HOLD, DISABLED]
            responses:
              201:
                description: Organization status updated
              400:
                description: Bad request
              403:
                description: Forbidden (not ROOT_ADMIN)
              404:
                description: Organization not found
              500:
                description: Internal server error

  getOrganizationCount:
    handler: src/handlers/getOrganizationCount.main
    timeout: 10
    memorySize: 256
    events:
      - http:
          path: organization/count
          method: post
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}
          documentation:
            summary: Get organization count
            description: Returns total and count by org type (pk=ORG_COUNT).
            tags:
              - Organizations
            responses:
              200:
                description: { total, orgType }
              500:
                description: Internal server error

  getLinkedOrganizations:
    handler: src/handlers/getLinkedOrganizations.main
    timeout: 15
    memorySize: 256
    events:
      - http:
          path: organization/linked
          method: post
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}
          documentation:
            summary: Get linked organizations
            description: Returns organizations linked to the given organization. Optional orgType filter and preferredOrgId for isPreferredOrg flag.
            tags:
              - Organizations
            requestBody:
              description: organizationId (required), orgType, userId, preferredOrgId, limit, nextPaginationKey
              required: true
              content:
                application/json:
                  schema:
                    type: object
                    required:
                      - organizationId
                    properties:
                      organizationId:
                        type: string
                        description: Organization whose linked orgs to fetch
                      orgType:
                        type: string
                        description: Optional filter by org type
                      userId:
                        type: string
                        description: Optional; for preferred-org resolution (BFF may pass preferredOrgId instead)
                      preferredOrgId:
                        type: string
                        description: Optional; when set, matching item gets isPreferredOrg true
                      limit:
                        type: integer
                        description: Max items per page (default 100)
                      nextPaginationKey:
                        type: string
                        description: Opaque pagination token (base64)
            responses:
              200:
                description: Linked organizations retrieved successfully
              400:
                description: Bad request (missing organizationId or no linked orgs found)
              500:
                description: Internal server error

