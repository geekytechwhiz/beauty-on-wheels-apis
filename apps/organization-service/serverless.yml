  updateOrganizationMetadata:
    handler: src/handlers/updateOrganizationMetadata.main
    timeout: 10
    memorySize: 256
    events:
      - http:
          path: organization/{organizationId}/metadata
          method: put
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}
          documentation:
            summary: Update organization metadata
            description: Updates custom metadata for an organization. Metadata can contain any key-value pairs.
            tags:
              - Organizations
              - Metadata
            pathParameters:
              - name: organizationId
                description: Unique identifier of the organization (UUID format)
                required: true
                schema:
                  type: string
                  format: uuid
            requestBody:
              description: Organization metadata object (key-value pairs)
              required: true
              content:
                application/json:
                  schema:
                    type: object
                    required:
                      - metadata
                    properties:
                      metadata:
                        type: object
                        description: Custom metadata as key-value pairs
                        additionalProperties: true
                      updatedBy:
                        type: string
                        description: Identifier of the user or system updating metadata
                      version:
                        type: number
                        description: Optional metadata version number
            responses:
              200:
                description: Organization metadata updated successfully
              400:
                description: Bad request
              404:
                description: Organization not found
              500:
                description: Internal server error

  getOrganizationMetadata:
    handler: src/handlers/getOrganizationMetadata.main
    timeout: 5
    memorySize: 256
    events:
      - http:
          path: organization/metadata
          method: get
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}
          documentation:
            summary: Get organization metadata
            description: Retrieves organization metadata configuration such as types, sizes, schedules, and supported values
            tags:
              - Organizations
              - Metadata
            queryParams:
              - name: type
                description: ROOT or ORGANIZATION (default ORGANIZATION)
                required: false
                schema:
                  type: string
                  example: ORGANIZATION
            responses:
              200:
                description: Organization metadata retrieved successfully
              400:
                description: Bad request
              500:
                description: Internal server error

  getExternalTenant:
    handler: src/handlers/getExternalTenant.main
    timeout: 5
    memorySize: 256
    events:
      - http:
          path: organization/get-external-tenant
          method: post
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}
          documentation:
            summary: Resolve tenant by subdomain
            description: Extracts subdomain from apiBaseUrl and resolves organization tenant via GSI2.
            tags:
              - Organizations
            requestBody:
              description: URL used to derive subdomain and optional provider (for GSI2 lookup)
              required: true
              content:
                application/json:
                  schema:
                    type: object
                    required:
                      - apiBaseUrl
                    properties:
                      apiBaseUrl:
                        type: string
                        format: uri
                      provider:
                        type: string
            responses:
              200:
                description: Tenant resolved successfully
              400:
                description: Validation error or invalid URL
              404:
                description: Tenant mapping not found

  listOrganizationFiles:
    handler: src/handlers/listOrganizationFiles.main
    timeout: 5
    memorySize: 256
    events:
      - http:
          path: organization/{organizationId}/files
          method: get
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}
          documentation:
            summary: List organization files
            description: Retrieves all files associated with an organization
            tags:
              - Organizations
              - Files
            pathParameters:
              - name: organizationId
                description: Unique identifier of the organization (UUID format)
                required: true
                schema:
                  type: string
                  format: uuid
            responses:
              200:
                description: Organization files retrieved successfully
              400:
                description: Bad request
              404:
                description: Organization not found
              500:
                description: Internal server error

  # S3 → EventBridge trigger
  uploadOrganizationFile:
    handler: src/handlers/s3/uploadOrganizationFile.main
    timeout: 30
    memorySize: 512
    events:
      - eventBridge:
          pattern:
            source:
              - aws.s3
            detail-type:
              - Object Created
            detail:
              bucket:
                name:
                  - organization-files-bucket-${self:provider.stage}

  organizationProfileStreamHandler:
    handler: src/handlers/stream/organizationProfileStreamHandler.main
    timeout: 30
    memorySize: 256
