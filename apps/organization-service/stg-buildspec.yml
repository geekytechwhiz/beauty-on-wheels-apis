version: 0.2

env:
  variables:
    STAGE: 'stg'
    DEPLOYMENT_BUCKET: 'nvstg-mvx-organization-service-bucket'
    STACK_NAME: 'stg-organization-service'
    SEED_META: ''
 
phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies..."
      - npm install --legacy-peer-deps

  pre_build:
    commands:
      - echo "Making scripts executable..."
      - chmod +x apps/organization-service/ci/*.sh

  build:
    commands:
      - echo "Starting build..."
      - apps/organization-service/ci/build.sh

  post_build:
    commands:
      - echo "Running deployment verification..."
      - apps/organization-service/ci/verify-artifacts.sh

artifacts:
  files:
    - apps/organization-service/packaged.yaml
    - apps/organization-service/.serverless/**/*
  discard-paths: no 