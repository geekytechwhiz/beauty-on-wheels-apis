service: service-catalog-service

frameworkVersion: "3"

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-auto-swagger
  - serverless-offline
  - serverless-openapi-documenter 
provider:
  name: aws
  runtime: nodejs22.x

  stage: ${opt:stage,'dev'}

  region: ${opt:region,'us-east-1'}

  versionFunctions: false

  environment:
    CORS_ALLOWED_ORIGINS: ${self:custom.corsAllowedOrigins}

    SERVICE_NAME: service-catalog-service
    LOG_LEVEL: INFO
    DYNAMODB_TABLE_NAME: ${self:service}-${self:provider.stage}-service-catalog
    # IAM invoke of the vendor pricing-configuration function. Catalog does not call the owner HTTP API.
    VENDOR_PRICING_CONFIGURATION_FUNCTION: vendor-service-api-${self:provider.stage}-getPricingConfiguration
    VENDOR_DISCOVERY_FACTS_FUNCTION: vendor-service-api-${self:provider.stage}-getDiscoveryFacts
    AVAILABILITY_BOOKABLE_FUNCTION: availability-service-${self:provider.stage}-findBookableOfferings
    EVENT_BUS_NAME:
      Fn::ImportValue: nv${self:provider.stage}-bw-vendor-event-bus-name
    VENDOR_BASE_URL: https://ysnqqonq60.execute-api.us-east-1.amazonaws.com/dev
    # Turn on only after GSI3 is ACTIVE and the offering-community backfill is verified.
    COMMUNITY_OFFERING_ENFORCEMENT: 'false'
    # dev approves new mappings. stg and prd keep admin approval. Any other stage stays false.
    COMMUNITY_OFFERING_AUTO_APPROVE: ${self:custom.communityOfferingAutoApprove.${self:provider.stage}, 'false'}
    COMMUNITY_DIRECTORY_FUNCTION: vendor-service-api-${self:provider.stage}-lookupActiveCommunities
    ASSET_URL: https://dev-use1-bw-static-assets.s3.us-east-1.amazonaws.com/dev
    
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:BatchGetItem
            - dynamodb:BatchWriteItem
            - dynamodb:TransactWriteItems
            - dynamodb:TransactGetItems
            - dynamodb:DescribeTable
          Resource:
            - !GetAtt ServiceCatalogTable.Arn
            - !Join [ "/", [ !GetAtt ServiceCatalogTable.Arn, "index", "*" ] ]
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource:
            - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:provider.environment.VENDOR_PRICING_CONFIGURATION_FUNCTION}
            - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:provider.environment.VENDOR_DISCOVERY_FACTS_FUNCTION}
            - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:provider.environment.AVAILABILITY_BOOKABLE_FUNCTION}
            - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:provider.environment.COMMUNITY_DIRECTORY_FUNCTION}
        - Effect: Allow
          Action:
            - events:PutEvents
          Resource:
            - Fn::Sub:
                - arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/${BusName}
                - BusName:
                    Fn::ImportValue: nv${self:provider.stage}-bw-vendor-event-bus-name
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource:
            - !GetAtt DiscoveryVendorLifecycleDlq.Arn
            - !GetAtt DiscoveryVendorFactsDlq.Arn
            - !GetAtt ServiceVisitStreamDlq.Arn
        - Effect: Allow
          Action:
            - xray:PutTraceSegments
            - xray:PutTelemetryRecords
          Resource: "*"

custom:
  communityOfferingAutoApprove:
    dev: 'true'
    stg: 'false'
    prd: 'false'
  httpCors: ${file(../../infra/serverless/config/rest-api-cors.yml)}
  corsAllowedOrigins: ${file(../../infra/serverless/config/cors-allowed-origins.yml):value}

  securedAuthorizer: ${file(../../infra/serverless/config/http-api-authorizer.yml)}


  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    concurrency: 10
    plugins: ./esbuild-plugins.js

  autoswagger:
    title: "Beauty on Wheels - Service Catalog Service API"
    apiType: http
    basePath: /${self:provider.stage}
    schemes:
      - https
      - http
    generateSwaggerOnDeploy: true
    swaggerFiles:
      - swagger.json
    useStage: true
    swaggerPath: swagger
    typefiles:
      - ./src/types/api-types.d.ts
    excludeStages:
      - production


  documentation:
    version: 1.0.0
    title: Beauty on Wheels - Service Catalog Service API
    description: Catalog categories, services, packages, add-ons, price calculation, and service visits.
    securitySchemes:
      bearerAuth:
        type: http
        scheme: bearer
        bearerFormat: JWT
    security:
      - bearerAuth: []
    servers:
      - url: https://{apiId}.execute-api.us-east-1.amazonaws.com/{stage}
        description: Deployed API Gateway stage
        variables:
          apiId:
            default: localhost
            description: API Gateway id
          stage:
            default: dev
            description: Deployment stage
    tags:
      - name: Categories
        description: Service categories
      - name: Services
        description: Bookable services
      - name: Packages
        description: Service packages
      - name: Pricing
        description: Price calculation
      - name: Add-ons
        description: Optional add-ons
      - name: Service visits
        description: Recurring community and doorstep visit windows
    models:
      - name: Category
        description: Service category
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                description:
                  type: string
                displayOrder:
                  type: integer
                active:
                  type: boolean
                serviceCount:
                  type: integer
      - name: CategoryPage
        description: Page of categories
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      description:
                        type: string
                      displayOrder:
                        type: integer
                      active:
                        type: boolean
                      serviceCount:
                        type: integer
      - name: Service
        description: Bookable catalog service
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                vendorId:
                  type: string
                categoryId:
                  type: string
                name:
                  type: string
                description:
                  type: string
                durationMinutes:
                  type: integer
                vehicleTypes:
                  type: array
                  items:
                    type: string
                    enum:
                      - HATCHBACK
                      - SEDAN
                      - SUV
                      - MUV
                      - LUXURY
                      - BIKE
                basePrice:
                  type: number
                active:
                  type: boolean
                communityIds:
                  type: array
                  items:
                    type: string
                communities:
                  type: array
                  items:
                    type: object
                    properties:
                      communityId:
                        type: string
                      approvalStatus:
                        type: string
                        enum:
                          - pending
                          - approved
                          - rejected
                      status:
                        type: string
                        enum:
                          - active
                          - inactive
                      version:
                        type: integer
                      approvalUpdatedAt:
                        type: string
                      approvalUpdatedBy:
                        type: string
      - name: OfferingCommunityApproval
        description: Admin approval decision for one service-community mapping
        content:
          application/json:
            schema:
              type: object
              required:
                - approvalStatus
                - version
              properties:
                approvalStatus:
                  type: string
                  enum:
                    - approved
                    - rejected
                version:
                  type: integer
                  minimum: 1
      - name: ServicePage
        description: Page of services
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      vendorId:
                        type: string
                      categoryId:
                        type: string
                      name:
                        type: string
                      description:
                        type: string
                      durationMinutes:
                        type: integer
                      vehicleTypes:
                        type: array
                        items:
                          type: string
                          enum:
                            - HATCHBACK
                            - SEDAN
                            - SUV
                            - MUV
                            - LUXURY
                            - BIKE
                      basePrice:
                        type: number
                      active:
                        type: boolean
      - name: Package
        description: Service package
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                vendorId:
                  type: string
                name:
                  type: string
                description:
                  type: string
                services:
                  type: array
                  items:
                    type: string
                discountedPrice:
                  type: number
      - name: PackagePage
        description: Page of packages
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      vendorId:
                        type: string
                      name:
                        type: string
                      description:
                        type: string
                      services:
                        type: array
                        items:
                          type: string
                      discountedPrice:
                        type: number
      - name: AddOn
        description: Optional add-on
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                vendorId:
                  type: string
                name:
                  type: string
                price:
                  type: number
                durationMinutes:
                  type: integer
      - name: AddOnPage
        description: Page of add-ons
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      vendorId:
                        type: string
                      name:
                        type: string
                      price:
                        type: number
                      durationMinutes:
                        type: integer
      - name: PricingCalculateRequest
        description: Price calculation input. Coupon codes are ignored.
        content:
          application/json:
            schema:
              type: object
              properties:
                vehicleType:
                  type: string
                  enum:
                    - HATCHBACK
                    - SEDAN
                    - SUV
                    - MUV
                    - LUXURY
                    - BIKE
                vendorId:
                  type: string
                serviceIds:
                  type: array
                  items:
                    type: string
                packageIds:
                  type: array
                  items:
                    type: string
                addOnIds:
                  type: array
                  items:
                    type: string
                addonIds:
                  type: array
                  items:
                    type: string
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - SERVICE
                          - PACKAGE
                      serviceId:
                        type: string
                      categoryId:
                        type: string
                      packageId:
                        type: string
                couponCode:
                  type: string
              required:
                - vehicleType
      - name: PricingResult
        description: Calculated price
        content:
          application/json:
            schema:
              type: object
              properties:
                currency:
                  type: string
                subtotal:
                  type: number
                discount:
                  type: number
                total:
                  type: number
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      amount:
                        type: number
      - name: ServiceVisitWindow
        description: One visit window. New windows require staff count and resources. Older windows may only have maxConcurrentBookings.
        content:
          application/json:
            schema:
              type: object
              required:
                - windowId
                - label
                - daysOfWeek
                - startTime
                - endTime
                - endDayOffset
              properties:
                windowId:
                  type: string
                label:
                  type: string
                  enum:
                    - earlyMorning
                    - morning
                    - afternoon
                    - evening
                    - night
                    - weekend
                    - custom
                daysOfWeek:
                  type: array
                  items:
                    type: string
                    enum: [MON, TUE, WED, THU, FRI, SAT, SUN]
                startTime:
                  type: string
                endTime:
                  type: string
                endDayOffset:
                  type: integer
                  enum: [0, 1]
                maxConcurrentBookings:
                  type: integer
                  description: Present on visits saved before staff count. Not derived from staffCount.
                bufferMinutes:
                  type: integer
                capacity:
                  type: object
                  required: [staffCount]
                  properties:
                    staffCount:
                      type: integer
                      minimum: 1
                resources:
                  type: object
                  required: [water, equipment]
                  properties:
                    water:
                      type: object
                      required: [source]
                      properties:
                        source:
                          type: string
                          enum: [vendorSupplied, communitySupplied, waterless]
                        capacityLiters:
                          type: integer
                          minimum: 1
                          description: Required only when source is vendorSupplied.
                    equipment:
                      type: object
                      required: [providedByVendor]
                      properties:
                        providedByVendor:
                          type: boolean
      - name: ServiceVisit
        description: Service visit configuration
        content:
          application/json:
            schema:
              type: object
              properties:
                visitId:
                  type: string
                vendorId:
                  type: string
                name:
                  type: string
                deliveryModel:
                  type: string
                  enum: [community, doorstep]
                location:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [community, serviceArea]
                    communityId:
                      type: string
                    serviceAreaId:
                      type: string
                    branchId:
                      type: string
                      description: Returned only for visits saved before branchId was removed from the request.
                timezone:
                  type: string
                windows:
                  type: array
                  items:
                    $ref: "#/components/schemas/ServiceVisitWindow"
                serviceIds:
                  type: array
                  items:
                    type: string
                staffIds:
                  type: array
                  items:
                    type: string
                effectiveFrom:
                  type: string
                effectiveUntil:
                  type: string
                  nullable: true
                status:
                  type: string
                  enum: [draft, active, paused, archived]
                version:
                  type: integer
      - name: ServiceVisitPage
        description: Page of service visits
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/ServiceVisit"
                nextToken:
                  type: string
      - name: ServiceVisitWrite
        description: Create or replace fields for a service visit. branchId is not accepted.
        content:
          application/json:
            schema:
              type: object
              required: [name, deliveryModel, location, timezone, windows, serviceIds, effectiveFrom]
              properties:
                name:
                  type: string
                deliveryModel:
                  type: string
                  enum: [community, doorstep]
                location:
                  type: object
                  required: [type]
                  properties:
                    type:
                      type: string
                      enum: [community, serviceArea]
                    communityId:
                      type: string
                    serviceAreaId:
                      type: string
                timezone:
                  type: string
                windows:
                  type: array
                  items:
                    $ref: "#/components/schemas/ServiceVisitWindow"
                serviceIds:
                  type: array
                  items:
                    type: string
                staffIds:
                  type: array
                  description: Optional. Individual staff assignment is not required.
                  items:
                    type: string
                effectiveFrom:
                  type: string
                effectiveUntil:
                  type: string
                  nullable: true
      - name: ErrorResponse
        description: Platform error envelope
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                statusCode:
                  type: integer
                message:
                  type: object
                  properties:
                    title:
                      type: string
                    description:
                      type: string
                    severity:
                      type: string
                data:
                  type: object
                  properties: {}
                error:
                  type: object
                  properties:
                    code:
                      type: string
                    details:
                      type: array
                      items:
                        type: object
                        properties:
                          field:
                            type: string
                          message:
                            type: string
                meta:
                  type: object
                  properties:
                    correlationId:
                      type: string
                    timestamp:
                      type: string
                    version:
                      type: string
functions:
  getBookingReadinessFacts:
    handler: src/handlers/internal.getBookingReadinessFacts
    description: "Internal invoke. Publishes the authoritative active bookable service count for booking readiness."
    timeout: 30


  getcategories:
    handler: src/handlers/categories-handler.handleGetcategories
    events:
      - http:
          path: /categories
          method: get
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "List categories"
          swaggerTags:
            - Categories
          responseData:
            200:
              description: "OK"
          documentation:
            summary: List categories
            description: List categories
            tags:
              - Categories
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: OK
                responseModels:
                  application/json: CategoryPage
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse


  postcategories:
    handler: src/handlers/categories-handler.handlePostcategories
    events:
      - http:
          path: /categories
          method: post
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Create category"
          swaggerTags:
            - Categories
          bodyType: Category
          responseData:
            201:
              description: "Created"
          documentation:
            summary: Create category
            description: Create category
            tags:
              - Categories
            methodResponses:
              - statusCode: "201"
                responseBody:
                  description: Created
                responseModels:
                  application/json: Category
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
            requestBody:
              description: Create category
              required: true
            requestModels:
              application/json: Category


  getcategoryid:
    handler: src/handlers/categories-handler.handleGetcategoryid
    events:
      - http:
          path: /categories/{categoryId}
          method: get
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Get category"
          swaggerTags:
            - Categories
          responseData:
            200:
              description: "OK"
          documentation:
            summary: Get category
            description: Get category
            tags:
              - Categories
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: OK
                responseModels:
                  application/json: Category
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
            pathParams:
              - name: categoryId
                description: categoryId
                schema:
                  type: string


  putcategoryid:
    handler: src/handlers/categories-handler.handlePutcategoryid
    events:
      - http:
          path: /categories/{categoryId}
          method: put
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Update category"
          swaggerTags:
            - Categories
          bodyType: Category
          responseData:
            200:
              description: "Updated"
          documentation:
            summary: Update category
            description: Update category
            tags:
              - Categories
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Updated
                responseModels:
                  application/json: Category
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
            pathParams:
              - name: categoryId
                description: categoryId
                schema:
                  type: string
            requestBody:
              description: Update category
              required: true
            requestModels:
              application/json: Category


  deletecategoryid:
    handler: src/handlers/categories-handler.handleDeletecategoryid
    events:
      - http:
          path: /categories/{categoryId}
          method: delete
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Delete category"
          swaggerTags:
            - Categories
          responseData:
            204:
              description: "Deleted"
          documentation:
            summary: Delete category
            description: Delete category
            tags:
              - Categories
            methodResponses:
              - statusCode: "204"
                responseBody:
                  description: Deleted
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
            pathParams:
              - name: categoryId
                description: categoryId
                schema:
                  type: string

  discoverServices:
    handler: src/handlers/discover-services-handler.discoverServicesHandler
    description: Discover car wash services across vendors
    timeout: 15
    memorySize: 512
    events:
      - http:
          path: catalog/discover
          method: get
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          queryStringParameters:
            - name: search
              description: Search query
              required: false
              schema:
                type: string
            - name: categoryId
              description: Category ID
              required: false
              schema:
                type: string
            - name: latitude
              description: Latitude
              required: false
              schema:
                type: number
            - name: longitude
              description: Longitude
              required: false
              schema:
                type: number
            - name: radiusKm
              description: Radius in kilometers
              required: false
              schema:
                type: number
            - name: vehicleType
              description: Vehicle type
              required: false
              schema:
                type: string
            - name: minPrice
              description: Minimum price
              required: false
              schema:
                type: number
            - name: maxPrice
              description: Maximum price
              required: false
              schema:
                type: number
            - name: minRating
              description: Minimum rating
              required: false
              schema:
                type: number
            - name: sortBy
              description: Sort by
              required: false
              schema:
                type: string
                enum:
                  - RELEVANCE
                  - DISTANCE_ASC
                  - PRICE_ASC
                  - PRICE_DESC

  getOfferings:
    handler: src/handlers/offerings-handler.getOfferings
    description: Customer marketplace list of bookable service offerings
    timeout: 15
    memorySize: 512
    events:
      - http:
          path: offerings
          method: get
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          queryStringParameters:
            - name: search
              required: false
              schema:
                type: string
            - name: categoryId
              required: false
              schema:
                type: string
            - name: vehicleType
              required: false
              schema:
                type: string
            - name: vendorId
              required: false
              schema:
                type: string
            - name: branchId
              required: false
              schema:
                type: string
            - name: latitude
              required: false
              schema:
                type: number
            - name: longitude
              required: false
              schema:
                type: number
            - name: radiusKm
              required: false
              schema:
                type: number
            - name: minPrice
              required: false
              schema:
                type: number
            - name: maxPrice
              required: false
              schema:
                type: number
            - name: minRating
              required: false
              schema:
                type: number
            - name: status
              required: false
              schema:
                type: string
                enum:
                  - active
            - name: availableOn
              required: false
              schema:
                type: string
            - name: startTime
              required: false
              schema:
                type: string
            - name: sort
              required: false
              schema:
                type: string
            - name: limit
              required: false
              schema:
                type: integer
            - name: cursor
              required: false
              schema:
                type: string
            - name: filter
              required: false
              schema:
                type: string
            - name: communityId
              required: false
              schema:
                type: string

  backfillDiscovery:
    handler: src/handlers/backfill-discovery-handler.handler
    description: Manual discovery projection backfill for one vendor. Invoke with vendorId and dryRun. No schedule.
    timeout: 300
    memorySize: 512

  onDiscoveryVendorLifecycle:
    handler: src/handlers/discovery-vendor-lifecycle-handler.handler
    description: Applies VendorApproved, VendorRejected, and VendorSuspended to discovery projections.
    timeout: 60
    memorySize: 512
    environment:
      DLQ_QUEUE_URL: !Ref DiscoveryVendorLifecycleDlq

  onDiscoveryVendorFacts:
    handler: src/handlers/discovery-vendor-facts-handler.handler
    description: Reloads branch, coverage, and pricing facts into discovery projections.
    timeout: 60
    memorySize: 512
    environment:
      DLQ_QUEUE_URL: !Ref DiscoveryVendorFactsDlq

  getservices:
    handler: src/handlers/services-handler.handleGetservices
    events:
      - http:
          path: /services
          method: get
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "List services"
          swaggerTags:
            - Services
          responseData:
            200:
              description: "OK"
          documentation:
            summary: List services for a vendor
            description: Lists services owned by vendorId. categoryId, active, vehicleType, and durationMinutes are optional filters. vehicleType returns offerings with a price for that vehicle and projects vehiclePricing to that entry. Pages keep querying the vendor partition until the limit is filled.
            queryParams:
              - name: vendorId
                description: Vendor that owns the services
                required: true
                schema:
                  type: string
              - name: categoryId
                description: Optional master category
                required: false
                schema:
                  type: string
              - name: vehicleType
                description: Canonical vehicle type. Invalid values are rejected. The list vehiclePricing array contains only this entry.
                required: false
                schema:
                  type: string
              - name: active
                description: true or false. Omit to return both.
                required: false
                schema:
                  type: boolean
              - name: durationMinutes
                description: Match a configured duration. With vehicleType, matches that vehicle's duration.
                required: false
                schema:
                  type: integer
              - name: limit
                description: Maximum number of matching services
                required: false
                schema:
                  type: integer
              - name: nextToken
                description: Continuation token from the previous page
                required: false
                schema:
                  type: string
            tags:
              - Services
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: OK
                responseModels:
                  application/json: ServicePage
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse


