  postpricingcalculate:
    handler: src/handlers/pricing-handler.handlePostpricingcalculate
    description: Server price for one vendor offering. Returns offeringVersion for booking. Coupons are ignored.
    events:
      - http:
          path: /pricing/calculate
          method: post
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Calculate price"
          description: >
            Calculates a deterministic INR total. Does not apply coupons.
            vehicleType must be a canonical vehicle type. Incompatible
            services return 400 VEHICLE_TYPE_NOT_SUPPORTED.
          swaggerTags:
            - Pricing
          bodyType: PricingCalculateRequest
          responseData:
            200:
              description: "Price calculated"
            400:
              description: "Invalid request or unsupported vehicle type"
            404:
              description: "Catalog entity not found"
            409:
              description: "Inactive catalog entity or disabled vendor offering"
            502:
              description: "Vendor pricing could not be read"
            503:
              description: "Vendor pricing URL is not configured"
          documentation:
            summary: Calculate price
            description: Calculates a deterministic INR total. Does not apply coupons. vehicleType must be a canonical vehicle type. Incompatible services return 400 VEHICLE_TYPE_NOT_SUPPORTED.
            tags:
              - Pricing
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Price calculated
                responseModels:
                  application/json: PricingResult
              - statusCode: "400"
                responseBody:
                  description: Invalid request or unsupported vehicle type
                responseModels:
                  application/json: ErrorResponse
              - statusCode: "404"
                responseBody:
                  description: Catalog entity not found
                responseModels:
                  application/json: ErrorResponse
              - statusCode: "409"
                responseBody:
                  description: Inactive catalog entity or disabled vendor offering
                responseModels:
                  application/json: ErrorResponse
              - statusCode: "502"
                responseBody:
                  description: Vendor pricing could not be read
                responseModels:
                  application/json: ErrorResponse
              - statusCode: "503"
                responseBody:
                  description: Vendor pricing URL is not configured
                responseModels:
                  application/json: ErrorResponse
            requestBody:
              description: Calculates a deterministic INR total. Does not apply coupons. vehicleType must be a canonical vehicle type. Incompatible services return 400 VEHICLE_TYPE_NOT_SUPPORTED.
              required: true
            requestModels:
              application/json: PricingCalculateRequest


