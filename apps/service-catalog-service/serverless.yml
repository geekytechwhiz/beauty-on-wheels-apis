service: service-catalog-service

frameworkVersion: "3"

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-auto-swagger
  - serverless-offline
  - serverless-openapi-documenter 
provider:
  name: aws
  runtime: nodejs22.x

  stage: ${opt:stage,'dev'}

  region: ${opt:region,'us-east-1'}

  versionFunctions: false

  environment:
    CORS_ALLOWED_ORIGINS: ${self:custom.corsAllowedOrigins}

    SERVICE_NAME: service-catalog-service
    LOG_LEVEL: INFO
    DYNAMODB_TABLE_NAME: ${self:service}-${self:provider.stage}-service-catalog
    # IAM invoke of the vendor pricing-configuration function. Catalog does not call the owner HTTP API.
    VENDOR_PRICING_CONFIGURATION_FUNCTION: vendor-service-api-${self:provider.stage}-getPricingConfiguration
    VENDOR_DISCOVERY_FACTS_FUNCTION: vendor-service-api-${self:provider.stage}-getDiscoveryFacts
    AVAILABILITY_BOOKABLE_FUNCTION: availability-service-${self:provider.stage}-findBookableOfferings
    EVENT_BUS_NAME:
      Fn::ImportValue: nv${self:provider.stage}-bw-vendor-event-bus-name
    VENDOR_BASE_URL: https://ysnqqonq60.execute-api.us-east-1.amazonaws.com/dev
    # dev approves new mappings. stg and prd keep admin approval. Any other stage stays false.
    COMMUNITY_OFFERING_AUTO_APPROVE: ${self:custom.communityOfferingAutoApprove.${self:provider.stage}, 'false'}
    COMMUNITY_DIRECTORY_FUNCTION: vendor-service-api-${self:provider.stage}-lookupActiveCommunities
    ASSET_URL: https://dev-use1-bw-static-assets.s3.us-east-1.amazonaws.com/dev
    
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:BatchGetItem
            - dynamodb:BatchWriteItem
            - dynamodb:TransactWriteItems
            - dynamodb:TransactGetItems
            - dynamodb:DescribeTable
          Resource:
            - !GetAtt ServiceCatalogTable.Arn
            - !Join [ "/", [ !GetAtt ServiceCatalogTable.Arn, "index", "*" ] ]
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource:
            - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:provider.environment.VENDOR_PRICING_CONFIGURATION_FUNCTION}
            - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:provider.environment.VENDOR_DISCOVERY_FACTS_FUNCTION}
            - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:provider.environment.AVAILABILITY_BOOKABLE_FUNCTION}
            - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:provider.environment.COMMUNITY_DIRECTORY_FUNCTION}
        - Effect: Allow
          Action:
            - events:PutEvents
          Resource:
            - Fn::Sub:
                - arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/${BusName}
                - BusName:
                    Fn::ImportValue: nv${self:provider.stage}-bw-vendor-event-bus-name
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource:
            - !GetAtt DiscoveryVendorLifecycleDlq.Arn
            - !GetAtt DiscoveryVendorFactsDlq.Arn
            - !GetAtt ServiceVisitStreamDlq.Arn
        - Effect: Allow
          Action:
            - xray:PutTraceSegments
            - xray:PutTelemetryRecords
          Resource: "*"

custom:
  communityOfferingAutoApprove:
    dev: 'true'
    stg: 'false'
    prd: 'false'
  httpCors: ${file(../../infra/serverless/config/rest-api-cors.yml)}
  corsAllowedOrigins: ${file(../../infra/serverless/config/cors-allowed-origins.yml):value}

  securedAuthorizer: ${file(../../infra/serverless/config/http-api-authorizer.yml)}


  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    concurrency: 10
    plugins: ./esbuild-plugins.js

  autoswagger:
    title: "Beauty on Wheels - Service Catalog Service API"
    apiType: http
    basePath: /${self:provider.stage}
    schemes:
      - https
      - http
    generateSwaggerOnDeploy: true
    swaggerFiles:
      - swagger.json
    useStage: true
    swaggerPath: swagger
    typefiles:
      - ./src/types/api-types.d.ts
    excludeStages:
      - production


  documentation:
    version: 1.0.0
    title: Beauty on Wheels - Service Catalog Service API
    description: Platform categories and provider offerings (PACKAGE type with inline included services). Customer discovery via GET /offerings.
    securitySchemes:
      bearerAuth:
        type: http
        scheme: bearer
        bearerFormat: JWT
    security:
      - bearerAuth: []
    servers:
      - url: https://{apiId}.execute-api.us-east-1.amazonaws.com/{stage}
        description: Deployed API Gateway stage
        variables:
          apiId:
            default: localhost
            description: API Gateway id
          stage:
            default: dev
            description: Deployment stage
    tags:
      - name: Categories
        description: Platform-managed service categories
      - name: Offerings
        description: Provider offerings (PACKAGE) and customer marketplace discovery
      - name: Offering communities
        description: Community coverage mappings for an offering
    models:
      - name: Category
        description: Service category
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                description:
                  type: string
                displayOrder:
                  type: integer
                active:
                  type: boolean
                serviceCount:
                  type: integer
      - name: CategoryPage
        description: Page of categories
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      description:
                        type: string
                      displayOrder:
                        type: integer
                      active:
                        type: boolean
                      serviceCount:
                        type: integer

      - name: CreateOfferingRequest
        description: Create a PACKAGE offering with inline included services
        content:
          application/json:
            schema:
              type: object
              required:
                - vendorId
                - categoryId
                - offeringType
                - name
                - billingPeriod
                - vehiclePricing
                - includedServices
              properties:
                vendorId:
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
                  description: Owning vendor. Must match the authenticated caller's vendor from `/vendors/me`.
                categoryId:
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
                  description: Platform-managed category for the offering. Must exist and be active.
                offeringType:
                  type: string
                  enum:
                    - PACKAGE
                  description: Discriminator. PACKAGE is the supported type; SERVICE is reserved.
                name:
                  type: string
                  maxLength: 100
                description:
                  type: string
                  maxLength: 500
                billingPeriod:
                  type: string
                  enum:
                    - oneTime
                    - weekly
                    - monthly
                    - yearly
                currency:
                  type: string
                  minLength: 3
                  maxLength: 3
                  default: INR
                validityDays:
                  type: integer
                  minimum: 1
                  maximum: 730
                  description: Purchase validity window in days for oneTime packages; optional metadata for recurring periods
                vehiclePricing:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - vehicleType
                      - price
                      - durationMinutes
                    properties:
                      vehicleType:
                        type: string
                        enum:
                          - HATCHBACK
                          - SEDAN
                          - SUV
                          - MUV
                          - LUXURY
                          - BIKE
                      price:
                        type: integer
                        minimum: 0
                        description: Integer minor units (paise for INR)
                      durationMinutes:
                        type: integer
                        minimum: 1
                        description: Total package duration across visits in the billing period for this vehicle (not per-visit)
                includedServices:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - name
                      - categoryId
                      - visitsPerPeriod
                      - durationMinutes
                    properties:
                      name:
                        type: string
                      description:
                        type: string
                      categoryId:
                        type: string
                        description: Platform-managed category id
                      tags:
                        type: array
                        items:
                          type: string
                      serviceKey:
                        type: string
                        minLength: 1
                        maxLength: 64
                        pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
                        description: Stable entitlement identity; unique within the offering when set
                      visitsPerPeriod:
                        type: integer
                        minimum: 1
                      durationMinutes:
                        type: integer
                        minimum: 1
                        description: Duration of one visit of this included service
                visitWindows:
                  type: array
                  minItems: 1
                  maxItems: 20
                  description: Package-defined preferred visit windows (not confirmed slots)
                  items:
                    type: object
                    required:
                      - visitWindowId
                      - label
                    properties:
                      visitWindowId:
                        type: string
                      label:
                        type: string
                      allDay:
                        type: boolean
                      startTime:
                        type: string
                        pattern: '^\\d{2}:\\d{2}$'
                      endTime:
                        type: string
                        pattern: '^\\d{2}:\\d{2}$'
                status:
                  type: string
                  enum:
                    - draft
                    - published
                  default: draft
                displayOrder:
                  type: integer
                  minimum: 0
                communityIds:
                  type: array
                  maxItems: 25
                  items:
                    type: string
              example:
                vendorId: vend_demo_001
                categoryId: cat_wash
                offeringType: PACKAGE
                name: Premium weekly wash
                description: Interior and exterior wash package billed weekly
                billingPeriod: weekly
                currency: INR
                vehiclePricing:
                  - vehicleType: HATCHBACK
                    price: 149900
                    durationMinutes: 170
                  - vehicleType: SUV
                    price: 199900
                    durationMinutes: 200
                includedServices:
                  - name: Exterior wash
                    description: Foam wash and dry
                    categoryId: cat_wash
                    tags:
                      - exterior
                    visitsPerPeriod: 4
                    durationMinutes: 30
                  - name: Interior vacuum
                    categoryId: cat_detail
                    visitsPerPeriod: 2
                    durationMinutes: 25
                visitWindows:
                  - visitWindowId: morning
                    label: Morning (8:00–12:00)
                    startTime: '08:00'
                    endTime: '12:00'
                  - visitWindowId: anytime
                    label: Anytime
                    allDay: true
                status: published
      - name: PatchOfferingRequest
        description: Partial update for an owned offering
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                billingPeriod:
                  type: string
                  enum:
                    - oneTime
                    - weekly
                    - monthly
                    - yearly
                currency:
                  type: string
                validityDays:
                  type: integer
                  minimum: 1
                  maximum: 730
                vehiclePricing:
                  type: array
                  items:
                    type: object
                    properties:
                      vehicleType:
                        type: string
                      price:
                        type: integer
                      durationMinutes:
                        type: integer
                includedServices:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      serviceKey:
                        type: string
                      visitsPerPeriod:
                        type: integer
                      durationMinutes:
                        type: integer
                      categoryId:
                        type: string
                visitWindows:
                  type: array
                  items:
                    type: object
                    properties:
                      visitWindowId:
                        type: string
                      label:
                        type: string
                      allDay:
                        type: boolean
                      startTime:
                        type: string
                      endTime:
                        type: string
                status:
                  type: string
                  enum:
                    - draft
                    - published
                    - paused
                    - archived
                displayOrder:
                  type: integer
                expectedVersion:
                  type: integer
                  minimum: 1
      - name: Offering
        description: >
          Catalog PACKAGE offering. vehiclePricing.durationMinutes is package-total
          duration for the billing period; includedServices.durationMinutes is per visit.
          vehiclePricing[].price is the final customer price in integer minor units.
          branchId is not part of package detail; community eligibility is returned as
          communities when mappings exist.
        content:
          application/json:
            schema:
              type: object
              required:
                - offeringId
                - offeringType
                - vendorId
                - categoryId
                - name
                - billingPeriod
                - currency
                - vehiclePricing
                - vehicleTypes
                - includedServices
                - entitlements
                - status
                - active
                - version
                - displayOrder
                - createdAt
                - updatedAt
              properties:
                offeringId:
                  type: string
                offeringType:
                  type: string
                  enum:
                    - PACKAGE
                    - SERVICE
                  description: PACKAGE is the supported create/detail type; SERVICE is legacy/reserved.
                vendorId:
                  type: string
                categoryId:
                  type: string
                name:
                  type: string
                description:
                  type: string
                billingPeriod:
                  type: string
                  enum:
                    - oneTime
                    - weekly
                    - monthly
                    - yearly
                currency:
                  type: string
                validityDays:
                  type: integer
                  minimum: 1
                  maximum: 730
                vehiclePricing:
                  type: array
                  items:
                    type: object
                    required:
                      - vehicleType
                      - price
                      - durationMinutes
                    properties:
                      vehicleType:
                        type: string
                      price:
                        type: integer
                        description: Final customer price in minor units
                      durationMinutes:
                        type: integer
                        description: Total package duration across visits in the billing period
                vehicleTypes:
                  type: array
                  items:
                    type: string
                includedServices:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                      - categoryId
                      - visitsPerPeriod
                      - durationMinutes
                    properties:
                      name:
                        type: string
                      description:
                        type: string
                      categoryId:
                        type: string
                      tags:
                        type: array
                        items:
                          type: string
                      serviceKey:
                        type: string
                        description: Stable entitlement identity when set on the included service
                      visitsPerPeriod:
                        type: integer
                      durationMinutes:
                        type: integer
                        description: Duration of one visit
                entitlements:
                  type: array
                  description: Computed entitlement identities and quantities derived from includedServices
                  items:
                    type: object
                    required:
                      - serviceId
                      - quantity
                      - name
                      - durationMinutes
                      - categoryId
                    properties:
                      serviceId:
                        type: string
                        description: serviceKey when set, otherwise slugified included service name
                      quantity:
                        type: integer
                        minimum: 1
                      name:
                        type: string
                      durationMinutes:
                        type: integer
                      categoryId:
                        type: string
                visitWindows:
                  type: array
                  description: Package-defined preferred visit windows (not confirmed slots)
                  items:
                    type: object
                    required:
                      - visitWindowId
                      - label
                    properties:
                      visitWindowId:
                        type: string
                      label:
                        type: string
                      allDay:
                        type: boolean
                      startTime:
                        type: string
                      endTime:
                        type: string
                communities:
                  type: array
                  description: Community eligibility mappings for booking. branchId is not returned on package detail.
                  items:
                    type: object
                    required:
                      - communityId
                      - status
                    properties:
                      communityId:
                        type: string
                      status:
                        type: string
                        enum:
                          - active
                          - inactive
                      approvalStatus:
                        type: string
                        enum:
                          - pending
                          - approved
                          - rejected
                status:
                  type: string
                  enum:
                    - draft
                    - published
                    - paused
                    - archived
                active:
                  type: boolean
                version:
                  type: integer
                displayOrder:
                  type: integer
                createdAt:
                  type: string
                  format: date-time
                updatedAt:
                  type: string
                  format: date-time
                legacySource:
                  type: string
                  enum:
                    - SERVICE
                    - PACKAGE
              example:
                offeringId: offr_premium_weekly_wash
                offeringType: PACKAGE
                vendorId: vend_demo_001
                categoryId: cat_wash
                name: Premium weekly wash
                description: Interior and exterior wash package billed weekly
                billingPeriod: weekly
                currency: INR
                vehiclePricing:
                  - vehicleType: HATCHBACK
                    price: 149900
                    durationMinutes: 170
                  - vehicleType: SUV
                    price: 199900
                    durationMinutes: 200
                vehicleTypes:
                  - HATCHBACK
                  - SUV
                includedServices:
                  - name: Exterior wash
                    description: Foam wash and dry
                    categoryId: cat_wash
                    tags:
                      - exterior
                    serviceKey: ext_wash
                    visitsPerPeriod: 4
                    durationMinutes: 30
                  - name: Interior vacuum
                    categoryId: cat_detail
                    visitsPerPeriod: 2
                    durationMinutes: 25
                entitlements:
                  - serviceId: ext_wash
                    quantity: 4
                    name: Exterior wash
                    durationMinutes: 30
                    categoryId: cat_wash
                  - serviceId: interior-vacuum
                    quantity: 2
                    name: Interior vacuum
                    durationMinutes: 25
                    categoryId: cat_detail
                visitWindows:
                  - visitWindowId: morning
                    label: Morning (8:00–12:00)
                    startTime: '08:00'
                    endTime: '12:00'
                  - visitWindowId: anytime
                    label: Anytime
                    allDay: true
                communities:
                  - communityId: comm_demo_001
                    status: active
                    approvalStatus: approved
                status: published
                active: true
                version: 1
                displayOrder: 0
                createdAt: '2026-10-28T10:00:00.000Z'
                updatedAt: '2026-10-28T10:00:00.000Z'
      - name: MarketplaceOffering
        description: >
          Customer marketplace discovery projection for GET /offerings. Full PACKAGE
          detail (includedServices, visitWindows, vehiclePricing, communities) is on
          GET /offerings/{offeringId}. branchId is optional — community package rows
          may omit branch coverage.
        content:
          application/json:
            schema:
              type: object
              required:
                - offeringId
                - serviceId
                - name
                - categoryId
                - vendorId
                - vehicleTypes
                - displayPrice
                - currency
                - durationMinutes
                - status
              properties:
                offeringId:
                  type: string
                serviceId:
                  type: string
                name:
                  type: string
                description:
                  type: string
                categoryId:
                  type: string
                vendorId:
                  type: string
                branchId:
                  type: string
                  description: Present when discovery has an operational branch; omitted for community-only packages.
                vehicleTypes:
                  type: array
                  items:
                    type: string
                displayPrice:
                  type: number
                  description: Lowest configured final customer price (discovery projection)
                currency:
                  type: string
                durationMinutes:
                  type: integer
                distanceKm:
                  type: number
                rating:
                  type: number
                reviewCount:
                  type: integer
                status:
                  type: string
                  enum:
                    - active
                  description: Discovery only surfaces customer-eligible published offerings
                imageUrl:
                  type: object
                  properties:
                    alt:
                      type: string
                    url:
                      type: string
                    contentType:
                      type: string
              example:
                offeringId: offr_premium_weekly_wash
                serviceId: offr_premium_weekly_wash
                name: Premium weekly wash
                description: Interior and exterior wash package billed weekly
                categoryId: cat_wash
                vendorId: vend_demo_001
                branchId: branch_demo_001
                vehicleTypes:
                  - HATCHBACK
                  - SUV
                displayPrice: 1499
                currency: INR
                durationMinutes: 170
                status: active
                imageUrl:
                  alt: Premium weekly wash
                  url: https://cdn.example.com/offerings/premium-weekly-wash.jpg
      - name: MarketplaceOfferingsPage
        description: Paginated customer marketplace discovery results
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - hasMore
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      offeringId:
                        type: string
                      serviceId:
                        type: string
                      name:
                        type: string
                      description:
                        type: string
                      categoryId:
                        type: string
                      vendorId:
                        type: string
                      branchId:
                        type: string
                      vehicleTypes:
                        type: array
                        items:
                          type: string
                      displayPrice:
                        type: number
                      currency:
                        type: string
                      durationMinutes:
                        type: integer
                      distanceKm:
                        type: number
                      rating:
                        type: number
                      reviewCount:
                        type: integer
                      status:
                        type: string
                        enum:
                          - active
                      imageUrl:
                        type: object
                        properties:
                          alt:
                            type: string
                          url:
                            type: string
                          contentType:
                            type: string
                hasMore:
                  type: boolean
                nextCursor:
                  type: string
              example:
                items:
                  - offeringId: offr_premium_weekly_wash
                    serviceId: offr_premium_weekly_wash
                    name: Premium weekly wash
                    description: Interior and exterior wash package billed weekly
                    categoryId: cat_wash
                    vendorId: vend_demo_001
                    branchId: branch_demo_001
                    vehicleTypes:
                      - HATCHBACK
                      - SUV
                    displayPrice: 1499
                    currency: INR
                    durationMinutes: 170
                    status: active
                    imageUrl:
                      alt: Premium weekly wash
                      url: https://cdn.example.com/offerings/premium-weekly-wash.jpg
                hasMore: false
      - name: OfferingPage
        description: Page of provider-owned offerings (full PACKAGE shape)
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - total
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      offeringId:
                        type: string
                      offeringType:
                        type: string
                        enum:
                          - PACKAGE
                      vendorId:
                        type: string
                      categoryId:
                        type: string
                      name:
                        type: string
                      description:
                        type: string
                      billingPeriod:
                        type: string
                      currency:
                        type: string
                      vehiclePricing:
                        type: array
                        items:
                          type: object
                      vehicleTypes:
                        type: array
                        items:
                          type: string
                      includedServices:
                        type: array
                        items:
                          type: object
                      visitWindows:
                        type: array
                        items:
                          type: object
                      status:
                        type: string
                        enum:
                          - draft
                          - published
                          - paused
                          - archived
                      active:
                        type: boolean
                      version:
                        type: integer
                      displayOrder:
                        type: integer
                      createdAt:
                        type: string
                      updatedAt:
                        type: string
                nextToken:
                  type: string
                total:
                  type: integer
              example:
                items:
                  - offeringId: offr_premium_weekly_wash
                    offeringType: PACKAGE
                    vendorId: vend_demo_001
                    categoryId: cat_wash
                    name: Premium weekly wash
                    description: Interior and exterior wash package billed weekly
                    billingPeriod: weekly
                    currency: INR
                    vehiclePricing:
                      - vehicleType: HATCHBACK
                        price: 149900
                        durationMinutes: 170
                      - vehicleType: SUV
                        price: 199900
                        durationMinutes: 200
                    vehicleTypes:
                      - HATCHBACK
                      - SUV
                    includedServices:
                      - name: Exterior wash
                        description: Foam wash and dry
                        categoryId: cat_wash
                        tags:
                          - exterior
                        visitsPerPeriod: 4
                        durationMinutes: 30
                      - name: Interior vacuum
                        categoryId: cat_detail
                        visitsPerPeriod: 2
                        durationMinutes: 25
                    visitWindows:
                      - visitWindowId: morning
                        label: Morning (8:00–12:00)
                        startTime: '08:00'
                        endTime: '12:00'
                      - visitWindowId: anytime
                        label: Anytime
                        allDay: true
                    status: published
                    active: true
                    version: 1
                    displayOrder: 0
                    createdAt: '2026-10-28T10:00:00.000Z'
                    updatedAt: '2026-10-28T10:00:00.000Z'
                total: 1

      - name: Service
        description: Bookable catalog service
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                vendorId:
                  type: string
                categoryId:
                  type: string
                name:
                  type: string
                description:
                  type: string
                durationMinutes:
                  type: integer
                vehicleTypes:
                  type: array
                  items:
                    type: string
                    enum:
                      - HATCHBACK
                      - SEDAN
                      - SUV
                      - MUV
                      - LUXURY
                      - BIKE
                basePrice:
                  type: number
                active:
                  type: boolean
                communityIds:
                  type: array
                  items:
                    type: string
                communities:
                  type: array
                  items:
                    type: object
                    properties:
                      communityId:
                        type: string
                      approvalStatus:
                        type: string
                        enum:
                          - pending
                          - approved
                          - rejected
                      status:
                        type: string
                        enum:
                          - active
                          - inactive
                      version:
                        type: integer
                      approvalUpdatedAt:
                        type: string
                      approvalUpdatedBy:
                        type: string
      - name: OfferingCommunityApproval
        description: Admin approval decision for one service-community mapping
        content:
          application/json:
            schema:
              type: object
              required:
                - approvalStatus
                - version
              properties:
                approvalStatus:
                  type: string
                  enum:
                    - approved
                    - rejected
                version:
                  type: integer
                  minimum: 1
      - name: OfferingCommunitiesAddRequest
        description: Community ids to map onto an offering
        content:
          application/json:
            schema:
              type: object
              required:
                - communityIds
              properties:
                communityIds:
                  type: array
                  items:
                    type: string
                  minItems: 1
      - name: OfferingCommunityStatusUpdate
        description: Operational status update for one offering-community mapping
        content:
          application/json:
            schema:
              type: object
              required:
                - status
                - version
              properties:
                status:
                  type: string
                  enum:
                    - active
                    - inactive
                version:
                  type: integer
                  minimum: 1
      - name: OfferingCommunityView
        description: One offering-community mapping
        content:
          application/json:
            schema:
              type: object
              properties:
                communityId:
                  type: string
                approvalStatus:
                  type: string
                  enum:
                    - pending
                    - approved
                    - rejected
                status:
                  type: string
                  enum:
                    - active
                    - inactive
                version:
                  type: integer
                approvalUpdatedAt:
                  type: string
                approvalUpdatedBy:
                  type: string
      - name: OfferingCommunitiesList
        description: Offering community mappings
        content:
          application/json:
            schema:
              type: object
              properties:
                communities:
                  type: array
                  items:
                    type: object
                    properties:
                      communityId:
                        type: string
                      approvalStatus:
                        type: string
                        enum:
                          - pending
                          - approved
                          - rejected
                      status:
                        type: string
                        enum:
                          - active
                          - inactive
                      version:
                        type: integer
                      approvalUpdatedAt:
                        type: string
                      approvalUpdatedBy:
                        type: string
      - name: ServicePage
        description: Page of services
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      vendorId:
                        type: string
                      categoryId:
                        type: string
                      name:
                        type: string
                      description:
                        type: string
                      durationMinutes:
                        type: integer
                      vehicleTypes:
                        type: array
                        items:
                          type: string
                          enum:
                            - HATCHBACK
                            - SEDAN
                            - SUV
                            - MUV
                            - LUXURY
                            - BIKE
                      basePrice:
                        type: number
                      active:
                        type: boolean
      - name: Package
        description: Service package
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                vendorId:
                  type: string
                name:
                  type: string
                description:
                  type: string
                services:
                  type: array
                  items:
                    type: string
                discountedPrice:
                  type: number
      - name: PackagePage
        description: Page of packages
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      vendorId:
                        type: string
                      name:
                        type: string
                      description:
                        type: string
                      services:
                        type: array
                        items:
                          type: string
                      discountedPrice:
                        type: number
      - name: AddOn
        description: Optional add-on
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                vendorId:
                  type: string
                name:
                  type: string
                price:
                  type: number
                durationMinutes:
                  type: integer
      - name: AddOnPage
        description: Page of add-ons
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      vendorId:
                        type: string
                      name:
                        type: string
                      price:
                        type: number
                      durationMinutes:
                        type: integer
      - name: PricingCalculateRequest
        description: Price calculation input. Coupon codes are ignored.
        content:
          application/json:
            schema:
              type: object
              properties:
                vehicleType:
                  type: string
                  enum:
                    - HATCHBACK
                    - SEDAN
                    - SUV
                    - MUV
                    - LUXURY
                    - BIKE
                vendorId:
                  type: string
                serviceIds:
                  type: array
                  items:
                    type: string
                packageIds:
                  type: array
                  items:
                    type: string
                addOnIds:
                  type: array
                  items:
                    type: string
                addonIds:
                  type: array
                  items:
                    type: string
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - SERVICE
                          - PACKAGE
                      serviceId:
                        type: string
                      categoryId:
                        type: string
                      packageId:
                        type: string
                couponCode:
                  type: string
              required:
                - vehicleType
      - name: PricingResult
        description: Calculated price
        content:
          application/json:
            schema:
              type: object
              properties:
                currency:
                  type: string
                subtotal:
                  type: number
                discount:
                  type: number
                total:
                  type: number
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      amount:
                        type: number
      - name: ServiceVisitWindow
        description: One visit window. New windows require staff count and resources. Older windows may only have maxConcurrentBookings.
        content:
          application/json:
            schema:
              type: object
              required:
                - windowId
                - label
                - daysOfWeek
                - startTime
                - endTime
                - endDayOffset
              properties:
                windowId:
                  type: string
                label:
                  type: string
                  enum:
                    - earlyMorning
                    - morning
                    - afternoon
                    - evening
                    - night
                    - weekend
                    - custom
                daysOfWeek:
                  type: array
                  items:
                    type: string
                    enum: [MON, TUE, WED, THU, FRI, SAT, SUN]
                startTime:
                  type: string
                endTime:
                  type: string
                endDayOffset:
                  type: integer
                  enum: [0, 1]
                maxConcurrentBookings:
                  type: integer
                  description: Present on visits saved before staff count. Not derived from staffCount.
                bufferMinutes:
                  type: integer
                capacity:
                  type: object
                  required: [staffCount]
                  properties:
                    staffCount:
                      type: integer
                      minimum: 1
                resources:
                  type: object
                  required: [water, equipment]
                  properties:
                    water:
                      type: object
                      required: [source]
                      properties:
                        source:
                          type: string
                          enum: [vendorSupplied, communitySupplied, waterless]
                        capacityLiters:
                          type: integer
                          minimum: 1
                          description: Required only when source is vendorSupplied.
                    equipment:
                      type: object
                      required: [providedByVendor]
                      properties:
                        providedByVendor:
                          type: boolean
      - name: ServiceVisit
        description: Service visit configuration
        content:
          application/json:
            schema:
              type: object
              properties:
                visitId:
                  type: string
                vendorId:
                  type: string
                name:
                  type: string
                deliveryModel:
                  type: string
                  enum: [community, doorstep]
                location:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [community, serviceArea]
                    communityId:
                      type: string
                    serviceAreaId:
                      type: string
                    branchId:
                      type: string
                      description: Returned only for visits saved before branchId was removed from the request.
                timezone:
                  type: string
                windows:
                  type: array
                  items:
                    $ref: "#/components/schemas/ServiceVisitWindow"
                serviceIds:
                  type: array
                  items:
                    type: string
                staffIds:
                  type: array
                  items:
                    type: string
                effectiveFrom:
                  type: string
                effectiveUntil:
                  type: string
                  nullable: true
                status:
                  type: string
                  enum: [draft, active, paused, archived]
                version:
                  type: integer
      - name: ServiceVisitPage
        description: Page of service visits
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/ServiceVisit"
                nextToken:
                  type: string
      - name: ServiceVisitWrite
        description: Create or replace fields for a service visit. branchId is not accepted.
        content:
          application/json:
            schema:
              type: object
              required: [name, deliveryModel, location, timezone, windows, serviceIds, effectiveFrom]
              properties:
                name:
                  type: string
                deliveryModel:
                  type: string
                  enum: [community, doorstep]
                location:
                  type: object
                  required: [type]
                  properties:
                    type:
                      type: string
                      enum: [community, serviceArea]
                    communityId:
                      type: string
                    serviceAreaId:
                      type: string
                timezone:
                  type: string
                windows:
                  type: array
                  items:
                    $ref: "#/components/schemas/ServiceVisitWindow"
                serviceIds:
                  type: array
                  items:
                    type: string
                staffIds:
                  type: array
                  description: Optional. Individual staff assignment is not required.
                  items:
                    type: string
                effectiveFrom:
                  type: string
                effectiveUntil:
                  type: string
                  nullable: true
      - name: ErrorResponse
        description: Platform error envelope
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                statusCode:
                  type: integer
                message:
                  type: object
                  properties:
                    title:
                      type: string
                    description:
                      type: string
                    severity:
                      type: string
                data:
                  type: object
                  properties: {}
                error:
                  type: object
                  properties:
                    code:
                      type: string
                    details:
                      type: array
                      items:
                        type: object
                        properties:
                          field:
                            type: string
                          message:
                            type: string
                meta:
                  type: object
                  properties:
                    correlationId:
                      type: string
                    timestamp:
                      type: string
                    version:
                      type: string
functions:
  getBookingReadinessFacts:
    handler: src/handlers/internal.getBookingReadinessFacts
    description: "Internal invoke. Publishes the authoritative active bookable service count for booking readiness."
    timeout: 30


  getcategories:
    handler: src/handlers/categories-handler.handleGetcategories
    events:
      - http:
          path: /categories
          method: get
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "List categories"
          swaggerTags:
            - Categories
          responseData:
            200:
              description: "OK"
          documentation:
            summary: List categories
            description: List categories
            tags:
              - Categories
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: OK
                responseModels:
                  application/json: CategoryPage
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse


  postcategories:
    handler: src/handlers/categories-handler.handlePostcategories
    events:
      - http:
          path: /categories
          method: post
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Create category"
          swaggerTags:
            - Categories
          bodyType: Category
          responseData:
            201:
              description: "Created"
          documentation:
            summary: Create category
            description: Create category
            tags:
              - Categories
            methodResponses:
              - statusCode: "201"
                responseBody:
                  description: Created
                responseModels:
                  application/json: Category
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
            requestBody:
              description: Create category
              required: true
            requestModels:
              application/json: Category


  getcategoryid:
    handler: src/handlers/categories-handler.handleGetcategoryid
    events:
      - http:
          path: /categories/{categoryId}
          method: get
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Get category"
          swaggerTags:
            - Categories
          responseData:
            200:
              description: "OK"
          documentation:
            summary: Get category
            description: Get category
            tags:
              - Categories
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: OK
                responseModels:
                  application/json: Category
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
            pathParams:
              - name: categoryId
                description: categoryId
                schema:
                  type: string


  putcategoryid:
    handler: src/handlers/categories-handler.handlePutcategoryid
    events:
      - http:
          path: /categories/{categoryId}
          method: put
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Update category"
          swaggerTags:
            - Categories
          bodyType: Category
          responseData:
            200:
              description: "Updated"
          documentation:
            summary: Update category
            description: Update category
            tags:
              - Categories
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Updated
                responseModels:
                  application/json: Category
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
            pathParams:
              - name: categoryId
                description: categoryId
                schema:
                  type: string
            requestBody:
              description: Update category
              required: true
            requestModels:
              application/json: Category


  deletecategoryid:
    handler: src/handlers/categories-handler.handleDeletecategoryid
    events:
      - http:
          path: /categories/{categoryId}
          method: delete
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Delete category"
          swaggerTags:
            - Categories
          responseData:
            204:
              description: "Deleted"
          documentation:
            summary: Delete category
            description: Delete category
            tags:
              - Categories
            methodResponses:
              - statusCode: "204"
                responseBody:
                  description: Deleted
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
            pathParams:
              - name: categoryId
                description: categoryId
                schema:
                  type: string

  getOfferings:
    handler: src/handlers/offerings-handler.getOfferings
    description: Customer marketplace list of bookable service offerings
    timeout: 15
    memorySize: 512
    events:
      - http:
          path: /offerings
          method: get
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: Discover marketplace offerings
          swaggerTags:
            - Offerings
          responseData:
            200:
              description: OK
          documentation:
            summary: Discover marketplace offerings
            description: >
              Customer marketplace list of bookable offerings for one community.
              communityId is required. Discovery queries the community mapping
              index (GSI3) and does not fall back to global DISCOVERY#ALL.
              Optional filters: search, category, vehicle, price, rating, geo,
              availability, sort, and pagination.
            tags:
              - Offerings
            queryParams:
              - name: communityId
                description: Required. Customer community used for marketplace discovery.
                required: true
                schema:
                  type: string
              - name: search
                required: false
                schema:
                  type: string
              - name: categoryId
                required: false
                schema:
                  type: string
              - name: vehicleType
                required: false
                schema:
                  type: string
              - name: vendorId
                required: false
                schema:
                  type: string
              - name: branchId
                required: false
                schema:
                  type: string
              - name: latitude
                required: false
                schema:
                  type: number
              - name: longitude
                required: false
                schema:
                  type: number
              - name: radiusKm
                required: false
                schema:
                  type: number
              - name: minPrice
                required: false
                schema:
                  type: number
              - name: maxPrice
                required: false
                schema:
                  type: number
              - name: minRating
                required: false
                schema:
                  type: number
              - name: status
                required: false
                schema:
                  type: string
                  enum:
                    - active
              - name: availableOn
                required: false
                schema:
                  type: string
              - name: startTime
                required: false
                schema:
                  type: string
              - name: sort
                required: false
                schema:
                  type: string
              - name: limit
                required: false
                schema:
                  type: integer
              - name: cursor
                required: false
                schema:
                  type: string
              - name: filter
                required: false
                schema:
                  type: string
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: OK
                responseModels:
                  application/json: MarketplaceOfferingsPage
              - statusCode: "400"
                responseBody:
                  description: Missing or invalid communityId, or other validation failure
                responseModels:
                  application/json: ErrorResponse

  postOfferings:
    handler: src/handlers/offerings-handler.postOfferings
    description: Provider creates a PACKAGE offering with inline included services
    timeout: 15
    memorySize: 512
    events:
      - http:
          path: /offerings
          method: post
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: Create offering
          swaggerTags:
            - Offerings
          bodyType: CreateOfferingRequest
          responseData:
            201:
              description: Created
          documentation:
            summary: Create a provider offering
            description: |
              Creates a PACKAGE offering for the authenticated provider. Requires vendorId and
              top-level categoryId. vendorId must match the caller's vendor from Vendor Service
              `/vendors/me`. categoryId must exist and be active. Prices are integer minor units
              with an explicit currency. Included services are inline descriptions (no separate
              service ids).
            tags:
              - Offerings
            requestBody:
              description: Create a PACKAGE offering with inline included services
              required: true
            requestModels:
              application/json: CreateOfferingRequest
            methodResponses:
              - statusCode: "201"
                responseBody:
                  description: Created
                responseModels:
                  application/json: Offering
              - statusCode: "400"
                responseBody:
                  description: Validation failed
                responseModels:
                  application/json: ErrorResponse
              - statusCode: "401"
                responseBody:
                  description: Unauthorized
                responseModels:
                  application/json: ErrorResponse
              - statusCode: "403"
                responseBody:
                  description: Forbidden
                responseModels:
                  application/json: ErrorResponse

  getOfferingById:
    handler: src/handlers/offerings-handler.getOfferingById
    description: Offering details for customers or the owning provider
    timeout: 15
    memorySize: 512
    events:
      - http:
          path: /offerings/{offeringId}
          method: get
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: Get offering
          swaggerTags:
            - Offerings
          responseData:
            200:
              description: OK
          documentation:
            summary: Get offering by id
            description: Returns a published offering to any authenticated caller. Owners may also read draft, paused, or archived offerings. Legacy SERVICE/PACKAGE ids remain readable for booking compatibility.
            pathParams:
              - name: offeringId
                description: Offering id
                required: true
                schema:
                  type: string
            queryParams:
              - name: consistent
                description: When true, use a consistent DynamoDB read
                required: false
                schema:
                  type: boolean
            tags:
              - Offerings
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: OK
                responseModels:
                  application/json: Offering
              - statusCode: "404"
                responseBody:
                  description: Not found
                responseModels:
                  application/json: ErrorResponse

  patchOfferingById:
    handler: src/handlers/offerings-handler.patchOfferingById
    description: Provider updates their offering
    timeout: 15
    memorySize: 512
    events:
      - http:
          path: /offerings/{offeringId}
          method: patch
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: Update offering
          swaggerTags:
            - Offerings
          bodyType: PatchOfferingRequest
          responseData:
            200:
              description: OK
          documentation:
            summary: Patch an owned offering
            description: Updates fields on the authenticated provider's offering. Ownership is derived from the caller. Optional expectedVersion enforces optimistic concurrency.
            pathParams:
              - name: offeringId
                required: true
                schema:
                  type: string
            tags:
              - Offerings
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: OK
                responseModels:
                  application/json: Offering
              - statusCode: "404"
                responseBody:
                  description: Not found
                responseModels:
                  application/json: ErrorResponse
              - statusCode: "409"
                responseBody:
                  description: Version or status conflict
                responseModels:
                  application/json: ErrorResponse

  deleteOfferingById:
    handler: src/handlers/offerings-handler.deleteOfferingById
    description: Provider archives their offering
    timeout: 15
    memorySize: 512
    events:
      - http:
          path: /offerings/{offeringId}
          method: delete
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: Archive offering
          swaggerTags:
            - Offerings
          responseData:
            200:
              description: Archived
          documentation:
            summary: Archive an owned offering
            description: Soft-archives the offering (status archived). Removes it from marketplace discovery. Ownership is derived from the caller.
            pathParams:
              - name: offeringId
                required: true
                schema:
                  type: string
            tags:
              - Offerings
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Archived
              - statusCode: "404"
                responseBody:
                  description: Not found
                responseModels:
                  application/json: ErrorResponse

  getMyOfferings:
    handler: src/handlers/offerings-handler.getMyOfferings
    description: Authenticated provider lists their offerings
    timeout: 15
    memorySize: 512
    events:
      - http:
          path: /vendors/me/offerings
          method: get
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: List my offerings
          swaggerTags:
            - Offerings
          responseData:
            200:
              description: OK
          documentation:
            summary: List offerings for the authenticated provider
            description: Resolves vendor identity from `/vendors/me`. Does not accept a client-supplied vendorId.
            queryParams:
              - name: status
                description: Optional lifecycle filter (draft, published, paused, archived)
                required: false
                schema:
                  type: string
                  enum:
                    - draft
                    - published
                    - paused
                    - archived
              - name: limit
                required: false
                schema:
                  type: integer
              - name: nextToken
                required: false
                schema:
                  type: string
            tags:
              - Offerings
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: OK
                responseModels:
                  application/json: OfferingPage
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
              - statusCode: "401"
                responseBody:
                  description: Unauthorized
                responseModels:
                  application/json: ErrorResponse
  backfillDiscovery:
    handler: src/handlers/backfill-discovery-handler.handler
    description: Manual discovery projection backfill for one vendor. Invoke with vendorId and dryRun. No schedule.
    timeout: 300
    memorySize: 512

  onDiscoveryVendorLifecycle:
    handler: src/handlers/discovery-vendor-lifecycle-handler.handler
    description: Applies VendorApproved, VendorRejected, and VendorSuspended to discovery projections.
    timeout: 60
    memorySize: 512
    environment:
      DLQ_QUEUE_URL: !Ref DiscoveryVendorLifecycleDlq

  onDiscoveryVendorFacts:
    handler: src/handlers/discovery-vendor-facts-handler.handler
    description: Reloads branch, coverage, and pricing facts into discovery projections.
    timeout: 60
    memorySize: 512
    environment:
      DLQ_QUEUE_URL: !Ref DiscoveryVendorFactsDlq

  postServiceCommunities:
    handler: src/handlers/offering-communities-handler.handlePostServiceCommunities
    events:
      - http:
          path: /offerings/{offeringId}/communities
          method: post
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: Add communities to an offering
          documentation:
            summary: Add offering communities
            description: Inserts missing community mappings. Selected communities must be active in the platform directory. Vendor coverage is not required. Existing approval and operational status are left unchanged. New mappings are approved only when COMMUNITY_OFFERING_AUTO_APPROVE is true.
            tags:
              - Offering communities
            queryParams:
              - name: vendorId
                required: true
                schema:
                  type: string
            pathParams:
              - name: offeringId
                required: true
                schema:
                  type: string
            requestBody:
              description: Community ids to add
              required: true
            requestModels:
              application/json: OfferingCommunitiesAddRequest
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Updated community mappings
                responseModels:
                  application/json: OfferingCommunitiesList
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse

  putServiceCommunity:
    handler: src/handlers/offering-communities-handler.handlePutServiceCommunity
    events:
      - http:
          path: /offerings/{offeringId}/communities/{communityId}
          method: put
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: Activate or deactivate one community
          documentation:
            summary: Set offering community status
            description: Updates operational status for one mapping. approvalStatus is unchanged. The service-level active flag is unchanged.
            tags:
              - Offering communities
            queryParams:
              - name: vendorId
                required: true
                schema:
                  type: string
            pathParams:
              - name: offeringId
                required: true
                schema:
                  type: string
              - name: communityId
                required: true
                schema:
                  type: string
            requestBody:
              description: status is active or inactive. version is the current mapping version.
              required: true
            requestModels:
              application/json: OfferingCommunityStatusUpdate
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Updated mapping
                responseModels:
                  application/json: OfferingCommunityView
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse

  putServiceCommunityApproval:
    handler: src/handlers/offering-communities-handler.handlePutServiceCommunityApproval
    events:
      - http:
          path: /offerings/{offeringId}/communities/{communityId}/approval
          method: put
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: Approve or reject one community mapping
          documentation:
            summary: Set offering community approval
            description: Admin only. Records the caller and time. Does not change operational status. A vendor cannot call this route.
            tags:
              - Offering communities
            pathParams:
              - name: offeringId
                required: true
                schema:
                  type: string
              - name: communityId
                required: true
                schema:
                  type: string
            requestBody:
              description: approvalStatus is approved or rejected. version is the current mapping version.
              required: true
            requestModels:
              application/json: OfferingCommunityApproval
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Updated mapping
                responseModels:
                  application/json: OfferingCommunityView
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
              - statusCode: "403"
                responseBody:
                  description: Forbidden
                responseModels:
                  application/json: ErrorResponse

  deleteServiceCommunity:
    handler: src/handlers/offering-communities-handler.handleDeleteServiceCommunity
    events:
      - http:
          path: /offerings/{offeringId}/communities/{communityId}
          method: delete
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: Remove one community mapping
          documentation:
            summary: Delete offering community
            description: Removes the mapping. A missing mapping returns success.
            tags:
              - Offering communities
            queryParams:
              - name: vendorId
                required: true
                schema:
                  type: string
            pathParams:
              - name: offeringId
                required: true
                schema:
                  type: string
              - name: communityId
                required: true
                schema:
                  type: string
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Mapping removed
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse

  backfillOfferingCommunities:
    handler: src/handlers/backfill-offering-communities-handler.handler
    description: Idempotent offering-community backfill for one vendor. Invoke with vendorId and dryRun. No schedule.
    timeout: 300
    memorySize: 512

  onServiceVisitChanged:
    handler: src/handlers/service-visit-stream.handler
    timeout: 60
    events:
      - stream:
          type: dynamodb
          arn: !GetAtt ServiceCatalogTable.StreamArn
          filterPatterns:
            - eventName:
                - INSERT
                - MODIFY
              dynamodb:
                NewImage:
                  entityType:
                    S:
                      - ServiceVisitConfiguration
          batchSize: 10
          startingPosition: LATEST
          bisectBatchOnFunctionError: true
          maximumRetryAttempts: 3
          functionResponseType: ReportBatchItemFailures
          destinations:
            onFailure:
              arn: !GetAtt ServiceVisitStreamDlq.Arn
              type: sqs

  # One consumer on the existing table stream; SERVICE index rows are excluded.
  onVendorServiceChanged:
    handler: src/handlers/vendor-service-stream.handler
    timeout: 60
    events:
      - stream:
          type: dynamodb
          arn: !GetAtt ServiceCatalogTable.StreamArn
          filterPatterns:
            - eventName: [INSERT, MODIFY]
              dynamodb:
                NewImage:
                  entityType:
                    S: [SERVICE]
            - eventName: [REMOVE]
              dynamodb:
                OldImage:
                  entityType:
                    S: [SERVICE]
          batchSize: 10
          startingPosition: LATEST
          bisectBatchOnFunctionError: true
          maximumRetryAttempts: 3
          functionResponseType: ReportBatchItemFailures
          destinations:
            onFailure:
              arn: !GetAtt ServiceVisitStreamDlq.Arn
              type: sqs


resources:
  Resources:

    ServiceVisitStreamDlq:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${self:provider.stage}-service-visit-stream-dlq
        MessageRetentionPeriod: 1209600
        SqsManagedSseEnabled: true

    DiscoveryVendorLifecycleDlq:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${self:provider.stage}-discovery-lifecycle-dlq
        MessageRetentionPeriod: 1209600
        SqsManagedSseEnabled: true

    DiscoveryVendorLifecycleDlqPolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref DiscoveryVendorLifecycleDlq
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: AllowEventBridgeSendToDiscoveryLifecycleDlq
              Effect: Allow
              Principal:
                Service: events.amazonaws.com
              Action: sqs:SendMessage
              Resource: !GetAtt DiscoveryVendorLifecycleDlq.Arn
              Condition:
                StringEquals:
                  aws:SourceAccount: !Ref AWS::AccountId

    DiscoveryVendorLifecycleRule:
      Type: AWS::Events::Rule
      DependsOn:
        - DiscoveryVendorLifecycleDlqPolicy
      Properties:
        Name: ${self:service}-${self:provider.stage}-discovery-lifecycle
        Description: Updates marketplace discovery when a vendor is approved, rejected, or suspended
        EventBusName:
          Fn::ImportValue: nv${self:provider.stage}-bw-vendor-event-bus-name
        EventPattern:
          source:
            - vendor-service
          detail-type:
            - VendorApproved
            - VendorRejected
            - VendorSuspended
        State: ENABLED
        Targets:
          - Id: CatalogDiscoveryLifecycle
            Arn: !GetAtt OnDiscoveryVendorLifecycleLambdaFunction.Arn
            DeadLetterConfig:
              Arn: !GetAtt DiscoveryVendorLifecycleDlq.Arn
            RetryPolicy:
              MaximumRetryAttempts: 3

    DiscoveryVendorLifecyclePermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !GetAtt OnDiscoveryVendorLifecycleLambdaFunction.Arn
        Action: lambda:InvokeFunction
        Principal: events.amazonaws.com
        SourceArn: !GetAtt DiscoveryVendorLifecycleRule.Arn

    DiscoveryVendorFactsDlq:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${self:provider.stage}-discovery-facts-dlq
        MessageRetentionPeriod: 1209600
        SqsManagedSseEnabled: true

    DiscoveryVendorFactsDlqPolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref DiscoveryVendorFactsDlq
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: AllowEventBridgeSendToDiscoveryFactsDlq
              Effect: Allow
              Principal:
                Service: events.amazonaws.com
              Action: sqs:SendMessage
              Resource: !GetAtt DiscoveryVendorFactsDlq.Arn
              Condition:
                StringEquals:
                  aws:SourceAccount: !Ref AWS::AccountId

    DiscoveryVendorFactsRule:
      Type: AWS::Events::Rule
      DependsOn:
        - DiscoveryVendorFactsDlqPolicy
      Properties:
        Name: ${self:service}-${self:provider.stage}-discovery-facts
        Description: Updates marketplace discovery when branch, coverage, pricing, or operations change
        EventBusName:
          Fn::ImportValue: nv${self:provider.stage}-bw-vendor-event-bus-name
        EventPattern:
          source:
            - vendor-service
          detail-type:
            - VendorDiscoveryChanged
        State: ENABLED
        Targets:
          - Id: CatalogDiscoveryFacts
            Arn: !GetAtt OnDiscoveryVendorFactsLambdaFunction.Arn
            DeadLetterConfig:
              Arn: !GetAtt DiscoveryVendorFactsDlq.Arn
            RetryPolicy:
              MaximumRetryAttempts: 3

    DiscoveryVendorFactsPermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !GetAtt OnDiscoveryVendorFactsLambdaFunction.Arn
        Action: lambda:InvokeFunction
        Principal: events.amazonaws.com
        SourceArn: !GetAtt DiscoveryVendorFactsRule.Arn

    ServiceCatalogTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-service-catalog

        BillingMode: PAY_PER_REQUEST

        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S

          - AttributeName: SK
            AttributeType: S

          - AttributeName: LSI1SK
            AttributeType: S

          - AttributeName: LSI2SK
            AttributeType: S

          - AttributeName: LSI3SK
            AttributeType: S

          - AttributeName: LSI4SK
            AttributeType: S

          - AttributeName: LSI5SK
            AttributeType: S

          - AttributeName: GSI1PK
            AttributeType: S

          - AttributeName: GSI1SK
            AttributeType: S

          - AttributeName: GSI2PK
            AttributeType: S

          - AttributeName: GSI2SK
            AttributeType: S

          - AttributeName: GSI3PK
            AttributeType: S

          - AttributeName: GSI3SK
            AttributeType: S

        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE

        LocalSecondaryIndexes:
          - IndexName: LSI1
            KeySchema:
              - AttributeName: PK
                KeyType: HASH
              - AttributeName: LSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

          - IndexName: LSI2
            KeySchema:
              - AttributeName: PK
                KeyType: HASH
              - AttributeName: LSI2SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

          - IndexName: LSI3
            KeySchema:
              - AttributeName: PK
                KeyType: HASH
              - AttributeName: LSI3SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

          - IndexName: LSI4
            KeySchema:
              - AttributeName: PK
                KeyType: HASH
              - AttributeName: LSI4SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

          - IndexName: LSI5
            KeySchema:
              - AttributeName: PK
                KeyType: HASH
              - AttributeName: LSI5SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH
              - AttributeName: GSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

          - IndexName: GSI2
            KeySchema:
              - AttributeName: GSI2PK
                KeyType: HASH
              - AttributeName: GSI2SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

          # Sparse index of active offering-community mappings.
          # Deploy this index and wait until it is ACTIVE before enabling enforcement.
          - IndexName: GSI3
            KeySchema:
              - AttributeName: GSI3PK
                KeyType: HASH
              - AttributeName: GSI3SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

        SSESpecification:
          SSEEnabled: true

        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES

        Tags:
          - Key: Service
            Value: service-catalog

          - Key: Environment
            Value: ${self:provider.stage}

          - Key: ManagedBy
            Value: Serverless

    GatewayResponseDefault4XX: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseDefault4XX}

    GatewayResponseDefault5XX: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseDefault5XX}

    GatewayResponseUnauthorized: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseUnauthorized}

    GatewayResponseAccessDenied: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseAccessDenied}

    GatewayResponseMissingAuthenticationToken: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseMissingAuthenticationToken}
    GatewayResponseExpiredToken: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseExpiredToken}
    GatewayResponseIntegrationFailure: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseIntegrationFailure}
    GatewayResponseIntegrationTimeout: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseIntegrationTimeout}

