resources:
  Resources:

    ServiceCatalogTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-service-catalog

        BillingMode: PAY_PER_REQUEST

        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S

          - AttributeName: SK
            AttributeType: S

          - AttributeName: LSI1SK
            AttributeType: S

          - AttributeName: LSI2SK
            AttributeType: S

          - AttributeName: LSI3SK
            AttributeType: S

          - AttributeName: LSI4SK
            AttributeType: S

          - AttributeName: LSI5SK
            AttributeType: S

          - AttributeName: GSI1PK
            AttributeType: S

          - AttributeName: GSI1SK
            AttributeType: S

        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE

        LocalSecondaryIndexes:
          - IndexName: LSI1
            KeySchema:
              - AttributeName: PK
                KeyType: HASH
              - AttributeName: LSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

          - IndexName: LSI2
            KeySchema:
              - AttributeName: PK
                KeyType: HASH
              - AttributeName: LSI2SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

          - IndexName: LSI3
            KeySchema:
              - AttributeName: PK
                KeyType: HASH
              - AttributeName: LSI3SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

          - IndexName: LSI4
            KeySchema:
              - AttributeName: PK
                KeyType: HASH
              - AttributeName: LSI4SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

          - IndexName: LSI5
            KeySchema:
              - AttributeName: PK
                KeyType: HASH
              - AttributeName: LSI5SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH
              - AttributeName: GSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

        SSESpecification:
          SSEEnabled: true

        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES

        Tags:
          - Key: Service
            Value: service-catalog

          - Key: Environment
            Value: ${self:provider.stage}

          - Key: ManagedBy
            Value: Serverless

