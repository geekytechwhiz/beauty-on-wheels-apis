resources:
  Resources:

    ServiceCatalogTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-service-catalog

        BillingMode: PAY_PER_REQUEST

        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S

          - AttributeName: sk
            AttributeType: S

          - AttributeName: lsi1sk
            AttributeType: S

          - AttributeName: lsi2sk
            AttributeType: S

          - AttributeName: lsi3sk
            AttributeType: S

          - AttributeName: lsi4sk
            AttributeType: S

          - AttributeName: lsi5sk
            AttributeType: S

          - AttributeName: GSI1PK
            AttributeType: S

          - AttributeName: GSI1SK
            AttributeType: S

        KeySchema:
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE

        LocalSecondaryIndexes:
          - IndexName: LSI1
            KeySchema:
              - AttributeName: pk
                KeyType: HASH
              - AttributeName: lsi1sk
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

          - IndexName: LSI2
            KeySchema:
              - AttributeName: pk
                KeyType: HASH
              - AttributeName: lsi2sk
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

          - IndexName: LSI3
            KeySchema:
              - AttributeName: pk
                KeyType: HASH
              - AttributeName: lsi3sk
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

          - IndexName: LSI4
            KeySchema:
              - AttributeName: pk
                KeyType: HASH
              - AttributeName: lsi4sk
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

          - IndexName: LSI5
            KeySchema:
              - AttributeName: pk
                KeyType: HASH
              - AttributeName: lsi5sk
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH
              - AttributeName: GSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

        SSESpecification:
          SSEEnabled: true

        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES

        Tags:
          - Key: Service
            Value: service-catalog

          - Key: Environment
            Value: ${self:provider.stage}

          - Key: ManagedBy
            Value: Serverless

    GatewayResponseDefault4XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: DEFAULT_4XX
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: >-
            'Content-Type,Authorization,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent,Sec-Ch-Ua,Sec-Ch-Ua-Mobile,Sec-Ch-Ua-Platform'
          gatewayresponse.header.Access-Control-Allow-Methods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"

    GatewayResponseDefault5XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: DEFAULT_5XX
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: >-
            'Content-Type,Authorization,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent,Sec-Ch-Ua,Sec-Ch-Ua-Mobile,Sec-Ch-Ua-Platform'
          gatewayresponse.header.Access-Control-Allow-Methods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"

    GatewayResponseUnauthorized:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: UNAUTHORIZED
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: >-
            'Content-Type,Authorization,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent,Sec-Ch-Ua,Sec-Ch-Ua-Mobile,Sec-Ch-Ua-Platform'
          gatewayresponse.header.Access-Control-Allow-Methods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"

    GatewayResponseAccessDenied:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: ACCESS_DENIED
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: >-
            'Content-Type,Authorization,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent,Sec-Ch-Ua,Sec-Ch-Ua-Mobile,Sec-Ch-Ua-Platform'
          gatewayresponse.header.Access-Control-Allow-Methods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"