service: service-catalog-service

frameworkVersion: "3"

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-auto-swagger
  - serverless-offline
  - serverless-openapi-documenter 
provider:
  name: aws
  runtime: nodejs22.x

  stage: ${opt:stage,'dev'}

  region: ${opt:region,'us-east-1'}

  versionFunctions: false

  environment:

    SERVICE_NAME: service-catalog-service
    LOG_LEVEL: INFO
    DYNAMODB_TABLE_NAME: ${self:service}-${self:provider.stage}-service-catalog
    # IAM invoke of the vendor pricing-configuration function. Catalog does not call the owner HTTP API.
    VENDOR_PRICING_CONFIGURATION_FUNCTION: vendor-service-api-${self:provider.stage}-getPricingConfiguration

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:BatchGetItem
            - dynamodb:BatchWriteItem
            - dynamodb:TransactWriteItems
            - dynamodb:TransactGetItems
            - dynamodb:DescribeTable
          Resource:
            - !GetAtt ServiceCatalogTable.Arn
            - !Join [ "/", [ !GetAtt ServiceCatalogTable.Arn, "index", "*" ] ]
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource:
            - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:provider.environment.VENDOR_PRICING_CONFIGURATION_FUNCTION}
        - Effect: Allow
          Action:
            - xray:PutTraceSegments
            - xray:PutTelemetryRecords
          Resource: "*"

custom:

  securedAuthorizer: ${file(../../infra/serverless/config/http-api-authorizer.yml)}


  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    concurrency: 10
    plugins: ./esbuild-plugins.js

  autoswagger:
    title: "Beauty on Wheels - Service Catalog Service API"
    apiType: http
    basePath: /${self:provider.stage}
    schemes:
      - https
      - http
    generateSwaggerOnDeploy: true
    swaggerFiles:
      - swagger.json
    useStage: true
    swaggerPath: swagger
    typefiles:
      - ./src/types/api-types.d.ts
    excludeStages:
      - production


  documentation:
    version: 1.0.0
    title: Beauty on Wheels - Service Catalog Service API
    description: Catalog categories, services, packages, add-ons, and price calculation.
    securitySchemes:
      bearerAuth:
        type: http
        scheme: bearer
        bearerFormat: JWT
    security:
      - bearerAuth: []
    servers:
      - url: https://{apiId}.execute-api.us-east-1.amazonaws.com/{stage}
        description: Deployed API Gateway stage
        variables:
          apiId:
            default: localhost
            description: API Gateway id
          stage:
            default: dev
            description: Deployment stage
    tags:
      - name: Categories
        description: Service categories
      - name: Services
        description: Bookable services
      - name: Packages
        description: Service packages
      - name: Pricing
        description: Price calculation
      - name: Add-ons
        description: Optional add-ons
    models:
      - name: Category
        description: Service category
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                description:
                  type: string
                displayOrder:
                  type: integer
                active:
                  type: boolean
                serviceCount:
                  type: integer
      - name: CategoryPage
        description: Page of categories
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      description:
                        type: string
                      displayOrder:
                        type: integer
                      active:
                        type: boolean
                      serviceCount:
                        type: integer
      - name: Service
        description: Bookable catalog service
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                categoryId:
                  type: string
                name:
                  type: string
                description:
                  type: string
                durationMinutes:
                  type: integer
                vehicleTypes:
                  type: array
                  items:
                    type: string
                    enum:
                      - HATCHBACK
                      - SEDAN
                      - SUV
                      - MUV
                      - LUXURY
                      - BIKE
                basePrice:
                  type: number
                active:
                  type: boolean
      - name: ServicePage
        description: Page of services
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      categoryId:
                        type: string
                      name:
                        type: string
                      description:
                        type: string
                      durationMinutes:
                        type: integer
                      vehicleTypes:
                        type: array
                        items:
                          type: string
                          enum:
                            - HATCHBACK
                            - SEDAN
                            - SUV
                            - MUV
                            - LUXURY
                            - BIKE
                      basePrice:
                        type: number
                      active:
                        type: boolean
      - name: Package
        description: Service package
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                description:
                  type: string
                services:
                  type: array
                  items:
                    type: string
                discountedPrice:
                  type: number
      - name: PackagePage
        description: Page of packages
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      description:
                        type: string
                      services:
                        type: array
                        items:
                          type: string
                      discountedPrice:
                        type: number
      - name: AddOn
        description: Optional add-on
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                price:
                  type: number
                durationMinutes:
                  type: integer
      - name: AddOnPage
        description: Page of add-ons
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      price:
                        type: number
                      durationMinutes:
                        type: integer
      - name: PricingCalculateRequest
        description: Price calculation input. Coupon codes are ignored.
        content:
          application/json:
            schema:
              type: object
              properties:
                vehicleType:
                  type: string
                  enum:
                    - HATCHBACK
                    - SEDAN
                    - SUV
                    - MUV
                    - LUXURY
                    - BIKE
                vendorId:
                  type: string
                serviceIds:
                  type: array
                  items:
                    type: string
                packageIds:
                  type: array
                  items:
                    type: string
                addOnIds:
                  type: array
                  items:
                    type: string
                addonIds:
                  type: array
                  items:
                    type: string
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - SERVICE
                          - PACKAGE
                      serviceId:
                        type: string
                      categoryId:
                        type: string
                      packageId:
                        type: string
                couponCode:
                  type: string
              required:
                - vehicleType
      - name: PricingResult
        description: Calculated price
        content:
          application/json:
            schema:
              type: object
              properties:
                currency:
                  type: string
                subtotal:
                  type: number
                discount:
                  type: number
                total:
                  type: number
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      amount:
                        type: number
      - name: ErrorResponse
        description: Platform error envelope
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                statusCode:
                  type: integer
                message:
                  type: object
                  properties:
                    title:
                      type: string
                    description:
                      type: string
                    severity:
                      type: string
                data:
                  type: object
                  properties: {}
                error:
                  type: object
                  properties:
                    code:
                      type: string
                    details:
                      type: array
                      items:
                        type: object
                        properties:
                          field:
                            type: string
                          message:
                            type: string
                meta:
                  type: object
                  properties:
                    correlationId:
                      type: string
                    timestamp:
                      type: string
                    version:
                      type: string
