      - http:
          path: /vendors/{vendorId}/service-visits/{visitId}/pause
          method: post
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: Pause a service visit
          swaggerTags:
            - Service visits
          documentation:
            summary: Pause a service visit
            description: Pauses an active visit.
            tags:
              - Service visits
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Paused
                responseModels:
                  application/json: ServiceVisit

  archiveServiceVisit:
    handler: src/handlers/service-visits-handler.handleArchiveServiceVisit
    events:
      - http:
          path: /vendors/{vendorId}/service-visits/{visitId}
          method: delete
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: Archive a service visit
          swaggerTags:
            - Service visits
          documentation:
            summary: Archive a service visit
            description: Archives a visit. The visit id is unchanged.
            tags:
              - Service visits
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Archived
                responseModels:
                  application/json: ServiceVisit

  onServiceVisitChanged:
    handler: src/handlers/service-visit-stream.handler
    timeout: 60
    events:
      - stream:
          type: dynamodb
          arn: !GetAtt ServiceCatalogTable.StreamArn
          filterPatterns:
            - eventName:
                - INSERT
                - MODIFY
              dynamodb:
                NewImage:
                  entityType:
                    S:
                      - ServiceVisitConfiguration
          batchSize: 10
          startingPosition: LATEST
          bisectBatchOnFunctionError: true
          maximumRetryAttempts: 3
          functionResponseType: ReportBatchItemFailures
          destinations:
            onFailure:
              arn: !GetAtt ServiceVisitStreamDlq.Arn
              type: sqs

  # One consumer on the existing table stream; SERVICE index rows are excluded.
  onVendorServiceChanged:
    handler: src/handlers/vendor-service-stream.handler
    timeout: 60
    events:
      - stream:
          type: dynamodb
          arn: !GetAtt ServiceCatalogTable.StreamArn
          filterPatterns:
            - eventName: [INSERT, MODIFY]
              dynamodb:
                NewImage:
                  entityType:
                    S: [SERVICE]
            - eventName: [REMOVE]
              dynamodb:
                OldImage:
                  entityType:
                    S: [SERVICE]
          batchSize: 10
          startingPosition: LATEST
          bisectBatchOnFunctionError: true
          maximumRetryAttempts: 3
          functionResponseType: ReportBatchItemFailures
          destinations:
            onFailure:
              arn: !GetAtt ServiceVisitStreamDlq.Arn
              type: sqs


resources:
  Resources:

    ServiceVisitStreamDlq:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${self:provider.stage}-service-visit-stream-dlq
        MessageRetentionPeriod: 1209600
        SqsManagedSseEnabled: true

    DiscoveryVendorLifecycleDlq:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${self:provider.stage}-discovery-lifecycle-dlq
        MessageRetentionPeriod: 1209600
        SqsManagedSseEnabled: true

    DiscoveryVendorLifecycleDlqPolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref DiscoveryVendorLifecycleDlq
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: AllowEventBridgeSendToDiscoveryLifecycleDlq
              Effect: Allow
              Principal:
                Service: events.amazonaws.com
              Action: sqs:SendMessage
              Resource: !GetAtt DiscoveryVendorLifecycleDlq.Arn
              Condition:
                StringEquals:
                  aws:SourceAccount: !Ref AWS::AccountId

    DiscoveryVendorLifecycleRule:
      Type: AWS::Events::Rule
      DependsOn:
        - DiscoveryVendorLifecycleDlqPolicy
      Properties:
        Name: ${self:service}-${self:provider.stage}-discovery-lifecycle
        Description: Updates marketplace discovery when a vendor is approved, rejected, or suspended
        EventBusName:
          Fn::ImportValue: nv${self:provider.stage}-bw-vendor-event-bus-name
        EventPattern:
          source:
            - vendor-service
          detail-type:
            - VendorApproved
            - VendorRejected
            - VendorSuspended
        State: ENABLED
        Targets:
          - Id: CatalogDiscoveryLifecycle
            Arn: !GetAtt OnDiscoveryVendorLifecycleLambdaFunction.Arn
            DeadLetterConfig:
              Arn: !GetAtt DiscoveryVendorLifecycleDlq.Arn
            RetryPolicy:
              MaximumRetryAttempts: 3

    DiscoveryVendorLifecyclePermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !GetAtt OnDiscoveryVendorLifecycleLambdaFunction.Arn
        Action: lambda:InvokeFunction
        Principal: events.amazonaws.com
        SourceArn: !GetAtt DiscoveryVendorLifecycleRule.Arn

    DiscoveryVendorFactsDlq:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${self:provider.stage}-discovery-facts-dlq
        MessageRetentionPeriod: 1209600
        SqsManagedSseEnabled: true

    DiscoveryVendorFactsDlqPolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref DiscoveryVendorFactsDlq
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: AllowEventBridgeSendToDiscoveryFactsDlq
              Effect: Allow
              Principal:
                Service: events.amazonaws.com
              Action: sqs:SendMessage
              Resource: !GetAtt DiscoveryVendorFactsDlq.Arn
              Condition:
                StringEquals:
                  aws:SourceAccount: !Ref AWS::AccountId

    DiscoveryVendorFactsRule:
      Type: AWS::Events::Rule
      DependsOn:
        - DiscoveryVendorFactsDlqPolicy
      Properties:
        Name: ${self:service}-${self:provider.stage}-discovery-facts
        Description: Updates marketplace discovery when branch, coverage, pricing, or operations change
        EventBusName:
          Fn::ImportValue: nv${self:provider.stage}-bw-vendor-event-bus-name
        EventPattern:
          source:
            - vendor-service
          detail-type:
            - VendorDiscoveryChanged
        State: ENABLED
        Targets:
          - Id: CatalogDiscoveryFacts
            Arn: !GetAtt OnDiscoveryVendorFactsLambdaFunction.Arn
            DeadLetterConfig:
              Arn: !GetAtt DiscoveryVendorFactsDlq.Arn
            RetryPolicy:
              MaximumRetryAttempts: 3

    DiscoveryVendorFactsPermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !GetAtt OnDiscoveryVendorFactsLambdaFunction.Arn
        Action: lambda:InvokeFunction
        Principal: events.amazonaws.com
        SourceArn: !GetAtt DiscoveryVendorFactsRule.Arn

    ServiceCatalogTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-service-catalog

        BillingMode: PAY_PER_REQUEST

        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S

          - AttributeName: SK
            AttributeType: S

          - AttributeName: LSI1SK
            AttributeType: S

          - AttributeName: LSI2SK
            AttributeType: S

          - AttributeName: LSI3SK
            AttributeType: S

          - AttributeName: LSI4SK
            AttributeType: S

          - AttributeName: LSI5SK
            AttributeType: S

          - AttributeName: GSI1PK
            AttributeType: S

          - AttributeName: GSI1SK
            AttributeType: S

          - AttributeName: GSI2PK
            AttributeType: S

          - AttributeName: GSI2SK
            AttributeType: S

          - AttributeName: GSI3PK
            AttributeType: S

          - AttributeName: GSI3SK
            AttributeType: S

        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE

        LocalSecondaryIndexes:
          - IndexName: LSI1
            KeySchema:
              - AttributeName: PK
                KeyType: HASH
              - AttributeName: LSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

          - IndexName: LSI2
            KeySchema:
              - AttributeName: PK
                KeyType: HASH
              - AttributeName: LSI2SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

          - IndexName: LSI3
            KeySchema:
              - AttributeName: PK
                KeyType: HASH
              - AttributeName: LSI3SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

          - IndexName: LSI4
            KeySchema:
              - AttributeName: PK
                KeyType: HASH
              - AttributeName: LSI4SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

          - IndexName: LSI5
            KeySchema:
              - AttributeName: PK
                KeyType: HASH
              - AttributeName: LSI5SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH
              - AttributeName: GSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

          - IndexName: GSI2
            KeySchema:
              - AttributeName: GSI2PK
                KeyType: HASH
              - AttributeName: GSI2SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

          # Sparse index of active offering-community mappings.
          # Deploy this index and wait until it is ACTIVE before enabling enforcement.
          - IndexName: GSI3
            KeySchema:
              - AttributeName: GSI3PK
                KeyType: HASH
              - AttributeName: GSI3SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

        SSESpecification:
          SSEEnabled: true

        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES

        Tags:
          - Key: Service
            Value: service-catalog

          - Key: Environment
            Value: ${self:provider.stage}

          - Key: ManagedBy
            Value: Serverless

    GatewayResponseDefault4XX: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseDefault4XX}

    GatewayResponseDefault5XX: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseDefault5XX}

    GatewayResponseUnauthorized: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseUnauthorized}

    GatewayResponseAccessDenied: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseAccessDenied}

    GatewayResponseMissingAuthenticationToken: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseMissingAuthenticationToken}
    GatewayResponseExpiredToken: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseExpiredToken}
    GatewayResponseIntegrationFailure: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseIntegrationFailure}
    GatewayResponseIntegrationTimeout: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseIntegrationTimeout}

