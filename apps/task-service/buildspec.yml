version: 0.2
# Split pipeline: build uploads Lambda zips to DEPLOYMENT_BUCKET and emits packaged.yaml.
# Deploy must use the artifact at apps/task-service/packaged.yaml (see artifacts.files).

env:
  # NOTE: `compute-type` is NOT a valid field in a non-batch buildspec — AWS ignores it.
  # Compute type must be set on the CodeBuild PROJECT (console/CLI/IaC) or via
  # `--compute-type-override`. This project currently runs on SMALL (~3.6 GiB), so the
  # settings below are tuned to fit SMALL. To get more memory, change the project to
  # BUILD_GENERAL1_MEDIUM and you can then raise NODE_OPTIONS to ~6144.
  shell: bash
  variables:
    STAGE: 'dev'
    DEPLOYMENT_BUCKET: 'dev-mvx-task-service-bucket'
    STACK_NAME: 'dev-task-service'
    # Cap Node heap well below the ~3.6 GiB container so the esbuild subprocess has
    # headroom. A 6144 cap on a 3.6 GiB box prevents GC and OOM-kills esbuild
    # ("Error: The service was stopped").
    NODE_OPTIONS: '--max-old-space-size=2048'

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies..."
      - npm install --legacy-peer-deps

  pre_build:
    commands:
      - echo "Making scripts executable..."
      - chmod +x apps/task-service/ci/*.sh

  build:
    commands:
      - echo "Starting build..."
      - apps/task-service/ci/build.sh

  post_build:
    commands:
      - echo "Running deployment verification..."
      - apps/task-service/ci/verify-artifacts.sh

artifacts:
  files:
    - apps/task-service/packaged.yaml
    - apps/task-service/.serverless/**/*
  discard-paths: no 