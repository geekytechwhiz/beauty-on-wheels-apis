# Infrastructure naming (not Lambda env — values are published to SSM via resourceRegistry).
taskDynamoTableName: task-service-${self:provider.stage}
eventBusName: task-service-bus-${self:provider.stage}
reminderSchedulerGroupName: task-service-${self:provider.stage}-reminders

corsOrigin:
  dev: '*'
  stg: '*'
  prd: '*'

logLevel:
  dev: debug
  stg: info
  prd: warn
