# Task-service SSM parameter paths per stage (published by mvrx-resource-registry on deploy).
dev:
  region: /dev/task-service/REGION
  stage: /dev/task-service/STAGE
  nodeEnv: /dev/task-service/NODE_ENV
  serviceName: /dev/task-service/SERVICE_NAME
  taskTable: /dev/task-service/TASK_TABLE
  carePlanLsiIndex: /dev/task-service/CARE_PLAN_LSI_INDEX
  staffTasksGsiIndex: /dev/task-service/STAFF_TASKS_GSI_INDEX
  logLevel: /dev/task-service/LOG_LEVEL
  awsNodejsConnectionReuseEnabled: /dev/task-service/AWS_NODEJS_CONNECTION_REUSE_ENABLED
  userServiceTimeoutMs: /dev/task-service/USER_SERVICE_TIMEOUT_MS
  organizationServiceTimeoutMs: /dev/task-service/ORGANIZATION_SERVICE_TIMEOUT_MS
  taskEventBusName: /dev/task-service/eventbridge/TaskServiceBus/name
  eventDlqQueueUrl: /dev/task-service/sqs/TaskEventsConsumerDLQ/url
  reminderSchedulerGroupName: /dev/task-service/REMINDER_SCHEDULER_GROUP_NAME
  reminderSchedulerTargetRoleArn: /dev/task-service/REMINDER_SCHEDULER_TARGET_ROLE_ARN
  processReminderLambdaArn: /dev/task-service/PROCESS_REMINDER_LAMBDA_ARN

