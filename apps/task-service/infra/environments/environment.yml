# Bootstrap (first deploy): bundle/provider/CF refs — no SSM at package time.
# After mvrx-resource-registry publishes params, swap active lines for the commented SSM block below.
REGION: ${self:provider.region}
STAGE: ${self:provider.stage}
NODE_ENV: ${self:provider.stage}
SERVICE_NAME: ${self:service}
TASK_TABLE: ${self:custom.bundle.taskDynamoTableName}
CARE_PLAN_LSI_INDEX: pk-sk1
STAFF_TASKS_GSI_INDEX: GSI1
LOG_LEVEL: ${self:custom.bundle.logLevel.${self:provider.stage}, 'info'}
AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
ERROR_MESSAGES_CDN_URL: ${self:custom.bundle.errorMessagesCdnUrl.${self:provider.stage}}
USER_SERVICE_BASE_URL: ${self:custom.bundle.serviceUrlFallbacks.${self:provider.stage}.USER_SERVICE_BASE_URL}
ORGANIZATION_SERVICE_BASE_URL: ${self:custom.bundle.serviceUrlFallbacks.${self:provider.stage}.ORGANIZATION_SERVICE_BASE_URL}
USER_SERVICE_TIMEOUT_MS: '8000'
ORGANIZATION_SERVICE_TIMEOUT_MS: '8000'
TASK_EVENT_BUS_NAME: ${self:custom.bundle.eventBusName}
EVENT_DLQ_QUEUE_URL: !Ref TaskEventsConsumerDLQ

