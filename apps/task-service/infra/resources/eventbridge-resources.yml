Resources:
  TaskEventsConsumerDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ${self:provider.stage}-${self:service}-events-dlq
      MessageRetentionPeriod: 1209600
      Tags:
        - Key: Service
          Value: ${self:service}
        - Key: Stage
          Value: ${self:provider.stage}
        - Key: Purpose
          Value: DLQ

  TaskServiceBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: ${self:custom.bundle.eventBusName}
      Tags:
        - Key: Service
          Value: ${self:service}
        - Key: Stage
          Value: ${self:provider.stage}
        - Key: ManagedBy
          Value: serverless

  # Explicit Lambda ← EventBridge permissions (required when using a custom bus name).
  # Rule names: <service>-<stage>-<functionName>-rule-1
  OnMonitoringActionRequestedInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt OnMonitoringActionRequestedLambdaFunction.Arn
      Principal: events.amazonaws.com
      SourceAccount: ${aws:accountId}
      SourceArn: arn:aws:events:${self:provider.region}:${aws:accountId}:rule/${self:custom.bundle.eventBusName}/${self:service}-${self:provider.stage}-onMonitoringActionRequested-rule-1

Outputs:
  TaskServiceBusName:
    Description: Name of the Task Service Event Bus
    Value:
      Ref: TaskServiceBus
    Export:
      Name: ${self:provider.stage}-${self:service}-EventBusName
  TaskServiceBusArn:
    Description: ARN of the Task Service Event Bus
    Value:
      Fn::GetAtt:
        - TaskServiceBus
        - Arn
    Export:
      Name: ${self:provider.stage}-${self:service}-EventBusArn
