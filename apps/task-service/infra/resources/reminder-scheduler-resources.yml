Resources:
  TaskReminderScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: ${self:custom.bundle.reminderSchedulerGroupName}
      Tags:
        - Key: Service
          Value: ${self:service}
        - Key: Stage
          Value: ${self:provider.stage}

  ReminderSchedulerInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ${self:provider.stage}-${self:service}-reminder-scheduler-invoke
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeProcessReminderLambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                # Static ARN — Fn::GetAtt ProcessReminderLambdaFunction creates a CF circular dependency
                # with IamRoleLambdaExecution (PassRole) and provider-wide scheduler env vars.
                Resource:
                  - arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:service}-${self:provider.stage}-processReminder
      Tags:
        - Key: Service
          Value: ${self:service}
        - Key: Stage
          Value: ${self:provider.stage}

  ProcessReminderSchedulerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ProcessReminderLambdaFunction
      Principal: scheduler.amazonaws.com
      SourceArn: arn:aws:scheduler:${self:provider.region}:${aws:accountId}:schedule/${self:custom.bundle.reminderSchedulerGroupName}/*
