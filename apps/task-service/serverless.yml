service: task-service

# Serverless 3.40 JSON schema may lag new Lambda runtimes (e.g. nodejs22.x); AWS still accepts them.
configValidationMode: warn

frameworkVersion: '3.x'

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-auto-swagger
  - serverless-offline

provider:
  name: aws
  runtime: nodejs22.x
  versionFunctions: false
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  deploymentBucket:
    name: ${self:provider.stage}-mvx-task-service-bucket
    serverSideEncryption: AES256
  memorySize: 512
  timeout: 30

  tracing:
    lambda: true
    apiGateway: true

  logRetentionInDays: 14

  environment: ${file(./infra/environments/environment.yml)}

  tags:
    Service: ${self:service}
    Stage: ${self:provider.stage}
    ManagedBy: serverless

  iamRoleStatements:
    - ${file(./infra/permissions/dynamodb.yml)}
    - ${file(./infra/permissions/dynamodb-stream.yml)}
    - ${file(./infra/permissions/scheduler.yml)}
    - ${file(./infra/permissions/scheduler-passrole.yml)}
    - ${file(./infra/permissions/eventbridge.yml)}
    - ${file(./infra/permissions/sqs-dlq.yml)}
    - ${file(./infra/permissions/xray.yml)}

package:
  individually: true
  patterns:
    - '!**/*.test.ts'
    - '!**/*.spec.ts'

custom:
  bundle: ${file(./infra/config/infra-custom.yml)}

  # Inbound EventBridge bus owned by task-service. Upstream producers PutEvents here.
  taskEventIngest:
    sources:
      - task-service
      - monitoring-service

  monitoringActionRequested:
    eventBridgeDetailType: MonitoringActionRequested.v1

  # Same CORS + authorizer event shape as user-service (cors before authorizer on each http event).
  # YAML anchor: JSON schema expects a real object for `http.cors`, not `cors: ${...}` (seen as string).
  cors: &httpApiCors
    origin: ${self:custom.bundle.corsOrigin.${self:provider.stage}, '*'}
    headers:
      - Content-Type
      - X-Amz-Date
      - Authorization
      - X-Api-Key
      - X-Correlation-Id
      - X-Request-Id
      - X-Requested-With
      - Sec-Ch-Ua
      - Sec-Ch-Ua-Mobile
      - Sec-Ch-Ua-Platform

  sourcemapsByStage:
    dev: true
    stg: false
    prd: false

  esbuild:
    bundle: true
    minify: false
    sourcemap: ${self:custom.sourcemapsByStage.${self:provider.stage}, false}
    target: node22
    platform: node
    format: cjs
    tsconfig: ../../tsconfig.base.json
    external:
      - aws-sdk
    keepNames: true
    # Serialize bundling/zipping. With package.individually + many functions, parallel esbuild
    # service instances exhaust the CodeBuild container and crash with "The service was stopped".
    concurrency: 1
    zipConcurrency: 1
    # Resolve NX workspace dependencies (@api-hub/* packages)
    plugins: esbuild-plugins.js
    # Ensure proper module resolution
    resolveExtensions:
      - '.ts'
      - '.tsx'
      - '.js'
      - '.jsx'
      - '.mjs'
      - '.json'

  autoswagger:
    title: Task Service API
    description: Runtime task HTTP API. Swagger 2 merge file for serverless-auto-swagger.
    version: 1.0.0
    apiType: http
    basePath: /${self:provider.stage}
    schemes:
      - https
      - http
    host: ${self:custom.apiHost, ''}
    generateSwaggerOnDeploy: true
    swaggerFiles:
      - swagger.json
    useStage: true
    swaggerPath: swagger
    excludeStages:
      - production

  dotenv:
    logging: false

  # DynamoDB stream on manually provisioned task table (task-service-{stage}).
  # Re-enabling stream changes LatestStreamLabel — update timestamp and redeploy.
  taskTableStreamTimestamp:
    dev: '2026-06-05T10:29:35.640'
    stg: '2026-06-05T10:35:04.797'
    prd: '2026-06-05T10:35:35.431'

  taskTableStreamArn: >-
    arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/task-service-${self:provider.stage}/stream/${self:custom.taskTableStreamTimestamp.${self:provider.stage}}

  serverless-offline:
    httpPort: 3000
    noPrependStageInUrl: true

# REST + CORS; secured routes: cors block first, then shared token authorizer (same as alert-service).
functions:
  health:
    handler: src/handlers/http/health.main
    events:
      - http:
          path: /health
          method: get
          cors: true

  createMonitoringAction:
    handler: src/handlers/http/createMonitoringAction.main
    events:
      - http:
          path: tasks/monitoring-action
          method: post
          bodyType: CreateMonitoringActionRequest
          summary: Create a monitoring-generated runtime task (idempotent)
          description: Called by Monitoring Runtime. orgId from JWT; patientId and patientDisplayName from request body. GSI1 when assignedToStaffId set.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK
            "400": Bad request
            "401": Unauthorized
            "403": Forbidden
            "409": Conflict
            "422": Validation or business rule error
            "500": Server error

  generateCarePlanTasks:
    handler: src/handlers/http/generateCarePlanTasks.main
    events:
      - http:
          path: tasks/generate-care-plan
          method: post
          bodyType: GenerateCarePlanTasksRequest
          summary: Generate care-plan linkage runtime tasks (idempotent batch)
          description: Called by Care Plan Runtime. orgId from JWT; patientId and patientDisplayName from request body. GSI1 per linkage when assignedToStaffId set.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK
            "400": Bad request
            "401": Unauthorized
            "403": Forbidden
            "409": Conflict
            "422": Validation or business rule error
            "500": Server error

  getTasks:
    handler: src/handlers/http/getTasks.main
    events:
      - http:
          path: tasks
          method: get
          summary: List tasks by patient and (optionally) care plan
          description: Patient-scoped task list. Organization scope from JWT only.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK
            "400": Bad request
            "401": Unauthorized
            "403": Forbidden
            "500": Server error

  getActionCenterItems:
    handler: src/handlers/http/getActionCenterItems.main
    events:
      - http:
          path: action-center/items
          method: get
          summary: Get Action Center items by surface section
          description: Patient Action Center with server-derived surfaceSection. Organization scope from JWT only.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK
            "400": Bad request
            "401": Unauthorized
            "403": Forbidden
            "500": Server error

  getStaffTasks:
    handler: src/handlers/http/getStaffTasks.main
    events:
      - http:
          path: staff/tasks
          method: get
          summary: List tasks assigned to the authenticated staff member
          description: Staff inbox via GSI1. staffUserId must match JWT user id. Organization scope from JWT only.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK
            "400": Bad request
            "401": Unauthorized
            "403": Forbidden
            "500": Server error

  createRuntimeTask:
    handler: src/handlers/http/createRuntimeTask.main
    events:
      - http:
          path: tasks
          method: post
          bodyType: CreateRuntimeTaskRequest
          summary: Create an ad-hoc/service-flow/manual runtime task
          description: >
            Called by Service Flow Runtime or authorized staff/system (runtimeTaskSource =
            serviceFlowRuntime or manualSystem). orgId from JWT; patientId and patientDisplayName from request body.
            GSI1 when assignedToStaffId set. Prefer manualSystem when the origin is this API or the care UI.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK
            "400": Bad request
            "401": Unauthorized
            "403": Forbidden
            "422": Validation or business rule error
            "500": Server error

  getRuntimeTask:
    handler: src/handlers/http/getRuntimeTask.main
    events:
      - http:
          path: tasks/{runtimeTaskInstanceId}
          method: get
          summary: Get one runtime task detail
          description: Resolve task detail by LOOKUP, scoped to organization from JWT.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK
            "400": Bad request
            "401": Unauthorized
            "403": Forbidden
            "404": Not found
            "500": Server error

  updateRuntimeTask:
    handler: src/handlers/http/updateRuntimeTask.main
    events:
      - http:
          path: tasks/{runtimeTaskInstanceId}
          method: patch
          bodyType: UpdateRuntimeTaskRequest
          summary: Update runtime task metadata (portal)
          description: >
            Portal partial metadata edit on META (+ LOOKUP when patientDisplayName changes).
            Appends HIST taskMetadataChange audit. Does not change due windows, staff assignment,
            reminders, or task state.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK
            "400": Bad request
            "401": Unauthorized
            "403": Forbidden
            "404": Not found
            "422": Validation or business rule error
            "500": Server error

  getRuntimeTaskHistory:
    handler: src/handlers/http/getRuntimeTaskHistory.main
    events:
      - http:
          path: tasks/{runtimeTaskInstanceId}/history
          method: get
          summary: Get task audit history
          description: Paged HIST# timeline for one runtime task (newest first), scoped to organization from JWT.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK
            "400": Bad request
            "401": Unauthorized
            "403": Forbidden
            "404": Not found
            "500": Server error

  updateAssignedStaff:
    handler: src/handlers/http/updateAssignedStaff.main
    events:
      - http:
          path: tasks/{runtimeTaskInstanceId}/assigned-staff
          method: put
          bodyType: UpdateAssignedStaffRequest
          summary: Assign or reassign staff task to a staff member
          description: >
            Portal assign/reassign for staff tasks. orgId from JWT. Sets or updates GSI1 (gsi1pk + gsi1sk on
            first assignment; gsi1pk only on reassignment). Appends HIST assignedToStaffChange audit.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK
            "400": Bad request
            "401": Unauthorized
            "403": Forbidden
            "404": Not found
            "422": Validation or business rule error
            "500": Server error

  updateTaskState:
    handler: src/handlers/http/updateTaskState.main
    events:
      - http:
          path: tasks/{runtimeTaskInstanceId}/state
          method: post
          bodyType: UpdateTaskStateRequest
          summary: Update task state (optimistic validation + audit)
          description: >
            Manual runtime action from Mobile, Portal, BFF, or authorized staff. Requires expectedCurrentState
            for optimistic concurrency.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK
            "400": Bad request
            "401": Unauthorized
            "403": Forbidden
            "404": Not found
            "409": Conflict
            "422": Validation or business rule error
            "500": Server error

  updateReminderSettings:
    handler: src/handlers/http/updateReminderSettings.main
    events:
      - http:
          path: tasks/{runtimeTaskInstanceId}/reminder-settings
          method: put
          bodyType: UpdateReminderSettingsRequest
          summary: Update task reminder settings (portal)
          description: >
            Authorized portal users update reminderEnabled and reminderSettings on META with HIST audit.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK
            "400": Bad request
            "401": Unauthorized
            "403": Forbidden
            "404": Not found
            "422": Validation or business rule error
            "500": Server error

  getTaskStatusSummary:
    handler: src/handlers/http/getTaskStatusSummary.main
    events:
      - http:
          path: care-plans/{carePlanInstanceId}/task-status-summary
          method: get
          summary: Get care plan task readiness/status summary
          description: >
            Called by Care Plan Runtime for stage readiness gating. patientId query param required.
            Aggregates via CarePlanIndex LSI + in-memory rollup. Organization scope from JWT only.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK
            "400": Bad request
            "401": Unauthorized
            "403": Forbidden
            "500": Server error

  # Reminder stream consumers (META RuntimeTaskInstance only).
  # filterPatterns = coarse business gates; handlers map META → scheduler gateway.
  registerReminderJobs:
    handler: src/handlers/streams/registerReminderJobs.main
    timeout: 30
    memorySize: 256
    description: Registers reminder schedules when reminders are enabled on create or turned on.
    events:
      - stream:
          type: dynamodb
          arn: ${self:custom.taskTableStreamArn}
          batchSize: 10
          startingPosition: LATEST
          functionResponseType: ReportBatchItemFailures
          filterPatterns:
            - eventName: [INSERT]
              dynamodb:
                NewImage:
                  entityType:
                    S: [RuntimeTaskInstance]
                  reminderEnabled:
                    BOOL: [true]
                  currentState:
                    S: [open, scheduled, active]
            - eventName: [MODIFY]
              dynamodb:
                NewImage:
                  entityType:
                    S: [RuntimeTaskInstance]
                  reminderEnabled:
                    BOOL: [true]
                  currentState:
                    S: [open, scheduled, active]
                OldImage:
                  entityType:
                    S: [RuntimeTaskInstance]
                  reminderEnabled:
                    BOOL: [false]

  cancelReminderJobs:
    handler: src/handlers/streams/cancelReminderJobs.main
    timeout: 30
    memorySize: 256
    description: Cancels reminder schedules when reminders are disabled or task is completed, dismissed, or cancelled.
    events:
      - stream:
          type: dynamodb
          arn: ${self:custom.taskTableStreamArn}
          batchSize: 10
          startingPosition: LATEST
          functionResponseType: ReportBatchItemFailures
          filterPatterns:
            - eventName: [MODIFY]
              dynamodb:
                NewImage:
                  entityType:
                    S: [RuntimeTaskInstance]
                  reminderEnabled:
                    BOOL: [false]
                OldImage:
                  entityType:
                    S: [RuntimeTaskInstance]
                  reminderEnabled:
                    BOOL: [true]
            - eventName: [MODIFY]
              dynamodb:
                NewImage:
                  entityType:
                    S: [RuntimeTaskInstance]
                  currentState:
                    S: [completed, dismissed, cancelled]
                OldImage:
                  entityType:
                    S: [RuntimeTaskInstance]
                  currentState:
                    S: [open, scheduled, active]

  processReminder:
    handler: src/handlers/http/processReminder.main
    timeout: 30
    memorySize: 256
    description: Scheduler callback at reminder fire time; validates META eligibility and dispatches notification.
    events:
      - http:
          path: internal/reminders/process
          method: post
          cors: false

  # ──────────────────────────────────────────────────────────────────────────────
  # EventBridge consumers — monitoring action ingest (MonitoringActionRequested.v1).
  # ──────────────────────────────────────────────────────────────────────────────
  onMonitoringActionRequested:
    handler: src/handlers/events/consumer/event-bridge/monitoringActionRequestedConsumer.main
    maximumRetryAttempts: 2
    destinations:
      onFailure:
        type: sqs
        arn:
          Fn::GetAtt:
            - TaskEventsConsumerDLQ
            - Arn
    events:
      - eventBridge:
          eventBus:
            Fn::GetAtt:
              - TaskServiceBus
              - Arn
          pattern:
            source: ${self:custom.taskEventIngest.sources}
            detail-type:
              - ${self:custom.monitoringActionRequested.eventBridgeDetailType}

resources:
  - ${file(./infra/resources/gateway-responses.yml)}
  - ${file(./infra/resources/eventbridge-resources.yml)}
