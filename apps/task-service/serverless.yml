service: task-service

# Serverless 3.40 JSON schema may lag new Lambda runtimes (e.g. nodejs22.x); AWS still accepts them.
configValidationMode: warn

frameworkVersion: '3.x'

plugins:
  - serverless-esbuild
  - serverless-auto-swagger
  - serverless-offline

provider:
  name: aws
  runtime: nodejs20.x
  versionFunctions: false
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  deploymentBucket:
    name: ${self:provider.stage}-mvx-task-service-bucket
    serverSideEncryption: AES256
  memorySize: 512
  timeout: 30

  tracing:
    lambda: true
    apiGateway: true

  logRetentionInDays: 14

  environment: ${file(./infra/environments/environment.yml)}

  tags:
    Service: ${self:service}
    Stage: ${self:provider.stage}
    ManagedBy: serverless

  iamRoleStatements:
    - ${file(./infra/permissions/dynamodb.yml)}
    - ${file(./infra/permissions/xray.yml)}

package:
  individually: true
  patterns:
    - '!**/*.test.ts'
    - '!**/*.spec.ts'

custom:
  bundle: ${file(./infra/config/infra-custom.yml)}
  cors: &httpApiCors
    origin: ${self:custom.bundle.corsOrigin.${self:provider.stage}, '*'}
    headers:
      - Content-Type
      - X-Amz-Date
      - Authorization
      - X-Api-Key
      - X-Correlation-Id
      - X-Request-Id
      - X-Requested-With
      - Sec-Ch-Ua
      - Sec-Ch-Ua-Mobile
      - Sec-Ch-Ua-Platform

  sourcemapsByStage:
    dev: false
    stg: false
    prd: false

  esbuild:
    bundle: true
    minify: false
    sourcemap: ${self:custom.sourcemapsByStage.${self:provider.stage}, false}
    target: node20
    platform: node
    format: cjs
    tsconfig: ../../tsconfig.base.json
    external:
      - aws-sdk
    keepNames: true
    concurrency: 1
    zipConcurrency: 1
    plugins: esbuild-plugins.js
    resolveExtensions:
      - '.ts'
      - '.tsx'
      - '.js'
      - '.jsx'
      - '.mjs'
      - '.json'

  autoswagger:
    title: Task Service API
    apiType: http
    basePath: /${self:provider.stage}
    schemes:
      - https
      - http
    host: ${self:custom.apiHost, ''}
    generateSwaggerOnDeploy: true
    swaggerFiles:
      - swagger.json
    useStage: true
    swaggerPath: swagger
    excludeStages:
      - production
      - dev

  serverless-offline:
    httpPort: 3000
    noPrependStageInUrl: true

functions:
  health:
    handler: src/handlers/http/health.main
    events:
      - http:
          path: /health
          method: get
          cors: true

  createMonitoringAction:
    handler: src/handlers/http/createMonitoringAction.main
    events:
      - http:
          path: tasks/monitoring-action
          method: post
          bodyType: CreateMonitoringActionRequest
          summary: Create a monitoring-generated runtime task (idempotent)
          description: Called by Monitoring Runtime. Organization scope from JWT only.
          cors: *httpApiCors
          # authorizer:
          #   name: common_authorizer
          #   type: token
          #   identitySource: method.request.header.Authorization
          #   arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
          #   resultTtlInSeconds: 0
          responses:
            "200": OK — created or SkippedDuplicate
            "400": Bad request
            "401": Unauthorized
            "403": Forbidden
            "409": Conflict (cross-org idempotency)
            "422": Validation or business rule error
            "500": Server error

  generateCarePlanTasks:
    handler: src/handlers/http/generateCarePlanTasks.main
    events:
      - http:
          path: tasks/generate-care-plan
          method: post
          bodyType: GenerateCarePlanTasksRequest
          summary: Generate care-plan linkage runtime tasks (idempotent batch)
          description: Called by Care Plan Runtime. Organization scope from JWT only.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK — batch results (created or skippedDuplicate per linkage)
            "400": Bad request
            "401": Unauthorized
            "403": Forbidden
            "409": Conflict (cross-org idempotency)
            "422": Validation or business rule error
            "500": Server error

  createRuntimeTask:
    handler: src/handlers/http/createRuntimeTask.main
    events:
      - http:
          path: tasks
          method: post
          bodyType: CreateRuntimeTaskRequest
          summary: Create an ad-hoc/service-flow/manual runtime task
          description: >
            Called by Service Flow Runtime or authorized staff/system (runtimeTaskSource =
            serviceFlowRuntime or manualSystem). Organization scope from JWT only.
            Prefer manualSystem when the origin is this API or the care UI.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK — new runtime task created
            "400": Bad request
            "401": Unauthorized
            "403": Forbidden
            "422": Validation or business rule error
            "500": Server error

  getRuntimeTask:
    handler: src/handlers/http/getRuntimeTask.main
    events:
      - http:
          path: tasks/{runtimeTaskInstanceId}
          method: get
          summary: Get one runtime task detail
          description: Resolve task detail by LOOKUP, scoped to organization from JWT.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": Task detail
            "400": Bad request
            "401": Unauthorized
            "403": Forbidden
            "404": Runtime task not found
            "500": Server error

  getRuntimeTaskHistory:
    handler: src/handlers/http/getRuntimeTaskHistory.main
    events:
      - http:
          path: tasks/{runtimeTaskInstanceId}/history
          method: get
          summary: Get task audit history
          description: Paged HIST# timeline for one runtime task (newest first), scoped to organization from JWT.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": Paged history entries
            "400": Bad request
            "401": Unauthorized
            "403": Forbidden
            "404": Runtime task not found
            "500": Server error

  updateAssignedStaff:
    handler: src/handlers/http/updateAssignedStaff.main
    events:
      - http:
          path: tasks/{runtimeTaskInstanceId}/assigned-staff
          method: put
          bodyType: UpdateAssignedStaffRequest
          summary: Assign or reassign staff task to a staff member
          description: >
            Portal assign/reassign for careTeam/provider tasks. Initial assignment sets GSI1 pk+sk;
            reassignment updates gsi1Pk only. Appends HIST assignedToStaffChange audit. Organization scope from JWT only.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": Updated task and audit entry
            "400": Bad request
            "401": Unauthorized
            "403": Forbidden
            "404": Runtime task not found
            "422": Not a staff task or already assigned
            "500": Server error

resources:
  - ${file(./infra/resources/gateway-responses.yml)}
