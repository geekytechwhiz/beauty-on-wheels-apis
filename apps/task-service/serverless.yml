service: task-service

# Serverless 3.40 JSON schema may lag new Lambda runtimes (e.g. nodejs22.x); AWS still accepts them.
configValidationMode: warn

frameworkVersion: '3.x'

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-auto-swagger
  - serverless-offline

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  deploymentBucket:
    name: ${self:provider.stage}-mvx-task-service-bucket
    serverSideEncryption: AES256
  memorySize: 512
  timeout: 30

  tracing:
    lambda: true
    apiGateway: true

  logRetentionInDays: 14

  environment:
    REGION: ${self:provider.region}
    STAGE: ${self:provider.stage}
    NODE_ENV: ${self:provider.stage}
    SERVICE_NAME: ${self:service}
    # Table must exist before deploy; name from custom.taskDynamoTableName.
    TASK_TABLE: ${self:custom.taskDynamoTableName}
    LOG_LEVEL: ${self:custom.logLevel.${self:provider.stage}, 'info'}
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
    ERROR_MESSAGES_CDN_URL: https://d2p9v61861q1ox.cloudfront.net
    # EVENT_BUS: ${self:custom.eventBusName}  # disabled until reminder scheduler consumes task-service bus

  tags:
    Service: ${self:service}
    Stage: ${self:provider.stage}
    ManagedBy: serverless

  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:Query
        - dynamodb:BatchGetItem
        - dynamodb:TransactWriteItems
        - dynamodb:DescribeTable
      Resource:
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:custom.taskDynamoTableName}
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:custom.taskDynamoTableName}/index/*

    # - Effect: Allow
    #   Action:
    #     - events:PutEvents
    #   Resource:
    #     - arn:aws:events:${self:provider.region}:${aws:accountId}:event-bus/${self:custom.eventBusName}

    - Effect: Allow
      Action:
        - xray:PutTraceSegments
        - xray:PutTelemetryRecords
      Resource: '*'

package:
  individually: true
  patterns:
    - '!**/*.test.ts'
    - '!**/*.spec.ts'

custom:
  # Same CORS + authorizer event shape as user-service (cors before authorizer on each http event).
  cors: &httpApiCors
    origin: ${env:CORS_ORIGIN, '*'}
    headers:
      - Content-Type
      - X-Amz-Date
      - Authorization
      - X-Api-Key
      - X-Correlation-Id
      - X-Request-Id
      - X-Requested-With
      - Sec-Ch-Ua
      - Sec-Ch-Ua-Mobile
      - Sec-Ch-Ua-Platform

  taskDynamoTableName: task-service-${self:provider.stage}
  # eventBusName: task-service-bus-${self:provider.stage}  # disabled until reminder scheduler is integrated

  sourcemapsByStage:
    dev: true
    stg: false
    prd: false

  esbuild:
    bundle: true
    minify: false
    sourcemap: ${self:custom.sourcemapsByStage.${self:provider.stage}, false}
    target: node22
    platform: node
    format: cjs
    tsconfig: ../../tsconfig.base.json
    external:
      - aws-sdk
    keepNames: true
    concurrency: 8
    zipConcurrency: 8
    plugins: esbuild-plugins.js
    resolveExtensions:
      - '.ts'
      - '.tsx'
      - '.js'
      - '.jsx'
      - '.mjs'
      - '.json'

  autoswagger:
    title: Task Service API
    description: Runtime task HTTP API. Swagger 2 merge file for serverless-auto-swagger.
    version: 1.0.0
    apiType: http
    basePath: /${self:provider.stage}
    schemes:
      - https
      - http
    host: ${self:custom.apiHost, ''}
    generateSwaggerOnDeploy: true
    swaggerFiles:
      - swagger.json
    useStage: true
    swaggerPath: swagger
    excludeStages:
      - production
      - dev

  logLevel:
    dev: debug
    stg: info
    prd: warn

  dotenv:
    logging: false

  serverless-offline:
    httpPort: 3000
    noPrependStageInUrl: true

# REST + CORS; secured routes: cors block first, then shared token authorizer (same as alert-service).
functions:
  health:
    handler: src/handlers/http/health.main
    events:
      - http:
          path: /health
          method: get
          cors: true

  createMonitoringAction:
    handler: src/handlers/http/createMonitoringAction.main
    events:
      - http:
          path: tasks/monitoring-action
          method: post
          bodyType: CreateMonitoringActionRequest
          summary: Create a monitoring-generated runtime task (idempotent)
          description: Called by Monitoring Runtime. orgId from JWT; patientId and patientDisplayName from request body. GSI1 when assignedToStaffId set.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK
            "400": Bad request
            "401": Unauthorized
            "403": Forbidden
            "409": Conflict
            "422": Validation or business rule error
            "500": Server error

  generateCarePlanTasks:
    handler: src/handlers/http/generateCarePlanTasks.main
    events:
      - http:
          path: tasks/generate-care-plan
          method: post
          bodyType: GenerateCarePlanTasksRequest
          summary: Generate care-plan linkage runtime tasks (idempotent batch)
          description: Called by Care Plan Runtime. orgId from JWT; patientId and patientDisplayName from request body. GSI1 per linkage when assignedToStaffId set.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK
            "400": Bad request
            "401": Unauthorized
            "403": Forbidden
            "409": Conflict
            "422": Validation or business rule error
            "500": Server error

  getTasks:
    handler: src/handlers/http/getTasks.main
    events:
      - http:
          path: tasks
          method: get
          summary: List tasks by patient and (optionally) care plan
          description: Patient-scoped task list. Organization scope from JWT only.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK
            "400": Bad request
            "401": Unauthorized
            "403": Forbidden
            "500": Server error

  getActionCenterItems:
    handler: src/handlers/http/getActionCenterItems.main
    events:
      - http:
          path: action-center/items
          method: get
          summary: Get Action Center items by surface section
          description: Patient Action Center with server-derived surfaceSection. Organization scope from JWT only.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK
            "400": Bad request
            "401": Unauthorized
            "403": Forbidden
            "500": Server error

  getStaffTasks:
    handler: src/handlers/http/getStaffTasks.main
    events:
      - http:
          path: staff/tasks
          method: get
          summary: List tasks assigned to the authenticated staff member
          description: Staff inbox via GSI1. staffUserId must match JWT user id. Organization scope from JWT only.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK
            "400": Bad request
            "401": Unauthorized
            "403": Forbidden
            "500": Server error

  createRuntimeTask:
    handler: src/handlers/http/createRuntimeTask.main
    events:
      - http:
          path: tasks
          method: post
          bodyType: CreateRuntimeTaskRequest
          summary: Create an ad-hoc/service-flow/manual runtime task
          description: >
            Called by Service Flow Runtime or authorized staff/system (runtimeTaskSource =
            serviceFlowRuntime or manualSystem). orgId from JWT; patientId and patientDisplayName from request body.
            GSI1 when assignedToStaffId set. Prefer manualSystem when the origin is this API or the care UI.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK
            "400": Bad request
            "401": Unauthorized
            "403": Forbidden
            "422": Validation or business rule error
            "500": Server error

  getRuntimeTask:
    handler: src/handlers/http/getRuntimeTask.main
    events:
      - http:
          path: tasks/{runtimeTaskInstanceId}
          method: get
          summary: Get one runtime task detail
          description: Resolve task detail by LOOKUP, scoped to organization from JWT.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK
            "400": Bad request
            "401": Unauthorized
            "403": Forbidden
            "404": Not found
            "500": Server error

  getRuntimeTaskHistory:
    handler: src/handlers/http/getRuntimeTaskHistory.main
    events:
      - http:
          path: tasks/{runtimeTaskInstanceId}/history
          method: get
          summary: Get task audit history
          description: Paged HIST# timeline for one runtime task (newest first), scoped to organization from JWT.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK
            "400": Bad request
            "401": Unauthorized
            "403": Forbidden
            "404": Not found
            "500": Server error

  updateAssignedStaff:
    handler: src/handlers/http/updateAssignedStaff.main
    events:
      - http:
          path: tasks/{runtimeTaskInstanceId}/assigned-staff
          method: put
          bodyType: UpdateAssignedStaffRequest
          summary: Assign or reassign staff task to a staff member
          description: >
            Portal assign/reassign for staff tasks. orgId from JWT. Sets or updates GSI1 (gsi1Pk + gsi1Sk on
            first assignment; gsi1Pk only on reassignment). Appends HIST assignedToStaffChange audit.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK
            "400": Bad request
            "401": Unauthorized
            "403": Forbidden
            "404": Not found
            "422": Validation or business rule error
            "500": Server error

  updateTaskState:
    handler: src/handlers/http/updateTaskState.main
    events:
      - http:
          path: tasks/{runtimeTaskInstanceId}/state
          method: post
          bodyType: UpdateTaskStateRequest
          summary: Update task state (optimistic validation + audit)
          description: >
            Manual runtime action from Mobile, Portal, BFF, or authorized staff. Requires expectedCurrentState
            for optimistic concurrency. May publish CancelReminderJobs on terminal transitions.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK
            "400": Bad request
            "401": Unauthorized
            "403": Forbidden
            "404": Not found
            "409": Conflict
            "422": Validation or business rule error
            "500": Server error

  updateReminderSettings:
    handler: src/handlers/http/updateReminderSettings.main
    events:
      - http:
          path: tasks/{runtimeTaskInstanceId}/reminder-settings
          method: put
          bodyType: UpdateReminderSettingsRequest
          summary: Update task reminder settings (portal)
          description: >
            Authorized portal users update reminderEnabled and reminderSettings on META with HIST audit.
            Coordinates CancelReminderJobs / RegisterReminderJobs via EventBridge when eligibility changes.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK
            "400": Bad request
            "401": Unauthorized
            "403": Forbidden
            "404": Not found
            "422": Validation or business rule error
            "500": Server error

  getTaskStatusSummary:
    handler: src/handlers/http/getTaskStatusSummary.main
    events:
      - http:
          path: care-plans/{carePlanInstanceId}/task-status-summary
          method: get
          summary: Get care plan task readiness/status summary
          description: >
            Called by Care Plan Runtime for stage readiness gating. patientId query param required.
            Aggregates via CarePlanIndex LSI + in-memory rollup. Organization scope from JWT only.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK
            "400": Bad request
            "401": Unauthorized
            "403": Forbidden
            "500": Server error

resources:
  Resources:
    GatewayResponseUnauthorized:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseType: UNAUTHORIZED
        StatusCode: '401'
        ResponseParameters:
          gatewayresponse.header.X-Content-Type-Options: "'nosniff'"
          gatewayresponse.header.X-XSS-Protection: "'1'"
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.X-Frame-Options: "'DENY'"
        ResponseTemplates:
          application/json: "{\"success\":false,\"message\":$context.error.messageString,\"errorCode\":\"INVALID_TOKEN\",\"statusCode\":401}"

