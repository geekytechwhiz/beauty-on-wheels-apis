version: 0.2
# Split pipeline: build uploads Lambda zips to DEPLOYMENT_BUCKET and emits packaged.yaml.
# Deploy must (1) use the artifact template at apps/task-service/packaged.yaml (see artifacts.files),
# (2) use the same AWS account and region as this build so S3 keys in the template resolve.
# Deploy CodeBuild: set TASK_DEPLOY_GUARD_ONLY=true to run only the S3 head-object guard (before CF deploy).
# Optional: PACKAGED_TEMPLATE (default apps/task-service/packaged.yaml, relative to CODEBUILD_SRC_DIR).

env:
  shell: bash
  parameter-store:
    NPM_TOKEN: /codebuild/github-packages-npm-token
  variables:
    STAGE: 'stg'
    DEPLOYMENT_BUCKET: 'stg-mvx-task-service-bucket'
    STACK_NAME: 'stg-task-service'
    NODE_OPTIONS: '--max-old-space-size=2048'

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "=== npm registry debug (pre-install) ==="
      - pwd
      - ls -la
      - ls -la .npmrc || echo "WARN no .npmrc in $(pwd)"
      - cat .npmrc || true
      - cat ~/.npmrc 2>/dev/null || echo "no ~/.npmrc"
      - npm config list
      - npm config get registry
      - npm config get @myvitalrx:registry || true
      - echo "NPM_TOKEN set=${NPM_TOKEN:+yes}"
      - echo "Installing dependencies..."
      - npm install --legacy-peer-deps
      - node -e "require('@myvitalrx/mvrx-resource-registry'); console.log('mvrx-resource-registry OK')"
      - npm ls @myvitalrx/mvrx-resource-registry

  pre_build:
    commands:
      - echo "Making scripts executable..."
      - chmod +x apps/task-service/ci/*.sh

  build:
    commands:
      - echo "Starting build..."
      - apps/task-service/ci/build.sh

  post_build:
    commands:
      - echo "Running deployment verification..."
      - apps/task-service/ci/verify-artifacts.sh

artifacts:
  files:
    - apps/task-service/packaged.yaml
    - apps/task-service/.serverless/**/*
  discard-paths: no