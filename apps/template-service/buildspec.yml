version: 0.2

env:
  variables:
    STAGE: 'dev'
    DEPLOYMENT_BUCKET: 'dev-mvx-template-service-bucket'
    # If deploy uses "${STACK_NAME}-serverless-stack", the CF stack is dev-template-service-serverless-stack.
    # ROLLBACK_COMPLETE (failed create): that stack cannot be updated — delete it, then redeploy:
    #   aws cloudformation delete-stack --stack-name dev-template-service-serverless-stack
    #   aws cloudformation wait stack-delete-complete --stack-name dev-template-service-serverless-stack
    STACK_NAME: 'dev-template-service'

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - corepack enable
      - corepack prepare pnpm@latest --activate
      - pnpm --version
      - pnpm install --frozen-lockfile

  build:
    commands:
      # CODEBUILD_SRC_DIR is the checkout root (set by CodeBuild). Some pipelines ship source without .git
      # (S3 zip / artifacts), so git commands must be skipped; Nx affected requires git refs.
      - |
        set -e
        REPO_ROOT="${CODEBUILD_SRC_DIR:-$(pwd)}"
        cd "$REPO_ROOT"
        echo "Repository root: $(pwd) (git: $([ -d .git ] && echo yes || echo no))"
        export SLS_DEBUG="*"
        export NODE_OPTIONS="${NODE_OPTIONS:-} --max-old-space-size=4096"
        echo "Node version: $(node --version)"
        echo "pnpm version: $(pnpm --version)"
        echo "npx serverless version:"
        npx serverless --version

        if [ -d .git ]; then
          echo "Fetching origin/dev for Nx affected..."
          git fetch --no-tags --depth=100 origin dev || true
          PROJECTS=$(npx nx show projects --affected --base=origin/dev --head=HEAD --sep=,)
          if [ -z "$PROJECTS" ]; then
            echo "No affected projects; using template scope for rule-checker."
            PROJECTS=$(npx nx show projects --projects=tag:scope:template --sep=,)
          fi
          echo "Projects: $PROJECTS"
          node scripts/rule-checker.js "$PROJECTS"
          echo "Running lint & test (affected)..."
          npx nx affected -t lint --base=origin/dev --head=HEAD
          npx nx affected -t test --base=origin/dev --head=HEAD
        else
          echo "No .git - skipping git fetch; using template-scoped projects (tag:scope:template)."
          PROJECTS=$(npx nx show projects --projects=tag:scope:template --sep=,)
          echo "Projects: $PROJECTS"
          node scripts/rule-checker.js "$PROJECTS"
          echo "Running lint & test (run-many, template scope)..."
          npx nx run-many -t lint --projects=tag:scope:template-service --parallel=3
          npx nx run-many -t test --projects=tag:scope:template-service --parallel=3
        fi

      # - cd apps/template-service
      # - echo "Packaging from $(pwd)"
      # - echo "Template service workspace files:"
      # - ls -la
      # - echo "Using workspace-installed Serverless and plugins from repo root node_modules"
      # - ls -la ../../node_modules/serverless
      # - ls -la ../../node_modules/serverless-auto-swagger
      # - rm -rf .serverless && npx serverless package --stage "$STAGE" --package .serverless
      - cd apps/template-service

# 🔥 Install plugin locally (critical for pnpm monorepo)
      # - pnpm add -D serverless-auto-swagger

      - export NODE_OPTIONS="--max-old-space-size=4096"
      - export SLS_DEBUG=*
      - export ESBUILD_BINARY_PATH=$(pwd)/node_modules/esbuild/bin/esbuild

      - rm -rf .serverless
      - npx serverless package --stage "$STAGE" --package .serverless
      
      - |
        if [ -f .serverless/cloudformation-template-update-stack.json ]; then
          TEMPLATE=".serverless/cloudformation-template-update-stack.json"
        elif [ -f .serverless/cloudformation-template-create-stack.json ]; then
          TEMPLATE=".serverless/cloudformation-template-create-stack.json"
        else
          echo "ERROR: No CloudFormation template found in .serverless"
          ls -la .serverless || true
          exit 1
        fi

      - |
        aws cloudformation package \
          --template-file "$TEMPLATE" \
          --s3-bucket "$DEPLOYMENT_BUCKET" \
          --output-template-file packaged.yaml \
          --force-upload

      - echo "S3Key entries in packaged.yaml:"
      - grep 'S3Key:' packaged.yaml | awk '{print $2}'

      - echo "Verifying each baked-in key exists:"
      - |
        grep 'S3Key:' packaged.yaml | awk '{print $2}' \
          | while read key; do
              printf " -> %-80s " "$key"
              if aws s3api head-object --bucket "$DEPLOYMENT_BUCKET" --key "$key" >/dev/null 2>&1; then
                echo "FOUND"
              else
                echo "MISSING!"
              fi
            done

      - echo "Pushing any missing function ZIPs into their exact S3Key paths..."
      - |
        grep 'S3Key:' packaged.yaml \
          | awk '{print $2}' \
          | while read key; do
              name=$(basename "$key")
              echo "Uploading .serverless/$name -> s3://$DEPLOYMENT_BUCKET/$key"
              aws s3 cp ".serverless/$name" "s3://$DEPLOYMENT_BUCKET/$key"
            done

      - echo "Verifying upload..."
      - aws s3 ls "s3://$DEPLOYMENT_BUCKET/$(dirname $(grep 'S3Key:' packaged.yaml | head -1 | awk '{print $2}'))/" --recursive

  post_build:
    commands:
      - echo "Build done, artifacts ready in packaged.yaml"

artifacts:
  files:
    - apps/template-service/packaged.yaml
  discard-paths: no

cache:
  paths:
    - node_modules/**/*