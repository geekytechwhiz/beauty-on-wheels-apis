version: 0.2
# DEV pipeline only — CodeBuild project must use THIS file for dev (STAGE=dev).
# Staging: stg-buildspec.yml | Production: prd-buildspec.yml
# GitHub Packages auth: see CODEBUILD-NPM.md

env:
  # NOTE: `compute-type` is NOT a valid field in a non-batch buildspec — AWS ignores it.
  # Compute type must be set on the CodeBuild PROJECT (console/CLI/IaC) or via
  # `--compute-type-override`. This project currently runs on SMALL (~3.6 GiB), so the
  # settings below are tuned to fit SMALL. To get more memory, change the project to
  # BUILD_GENERAL1_MEDIUM and you can then raise NODE_OPTIONS to ~6144.
  shell: bash
  parameter-store:
    NPM_TOKEN: /codebuild/github-packages-npm-token
  variables:
    STAGE: 'dev'
    DEPLOYMENT_BUCKET: 'dev-mvx-template-service-bucket'
    STACK_NAME: 'dev-template-service'
    # Cap Node heap well below the ~3.6 GiB container so the esbuild subprocess has
    # headroom. A 6144 cap on a 3.6 GiB box prevents GC and OOM-kills esbuild
    # ("Error: The service was stopped").
    NODE_OPTIONS: '--max-old-space-size=2048'

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "=== npm registry debug (pre-install) ==="
      - pwd
      - ls -la
      - ls -la .npmrc || echo "WARN no .npmrc in $(pwd)"
      - cat .npmrc || true
      - cat ~/.npmrc 2>/dev/null || echo "no ~/.npmrc"
      - npm config list
      - npm config get registry
      - npm config get @myvitalrx:registry || true
      - echo "NPM_TOKEN set=${NPM_TOKEN:+yes}"
      - echo "Installing dependencies..."
      - npm install --legacy-peer-deps

  pre_build:
    commands:
      - echo "Making scripts executable..."
      - chmod +x apps/template-service/ci/*.sh

  build:
    commands:
      - echo "Starting build..."
      - apps/template-service/ci/build.sh

  post_build:
    commands:
      - |
        if [ "${CODEBUILD_BUILD_SUCCEEDING:-1}" -ne 1 ]; then
          echo "Skipping artifact verification — build phase failed"
          exit 0
        fi
      - echo "Running deployment verification..."
      - apps/template-service/ci/verify-artifacts.sh

artifacts:
  files:
    - apps/template-service/packaged.yaml
    - apps/template-service/.serverless/**/*
  discard-paths: no
