version: 0.2

env:
  variables:
    STAGE: 'dev'
    DEPLOYMENT_BUCKET: 'dev-mvx-template-service-bucket'
    # If deploy uses "${STACK_NAME}-serverless-stack", the CF stack is dev-template-service-serverless-stack.
    # ROLLBACK_COMPLETE (failed create): that stack cannot be updated — delete it, then redeploy:
    #   aws cloudformation delete-stack --stack-name dev-template-service-serverless-stack
    #   aws cloudformation wait stack-delete-complete --stack-name dev-template-service-serverless-stack
    STACK_NAME: 'dev-template-service'

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - npm install -g serverless@3 --force
      - npm install --legacy-peer-deps

  build:
    commands:
      - echo "🔍 Detecting affected NX projects..."
      - PROJECTS=$(npx nx show projects --affected --base=origin/dev --head=HEAD --select=projects)
      - echo "Projects: $PROJECTS"

      # 🔥 Run rule checker
      - echo "🔍 Running Rule Checker..."
      - node scripts/rule-checker.js "$PROJECTS"

      # 🔥 Run lint & tests
      - echo "🧪 Running Lint & Tests..."
      - npm run lint || exit 1
      - npx nx affected:test --base=origin/dev --head=HEAD
      - cd apps/template-service
      - export NODE_OPTIONS="${NODE_OPTIONS:-} --max-old-space-size=4096"
      - rm -rf .serverless && npx serverless package --stage "$STAGE" --package .serverless

      # 2) select create vs update s3 keys
      - |
        if [ -f .serverless/cloudformation-template-update-stack.json ]; then
          TEMPLATE=".serverless/cloudformation-template-update-stack.json"
        elif [ -f .serverless/cloudformation-template-create-stack.json ]; then
          TEMPLATE=".serverless/cloudformation-template-create-stack.json"
        else
          echo "ERROR: No CloudFormation template found in .serverless"
          ls -la .serverless || true
          exit 1
        fi

      # 3) push code & rewrite 
      - |
        aws cloudformation package \
          --template-file "$TEMPLATE" \
          --s3-bucket "$DEPLOYMENT_BUCKET" \
          --output-template-file packaged.yaml \
          --force-upload

      # 4) debug: what keys did CF bake in?
      - echo "🔍 S3Key entries in packaged.yaml:"
      - grep 'S3Key:' packaged.yaml | awk '{print $2}'

      # 5) debug: do they exist?
      - echo "🔑 Verifying each baked-in key exists:"
      - |
        grep 'S3Key:' packaged.yaml | awk '{print $2}' \
          | while read key; do
              printf " → %-80s " "$key"
              if aws s3api head-object --bucket "$DEPLOYMENT_BUCKET" --key "$key" >/dev/null 2>&1; then
                echo "FOUND"
              else
                echo "MISSING!"
              fi
            done

      # 6) debug: list entire directory
      # - echo "📦 Full directory on S3:"
      # - aws s3 ls "s3://$DEPLOYMENT_BUCKET/serverless/payments-service/$STAGE/" --recursive

      - echo "➤ Pushing any missing function ZIPs into their exact S3Key paths…"
      - |
        grep 'S3Key:' packaged.yaml \
          | awk '{print $2}' \
          | while read key; do
              name=$(basename "$key")
              echo "Uploading .serverless/$name → s3://$DEPLOYMENT_BUCKET/$key"
              aws s3 cp ".serverless/$name" "s3://$DEPLOYMENT_BUCKET/$key"
            done

      - echo "➤ Verifying upload…"
      - aws s3 ls "s3://$DEPLOYMENT_BUCKET/$(dirname $(grep 'S3Key:' packaged.yaml | head -1 | awk '{print $2}'))/" --recursive

  post_build:
    commands:
      - echo "✅ Build done, artifacts ready in packaged.yaml"

artifacts:
  files:
    - apps/template-service/packaged.yaml
  discard-paths: no

cache:
  paths:
    - node_modules/**/*