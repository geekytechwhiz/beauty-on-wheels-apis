version: 0.2
# Split pipeline: build uploads Lambda zips to DEPLOYMENT_BUCKET and emits packaged.yaml.
# Deploy must use the artifact at apps/template-service/packaged.yaml (see artifacts.files).

env:
  # Default SMALL (3 GiB) OOMs on 22 individually-packaged Lambdas; MEDIUM gives headroom for esbuild.
  compute-type: BUILD_GENERAL1_MEDIUM
  shell: bash
  variables:
    STAGE: 'dev'
    DEPLOYMENT_BUCKET: 'dev-mvx-template-service-bucket'
    STACK_NAME: 'dev-template-service'
    # Match MEDIUM (7 GiB); do not set 8192 on SMALL containers.
    NODE_OPTIONS: '--max-old-space-size=6144'

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies..."
      - npm install --legacy-peer-deps

  pre_build:
    commands:
      - echo "Making scripts executable..."
      - chmod +x apps/template-service/ci/*.sh

  build:
    commands:
      - echo "Starting build..."
      - apps/template-service/ci/build.sh

  post_build:
    commands:
      - echo "Running deployment verification..."
      - apps/template-service/ci/verify-artifacts.sh

artifacts:
  files:
    - apps/template-service/packaged.yaml
    - apps/template-service/.serverless/**/*
  discard-paths: no 