# Naming for externally provisioned DynamoDB + in-stack EventBridge/SQS.
templateDynamoTableName: template-service-${self:provider.stage}
# Same buckets as provider.deploymentBucket (dev|stg|prd-mvx-template-service-bucket).
templateConfigBucketName: ${self:provider.stage}-mvx-template-service-bucket
templateConfigS3Prefix: template-configs
eventBusName: template-service-bus-${self:provider.stage}
templateEventsDlqName: template-events-dlq-${self:provider.stage}

# CORS: dev/stg allow all; prd reads allowed origin from SSM (fallback * until param is set).
corsOrigin:
  dev: '*'
  stg: '*'
  prd:  "*" #${ssm:/firminiq/prd/platform/cors-allowed-origin, '*'}

logLevel:
  dev: debug
  stg: info
  prd: warn

# Cross-service URL fallbacks (used when SSM params are not yet provisioned).
serviceUrlFallbacks:
  dev:
    USER_SERVICE_BASE_URL: ${ssm:/dev/user-service/USER_SERVICE_URL, 'https://e5gv0qum80.execute-api.us-east-1.amazonaws.com/dev'}
