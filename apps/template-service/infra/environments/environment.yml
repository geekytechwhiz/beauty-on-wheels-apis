# REGION is set explicitly; do not set AWS_REGION — Lambda reserves it and deploy will fail.
REGION: ${self:provider.region}

AWS_REGION_TEMPLATE_SERVICE: ${self:provider.region}
STAGE: ${self:provider.stage}
NODE_ENV: ${self:provider.stage}
SERVICE_NAME: ${self:service}
# Table must exist before deploy; name from custom.bundle.templateDynamoTableName.
TEMPLATE_TABLE: ${self:custom.bundle.templateDynamoTableName}
USER_TABLE: user-table-${self:provider.stage}
LOG_LEVEL: ${self:custom.bundle.logLevel.${self:provider.stage}, 'info'}
AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
ERROR_MESSAGES_CDN_URL: https://d2p9v61861q1ox.cloudfront.net
USER_SERVICE_BASE_URL: 'https://e5gv0qum80.execute-api.us-east-1.amazonaws.com/dev'
ORGANIZATION_SERVICE_BASE_URL: 'https://9qe3rgipg3.execute-api.us-east-1.amazonaws.com/dev'
METADATA_REGISTRY_SERVICE_BASE_URL: 'https://244vhkoib0.execute-api.us-east-1.amazonaws.com/dev'

# USER_SERVICE_BASE_URL: ${ssm:${self:custom.sharedSsmPaths.${self:provider.stage}.userServiceBaseUrl}, '${self:custom.bundle.serviceUrlFallbacks.${self:provider.stage}.USER_SERVICE_BASE_URL}'}
# ORGANIZATION_SERVICE_BASE_URL: ${ssm:${self:custom.sharedSsmPaths.${self:provider.stage}.organizationServiceBaseUrl}, '${self:custom.bundle.serviceUrlFallbacks.${self:provider.stage}.ORGANIZATION_SERVICE_BASE_URL}'}
# METADATA_REGISTRY_SERVICE_BASE_URL: ${ssm:${self:custom.sharedSsmPaths.${self:provider.stage}.metadataRegistryServiceBaseUrl}, '${self:custom.bundle.serviceUrlFallbacks.${self:provider.stage}.METADATA_REGISTRY_SERVICE_BASE_URL}'}
USER_SERVICE_TIMEOUT_MS: '8000'
ORGANIZATION_SERVICE_TIMEOUT_MS: '8000'
METADATA_REGISTRY_SERVICE_TIMEOUT_MS: '15000'
TEMPLATE_EVENT_BUS_NAME: ${self:custom.bundle.eventBusName}
# dev|stg|prd-mvx-template-service-bucket — same as deploymentBucket in serverless.yml
TEMPLATE_CONFIG_S3_BUCKET: ${self:custom.bundle.templateConfigBucketName}
TEMPLATE_CONFIG_S3_PREFIX: ${self:custom.bundle.templateConfigS3Prefix}
  