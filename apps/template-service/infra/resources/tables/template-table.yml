# DynamoDB (external to this stack)
#
# Application env: TEMPLATE_TABLE → custom.bundle.templateDynamoTableName (e.g. template-service-dev).
# Provisioning is owned by DevOps / another stack — same pattern as alert-service.
#
# Contract: single-table items use PK, SK, and entityType (see care-plan template OpenAPI / DB design docs).
#
# To define the table in CloudFormation instead, add under `Resources:`:
#   TemplateTable:
#     Type: AWS::DynamoDB::Table
#     Properties:
#       TableName: ${self:custom.bundle.templateDynamoTableName}
#       ...
