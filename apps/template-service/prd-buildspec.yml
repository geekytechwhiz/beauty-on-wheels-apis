version: 0.2
# PRODUCTION pipeline — CodeBuild project must use THIS file (not buildspec.yml).
# Build uploads Lambda zips to DEPLOYMENT_BUCKET and emits packaged.yaml for deploy.

env:
  shell: bash
  variables:
    STAGE: 'prd'
    DEPLOYMENT_BUCKET: 'prd-mvx-template-service-bucket'
    STACK_NAME: 'prd-template-service'
    NODE_OPTIONS: '--max-old-space-size=1536'

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies..."
      - npm install --legacy-peer-deps

  pre_build:
    commands:
      - echo "Making scripts executable..."
      - chmod +x apps/template-service/ci/*.sh

  build:
    commands:
      - echo "Starting build..."
      - apps/template-service/ci/build.sh

  post_build:
    commands:
      - echo "Running deployment verification..."
      - apps/template-service/ci/verify-artifacts.sh

artifacts:
  files:
    - apps/template-service/packaged.yaml
    - apps/template-service/.serverless/**/*
  discard-paths: no
