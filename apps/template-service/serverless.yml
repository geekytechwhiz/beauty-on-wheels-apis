service: template-service

# Serverless 3.40 JSON schema may lag new Lambda runtimes (e.g. nodejs22.x); AWS still accepts them.
configValidationMode: warn

frameworkVersion: '3.x'

plugins:
  - serverless-esbuild
  - serverless-auto-swagger
  - serverless-offline

provider:
  name: aws
  runtime: nodejs22.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  deploymentBucket:
    name: ${self:provider.stage}-mvx-template-service-bucket
    serverSideEncryption: AES256
  memorySize: 512
  timeout: 30

  tracing:
    lambda: true
    apiGateway: true

  logRetentionInDays: 14

  environment: ${file(./infra/environments/environment.yml)}

  tags:
    Service: ${self:service}
    Stage: ${self:provider.stage}
    ManagedBy: serverless

  iamRoleStatements:
    - ${file(./infra/permissions/dynamodb.yml)}
    - ${file(./infra/permissions/eventbridge.yml)}
    - ${file(./infra/permissions/xray.yml)}

package:
  individually: true
  patterns:
    - 'services-json/**'
    - '!**/*.test.ts'
    - '!**/*.spec.ts'

custom:
  bundle: ${file(./infra/config/infra-custom.yml)} 
  cors: &httpApiCors
    origin: ${self:custom.bundle.corsOrigin.${self:provider.stage}, '*'}
    headers:
      - Content-Type
      - X-Amz-Date
      - Authorization
      - X-Api-Key
      - X-Correlation-Id
      - X-Request-Id
      - X-Requested-With
      - Sec-Ch-Ua
      - Sec-Ch-Ua-Mobile
      - Sec-Ch-Ua-Platform

  # Disable sourcemaps for staging/prod to reduce memory in CI (avoids esbuild "The service was stopped: write EPIPE")
  sourcemapsByStage:
    dev: true
    stg: false
    prd: false

  esbuild:
    bundle: true
    minify: false
    sourcemap: ${self:custom.sourcemapsByStage.${self:provider.stage}, false}
    target: node22
    platform: node
    format: cjs
    tsconfig: ../../tsconfig.base.json
    external:
      - aws-sdk
    keepNames: true
    # Limit concurrent bundles to avoid OOM/EPIPE in CodeBuild (serverless-esbuild + esbuild docs)
    concurrency: 8
    zipConcurrency: 8
    # Resolve NX workspace dependencies (@api-hub/* packages)
    plugins: esbuild-plugins.js
    # Ensure proper module resolution
    resolveExtensions:
      - '.ts'
      - '.tsx'
      - '.js'
      - '.jsx'
      - '.mjs'
      - '.json'

  autoswagger:
    title: Template Service API
    description: Care plan template HTTP API. Swagger 2 merge file for serverless-auto-swagger.
    version: 1.0.0
    apiType: http
    basePath: /${self:provider.stage}
    schemes:
      - https
      - http
    host: ${self:custom.apiHost, ''}
    generateSwaggerOnDeploy: true
    swaggerFiles:
      - swagger.json
    useStage: true
    swaggerPath: swagger
    excludeStages:
      - production

  serverless-offline:
    httpPort: 3000
    noPrependStageInUrl: true

functions:
  health:
    handler: src/handlers/http/health.main
    events:
      - http:
          path: /health
          method: get
          cors: true

  createMasterTemplate:
    handler: src/handlers/http/createMasterTemplate.main
    events:
      - http:
          path: templates/master
          method: post
          summary: Create master template
          description: Create platform-owned master care plan template (META + VERSION#001).
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": Created — TemplateSummaryData
            "400": Bad request
            "401": Unauthorized
            "409": Conflict
            "422": Validation error
            "500": Server error

  listMasterTemplates:
    handler: src/handlers/http/listMasterTemplates.main
    events:
      - http:
          path: templates/master
          method: get
          summary: List master templates
          description: List master templates with optional filters (GSI2 published catalog or GSI5 by status).
          queryStringParameters:
            organizationId:
              required: false
              type: string
            category:
              required: false
              type: string
            condition:
              required: false
              type: string
            country:
              required: false
              type: string
            status:
              required: false
              type: string
            templateType:
              required: false
              type: string
            language:
              required: false
              type: string
            specialty:
              required: false
              type: string
            templateCode:
              required: false
              type: string
            nextToken:
              required: false
              type: string
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK — master template list
            "400": Bad request
            "401": Unauthorized
            "500": Server error

  listTemplateConfigs:
    handler: src/handlers/http/listTemplateConfigs.main
    events:
      - http:
          path: template-configs
          method: get
          summary: List or find UI template configs
          description: |
            List configs. Query configType=TEMPLATE|ORG and/or templateType=MONITORING.
            templateType returns the form JSON for that type (replaces legacy GET by type).
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0

  createTemplateConfig:
    handler: src/handlers/http/createTemplateConfig.main
    events:
      - http:
          path: template-configs
          method: post
          summary: Create UI template config
          description: Creates TEMPLATE (form) or ORG (drawer/enablement) config. Body requires configType.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0

  getTemplateConfig:
    handler: src/handlers/http/getTemplateConfig.main
    events:
      - http:
          path: template-configs/{configId}
          method: get
          summary: Get UI template config by id
          description: configId is document id (MONITORING-MASTER-001) or org key (ENABLE_SCOPE).
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0

  updateTemplateConfig:
    handler: src/handlers/http/updateTemplateConfig.main
    events:
      - http:
          path: template-configs/{configId}
          method: put
          summary: Update UI template config
          description: Updates existing config by configId. 404 if not found.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0

  getMasterTemplateVersions:
    handler: src/handlers/http/getMasterTemplateVersions.main
    events:
      - http:
          path: templates/master/{templateId}/versions
          method: get
          summary: Master template versions
          description: List VERSION rows, or read latest / point version via query `version`.
          queryStringParameters:
            version:
              required: false
              type: string
            resolve:
              required: false
              type: string
            nextToken:
              required: false
              type: string
            limit:
              required: false
              type: integer
            status:
              required: false
              type: string
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK — version list or single version
            "400": Bad request
            "401": Unauthorized
            "404": Not found
            "500": Server error

  updateMasterTemplateVersion:
    handler: src/handlers/http/updateMasterTemplateVersion.main
    events:
      - http:
          path: templates/master/{templateId}/versions/{versionId}
          method: put
          summary: Update master template version
          description: Editable only in DRAFT/SAVED/IN_REVIEW; writes new VERSION# row and updates META.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": Updated — TemplateSummaryData
            "400": Bad request
            "401": Unauthorized
            "404": Not found
            "409": Conflict
            "422": Validation error
            "500": Server error

  cloneOrgTemplate:
    handler: src/handlers/http/cloneOrgTemplate.main
    events:
      - http:
          path: templates/organizations/{organizationId}/{templateId}/versions/{versionId}/clone
          method: post
          summary: Clone published master template to org
          description: Creates ORG_TMPL partition with META + VERSION#001 in SAVED status.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "201": Created — TemplateSummaryData
            "400": Bad request
            "401": Unauthorized
            "404": Not found
            "409": Conflict
            "500": Server error

  getOrgTemplateVersions:
    handler: src/handlers/http/getOrgTemplateVersions.main
    events:
      - http:
          path: templates/organizations/{organizationId}/{templateId}/versions
          method: get
          summary: Org template versions
          description: List, meta, latest, or point read via query version (same as master).
          queryStringParameters:
            version:
              required: false
              type: string
            resolve:
              required: false
              type: string
            nextToken:
              required: false
              type: string
            limit:
              required: false
              type: integer
            status:
              required: false
              type: string
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK
            "401": Unauthorized
            "404": Not found
            "500": Server error

  listOrgTemplates:
    handler: src/handlers/http/listOrgTemplates.main
    events:
      - http:
          path: templates/org
          method: get
          summary: List organization templates
          description: Query GSI1 by organizationId (from query or JWT).
          queryStringParameters:
            organizationId:
              required: false
              type: string
            condition:
              required: false
              type: string
            status:
              required: false
              type: string
            templateType:
              required: false
              type: string
            specialty:
              required: false
              type: string
            nextToken:
              required: false
              type: string
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK — org template list
            "401": Unauthorized
            "500": Server error

  updateOrgTemplateVersion:
    handler: src/handlers/http/updateOrgTemplateVersion.main
    events:
      - http:
          path: templates/org/{templateId}/versions/{versionId}
          method: put
          summary: Update organization template version
          description: Editable in DRAFT/SAVED/IN_REVIEW; organizationId from JWT.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": Updated — TemplateSummaryData
            "400": Bad request
            "401": Unauthorized
            "404": Not found
            "409": Conflict
            "422": Validation error
            "500": Server error

  listCompatibleTemplates:
    handler: src/handlers/http/listCompatibleTemplates.main
    events:
      - http:
          path: templates/compatible
          method: get
          summary: List compatible published templates
          description: GSI2 published catalog filtered by condition, country, optional duration.
          queryStringParameters:
            condition:
              required: true
              type: string
            country:
              required: true
              type: string
            duration:
              required: false
              type: string
            templateType:
              required: false
              type: string
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK — compatible template list
            "400": Bad request
            "401": Unauthorized
            "500": Server error

  createOrgEnablement:
    handler: src/handlers/http/createOrgEnablement.main
    events:
      - http:
          path: org-enablements
          method: post
          summary: Create org enablement
          description: Link organization to a published master template version.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "201": Created — OrgEnablement
            "400": Bad request
            "401": Unauthorized
            "404": Not found
            "409": Conflict
            "500": Server error

  searchOrgEnablements:
    handler: src/handlers/http/searchOrgEnablements.main
    events:
      - http:
          path: org-enablements
          method: get
          summary: Search org enablements
          description: Query GSI1 by organizationId and/or GSI3 by masterTemplateVersionId.
          queryStringParameters:
            organizationId:
              required: false
              type: string
            masterTemplateVersionId:
              required: false
              type: string
            nextToken:
              required: false
              type: string
            limit:
              required: false
              type: integer
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK — OrgEnablement list
            "400": Bad request
            "401": Unauthorized
            "500": Server error

  listOrgEnablementsByOrg:
    handler: src/handlers/http/listOrgEnablementsByOrg.main
    events:
      - http:
          path: org-enablements/{orgId}
          method: get
          summary: List enablements for organization
          description: Query GSI1 PK=ORG#orgId with ENABLE# prefix on SK.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK — OrgEnablement list
            "401": Unauthorized
            "403": Forbidden
            "500": Server error

  getOrgEnablementById:
    handler: src/handlers/http/getOrgEnablementById.main
    events:
      - http:
          path: org-enablements/id/{enablementId}
          method: get
          summary: Get org enablement by id
          description: Point read ENABLE#id / META.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK — OrgEnablement
            "401": Unauthorized
            "404": Not found
            "500": Server error

  updateOrgEnablement:
    handler: src/handlers/http/updateOrgEnablement.main
    events:
      - http:
          path: org-enablements/id/{enablementId}
          method: patch
          summary: Update or revoke org enablement
          description: PATCH with action UPDATE (dates) or REVOKE (delete row, 204).
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK — OrgEnablement (UPDATE)
            "204": No content (REVOKE)
            "400": Bad request
            "401": Unauthorized
            "404": Not found
            "422": Validation error
            "500": Server error

  transitionTemplateStatus:
    handler: src/handlers/http/transitionTemplateStatus.main
    events:
      - http:
          path: templates/{templateId}/versions/{versionId}/status
          method: post
          summary: Transition template status
          description: Lifecycle actions SUBMIT_REVIEW, PUBLISH, REJECT, ARCHIVE, DEPRECATE (master or org — org when ORG_TMPL exists for JWT org).
          queryStringParameters:
            organizationId:
              required: false
              type: string
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK — TemplateSummaryData
            "400": Bad request
            "401": Unauthorized
            "404": Not found
            "409": Conflict
            "422": Validation error
            "500": Server error

resources:
  - ${file(./infra/resources/events/event-bus.yml)}
  - ${file(./infra/resources/events/dlq.yml)}
  - ${file(./infra/resources/outputs.yml)}
