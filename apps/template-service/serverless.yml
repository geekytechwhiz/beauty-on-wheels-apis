service: template-service

frameworkVersion: '3'

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-offline

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  # deploymentBucket:
  #   name: ${self:provider.stage}-mvx-template-service-bucket
  #   serverSideEncryption: AES256
  memorySize: 512
  timeout: 30

  tracing:
    lambda: true
    apiGateway: true

  logRetentionInDays: 14

  environment:
    REGION: ${self:provider.region}
    TEMPLATE_TABLE: template-table-${self:provider.stage}
    TEMPLATE_BUCKET:
      Ref: TemplateBucket
    ERROR_MESSAGES_CDN_URL: https://d2p9v61861q1ox.cloudfront.net
    LOG_LEVEL: ${self:custom.logLevel.${self:provider.stage}, 'info'}
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
    DEFAULT_REGION: ${self:provider.region}

  tags:
    Service: ${self:service}
    Stage: ${self:provider.stage}
    ManagedBy: serverless

  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:Query
        - dynamodb:BatchGetItem
        - dynamodb:BatchWriteItem
        - dynamodb:DescribeTable
      Resource:
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/template-table-${self:provider.stage}
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/template-table-${self:provider.stage}/index/*

    - Effect: Allow
      Action:
        - xray:PutTraceSegments
        - xray:PutTelemetryRecords
      Resource: '*'

    - Effect: Allow
      Action:
        - s3:GetObject
        - s3:PutObject
      Resource:
        - Fn::Join:
            - ''
            - - 'arn:aws:s3:::'
              - Ref: TemplateBucket
              - '/*'

package:
  individually: true
  patterns:
    - '!**/*.test.ts'
    - '!**/*.spec.ts'

custom:
  logLevel:
    dev: debug
    stg: info
    prd: warn
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node18
    platform: node
    format: cjs
    tsconfig: ../../tsconfig.base.json
    external:
      - aws-sdk
    keepNames: true
    plugins: esbuild-plugins.js
    resolveExtensions:
      - '.ts'
      - '.tsx'
      - '.js'
      - '.jsx'
      - '.json'
    loader:
      '.json': 'json'

functions:
  health:
    handler: src/handlers/health.main
    events:
      - http:
          path: /health
          method: get
          cors: true

  createTemplate:
    handler: src/handlers/createTemplate.main
    events:
      - http:
          path: templates
          method: post
          cors: true
          # authorizer:
          #   name: common_authorizer
          #   type: token
          #   identitySource: method.request.header.Authorization
          #   arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
          #   resultTtlInSeconds: 0

  getTemplate:
    handler: src/handlers/getTemplate.main
    events:
      - http:
          path: templates/{id}
          method: get
          cors: true
          # authorizer:
          #   name: common_authorizer
          #   type: token
          #   identitySource: method.request.header.Authorization
          #   arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
          #   resultTtlInSeconds: 0

  updateTemplate:
    handler: src/handlers/updateTemplate.main
    events:
      - http:
          path: templates/{id}
          method: put
          cors: true
          # authorizer:
          #   name: common_authorizer
          #   type: token
          #   identitySource: method.request.header.Authorization
          #   arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
          #   resultTtlInSeconds: 0

  executeTemplate:
    handler: src/handlers/executeTemplate.main
    events:
      - http:
          path: templates/{id}/execute
          method: post
          cors: true
          # authorizer:
          #   name: common_authorizer
          #   type: token
          #   identitySource: method.request.header.Authorization
          #   arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
          #   resultTtlInSeconds: 0

resources:
  Resources:
    TemplateBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256

    TemplateTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: template-table-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
          - AttributeName: gsi1pk
            AttributeType: S
          - AttributeName: gsi1sk
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: gsi1pk
                KeyType: HASH
              - AttributeName: gsi1sk
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
