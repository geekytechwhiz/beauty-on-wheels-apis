service: template-service

# Serverless 3.40 JSON schema may lag new Lambda runtimes (e.g. nodejs22.x); AWS still accepts them.
configValidationMode: warn

frameworkVersion: '3.x'

plugins:
  - serverless-esbuild
  - serverless-auto-swagger
  - '@myvitalrx/mvrx-resource-registry'
  # serverless-offline is only loaded via serverless.offline.yml for local dev (not CI package/deploy)

provider:
  name: aws
  runtime: ${param:lambdaRuntime, 'nodejs22.x'}
  versionFunctions: false
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  deploymentBucket:
    name: ${self:provider.stage}-mvx-template-service-bucket
    serverSideEncryption: AES256
  memorySize: 512
  timeout: 30

  tracing:
    lambda: true
    apiGateway: true

  logRetentionInDays: 14

  environment: ${file(./infra/environments/environment.yml)}

  tags:
    Service: ${self:service}
    Stage: ${self:provider.stage}
    ManagedBy: serverless

  iamRoleStatements:
    - ${file(./infra/permissions/dynamodb.yml)}
    - ${file(./infra/permissions/eventbridge.yml)}
    - ${file(./infra/permissions/s3.yml)}
    - ${file(./infra/permissions/xray.yml)}

package:
  individually: true
  patterns:
    - '!**/*.test.ts'
    - '!**/*.spec.ts'

custom:
  resourceRegistry:
    enabled: true
    platformOwner: platform-config
    parameters:
      NODEJS_RUNTIME:
        value: nodejs22.x
      DEFAULT_AWS_REGION:
        value: ${self:provider.region}
    include:
      - AWS::DynamoDB::Table
      - AWS::Events::EventBus
      - AWS::SQS::Queue
      - AWS::SNS::Topic
     

  bundle: ${file(./infra/config/infra-custom.yml)} 
  cors: &httpApiCors
    origin: ${self:custom.bundle.corsOrigin.${self:provider.stage}, '*'}
    headers:
      - Content-Type
      - X-Amz-Date
      - Authorization
      - X-Api-Key
      - X-Correlation-Id
      - X-Request-Id
      - X-Requested-With
      - Sec-Ch-Ua
      - Sec-Ch-Ua-Mobile
      - Sec-Ch-Ua-Platform

  # Disable sourcemaps everywhere in CI to reduce memory (avoids esbuild "The service was stopped: write EPIPE").
  # dev is the stage CodeBuild packages with, so it must stay false to keep the pipeline within container memory.
  sourcemapsByStage:
    dev: false
    stg: false
    prd: false
  keepNamesByStage:
    dev: false
    stg: false
    prd: false

  esbuild:
    bundle: true
    # Minify is esbuild's most memory-hungry pass and is unnecessary for Lambda. On the
    # SMALL (~3.6 GiB) CodeBuild container it pushes the esbuild subprocess over the limit
    # and the kernel kills it ("Error: The service was stopped"). Disabling it is the
    # single biggest peak-memory reduction for the 22 individually-packaged functions.
    minify: false
    sourcemap: ${self:custom.sourcemapsByStage.${self:provider.stage}, false}
    target: node22
    platform: node
    format: cjs
    tsconfig: ../../tsconfig.base.json
    external:
      - aws-sdk
    # keepNames off in CI stages — lowers esbuild peak memory on SMALL CodeBuild (~3.6 GiB).
    keepNames: ${self:custom.keepNamesByStage.${self:provider.stage}, true}
    # Avoid esbuild context reuse across ~24 functions — prevents memory growth/OOM on SMALL CodeBuild.
    skipRebuild: true
    disposeContext: true
    # Serialize bundling/zipping. With package.individually + 24 functions, parallel esbuild
    # service instances exhaust the CodeBuild container and crash with "The service was stopped".
    concurrency: 1
    zipConcurrency: 1
    # Resolve NX workspace dependencies (@api-hub/* packages)
    plugins: esbuild-plugins.js
    # Ensure proper module resolution
    resolveExtensions:
      - '.ts'
      - '.tsx'
      - '.js'
      - '.jsx'
      - '.mjs'
      - '.json'

  autoswagger:
    title: Template Service API
    apiType: http
    basePath: /${self:provider.stage}
    schemes:
      - https
      - http
    host: ${self:custom.apiHost, ''}
    generateSwaggerOnDeploy: true
    swaggerFiles:
      - swagger.json
    useStage: true
    swaggerPath: swagger
    # CI package stages skip swagger generation to reduce build time/memory in CodeBuild.
    excludeStages:
      - production
      - dev
      - stg
      - prd

  serverless-offline:
    httpPort: 3000
    noPrependStageInUrl: true

functions:
  health:
    handler: src/handlers/http/health.main
    events:
      - http:
          path: /health
          method: get
          cors: true

  upsertMasterTemplate:
    handler: src/handlers/http/upsertMasterTemplate.main
    events:
      - http:
          path: templates
          method: post
          summary: Create master template
          description: |
            Create master template (no templateId in path). Same body for POST /templates/{templateId} to update or run lifecycleAction.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            default: Default response
            "201": Created — TemplateSummaryData
            "400": Bad request
            "401": Unauthorized
            "403": Forbidden
            "409": Conflict
            "500": Server error
      - http:
          path: templates/{templateId}
          method: post
          summary: Update master template (canonical)
          description: |
            Update master content or lifecycle (PUBLISH, SUBMIT_REVIEW, …). templateId in path (e.g. TASK-CODE from create).
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0

  listTemplates:
    handler: src/handlers/http/listTemplates.main
    events:
      - http:
          path: templates
          method: get
          summary: List templates (canonical)
          description: |
            List templates. Query templateLevel=MASTER|ORG|ORG_DERIVED (default MASTER).
            ORG lists canonical org enablement catalog; ORG_DERIVED lists org-derived variants (requires organizationId).
          queryStringParameters:
            templateLevel:
              required: false
              type: string
            organizationId:
              required: false
              type: string
            category:
              required: false
              type: string
            condition:
              required: false
              type: string
            country:
              required: false
              type: string
            status:
              required: false
              type: string
            templateType:
              required: false
              type: string
            language:
              required: false
              type: string
            specialty:
              required: false
              type: string
            templateCode:
              required: false
              type: string
            nextPaginationKey:
              required: false
              type: string
            nextToken:
              required: false
              type: string
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0

  listTemplateConfigs:
    handler: src/handlers/http/listTemplateConfigs.main
    events:
      - http:
          path: template-configs
          method: get
          summary: List or find UI template configs
          description: |
            List configs. Query configType=TEMPLATE|ORG and/or templateType=MONITORING.
            templateType returns the form JSON for that type (replaces legacy GET by type).
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0

  createTemplateConfig:
    handler: src/handlers/http/createTemplateConfig.main
    events:
      - http:
          path: template-configs
          method: post
          summary: Create UI template config
          description: Creates TEMPLATE (form) or ORG (drawer/enablement) config. Body requires configType.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0

  postTemplateConfigMeta:
    handler: src/handlers/http/postTemplateConfigMeta.main
    events:
      - http:
          path: template-configs/meta
          method: post
          summary: Template config metadata (dropdown options)
          description: |
            Proxies metadata-registry POST `/metadata/values/by-types` and returns UI-friendly
            dropdown options for template-config forms. Body requires `metadataTypeCodes` array
            (e.g. Country, Language, Conditions, SPECIALITY).
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0

  getTemplateConfig:
    handler: src/handlers/http/getTemplateConfig.main
    events:
      - http:
          path: template-configs/{configId}
          method: get
          summary: Get UI template config by id
          description: configId is document id (MONITORING-MASTER-001) or org key (ENABLE_SCOPE).
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0

  updateTemplateConfig:
    handler: src/handlers/http/updateTemplateConfig.main
    events:
      - http:
          path: template-configs/{configId}
          method: put
          summary: Update UI template config
          description: Updates existing config by configId. 404 if not found.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0

  getOrgVersionStatus:
    handler: src/handlers/http/getOrgVersionStatus.main
    events:
      - http:
          path: templates/org-version-status
          method: get
          summary: Org template version status for one master (canonical)
          description: |
            Returns current org version, derived-from master version, latest published master,
            upgrade availability, and local changes for the versioning table UI.
            Requires organizationId (ROOT) and master templateId query params.
          queryStringParameters:
            organizationId:
              required: false
              type: string
            templateId:
              required: true
              type: string
            organizationName:
              required: false
              type: string
            organizationDescription:
              required: false
              type: string
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0

  deriveTemplate:
    handler: src/handlers/http/deriveTemplate.main
    events:
      - http:
          path: templates/derive
          method: post
          summary: Enable org template from published master (canonical)
          description: |
            Copy the latest PUBLISHED master (from JSON body) into the org partition and create enablement.
            Requires organizationMeta, categoryCode, conditionCode, templateType, and templateId in the body.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0

  updateOrgTemplateEnable:
    handler: src/handlers/http/updateOrgTemplateEnable.main
    events:
      - http:
          path: templates/derive
          method: put
          summary: Enable or disable org template subscription
          description: |
            Updates enablement for an existing org + master templateId.
            Set templateEnabled false to disable (sets effectiveTo); true to re-enable.
            Requires organizationMeta.id or organizationId and master templateId.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0

  getOrgTemplateRules:
    handler: src/handlers/http/getOrgTemplateRules.main
    events:
      - http:
          path: templates/org/{templateId}/{orgId}
          method: get
          summary: Get org template rules
          description: Org template content (fieldValues and document fields) plus full field rules for an enabled org copy.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0

  updateOrgTemplateRules:
    handler: src/handlers/http/updateOrgTemplateRules.main
    events:
      - http:
          path: templates/org/{templateId}/{orgId}
          method: put
          summary: Update org template rules
          description: Partial merge of field rules on the enabled org copy; bumps minor version.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0

  createOrgDerived:
    handler: src/handlers/http/createOrgDerived.main
    events:
      - http:
          path: templates/org-derived
          method: post
          summary: Create org-derived template variant from canonical org template
          description: |
            Copy the canonical org template (from POST /templates/derive) to a new variant orgTemplateId.
            sourceOrgTemplateId must be the canonical id, not another variant.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0

  updateOrgDerived:
    handler: src/handlers/http/updateOrgDerived.main
    events:
      - http:
          path: templates/org-derived/{orgTemplateId}
          method: put
          summary: Update org-derived template variant
          description: |
            Partial rules or fieldValues update (version bump) and/or templateEnabled toggle (no version bump).
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0

  adoptOrgDerived:
    handler: src/handlers/http/adoptOrgDerived.main
    events:
      - http:
          path: templates/org-derived/{orgTemplateId}/adopt
          method: post
          summary: Adopt canonical org template upgrade into variant
          description: |
            Applies canonical org template changes to a variant after upgrade review.
            Requires variant in editable status and upgrade available.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0

resources:
  - ${file(./infra/resources/gateway-responses.yml)}
  - ${file(./infra/resources/events/event-bus.yml)}
  - ${file(./infra/resources/events/dlq.yml)}
  - ${file(./infra/resources/outputs.yml)}
