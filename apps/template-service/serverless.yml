service: template-service

configValidationMode: warn

frameworkVersion: '3.x'
plugins: ${file(../../infra/serverless/plugins.yml)}
package: ${file(../../infra/serverless/package.yml)}

provider:
  name: aws
  runtime: nodejs22.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  versionFunctions: false

  deploymentBucket:
    name: ${self:provider.stage}-mvx-template-service-bucket
    serverSideEncryption: AES256
  memorySize: 512
  timeout: 30

  tracing:
    lambda: true
    apiGateway: true

  logRetentionInDays: ${self:custom.logRetentionByStage.${self:provider.stage}, '14'}

  environment: ${file(./infra/environments/environment.yml)}

  tags:
    Service: ${self:service}
    Stage: ${self:provider.stage}
    ManagedBy: serverless

  iamRoleStatements:
    - ${file(./infra/permissions/dynamodb.yml)}
    - ${file(./infra/permissions/eventbridge.yml)}
    - ${file(./infra/permissions/s3.yml)}
    - ${file(../../infra/serverless/permissions/ssm-read.yml)}
    - ${file(../../infra/serverless/permissions/xray.yml)}

custom:
  sharedSsmPaths: ${file(../../infra/serverless/config/shared-ssm-paths.yml)}
  logRetentionByStage: ${file(../../infra/serverless/config/log-retention-by-stage.yml)}
  bundle: ${file(./infra/config/infra-custom.yml)}
  apiTitle: Template Service API

  dlqAlarm:
    alarmName: ${self:provider.stage}-${self:service}-events-dlq-depth
    queueName: ${self:custom.bundle.templateEventsDlqName}

  resourceRegistry:
    enabled: true
    platformOwner: template-service
    parameters:
      TEMPLATE_TABLE:
        value: ${self:custom.bundle.templateDynamoTableName}
      LAMBDA_LOG_RETENTION_DAYS:
        value: 5
    include:
      - AWS::DynamoDB::Table
      - AWS::Events::EventBus
      - AWS::SQS::Queue
      - AWS::SNS::Topic

  # REST API secured routes: YAML anchors (Serverless requires real objects on http events).
  cors: &httpApiCors
    origin: ${self:custom.bundle.corsOrigin.${self:provider.stage}, '*'}
    headers:
      - Content-Type
      - X-Amz-Date
      - Authorization
      - X-Api-Key
      - X-Correlation-Id
      - X-Request-Id
      - X-Requested-With
      - Sec-Ch-Ua
      - Sec-Ch-Ua-Mobile
      - Sec-Ch-Ua-Platform

  securedAuthorizer: &securedAuthorizer
    name: common_authorizer
    type: token
    identitySource: method.request.header.Authorization
    arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
    resultTtlInSeconds: 0

  securedResponses: &securedResponses
    default: Default response
    "400": Bad request
    "401": Unauthorized
    "403": Forbidden
    "500": Server error

  sourcemapsByStage: ${file(../../infra/serverless/config/sourcemaps-by-stage.yml)}
  keepNamesByStage: ${file(../../infra/serverless/config/keep-names-by-stage.yml)}
  esbuild: ${file(../../infra/serverless/config/esbuild.yml)}
  autoswagger: ${file(../../infra/serverless/config/autoswagger-base.yml)}
  serverless-offline: ${file(../../infra/serverless/config/serverless-offline.yml)}

functions:
  health:
    handler: src/handlers/http/health.main
    events:
      - http:
          path: /health
          method: get
          cors: true

  upsertMasterTemplate:
    handler: src/handlers/http/upsertMasterTemplate.main
    events:
      - http:
          path: templates
          method: post
          summary: Create master template
          description: |
            Create master template (no templateId in path). Same body for POST /templates/{templateId} to update or run lifecycleAction.
            For org care plan variants use templateLevel=ORG_CARE_PLAN with orgDerivedTemplateId in the body.
          cors: *httpApiCors
          authorizer: *securedAuthorizer
          responses: *securedResponses
      - http:
          path: templates/{templateId}
          method: post
          summary: Update master template (canonical)
          description: |
            Update master content or lifecycle (PUBLISH, SUBMIT_REVIEW, …). templateId in path (e.g. TASK-CODE from create).
            For org care plan variants use PUT or POST with templateLevel=ORG_CARE_PLAN and organizationId query param.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
      - http:
          path: templates/{templateId}
          method: put
          summary: Update org care plan variant (ORG_CARE_PLAN)
          description: |
            Update org care plan variant when templateLevel=ORG_CARE_PLAN and organizationId are set as query params.
          cors: *httpApiCors
          authorizer: *securedAuthorizer
          responses: *securedResponses

  listTemplates:
    handler: src/handlers/http/listTemplates.main
    events:
      - http:
          path: templates
          method: get
          summary: List templates (canonical)
          description: |
            List templates. Query templateLevel=MASTER|ORG|ORG_DERIVED|ORG_CARE_PLAN (default MASTER).
            ORG lists canonical org enablement catalog; ORG_DERIVED and ORG_CARE_PLAN list org-derived variants (requires organizationId).
          queryStringParameters:
            templateLevel:
              required: false
              type: string
            organizationId:
              required: false
              type: string
            category:
              required: false
              type: string
            condition:
              required: false
              type: string
            country:
              required: false
              type: string
            status:
              required: false
              type: string
            templateType:
              required: false
              type: string
            language:
              required: false
              type: string
            specialty:
              required: false
              type: string
            templateCode:
              required: false
              type: string
            nextPaginationKey:
              required: false
              type: string
            nextToken:
              required: false
              type: string
          cors: *httpApiCors
          authorizer: *securedAuthorizer
          responses: *securedResponses

  listTemplateConfigs:
    handler: src/handlers/http/listTemplateConfigs.main
    events:
      - http:
          path: template-configs
          method: get
          summary: List or find UI template configs
          description: |
            List configs. Query configType=TEMPLATE|ORG and/or templateType=MONITORING.
            templateType returns the form JSON for that type (replaces legacy GET by type).
          cors: *httpApiCors
          authorizer: *securedAuthorizer
          responses: *securedResponses

  createTemplateConfig:
    handler: src/handlers/http/createTemplateConfig.main
    events:
      - http:
          path: template-configs
          method: post
          summary: Create UI template config
          description: Creates TEMPLATE (form) or ORG (drawer/enablement) config. Body requires configType.
          cors: *httpApiCors
          authorizer: *securedAuthorizer
          responses: *securedResponses

  postTemplateConfigMeta:
    handler: src/handlers/http/postTemplateConfigMeta.main
    events:
      - http:
          path: template-configs/meta
          method: post
          summary: Template config metadata (dropdown options)
          description: |
            Proxies metadata-registry POST `/metadata/values/by-types` and returns UI-friendly
            dropdown options for template-config forms. Body requires `metadataTypeCodes` array
            (e.g. Country, Language, Conditions, SPECIALITY).
          cors: *httpApiCors
          authorizer: *securedAuthorizer
          responses: *securedResponses

  getTemplateConfig:
    handler: src/handlers/http/getTemplateConfig.main
    events:
      - http:
          path: template-configs/{configId}
          method: get
          summary: Get UI template config by id
          description: configId is document id (MONITORING-MASTER-001) or org key (ENABLE_SCOPE).
          cors: *httpApiCors
          authorizer: *securedAuthorizer
          responses: *securedResponses

  updateTemplateConfig:
    handler: src/handlers/http/updateTemplateConfig.main
    events:
      - http:
          path: template-configs/{configId}
          method: put
          summary: Update UI template config
          description: Updates existing config by configId. 404 if not found.
          cors: *httpApiCors
          authorizer: *securedAuthorizer
          responses: *securedResponses

  getOrgVersionStatus:
    handler: src/handlers/http/getOrgVersionStatus.main
    events:
      - http:
          path: templates/org-version-status
          method: get
          summary: Org template version status for one master (canonical)
          description: |
            Returns current org version, derived-from master version, latest published master,
            upgrade availability, and local changes for the versioning table UI.
            Requires organizationId (ROOT) and master templateId query params.
          queryStringParameters:
            organizationId:
              required: false
              type: string
            templateId:
              required: true
              type: string
            organizationName:
              required: false
              type: string
            organizationDescription:
              required: false
              type: string
          cors: *httpApiCors
          authorizer: *securedAuthorizer
          responses: *securedResponses

  deriveTemplate:
    handler: src/handlers/http/deriveTemplate.main
    events:
      - http:
          path: templates/derive
          method: post
          summary: Enable org template from published master (canonical)
          description: |
            Copy the latest PUBLISHED master (from JSON body) into the org partition and create enablement.
            Requires organizationMeta, categoryCode, conditionCode, templateType, and templateId in the body.
          cors: *httpApiCors
          authorizer: *securedAuthorizer
          responses: *securedResponses

  updateOrgTemplateEnable:
    handler: src/handlers/http/updateOrgTemplateEnable.main
    events:
      - http:
          path: templates/derive
          method: put
          summary: Enable or disable org template subscription
          description: |
            Updates enablement for an existing org + master templateId.
            Set templateEnabled false to disable (sets effectiveTo); true to re-enable.
            Requires organizationMeta.id or organizationId and master templateId.
          cors: *httpApiCors
          authorizer: *securedAuthorizer
          responses: *securedResponses

  getOrgTemplateRules:
    handler: src/handlers/http/getOrgTemplateRules.main
    events:
      - http:
          path: templates/org/{templateId}/{orgId}
          method: get
          summary: Get org template rules
          description: Org template content (fieldValues and document fields) plus full field rules for an enabled org copy.
          cors: *httpApiCors
          authorizer: *securedAuthorizer
          responses: *securedResponses

  updateOrgTemplateRules:
    handler: src/handlers/http/updateOrgTemplateRules.main
    events:
      - http:
          path: templates/org/{templateId}/{orgId}
          method: put
          summary: Update canonical org template rules, fieldValues, status, and active
          description: |
            Partial merge of rules and fieldValues on the enabled canonical org copy; bumps minor version on content changes.
            Optional status (DRAFT, PUBLISHED, or PUBLISH alias) and active flag without a version bump when sent alone.
          cors: *httpApiCors
          authorizer: *securedAuthorizer
          responses: *securedResponses

  createOrgDerived:
    handler: src/handlers/http/createOrgDerived.main
    events:
      - http:
          path: templates/org-derived
          method: post
          summary: Create org-derived template variant from canonical org template
          description: |
            Copy the canonical org template (from POST /templates/derive) to a new variant orgTemplateId.
            sourceOrgTemplateId must be the canonical id, not another variant.
          cors: *httpApiCors
          authorizer: *securedAuthorizer
          responses: *securedResponses

  updateOrgDerived:
    handler: src/handlers/http/updateOrgDerived.main
    events:
      - http:
          path: templates/org-derived/{orgTemplateId}
          method: put
          summary: Update org-derived template variant
          description: |
            Partial rules or fieldValues update (version bump) and/or templateEnabled toggle (no version bump).
          cors: *httpApiCors
          authorizer: *securedAuthorizer
          responses: *securedResponses

  adoptOrgDerived:
    handler: src/handlers/http/adoptOrgDerived.main
    events:
      - http:
          path: templates/org-derived/{orgTemplateId}/adopt
          method: post
          summary: Adopt canonical org template upgrade into variant
          description: |
            Applies canonical org template changes to a variant after upgrade review.
            Requires variant in editable status and upgrade available.
          cors: *httpApiCors
          authorizer: *securedAuthorizer
          responses: *securedResponses

resources:
  - ${file(./infra/resources/gateway-responses.yml)}
  - ${file(./infra/resources/events/event-bus.yml)}
  - ${file(./infra/resources/events/dlq.yml)}
  - ${file(../../infra/serverless/resources/alarms/dlq-depth.yml)}
  - ${file(./infra/resources/outputs.yml)}
