service: template-service

# Serverless 3.40 JSON schema may lag new Lambda runtimes (e.g. nodejs22.x); AWS still accepts them.
configValidationMode: warn

frameworkVersion: '3.x'

plugins:
  - serverless-esbuild
  - serverless-auto-swagger
  - serverless-offline

provider:
  name: aws
  runtime: nodejs22.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  deploymentBucket:
    name: ${self:provider.stage}-mvx-template-service-bucket
    serverSideEncryption: AES256
  memorySize: 512
  timeout: 30

  tracing:
    lambda: true
    apiGateway: true

  logRetentionInDays: 14

  environment: ${file(./infra/environments/environment.yml)}

  tags:
    Service: ${self:service}
    Stage: ${self:provider.stage}
    ManagedBy: serverless

  iamRoleStatements:
    - ${file(./infra/permissions/dynamodb.yml)}
    - ${file(./infra/permissions/eventbridge.yml)}
    - ${file(./infra/permissions/xray.yml)}

package:
  individually: true
  patterns:
    - '!**/*.test.ts'
    - '!**/*.spec.ts'

custom:
  bundle: ${file(./infra/config/infra-custom.yml)} 
  cors: &httpApiCors
    origin: ${self:custom.bundle.corsOrigin.${self:provider.stage}, '*'}
    headers:
      - Content-Type
      - X-Amz-Date
      - Authorization
      - X-Api-Key
      - X-Correlation-Id
      - X-Request-Id
      - X-Requested-With
      - Sec-Ch-Ua
      - Sec-Ch-Ua-Mobile
      - Sec-Ch-Ua-Platform

  # Disable sourcemaps for staging/prod to reduce memory in CI (avoids esbuild "The service was stopped: write EPIPE")
  sourcemapsByStage:
    dev: true
    stg: false
    prd: false

  esbuild:
    bundle: true
    minify: false
    sourcemap: ${self:custom.sourcemapsByStage.${self:provider.stage}, false}
    target: node22
    platform: node
    format: cjs
    tsconfig: ../../tsconfig.base.json
    external:
      - aws-sdk
    keepNames: true
    # Limit concurrent bundles to avoid OOM/EPIPE in CodeBuild (serverless-esbuild + esbuild docs)
    concurrency: 8
    zipConcurrency: 8
    # Resolve NX workspace dependencies (@api-hub/* packages)
    plugins: esbuild-plugins.js
    # Ensure proper module resolution
    resolveExtensions:
      - '.ts'
      - '.tsx'
      - '.js'
      - '.jsx'
      - '.mjs'
      - '.json'

  autoswagger:
    title: Template Service API
    description: Care plan template HTTP API. Swagger 2 merge file for serverless-auto-swagger.
    version: 1.0.0
    apiType: http
    basePath: /${self:provider.stage}
    schemes:
      - https
      - http
    host: ${self:custom.apiHost, ''}
    generateSwaggerOnDeploy: true
    swaggerFiles:
      - swagger.json
    useStage: true
    swaggerPath: swagger
    excludeStages:
      - production

  serverless-offline:
    httpPort: 3000
    noPrependStageInUrl: true

functions:
  health:
    handler: src/handlers/health.main
    events:
      - http:
          path: /health
          method: get
          cors: true

  createMasterTemplate:
    handler: src/handlers/http/createMasterTemplate.main
    events:
      - http:
          path: templates/master
          method: post
          summary: Create master template
          description: Create platform-owned master care plan template (META + VERSION#001).
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": Created — TemplateSummaryData
            "400": Bad request
            "401": Unauthorized
            "409": Conflict
            "422": Validation error
            "500": Server error

  listMasterTemplates:
    handler: src/handlers/http/listMasterTemplates.main
    events:
      - http:
          path: templates/master
          method: get
          summary: List master templates
          description: List master templates with optional filters (GSI2 published catalog or GSI5 by status).
          queryStringParameters:
            organizationId:
              required: false
              type: string
            category:
              required: false
              type: string
            condition:
              required: false
              type: string
            country:
              required: false
              type: string
            status:
              required: false
              type: string
            templateType:
              required: false
              type: string
            language:
              required: false
              type: string
            specialty:
              required: false
              type: string
            templateCode:
              required: false
              type: string
            nextToken:
              required: false
              type: string
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK — master template list
            "400": Bad request
            "401": Unauthorized
            "500": Server error

resources:
  - ${file(./infra/resources/events/event-bus.yml)}
  - ${file(./infra/resources/events/dlq.yml)}
  - ${file(./infra/resources/outputs.yml)}
