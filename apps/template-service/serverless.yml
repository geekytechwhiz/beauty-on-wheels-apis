service: template-service

# Serverless 3.40 JSON schema may lag new Lambda runtimes (e.g. nodejs22.x); AWS still accepts them.
configValidationMode: warn

frameworkVersion: '3.x'

plugins:
  - serverless-esbuild
  - serverless-auto-swagger
  - serverless-offline

provider:
  name: aws
  runtime: nodejs22.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  deploymentBucket:
    name: ${self:provider.stage}-mvx-template-service-bucket
    serverSideEncryption: AES256
  memorySize: 512
  timeout: 30

  tracing:
    lambda: true
    apiGateway: true

  logRetentionInDays: 14

  environment: ${file(./infra/environments/environment.yml)}

  tags:
    Service: ${self:service}
    Stage: ${self:provider.stage}
    ManagedBy: serverless

  iamRoleStatements:
    - ${file(./infra/permissions/dynamodb.yml)}
    - ${file(./infra/permissions/eventbridge.yml)}
    - ${file(./infra/permissions/xray.yml)}

package:
  individually: true
  patterns:
    - 'services-json/**'
    - '!**/*.test.ts'
    - '!**/*.spec.ts'

custom:
  bundle: ${file(./infra/config/infra-custom.yml)} 
  cors: &httpApiCors
    origin: ${self:custom.bundle.corsOrigin.${self:provider.stage}, '*'}
    headers:
      - Content-Type
      - X-Amz-Date
      - Authorization
      - X-Api-Key
      - X-Correlation-Id
      - X-Request-Id
      - X-Requested-With
      - Sec-Ch-Ua
      - Sec-Ch-Ua-Mobile
      - Sec-Ch-Ua-Platform

  # Disable sourcemaps everywhere in CI to reduce memory (avoids esbuild "The service was stopped: write EPIPE").
  # dev is the stage CodeBuild packages with, so it must stay false to keep the pipeline within container memory.
  sourcemapsByStage:
    dev: false
    stg: false
    prd: false

  esbuild:
    bundle: true
    # Minify is esbuild's most memory-hungry pass and is unnecessary for Lambda. On the
    # SMALL (~3.6 GiB) CodeBuild container it pushes the esbuild subprocess over the limit
    # and the kernel kills it ("Error: The service was stopped"). Disabling it is the
    # single biggest peak-memory reduction for the 22 individually-packaged functions.
    minify: false
    sourcemap: ${self:custom.sourcemapsByStage.${self:provider.stage}, false}
    target: node22
    platform: node
    format: cjs
    tsconfig: ../../tsconfig.base.json
    external:
      - aws-sdk
    keepNames: true
    # Serialize bundling/zipping. With package.individually + 22 functions, parallel esbuild
    # service instances exhaust the CodeBuild container and crash with "The service was stopped".
    concurrency: 1
    zipConcurrency: 1
    # Resolve NX workspace dependencies (@api-hub/* packages)
    plugins: esbuild-plugins.js
    # Ensure proper module resolution
    resolveExtensions:
      - '.ts'
      - '.tsx'
      - '.js'
      - '.jsx'
      - '.mjs'
      - '.json'

  autoswagger:
    title: Template Service API
    apiType: http
    basePath: /${self:provider.stage}
    schemes:
      - https
      - http
    host: ${self:custom.apiHost, ''}
    generateSwaggerOnDeploy: true
    swaggerFiles:
      - swagger.json
    useStage: true
    swaggerPath: swagger
    # CI packages with STAGE=dev; skipping swagger here avoids extra work/memory during CodeBuild.
    excludeStages:
      - production
      - dev

  serverless-offline:
    httpPort: 3000
    noPrependStageInUrl: true

functions:
  health:
    handler: src/handlers/http/health.main
    events:
      - http:
          path: /health
          method: get
          cors: true

  upsertMasterTemplate:
    handler: src/handlers/http/upsertMasterTemplate.main
    events:
      - http:
          path: templates
          method: post
          summary: Create master template
          description: |
            Create master template (no templateId in path). Same body for POST /templates/{templateId} to update or run lifecycleAction.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "201": Created — TemplateSummaryData
            "400": Bad request
            "401": Unauthorized
            "409": Conflict
      - http:
          path: templates/{templateId}
          method: post
          summary: Update master template (canonical)
          description: |
            Update master content or lifecycle (PUBLISH, SUBMIT_REVIEW, …). templateId in path (e.g. TASK-CODE from create).
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
      - http:
          path: templates/master
          method: post
          summary: Create master template (legacy path)
          description: Legacy alias for POST /templates.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": Created — TemplateSummaryData
            "400": Bad request
            "401": Unauthorized
            "409": Conflict
            "422": Validation error
            "500": Server error

  listTemplates:
    handler: src/handlers/http/listTemplates.main
    events:
      - http:
          path: templates
          method: get
          summary: List templates (canonical)
          description: |
            List templates. Query templateLevel=MASTER|ORG (default MASTER). Org lists require organizationId or JWT org.
          queryStringParameters:
            templateLevel:
              required: false
              type: string
            organizationId:
              required: false
              type: string
            category:
              required: false
              type: string
            condition:
              required: false
              type: string
            country:
              required: false
              type: string
            status:
              required: false
              type: string
            templateType:
              required: false
              type: string
            language:
              required: false
              type: string
            specialty:
              required: false
              type: string
            templateCode:
              required: false
              type: string
            nextPaginationKey:
              required: false
              type: string
            nextToken:
              required: false
              type: string
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0

  listMasterTemplates:
    handler: src/handlers/http/listMasterTemplates.main
    events:
      - http:
          path: templates/master
          method: get
          summary: List master templates
          description: List master templates with optional filters (GSI2 published catalog or GSI5 by status).
          queryStringParameters:
            organizationId:
              required: false
              type: string
            category:
              required: false
              type: string
            condition:
              required: false
              type: string
            country:
              required: false
              type: string
            status:
              required: false
              type: string
            templateType:
              required: false
              type: string
            language:
              required: false
              type: string
            specialty:
              required: false
              type: string
            templateCode:
              required: false
              type: string
            nextPaginationKey:
              required: false
              type: string
            nextToken:
              required: false
              type: string
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK — master template list
            "400": Bad request
            "401": Unauthorized
            "500": Server error

  listTemplateConfigs:
    handler: src/handlers/http/listTemplateConfigs.main
    events:
      - http:
          path: template-configs
          method: get
          summary: List or find UI template configs
          description: |
            List configs. Query configType=TEMPLATE|ORG and/or templateType=MONITORING.
            templateType returns the form JSON for that type (replaces legacy GET by type).
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0

  createTemplateConfig:
    handler: src/handlers/http/createTemplateConfig.main
    events:
      - http:
          path: template-configs
          method: post
          summary: Create UI template config
          description: Creates TEMPLATE (form) or ORG (drawer/enablement) config. Body requires configType.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0

  getTemplateConfig:
    handler: src/handlers/http/getTemplateConfig.main
    events:
      - http:
          path: template-configs/{configId}
          method: get
          summary: Get UI template config by id
          description: configId is document id (MONITORING-MASTER-001) or org key (ENABLE_SCOPE).
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0

  updateTemplateConfig:
    handler: src/handlers/http/updateTemplateConfig.main
    events:
      - http:
          path: template-configs/{configId}
          method: put
          summary: Update UI template config
          description: Updates existing config by configId. 404 if not found.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0

  getTemplateVersions:
    handler: src/handlers/http/getTemplateVersions.main
    events:
      - http:
          path: templates/{templateId}/versions
          method: get
          summary: Template versions (canonical)
          description: |
            List/read versions. templateLevel=MASTER|ORG; org requires organizationId query or JWT.
            Query version=latest|meta|{versionId} for point reads.
          queryStringParameters:
            templateLevel:
              required: false
              type: string
            organizationId:
              required: false
              type: string
            version:
              required: false
              type: string
            resolve:
              required: false
              type: string
            nextPaginationKey:
              required: false
              type: string
            nextToken:
              required: false
              type: string
            status:
              required: false
              type: string
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0

  getMasterTemplateVersions:
    handler: src/handlers/http/getMasterTemplateVersions.main
    events:
      - http:
          path: templates/master/{templateId}/versions
          method: get
          summary: Master template versions
          description: List VERSION rows, or read latest / point version via query `version`.
          queryStringParameters:
            version:
              required: false
              type: string
            resolve:
              required: false
              type: string
            nextPaginationKey:
              required: false
              type: string
            nextToken:
              required: false
              type: string
            status:
              required: false
              type: string
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK — version list or single version
            "400": Bad request
            "401": Unauthorized
            "404": Not found
            "500": Server error

  updateTemplateVersion:
    handler: src/handlers/http/updateTemplateVersion.main
    events:
      - http:
          path: templates/{templateId}/versions/{versionId}
          method: put
          summary: Update org template version
          description: |
            Org template update only. Master create/update uses POST /templates and POST /templates/{templateId}.
          queryStringParameters:
            templateLevel:
              required: false
              type: string
            organizationId:
              required: false
              type: string
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0

  getOrgVersionStatus:
    handler: src/handlers/http/getOrgVersionStatus.main
    events:
      - http:
          path: templates/org-version-status
          method: get
          summary: Org template version status for one master (canonical)
          description: |
            Returns current org version, derived-from master version, latest published master,
            upgrade availability, and local changes for the versioning table UI.
            Requires organizationId (ROOT) and master templateId query params.
          queryStringParameters:
            organizationId:
              required: false
              type: string
            templateId:
              required: true
              type: string
            organizationName:
              required: false
              type: string
            organizationDescription:
              required: false
              type: string
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0

  deriveTemplate:
    handler: src/handlers/http/deriveTemplate.main
    events:
      - http:
          path: templates/derive
          method: post
          summary: Enable org template from published master (canonical)
          description: |
            Copy the latest PUBLISHED master (from JSON body) into the org partition and create enablement.
            Requires organizationMeta, categoryCode, conditionCode, templateType, and templateId in the body.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0

  updateOrgTemplateEnable:
    handler: src/handlers/http/updateOrgTemplateEnable.main
    events:
      - http:
          path: templates/derive
          method: put
          summary: Enable or disable org template subscription
          description: |
            Updates enablement for an existing org + master templateId.
            Set templateEnabled false to disable (sets effectiveTo); true to re-enable.
            Requires organizationMeta.id or organizationId and master templateId.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0

  cloneOrgTemplate:
    handler: src/handlers/http/cloneOrgTemplate.main
    events:
      - http:
          path: templates/organizations/{organizationId}/{templateId}/versions/{versionId}/clone
          method: post
          summary: Clone published master template to org (legacy — prefer POST /templates/derive)
          description: Creates ORG_TMPL partition with META + VERSION#001 in SAVED status.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "201": Created — TemplateSummaryData
            "400": Bad request
            "401": Unauthorized
            "404": Not found
            "409": Conflict
            "500": Server error

 
  getOrgTemplateVersions:
    handler: src/handlers/http/getOrgTemplateVersions.main
    events:
      - http:
          path: templates/organizations/{organizationId}/{templateId}/versions
          method: get
          summary: Org template versions
          description: List, meta, latest, or point read via query version (same as master).
          queryStringParameters:
            version:
              required: false
              type: string
            resolve:
              required: false
              type: string
            nextPaginationKey:
              required: false
              type: string
            nextToken:
              required: false
              type: string
            status:
              required: false
              type: string
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK
            "401": Unauthorized
            "404": Not found
            "500": Server error

  listOrgTemplates:
    handler: src/handlers/http/listOrgTemplates.main
    events:
      - http:
          path: templates/org
          method: get
          summary: List organization templates
          description: Query GSI1 by organizationId (from query or JWT).
          queryStringParameters:
            organizationId:
              required: false
              type: string
            condition:
              required: false
              type: string
            status:
              required: false
              type: string
            templateType:
              required: false
              type: string
            specialty:
              required: false
              type: string
            nextToken:
              required: false
              type: string
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK — org template list
            "401": Unauthorized
            "500": Server error

  updateOrgTemplateVersion:
    handler: src/handlers/http/updateOrgTemplateVersion.main
    events:
      - http:
          path: templates/org/{templateId}/versions/{versionId}
          method: put
          summary: Update organization template version
          description: Editable in DRAFT/SAVED/IN_REVIEW; organizationId from JWT.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": Updated — TemplateSummaryData
            "400": Bad request
            "401": Unauthorized
            "404": Not found
            "409": Conflict
            "422": Validation error
            "500": Server error

  listCompatibleTemplates:
    handler: src/handlers/http/listCompatibleTemplates.main
    events:
      - http:
          path: templates/compatible
          method: get
          summary: List compatible published templates
          description: GSI2 published catalog filtered by condition, country, optional duration.
          queryStringParameters:
            condition:
              required: true
              type: string
            country:
              required: true
              type: string
            duration:
              required: false
              type: string
            templateType:
              required: false
              type: string
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK — compatible template list
            "400": Bad request
            "401": Unauthorized
            "500": Server error

  createOrgEnablement:
    handler: src/handlers/http/createOrgEnablement.main
    events:
      - http:
          path: org-enablements
          method: post
          summary: Create org enablement
          description: Link organization to a published master template version.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "201": Created — OrgEnablement
            "400": Bad request
            "401": Unauthorized
            "404": Not found
            "409": Conflict
            "500": Server error

  searchOrgEnablements:
    handler: src/handlers/http/searchOrgEnablements.main
    events:
      - http:
          path: org-enablements
          method: get
          summary: Search org enablements
          description: Query GSI1 by organizationId and/or GSI3 by masterTemplateVersionId.
          queryStringParameters:
            organizationId:
              required: false
              type: string
            masterTemplateVersionId:
              required: false
              type: string
            nextToken:
              required: false
              type: string
            limit:
              required: false
              type: integer
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK — OrgEnablement list
            "400": Bad request
            "401": Unauthorized
            "500": Server error

  listOrgEnablementsByOrg:
    handler: src/handlers/http/listOrgEnablementsByOrg.main
    events:
      - http:
          path: org-enablements/{orgId}
          method: get
          summary: List enablements for organization
          description: Query GSI1 PK=ORG#orgId with ENABLE# prefix on SK.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK — OrgEnablement list
            "401": Unauthorized
            "403": Forbidden
            "500": Server error

  getOrgEnablementById:
    handler: src/handlers/http/getOrgEnablementById.main
    events:
      - http:
          path: org-enablements/id/{enablementId}
          method: get
          summary: Get org enablement by id
          description: Point read ENABLE#id / META.
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK — OrgEnablement
            "401": Unauthorized
            "404": Not found
            "500": Server error

  updateOrgEnablement:
    handler: src/handlers/http/updateOrgEnablement.main
    events:
      - http:
          path: org-enablements/id/{enablementId}
          method: patch
          summary: Update or revoke org enablement
          description: PATCH with action UPDATE (dates) or REVOKE (delete row, 204).
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK — OrgEnablement (UPDATE)
            "204": No content (REVOKE)
            "400": Bad request
            "401": Unauthorized
            "404": Not found
            "422": Validation error
            "500": Server error

  transitionTemplateStatus:
    handler: src/handlers/http/transitionTemplateStatus.main
    events:
      - http:
          path: templates/{templateId}/versions/{versionId}/status
          method: post
          summary: Transition org template status (legacy)
          description: |
            Org lifecycle only. Master: use PUT /templates/{templateId} with lifecycleAction in body.
          queryStringParameters:
            organizationId:
              required: false
              type: string
          cors: *httpApiCors
          authorizer:
            name: common_authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_user_package_custom_authorization
            resultTtlInSeconds: 0
          responses:
            "200": OK — TemplateSummaryData
            "400": Bad request
            "401": Unauthorized
            "404": Not found
            "409": Conflict
            "422": Validation error
            "500": Server error

