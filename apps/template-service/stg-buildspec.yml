version: 0.2
# STAGING pipeline — CodeBuild project must use THIS file (not buildspec.yml).
# Build uploads Lambda zips to DEPLOYMENT_BUCKET and emits packaged.yaml for deploy.

env:
  shell: bash
  variables:
    STAGE: 'stg'
    DEPLOYMENT_BUCKET: 'stg-mvx-template-service-bucket'
    STACK_NAME: 'stg-template-service'
    NODE_OPTIONS: '--max-old-space-size=2048'

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "Installing dependencies..."
      - npm install --legacy-peer-deps

  pre_build:
    commands:
      - echo "Making scripts executable..."
      - chmod +x apps/template-service/ci/*.sh

  build:
    commands:
      - echo "Starting build..."
      - apps/template-service/ci/build.sh

  post_build:
    commands:
      - |
        if [ "${CODEBUILD_BUILD_SUCCEEDING:-1}" -ne 1 ]; then
          echo "Skipping artifact verification — build phase failed"
          exit 0
        fi
      - echo "Running deployment verification..."
      - apps/template-service/ci/verify-artifacts.sh

artifacts:
  files:
    - apps/template-service/packaged.yaml
    - apps/template-service/.serverless/**/*
  discard-paths: no
