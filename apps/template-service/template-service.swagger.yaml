openapi: 3.0.3
info:
  title: Template Service API
  version: 1.0.0
  description: |
    Aligned with `template-service.postman_collection.json` and deployed routes in `serverless.yml`.

    **Master template — one POST API**
    | Action | Method | Path |
    |--------|--------|------|
    | Create | `POST` | `/templates` |
    | Update / publish | `POST` | `/templates/{templateId}` |

    **Org enable flow**
    | Action | Method | Path |
    |--------|--------|------|
    | List enable catalog | `GET` | `/templates?templateLevel=ORG&organizationId=…` |
    | Enable for org | `POST` | `/templates/derive` |

    Set `Authorization: Bearer <token>`. `organizationId` may come from JWT when omitted.

servers:
  - url: http://localhost:3000
    description: serverless-offline (no stage prefix)
  - url: https://{apiHost}/{stage}
    variables:
      apiHost:
        default: bm677cg6y0.execute-api.us-east-1.amazonaws.com
      stage:
        default: dev

security:
  - bearerAuth: []

tags:
  - name: Health
  - name: MasterTemplates
    description: POST create/update, GET list (templateLevel=MASTER)
  - name: OrgTemplates
    description: GET enable catalog, POST derive, PUT version, POST status
  - name: Enablements
  - name: TemplateConfigs
  - name: Legacy
    description: Deprecated routes — prefer canonical paths

paths:
  /health:
    get:
      tags: [Health]
      summary: GET Health
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: OK

  /templates:
    post:
      tags: [MasterTemplates]
      summary: POST Create Master (no id)
      operationId: createMasterTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterTemplateCreateRequest'
            example:
              templateLevel: MASTER
              templateType: TASK
              TEMPLATE_NAME: Task Monitoring Master
              status: DRAFT
              fieldValues:
                categoryCode: CHRONIC_CARE
                conditionCode: DIABETES
                shareScope: private
                TASK_NAME: Record Blood Pressure
                TASK_DESCRIPTION: Measure BP daily
                ASSIGNED_TO_ROLE: PATIENT
                TASK_CATEGORY: MONITORING
                TASK_TYPE: MEASUREMENT
                TASK_SUBTYPE: BLOOD_PRESSURE
                ACTION_SUBMISSION_TYPE: DEVICE_SYNC
                COMPARISON_METHOD: RANGE
                SCHEDULE_TYPE: RECURRING
                RECURRENCE_PATTERN: DAILY
                REMINDERS_ENABLED: true
                REMINDER_CHANNELS: [IN_APP, PUSH]
                DISPLAY_TO_PATIENT: true
      responses:
        '201':
          description: Created — `data.templateId` e.g. TASK-MONITORING-MASTER
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessTemplateSummary'
    get:
      tags: [MasterTemplates, OrgTemplates]
      summary: List templates (MASTER dashboard or ORG enable catalog)
      operationId: listTemplates
      description: |
        - `templateLevel=MASTER` (default): dashboard list with status counts and filterOptions (status, scope, condition, templateName).
        - `templateLevel=ORG`: published master catalog for **Enable New Org** UI; requires `organizationId`.
          Returns `templateEnabled` per item and org-specific `counts` / `filterOptions` (category, templateType, templateName, country).
          Filter dropdown values are built from **all** published masters (stable when `items` is empty).
      parameters:
        - $ref: '#/components/parameters/templateLevel'
        - $ref: '#/components/parameters/organizationId'
        - $ref: '#/components/parameters/templateType'
        - $ref: '#/components/parameters/status'
        - $ref: '#/components/parameters/shareScope'
        - $ref: '#/components/parameters/conditionCode'
        - $ref: '#/components/parameters/categoryCode'
        - $ref: '#/components/parameters/templateName'
        - $ref: '#/components/parameters/country'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/nextToken'
      responses:
        '200':
          description: List response (shape depends on templateLevel)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiSuccessMasterListDashboard'
                  - $ref: '#/components/schemas/ApiSuccessOrgEnableCatalog'
              examples:
                masterList:
                  summary: MASTER list
                  value:
                    success: true
                    statusCode: 200
                    error: null
                    data:
                      items: []
                      pagination:
                        limit: 10
                        count: 0
                        total: 0
                        hasMore: false
                      counts:
                        total: 0
                        active: 0
                        inactive: 0
                        draft: 0
                        published: 0
                      filterOptions:
                        status: [{ label: Draft, value: DRAFT }, { label: Published, value: PUBLISHED }]
                        scope: []
                        condition: []
                orgEnableCatalog:
                  summary: ORG enable catalog
                  value:
                    success: true
                    statusCode: 200
                    error: null
                    data:
                      items:
                        - templateId: TASK-MONITORING-MASTER
                          templateVersionId: TASK-MONITORING-MASTER-V01
                          templateName: Record Blood Pressure (updated)
                          templateType: TASK
                          categoryCode: CHRONIC_CARE
                          conditionCode: DIABETES
                          templateEnabled: false
                          status: PUBLISHED
                          isActive: true
                      pagination:
                        limit: 25
                        count: 1
                        total: 1
                        hasMore: false
                      counts:
                        total: 1
                        active: 1
                        inactive: 0
                        templateEnabled: 0
                      filterOptions:
                        category: [{ label: CHRONIC_CARE, value: CHRONIC_CARE }]
                        condition: [{ label: DIABETES, value: DIABETES }]
                        templateType: [{ label: TASK, value: TASK }]
                        templateName: [{ label: Record Blood Pressure (updated), value: Record Blood Pressure (updated) }]
                        country: []

  /templates/{templateId}:
    post:
      tags: [MasterTemplates]
      summary: POST Update Master — edit content or publish
      operationId: updateMasterTemplate
      parameters:
        - $ref: '#/components/parameters/templateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterTemplateUpdateRequest'
            examples:
              editAndPublish:
                summary: Update fieldValues and publish
                value:
                  shareScope: Organization
                  fieldValues:
                    TASK_NAME: Record Blood Pressure (updated)
                    TASK_DESCRIPTION: Measure BP twice daily
                  status: PUBLISHED
              setInactive:
                summary: Deactivate (dashboard toggle)
                value:
                  active: false
              lifecyclePublish:
                summary: Publish via lifecycleAction
                value:
                  lifecycleAction: PUBLISH
                  comment: Approved
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessTemplateSummary'

  /templates/{templateId}/versions:
    get:
      tags: [MasterTemplates, OrgTemplates]
      summary: GET template versions and history
      operationId: getTemplateVersions
      parameters:
        - $ref: '#/components/parameters/templateId'
        - $ref: '#/components/parameters/templateLevel'
        - $ref: '#/components/parameters/organizationId'
        - name: version
          in: query
          schema:
            type: string
          description: Omit for list+history; `latest` for active snapshot
      responses:
        '200':
          description: Version list with history timeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessVersionListWithHistory'

  /templates/{templateId}/versions/{versionId}:
    put:
      tags: [OrgTemplates]
      summary: PUT Update Org Version
      operationId: updateOrgTemplateVersion
      parameters:
        - $ref: '#/components/parameters/templateId'
        - $ref: '#/components/parameters/versionId'
        - $ref: '#/components/parameters/templateLevel'
        - $ref: '#/components/parameters/organizationId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fieldValues:
                  type: object
                  additionalProperties: true
            example:
              fieldValues:
                TASK_NAME: Record Blood Pressure (Org)
      responses:
        '200':
          description: Updated org version

  /templates/{templateId}/versions/{versionId}/status:
    post:
      tags: [OrgTemplates]
      summary: POST Org Status — lifecycle
      operationId: transitionOrgTemplateStatus
      parameters:
        - $ref: '#/components/parameters/templateId'
        - $ref: '#/components/parameters/versionId'
        - $ref: '#/components/parameters/organizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgStatusTransitionRequest'
            example:
              action: PUBLISH
              comment: Approved
      responses:
        '200':
          description: OK

  /templates/derive:
    post:
      tags: [OrgTemplates]
      summary: POST Enable org template from master
      operationId: deriveOrgTemplate
      description: |
        Copies the latest **PUBLISHED** master (resolved from body `templateId`) into the org partition
        for `organizationMeta.id` and always creates an enablement record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeriveOrgTemplateRequest'
            example:
              organizationMeta:
                id: org-id
                name: org name
                description: org description
              categoryCode: CHRONIC_CARE
              conditionCode: DIABETES
              templateType: TASK
              templateId: Record Blood Pressure (updated)
      responses:
        '201':
          description: Org copy created; enablement sets templateEnabled true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessDeriveOrgTemplate'

  /templates/compatible:
    get:
      tags: [MasterTemplates]
      summary: GET Compatible Published Templates
      operationId: listCompatibleTemplates
      parameters:
        - name: condition
          in: query
          required: true
          schema:
            type: string
          example: HYPERTENSION
        - name: country
          in: query
          required: true
          schema:
            type: string
          example: US
        - name: templateType
          in: query
          schema:
            type: string
          example: CARE_PLAN
        - name: duration
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK

  /org-enablements:
    post:
      tags: [Enablements]
      summary: POST Create Enablement
      operationId: createOrgEnablement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrgEnablementRequest'
            example:
              organizationId: org-apollo-001
              masterTemplateVersionId: TASK-MONITORING-MASTER-V01
              effectiveFrom: '2026-01-01T00:00:00Z'
      responses:
        '201':
          description: Created
    get:
      tags: [Enablements]
      summary: GET Search Enablements
      operationId: searchOrgEnablements
      parameters:
        - $ref: '#/components/parameters/organizationId'
        - name: masterTemplateVersionId
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/nextToken'
      responses:
        '200':
          description: OK

  /template-configs:
    get:
      tags: [TemplateConfigs]
      summary: GET List Configs by templateType
      operationId: listTemplateConfigs
      parameters:
        - name: configType
          in: query
          schema:
            type: string
            enum: [TEMPLATE, ORG]
        - $ref: '#/components/parameters/templateType'
      responses:
        '200':
          description: OK

  /template-configs/{configId}:
    get:
      tags: [TemplateConfigs]
      summary: GET Config by Id
      operationId: getTemplateConfig
      parameters:
        - name: configId
          in: path
          required: true
          schema:
            type: string
          example: TASK-MASTER-001
      responses:
        '200':
          description: OK

  /templates/master:
    post:
      tags: [Legacy]
      summary: POST /templates/master (legacy create path)
      deprecated: true
      operationId: createMasterTemplateLegacy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterTemplateCreateRequest'
      responses:
        '201':
          description: Created

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito access token — collection variable authToken

  parameters:
    templateId:
      name: templateId
      in: path
      required: true
      schema:
        type: string
      description: Master template id (TASK-MONITORING-MASTER) or version id (…-V01) on update paths
      example: TASK-MONITORING-MASTER-V01
    versionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
      example: TASK-MONITORING-MASTER-V01
    templateLevel:
      name: templateLevel
      in: query
      schema:
        type: string
        enum: [MASTER, ORG]
        default: MASTER
    templateType:
      name: templateType
      in: query
      schema:
        type: string
      example: TASK
    status:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/TemplateStatus'
      description: DRAFT or PUBLISHED for master/org catalog filters
    shareScope:
      name: shareScope
      in: query
      schema:
        $ref: '#/components/schemas/ShareScope'
      description: Use null or omit to ignore filter
    conditionCode:
      name: conditionCode
      in: query
      schema:
        type: string
      example: DIABETES
    categoryCode:
      name: categoryCode
      in: query
      schema:
        type: string
      example: CHRONIC_CARE
    templateName:
      name: templateName
      in: query
      schema:
        type: string
      description: MASTER — match templateId (exact) or templateName (partial). ORG catalog — match templateId or display name.
    country:
      name: country
      in: query
      schema:
        type: string
      example: US
    organizationId:
      name: organizationId
      in: query
      schema:
        type: string
      example: org-apollo-001
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    nextToken:
      name: nextToken
      in: query
      schema:
        type: string

  schemas:
    TemplateStatus:
      type: string
      enum: [DRAFT, PUBLISHED, SAVED, IN_REVIEW, ARCHIVED, DEPRECATED]
      description: Master/org writes typically use DRAFT and PUBLISHED only
    ShareScope:
      type: string
      enum: [PRIVATE, ORGANIZATION, PUBLIC]
      description: API accepts Private, Organization, Public (case-insensitive); also in fieldValues.shareScope

    MasterTemplateCreateRequest:
      type: object
      required: [templateType]
      description: |
        `templateCode` is optional — derived from `TEMPLATE_NAME` or `templateName` when omitted.
        Profile fields (categoryCode, conditionCode, shareScope) belong in `fieldValues`.
      properties:
        templateLevel:
          type: string
          default: MASTER
        templateType:
          type: string
        templateCode:
          type: string
        templateName:
          type: string
        TEMPLATE_NAME:
          type: string
          description: UI alias for templateName
        status:
          $ref: '#/components/schemas/TemplateStatus'
        fieldValues:
          type: object
          additionalProperties: true

    MasterTemplateUpdateRequest:
      type: object
      description: |
        Content — fieldValues, shareScope, status (DRAFT/PUBLISHED).  
        Lifecycle — lifecycleAction + comment.  
        Active toggle — `active` only.
      properties:
        lifecycleAction:
          type: string
          enum: [SUBMIT_REVIEW, PUBLISH, REJECT, ARCHIVE, DEPRECATE]
        comment:
          type: string
        shareScope:
          $ref: '#/components/schemas/ShareScope'
        status:
          $ref: '#/components/schemas/TemplateStatus'
        active:
          type: boolean
        fieldValues:
          type: object
          additionalProperties: true

    DeriveOrgTemplateRequest:
      type: object
      required:
        - organizationMeta
        - categoryCode
        - conditionCode
        - templateType
        - templateId
      description: |
        Org enable payload. Backend always enables the template for the org (enablement record).
        Master links/sections are copied from the latest PUBLISHED master version automatically.
        `templateId` may be the catalog value (`filterOptions.templateName.value`) or the display label.
      properties:
        organizationMeta:
          type: object
          required:
            - id
            - name
            - description
          properties:
            id:
              type: string
            name:
              type: string
            description:
              type: string
        templateId:
          type: string
          description: Master template id or display name from org catalog
        categoryCode:
          type: string
        conditionCode:
          type: string
        templateType:
          type: string

    DeriveOrgTemplateResponse:
      type: object
      properties:
        templateId:
          type: string
          description: New org template id
        templateVersionId:
          type: string
        templateName:
          type: string
        sourceVersionId:
          type: string
        masterTemplateId:
          type: string
        masterTemplateName:
          type: string
        templateType:
          type: string
        version:
          type: number
        status:
          type: string
        isActive:
          type: boolean
        templateEnabled:
          type: boolean
          description: true after successful ENABLE derivation
        categoryCode:
          type: string
        conditionCode:
          type: string
        countries:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true

    OrgStatusTransitionRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [SUBMIT_REVIEW, PUBLISH, REJECT, ARCHIVE, DEPRECATE]
        comment:
          type: string

    CreateOrgEnablementRequest:
      type: object
      required: [organizationId, masterTemplateVersionId]
      properties:
        organizationId:
          type: string
        masterTemplateVersionId:
          type: string
        effectiveFrom:
          type: string
          format: date-time
        effectiveTo:
          type: string
          format: date-time
          nullable: true

    MasterTemplateListItem:
      type: object
      properties:
        templateId:
          type: string
        templateVersionId:
          type: string
        templateName:
          type: string
        templateType:
          type: string
        version:
          type: number
        status:
          $ref: '#/components/schemas/TemplateStatus'
        isActive:
          type: boolean
        publishedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
        updatedBy:
          type: string
          nullable: true
        fieldValues:
          type: object
          additionalProperties: true
        history:
          type: array
          items:
            $ref: '#/components/schemas/TemplateHistoryEntry'

    OrgEnableCatalogItem:
      allOf:
        - $ref: '#/components/schemas/MasterTemplateListItem'
        - type: object
          properties:
            categoryCode:
              type: string
            conditionCode:
              type: string
            templateEnabled:
              type: boolean
            countries:
              type: array
              items:
                type: string

    TemplateHistoryEntry:
      type: object
      properties:
        version:
          type: number
        templateVersionId:
          type: string
        status:
          type: string
        action:
          type: string
          description: CREATED, UPDATED, PUBLISHED, etc.
        title:
          type: string
        isActive:
          type: boolean
        isLatestVersion:
          type: boolean
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
          nullable: true
        publishedAt:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true
        changes:
          type: array
          items:
            type: string
          description: Field and status diffs vs previous history entry

    ListPagination:
      type: object
      properties:
        limit:
          type: integer
        count:
          type: integer
        total:
          type: integer
        hasMore:
          type: boolean
        nextToken:
          type: string
          nullable: true

    ListStatusCounts:
      type: object
      properties:
        total:
          type: integer
        active:
          type: integer
        inactive:
          type: integer
        draft:
          type: integer
        published:
          type: integer

    OrgCatalogCounts:
      type: object
      properties:
        total:
          type: integer
        active:
          type: integer
        inactive:
          type: integer
        templateEnabled:
          type: integer

    FilterOption:
      type: object
      properties:
        label:
          type: string
        value:
          type: string

    ListFilterOptions:
      type: object
      properties:
        status:
          type: array
          items:
            $ref: '#/components/schemas/FilterOption'
        scope:
          type: array
          items:
            $ref: '#/components/schemas/FilterOption'
        condition:
          type: array
          items:
            $ref: '#/components/schemas/FilterOption'

    OrgCatalogFilterOptions:
      allOf:
        - $ref: '#/components/schemas/ListFilterOptions'
        - type: object
          properties:
            category:
              type: array
              items:
                $ref: '#/components/schemas/FilterOption'
            templateType:
              type: array
              items:
                $ref: '#/components/schemas/FilterOption'
            templateName:
              type: array
              items:
                $ref: '#/components/schemas/FilterOption'
            country:
              type: array
              items:
                $ref: '#/components/schemas/FilterOption'

    ApiSuccessEnvelope:
      type: object
      properties:
        success:
          type: boolean
        statusCode:
          type: integer
        message:
          type: object
        data:
          type: object
        error:
          type: object
          nullable: true
        meta:
          type: object
          properties:
            correlationId:
              type: string
            timestamp:
              type: string
            version:
              type: string

    ApiSuccessMasterListDashboard:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/MasterTemplateListItem'
                pagination:
                  $ref: '#/components/schemas/ListPagination'
                counts:
                  $ref: '#/components/schemas/ListStatusCounts'
                filterOptions:
                  $ref: '#/components/schemas/ListFilterOptions'

    ApiSuccessOrgEnableCatalog:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/OrgEnableCatalogItem'
                pagination:
                  $ref: '#/components/schemas/ListPagination'
                counts:
                  $ref: '#/components/schemas/OrgCatalogCounts'
                filterOptions:
                  $ref: '#/components/schemas/OrgCatalogFilterOptions'

    ApiSuccessVersionListWithHistory:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                history:
                  type: array
                  items:
                    $ref: '#/components/schemas/TemplateHistoryEntry'
                nextToken:
                  type: string
                  nullable: true

    TemplateSummaryData:
      type: object
      properties:
        templateId:
          type: string
        templateVersionId:
          type: string
        version:
          type: number
        status:
          type: string

    ApiSuccessTemplateSummary:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TemplateSummaryData'

    ApiSuccessDeriveOrgTemplate:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DeriveOrgTemplateResponse'
