version: 0.2

env:
  variables:
    STAGE: 'dev'
    DEPLOYMENT_BUCKET: 'dev-mvx-fairway-api-bucket'
    STACK_NAME: 'dev-fairway-connect-apis'

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - npm install -g serverless@3 --force
      - npm install --legacy-peer-deps

  build:
    commands:
 
      - export NODE_OPTIONS="${NODE_OPTIONS:-} --max-old-space-size=4096 --no-experimental-detect-module --no-experimental-require-module"
      - rm -rf .serverless && npx serverless package --stage "$STAGE" --package .serverless

      # 2) select create vs update s3 keys
      - |
        if [ -f .serverless/cloudformation-template-update-stack.json ]; then
          TEMPLATE=".serverless/cloudformation-template-update-stack.json"
        elif [ -f .serverless/cloudformation-template-create-stack.json ]; then
          TEMPLATE=".serverless/cloudformation-template-create-stack.json"
        else
          echo "ERROR: No CloudFormation template found in .serverless"
          ls -la .serverless || true
          exit 1
        fi

      # 3) push code & rewrite 
      - |
        aws cloudformation package \
          --template-file "$TEMPLATE" \
          --s3-bucket "$DEPLOYMENT_BUCKET" \
          --output-template-file packaged.yaml \
          --force-upload

      # 4) debug: what keys did CF bake in?
      - echo "🔍 Raw S3Key lines in packaged.yaml:"
      - grep 'S3Key:' packaged.yaml || true
      - echo "🔍 Extracted non-empty S3 keys:"
      - grep 'S3Key:' packaged.yaml | awk '{print $2}' | awk 'NF'

      # 5) debug: do they exist?
      - echo "🔑 Verifying each baked-in key exists:"
      - |
        grep 'S3Key:' packaged.yaml | awk '{print $2}' | awk 'NF' \
          | while read key; do
              if [ -z "$key" ]; then
                echo "WARN: empty S3 key extracted, skipping"
                continue
              fi
              printf " → %-80s " "$key"
              if aws s3api head-object --bucket "$DEPLOYMENT_BUCKET" --key "$key" >/dev/null 2>&1; then
                echo "FOUND"
              else
                echo "MISSING!"
              fi
            done

      # 6) debug: list entire directory
      # - echo "📦 Full directory on S3:"
      # - aws s3 ls "s3://$DEPLOYMENT_BUCKET/serverless/payments-service/$STAGE/" --recursive

      - echo "➤ Pushing any missing function ZIPs into their exact S3Key paths…"
      - |
        grep 'S3Key:' packaged.yaml \
          | awk '{print $2}' \
          | awk 'NF' \
          | while read key; do
              if [ -z "$key" ]; then
                echo "WARN: empty S3 key extracted, skipping upload"
                continue
              fi
              name=$(basename "$key")
              if [ -f ".serverless/$name" ]; then
                echo "Uploading .serverless/$name → s3://$DEPLOYMENT_BUCKET/$key"
                aws s3 cp ".serverless/$name" "s3://$DEPLOYMENT_BUCKET/$key"
              else
                echo "WARN: local artifact missing (.serverless/$name), skipping upload for $key"
              fi
            done

      - echo "➤ Verifying upload…"
      - |
        first_key=$(grep 'S3Key:' packaged.yaml | awk '{print $2}' | awk 'NF' | head -1)
        if [ -n "$first_key" ]; then
          aws s3 ls "s3://$DEPLOYMENT_BUCKET/$(dirname "$first_key")/" --recursive
        else
          echo "WARN: no valid S3Key found in packaged.yaml; skipping upload verification list"
        fi

  post_build:
    commands:
      - echo "✅ Build done, artifacts ready in packaged.yaml"

artifacts:
  files:
    - packaged.yaml
  discard-paths: no

cache:
  paths:
    - node_modules/**/*