version: 0.2

env:
  shell: bash
  parameter-store:
    NPM_TOKEN: /codebuild/github-packages-npm-token
  variables:
    STAGE: 'prd'
    DEPLOYMENT_BUCKET: 'prd-mvx-user-service-bucket'
    STACK_NAME: 'prd-user-service'

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "=== npm registry debug (pre-install) ==="
      - pwd
      - ls -la
      - ls -la .npmrc || echo "WARN no .npmrc in $(pwd)"
      - cat .npmrc || true
      - cat ~/.npmrc 2>/dev/null || echo "no ~/.npmrc"
      - npm config list
      - npm config get registry
      - npm config get @myvitalrx:registry || true
      - echo "NPM_TOKEN set=${NPM_TOKEN:+yes}"
      - echo "Installing dependencies..."
      - npm install --legacy-peer-deps
      - node -e "require('@myvitalrx/mvrx-resource-registry'); console.log('mvrx-resource-registry OK')"
      - npm ls @myvitalrx/mvrx-resource-registry

  pre_build:
    commands:
      - echo "Making scripts executable..."
      - chmod +x apps/user-service/ci/*.sh

  build:
    commands:
      - echo "Starting build..."
      - apps/user-service/ci/build.sh

  post_build:
    commands:
      - echo "Running deployment verification..."
      - apps/user-service/ci/verify-artifacts.sh

artifacts:
  files:
    - apps/user-service/packaged.yaml
    - apps/user-service/.serverless/**/*
  discard-paths: no 