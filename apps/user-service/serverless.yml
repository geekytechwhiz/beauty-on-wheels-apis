resources:
  Resources:
    UserIdentityRegisteredDlq:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.resourcePrefix}-user-identity-registered-dlq
        MessageRetentionPeriod: 1209600
        SqsManagedSseEnabled: true
    UserIdentityRegisteredDlqPolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref UserIdentityRegisteredDlq
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: { Service: events.amazonaws.com }
              Action: sqs:SendMessage
              Resource: !GetAtt UserIdentityRegisteredDlq.Arn
              Condition:
                StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
    UserIdentityRegisteredRule:
      Type: AWS::Events::Rule
      DependsOn: UserIdentityRegisteredDlqPolicy
      Properties:
        Name: ${self:custom.resourcePrefix}-user-identity-registered
        EventBusName:
          Fn::ImportValue: ${self:custom.resourcePrefix}-vendor-event-bus-name
        EventPattern:
          source: [identity-service]
          detail-type: [Identity.Registered]
        State: ENABLED
        Targets:
          - Id: UserIdentityRegistered
            Arn: !GetAtt OnIdentityRegisteredLambdaFunction.Arn
            DeadLetterConfig: { Arn: !GetAtt UserIdentityRegisteredDlq.Arn }
            RetryPolicy: { MaximumRetryAttempts: 3 }
    UserIdentityRegisteredEventPermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !GetAtt OnIdentityRegisteredLambdaFunction.Arn
        Action: lambda:InvokeFunction
        Principal: events.amazonaws.com
        SourceArn: !GetAtt UserIdentityRegisteredRule.Arn
    UserTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-user
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: GSI1PK
            AttributeType: S
          - AttributeName: GSI1SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH
              - AttributeName: GSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        SSESpecification:
          SSEEnabled: true

    GatewayResponseDefault4XX: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseDefault4XX}

    GatewayResponseDefault5XX: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseDefault5XX}

    GatewayResponseUnauthorized: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseUnauthorized}

    GatewayResponseAccessDenied: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseAccessDenied}

    GatewayResponseMissingAuthenticationToken: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseMissingAuthenticationToken}
    GatewayResponseExpiredToken: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseExpiredToken}
    GatewayResponseIntegrationFailure: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseIntegrationFailure}
    GatewayResponseIntegrationTimeout: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseIntegrationTimeout}

