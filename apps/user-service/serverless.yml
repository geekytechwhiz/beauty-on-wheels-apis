service: user-service

frameworkVersion: "3"

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-auto-swagger
  - serverless-offline

provider:
  name: aws
  runtime: nodejs22.x
  stage: ${opt:stage,'dev'}
  region: ${opt:region,'us-east-1'}
  versionFunctions: false

  environment:
    SERVICE_NAME: user-service
    LOG_LEVEL: INFO
    DYNAMODB_TABLE_NAME: ${self:service}-${self:provider.stage}-user

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:BatchGetItem
            - dynamodb:TransactWriteItems
            - dynamodb:TransactGetItems
            - dynamodb:DescribeTable
            - dynamodb:ConditionCheckItem
          Resource:
            - !GetAtt UserTable.Arn
            - !Join ["/", [!GetAtt UserTable.Arn, "index", "*"]]
        - Effect: Allow
          Action:
            - xray:PutTraceSegments
            - xray:PutTelemetryRecords
          Resource: "*"

custom:
  securedAuthorizer: ${file(../../infra/serverless/config/http-api-authorizer.yml)}

  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    concurrency: 10
    plugins: ./esbuild-plugins.js

  autoswagger:
    title: "Beauty on Wheels - User Service API"
    apiType: http
    basePath: /${self:provider.stage}
    schemes:
      - https
      - http
    generateSwaggerOnDeploy: true
    swaggerFiles:
      - swagger.json
    useStage: true
    swaggerPath: swagger
    typefiles:
      - ./src/types/api-types.d.ts
    excludeStages:
      - production

functions:
  lookupUserByPhone:
    handler: src/handlers/users.handler.handleLookupUserByPhone
    events:
      - http:
          path: /users
          method: get
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Look up a user by phone"
          description: "Service principal or admin. Requires query phone in E.164. Percent-encode + as %2B. Returns id, phone, and status."
          swaggerTags:
            - Users
          responseData:
            200:
              description: "Matching user"
              bodyType: PhoneLookupResult
            400:
              description: "Phone is missing or not E.164"
            403:
              description: "Caller is not a service principal or admin"
            404:
              description: "No user for that phone"

  getUser:
    handler: src/handlers/users.handler.handleGetUser
    events:
      - http:
          path: /users/{userId}
          method: get
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Get user"
          description: "Owner, admin, or service principal. Reads the customer profile summary."
          swaggerTags:
            - Users
          responseData:
            200:
              description: "User"
              bodyType: User
            403:
              description: "Caller cannot read this user"
            404:
              description: "User not found"

  getCustomer:
    handler: src/handlers/customers.handler.handleGetCustomer
    events:
      - http:
          path: /customers/{userId}
          method: get
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Get customer profile"
          description: "Owner, admin, or service principal. Includes communityIds and defaultAddressId."
          swaggerTags:
            - Customers
          responseData:
            200:
              description: "Customer profile"
              bodyType: CustomerProfile
            403:
              description: "Caller cannot read this profile"
            404:
              description: "Customer profile not found"

  putCustomer:
    handler: src/handlers/customers.handler.handlePutCustomer
    events:
      - http:
          path: /customers/{userId}
          method: put
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Create or update customer profile"
          description: "Owner or admin. Upserts the profile and the phone lookup used by WhatsApp. Status and loyaltyPoints are admin-only. Marketing consent is not accepted."
          swaggerTags:
            - Customers
          bodyType: CustomerProfileUpdate
          responseData:
            200:
              description: "Customer profile"
              bodyType: CustomerProfile
            400:
              description: "Invalid profile"
            403:
              description: "Caller cannot update this profile"
            409:
              description: "Phone number is already in use"

  listAddresses:
    handler: src/handlers/addresses.handler.handleListAddresses
    events:
      - http:
          path: /users/{userId}/addresses
          method: get
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "List addresses"
          description: "Owner, admin, or service principal. Deleted addresses are omitted. The default address is first."
          swaggerTags:
            - Addresses
          responseData:
            200:
              description: "Address list"
              bodyType: AddressListResponse
            403:
              description: "Caller cannot read these addresses"
            404:
              description: "Customer profile not found"

  getAddress:
    handler: src/handlers/addresses.handler.handleGetAddress
    events:
      - http:
          path: /users/{userId}/addresses/{addressId}
          method: get
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Get address"
          description: "Owner, admin, or service principal. Returns one active address owned by userId after the caller is checked against the access token. Response uses the platform envelope; the address is in data."
          swaggerTags:
            - Addresses
          responseData:
            200:
              description: "Address"
              bodyType: Address
            403:
              description: "Caller cannot read this address"
            404:
              description: "Address or customer profile not found"

  createAddress:
    handler: src/handlers/addresses.handler.handleCreateAddress
    events:
      - http:
          path: /users/{userId}/addresses
          method: post
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Add address"
          description: "Owner or admin. The first active address becomes the default. isDefault true replaces the previous default."
          swaggerTags:
            - Addresses
          bodyType: AddressRequest
          responseData:
            200:
              description: "Created address"
              bodyType: Address
            400:
              description: "Invalid address"
            403:
              description: "Caller cannot add an address"
            404:
              description: "Customer profile not found"

  updateAddress:
    handler: src/handlers/addresses.handler.handleUpdateAddress
    events:
      - http:
          path: /users/{userId}/addresses/{addressId}
          method: put
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Update address"
          description: "Owner or admin. Replaces the address. The only active address stays the default."
          swaggerTags:
            - Addresses
          bodyType: AddressRequest
          responseData:
            200:
              description: "Updated address"
              bodyType: Address
            403:
              description: "Caller cannot update this address"
            404:
              description: "Address not found"

  deleteAddress:
    handler: src/handlers/addresses.handler.handleDeleteAddress
    events:
      - http:
          path: /users/{userId}/addresses/{addressId}
          method: delete
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Delete address"
          description: "Owner or admin. Soft-deletes the address. If it was the default, another active address is promoted."
          swaggerTags:
            - Addresses
          responseData:
            200:
              description: "Deleted"
            403:
              description: "Caller cannot delete this address"
            404:
              description: "Address not found"

  getPreferences:
    handler: src/handlers/preferences.handler.handleGetPreferences
    events:
      - http:
          path: /users/{userId}/preferences
          method: get
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Get operational channel preferences"
          description: "Owner, admin, or service principal. Missing row means WhatsApp, SMS, email, and push are enabled. Marketing consent is not part of this resource."
          swaggerTags:
            - Preferences
          responseData:
            200:
              description: "Operational preferences"
              bodyType: OperationalPreferences
            403:
              description: "Caller cannot read these preferences"

  putPreferences:
    handler: src/handlers/preferences.handler.handlePutPreferences
    events:
      - http:
          path: /users/{userId}/preferences
          method: put
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Replace operational channel preferences"
          description: "Owner or admin. whatsapp, sms, email, and push are required. Marketing consent is rejected."
          swaggerTags:
            - Preferences
          bodyType: OperationalPreferencesUpdate
          responseData:
            200:
              description: "Operational preferences"
              bodyType: OperationalPreferences
            400:
              description: "Invalid preferences"
            403:
              description: "Caller cannot update these preferences"
            404:
              description: "Customer profile not found"

  createCommunity:
    handler: src/handlers/communities.handler.handleCreateCommunity
    events:
      - http:
          path: /communities
          method: post
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Create community"
          description: "Admin. Communities are territories a customer can belong to."
          swaggerTags:
            - Communities
          bodyType: CommunityCreate
          responseData:
            200:
              description: "Community"
              bodyType: Community
            403:
              description: "Administrator access is required"

  listCommunities:
    handler: src/handlers/communities.handler.handleListCommunities
    events:
      - http:
          path: /communities
          method: get
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "List communities"
          description: "Admin. Query status=active (default), inactive, or all. Query limit and cursor paginate the list."
          swaggerTags:
            - Communities
          responseData:
            200:
              description: "Community list"
              bodyType: CommunityListResponse
            403:
              description: "Administrator access is required"

  getCommunity:
    handler: src/handlers/communities.handler.handleGetCommunity
    events:
      - http:
          path: /communities/{communityId}
          method: get
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Get community"
          swaggerTags:
            - Communities
          responseData:
            200:
              description: "Community"
              bodyType: Community
            403:
              description: "Administrator access is required"
            404:
              description: "Community not found"

  updateCommunity:
    handler: src/handlers/communities.handler.handleUpdateCommunity
    events:
      - http:
          path: /communities/{communityId}
          method: put
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Update community"
          swaggerTags:
            - Communities
          bodyType: CommunityUpdate
          responseData:
            200:
              description: "Community"
              bodyType: Community
            403:
              description: "Administrator access is required"
            404:
              description: "Community not found"

  deleteCommunity:
    handler: src/handlers/communities.handler.handleDeleteCommunity
    events:
      - http:
          path: /communities/{communityId}
          method: delete
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Deactivate community"
          description: "Admin. Sets status to inactive. Existing memberships are left in place until an admin replaces them."
          swaggerTags:
            - Communities
          responseData:
            200:
              description: "Inactive community"
              bodyType: Community
            403:
              description: "Administrator access is required"
            404:
              description: "Community not found"

  getCustomerCommunities:
    handler: src/handlers/communities.handler.handleGetCustomerCommunities
    events:
      - http:
          path: /customers/{userId}/communities
          method: get
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Get customer community membership"
          description: "Owner, admin, or service principal."
          swaggerTags:
            - Communities
          responseData:
            200:
              description: "Membership"
              bodyType: CustomerCommunities
            403:
              description: "Caller cannot read this membership"
            404:
              description: "Customer profile not found"

  putCustomerCommunities:
    handler: src/handlers/communities.handler.handlePutCustomerCommunities
    events:
      - http:
          path: /customers/{userId}/communities
          method: put
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Replace customer community membership"
          description: "Admin. Replaces communityIds. Every id must be an active community."
          swaggerTags:
            - Communities
          bodyType: CustomerCommunitiesUpdate
          responseData:
            200:
              description: "Membership"
              bodyType: CustomerCommunities
            400:
              description: "Community is not active"
            403:
              description: "Administrator access is required"
            404:
              description: "Customer profile or community not found"

resources:
  Resources:
    UserTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-user
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: GSI1PK
            AttributeType: S
          - AttributeName: GSI1SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH
              - AttributeName: GSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        SSESpecification:
          SSEEnabled: true

    GatewayResponseDefault4XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: DEFAULT_4XX
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
          gatewayresponse.header.Access-Control-Allow-Methods: "'DELETE,GET,OPTIONS,POST,PUT'"

    GatewayResponseDefault5XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: DEFAULT_5XX
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
          gatewayresponse.header.Access-Control-Allow-Methods: "'DELETE,GET,OPTIONS,POST,PUT'"

    GatewayResponseUnauthorized:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: UNAUTHORIZED
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
          gatewayresponse.header.Access-Control-Allow-Methods: "'DELETE,GET,OPTIONS,POST,PUT'"

    GatewayResponseAccessDenied:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: ACCESS_DENIED
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
          gatewayresponse.header.Access-Control-Allow-Methods: "'DELETE,GET,OPTIONS,POST,PUT'"
