service: user-service

# Serverless 3.40 JSON schema may lag new Lambda runtimes (e.g. nodejs22.x); AWS still accepts them.
configValidationMode: warn

frameworkVersion: '3.x'

plugins:
  - serverless-plugin-warmup
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-auto-swagger
  - serverless-offline

provider:
  name: aws
  runtime: nodejs22.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  deploymentBucket:
    name: ${self:provider.stage}-mvx-user-service-bucket
    serverSideEncryption: AES256
  memorySize: 512
  timeout: 30

  tracing:
    lambda: true
    apiGateway: true

  logRetentionInDays: 14

  environment:
    REGION: ${self:provider.region}
    DEFAULT_TIMEZONE: Asia/Kolkata
    USER_TABLE: user-table-${self:provider.stage}
    ORGANIZATION_TABLE: organization-table-${self:provider.stage}
    PACKAGE_TABLE: ${self:provider.stage}_global_common_packages
    ROLES_TABLE: ${self:provider.stage}_roles_and_permissions
    OLD_USER_TABLE: ${self:provider.stage}_global_common_user_data
    USER_FILES_BUCKET: user-files-bucket-${self:provider.stage}
    USER_REMINDERS_QUEUE: user-reminders-queue-${self:provider.stage}
    EVENT_BUS: user-service-bus-${self:provider.stage}
    USER_EVENTS_TOPIC_ARN: arn:aws:sns:${self:provider.region}:${aws:accountId}:user-events-topic-${self:provider.stage}
    LOG_LEVEL: ${self:custom.logLevel.${self:provider.stage}, 'info'}
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
    DEFAULT_REGION: ${self:provider.region}
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID, self:custom.cognitoUserPoolId.${self:provider.stage}, 'us-east-1_AK1HTxdlX'}
    DEFAULT_AWS_REGION: ${self:provider.region}
    SECRET_STAGE: ${opt:secretStage, 'DEV'}
    SECRET_MANAGER_NAME: ${opt:secretStage, 'DEV'}_DEMO_SECRETMANAGER 
    SMS_API_URL: https://s3oiui4taf.execute-api.ap-south-1.amazonaws.com/dev/v1/send-sms
    SEND_EMAIL_API_URL: ${env:SEND_EMAIL_API_URL, 'https://dtzbyn9f4g.execute-api.us-east-1.amazonaws.com/dev/send-email'}
    DLT_CONTENT_ID: '1207176413550655404'
    PORTAL_LINK: ${self:custom.stageUrls.${self:provider.stage}.PORTAL_LINK, ''}
    WEB_URL: ${self:custom.stageUrls.${self:provider.stage}.WEB_URL, ''}
    WEB_DNS_URL: ${self:custom.stageUrls.${self:provider.stage}.WEB_URL, ''}
    ROLE_API_URL: ${self:custom.stageUrls.${self:provider.stage}.ROLE_API_URL, ''}
    ORGANIZATION_API_URL: ${self:custom.stageUrls.${self:provider.stage}.ORGANIZATION_API_URL, ''}
    SCHEDULE_SERVICE_API_URL: ${self:custom.stageUrls.${self:provider.stage}.SCHEDULE_SERVICE_API_URL, ''}
    APPOINTMENT_SCHEDULES_API_URL: ${self:custom.stageUrls.${self:provider.stage}.APPOINTMENT_SCHEDULES_API_URL, ''}
    SCHEDULE_SERVICE_API_TIMEOUT_MS: ${env:SCHEDULE_SERVICE_API_TIMEOUT_MS, '10000'}
    PACKAGE_API_URL: ${self:custom.stageUrls.${self:provider.stage}.PACKAGE_SERVICE_BASE_URL, ''}
    ERROR_MESSAGES_CDN_URL: https://d2p9v61861q1ox.cloudfront.net
    SEARCH_FNF_LAMBDA: ${self:provider.stage}_global_friend_family_search
    ADD_FRIEND_N_FAMILY_LAMBDA: ${self:provider.stage}_global_friend_family_add_member
    USER_LINK_LAMBDA: ${self:provider.stage}_global_link_unlink_service


  tags:
    Service: ${self:service}
    Stage: ${self:provider.stage}
    ManagedBy: serverless

  iamRoleStatements:
    # DynamoDB (table created in infra stack)
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:Query
        - dynamodb:BatchGetItem
        - dynamodb:BatchWriteItem
        - dynamodb:DescribeTable
      Resource:
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/user-table-*
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/user-table-*/index/*
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/organization-table-*
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/organization-table-*/index/*
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:provider.stage}_roles_and_permissions
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:provider.stage}_roles_and_permissions/index/*
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:provider.stage}_global_common_packages
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:provider.stage}_global_common_packages/index/*

    # DynamoDB Streams (for invite notification stream handler)
    - Effect: Allow
      Action:
        - dynamodb:GetRecords
        - dynamodb:GetShardIterator
        - dynamodb:DescribeStream
        - dynamodb:ListStreams
      Resource:
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/user-table-${self:provider.stage}/stream/*

    # S3 (user files)
    - Effect: Allow
      Action:
        - s3:GetObject
        - s3:PutObject
        - s3:DeleteObject
        - s3:ListBucket
      Resource:
        - arn:aws:s3:::user-files-bucket-${self:provider.stage}
        - arn:aws:s3:::user-files-bucket-${self:provider.stage}/*

    # SQS
    - Effect: Allow
      Action:
        - sqs:SendMessage
        - sqs:ReceiveMessage
        - sqs:DeleteMessage
        - sqs:GetQueueAttributes
        - sqs:GetQueueUrl
        - sqs:ChangeMessageVisibility
      Resource:
        - arn:aws:sqs:${self:provider.region}:${aws:accountId}:user-reminders-queue-${self:provider.stage}
        - arn:aws:sqs:${self:provider.region}:${aws:accountId}:user-reminders-queue-${self:provider.stage}-dlq

    # EventBridge
    - Effect: Allow
      Action:
        - events:PutEvents
      Resource:
        - arn:aws:events:${self:provider.region}:${aws:accountId}:event-bus/user-service-bus-${self:provider.stage}

    # SNS (for notification events)
    - Effect: Allow
      Action:
        - sns:Publish
      Resource:
        - arn:aws:sns:${self:provider.region}:${aws:accountId}:user-events-topic-${self:provider.stage}

    # Lambda invoke
    - Effect: Allow
      Action:
        - lambda:InvokeFunction
      Resource:
        - arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_friend_family_add_member
        - arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_friend_family_search
        - arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:provider.stage}_global_link_unlink_service

    # X-Ray
    - Effect: Allow
      Action:
        - xray:PutTraceSegments
        - xray:PutTelemetryRecords
      Resource: '*'

    # Cognito Identity Provider
    - Effect: Allow
      Action:
        - cognito-idp:AdminCreateUser
        - cognito-idp:AdminGetUser
        - cognito-idp:AdminUpdateUserAttributes
        - cognito-idp:AdminDeleteUser
        - cognito-idp:AdminSetUserPassword
        - cognito-idp:ListUsers
      Resource:
        - arn:aws:cognito-idp:${self:provider.region}:${aws:accountId}:userpool/*

    - Effect: Allow
      Action:
        - secretsmanager:GetSecretValue
        - secretsmanager:DescribeSecret
      Resource:
        - arn:aws:secretsmanager:${self:provider.region}:${aws:accountId}:secret:DEV_DEMO_SECRETMANAGER*
        - arn:aws:secretsmanager:${self:provider.region}:${aws:accountId}:secret:STG_DEMO_SECRETMANAGER*
        - arn:aws:secretsmanager:${self:provider.region}:${aws:accountId}:secret:PRD_DEMO_SECRETMANAGER*

package:
  individually: true
  
custom:
  # Disable sourcemaps for staging/prod to reduce memory in CI (avoids esbuild "The service was stopped: write EPIPE")
  sourcemapsByStage:
    dev: true
    nvstg: false
    stg: false
    prd: false
  esbuild:
    bundle: true
    minify: false
    sourcemap: ${self:custom.sourcemapsByStage.${self:provider.stage}, false}
    target: node22
    platform: node
    format: cjs
    tsconfig: ../../tsconfig.base.json
    external:
      - aws-sdk
    keepNames: true
    # Limit concurrent bundles to avoid OOM/EPIPE in CodeBuild (serverless-esbuild + esbuild docs)
    concurrency: 8
    zipConcurrency: 8
    # Resolve NX workspace dependencies (@api-hub/* packages)
    plugins: esbuild-plugins.js
    # Ensure proper module resolution
    resolveExtensions:
      - '.ts'
      - '.tsx'
      - '.js'
      - '.jsx'
      - '.mjs'
      - '.json'
  autoswagger:
    title: User Service API
    apiType: http
    basePath: /${self:provider.stage}
    schemes:
      - https
      - http
    host: ${self:custom.apiHost, ''}
    generateSwaggerOnDeploy: true
    swaggerFiles:
      - swagger.json
    useStage: true
    swaggerPath: swagger
    excludeStages:
      - production

  logLevel:
    dev: debug
    stg: info
    prd: warn

  # serverless-plugin-warmup: declare default warmer (see functions.createUser.warmup.default)
  warmup:
    default: {}

  # Cognito User Pool IDs per stage (used for searchFnF and other Cognito lookups)
  cognitoUserPoolId:
    dev: us-east-1_AK1HTxdlX
    stg: us-east-1_wttVwD9Ax
    prd: us-east-1_0uZJvIS5R

  # Only the stream creation timestamp differs per stage — everything else is dynamic
  userTableStreamTimestamp:
    dev: '2026-03-03T06:46:28.426'
    stg: '2026-01-23T11:08:57.849'
    prd: '2026-04-01T07:47:19.032'
  
  # Full DynamoDB Stream ARN built dynamically from region, accountId, stage, and timestamp
  userTableStreamArn: 'arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/user-table-${self:provider.stage}/stream/${self:custom.userTableStreamTimestamp.${self:provider.stage}}'

  stageUrls:
    dev:
      WEB_URL: 'https://dev-deeplink.myvitalrx.com/download-dev.html'
      PORTAL_LINK: 'https://usdev-console.myvitalrx.com/en/login'
      ROLE_API_URL: 'https://qtzgcngz60.execute-api.us-east-1.amazonaws.com/dev'
      ORGANIZATION_API_URL: 'https://9qe3rgipg3.execute-api.us-east-1.amazonaws.com/dev'
      USER_SERVICE_BASE_URL: 'https://e5gv0qum80.execute-api.us-east-1.amazonaws.com/dev'
      PACKAGE_SERVICE_BASE_URL: 'https://v1w4b4vunl.execute-api.us-east-1.amazonaws.com/dev'
      SCHEDULE_SERVICE_API_URL: 'https://v1w4b4vunl.execute-api.us-east-1.amazonaws.com/dev'
      # Dev appointment list API for showActiveAppointment (POST /fetch/schedules)
      APPOINTMENT_SCHEDULES_API_URL: 'https://pyima0ntak.execute-api.us-east-1.amazonaws.com'
      deploymentBucket: dev-mvx-user-service-bucket

    stg:
      WEB_URL: 'https://stg-deeplink.myvitalrx.com/download-stg.html'
      PORTAL_LINK: 'https://usstg-console.myvitalrx.com/en/login'
      ROLE_API_URL: 'https://qxsbrkassk.execute-api.us-east-1.amazonaws.com/stg'
      ORGANIZATION_API_URL: 'https://sqxxye6yl4.execute-api.us-east-1.amazonaws.com/stg'
      USER_SERVICE_BASE_URL: 'https://z79yqfg5n5.execute-api.us-east-1.amazonaws.com/stg'
      PACKAGE_SERVICE_BASE_URL: 'https://7cksvft1m2.execute-api.us-east-1.amazonaws.com/stg'
      SCHEDULE_SERVICE_API_URL: 'https://7cksvft1m2.execute-api.us-east-1.amazonaws.com/stg'
      APPOINTMENT_SCHEDULES_API_URL: 'https://bp1u0buyi6.execute-api.us-east-1.amazonaws.com'
      deploymentBucket: nvstg-mvx-user-service-bucket
    prd:
      WEB_URL: 'https://prd-deeplink.myvitalrx.com/download.html'
      PORTAL_LINK: 'https://usprd-console.myvitalrx.com/en/login'
      ROLE_API_URL: 'https://4dczf1vsgl.execute-api.us-east-1.amazonaws.com/prd'
      ORGANIZATION_API_URL: 'https://3i3mbzftx9.execute-api.us-east-1.amazonaws.com/prd'
      USER_SERVICE_BASE_URL: 'https://jtoofsw556.execute-api.us-east-1.amazonaws.com/prd'
      PACKAGE_SERVICE_BASE_URL: 'https://t9iqf5gu49.execute-api.us-east-1.amazonaws.com/prd'
