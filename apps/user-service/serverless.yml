service: user-service

frameworkVersion: "3"

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-auto-swagger
  - serverless-offline
  - serverless-openapi-documenter

provider:
  name: aws
  runtime: nodejs22.x
  stage: ${opt:stage,'dev'}
  region: ${opt:region,'us-east-1'}
  versionFunctions: false

  environment:
    CORS_ALLOWED_ORIGINS: ${self:custom.corsAllowedOrigins}
    SERVICE_NAME: user-service
    LOG_LEVEL: INFO
    DYNAMODB_TABLE_NAME: ${self:service}-${self:provider.stage}-user
    EVENT_BUS_NAME: ${self:custom.sharedEventBusName}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:BatchGetItem
            - dynamodb:TransactWriteItems
            - dynamodb:TransactGetItems
            - dynamodb:DescribeTable
            - dynamodb:ConditionCheckItem
          Resource:
            - !GetAtt UserTable.Arn
            - !Join ["/", [!GetAtt UserTable.Arn, "index", "*"]]
        - Effect: Allow
          Action:
            - xray:PutTraceSegments
            - xray:PutTelemetryRecords
          Resource: "*"
        - Effect: Allow
          Action: events:PutEvents
          Resource:
            Fn::ImportValue: ${self:custom.resourcePrefix}-vendor-event-bus-arn

custom:
  httpCors: ${file(../../infra/serverless/config/rest-api-cors.yml)}
  corsAllowedOrigins: ${file(../../infra/serverless/config/cors-allowed-origins.yml):value}
  resourcePrefix: nv${self:provider.stage}-bw
  sharedEventBusName: ${self:custom.resourcePrefix}-vendor-event-bus
  securedAuthorizer: ${file(../../infra/serverless/config/http-api-authorizer.yml)}

  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    concurrency: 10
    plugins: ./esbuild-plugins.js

  autoswagger:
    title: "Beauty on Wheels - User Service API"
    apiType: http
    basePath: /${self:provider.stage}
    schemes:
      - https
      - http
    generateSwaggerOnDeploy: true
    swaggerFiles:
      - swagger.json
    useStage: true
    swaggerPath: swagger
    typefiles:
      - ./src/types/api-types.d.ts
    excludeStages:
      - production

  documentation:
    version: 1.0.0
    title: Beauty on Wheels - User Service API
    description: Customer profiles, addresses, preferences, and communities.
    securitySchemes:
      bearerAuth:
        type: http
        scheme: bearer
        bearerFormat: JWT
    security:
      - bearerAuth: []
    servers:
      - url: https://{apiId}.execute-api.us-east-1.amazonaws.com/{stage}
        description: Deployed API Gateway stage
        variables:
          apiId:
            default: localhost
            description: API Gateway id
          stage:
            default: dev
            description: Deployment stage
    tags:
      - name: Users
        description: User lookup
      - name: Customers
        description: Customer profiles
      - name: Addresses
        description: Customer addresses
      - name: Preferences
        description: Operational notification preferences
      - name: Support Tickets
        description: Customer support tickets
      - name: Communities
        description: Communities and customer membership
    models:
      - name: PhoneLookupResult
        description: User matched by phone
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                phone:
                  type: string
                status:
                  type: string
                  enum:
                    - active
                    - inactive
                    - suspended
              required:
                - id
                - phone
                - status
      - name: User
        description: User summary
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                status:
                  type: string
                  enum:
                    - active
                    - inactive
                    - suspended
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                phone:
                  type: string
                profileImage:
                  type: string
              required:
                - id
                - status
      - name: CustomerProfileUpdate
        description: Customer profile update
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                phone:
                  type: string
                profileImage:
                  type: string
                status:
                  type: string
                  enum:
                    - active
                    - inactive
                    - suspended
                preferredLanguage:
                  type: string
                loyaltyPoints:
                  type: integer
      - name: CustomerProfile
        description: Customer profile
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                status:
                  type: string
                  enum:
                    - active
                    - inactive
                    - suspended
                communityIds:
                  type: array
                  items:
                    type: string
                createdAt:
                  type: string
                updatedAt:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                phone:
                  type: string
                profileImage:
                  type: string
                preferredLanguage:
                  type: string
                loyaltyPoints:
                  type: integer
                defaultAddressId:
                  type: string
              required:
                - userId
                - status
                - communityIds
                - createdAt
                - updatedAt
      - name: AddressRequest
        description: Address create or update
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - home
                    - work
                    - business
                line1:
                  type: string
                line2:
                  type: string
                city:
                  type: string
                state:
                  type: string
                postalCode:
                  type: string
                country:
                  type: string
                latitude:
                  type: number
                longitude:
                  type: number
                isDefault:
                  type: boolean
              required:
                - line1
                - city
      - name: Address
        description: Stored address
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                userId:
                  type: string
                type:
                  type: string
                  enum:
                    - home
                    - work
                    - business
                line1:
                  type: string
                city:
                  type: string
                isDefault:
                  type: boolean
                createdAt:
                  type: string
                updatedAt:
                  type: string
                line2:
                  type: string
                state:
                  type: string
                postalCode:
                  type: string
                country:
                  type: string
                latitude:
                  type: number
                longitude:
                  type: number
              required:
                - id
                - userId
                - type
                - line1
                - city
                - isDefault
                - createdAt
                - updatedAt
      - name: AddressListResponse
        description: Address list
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      userId:
                        type: string
                      type:
                        type: string
                        enum:
                          - home
                          - work
                          - business
                      line1:
                        type: string
                      city:
                        type: string
                      isDefault:
                        type: boolean
      - name: OperationalPreferencesUpdate
        description: Notification channel preferences
        content:
          application/json:
            schema:
              type: object
              properties:
                whatsapp:
                  type: boolean
                sms:
                  type: boolean
                email:
                  type: boolean
                push:
                  type: boolean
                language:
                  type: string
                timezone:
                  type: string
              required:
                - whatsapp
                - sms
                - email
                - push
      - name: OperationalPreferences
        description: Stored notification preferences
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                whatsapp:
                  type: boolean
                sms:
                  type: boolean
                email:
                  type: boolean
                push:
                  type: boolean
                language:
                  type: string
                timezone:
                  type: string
                updatedAt:
                  type: string
              required:
                - userId
                - whatsapp
                - sms
                - email
                - push
      - name: SupportTicketCreate
        description: Create a support ticket
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                category:
                  type: string
                  enum:
                    - BOOKING
                    - PAYMENT
                    - ACCOUNT
                bookingId:
                  type: string
                message:
                  type: string
                  minLength: 1
                  maxLength: 4000
              required:
                - category
                - message
      - name: SupportTicket
        description: Support ticket
        content:
          application/json:
            schema:
              type: object
              properties:
                ticketId:
                  type: string
                userId:
                  type: string
                status:
                  type: string
                  enum:
                    - OPEN
                category:
                  type: string
                  enum:
                    - BOOKING
                    - PAYMENT
                    - ACCOUNT
                message:
                  type: string
                bookingId:
                  type: string
                submittedAt:
                  type: string
                  format: date-time
              required:
                - ticketId
                - userId
                - status
                - category
                - message
                - submittedAt
      - name: CommunityCreate
        description: Create a community
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                code:
                  type: string
                city:
                  type: string
              required:
                - name
      - name: CommunityUpdate
        description: Update a community
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                code:
                  type: string
                city:
                  type: string
                status:
                  type: string
                  enum:
                    - active
                    - inactive
      - name: Community
        description: Community
        content:
          application/json:
            schema:
              type: object
              properties:
                communityId:
                  type: string
                name:
                  type: string
                status:
                  type: string
                  enum:
                    - active
                    - inactive
                createdAt:
                  type: string
                updatedAt:
                  type: string
                code:
                  type: string
                city:
                  type: string
              required:
                - communityId
                - name
                - status
                - createdAt
                - updatedAt
      - name: CommunityListResponse
        description: Community page
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      communityId:
                        type: string
                      name:
                        type: string
                      status:
                        type: string
                        enum:
                          - active
                          - inactive
                pagination:
                  type: object
                  properties:
                    nextCursor:
                      type: string
                    hasMore:
                      type: boolean
      - name: CustomerCommunitiesUpdate
        description: Replace customer community membership
        content:
          application/json:
            schema:
              type: object
              properties:
                communityIds:
                  type: array
                  items:
                    type: string
              required:
                - communityIds
      - name: CustomerCommunities
        description: Customer community membership
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                communityIds:
                  type: array
                  items:
                    type: string
              required:
                - userId
                - communityIds
      - name: ErrorResponse
        description: Platform error envelope
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                statusCode:
                  type: integer
                message:
                  type: object
                  properties:
                    title:
                      type: string
                    description:
                      type: string
                    severity:
                      type: string
                data:
                  type: object
                  properties: {}
                error:
                  type: object
                  properties:
                    code:
                      type: string
                    details:
                      type: array
                      items:
                        type: object
                        properties:
                          field:
                            type: string
                          message:
                            type: string
                meta:
                  type: object
                  properties:
                    correlationId:
                      type: string
                    timestamp:
                      type: string
                    version:
                      type: string
functions:
  onIdentityRegistered:
    handler: src/handlers/identity-registered.handler
    name: ${self:custom.resourcePrefix}-user-identity-registered
    timeout: 60
  lookupUserByPhone:
    handler: src/handlers/users.handleLookupUserByPhone
    events:
      - http:
          path: /users
          method: get
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Look up a user by phone"
          description: "Service principal or admin. Requires query phone in E.164. Percent-encode + as %2B. Returns id, phone, and status."
          swaggerTags:
            - Users
          responseData:
            200:
              description: "Matching user"
              bodyType: PhoneLookupResult
            400:
              description: "Phone is missing or not E.164"
            403:
              description: "Caller is not a service principal or admin"
            404:
              description: "No user for that phone"
          documentation:
            summary: Look up a user by phone
            description: Service principal or admin. Requires query phone in E.164. Percent-encode + as %2B. Returns id, phone, and status.
            tags:
              - Users
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Matching user
                responseModels:
                  application/json: PhoneLookupResult
              - statusCode: "400"
                responseBody:
                  description: Phone is missing or not E.164
                responseModels:
                  application/json: ErrorResponse
              - statusCode: "403"
                responseBody:
                  description: Caller is not a service principal or admin
                responseModels:
                  application/json: ErrorResponse
              - statusCode: "404"
                responseBody:
                  description: No user for that phone
                responseModels:
                  application/json: ErrorResponse
            queryParams:
              - name: phone
                description: E.164 phone number. Percent-encode + as %2B.
                required: true
                schema:
                  type: string

  getUser:
    handler: src/handlers/users.handleGetUser
    events:
      - http:
          path: /users/{userId}
          method: get
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Get user"
          description: "Owner, admin, or service principal. Reads the customer profile summary."
          swaggerTags:
            - Users
          responseData:
            200:
              description: "User"
              bodyType: User
            403:
              description: "Caller cannot read this user"
            404:
              description: "User not found"
          documentation:
            summary: Get user
            description: Owner, admin, or service principal. Reads the customer profile summary.
            tags:
              - Users
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: User
                responseModels:
                  application/json: User
              - statusCode: "403"
                responseBody:
                  description: Caller cannot read this user
                responseModels:
                  application/json: ErrorResponse
              - statusCode: "404"
                responseBody:
                  description: User not found
                responseModels:
                  application/json: ErrorResponse
            pathParams:
              - name: userId
                description: userId
                schema:
                  type: string

  getCustomer:
    handler: src/handlers/customers.handleGetCustomer
    events:
      - http:
          path: /customers/{userId}
          method: get
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Get customer profile"
          description: "Owner, admin, or service principal. Includes communityIds and defaultAddressId."
          swaggerTags:
            - Customers
          responseData:
            200:
              description: "Customer profile"
              bodyType: CustomerProfile
            403:
              description: "Caller cannot read this profile"
            404:
              description: "Customer profile not found"
          documentation:
            summary: Get customer profile
            description: Owner, admin, or service principal. Includes communityIds and defaultAddressId.
            tags:
              - Customers
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Customer profile
                responseModels:
                  application/json: CustomerProfile
              - statusCode: "403"
                responseBody:
                  description: Caller cannot read this profile
                responseModels:
                  application/json: ErrorResponse
              - statusCode: "404"
                responseBody:
                  description: Customer profile not found
                responseModels:
                  application/json: ErrorResponse
            pathParams:
              - name: userId
                description: userId
                schema:
                  type: string

  putCustomer:
    handler: src/handlers/customers.handlePutCustomer
    events:
      - http:
          path: /customers/{userId}
          method: put
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Create or update customer profile"
          description: "Owner or admin. Upserts the profile and the phone lookup used by WhatsApp. Status and loyaltyPoints are admin-only. Marketing consent is not accepted."
          swaggerTags:
            - Customers
          bodyType: CustomerProfileUpdate
          responseData:
            200:
              description: "Customer profile"
              bodyType: CustomerProfile
            400:
              description: "Invalid profile"
            403:
              description: "Caller cannot update this profile"
            409:
              description: "Phone number is already in use"
          documentation:
            summary: Create or update customer profile
            description: Owner or admin. Upserts the profile and the phone lookup used by WhatsApp. Status and loyaltyPoints are admin-only. Marketing consent is not accepted.
            tags:
              - Customers
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Customer profile
                responseModels:
                  application/json: CustomerProfile
              - statusCode: "400"
                responseBody:
                  description: Invalid profile
                responseModels:
                  application/json: ErrorResponse
              - statusCode: "403"
                responseBody:
                  description: Caller cannot update this profile
                responseModels:
                  application/json: ErrorResponse
              - statusCode: "409"
                responseBody:
                  description: Phone number is already in use
                responseModels:
                  application/json: ErrorResponse
            pathParams:
              - name: userId
                description: userId
                schema:
                  type: string
            requestBody:
              description: Owner or admin. Upserts the profile and the phone lookup used by WhatsApp. Status and loyaltyPoints are admin-only. Marketing consent is not accepted.
              required: true
            requestModels:
              application/json: CustomerProfileUpdate

  listAddresses:
    handler: src/handlers/addresses.handleListAddresses
    events:
      - http:
          path: /users/{userId}/addresses
          method: get
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "List addresses"
          description: "Owner, admin, or service principal. Deleted addresses are omitted. The default address is first."
          swaggerTags:
            - Addresses
          responseData:
            200:
              description: "Address list"
              bodyType: AddressListResponse
            403:
              description: "Caller cannot read these addresses"
            404:
              description: "Customer profile not found"
          documentation:
            summary: List addresses
            description: Owner, admin, or service principal. Deleted addresses are omitted. The default address is first.
            tags:
              - Addresses
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Address list
                responseModels:
                  application/json: AddressListResponse
              - statusCode: "403"
                responseBody:
                  description: Caller cannot read these addresses
                responseModels:
                  application/json: ErrorResponse
              - statusCode: "404"
                responseBody:
                  description: Customer profile not found
                responseModels:
                  application/json: ErrorResponse
            pathParams:
              - name: userId
                description: userId
                schema:
                  type: string

  getAddress:
    handler: src/handlers/addresses.handleGetAddress
    events:
      - http:
          path: /users/{userId}/addresses/{addressId}
          method: get
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Get address"
          description: "Owner, admin, or service principal. Returns one active address owned by userId after the caller is checked against the access token. Response uses the platform envelope; the address is in data."
          swaggerTags:
            - Addresses
          responseData:
            200:
              description: "Address"
              bodyType: Address
            403:
              description: "Caller cannot read this address"
            404:
              description: "Address or customer profile not found"
          documentation:
            summary: Get address
            description: Owner, admin, or service principal. Returns one active address owned by userId after the caller is checked against the access token. Response uses the platform envelope; the address is in data.
            tags:
              - Addresses
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Address
                responseModels:
                  application/json: Address
              - statusCode: "403"
                responseBody:
                  description: Caller cannot read this address
                responseModels:
                  application/json: ErrorResponse
              - statusCode: "404"
                responseBody:
                  description: Address or customer profile not found
                responseModels:
                  application/json: ErrorResponse
            pathParams:
              - name: userId
                description: userId
                schema:
                  type: string
              - name: addressId
                description: addressId
                schema:
                  type: string

  createAddress:
    handler: src/handlers/addresses.handleCreateAddress
    events:
      - http:
          path: /users/{userId}/addresses
          method: post
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Add address"
          description: "Owner or admin. The first active address becomes the default. isDefault true replaces the previous default."
          swaggerTags:
            - Addresses
          bodyType: AddressRequest
          responseData:
            200:
              description: "Created address"
              bodyType: Address
            400:
              description: "Invalid address"
            403:
              description: "Caller cannot add an address"
            404:
              description: "Customer profile not found"
          documentation:
            summary: Add address
            description: Owner or admin. The first active address becomes the default. isDefault true replaces the previous default.
            tags:
              - Addresses
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Created address
                responseModels:
                  application/json: Address
              - statusCode: "400"
                responseBody:
                  description: Invalid address
                responseModels:
                  application/json: ErrorResponse
              - statusCode: "403"
                responseBody:
                  description: Caller cannot add an address
                responseModels:
                  application/json: ErrorResponse
              - statusCode: "404"
                responseBody:
                  description: Customer profile not found
                responseModels:
                  application/json: ErrorResponse
            pathParams:
              - name: userId
                description: userId
                schema:
                  type: string
            requestBody:
              description: Owner or admin. The first active address becomes the default. isDefault true replaces the previous default.
              required: true
            requestModels:
              application/json: AddressRequest

  updateAddress:
    handler: src/handlers/addresses.handleUpdateAddress
    events:
      - http:
          path: /users/{userId}/addresses/{addressId}
          method: put
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Update address"
          description: "Owner or admin. Replaces the address. The only active address stays the default."
          swaggerTags:
            - Addresses
          bodyType: AddressRequest
          responseData:
            200:
              description: "Updated address"
              bodyType: Address
            403:
              description: "Caller cannot update this address"
            404:
              description: "Address not found"
          documentation:
            summary: Update address
            description: Owner or admin. Replaces the address. The only active address stays the default.
            tags:
              - Addresses
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Updated address
                responseModels:
                  application/json: Address
              - statusCode: "403"
                responseBody:
                  description: Caller cannot update this address
                responseModels:
                  application/json: ErrorResponse
              - statusCode: "404"
                responseBody:
                  description: Address not found
                responseModels:
                  application/json: ErrorResponse
            pathParams:
              - name: userId
                description: userId
                schema:
                  type: string
              - name: addressId
                description: addressId
                schema:
                  type: string
            requestBody:
              description: Owner or admin. Replaces the address. The only active address stays the default.
              required: true
            requestModels:
              application/json: AddressRequest

  deleteAddress:
    handler: src/handlers/addresses.handleDeleteAddress
    events:
      - http:
          path: /users/{userId}/addresses/{addressId}
          method: delete
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Delete address"
          description: "Owner or admin. Soft-deletes the address. If it was the default, another active address is promoted."
          swaggerTags:
            - Addresses
          responseData:
            200:
              description: "Deleted"
            403:
              description: "Caller cannot delete this address"
            404:
              description: "Address not found"
          documentation:
            summary: Delete address
            description: Owner or admin. Soft-deletes the address. If it was the default, another active address is promoted.
            tags:
              - Addresses
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Deleted
              - statusCode: "403"
                responseBody:
                  description: Caller cannot delete this address
                responseModels:
                  application/json: ErrorResponse
              - statusCode: "404"
                responseBody:
                  description: Address not found
                responseModels:
                  application/json: ErrorResponse
            pathParams:
              - name: userId
                description: userId
