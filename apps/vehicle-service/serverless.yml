service: vehicle-service

frameworkVersion: "3"

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-auto-swagger
  - serverless-offline
  - serverless-openapi-documenter

provider:
  name: aws
  runtime: nodejs22.x

  stage: ${opt:stage,'dev'}

  region: ${opt:region,'us-east-1'}

  versionFunctions: false

  environment:
    CORS_ALLOWED_ORIGINS: ${self:custom.corsAllowedOrigins}

    SERVICE_NAME: vehicle-service
    LOG_LEVEL: INFO
    DYNAMODB_TABLE_NAME: vehicle-table-${self:provider.stage}
  
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:BatchGetItem
            - dynamodb:BatchWriteItem
            - dynamodb:TransactWriteItems
            - dynamodb:TransactGetItems
            - dynamodb:DescribeTable
          Resource:
            - !GetAtt VehicleTable.Arn
            - !Join [ "/", [ !GetAtt VehicleTable.Arn, "index", "*" ] ]
        - Effect: Allow
          Action:
            - xray:PutTraceSegments
            - xray:PutTelemetryRecords
          Resource: '*'

custom:
  httpCors: ${file(../../infra/serverless/config/rest-api-cors.yml)}
  corsAllowedOrigins: ${file(../../infra/serverless/config/cors-allowed-origins.yml):value}

  securedAuthorizer: ${file(../../infra/serverless/config/http-api-authorizer.yml)}


  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    concurrency: 10
    plugins: ./esbuild-plugins.js

  autoswagger:
    title: "Beauty on Wheels - Vehicle Service API"
    apiType: http
    basePath: /${self:provider.stage}
    schemes:
      - https
      - http
    generateSwaggerOnDeploy: true
    swaggerFiles:
      - swagger.json
    useStage: true
    swaggerPath: swagger
    typefiles:
      - ./src/types/api-types.d.ts
    excludeStages:
      - production


  documentation:
    version: 1.0.0
    title: Beauty on Wheels - Vehicle Service API
    description: Customer garage vehicles and the canonical vehicle-type list.
    securitySchemes:
      bearerAuth:
        type: http
        scheme: bearer
        bearerFormat: JWT
    security:
      - bearerAuth: []
    servers:
      - url: https://{apiId}.execute-api.us-east-1.amazonaws.com/{stage}
        description: Deployed API Gateway stage
        variables:
          apiId:
            default: localhost
            description: API Gateway id
          stage:
            default: dev
            description: Deployment stage
    tags:
      - name: Vehicles
        description: Vehicles owned by the authenticated customer
    models:
      - name: Vehicle
        description: Customer vehicle
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                userId:
                  type: string
                registrationNumber:
                  type: string
                vehicleType:
                  type: string
                  enum:
                    - HATCHBACK
                    - SEDAN
                    - SUV
                    - MUV
                    - LUXURY
                    - BIKE
                brand:
                  type: string
                model:
                  type: string
                variant:
                  type: string
                color:
                  type: string
                fuelType:
                  type: string
                  enum:
                    - PETROL
                    - DIESEL
                    - EV
                    - HYBRID
                    - CNG
                manufactureYear:
                  type: integer
                defaultVehicle:
                  type: boolean
              required:
                - registrationNumber
                - vehicleType
      - name: VehicleTypeList
        description: Canonical vehicle types. The HTTP body is the platform envelope and data.items is this list.
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: string
                    enum:
                      - HATCHBACK
                      - SEDAN
                      - SUV
                      - MUV
                      - LUXURY
                      - BIKE
      - name: ErrorResponse
        description: Platform error envelope
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                statusCode:
                  type: integer
                message:
                  type: object
                  properties:
                    title:
                      type: string
                    description:
                      type: string
                    severity:
                      type: string
                data:
                  type: object
                  properties: {}
                error:
                  type: object
                  properties:
                    code:
                      type: string
                    details:
                      type: array
                      items:
                        type: object
                        properties:
                          field:
                            type: string
                          message:
                            type: string
                meta:
                  type: object
                  properties:
                    correlationId:
                      type: string
                    timestamp:
                      type: string
                    version:
                      type: string
functions:


  getvehicles:
    handler: src/handlers/vehicles-handler.handleGetvehicles
    events:
      - http:
          path: /vehicles
          method: get
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "List my vehicles"
          description: "Requires a bearer access token. Returns only vehicles owned by the authenticated user. Query status (ACTIVE or INACTIVE) or vehicleType. The platform envelope puts the list at data.items."
          swaggerTags:
            - Vehicles
          responseData:
            200:
              description: "Vehicle list in data.items"
              bodyType: Vehicle
          documentation:
            summary: List my vehicles
            description: Requires a bearer access token. Returns only vehicles owned by the authenticated user. Query status (ACTIVE or INACTIVE) or vehicleType. The platform envelope puts the list at data.items.
            tags:
              - Vehicles
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Vehicle list in data.items
                responseModels:
                  application/json: Vehicle
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse


  postvehicles:
    handler: src/handlers/vehicles-handler.handlePostvehicles
    events:
      - http:
          path: /vehicles
          method: post
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Add vehicle"
          description: "Requires a bearer access token. The vehicle is stored for the authenticated user. A client-supplied userId is ignored. HTTP 200 platform envelope; the vehicle is in data."
          swaggerTags:
            - Vehicles
          bodyType: Vehicle
          responseData:
            200:
              description: "Vehicle created"
          documentation:
            summary: Add vehicle
            description: Requires a bearer access token. The vehicle is stored for the authenticated user. A client-supplied userId is ignored. HTTP 200 platform envelope; the vehicle is in data.
            tags:
              - Vehicles
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Vehicle created
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
            requestBody:
              description: Requires a bearer access token. The vehicle is stored for the authenticated user. A client-supplied userId is ignored. HTTP 200 platform envelope; the vehicle is in data.
              required: true
            requestModels:
              application/json: Vehicle


  getvehicleid:
    handler: src/handlers/vehicles-handler.handleGetvehicleid
    events:
      - http:
          path: /vehicles/{vehicleId}
          method: get
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Get vehicle"
          swaggerTags:
            - Vehicles
          responseData:
            200:
              description: "Vehicle"
              bodyType: Vehicle
          documentation:
            summary: Get vehicle
            description: Get vehicle
            tags:
              - Vehicles
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Vehicle
                responseModels:
                  application/json: Vehicle
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
            pathParams:
              - name: vehicleId
                description: vehicleId
                schema:
                  type: string


  putvehicleid:
    handler: src/handlers/vehicles-handler.handlePutvehicleid
    events:
      - http:
          path: /vehicles/{vehicleId}
          method: put
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Update vehicle"
          swaggerTags:
            - Vehicles
          bodyType: Vehicle
          responseData:
            200:
              description: "Updated"
          documentation:
            summary: Update vehicle
            description: Update vehicle
            tags:
              - Vehicles
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Updated
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
            pathParams:
              - name: vehicleId
                description: vehicleId
                schema:
                  type: string
            requestBody:
              description: Update vehicle
              required: true
            requestModels:
              application/json: Vehicle


  deletevehicleid:
    handler: src/handlers/vehicles-handler.handleDeletevehicleid
    events:
      - http:
          path: /vehicles/{vehicleId}
          method: delete
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Delete vehicle"
          description: "Requires a bearer access token. Deletes a vehicle owned by the authenticated user. Success is HTTP 200 with the platform envelope and data null."
          swaggerTags:
            - Vehicles
          responseData:
            200:
              description: "Deleted"
          documentation:
            summary: Delete vehicle
            description: Requires a bearer access token. Deletes a vehicle owned by the authenticated user. Success is HTTP 200 with the platform envelope and data null.
            tags:
              - Vehicles
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Deleted
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
            pathParams:
              - name: vehicleId
                description: vehicleId
                schema:
                  type: string


  putdefault:
    handler: src/handlers/vehicles-handler.handlePutdefault
    events:
      - http:
          path: /vehicles/{vehicleId}/default
          method: put
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Set default vehicle"
          swaggerTags:
            - Vehicles
          responseData:
            200:
              description: "Default vehicle updated"
          documentation:
            summary: Set default vehicle
            description: Set default vehicle
            tags:
              - Vehicles
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Default vehicle updated
                responseModels:
                  application/json: Vehicle
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
            pathParams:
              - name: vehicleId
                description: vehicleId
                schema:
                  type: string


  getvehicletypes:
    handler: src/handlers/vehicles-handler.handleGetvehicletypes
    events:
      - http:
          path: /vehicle-types
          method: get
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "List supported vehicle types"
          description: "Requires a bearer access token. Canonical success body is the platform envelope. data.items is the vehicle type array. Clients must not expect a bare JSON array."
          swaggerTags:
            - Vehicles
          responseData:
            200:
              description: "Vehicle types in data.items"
              bodyType: VehicleTypeList
          documentation:
            summary: List supported vehicle types
            description: Requires a bearer access token. Canonical success body is the platform envelope. data.items is the vehicle type array. Clients must not expect a bare JSON array.
            tags:
              - Vehicles
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Vehicle types in data.items
                responseModels:
                  application/json: VehicleTypeList
              - statusCode: "400"
                responseBody:
                  description: Request failed
                responseModels:
                  application/json: ErrorResponse
# Deleted legacy root-level iamRoleStatements

resources:
  Resources:
    VehicleTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain

      Properties:
        TableName: vehicle-table-${self:provider.stage}

        BillingMode: PAY_PER_REQUEST

        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

        SSESpecification:
          SSEEnabled: true

        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: false

        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S

          - AttributeName: SK
            AttributeType: S

          - AttributeName: LSI1SK
            AttributeType: S

          - AttributeName: LSI2SK
            AttributeType: S

          - AttributeName: LSI3SK
            AttributeType: S

        KeySchema:
          - AttributeName: PK
            KeyType: HASH

          - AttributeName: SK
            KeyType: RANGE

        LocalSecondaryIndexes:
          - IndexName: StatusIndex

            KeySchema:
              - AttributeName: PK
                KeyType: HASH

              - AttributeName: LSI1SK
                KeyType: RANGE

            Projection:
              ProjectionType: ALL

          - IndexName: VehicleTypeIndex

            KeySchema:
              - AttributeName: PK
                KeyType: HASH

              - AttributeName: LSI2SK
                KeyType: RANGE

            Projection:
              ProjectionType: ALL

          - IndexName: DefaultVehicleIndex

            KeySchema:
              - AttributeName: PK
                KeyType: HASH

              - AttributeName: LSI3SK
                KeyType: RANGE

            Projection:
              ProjectionType: ALL

        Tags:
          - Key: Service
            Value: ${self:service}

          - Key: Environment
            Value: ${self:provider.stage}

          - Key: ManagedBy
            Value: Serverless 
 
    GatewayResponseDefault4XX: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseDefault4XX}

    GatewayResponseDefault5XX: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseDefault5XX}

    GatewayResponseUnauthorized: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseUnauthorized}

    GatewayResponseAccessDenied: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseAccessDenied}

    GatewayResponseMissingAuthenticationToken: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseMissingAuthenticationToken}
    GatewayResponseExpiredToken: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseExpiredToken}
    GatewayResponseIntegrationFailure: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseIntegrationFailure}
    GatewayResponseIntegrationTimeout: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseIntegrationTimeout}

