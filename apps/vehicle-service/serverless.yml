service: vehicle-service

frameworkVersion: "3"

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-auto-swagger
  - serverless-offline

provider:
  name: aws
  runtime: nodejs22.x

  stage: ${opt:stage,'dev'}

  region: ${opt:region,'us-east-1'}

  versionFunctions: false

  environment:

    SERVICE_NAME: vehicle-service
    LOG_LEVEL: INFO
    DYNAMODB_TABLE_NAME: vehicle-table-${self:provider.stage}
  
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:BatchGetItem
            - dynamodb:BatchWriteItem
            - dynamodb:TransactWriteItems
            - dynamodb:TransactGetItems
            - dynamodb:DescribeTable
          Resource:
            - !GetAtt VehicleTable.Arn
            - !Join [ "/", [ !GetAtt VehicleTable.Arn, "index", "*" ] ]
        - Effect: Allow
          Action:
            - xray:PutTraceSegments
            - xray:PutTelemetryRecords
          Resource: '*'

custom:


  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    concurrency: 10
    plugins: ./esbuild-plugins.js

  autoswagger:
    title: "Beauty on Wheels - Vehicle Service API"
    apiType: http
    basePath: /${self:provider.stage}
    schemes:
      - https
      - http
    generateSwaggerOnDeploy: true
    swaggerFiles:
      - swagger.json
    useStage: true
    swaggerPath: swagger
    typefiles:
      - ./src/types/api-types.d.ts
    excludeStages:
      - production


functions:


  getvehicles:
    handler: src/handlers/vehicles-handler.handleGetvehicles
    events:
      - http:
          path: /vehicles
          method: get
          cors: true
          summary: "List my vehicles"
          swaggerTags:
            - Vehicles
          responseData:
            200:
              description: "Vehicle list"


  postvehicles:
    handler: src/handlers/vehicles-handler.handlePostvehicles
    events:
      - http:
          path: /vehicles
          method: post
          cors: true
          summary: "Add vehicle"
          swaggerTags:
            - Vehicles
          bodyType: Vehicle
          responseData:
            201:
              description: "Vehicle created"


  getvehicleid:
    handler: src/handlers/vehicles-handler.handleGetvehicleid
    events:
      - http:
          path: /vehicles/{vehicleId}
          method: get
          cors: true
          summary: "Get vehicle"
          swaggerTags:
            - Vehicles
          responseData:
            200:
              description: "Vehicle"
              bodyType: Vehicle


  putvehicleid:
    handler: src/handlers/vehicles-handler.handlePutvehicleid
    events:
      - http:
          path: /vehicles/{vehicleId}
          method: put
          cors: true
          summary: "Update vehicle"
          swaggerTags:
            - Vehicles
          bodyType: Vehicle
          responseData:
            200:
              description: "Updated"


  deletevehicleid:
    handler: src/handlers/vehicles-handler.handleDeletevehicleid
    events:
      - http:
          path: /vehicles/{vehicleId}
          method: delete
          cors: true
          summary: "Delete vehicle"
          swaggerTags:
            - Vehicles
          responseData:
            204:
              description: "Deleted"


  putdefault:
    handler: src/handlers/vehicles-handler.handlePutdefault
    events:
      - http:
          path: /vehicles/{vehicleId}/default
          method: put
          cors: true
          summary: "Set default vehicle"
          swaggerTags:
            - Vehicles
          responseData:
            200:
              description: "Default vehicle updated"


  getvehicletypes:
    handler: src/handlers/vehicles-handler.handleGetvehicletypes
    events:
      - http:
          path: /vehicle-types
          method: get
          cors: true
          summary: "List supported vehicle types"
          swaggerTags:
            - Vehicles
          responseData:
            200:
              description: "Vehicle types"
# Deleted legacy root-level iamRoleStatements

resources:
  Resources:
    VehicleTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain

      Properties:
        TableName: vehicle-table-${self:provider.stage}

        BillingMode: PAY_PER_REQUEST

        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

        SSESpecification:
          SSEEnabled: true

        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: false

        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S

          - AttributeName: SK
            AttributeType: S

          - AttributeName: LSI1SK
            AttributeType: S

          - AttributeName: LSI2SK
            AttributeType: S

          - AttributeName: LSI3SK
            AttributeType: S

        KeySchema:
          - AttributeName: PK
            KeyType: HASH

          - AttributeName: SK
            KeyType: RANGE

        LocalSecondaryIndexes:
          - IndexName: StatusIndex

            KeySchema:
              - AttributeName: PK
                KeyType: HASH

              - AttributeName: LSI1SK
                KeyType: RANGE

            Projection:
              ProjectionType: ALL

          - IndexName: VehicleTypeIndex

            KeySchema:
              - AttributeName: PK
                KeyType: HASH

              - AttributeName: LSI2SK
                KeyType: RANGE

            Projection:
              ProjectionType: ALL

          - IndexName: DefaultVehicleIndex

            KeySchema:
              - AttributeName: PK
                KeyType: HASH

              - AttributeName: LSI3SK
                KeyType: RANGE

            Projection:
              ProjectionType: ALL

        Tags:
          - Key: Service
            Value: ${self:service}

          - Key: Environment
            Value: ${self:provider.stage}

          - Key: ManagedBy
            Value: Serverless 
 
    GatewayResponseDefault4XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: DEFAULT_4XX
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: >-
            'Content-Type,Authorization,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent,Sec-Ch-Ua,Sec-Ch-Ua-Mobile,Sec-Ch-Ua-Platform'
          gatewayresponse.header.Access-Control-Allow-Methods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"

    GatewayResponseDefault5XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: DEFAULT_5XX
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: >-
            'Content-Type,Authorization,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent,Sec-Ch-Ua,Sec-Ch-Ua-Mobile,Sec-Ch-Ua-Platform'
          gatewayresponse.header.Access-Control-Allow-Methods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"

    GatewayResponseUnauthorized:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: UNAUTHORIZED
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: >-
            'Content-Type,Authorization,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent,Sec-Ch-Ua,Sec-Ch-Ua-Mobile,Sec-Ch-Ua-Platform'
          gatewayresponse.header.Access-Control-Allow-Methods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"

    GatewayResponseAccessDenied:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: ACCESS_DENIED
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: >-
            'Content-Type,Authorization,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent,Sec-Ch-Ua,Sec-Ch-Ua-Mobile,Sec-Ch-Ua-Platform'
          gatewayresponse.header.Access-Control-Allow-Methods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"