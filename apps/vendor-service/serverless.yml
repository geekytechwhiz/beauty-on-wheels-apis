service: vendor-service

frameworkVersion: "3"

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-auto-swagger
  - serverless-offline 
provider:
  name: aws
  runtime: nodejs22.x

  stage: ${opt:stage,'dev'}

  region: ${opt:region,'us-east-1'}

  versionFunctions: false

  environment:

    SERVICE_NAME: vendor-service
    LOG_LEVEL:  INFO
    DYNAMODB_TABLE_NAME: vendor-service-${self:provider.stage} 

custom:


  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    concurrency: 10
    plugins: ./esbuild-plugins.js

  autoswagger:
    title: "Beauty on Wheels - Vendor Service API"
    apiType: http
    basePath: /${self:provider.stage}
    schemes:
      - https
      - http
    generateSwaggerOnDeploy: true
    swaggerFiles:
      - swagger.json
    useStage: true
    swaggerPath: swagger
    typefiles:
      - ./src/types/api-types.d.ts
    excludeStages:
      - production


functions:


  createvendor:
    handler: src/handlers/vendors.handler.handleCreatevendor
    events:
      - http:
          path: /vendors
          method: post
          cors: true
          summary: "Create vendor"
          description: "Creates a new vendor profile.\n\nThe authenticated identity should be linked to the vendor through ownerUserId.\nVendor creation does not automatically activate the vendor.\n"
          swaggerTags:
            - Vendors
          bodyType: CreateVendorRequest
          responseData:
            201:
              description: "Vendor created successfully"
              bodyType: VendorResponse
            400:
              description: ""
            401:
              description: ""
            409:
              description: ""
            500:
              description: ""


  listvendors:
