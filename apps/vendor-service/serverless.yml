service: aps1dev-carish-vendor

frameworkVersion: "3"

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-auto-swagger
  - serverless-offline
  - serverless-openapi-documenter
  # Keep the generated CloudFormation template below its 500-resource limit.
  # stacks-map nests GatewayResponse/Permission; strip-log-groups drops
  # per-function LogGroups that cannot be force-migrated (name collisions).
  - serverless-plugin-split-stacks
  - ./strip-log-groups.js
provider:
  name: aws
  runtime: nodejs22.x
  profile:  carish-new
  stage: ${opt:stage,'dev'}

  region: ${opt:region,'ap-south-1'}

  versionFunctions: false

  environment:
    CORS_ALLOWED_ORIGINS: ${self:custom.corsAllowedOrigins}

    SERVICE_NAME: vendor-service
    LOG_LEVEL: INFO
    REGION: ${self:provider.region}
    DEFAULT_REGION: ${self:provider.region}
    # Must match VendorTable.TableName / VendorDocumentsBucket.BucketName exactly.
    # Drift here causes AccessDenied on GSI Query (IAM grants the CFN table ARN).
    DYNAMODB_TABLE_NAME: ${self:custom.vendorTableName}
    USER_TABLE_NAME: user-${self:provider.stage}
    IDENTITY_TABLE: identity-table-${self:provider.stage}
    DOCUMENT_BUCKET: ${self:custom.vendorDocumentsBucketName}
    DOCUMENTS_BUCKET_NAME: ${self:custom.vendorDocumentsBucketName}
    DOCUMENT_UPLOAD_URL_EXPIRY: ${env:DOCUMENT_UPLOAD_URL_EXPIRY, '900'}
    DOCUMENT_DOWNLOAD_URL_EXPIRY: ${env:DOCUMENT_DOWNLOAD_URL_EXPIRY, '900'}
    DOCUMENT_MAX_FILE_SIZE: ${env:DOCUMENT_MAX_FILE_SIZE, '10485760'}
    DOCUMENT_ALLOWED_CONTENT_TYPES: ${env:DOCUMENT_ALLOWED_CONTENT_TYPES, 'application/pdf,image/jpeg,image/png'}
    EVENT_BUS_NAME: ${self:custom.vendorEventBusName}
    COGNITO_REGION: ${self:provider.region}
    # Identity owns the user pool; ImportValue keeps new-account deploys on the live pool.
    COGNITO_USER_POOL_ID:
      Fn::ImportValue: ${self:custom.resourcePrefix}-identity-cognito-user-pool-id
    COGNITO_APP_CLIENT_ID:
      Fn::ImportValue: ${self:custom.resourcePrefix}-identity-cognito-app-client-id
    COGNITO_ISSUER:
      Fn::Join:
        - ''
        - - https://cognito-idp.
          - !Ref AWS::Region
          - .amazonaws.com/
          - Fn::ImportValue: ${self:custom.resourcePrefix}-identity-cognito-user-pool-id
    COGNITO_JWKS_URI:
      Fn::Join:
        - ''
        - - https://cognito-idp.
          - !Ref AWS::Region
          - .amazonaws.com/
          - Fn::ImportValue: ${self:custom.resourcePrefix}-identity-cognito-user-pool-id
          - /.well-known/jwks.json
    CATALOG_BASE_URL: ${env:CATALOG_BASE_URL, ''}
    CATALOG_BOOKING_READINESS_FUNCTION: service-catalog-service-${self:provider.stage}-getBookingReadinessFacts
    AVAILABILITY_BOOKING_READINESS_FUNCTION: availability-service-${self:provider.stage}-getBookingReadinessFacts

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource:
            - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:provider.environment.CATALOG_BOOKING_READINESS_FUNCTION}
            - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:provider.environment.AVAILABILITY_BOOKING_READINESS_FUNCTION}
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:BatchGetItem
            - dynamodb:BatchWriteItem
            - dynamodb:TransactWriteItems
            - dynamodb:TransactGetItems
            - dynamodb:DescribeTable
            - dynamodb:ConditionCheckItem
          Resource:
            - !GetAtt VendorTable.Arn
            - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${self:provider.environment.USER_TABLE_NAME}
            - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${self:provider.environment.USER_TABLE_NAME}/index/*
            - !Join [ "/", [ !GetAtt VendorTable.Arn, "index", "*" ] ]
        - Effect: Allow
          Action:
            - dynamodb:GetItem
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/identity-table-${self:provider.stage}
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource:
            - !Join [ "", [ !GetAtt VendorDocumentsBucket.Arn, "/vendors/*" ] ]
        - Effect: Allow
          Action:
            - xray:PutTraceSegments
            - xray:PutTelemetryRecords
          Resource: '*'
        - Effect: Allow
          Action:
            - events:PutEvents
          Resource:
            - !GetAtt VendorEventBus.Arn
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource:
            - !GetAtt VendorEmailVerificationStreamDlq.Arn
            - !GetAtt VendorBookingReadinessEventDlq.Arn

custom:
  # Split generated resources by CloudFormation type. Keep this strategy stable:
  # changing it for an existing stage can require recreating that stage.
  # stacks-map.js nests GatewayResponse / Permission for NEW resources.
  # Methods must remain in the parent stack: protected methods reference the
  # parent authorizer, which itself references the nested REST API.
  # only (no force:true — force recreate fails with "already exists" on this stage).
  splitStacks:
    perFunction: false
    perType: true
    perGroupFunction: false
    stackConcurrency: 5
    custom: ./stacks-map.js

  httpCors: ${file(../../infra/serverless/config/rest-api-cors.yml)}
  corsAllowedOrigins: ${file(../../infra/serverless/config/cors-allowed-origins.yml):value}
  # nv{stage}-bw-  e.g. nvdev-bw-
  resourcePrefix: nv${self:provider.stage}-bw
  vendorEventBusName: ${self:custom.resourcePrefix}-vendor-event-bus
  # Single source of truth for physical resource names (env + CFN Properties).
  vendorTableName: ${sls:stage}-vendor
  vendorDocumentsBucketName: ${self:service}-vendor-documents-${sls:stage}

  securedAuthorizer: ${file(../../infra/serverless/config/http-api-authorizer.yml)}

  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    concurrency: 10
    plugins: ./esbuild-plugins.js

  autoswagger:
    title: "Beauty on Wheels - Vendor Service API"
    apiType: http
    basePath: /${self:provider.stage}
    schemes:
      - https
      - http
    generateSwaggerOnDeploy: true
    swaggerFiles:
      - swagger.json
    useStage: true
    swaggerPath: swagger
    typefiles:
      - ./src/types/api-types.d.ts
    excludeStages:
      - production


  documentation:
    version: 1.0.0
    title: Beauty on Wheels - Vendor Service API
    description: Vendor profiles, onboarding, communities, service areas, staff, crews, capabilities, branches, documents, and bank details.
    securitySchemes:
      bearerAuth:
        type: http
        scheme: bearer
        bearerFormat: JWT
    security:
      - bearerAuth: []
    servers:
      - url: https://{apiId}.execute-api.ap-south-1.amazonaws.com/{stage}
        description: Deployed API Gateway stage
        variables:
          apiId:
            default: localhost
            description: API Gateway id
          stage:
            default: dev
            description: Deployment stage
    tags:
      - name: Vendors
        description: Vendor profile and lifecycle
      - name: Onboarding
        description: Vendor onboarding
      - name: Communities
        description: Vendor community assignment
      - name: Service Areas
        description: Geographic service areas
      - name: Operating Hours
        description: Weekly operating hours
      - name: Staff
        description: Vendor staff
      - name: Crews
        description: Vendor crews. A van label is text only. Scheduling is not stored here.
      - name: Capabilities
        description: Vehicle types, services, and packages the vendor offers
      - name: Branches
        description: Vendor branches
      - name: Documents
        description: Onboarding documents
      - name: Bank Details
        description: Payout bank account
    models:
      - name: CreateVendorRequest
        description: Initial vendor registration. One request stores the vendor and any supplied capabilities, requested community coverage, operating preferences, and indicative capacity. PAN, GST, documents, and bank details are not required. washMethodIds are stored as capability ids (wash:EXTERIOR). businessInfo.locality is accepted only as an alias of businessInfo.location.locality.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                businessInfo:
                  type: object
                  additionalProperties: false
                  properties:
                    businessName:
                      type: string
                      minLength: 2
                      maxLength: 150
                    contactName:
                      type: string
                    phoneNumber:
                      type: string
                      description: Ignored for REGISTRANT. The verified Identity phone is stored instead.
                    email:
                      type: string
                    description:
                      type: string
                    gstNumber:
                      type: string
                    panNumber:
                      type: string
                    profileImageUrl:
                      type: string
                    businessType:
                      type: string
                      enum:
                        - INDIVIDUAL
                        - BUSINESS
                    locality:
                      type: string
                      description: Compatibility alias of location.locality. Rejected with 400 when both are present and differ. Not stored as a second field.
                    location:
                      type: object
                      additionalProperties: false
                      required:
                        - postalCode
                      properties:
                        addressLine1:
                          type: string
                          maxLength: 200
                        addressLine2:
                          type: string
                          maxLength: 200
                        landmark:
                          type: string
                          maxLength: 100
                        locality:
                          type: string
                        city:
                          type: string
                          description: Checked against the postal directory. The stored city comes from that directory.
                        district:
                          type: string
                        state:
                          type: string
                        postalCode:
                          type: string
                          pattern: '^[1-9][0-9]{5}$'
                          description: India PIN. Locality, city, district, state, and country are stored from the community directory for this PIN.
                        countryCode:
                          type: string
                          minLength: 2
                          maxLength: 2
                          default: IN
                ownerDetails:
                  type: object
                  additionalProperties: false
                  properties:
                    userId:
                      type: string
                      description: Ignored. The owner id is the verified application user.
                    fullName:
                      type: string
                    designation:
                      type: string
                    email:
                      type: string
                    phoneNumber:
                      type: string
                      description: Ignored for REGISTRANT. The verified Identity phone is stored instead.
                capabilities:
                  type: object
                  additionalProperties: false
                  required:
                    - vehicleTypes
                    - serviceIds
                    - packageIds
                    - washMethodIds
                  properties:
                    vehicleTypes:
                      type: array
                      items:
                        type: string
                        enum:
                          - HATCHBACK
                          - SEDAN
                          - SUV
                          - MUV
                          - LUXURY
                          - BIKE
                    serviceIds:
                      type: array
                      items:
                        type: string
                      description: Catalog offering ids. Partner prices are not accepted.
                    packageIds:
                      type: array
                      items:
                        type: string
                    washMethodIds:
                      type: array
                      items:
                        type: string
                      description: Capability id (wash:EXTERIOR) or stable code (EXTERIOR). Display labels are rejected. Stored as capability ids on washMethods.
                communityCoverage:
                  type: object
                  additionalProperties: false
                  required:
                    - communityIds
                  properties:
                    communityIds:
                      type: array
                      maxItems: 25
                      items:
                        type: string
                      description: Active community ids. Saved as REQUESTED. Creation never approves coverage.
                operatingPreferences:
                  type: object
                  additionalProperties: false
                  required:
                    - serviceWindowIds
                  properties:
                    serviceWindowIds:
                      type: array
                      items:
                        type: string
                        enum:
                          - morning
                          - anytime
                          - weekday_morning
                          - weekend_day
                          - night
                      description: Service-window ids. This is not the day-of-week operating-hours resource.
                initialCapacity:
                  type: object
                  additionalProperties: false
                  description: Indicative planning figures. This does not create a capacity commitment.
                  required:
                    - activeCrewCount
                    - indicativeVisitsPerWeek
                  properties:
                    activeCrewCount:
                      type: integer
                      minimum: 0
                      maximum: 1000
                    indicativeVisitsPerWeek:
                      type: integer
                      minimum: 0
                      maximum: 100000
            example:
              businessInfo:
                businessName: Carish Test Partner
                businessType: BUSINESS
                contactName: Carish Contact
                phoneNumber: "9037243199"
                email: info.carish@gmail.com
                location:
                  addressLine1: ""
                  addressLine2: ""
                  landmark: ""
                  locality: Palarivattom
                  city: Kochi
                  district: Ernakulam
                  state: Kerala
                  postalCode: "682021"
                  countryCode: IN
              ownerDetails:
                fullName: Carish Contact
                email: info.carish@gmail.com
                phoneNumber: "9037243199"
              capabilities:
                vehicleTypes:
                  - HATCHBACK
                  - SEDAN
                  - SUV
                serviceIds: []
                packageIds: []
                washMethodIds: []
              communityCoverage:
                communityIds: []
              operatingPreferences:
                serviceWindowIds: []
              initialCapacity:
                activeCrewCount: 2
                indicativeVisitsPerWeek: 20
      - name: UpdateVendorRequest
        description: Partial business and contact fields on the vendor profile. Address, owner, bank, documents, and coverage use their own routes.
        content:
          application/json:
            schema:
              type: object
              properties:
                businessType:
                  type: string
                  enum:
                    - INDIVIDUAL
                    - BUSINESS
                businessName:
                  type: string
                contactName:
                  type: string
                phoneNumber:
                  type: string
                email:
                  type: string
                description:
                  type: string
                gstNumber:
                  type: string
                panNumber:
                  type: string
                profileImageUrl:
                  type: string
      - name: AcceptVendorDetailsRequest
        description: Manager confirmation of the currently saved support-prepared vendor profile revision.
        content:
          application/json:
            schema:
              type: object
              properties:
                revision:
                  type: integer
                  minimum: 0
                  description: Revision returned by GET /vendors/{vendorId}.
              required:
                - revision
      - name: UpdateVendorStatusRequest
        description: Admin vendor status change
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - PENDING_VERIFICATION
                    - ACTIVE
                    - SUSPENDED
                    - INACTIVE
                    - REJECTED
                reason:
                  type: string
              required:
                - status
      - name: ApproveVendorRequest
        description: Approve a vendor
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      - name: RejectVendorRequest
        description: Reject a vendor
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
              required:
                - reason
      - name: UpdateOperationalStatusRequest
        description: Vendor operational status
        content:
          application/json:
            schema:
              type: object
              properties:
                operationalStatus:
                  type: string
                  enum:
                    - ONLINE
                    - OFFLINE
                    - BUSY
                    - TEMPORARILY_UNAVAILABLE
              required:
                - operationalStatus
      - name: VendorResponse
        description: Vendor profile
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    vendorId:
                      type: string
                    ownerUserId:
                      type: string
                    businessType:
                      type: string
                      enum:
                        - INDIVIDUAL
                        - BUSINESS
                    businessName:
                      type: string
                    contactName:
                      type: string
                    phoneNumber:
                      type: string
                    email:
                      type: string
                    description:
                      type: string
                    profileImageUrl:
                      type: string
                    gstNumber:
                      type: string
                    panNumber:
                      type: string
                    address:
                      type: object
                      properties:
                        addressLine1:
                          type: string
                        addressLine2:
                          type: string
                        landmark:
                          type: string
                        city:
                          type: string
                        state:
                          type: string
                        country:
                          type: string
                        postalCode:
                          type: string
                      required:
                        - addressLine1
                        - city
                        - state
                        - country
                        - postalCode
                    geoLocation:
                      type: object
                      properties:
                        latitude:
                          type: number
                        longitude:
                          type: number
                      required:
                        - latitude
                        - longitude
                    status:
                      type: string
                      enum:
                        - PENDING_VERIFICATION
                        - ACTIVE
                        - SUSPENDED
                        - INACTIVE
                        - REJECTED
                    operationalStatus:
                      type: string
                      enum:
                        - ONLINE
                        - OFFLINE
                        - BUSY
                        - TEMPORARILY_UNAVAILABLE
                    onboardingStatus:
                      type: string
                      enum:
                        - DRAFT
                        - IN_PROGRESS
                        - COMPLETED
                        - PENDING_REVIEW
                    currentSection:
                      type: string
                      enum:
                        - BUSINESS_INFO
                        - OWNER_DETAILS
                        - ADDRESS
                        - BRANCH
                        - DOCUMENTS
                        - BANK_DETAILS
                    completedSections:
                      type: array
                      items:
                        type: string
                        enum:
                          - BUSINESS_INFO
                          - OWNER_DETAILS
                          - ADDRESS
                          - BRANCH
                          - DOCUMENTS
                          - BANK_DETAILS
                    applicationId:
                      type: string
                    communityIds:
                      type: array
                      items:
                        type: string
                    onboarding:
                      type: object
                      description: Saved initial sections. Community approvalStatus is REQUESTED until an admin decides. initialCapacity.capacityKind is indicative and is not a commitment. capabilities.washMethods are the stored form of washMethodIds.
                      properties:
                        location:
                          type: object
                          nullable: true
                        capabilities:
                          type: object
                        communityCoverage:
                          type: object
                        operatingPreferences:
                          type: object
                        initialCapacity:
                          type: object
                          nullable: true
                    createdAt:
                      type: string
                    updatedAt:
                      type: string
      - name: VendorListResponse
        description: Vendor page
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      vendorId:
                        type: string
                      ownerUserId:
                        type: string
                      businessType:
                        type: string
                        enum:
                          - INDIVIDUAL
                          - BUSINESS
                      businessName:
                        type: string
                      contactName:
                        type: string
                      phoneNumber:
                        type: string
                      email:
                        type: string
                      description:
                        type: string
                      profileImageUrl:
                        type: string
                      gstNumber:
                        type: string
                      panNumber:
                        type: string
                      address:
                        type: object
                        properties:
                          addressLine1:
                            type: string
                          addressLine2:
                            type: string
                          landmark:
                            type: string
                          city:
                            type: string
                          state:
                            type: string
                          country:
                            type: string
                          postalCode:
                            type: string
                        required:
                          - addressLine1
                          - city
                          - state
                          - country
                          - postalCode
                      geoLocation:
                        type: object
                        properties:
                          latitude:
                            type: number
                          longitude:
                            type: number
                        required:
                          - latitude
                          - longitude
                      status:
                        type: string
                        enum:
                          - PENDING_VERIFICATION
                          - ACTIVE
                          - SUSPENDED
                          - INACTIVE
                          - REJECTED
                      operationalStatus:
                        type: string
                        enum:
                          - ONLINE
                          - OFFLINE
                          - BUSY
                          - TEMPORARILY_UNAVAILABLE
                      onboardingStatus:
                        type: string
                        enum:
                          - DRAFT
                          - IN_PROGRESS
                          - COMPLETED
                          - PENDING_REVIEW
                      currentSection:
                        type: string
                        enum:
                          - BUSINESS_INFO
                          - OWNER_DETAILS
                          - ADDRESS
                          - BRANCH
                          - DOCUMENTS
                          - BANK_DETAILS
                      completedSections:
                        type: array
                        items:
                          type: string
                          enum:
                            - BUSINESS_INFO
                            - OWNER_DETAILS
                            - ADDRESS
                            - BRANCH
                            - DOCUMENTS
                            - BANK_DETAILS
                      applicationId:
                        type: string
                      communityIds:
                        type: array
                        items:
                          type: string
                      createdAt:
                        type: string
                      updatedAt:
                        type: string
                pagination:
                  type: object
                  properties:
                    nextCursor:
                      type: string
                    hasMore:
                      type: boolean
      - name: VendorSelfLookup
        description: Whether the caller owns a vendor and what to do next
        content:
          application/json:
            schema:
              type: object
              properties:
                hasVendor:
                  type: boolean
                vendorId:
                  type: string
                status:
                  type: string
                onboarding:
                  type: object
                  properties:
                    currentStep:
                      type: string
                      enum:
                        - BUSINESS_INFO
                        - OWNER_DETAILS
                        - ADDRESS
                        - BRANCH
                        - DOCUMENTS
                        - BANK_DETAILS
                    completed:
                      type: boolean
                nextAction:
                  type: string
                  enum:
                    - START_ONBOARDING
                    - RESUME_ONBOARDING
                    - VIEW_APPLICATION_STATUS
                    - OPEN_VENDOR_DASHBOARD
                    - COMPLETE_VENDOR_SETUP
                    - VIEW_ACCOUNT_STATUS
                    - CORRECT_APPLICATION
                membership:
                  type: object
                  properties:
                    role:
                      type: string
                      enum:
                        - owner
              required:
                - hasVendor
                - nextAction
      - name: UpdateOnboardingRequest
        description: Atomically save one or more mutable onboarding sections.
        content:
          application/json:
            schema:
              type: object
              properties:
                revision:
                  type: integer
                  minimum: 0
                  description: Revision returned by the previous onboarding read or update.
                sections:
                  type: object
                  properties:
                    BUSINESS_INFO:
                      type: object
                      properties:
                        businessType:
                          type: string
                          enum: [INDIVIDUAL, BUSINESS]
                        businessName: { type: string }
                        contactName: { type: string }
                        phoneNumber: { type: string }
                        email: { type: string, nullable: true }
                        description: { type: string, nullable: true }
                        gstNumber: { type: string, nullable: true }
                        panNumber: { type: string, nullable: true }
                        profileImageUrl: { type: string, format: uri, nullable: true }
                    COMMUNITIES:
                      type: object
                      properties:
                        communityIds:
                          type: array
                          minItems: 0
                          maxItems: 25
                          items: { type: string }
                      required: [communityIds]
                    BANK_DETAILS:
                      type: object
                      properties:
                        accountHolderName: { type: string }
                        accountNumber: { type: string, nullable: true }
                        ifscCode: { type: string, nullable: true }
                        bankName: { type: string }
                        branchName: { type: string, nullable: true }
                        accountType: { type: string, enum: [SAVINGS, CURRENT], nullable: true }
                  minProperties: 1
                lastVisitedStep:
                  type: string
                  enum: [BUSINESS_INFO, COMMUNITIES, DOCUMENTS, BANK_DETAILS]
              required:
                - revision
                - sections
      - name: OnboardingResponse
        description: Onboarding progress and saved sections
        content:
          application/json:
            schema:
              type: object
              properties:
                vendorId:
                  type: string
                status:
                  type: string
                  enum:
                    - DRAFT
                    - IN_PROGRESS
                    - AWAITING_EMAIL_VERIFICATION
                    - PENDING_REVIEW
                    - CHANGES_REQUESTED
                    - COMPLETED
                currentSection:
                  type: string
                  enum:
                    - BUSINESS_INFO
                    - COMMUNITIES
                    - DOCUMENTS
                    - BANK_DETAILS
                completedSections:
                  type: array
                  items:
                    type: string
                    enum:
                      - BUSINESS_INFO
                      - COMMUNITIES
                      - DOCUMENTS
                      - BANK_DETAILS
                applicationId:
                  type: string
                revision:
                  type: integer
                  minimum: 0
                lastVisitedStep:
                  type: string
                  enum: [BUSINESS_INFO, COMMUNITIES, DOCUMENTS, BANK_DETAILS]
                requiredSections:
                  type: array
                  items:
                    type: string
                    enum: [BUSINESS_INFO, COMMUNITIES, DOCUMENTS, BANK_DETAILS]
                incompleteSections:
                  type: array
                  items:
                    type: string
                    enum: [BUSINESS_INFO, COMMUNITIES, DOCUMENTS, BANK_DETAILS]
                recommendedNextStep:
                  type: string
                  enum: [BUSINESS_INFO, COMMUNITIES, DOCUMENTS, BANK_DETAILS]
                sections:
                  type: object
                  properties:
                    BUSINESS_INFO: { type: object }
                    COMMUNITIES:
                      type: array
                      items:
                        type: object
                        properties:
                          communityId: { type: string }
                        required: [communityId]
                    DOCUMENTS:
                      type: array
                      items: { type: object }
                    BANK_DETAILS: { type: object }
              required: [vendorId, status, currentSection, completedSections, revision, sections]
      - name: VendorStatusHistoryList
