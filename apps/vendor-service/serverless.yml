  # Single vendor-table stream consumer (account provisioning + email verification).
  # Physical name retained for in-place ESM updates: *-vendor-email-verification-stream.
  onVendorEmailVerificationRequested:
    handler: src/handlers/vendor-email-verification-stream.handler
    name: ${self:custom.resourcePrefix}-vendor-email-verification-stream
    description: Consolidated vendor PROFILE stream — account provisioning request + email verification publish
    timeout: 60
    events:
      - stream:
          type: dynamodb
          arn: !GetAtt VendorTable.StreamArn
          filterPatterns:
            - eventName:
                - INSERT
                - MODIFY
              dynamodb:
                NewImage:
                  entityType:
                    S:
                      - Vendor
                  SK:
                    S:
                      - PROFILE
          batchSize: 10
          startingPosition: LATEST
          bisectBatchOnFunctionError: true
          maximumRetryAttempts: 3
          functionResponseType: ReportBatchItemFailures
          destinations:
            onFailure:
              arn: !GetAtt VendorEmailVerificationStreamDlq.Arn
              type: sqs

