service: vendor-service-api

frameworkVersion: "3"

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-auto-swagger
  - serverless-offline
  - serverless-openapi-documenter 
provider:
  name: aws
  runtime: nodejs22.x

  stage: ${opt:stage,'dev'}

  region: ${opt:region,'us-east-1'}

  versionFunctions: false

  environment:
    CORS_ALLOWED_ORIGINS: ${self:custom.corsAllowedOrigins}

    SERVICE_NAME: vendor-service
    LOG_LEVEL: INFO
    DYNAMODB_TABLE_NAME: ${self:service}-${self:provider.stage}-vendor
    IDENTITY_TABLE: identity-table-${self:provider.stage}
    DOCUMENT_BUCKET: ${self:service}-${self:provider.stage}-vendor-documents
    DOCUMENTS_BUCKET_NAME: ${self:service}-${self:provider.stage}-vendor-documents
    DOCUMENT_UPLOAD_URL_EXPIRY: ${env:DOCUMENT_UPLOAD_URL_EXPIRY, '900'}
    DOCUMENT_DOWNLOAD_URL_EXPIRY: ${env:DOCUMENT_DOWNLOAD_URL_EXPIRY, '900'}
    DOCUMENT_MAX_FILE_SIZE: ${env:DOCUMENT_MAX_FILE_SIZE, '10485760'}
    DOCUMENT_ALLOWED_CONTENT_TYPES: ${env:DOCUMENT_ALLOWED_CONTENT_TYPES, 'application/pdf,image/jpeg,image/png'}
    EVENT_BUS_NAME: ${self:custom.vendorEventBusName}
    COGNITO_REGION: ${self:provider.region}
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID, 'us-east-1_LeQxyLZ3x'}
    COGNITO_APP_CLIENT_ID: ${env:COGNITO_APP_CLIENT_ID, '3p3fj5dq1m41cn2b7mbono23qo'}
    COGNITO_ISSUER: https://cognito-idp.${self:provider.region}.amazonaws.com/${env:COGNITO_USER_POOL_ID, 'us-east-1_LeQxyLZ3x'}
    COGNITO_JWKS_URI: https://cognito-idp.${self:provider.region}.amazonaws.com/${env:COGNITO_USER_POOL_ID, 'us-east-1_LeQxyLZ3x'}/.well-known/jwks.json
    CATALOG_BASE_URL: ${env:CATALOG_BASE_URL, ''}
    CATALOG_BOOKING_READINESS_FUNCTION: service-catalog-service-${self:provider.stage}-getBookingReadinessFacts
    AVAILABILITY_BOOKING_READINESS_FUNCTION: availability-service-${self:provider.stage}-getBookingReadinessFacts

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource:
            - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:provider.environment.CATALOG_BOOKING_READINESS_FUNCTION}
            - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:provider.environment.AVAILABILITY_BOOKING_READINESS_FUNCTION}
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:BatchGetItem
            - dynamodb:BatchWriteItem
            - dynamodb:TransactWriteItems
            - dynamodb:TransactGetItems
            - dynamodb:DescribeTable
            - dynamodb:ConditionCheckItem
          Resource:
            - !GetAtt VendorTable.Arn
            - !Join [ "/", [ !GetAtt VendorTable.Arn, "index", "*" ] ]
        - Effect: Allow
          Action:
            - dynamodb:GetItem
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/identity-table-${self:provider.stage}
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource:
            - !Join [ "", [ !GetAtt VendorDocumentsBucket.Arn, "/vendors/*" ] ]
        - Effect: Allow
          Action:
            - xray:PutTraceSegments
            - xray:PutTelemetryRecords
          Resource: '*'
        - Effect: Allow
          Action:
            - events:PutEvents
          Resource:
            - !GetAtt VendorEventBus.Arn
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource:
            - !GetAtt VendorOnboardingStreamDlq.Arn
            - !GetAtt VendorEmailVerificationStreamDlq.Arn
            - !GetAtt VendorEmailVerifiedStreamDlq.Arn
            - !GetAtt VendorLifecycleStreamDlq.Arn 
            - !GetAtt VendorBookingReadinessStreamDlq.Arn
            - !GetAtt VendorBookingReadinessEventDlq.Arn

custom:
  httpCors: ${file(../../infra/serverless/config/rest-api-cors.yml)}
  corsAllowedOrigins: ${file(../../infra/serverless/config/cors-allowed-origins.yml):value}
  # nv{stage}-bw-  e.g. nvdev-bw-
  resourcePrefix: nv${self:provider.stage}-bw
  vendorEventBusName: ${self:custom.resourcePrefix}-vendor-event-bus

  securedAuthorizer: ${file(../../infra/serverless/config/http-api-authorizer.yml)}

  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    concurrency: 10
    plugins: ./esbuild-plugins.js

  autoswagger:
    title: "Beauty on Wheels - Vendor Service API"
    apiType: http
    basePath: /${self:provider.stage}
    schemes:
      - https
      - http
    generateSwaggerOnDeploy: true
    swaggerFiles:
      - swagger.json
    useStage: true
    swaggerPath: swagger
    typefiles:
      - ./src/types/api-types.d.ts
    excludeStages:
      - production


  documentation:
    version: 1.0.0
    title: Beauty on Wheels - Vendor Service API
    description: Vendor profiles, onboarding, communities, service areas, staff, crews, capabilities, branches, documents, and bank details.
    securitySchemes:
      bearerAuth:
        type: http
        scheme: bearer
        bearerFormat: JWT
    security:
      - bearerAuth: []
    servers:
      - url: https://{apiId}.execute-api.us-east-1.amazonaws.com/{stage}
        description: Deployed API Gateway stage
        variables:
          apiId:
            default: localhost
            description: API Gateway id
          stage:
            default: dev
            description: Deployment stage
    tags:
      - name: Vendors
        description: Vendor profile and lifecycle
      - name: Onboarding
        description: Vendor onboarding
      - name: Communities
        description: Vendor community assignment
      - name: Service Areas
        description: Geographic service areas
      - name: Operating Hours
        description: Weekly operating hours
      - name: Staff
        description: Vendor staff
      - name: Crews
        description: Vendor crews. A van label is text only. Scheduling is not stored here.
      - name: Capabilities
        description: Vehicle types, services, and packages the vendor offers
      - name: Branches
        description: Vendor branches
      - name: Documents
        description: Onboarding documents
      - name: Bank Details
        description: Payout bank account
    models:
      - name: CreateVendorRequest
        description: Create a vendor
        content:
          application/json:
            schema:
              type: object
              properties:
                businessName:
                  type: string
                contactName:
                  type: string
                phoneNumber:
                  type: string
                email:
                  type: string
                description:
                  type: string
                gstNumber:
                  type: string
                panNumber:
                  type: string
                profileImageUrl:
                  type: string
                businessType:
                  type: string
                  enum:
                    - INDIVIDUAL
                    - BUSINESS
              required:
                - businessName
                - contactName
      - name: UpdateVendorRequest
        description: Patch vendor profile fields
        content:
          application/json:
            schema:
              type: object
              properties:
                businessName:
                  type: string
                contactName:
                  type: string
                phoneNumber:
                  type: string
                email:
                  type: string
                description:
                  type: string
                profileImageUrl:
                  type: string
      - name: UpdateVendorStatusRequest
        description: Admin vendor status change
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - PENDING_VERIFICATION
                    - ACTIVE
                    - SUSPENDED
                    - INACTIVE
                    - REJECTED
                reason:
                  type: string
              required:
                - status
      - name: ApproveVendorRequest
        description: Approve a vendor
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      - name: RejectVendorRequest
        description: Reject a vendor
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
              required:
                - reason
      - name: UpdateOperationalStatusRequest
        description: Vendor operational status
        content:
          application/json:
            schema:
              type: object
              properties:
                operationalStatus:
                  type: string
                  enum:
                    - ONLINE
                    - OFFLINE
                    - BUSY
                    - TEMPORARILY_UNAVAILABLE
              required:
                - operationalStatus
      - name: VendorResponse
        description: Vendor profile
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    vendorId:
                      type: string
                    ownerUserId:
                      type: string
                    businessType:
                      type: string
                      enum:
                        - INDIVIDUAL
                        - BUSINESS
                    businessName:
                      type: string
                    contactName:
                      type: string
                    phoneNumber:
                      type: string
                    email:
                      type: string
                    description:
                      type: string
                    profileImageUrl:
                      type: string
                    gstNumber:
                      type: string
                    panNumber:
                      type: string
                    address:
                      type: object
                      properties:
                        addressLine1:
                          type: string
                        addressLine2:
                          type: string
                        landmark:
                          type: string
                        city:
                          type: string
                        state:
                          type: string
                        country:
                          type: string
                        postalCode:
                          type: string
                      required:
                        - addressLine1
                        - city
                        - state
                        - country
                        - postalCode
                    geoLocation:
                      type: object
                      properties:
                        latitude:
                          type: number
                        longitude:
                          type: number
                      required:
                        - latitude
                        - longitude
                    status:
                      type: string
                      enum:
                        - PENDING_VERIFICATION
                        - ACTIVE
                        - SUSPENDED
                        - INACTIVE
                        - REJECTED
                    operationalStatus:
                      type: string
                      enum:
                        - ONLINE
                        - OFFLINE
                        - BUSY
                        - TEMPORARILY_UNAVAILABLE
                    onboardingStatus:
                      type: string
                      enum:
                        - DRAFT
                        - IN_PROGRESS
                        - COMPLETED
                        - PENDING_REVIEW
                    currentSection:
                      type: string
                      enum:
                        - BUSINESS_INFO
                        - OWNER_DETAILS
                        - ADDRESS
                        - BRANCH
                        - DOCUMENTS
                        - BANK_DETAILS
                    completedSections:
                      type: array
                      items:
                        type: string
                        enum:
                          - BUSINESS_INFO
                          - OWNER_DETAILS
                          - ADDRESS
                          - BRANCH
                          - DOCUMENTS
                          - BANK_DETAILS
                    applicationId:
                      type: string
                    communityIds:
                      type: array
                      items:
                        type: string
                    createdAt:
                      type: string
                    updatedAt:
                      type: string
      - name: VendorListResponse
        description: Vendor page
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      vendorId:
                        type: string
                      ownerUserId:
                        type: string
                      businessType:
                        type: string
                        enum:
                          - INDIVIDUAL
                          - BUSINESS
                      businessName:
                        type: string
                      contactName:
                        type: string
                      phoneNumber:
                        type: string
                      email:
                        type: string
                      description:
                        type: string
                      profileImageUrl:
                        type: string
                      gstNumber:
                        type: string
                      panNumber:
                        type: string
                      address:
                        type: object
                        properties:
                          addressLine1:
                            type: string
                          addressLine2:
                            type: string
                          landmark:
                            type: string
                          city:
                            type: string
                          state:
                            type: string
                          country:
                            type: string
                          postalCode:
                            type: string
                        required:
                          - addressLine1
                          - city
                          - state
                          - country
                          - postalCode
                      geoLocation:
                        type: object
                        properties:
                          latitude:
                            type: number
                          longitude:
                            type: number
                        required:
                          - latitude
                          - longitude
                      status:
                        type: string
                        enum:
                          - PENDING_VERIFICATION
                          - ACTIVE
                          - SUSPENDED
                          - INACTIVE
                          - REJECTED
                      operationalStatus:
                        type: string
                        enum:
                          - ONLINE
                          - OFFLINE
                          - BUSY
                          - TEMPORARILY_UNAVAILABLE
                      onboardingStatus:
                        type: string
                        enum:
                          - DRAFT
                          - IN_PROGRESS
                          - COMPLETED
                          - PENDING_REVIEW
                      currentSection:
                        type: string
                        enum:
                          - BUSINESS_INFO
                          - OWNER_DETAILS
                          - ADDRESS
                          - BRANCH
                          - DOCUMENTS
                          - BANK_DETAILS
                      completedSections:
                        type: array
                        items:
                          type: string
                          enum:
                            - BUSINESS_INFO
                            - OWNER_DETAILS
                            - ADDRESS
                            - BRANCH
                            - DOCUMENTS
                            - BANK_DETAILS
                      applicationId:
                        type: string
                      communityIds:
                        type: array
                        items:
                          type: string
                      createdAt:
                        type: string
                      updatedAt:
                        type: string
                pagination:
                  type: object
                  properties:
                    nextCursor:
                      type: string
                    hasMore:
                      type: boolean
      - name: VendorSelfLookup
        description: Whether the caller owns a vendor and what to do next
        content:
          application/json:
            schema:
              type: object
              properties:
                hasVendor:
                  type: boolean
                vendorId:
                  type: string
                status:
                  type: string
                onboarding:
                  type: object
                  properties:
                    currentStep:
                      type: string
                      enum:
                        - BUSINESS_INFO
                        - OWNER_DETAILS
                        - ADDRESS
                        - BRANCH
                        - DOCUMENTS
                        - BANK_DETAILS
                    completed:
                      type: boolean
                nextAction:
                  type: string
                  enum:
                    - START_ONBOARDING
                    - RESUME_ONBOARDING
                    - VIEW_APPLICATION_STATUS
                    - OPEN_VENDOR_DASHBOARD
                    - COMPLETE_VENDOR_SETUP
                    - VIEW_ACCOUNT_STATUS
                    - CORRECT_APPLICATION
                membership:
                  type: object
                  properties:
                    role:
                      type: string
                      enum:
                        - owner
              required:
                - hasVendor
                - nextAction
      - name: UpdateOnboardingRequest
        description: Atomically save one or more mutable onboarding sections.
        content:
          application/json:
            schema:
              type: object
              properties:
                revision:
                  type: integer
                  minimum: 0
                  description: Revision returned by the previous onboarding read or update.
                sections:
                  type: object
                  properties:
                    BUSINESS_INFO:
                      type: object
                      properties:
                        businessType:
                          type: string
                          enum: [INDIVIDUAL, BUSINESS]
                        businessName: { type: string }
                        contactName: { type: string }
                        phoneNumber: { type: string }
                        email: { type: string, nullable: true }
                        description: { type: string, nullable: true }
                        gstNumber: { type: string, nullable: true }
                        panNumber: { type: string, nullable: true }
                        profileImageUrl: { type: string, format: uri, nullable: true }
                    COMMUNITIES:
                      type: object
                      properties:
                        communityIds:
                          type: array
                          minItems: 0
                          maxItems: 25
                          items: { type: string }
                      required: [communityIds]
                    BANK_DETAILS:
                      type: object
                      properties:
                        accountHolderName: { type: string }
                        accountNumber: { type: string, nullable: true }
                        ifscCode: { type: string, nullable: true }
                        bankName: { type: string }
                        branchName: { type: string, nullable: true }
                        accountType: { type: string, enum: [SAVINGS, CURRENT], nullable: true }
                  minProperties: 1
                lastVisitedStep:
                  type: string
                  enum: [BUSINESS_INFO, COMMUNITIES, DOCUMENTS, BANK_DETAILS]
              required:
                - revision
                - sections
      - name: OnboardingResponse
        description: Onboarding progress and saved sections
        content:
          application/json:
            schema:
              type: object
              properties:
                vendorId:
                  type: string
                status:
                  type: string
                  enum:
                    - DRAFT
                    - IN_PROGRESS
                    - AWAITING_EMAIL_VERIFICATION
                    - PENDING_REVIEW
                    - CHANGES_REQUESTED
                    - COMPLETED
                currentSection:
                  type: string
                  enum:
                    - BUSINESS_INFO
                    - COMMUNITIES
                    - DOCUMENTS
                    - BANK_DETAILS
                completedSections:
                  type: array
                  items:
                    type: string
                    enum:
                      - BUSINESS_INFO
                      - COMMUNITIES
                      - DOCUMENTS
                      - BANK_DETAILS
                applicationId:
                  type: string
                revision:
                  type: integer
                  minimum: 0
                lastVisitedStep:
                  type: string
                  enum: [BUSINESS_INFO, COMMUNITIES, DOCUMENTS, BANK_DETAILS]
                requiredSections:
                  type: array
                  items:
                    type: string
                    enum: [BUSINESS_INFO, COMMUNITIES, DOCUMENTS, BANK_DETAILS]
                incompleteSections:
                  type: array
                  items:
                    type: string
                    enum: [BUSINESS_INFO, COMMUNITIES, DOCUMENTS, BANK_DETAILS]
                recommendedNextStep:
                  type: string
                  enum: [BUSINESS_INFO, COMMUNITIES, DOCUMENTS, BANK_DETAILS]
                sections:
                  type: object
                  properties:
                    BUSINESS_INFO: { type: object }
                    COMMUNITIES:
                      type: array
                      items:
                        type: object
                        properties:
                          communityId: { type: string }
                        required: [communityId]
                    DOCUMENTS:
                      type: array
                      items: { type: object }
                    BANK_DETAILS: { type: object }
              required: [vendorId, status, currentSection, completedSections, revision, sections]
      - name: VendorStatusHistoryList
        description: Vendor status review history
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      vendorId:
                        type: string
                      previousStatus:
                        type: string
                        enum:
                          - PENDING_VERIFICATION
                          - ACTIVE
                          - SUSPENDED
                          - INACTIVE
                          - REJECTED
                      newStatus:
                        type: string
                        enum:
                          - PENDING_VERIFICATION
                          - ACTIVE
                          - SUSPENDED
                          - INACTIVE
                          - REJECTED
                      reviewerUserId:
                        type: string
                      reason:
                        type: string
                      reviewedAt:
                        type: string
                      correlationId:
                        type: string
      - name: ReplaceVendorCommunitiesRequest
        description: Replace vendor communities
        content:
          application/json:
            schema:
              type: object
              properties:
                communityIds:
                  type: array
                  items:
                    type: string
              required:
                - communityIds
      - name: AddVendorCommunityRequest
        description: Assign one community
        content:
          application/json:
            schema:
              type: object
              properties:
                communityId:
                  type: string
              required:
                - communityId
      - name: VendorCommunityAssignment
        description: Vendor community assignment
        content:
          application/json:
            schema:
              type: object
              properties:
                vendorId:
                  type: string
                communityId:
                  type: string
                assignedBy:
                  type: string
                assignedAt:
                  type: string
                status:
                  type: string
                  enum:
                    - PENDING_VERIFICATION
                    - ACTIVE
                    - SUSPENDED
                    - INACTIVE
                    - REJECTED
                operationalStatus:
                  type: string
                  enum:
                    - ONLINE
                    - OFFLINE
                    - BUSY
                    - TEMPORARILY_UNAVAILABLE
      - name: VendorCommunityList
        description: Vendor communities
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      vendorId:
                        type: string
                      communityId:
                        type: string
                      assignedAt:
                        type: string
      - name: CreateServiceAreaRequest
        description: Create a service area
        content:
          application/json:
            schema:
              type: object
              properties:
                serviceAreaId:
                  type: string
                vendorId:
                  type: string
                name:
                  type: string
                city:
                  type: string
                state:
                  type: string
                postalCodes:
                  type: array
                  items:
                    type: string
                center:
                  type: object
                  properties:
                    latitude:
                      type: number
                    longitude:
                      type: number
                  required:
                    - latitude
                    - longitude
                radiusKm:
                  type: number
                active:
                  type: boolean
                createdAt:
                  type: string
                updatedAt:
                  type: string
              required:
                - name
                - city
      - name: UpdateServiceAreaRequest
        description: Patch a service area
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                city:
                  type: string
                state:
                  type: string
                postalCodes:
                  type: array
                  items:
                    type: string
                center:
                  type: object
                  properties:
                    latitude:
                      type: number
                    longitude:
                      type: number
                  required:
                    - latitude
                    - longitude
                radiusKm:
                  type: number
                active:
                  type: boolean
      - name: ServiceArea
        description: Service area
        content:
          application/json:
            schema:
              type: object
              properties:
                serviceAreaId:
                  type: string
                vendorId:
                  type: string
                name:
                  type: string
                city:
                  type: string
                state:
                  type: string
                postalCodes:
                  type: array
                  items:
                    type: string
                center:
                  type: object
                  properties:
                    latitude:
                      type: number
                    longitude:
                      type: number
                  required:
                    - latitude
                    - longitude
                radiusKm:
                  type: number
                active:
                  type: boolean
                createdAt:
                  type: string
                updatedAt:
                  type: string
              required:
                - name
                - city
      - name: ServiceAreaList
        description: Service areas
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      serviceAreaId:
                        type: string
                      vendorId:
                        type: string
                      name:
                        type: string
                      city:
                        type: string
                      state:
                        type: string
                      postalCodes:
                        type: array
                        items:
                          type: string
                      center:
                        type: object
                        properties:
                          latitude:
                            type: number
                          longitude:
                            type: number
                        required:
                          - latitude
                          - longitude
                      radiusKm:
                        type: number
                      active:
                        type: boolean
                      createdAt:
                        type: string
                      updatedAt:
                        type: string
                    required:
                      - name
                      - city
      - name: UpdateVendorOperatingHoursRequest
        description: Replace weekly operating hours
        content:
          application/json:
            schema:
              type: object
              properties:
                operatingHours:
                  type: array
                  items:
                    type: object
                    properties:
                      dayOfWeek:
                        type: string
                        enum:
                          - MONDAY
                          - TUESDAY
                          - WEDNESDAY
                          - THURSDAY
                          - FRIDAY
                          - SATURDAY
                          - SUNDAY
                      closed:
                        type: boolean
                      openTime:
                        type: string
                      closeTime:
                        type: string
                    required:
                      - dayOfWeek
                      - closed
              required:
                - operatingHours
      - name: CreateStaffRequest
        description: Create a staff member
        content:
          application/json:
            schema:
              type: object
              properties:
                staffId:
                  type: string
                vendorId:
                  type: string
                userId:
                  type: string
                name:
                  type: string
                phoneNumber:
                  type: string
                email:
                  type: string
                role:
                  type: string
                status:
                  type: string
                  enum:
                    - ACTIVE
                    - INACTIVE
                createdAt:
                  type: string
                updatedAt:
                  type: string
              required:
                - name
                - phoneNumber
      - name: UpdateStaffRequest
        description: Patch a staff member
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                phoneNumber:
                  type: string
                email:
                  type: string
                role:
                  type: string
                status:
                  type: string
                  enum:
                    - ACTIVE
                    - INACTIVE
      - name: StaffResponse
        description: Staff member
