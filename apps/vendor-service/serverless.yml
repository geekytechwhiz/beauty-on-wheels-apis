      - name: CreateCapacityProposalRequest
        description: Admin capacity proposal. Idempotency-Key header is required. packageScope.offeringId (catalog package id) is required; serviceScopeCode is not accepted. scope and window are accepted as aliases of packageScope and serviceWindow.
        content:
          application/json:
            schema:
              type: object
              required:
                - vendorId
                - communityId
                - packageScope
                - serviceWindow
                - quantity
                - responseDeadline
                - proposedPayoutRate
              properties:
                vendorId:
                  type: string
                communityId:
                  type: string
                packageScope:
                  type: object
                  required:
                    - offeringId
                    - label
                  properties:
                    offeringId:
                      type: string
                      description: Catalog package offering id (sole authoritative scope)
                    label:
                      type: string
                serviceWindow:
                  type: object
                  properties:
                    startDate:
                      type: string
                      description: YYYY-MM-DD, inclusive
                    endDate:
                      type: string
                      description: YYYY-MM-DD, inclusive
                    dailyWindow:
                      type: object
                      properties:
                        startTime:
                          type: string
                          description: HH:mm
                        endTime:
                          type: string
                          description: HH:mm, after startTime
                    daysOfWeek:
                      type: array
                      description: Omitted means every day in the range
                      items:
                        type: string
                        enum:
                          - MONDAY
                          - TUESDAY
                          - WEDNESDAY
                          - THURSDAY
                          - FRIDAY
                          - SATURDAY
                          - SUNDAY
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  description: Visit-slots per service-window day
                responseDeadline:
                  type: string
                  description: ISO-8601 date-time, in the future when sent
                proposedPayoutRate:
                  type: object
                  properties:
                    amountMinor:
                      type: integer
                    currency:
                      type: string
                      enum:
                        - INR
                sendImmediately:
                  type: boolean
                  description: false creates a DRAFT. Default true.
                note:
                  type: string
                  description: Optional audit note stored on the CREATE history entry.
                  minLength: 1
                  maxLength: 500
      - name: SendCapacityProposalRequest
