resources:
  Resources:
    VendorEventBus:
      Type: AWS::Events::EventBus
      Properties:
        Name: ${self:custom.vendorEventBusName}
        Tags:
          - Key: Service
            Value: vendor
          - Key: Environment
            Value: ${sls:stage}
          - Key: ManagedBy
            Value: Serverless

    VendorTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-vendor

        BillingMode: PAY_PER_REQUEST

        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S

          - AttributeName: SK
            AttributeType: S

          - AttributeName: GSI1PK
            AttributeType: S

          - AttributeName: GSI1SK
            AttributeType: S

          - AttributeName: GSI2PK
            AttributeType: S

          - AttributeName: GSI2SK
            AttributeType: S

          - AttributeName: GSI3PK
            AttributeType: S

          - AttributeName: GSI3SK
            AttributeType: S

        KeySchema:
          - AttributeName: PK
            KeyType: HASH

          - AttributeName: SK
            KeyType: RANGE

        GlobalSecondaryIndexes:

          # --------------------------------------------------
          # GSI1 - Vendor alternate lookups
          #
          # STATUS#ACTIVE
          # OPERATIONAL#ONLINE
          # OWNER#<userId>
          # --------------------------------------------------

          - IndexName: GSI1
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH

              - AttributeName: GSI1SK
                KeyType: RANGE

            Projection:
              ProjectionType: ALL

          # --------------------------------------------------
          # GSI2 - Vendor service-area lookup
          #
          # CITY#KOCHI
          # POSTAL#682301
          # --------------------------------------------------

          - IndexName: GSI2
            KeySchema:
              - AttributeName: GSI2PK
                KeyType: HASH

              - AttributeName: GSI2SK
                KeyType: RANGE

            Projection:
              ProjectionType: ALL

          # GSI3 - community assignment lookup
          # COMMUNITY#<communityId> / STATUS#<status>#VENDOR#<vendorId>
          - IndexName: GSI3
            KeySchema:
              - AttributeName: GSI3PK
                KeyType: HASH
              - AttributeName: GSI3SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

        SSESpecification:
          SSEEnabled: true

        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES

        Tags:
          - Key: Service
            Value: vendor

          - Key: Environment
            Value: ${sls:stage}

          - Key: ManagedBy
            Value: Serverless

    VendorOnboardingStreamDlq:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.resourcePrefix}-vendor-onboarding-stream-dlq
        MessageRetentionPeriod: 1209600
        Tags:
          - Key: Service
            Value: vendor
          - Key: Environment
            Value: ${sls:stage}

    VendorEmailVerificationStreamDlq:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.resourcePrefix}-vendor-email-verification-stream-dlq
        MessageRetentionPeriod: 1209600
        Tags:
          - Key: Service
            Value: vendor
          - Key: Environment
            Value: ${sls:stage}

    VendorEmailVerifiedStreamDlq:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.resourcePrefix}-vendor-email-verified-stream-dlq
        MessageRetentionPeriod: 1209600
        Tags:
          - Key: Service
            Value: vendor
          - Key: Environment
            Value: ${sls:stage}

    VendorLifecycleStreamDlq:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.resourcePrefix}-vendor-lifecycle-stream-dlq
        MessageRetentionPeriod: 1209600
        Tags:
          - Key: Service
            Value: vendor
          - Key: Environment
            Value: ${sls:stage}

    VendorDiscoveryStreamDlq:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.resourcePrefix}-vendor-discovery-stream-dlq
        MessageRetentionPeriod: 1209600
        Tags:
          - Key: Service
            Value: vendor
          - Key: Environment
            Value: ${sls:stage}

    VendorBookingReadinessStreamDlq:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.resourcePrefix}-vendor-booking-readiness-stream-dlq
        MessageRetentionPeriod: 1209600
        SqsManagedSseEnabled: true

    VendorBookingReadinessEventDlq:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.resourcePrefix}-vendor-booking-readiness-event-dlq
        MessageRetentionPeriod: 1209600
        SqsManagedSseEnabled: true

    VendorBookingReadinessQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.resourcePrefix}-vendor-booking-readiness
        MessageRetentionPeriod: 345600
        VisibilityTimeout: 180
        SqsManagedSseEnabled: true
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt VendorBookingReadinessEventDlq.Arn
          maxReceiveCount: 5

    VendorBookingReadinessEventDlqAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:custom.resourcePrefix}-vendor-booking-readiness-dlq
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Dimensions:
          - Name: QueueName
            Value: !GetAtt VendorBookingReadinessEventDlq.QueueName
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching

    VendorBookingReadinessEventDlqPolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues: [!Ref VendorBookingReadinessEventDlq]
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal: { Service: events.amazonaws.com }
              Action: sqs:SendMessage
              Resource: !GetAtt VendorBookingReadinessEventDlq.Arn
              Condition:
                StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }

    VendorBookingReadinessQueuePolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues: [!Ref VendorBookingReadinessQueue]
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal: { Service: events.amazonaws.com }
              Action: sqs:SendMessage
              Resource: !GetAtt VendorBookingReadinessQueue.Arn
              Condition:
                StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }

    VendorBookingReadinessEventRule:
      Type: AWS::Events::Rule
      DependsOn: [VendorBookingReadinessQueuePolicy, VendorBookingReadinessEventDlqPolicy]
      Properties:
        Name: ${self:custom.resourcePrefix}-vendor-booking-readiness
        Description: Routes authoritative booking-readiness facts to the vendor projector
        EventBusName: ${self:custom.vendorEventBusName}
        EventPattern:
          source: [vendor-service, service-catalog-service, availability-service]
          detail-type: [BookingReadinessFact.Updated]
        State: ENABLED
        Targets:
          - Id: VendorBookingReadinessQueue
            Arn: !GetAtt VendorBookingReadinessQueue.Arn
            DeadLetterConfig: { Arn: !GetAtt VendorBookingReadinessEventDlq.Arn }
            RetryPolicy: { MaximumRetryAttempts: 3 }

    VendorDocumentsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:service}-${sls:stage}-vendor-documents
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        CorsConfiguration:
          CorsRules:
            - AllowedOrigins:
                - '*'
              AllowedMethods:
                - GET
                - PUT
                - HEAD
              AllowedHeaders:
                - '*'
              ExposedHeaders:
                - ETag
              MaxAge: 300
        Tags:
          - Key: Service
            Value: vendor
          - Key: Environment
            Value: ${sls:stage}

    VendorDocumentsBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref VendorDocumentsBucket
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Sid: DenyInsecureTransport
              Effect: Deny
              Principal: '*'
              Action: 's3:*'
              Resource:
                - !GetAtt VendorDocumentsBucket.Arn
                - !Join [ "", [ !GetAtt VendorDocumentsBucket.Arn, "/*" ] ]
              Condition:
                Bool:
                  aws:SecureTransport: 'false'

    GatewayResponseDefault4XX: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseDefault4XX}

    GatewayResponseDefault5XX: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseDefault5XX}

    GatewayResponseUnauthorized: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseUnauthorized}

    CheckoutEligibilityInvokePermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !Ref GetCheckoutEligibilityLambdaFunction
        Action: lambda:InvokeFunction
        Principal: !Ref AWS::AccountId

    PricingConfigurationInvokePermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !Ref GetPricingConfigurationLambdaFunction
        Action: lambda:InvokeFunction
        Principal: !Ref AWS::AccountId

    GatewayResponseAccessDenied: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseAccessDenied}

    GatewayResponseMissingAuthenticationToken: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseMissingAuthenticationToken}
    GatewayResponseExpiredToken: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseExpiredToken}
    GatewayResponseIntegrationFailure: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseIntegrationFailure}
    GatewayResponseIntegrationTimeout: ${file(../../infra/serverless/config/rest-gateway-cors-responses.yml):GatewayResponseIntegrationTimeout}

  Outputs:
    VendorEventBusName:
      Description: Vendor EventBridge bus name
      Value: !Ref VendorEventBus
      Export:
        Name: ${self:custom.resourcePrefix}-vendor-event-bus-name
    VendorEventBusArn:
      Description: Vendor EventBridge bus ARN
      Value: !GetAtt VendorEventBus.Arn
      Export:
        Name: ${self:custom.resourcePrefix}-vendor-event-bus-arn

