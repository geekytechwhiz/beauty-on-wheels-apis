          functionResponseType: ReportBatchItemFailures
          destinations:
            onFailure:
              arn: !GetAtt VendorLifecycleStreamDlq.Arn
              type: sqs

  onVendorDiscoveryChanged:
    handler: src/handlers/vendor-discovery-stream.handler
    name: ${self:custom.resourcePrefix}-vendor-discovery-stream
    timeout: 60
    events:
      - stream:
          type: dynamodb
          arn: !GetAtt VendorTable.StreamArn
          filterPatterns:
            - eventName:
                - INSERT
                - MODIFY
              dynamodb:
                NewImage:
                  entityType:
                    S:
                      - VendorBranch
                      - ServiceArea
                      - VendorCapabilities
            - eventName:
                - REMOVE
              dynamodb:
                OldImage:
                  entityType:
                    S:
                      - VendorBranch
                      - ServiceArea
                      - VendorCapabilities
            - eventName:
                - MODIFY
              dynamodb:
                NewImage:
                  entityType:
                    S:
                      - Vendor
                  SK:
                    S:
                      - PROFILE
          batchSize: 10
          startingPosition: LATEST
          bisectBatchOnFunctionError: true
          maximumRetryAttempts: 3
          functionResponseType: ReportBatchItemFailures
          destinations:
            onFailure:
              arn: !GetAtt VendorDiscoveryStreamDlq.Arn
              type: sqs

