resources:
  Resources:
    VendorEventBus:
      Type: AWS::Events::EventBus
      Properties:
        Name: ${self:custom.vendorEventBusName}
        Tags:
          - Key: Service
            Value: vendor
          - Key: Environment
            Value: ${sls:stage}
          - Key: ManagedBy
            Value: Serverless

    VendorTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-vendor

        BillingMode: PAY_PER_REQUEST

        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S

          - AttributeName: SK
            AttributeType: S

          - AttributeName: GSI1PK
            AttributeType: S

          - AttributeName: GSI1SK
            AttributeType: S

          - AttributeName: GSI2PK
            AttributeType: S

          - AttributeName: GSI2SK
            AttributeType: S

        KeySchema:
          - AttributeName: PK
            KeyType: HASH

          - AttributeName: SK
            KeyType: RANGE

        GlobalSecondaryIndexes:

          # --------------------------------------------------
          # GSI1 - Vendor alternate lookups
          #
          # STATUS#ACTIVE
          # OPERATIONAL#ONLINE
          # OWNER#<userId>
          # --------------------------------------------------

          - IndexName: GSI1
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH

              - AttributeName: GSI1SK
                KeyType: RANGE

            Projection:
              ProjectionType: ALL

          # --------------------------------------------------
          # GSI2 - Vendor service-area lookup
          #
          # CITY#KOCHI
          # POSTAL#682301
          # --------------------------------------------------

          - IndexName: GSI2
            KeySchema:
              - AttributeName: GSI2PK
                KeyType: HASH

              - AttributeName: GSI2SK
                KeyType: RANGE

            Projection:
              ProjectionType: ALL

        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

        SSESpecification:
          SSEEnabled: true

        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES

        Tags:
          - Key: Service
            Value: vendor

          - Key: Environment
            Value: ${sls:stage}

          - Key: ManagedBy
            Value: Serverless

    VendorOnboardingStreamDlq:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.resourcePrefix}-vendor-onboarding-stream-dlq
        MessageRetentionPeriod: 1209600
        Tags:
          - Key: Service
            Value: vendor
          - Key: Environment
            Value: ${sls:stage}

    VendorEmailVerificationStreamDlq:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.resourcePrefix}-vendor-email-verification-stream-dlq
        MessageRetentionPeriod: 1209600
        Tags:
          - Key: Service
            Value: vendor
          - Key: Environment
            Value: ${sls:stage}

    VendorDocumentsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:service}-${sls:stage}-vendor-documents
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        Tags:
          - Key: Service
            Value: vendor
          - Key: Environment
            Value: ${sls:stage}

    GatewayResponseDefault4XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: DEFAULT_4XX
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: >-
            'Content-Type,Authorization,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent,Sec-Ch-Ua,Sec-Ch-Ua-Mobile,Sec-Ch-Ua-Platform'
          gatewayresponse.header.Access-Control-Allow-Methods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"

    GatewayResponseDefault5XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: DEFAULT_5XX
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: >-
            'Content-Type,Authorization,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent,Sec-Ch-Ua,Sec-Ch-Ua-Mobile,Sec-Ch-Ua-Platform'
          gatewayresponse.header.Access-Control-Allow-Methods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"

    GatewayResponseUnauthorized:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: UNAUTHORIZED
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: >-
            'Content-Type,Authorization,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent,Sec-Ch-Ua,Sec-Ch-Ua-Mobile,Sec-Ch-Ua-Platform'
          gatewayresponse.header.Access-Control-Allow-Methods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"

    GatewayResponseAccessDenied:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: ACCESS_DENIED
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: >-
            'Content-Type,Authorization,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent,Sec-Ch-Ua,Sec-Ch-Ua-Mobile,Sec-Ch-Ua-Platform'
          gatewayresponse.header.Access-Control-Allow-Methods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"

  Outputs:
    VendorEventBusName:
      Description: Vendor EventBridge bus name
      Value: !Ref VendorEventBus
      Export:
        Name: ${self:custom.resourcePrefix}-vendor-event-bus-name
    VendorEventBusArn:
      Description: Vendor EventBridge bus ARN
      Value: !GetAtt VendorEventBus.Arn
      Export:
        Name: ${self:custom.resourcePrefix}-vendor-event-bus-arn