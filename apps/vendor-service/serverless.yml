              - statusCode: "200"
                responseBody:
                  description: Active communities
                responseModels:
                  application/json: PartnerCommunityDirectoryPage
              - statusCode: "400"
                responseBody:
                  description: Invalid filter or cursor
                responseModels:
                  application/json: ErrorResponse
              - statusCode: "401"
                responseBody:
                  description: Authentication is required
                responseModels:
                  application/json: ErrorResponse
              - statusCode: "403"
                responseBody:
                  description: Caller cannot read this vendor directory
                responseModels:
                  application/json: ErrorResponse
              - statusCode: "404"
                responseBody:
                  description: Vendor not found
                responseModels:
                  application/json: ErrorResponse
            pathParams:
              - name: vendorId
                description: vendorId
                schema:
                  type: string
            queryParams:
              - name: search
                description: Matches community name, locality, city, and PIN text
                schema:
                  type: string
              - name: cityId
                description: Active-city partition
                schema:
                  type: string
              - name: localityId
                description: Active-locality partition
                schema:
                  type: string
              - name: postalCode
                description: Six-digit PIN
                schema:
                  type: string
              - name: ids
                description: Comma-separated community ids to resolve. When present, list filters are not applied.
                schema:
                  type: string
              - name: limit
                description: Page size from 1 to 100
                schema:
                  type: integer
              - name: cursor
                description: Opaque pagination cursor
                schema:
                  type: string

