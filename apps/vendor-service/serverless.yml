service: vendor-service-api

frameworkVersion: "3"

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-auto-swagger
  - serverless-offline 
provider:
  name: aws
  runtime: nodejs22.x

  stage: ${opt:stage,'dev'}

  region: ${opt:region,'us-east-1'}

  versionFunctions: false

  environment:

    SERVICE_NAME: vendor-service
    LOG_LEVEL: INFO
    DYNAMODB_TABLE_NAME: ${self:service}-${self:provider.stage}-vendor
    IDENTITY_TABLE: identity-table-${self:provider.stage}
    DOCUMENT_BUCKET: ${self:service}-${self:provider.stage}-vendor-documents
    DOCUMENTS_BUCKET_NAME: ${self:service}-${self:provider.stage}-vendor-documents
    DOCUMENT_UPLOAD_URL_EXPIRY: ${env:DOCUMENT_UPLOAD_URL_EXPIRY, '900'}
    DOCUMENT_DOWNLOAD_URL_EXPIRY: ${env:DOCUMENT_DOWNLOAD_URL_EXPIRY, '900'}
    DOCUMENT_MAX_FILE_SIZE: ${env:DOCUMENT_MAX_FILE_SIZE, '10485760'}
    DOCUMENT_ALLOWED_CONTENT_TYPES: ${env:DOCUMENT_ALLOWED_CONTENT_TYPES, 'application/pdf,image/jpeg,image/png'}
    EVENT_BUS_NAME: ${self:custom.vendorEventBusName}
    COGNITO_REGION: ${self:provider.region}
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID, 'us-east-1_LeQxyLZ3x'}
    COGNITO_APP_CLIENT_ID: ${env:COGNITO_APP_CLIENT_ID, '3p3fj5dq1m41cn2b7mbono23qo'}
    COGNITO_ISSUER: https://cognito-idp.${self:provider.region}.amazonaws.com/${env:COGNITO_USER_POOL_ID, 'us-east-1_LeQxyLZ3x'}
    COGNITO_JWKS_URI: https://cognito-idp.${self:provider.region}.amazonaws.com/${env:COGNITO_USER_POOL_ID, 'us-east-1_LeQxyLZ3x'}/.well-known/jwks.json
    CATALOG_SERVICE_URL: ${env:CATALOG_SERVICE_URL, ''}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:BatchGetItem
            - dynamodb:BatchWriteItem
            - dynamodb:TransactWriteItems
            - dynamodb:TransactGetItems
            - dynamodb:DescribeTable
            - dynamodb:ConditionCheckItem
          Resource:
            - !GetAtt VendorTable.Arn
            - !Join [ "/", [ !GetAtt VendorTable.Arn, "index", "*" ] ]
        - Effect: Allow
          Action:
            - dynamodb:GetItem
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/identity-table-${self:provider.stage}
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource:
            - !Join [ "", [ !GetAtt VendorDocumentsBucket.Arn, "/vendors/*" ] ]
        - Effect: Allow
          Action:
            - xray:PutTraceSegments
            - xray:PutTelemetryRecords
          Resource: '*'
        - Effect: Allow
          Action:
            - events:PutEvents
          Resource:
            - !GetAtt VendorEventBus.Arn
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource:
            - !GetAtt VendorOnboardingStreamDlq.Arn
            - !GetAtt VendorEmailVerificationStreamDlq.Arn
            - !GetAtt VendorEmailVerifiedStreamDlq.Arn
            - !GetAtt VendorLifecycleStreamDlq.Arn 

custom:
  # nv{stage}-bw-  e.g. nvdev-bw-
  resourcePrefix: nv${self:provider.stage}-bw
  vendorEventBusName: ${self:custom.resourcePrefix}-vendor-event-bus

  securedAuthorizer: ${file(../../infra/serverless/config/http-api-authorizer.yml)}

  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    concurrency: 10
    plugins: ./esbuild-plugins.js

  autoswagger:
    title: "Beauty on Wheels - Vendor Service API"
    apiType: http
    basePath: /${self:provider.stage}
    schemes:
      - https
      - http
    generateSwaggerOnDeploy: true
    swaggerFiles:
      - swagger.json
    useStage: true
    swaggerPath: swagger
    typefiles:
      - ./src/types/api-types.d.ts
    excludeStages:
      - production


functions:

  createvendor:
    handler: src/handlers/vendors-handler.handleCreatevendor
    events:
      - http:
          path: /vendors
          method: post
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Create vendor"
          description: "Creates a vendor profile for the authenticated application user. ownerUserId is taken from the verified user id, not the request body. A second create from the same user returns the existing vendor."
          swaggerTags:
            - Vendors
          bodyType: CreateVendorRequest
          responseData:
            201:
              description: "Vendor created successfully"
              bodyType: VendorResponse
            400:
              description: ""
            401:
              description: ""
            409:
              description: ""
            500:
              description: ""

  getvendoronboarding:
    handler: src/handlers/onboarding-handler.handleGetvendoronboarding
    events:
      - http:
          path: /vendors/{vendorId}/onboarding
          method: get
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Get vendor onboarding state"
          description: "Returns backend-authoritative onboarding progress and persisted section data so the frontend can resume."
          swaggerTags:
            - Onboarding
          responseData:
            200:
              description: "Onboarding state retrieved"
              bodyType: OnboardingResponse
            401:
              description: ""
            403:
              description: ""
            404:
              description: ""

  verifyvendoremail:
    handler: src/handlers/email-verification-handler.handleVerifyVendorEmail
    events:
      - http:
          path: /vendors/email-verification/verify
          method: post
          cors: true
          summary: "Verify vendor email"
          description: "Consumes a single-use opaque email verification token and moves the completed onboarding application to PENDING_REVIEW."
          swaggerTags:
            - Onboarding
          responseData:
            200:
              description: "Email verified successfully"
            400:
              description: "Invalid or expired verification link"
            409:
              description: "Verification is already being processed"

  resendvendoremailverification:
    handler: src/handlers/email-verification-handler.handleResendVendorEmailVerification
    events:
      - http:
          path: /vendors/{vendorId}/email-verification/resend
          method: post
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Resend vendor email verification"
          description: "Queues a replacement verification email. The previous link is revoked."
          swaggerTags:
            - Onboarding
          responseData:
            200:
              description: "Verification email queued"
            401:
              description: ""
            403:
              description: ""
            429:
              description: "Verification resend cooldown is active"

  updatevendoronboarding:
    handler: src/handlers/onboarding-handler.handleUpdatevendoronboarding
    events:
      - http:
          path: /vendors/{vendorId}/onboarding
          method: put
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Save an onboarding section"
          description: "Progressively creates or updates one onboarding section. OWNER_DETAILS stores the vendor profile ownerUserId. A userId in the section body is ignored. Vendors may be onboarded by the vendor owner or by platform admin staff."
          swaggerTags:
            - Onboarding
          bodyType: UpdateOnboardingRequest
          responseData:
            200:
              description: "Onboarding section saved"
              bodyType: OnboardingResponse
            400:
              description: "Invalid section or section payload"
            401:
              description: ""
            403:
              description: ""
            404:
              description: ""
      - http:
          path: /vendors/{vendorId}/onboarding
          method: patch
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Save an onboarding section"
          description: "Progressively creates or updates one onboarding section. Same contract as PUT /vendors/{vendorId}/onboarding."
          swaggerTags:
            - Onboarding
          bodyType: UpdateOnboardingRequest
          responseData:
            200:
              description: "Onboarding section saved"
              bodyType: OnboardingResponse
            400:
              description: "Invalid section or section payload"
            401:
              description: ""
            403:
              description: ""
            404:
              description: ""

  onVendorOnboardingSubmitted:
    handler: src/handlers/vendor-onboarding-stream.handler
    name: ${self:custom.resourcePrefix}-vendor-onboarding-stream
    timeout: 60
    events:
      - stream:
          type: dynamodb
          arn: !GetAtt VendorTable.StreamArn
          batchSize: 10
          startingPosition: LATEST
          bisectBatchOnFunctionError: true
          maximumRetryAttempts: 3
          functionResponseType: ReportBatchItemFailures
          destinations:
            onFailure:
              arn: !GetAtt VendorOnboardingStreamDlq.Arn
              type: sqs

  onVendorEmailVerificationRequested:
    handler: src/handlers/vendor-email-verification-stream.handler
    name: ${self:custom.resourcePrefix}-vendor-email-verification-stream
    timeout: 60
    events:
      - stream:
          type: dynamodb
          arn: !GetAtt VendorTable.StreamArn
          filterPatterns:
            - eventName:
                - INSERT
                - MODIFY
              dynamodb:
                NewImage:
                  entityType:
                    S:
                      - Vendor
                  SK:
                    S:
                      - PROFILE
          batchSize: 10
          startingPosition: LATEST
          bisectBatchOnFunctionError: true
          maximumRetryAttempts: 3
          functionResponseType: ReportBatchItemFailures
          destinations:
            onFailure:
              arn: !GetAtt VendorEmailVerificationStreamDlq.Arn
              type: sqs

  onVendorLifecycleChanged:
    handler: src/handlers/vendor-lifecycle-stream.handler
    name: ${self:custom.resourcePrefix}-vendor-lifecycle-stream
    timeout: 60
    events:
      - stream:
          type: dynamodb
          arn: !GetAtt VendorTable.StreamArn
          batchSize: 10
          startingPosition: LATEST
          bisectBatchOnFunctionError: true
          maximumRetryAttempts: 3
          functionResponseType: ReportBatchItemFailures
          destinations:
            onFailure:
              arn: !GetAtt VendorLifecycleStreamDlq.Arn
              type: sqs

  onVendorEmailVerified:
    handler: src/handlers/vendor-email-verified-stream.handler
    name: ${self:custom.resourcePrefix}-vendor-email-verified-stream
    timeout: 60
    events:
      - stream:
          type: dynamodb
          arn: !GetAtt VendorTable.StreamArn
          filterPatterns:
            - eventName:
                - MODIFY
              dynamodb:
                NewImage:
                  entityType:
                    S:
                      - Vendor
                  SK:
                    S:
                      - PROFILE
          batchSize: 10
          startingPosition: LATEST
          bisectBatchOnFunctionError: true
          maximumRetryAttempts: 3
          functionResponseType: ReportBatchItemFailures
          destinations:
            onFailure:
              arn: !GetAtt VendorEmailVerifiedStreamDlq.Arn
              type: sqs

  listvendors:
    handler: src/handlers/vendors-handler.handleListvendors
    events:
      - http:
          path: /vendors
          method: get
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "List vendors"
          description: "Lists vendors using optional filters.\nIntended primarily for admin and operational use.\n"
          swaggerTags:
            - Vendors
          responseData:
            200:
              description: "Vendors retrieved successfully"
              bodyType: VendorListResponse
            400:
              description: ""
            401:
              description: ""
            500:
              description: ""


  getvendorme:
    handler: src/handlers/vendors-handler.handleGetMyVendor
    events:
      - http:
          path: /vendors/me
          method: get
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Get the authenticated user's vendor"
          description: "Resolves the canonical application userId from the verified authentication context and loads that user's vendor from GSI1 (OWNER#{userId}). Does not accept vendorId, userId, or phone number. Returns hasVendor false and nextAction START_ONBOARDING when the user has no vendor."
          swaggerTags:
            - Vendors
          responseData:
            200:
              description: "Vendor self lookup"
              bodyType: VendorSelfLookup
            401:
              description: "Missing or invalid authentication, or no canonical application user id"
            403:
              description: "Cognito identity has no application user mapping"
            500:
              description: ""

  getvendor:
    handler: src/handlers/vendors-handler.handleGetvendor
    events:
      - http:
          path: /vendors/{vendorId}
          method: get
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Get vendor"
          description: "Returns the vendor profile and primary address. Bank details are omitted."
          swaggerTags:
            - Vendors
          responseData:
            200:
              description: "Vendor retrieved successfully"
              bodyType: VendorResponse
            401:
              description: ""
            403:
              description: ""
            404:
              description: ""
            500:
              description: ""


  updatevendor:
    handler: src/handlers/vendors-handler.handleUpdatevendor
    events:
      - http:
          path: /vendors/{vendorId}
          method: patch
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Update vendor"
          description: "Updates vendor profile fields. Address, owner, bank, branches and documents are not updated here — use onboarding or dedicated resource APIs."
          swaggerTags:
            - Vendors
          bodyType: UpdateVendorRequest
          responseData:
            200:
              description: "Vendor updated successfully"
              bodyType: VendorResponse
            400:
              description: ""
            401:
              description: ""
            404:
              description: ""
            409:
              description: ""
            500:
              description: ""


  updatevendorstatus:
    handler: src/handlers/vendors-handler.handleUpdatevendorstatus
    events:
      - http:
          path: /vendors/{vendorId}/status
          method: patch
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Update vendor lifecycle status"
          description: "Updates the administrative lifecycle status of a vendor.\n\nAllowed transitions:\n  PENDING_VERIFICATION -> ACTIVE (onboarding must be PENDING_REVIEW)\n  PENDING_VERIFICATION -> REJECTED (reason required)\n  ACTIVE -> SUSPENDED | INACTIVE\n  SUSPENDED -> ACTIVE | INACTIVE\n\nRepeating the current status is idempotent. Approval does not issue an email OTP.\nVendorApproved, VendorRejected, and VendorSuspended are published from the vendor table stream.\n"
          swaggerTags:
            - Vendors
          bodyType: UpdateVendorStatusRequest
          responseData:
            200:
              description: "Vendor status updated successfully"
              bodyType: VendorResponse
            400:
              description: ""
            401:
              description: ""
            403:
              description: ""
            404:
              description: ""
            409:
              description: ""
            500:
              description: ""


  updatevendoroperationalstatus:
    handler: src/handlers/vendors-handler.handleUpdatevendoroperationalstatus
    events:
      - http:
          path: /vendors/{vendorId}/operational-status
          method: patch
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Update vendor operational status"
          description: "Controls whether a vendor is currently accepting work.\n\nThis is different from the administrative vendor lifecycle status.\n"
          swaggerTags:
            - Vendors
          bodyType: UpdateOperationalStatusRequest
          responseData:
            200:
              description: "Operational status updated successfully"
              bodyType: VendorResponse
            400:
              description: ""
            401:
              description: ""
            404:
              description: ""
            409:
              description: ""
            500:
              description: ""


  submitvendorforreview:
    handler: src/handlers/onboarding-handler.handleSubmitvendorforreview
    events:
      - http:
          path: /vendors/{vendorId}/submit-review
          method: post
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Submit vendor for review"
          description: "Submits a complete onboarding application for review. All required documents (GST_REGISTRATION, BUSINESS_REGISTRATION, COMMERCIAL_INSURANCE) must be present with status UPLOADED. A missing document or a document still in PENDING_UPLOAD is rejected. Repeating submit after PENDING_REVIEW is idempotent."
          swaggerTags:
            - Onboarding
          responseData:
            200:
              description: "Vendor submitted for review"
              bodyType: OnboardingResponse
            400:
              description: "A required document is missing or still uploading"
            401:
              description: ""
            403:
              description: ""
            404:
              description: ""
            409:
              description: "Onboarding is incomplete or already in a conflicting state"

  approvevendor:
    handler: src/handlers/vendors-handler.handleApprovevendor
    events:
      - http:
          path: /vendors/{vendorId}/approve
          method: post
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Approve vendor"
          description: "Approves a vendor whose onboarding status is PENDING_REVIEW. Allowed only from PENDING_VERIFICATION. Approving an already ACTIVE vendor is idempotent."
          swaggerTags:
            - Vendors
          bodyType: ApproveVendorRequest
          responseData:
            200:
              description: "Vendor approved"
              bodyType: VendorResponse
            400:
              description: ""
            401:
              description: ""
            403:
              description: ""
            404:
              description: ""
            409:
              description: "Invalid status transition"

  rejectvendor:
    handler: src/handlers/vendors-handler.handleRejectvendor
    events:
      - http:
          path: /vendors/{vendorId}/reject
          method: post
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Reject vendor"
          description: "Rejects a vendor that is PENDING_VERIFICATION. A reason is required. Rejecting an already REJECTED vendor is idempotent."
          swaggerTags:
            - Vendors
          bodyType: RejectVendorRequest
          responseData:
            200:
              description: "Vendor rejected"
              bodyType: VendorResponse
            400:
              description: ""
            401:
              description: ""
            403:
              description: ""
            404:
              description: ""
            409:
              description: "Invalid status transition"

  getvendorstatushistory:
    handler: src/handlers/vendors-handler.handleGetvendorstatushistory
    events:
      - http:
          path: /vendors/{vendorId}/status-history
          method: get
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Get vendor status history"
          description: "Returns approval and lifecycle transition history, newest first."
          swaggerTags:
            - Vendors
          responseData:
            200:
              description: "Status history retrieved"
            401:
              description: ""
            403:
              description: ""
            404:
              description: ""

  listvendorcommunities:
    handler: src/handlers/communities-handler.handleListvendorcommunities
    events:
      - http:
          path: /vendors/{vendorId}/communities
          method: get
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "List vendor communities"
          description: "Returns business community assignments for the vendor. This is not the geographic service-area list."
          swaggerTags:
            - Communities
          responseData:
            200:
              description: "Communities retrieved"
            401:
              description: ""
            403:
              description: ""
            404:
              description: ""

  replacevendorcommunities:
    handler: src/handlers/communities-handler.handleReplacevendorcommunities
    events:
      - http:
          path: /vendors/{vendorId}/communities
          method: put
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Replace vendor communities"
          description: "Admin replacement of the vendor community set. Duplicate ids are ignored. Community existence is owned by User Service and is not checked here."
          swaggerTags:
            - Communities
          bodyType: ReplaceVendorCommunitiesRequest
          responseData:
            200:
              description: "Communities replaced"
            400:
              description: ""
            401:
              description: ""
            403:
              description: ""
            404:
              description: ""
            409:
              description: ""

  addvendorcommunity:
    handler: src/handlers/communities-handler.handleAddvendorcommunity
    events:
      - http:
          path: /vendors/{vendorId}/communities
          method: post
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Add vendor community"
          description: "Admin assignment of one community. Adding an existing assignment is idempotent."
          swaggerTags:
            - Communities
          bodyType: AddVendorCommunityRequest
          responseData:
            200:
              description: "Community assigned"
            400:
              description: ""
            401:
              description: ""
            403:
              description: ""
            404:
              description: ""
            409:
              description: ""

  removevendorcommunity:
    handler: src/handlers/communities-handler.handleRemovevendorcommunity
    events:
      - http:
          path: /vendors/{vendorId}/communities/{communityId}
          method: delete
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Remove vendor community"
          description: "Admin removal of one community assignment. Removing a missing assignment is idempotent."
          swaggerTags:
            - Communities
          responseData:
            200:
              description: "Community removed"
            400:
              description: ""
            401:
              description: ""
            403:
              description: ""
            404:
              description: ""
            409:
              description: ""


  listvendorserviceareas:
    handler: src/handlers/service-areas-handler.handleListvendorserviceareas
    events:
      - http:
          path: /vendors/{vendorId}/service-areas
          method: get
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "List vendor service areas"
          swaggerTags:
            - Service Areas
          responseData:
            200:
              description: "Service areas retrieved successfully"
            401:
              description: ""
            404:
              description: ""
            500:
              description: ""


  addvendorservicearea:
    handler: src/handlers/service-areas-handler.handleAddvendorservicearea
    events:
      - http:
          path: /vendors/{vendorId}/service-areas
          method: post
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Add vendor service area"
          swaggerTags:
            - Service Areas
          bodyType: CreateServiceAreaRequest
          responseData:
            201:
              description: "Service area created successfully"
            400:
              description: ""
            401:
              description: ""
            404:
              description: ""
            409:
              description: ""
            500:
              description: ""


  getvendorservicearea:
    handler: src/handlers/service-areas-handler.handleGetvendorservicearea
    events:
      - http:
          path: /vendors/{vendorId}/service-areas/{serviceAreaId}
          method: get
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Get vendor service area"
          swaggerTags:
            - Service Areas
          responseData:
            200:
              description: "Service area retrieved successfully"
            401:
              description: ""
            404:
              description: ""


  updatevendorservicearea:
    handler: src/handlers/service-areas-handler.handleUpdatevendorservicearea
    events:
      - http:
          path: /vendors/{vendorId}/service-areas/{serviceAreaId}
          method: patch
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Update vendor service area"
          swaggerTags:
            - Service Areas
          bodyType: UpdateServiceAreaRequest
          responseData:
            200:
              description: "Service area updated successfully"
            400:
              description: ""
            401:
              description: ""
            404:
              description: ""


  deletevendorservicearea:
    handler: src/handlers/service-areas-handler.handleDeletevendorservicearea
    events:
      - http:
          path: /vendors/{vendorId}/service-areas/{serviceAreaId}
          method: delete
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Remove vendor service area"
          swaggerTags:
            - Service Areas
          responseData:
            204:
              description: "Service area removed successfully"
            401:
              description: ""
            404:
              description: ""


  getvendoroperatinghours:
    handler: src/handlers/operating-hours-handler.handleGetvendoroperatinghours
    events:
      - http:
          path: /vendors/{vendorId}/operating-hours
          method: get
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Get vendor operating hours"
          swaggerTags:
            - Operating Hours
          responseData:
            200:
              description: "Operating hours retrieved successfully"
            401:
              description: ""
            404:
              description: ""


  updatevendoroperatinghours:
    handler: src/handlers/operating-hours-handler.handleUpdatevendoroperatinghours
    events:
      - http:
          path: /vendors/{vendorId}/operating-hours
          method: put
          cors: true
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Replace vendor operating hours"
          description: "Replaces the vendor's standard weekly operating schedule.\n\nAvailability Service may use this schedule as an input when\ngenerating or validating bookable slots.\n\nHoliday dates and slot blocks are owned by Availability Service and are not stored here.\n"
          swaggerTags:
            - Operating Hours
          bodyType: UpdateVendorOperatingHoursRequest
          responseData:
            200:
              description: "Operating hours updated successfully"
            400:
              description: ""
            401:
              description: ""
            404:
              description: ""


  listvendorstaff:
    handler: src/handlers/staff-handler.handleListvendorstaff
    events:
      - http:
          path: /vendors/{vendorId}/staff
          method: get
          cors: true
