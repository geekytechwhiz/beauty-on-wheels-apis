            tags:
              - Capacity
            requestBody:
              description: "commitmentId, requestedQuantity and reason."
              required: true
            requestModels:
              application/json: CreateCapacityChangeRequest
            methodResponses:
              - statusCode: "201"
                responseBody:
                  description: "Created"
                responseModels:
                  application/json: CapacityChangeRequestResponse
              - statusCode: "400"
                responseBody:
                  description: "Invalid request"
                responseModels:
                  application/json: ErrorResponse
              - statusCode: "401"
                responseBody:
                  description: "Authentication is required"
                responseModels:
