                  items:
                    type: object
                    properties:
                      capabilityId:
                        type: string
                        description: Stable id, e.g. vehicle:SEDAN, wash:FOAM, service:CAR_WASH
                      category:
                        type: string
                        enum:
                          - vehicleType
                          - washMethod
                          - serviceType
                      code:
                        type: string
                      name:
                        type: string
                        description: Display label (same as label)
                      label:
                        type: string
