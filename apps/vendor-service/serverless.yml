functions:

  createvendor:
    handler: src/handlers/vendors-handler.handleCreatevendor
    events:
      - http:
          path: /vendors
          method: post
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Create vendor"
          description: "Creates a vendor profile for the authenticated application user. ownerUserId is taken from the verified user id, not the request body. A second create from the same user returns the existing vendor."
          swaggerTags:
            - Vendors
          bodyType: CreateVendorRequest
          responseData:
            201:
              description: "Vendor created successfully"
              bodyType: VendorResponse
            400:
              description: ""
            401:
              description: ""
            409:
              description: ""
            500:
              description: ""
          documentation:
            summary: Create vendor
            description: Creates a vendor profile for the authenticated application user. ownerUserId is taken from the verified user id, not the request body. A second create from the same user returns the existing vendor.
            tags:
              - Vendors
            methodResponses:
              - statusCode: "201"
                responseBody:
                  description: Vendor created successfully
                responseModels:
                  application/json: VendorResponse
              - statusCode: "400"
                responseBody:
                  description: Create vendor
                responseModels:
                  application/json: ErrorResponse
              - statusCode: "401"
                responseBody:
                  description: Create vendor
                responseModels:
                  application/json: ErrorResponse
              - statusCode: "409"
                responseBody:
                  description: Create vendor
                responseModels:
                  application/json: ErrorResponse
              - statusCode: "500"
                responseBody:
                  description: Create vendor
                responseModels:
                  application/json: ErrorResponse
            requestBody:
              description: Creates a vendor profile for the authenticated application user. ownerUserId is taken from the verified user id, not the request body. A second create from the same user returns the existing vendor.
              required: true
            requestModels:
              application/json: CreateVendorRequest

  getvendoronboarding:
    handler: src/handlers/onboarding-handler.handleGetvendoronboarding
    events:
      - http:
          path: /vendors/{vendorId}/onboarding
          method: get
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Get vendor onboarding state"
          description: "Returns backend-authoritative onboarding progress and persisted section data so the frontend can resume."
          swaggerTags:
            - Onboarding
          responseData:
            200:
              description: "Onboarding state retrieved"
              bodyType: OnboardingResponse
            401:
              description: ""
            403:
              description: ""
            404:
              description: ""
          documentation:
            summary: Get vendor onboarding state
            description: Returns backend-authoritative onboarding progress and persisted section data so the frontend can resume.
            tags:
              - Onboarding
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Onboarding state retrieved
                responseModels:
                  application/json: OnboardingResponse
              - statusCode: "401"
                responseBody:
                  description: Get vendor onboarding state
                responseModels:
                  application/json: ErrorResponse
              - statusCode: "403"
                responseBody:
                  description: Get vendor onboarding state
                responseModels:
                  application/json: ErrorResponse
              - statusCode: "404"
                responseBody:
                  description: Get vendor onboarding state
                responseModels:
                  application/json: ErrorResponse
            pathParams:
              - name: vendorId
                description: vendorId
                schema:
                  type: string

  verifyvendoremail:
    handler: src/handlers/email-verification-handler.handleVerifyVendorEmail
    events:
      - http:
          path: /vendors/email-verification/verify
          method: post
          cors: ${self:custom.httpCors}
          summary: "Verify vendor email"
          description: "Consumes a single-use opaque email verification token and moves the completed onboarding application to PENDING_REVIEW."
          swaggerTags:
            - Onboarding
          responseData:
            200:
              description: "Email verified successfully"
            400:
              description: "Invalid or expired verification link"
            409:
              description: "Verification is already being processed"
          documentation:
            summary: Verify vendor email
            description: Consumes a single-use opaque email verification token and moves the completed onboarding application to PENDING_REVIEW.
            tags:
              - Onboarding
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Email verified successfully
                responseModels:
                  application/json: MessageResponse
              - statusCode: "400"
                responseBody:
                  description: Invalid or expired verification link
                responseModels:
                  application/json: ErrorResponse
              - statusCode: "409"
                responseBody:
                  description: Verification is already being processed
                responseModels:
                  application/json: ErrorResponse
            security: []

  resendvendoremailverification:
    handler: src/handlers/email-verification-handler.handleResendVendorEmailVerification
    events:
      - http:
          path: /vendors/{vendorId}/email-verification/resend
          method: post
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Resend vendor email verification"
          description: "Queues a replacement verification email. The previous link is revoked."
          swaggerTags:
            - Onboarding
          responseData:
            200:
              description: "Verification email queued"
            401:
              description: ""
            403:
              description: ""
            429:
              description: "Verification resend cooldown is active"
          documentation:
            summary: Resend vendor email verification
            description: Queues a replacement verification email. The previous link is revoked.
            tags:
              - Onboarding
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Verification email queued
                responseModels:
                  application/json: MessageResponse
              - statusCode: "401"
                responseBody:
                  description: Resend vendor email verification
                responseModels:
                  application/json: ErrorResponse
              - statusCode: "403"
                responseBody:
                  description: Resend vendor email verification
                responseModels:
                  application/json: ErrorResponse
              - statusCode: "429"
                responseBody:
                  description: Verification resend cooldown is active
                responseModels:
                  application/json: ErrorResponse
            pathParams:
              - name: vendorId
                description: vendorId
                schema:
                  type: string

  updatevendoronboarding:
    handler: src/handlers/onboarding-handler.handleUpdatevendoronboarding
    events:
      - http:
          path: /vendors/{vendorId}/onboarding
          method: patch
          cors: ${self:custom.httpCors}
          authorizer: ${self:custom.securedAuthorizer}
          summary: "Patch vendor onboarding"
          description: "Atomically saves one or more onboarding sections with optimistic concurrency. Omitted fields are preserved."
          swaggerTags:
            - Onboarding
          bodyType: UpdateOnboardingRequest
          responseData:
            200:
              description: "Onboarding updated"
              bodyType: OnboardingResponse
            400:
              description: "Invalid onboarding update payload"
            401:
              description: ""
            403:
              description: ""
            404:
              description: ""
            409:
              description: "Onboarding has changed or is not editable"
          documentation:
            summary: Patch vendor onboarding
            description: Atomically saves one or more onboarding sections using the revision returned by the previous read or update. Omitted fields are preserved.
            tags:
              - Onboarding
            methodResponses:
              - statusCode: "200"
                responseBody:
                  description: Onboarding updated
                responseModels:
                  application/json: OnboardingResponse
              - statusCode: "400"
                responseBody:
                  description: Invalid onboarding update payload
                responseModels:
                  application/json: ErrorResponse
              - statusCode: "401"
                responseBody:
                  description: Patch vendor onboarding
                responseModels:
                  application/json: ErrorResponse
              - statusCode: "403"
                responseBody:
                  description: Patch vendor onboarding
                responseModels:
                  application/json: ErrorResponse
              - statusCode: "404"
                responseBody:
                  description: Patch vendor onboarding
                responseModels:
                  application/json: ErrorResponse
              - statusCode: "409"
                responseBody:
                  description: Onboarding has changed or is not editable
                responseModels:
                  application/json: ErrorResponse
            pathParams:
              - name: vendorId
                description: vendorId
                schema:
                  type: string
            requestBody:
              description: Atomically saves one or more onboarding sections using the revision returned by the previous read or update. Omitted fields are preserved.
              required: true
            requestModels:
              application/json: UpdateOnboardingRequest

  onVendorOnboardingSubmitted:
    handler: src/handlers/vendor-onboarding-stream.handler
    name: ${self:custom.resourcePrefix}-vendor-onboarding-stream
    timeout: 60
    events:
      - stream:
          type: dynamodb
          arn: !GetAtt VendorTable.StreamArn
          batchSize: 10
          startingPosition: LATEST
          bisectBatchOnFunctionError: true
          maximumRetryAttempts: 3
          functionResponseType: ReportBatchItemFailures
          destinations:
            onFailure:
              arn: !GetAtt VendorOnboardingStreamDlq.Arn
              type: sqs

  onVendorEmailVerificationRequested:
    handler: src/handlers/vendor-email-verification-stream.handler
    name: ${self:custom.resourcePrefix}-vendor-email-verification-stream
    timeout: 60
    events:
      - stream:
          type: dynamodb
          arn: !GetAtt VendorTable.StreamArn
          filterPatterns:
            - eventName:
                - INSERT
                - MODIFY
              dynamodb:
                NewImage:
                  entityType:
                    S:
                      - Vendor
                  SK:
                    S:
                      - PROFILE
          batchSize: 10
          startingPosition: LATEST
          bisectBatchOnFunctionError: true
          maximumRetryAttempts: 3
          functionResponseType: ReportBatchItemFailures
          destinations:
            onFailure:
              arn: !GetAtt VendorEmailVerificationStreamDlq.Arn
              type: sqs

  onVendorLifecycleChanged:
    handler: src/handlers/vendor-lifecycle-stream.handler
    name: ${self:custom.resourcePrefix}-vendor-lifecycle-stream
    timeout: 60
    events:
      - stream:
          type: dynamodb
          arn: !GetAtt VendorTable.StreamArn
