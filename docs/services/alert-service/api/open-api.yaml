  /v1/alerts/workflow:
    post:
      operationId: updateAlertWorkflow
      summary: Workflow transitions (single or multi-select)
      description: >
        Same state machine as before, unified: pass **`alertIds`** with one id or many.
        Multiple ids require **identical `alertState`** on every alert or **422**
        (`BULK_HETEROGENEOUS_ALERT_STATE`). With **one** id, `applyToGroup` may resolve/dismiss the whole group.
      tags: [Alert instances]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowMutationRequest'
            examples:
              single:
                summary: Single alert
                value:
                  alertIds: [3fa85f64-5717-4562-b3fc-2c963f66afa6]
                  action: START_WORK
              multi:
                summary: Same transition for many alerts (homogeneous state)
                value:
                  alertIds:
                    - 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    - 4fa85f64-5717-4562-b3fc-2c963f66afa7
                  action: RESOLVE
                  closureComment: Bulk resolved
              group:
                summary: One id + apply to group
                value:
                  alertIds: [3fa85f64-5717-4562-b3fc-2c963f66afa6]
                  action: RESOLVE
                  closureComment: Stabilized
                  applyToGroup: true
      responses:
        '200':
          description: Mutation result; optional `primaryAlert` when one alert updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseWorkflowMutationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /v1/alerts/priority:
    patch:
      operationId: updateAlertPriority
      summary: Change priority (single or multi-select)
      tags: [Alert instances]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriorityMutationRequest'
            examples:
              one:
                value:
                  alertIds: [3fa85f64-5717-4562-b3fc-2c963f66afa6]
                  priority: P1
              many:
                value:
                  alertIds:
                    - 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    - 4fa85f64-5717-4562-b3fc-2c963f66afa7
                  priority: P2
                  comment: Triage bump
      responses:
        '200':
          description: Per-alert outcomes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseAlertMutationResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/alerts/assignment:
    post:
      operationId: updateAlertAssignment
