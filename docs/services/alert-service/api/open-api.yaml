openapi: 3.0.3
info:
  title: Alert Service API
  version: 1.0.0
  description: >
    Operational REST API for the Alert Service. Alerts are created via **POST /v1/alerts** for authorized
    callers (e.g. care ops UI). Policy definitions live outside this service. List endpoints support filters
    and search; workflow, priority, and assignment use unified endpoints with `alertIds` (one or many).

    **Tenancy:** organization scope is derived from the **JWT** only (no `X-Org-Id` header).
    No optional tracing header is required; correlation may appear in responses (`ProblemDetails.correlationId`, `SuccessResponse.requestId`).

servers:
  - url: https://api.example.com
    description: Production

security:
  - bearerAuth: []

tags:
  - name: Alert instances
    description: >
      Create (POST /v1/alerts), list, detail, unified workflow (POST /v1/alerts/workflow), priority
      (PATCH /v1/alerts/priority), assignment (POST /v1/alerts/assignment) with alertIds,
      notes, and activity timeline.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Tenant scope comes from the JWT organization claim (e.g. `org_id` / `organization_id` — product-defined).
        Do not send a separate org header; the service resolves org from the token for every request.

  parameters:
    alertId:
      name: alertId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    SuccessResponse:
      type: object
      properties:
        data:
          description: Response data (can be object, array, or null)
          oneOf:
            - type: object
            - type: array
            - type: "null"
        meta:
          type: object
          description: Additional metadata (optional)
          additionalProperties: true
        links:
          type: object
          description: Related resource links (optional)
          additionalProperties:
            type: string
        requestId:
          type: string
          description: Request correlation ID
          example: "req-123"
        message:
          type: string
          description: Success message (optional)
          example: "Operation completed successfully"
      required:
        - data

    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          description: URI reference that identifies the problem type
          default: "about:blank"
          example: "about:blank"
        title:
          type: string
          description: Short, human-readable summary of the problem
          example: "Validation failed"
        status:
          type: integer
          description: HTTP status code
          example: 400
        detail:
          type: string
          description: Human-readable explanation of the problem
          example: "Invalid request data"
        instance:
          type: string
          description: URI reference that identifies the specific occurrence of the problem
        code:
          type: string
          description: Application-specific error code (e.g. INVALID_STATE_TRANSITION, BULK_HETEROGENEOUS_ALERT_STATE)
          example: "VALIDATION_ERROR"
        correlationId:
          type: string
          description: Optional correlation ID for tracing (e.g. server-generated).
          example: "req-123"
        errors:
          type: array
          description: List of validation errors (optional)
          items:
            type: object
            properties:
              field:
                type: string
                description: Field name that has the error
                example: "alertIds"
              message:
                type: string
                description: Error message
                example: "Invalid format"
            required:
              - message
      required:
        - title
        - status

    SuccessResponsePaginatedAlerts:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PaginatedAlerts'

    SuccessResponseAlertDetail:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AlertDetail'

    SuccessResponseWorkflowMutationResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/WorkflowMutationResponse'

    SuccessResponseAlertMutationResult:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AlertMutationResult'

    SuccessResponsePaginatedActivity:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PaginatedActivity'

    SuccessResponseActivityRecord:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ActivityRecord'

    InputType:
      type: string
      enum:
        - THRESHOLD_BREACH
        - MISSED_READING
        - MISSING_DEVICE
        - SYMPTOM_RISK_TRIGGER
        - ENGAGEMENT_TRIGGER

    SourceType:
      type: string
      enum:
        - MONITORING_SERVICE
        - DEVICE_MONITORING
        - DEVICE_WORKFLOW
        - SYMPTOM_ENGINE
        - ENGAGEMENT_SERVICE
        - USER_INTERFACE

    AppliesToType:
      type: string
      enum: [VITAL_SIGN, DEVICE, SYMPTOM, ENGAGEMENT]

    Priority:
      type: string
      enum: [P0, P1, P2, P3]

    AlertState:
      type: string
      enum:
        - UNASSIGNED
        - ASSIGNED
        - IN_PROGRESS
        - WAITING
        - RESOLVED
        - DISMISSED

    SeverityHint:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]

    ComparisonOperator:
      type: string
      description: How `observedValue` relates to the threshold (THRESHOLD_BREACH evidence).
      enum: [GT, LT, GTE, LTE, EQ]

    EvidencePayload:
      type: object
      description: >
        Structured evidence; **`inputType` here must equal the request’s top-level `inputType`**. Shared fields:
        `eventTimestamp`, `source`, and discriminant `inputType`. When top-level `appliesToType` / `linkedEntityCode`
        are set, the same pair should appear on the payload. **THRESHOLD_BREACH:** supply `thresholdValue` **or**
        both `minValue` and `maxValue` (not both styles). **MISSED_READING:** `missedDuration` is an ISO-8601 duration (e.g. `P3D`).
      oneOf:
        - $ref: '#/components/schemas/EvidenceThresholdBreach'
        - $ref: '#/components/schemas/EvidenceMissedReading'
        - $ref: '#/components/schemas/EvidenceMissingDevice'
        - $ref: '#/components/schemas/EvidenceSymptomRisk'
        - $ref: '#/components/schemas/EvidenceEngagement'

    EvidenceThresholdBreach:
      type: object
      required:
        - eventTimestamp
        - source
        - inputType
        - observedValue
        - unit
        - comparisonOperator
        - severityLevel
        - readingTimestamp
        - readingSource
      properties:
        eventTimestamp:
          type: string
          format: date-time
        source:
          $ref: '#/components/schemas/SourceType'
        inputType:
          type: string
          enum: [THRESHOLD_BREACH]
        appliesToType:
          $ref: '#/components/schemas/AppliesToType'
        linkedEntityCode:
          type: string
        observedValue:
          type: number
        unit:
          type: string
        comparisonOperator:
          $ref: '#/components/schemas/ComparisonOperator'
        thresholdValue:
          type: number
        minValue:
          type: number
        maxValue:
          type: number
        severityLevel:
          $ref: '#/components/schemas/SeverityHint'
        readingTimestamp:
          type: string
          format: date-time
        readingSource:
          type: string
      additionalProperties: true

    EvidenceMissedReading:
      type: object
      required:
        - eventTimestamp
        - source
        - inputType
        - lastSuccessfulReadingTimestamp
        - missedDuration
        - readingType
      properties:
        eventTimestamp:
          type: string
          format: date-time
        source:
          $ref: '#/components/schemas/SourceType'
        inputType:
          type: string
          enum: [MISSED_READING]
        appliesToType:
          $ref: '#/components/schemas/AppliesToType'
        linkedEntityCode:
          type: string
        lastSuccessfulReadingTimestamp:
          type: string
          format: date-time
        missedDuration:
          type: string
        readingType:
          type: string
      additionalProperties: true

    EvidenceMissingDevice:
      type: object
      required:
        - eventTimestamp
        - source
        - inputType
        - deviceLinked
      properties:
        eventTimestamp:
          type: string
          format: date-time
        source:
          $ref: '#/components/schemas/SourceType'
        inputType:
          type: string
          enum: [MISSING_DEVICE]
        appliesToType:
          $ref: '#/components/schemas/AppliesToType'
        linkedEntityCode:
          type: string
        deviceLinked:
          type: boolean
      additionalProperties: true

    EvidenceSymptomRisk:
      type: object
      required:
        - eventTimestamp
        - source
        - inputType
        - questionCode
        - responseValue
        - responseTimestamp
      properties:
        eventTimestamp:
          type: string
          format: date-time
        source:
          $ref: '#/components/schemas/SourceType'
        inputType:
          type: string
          enum: [SYMPTOM_RISK_TRIGGER]
        appliesToType:
          $ref: '#/components/schemas/AppliesToType'
        linkedEntityCode:
          type: string
        questionCode:
          type: string
        responseValue:
          type: string
        responseLabel:
          type: string
        responseTimestamp:
          type: string
          format: date-time
      additionalProperties: true

    EvidenceEngagement:
      type: object
      required:
        - eventTimestamp
        - source
        - inputType
        - engagementEventCode
      properties:
        eventTimestamp:
          type: string
          format: date-time
        source:
          $ref: '#/components/schemas/SourceType'
        inputType:
          type: string
          enum: [ENGAGEMENT_TRIGGER]
        appliesToType:
          $ref: '#/components/schemas/AppliesToType'
        linkedEntityCode:
          type: string
        engagementEventCode:
          type: string
        dueAt:
          type: string
          format: date-time
        missedDuration:
          type: string
      additionalProperties: true

    ActivityType:
      type: string
      enum:
        - ALERT_CREATED
        - ALERT_GROUPED
        - ALERT_ASSIGNED
        - ALERT_REASSIGNED
        - ALERT_STATE_CHANGED
        - EVIDENCE_ADDED_OR_UPDATED
        - ALERT_RESOLVED
        - ALERT_DISMISSED
        - SLA_BREACHED
        - NOTE_ADDED
        - PRIORITY_CHANGED

    QueueKind:
      type: string
      description: Team Queue (default) or My Alerts (alerts assigned to the current user).
      enum: [TEAM, MY]
      default: TEAM

    AlertListAssignmentFilter:
      type: string
      description: >
        When present, narrows the list by assignee presence. Omit this parameter entirely when the client does not
        want to filter by assignment status (return both assigned and unassigned according to other filters).
        `UNASSIGNED` — only alerts with no assignee. `ASSIGNED` — only alerts that have a current assignee.
      enum: [UNASSIGNED, ASSIGNED]

    AssignmentAction:
      type: string
      enum: [ASSIGN, ASSIGN_TO_SELF, REASSIGN, UNASSIGN]

    WorkflowAction:
      type: string
      enum: [START_WORK, WAIT, RESUME, RESOLVE, DISMISS]

    CreateAlertRequest:
      type: object
      description: >
        Creates an alert record: server assigns `alertId`, writes `ALERT_CREATED` activity, applies
        grouping/SLA rules, and projects to list GSIs. **Organization** is taken from the JWT (not repeated
        in body). **`inputEventId`** is optional (UUID) for idempotent creates (**409** on replay).
        **`inputType`** and **`sourceType`** are required and must match **`evidencePayload.inputType`**; when top-level
        `appliesToType` / `linkedEntityCode` are set they must match the payload. Pair **`triggerSummaryTemplateCode`**
        with **`triggerSummaryParams`** (use `{}` if no placeholders).
      required:
        - inputType
        - sourceType
        - patientId
        - triggerTimestamp
        - evidencePayload
      properties:
        inputEventId:
          type: string
          format: uuid
          description: >
            Optional idempotency key. Same UUID retried for the same org returns **409** with the existing alert.
        inputType:
          $ref: '#/components/schemas/InputType'
        sourceType:
          $ref: '#/components/schemas/SourceType'
        patientId:
          type: string
          format: uuid
        carePlanInstanceId:
          type: string
          format: uuid
        packageAssignmentId:
          type: string
          format: uuid
        triggerTimestamp:
          type: string
          format: date-time
          description: When the condition occurred (not receipt time).
        appliesToType:
          $ref: '#/components/schemas/AppliesToType'
        linkedEntityCode:
          type: string
        severityHint:
          $ref: '#/components/schemas/SeverityHint'
        priority:
          $ref: '#/components/schemas/Priority'
          description: Resolved priority; if omitted, derived from policy when applicable.
        alertPolicyTemplateVersionId:
          type: string
          format: uuid
        thresholdTemplateVersionId:
          type: string
          format: uuid
        groupingKey:
          type: string
          description: If omitted, computed from policy/grouping strategy.
        triggerSummary:
          type: string
          description: Pre-rendered summary; if omitted, built from template fields when provided.
        triggerSummaryTemplateCode:
          type: string
        triggerSummaryParams:
          type: object
          additionalProperties: true
          description: >
            Required when `triggerSummaryTemplateCode` is set (may be `{}`). Omit both when using only pre-rendered `triggerSummary`.
        evidencePayload:
          $ref: '#/components/schemas/EvidencePayload'

    AlertSummary:
      type: object
      properties:
        alertId:
          type: string
          format: uuid
        priority:
          $ref: '#/components/schemas/Priority'
        alertState:
          $ref: '#/components/schemas/AlertState'
        inputType:
          $ref: '#/components/schemas/InputType'
        sourceType:
          $ref: '#/components/schemas/SourceType'
        triggerSummary:
          type: string
        triggerTimestamp:
          type: string
          format: date-time
        groupingKey:
          type: string
        patientId:
          type: string
          format: uuid
        patientName:
          type: string
        assignedToUserId:
          type: string
          format: uuid
          nullable: true
        assignedToDisplayName:
          type: string
        slaBreachIndicator:
          type: boolean
          description: True when assignment or resolution SLA is breached.
        assignSlaDueAt:
          type: string
          format: date-time
        resolveSlaDueAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    AlertDetail:
      allOf:
        - $ref: '#/components/schemas/AlertSummary'
        - type: object
          properties:
            inputEventId:
              type: string
              format: uuid
            orgId:
              type: string
              format: uuid
            evidencePayload:
              type: object
              additionalProperties: true
            groupId:
              type: string
              format: uuid
              description: Operational group for drill-down and applyToGroup actions.
            assignedAt:
              type: string
              format: date-time
            assignedBy:
              type: string
              format: uuid
            statusUpdatedAt:
              type: string
              format: date-time
            statusUpdatedBy:
              type: string
              format: uuid
            closureComment:
              type: string
            resolutionCode:
              type: string
            dismissReason:
              type: string
            assignSla:
              type: integer
              description: Assignment SLA window in minutes (from creation).
            resolveSla:
              type: integer
              description: Resolution SLA window in minutes (from assignment).
            assignSlaBreachedAt:
              type: string
              format: date-time
            resolveSlaBreachedAt:
              type: string
              format: date-time
            carePlanInstanceId:
              type: string
              format: uuid
            packageAssignmentId:
              type: string
              format: uuid
            alertPolicyTemplateVersionId:
              type: string
              format: uuid
            thresholdTemplateVersionId:
              type: string
              format: uuid

    ActivityRecord:
      type: object
      properties:
        activityId:
          type: string
          format: uuid
        alertId:
          type: string
          format: uuid
        activityType:
          $ref: '#/components/schemas/ActivityType'
        activityTimestamp:
          type: string
          format: date-time
        performedBy:
          type: string
          description: User ID or SYSTEM.
        performedByDisplayName:
          type: string
        activityComment:
          type: string
        previousState:
          $ref: '#/components/schemas/AlertState'
        newState:
          $ref: '#/components/schemas/AlertState'
        previousPriority:
          $ref: '#/components/schemas/Priority'
        newPriority:
          $ref: '#/components/schemas/Priority'
        previousAssignee:
          type: string
          format: uuid
        newAssignee:
          type: string
          format: uuid
        evidencePayload:
          type: object
          additionalProperties: true

    AssignmentRequest:
      type: object
      required: [action]
      properties:
        action:
          $ref: '#/components/schemas/AssignmentAction'
        assignToUserId:
          type: string
          format: uuid
          description: Required for ASSIGN and REASSIGN.
        comment:
          type: string
          description: Optional; used with REASSIGN.

    AlertIds:
      type: array
      description: One or many alert ids (single-select = array of one element).
      items:
        type: string
        format: uuid
      minItems: 1
      maxItems: 100

    WorkflowMutationRequest:
      type: object
      required: [alertIds, action]
      description: >
        Applies the same workflow action to every id in `alertIds`. For **multiple** ids,
        **all listed alerts must share the same `alertState`** or the request fails with 422
        (`BULK_HETEROGENEOUS_ALERT_STATE`) and **none** are updated. For a **single** id,
        normal state-machine rules apply. `applyToGroup` is only valid when `alertIds` has
        exactly one element.
      properties:
        alertIds:
          $ref: '#/components/schemas/AlertIds'
        action:
          $ref: '#/components/schemas/WorkflowAction'
        closureComment:
          type: string
          description: Required for RESOLVE and DISMISS (terminal closure).
        resolutionCode:
          type: string
          description: Optional structured code when resolving.
        dismissReason:
          type: string
          description: Optional structured reason when dismissing.
        comment:
          type: string
          description: Optional for START_WORK, WAIT, and RESUME.
        applyToGroup:
          type: boolean
          default: false
          description: >
            Only when `alertIds` contains exactly one id: when true with RESOLVE or DISMISS,
            applies to all open alerts in the same group. Ignored when multiple ids are present.

    NoteRequest:
      type: object
      required: [comment]
      properties:
        comment:
          type: string

    PriorityMutationRequest:
      type: object
      required: [alertIds, priority]
      properties:
        alertIds:
          $ref: '#/components/schemas/AlertIds'
        priority:
          $ref: '#/components/schemas/Priority'
        comment:
          type: string

    AssignmentMutationRequest:
      allOf:
        - type: object
          required: [alertIds]
          properties:
            alertIds:
              $ref: '#/components/schemas/AlertIds'
        - $ref: '#/components/schemas/AssignmentRequest'

    AlertMutationResult:
      type: object
      description: >
        Per-alert outcomes. For workflow with one id and `applyToGroup`, `affectedCount` may be set.
      properties:
        succeeded:
          type: array
          items:
            type: string
            format: uuid
        failed:
          type: array
          items:
            type: object
            required: [alertId, code, message]
            properties:
              alertId:
                type: string
                format: uuid
              code:
                type: string
                example: NOT_FOUND
              message:
                type: string
        affectedCount:
          type: integer
          description: Present when `applyToGroup` resolved/dismissed multiple alerts in a group.

    WorkflowMutationResponse:
      allOf:
        - $ref: '#/components/schemas/AlertMutationResult'
        - type: object
          properties:
            primaryAlert:
              $ref: '#/components/schemas/AlertDetail'
              description: Optional; when a single alert was updated, full detail may be returned.

    PaginatedAlerts:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AlertSummary'
        nextToken:
          type: string
          description: Opaque cursor for the next page.

    PaginatedActivity:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActivityRecord'
        nextToken:
          type: string

  responses:
    BadRequest:
      description: Bad request — invalid input data
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "about:blank"
            title: "Validation failed"
            status: 400
            detail: "Invalid request data"
            code: "VALIDATION_ERROR"
            correlationId: "req-123"

    Unauthorized:
      description: Unauthorized — missing or invalid authentication
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "about:blank"
            title: "Unauthorized"
            status: 401
            detail: "Missing or invalid access token"
            code: "UNAUTHORIZED"
            correlationId: "req-123"

    Forbidden:
      description: Forbidden — insufficient permissions
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "about:blank"
            title: "Forbidden"
            status: 403
            detail: "Insufficient permission for this operation"
            code: "FORBIDDEN"
            correlationId: "req-123"

    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "about:blank"
            title: "Not found"
            status: 404
            detail: "Alert not found"
            code: "NOT_FOUND"
            correlationId: "req-123"

    Conflict:
      description: Resource conflict (e.g. idempotent replay)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "about:blank"
            title: "Conflict"
            status: 409
            detail: "Request conflicts with current state"
            code: "CONFLICT"
            correlationId: "req-123"

    UnprocessableEntity:
      description: >
        Unprocessable entity — e.g. `BULK_HETEROGENEOUS_ALERT_STATE`, `INVALID_STATE_TRANSITION`, or request validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "about:blank"
            title: "Unprocessable entity"
            status: 422
            detail: "Invalid state transition or heterogeneous bulk state"
            code: "BULK_HETEROGENEOUS_ALERT_STATE"
            correlationId: "req-123"

    InternalServerError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "about:blank"
            title: "Internal server error"
            status: 500
            detail: "An unexpected error occurred"
            code: "INTERNAL_ERROR"
            correlationId: "req-123"

paths:
  /v1/alerts:
    get:
      operationId: listAlerts
      summary: List alerts (Team Queue or My Alerts)
      description: >
        Supports the **Filters** panel and the list toolbar **search** field used in the UI.
        **Team Queue** vs **My Alerts** maps to `queue` (`TEAM` default, `MY` for the current user’s assignments).
        **Assignment:** omit `assignment` when no assignment filter is needed.
        Use `assignment` (`UNASSIGNED` or `ASSIGNED`) only when filtering by whether an alert has an assignee.
        **`queue=MY`** already restricts to the current user’s assignments.
        **Filter modal:** Priority → `priority`; Status → `state`; Type → `inputType`.
        **Patient-centric / timeline:** optional `patientId` (UUID) restricts the list to alerts for that patient
        (still scoped to the organization from the JWT). Omit for the global Team Queue or My Alerts views.
        **`patientId` may be combined** with `queue`, `state`, `priority`, `inputType`, `assignment`, and
        `dateFrom` / `dateTo` as usual.
        **By date range** → `dateFrom` / `dateTo` (inclusive).
        **Search bar** (`search`) matches **patient name** and/or **alert id** (substring or exact per implementation).
        When `patientId` is set, `search` may still apply (e.g. alert id substring); matching **patient name** is
        redundant if the patient is already fixed by `patientId`.
        Combine filters with `search` as needed; results are paginated with `pageSize` and `nextToken`.
        **Ordering:** which attribute the list is sorted by and ascending vs descending are implementation-defined
        (typically newest first by created time). Date bounds align with the list index timestamp when the server
        applies date-range filtering.
      tags: [Alert instances]
      parameters:
        - name: queue
          in: query
          description: Team Queue (`TEAM`) or My Alerts (`MY`).
          schema:
            $ref: '#/components/schemas/QueueKind'
        - name: state
          in: query
          description: Filter by alert status (UI **Status** dropdown).
          schema:
            $ref: '#/components/schemas/AlertState'
        - name: priority
          in: query
          description: Filter by priority (UI **Priority** dropdown).
          schema:
            $ref: '#/components/schemas/Priority'
        - name: inputType
          in: query
          description: Filter by alert type (UI **Type** dropdown).
          schema:
            $ref: '#/components/schemas/InputType'
        - name: assignment
          in: query
          description: >
            Omit when not filtering by assignment status. When set, `UNASSIGNED` or `ASSIGNED` (see schema).
          schema:
            $ref: '#/components/schemas/AlertListAssignmentFilter'
        - name: patientId
          in: query
          description: >
            When set, return only alerts linked to this patient (UUID). Organization scope comes from the JWT.
            Omit for the default Team Queue or My Alerts list without a patient filter.
          schema:
            type: string
            format: uuid
          example: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
        - name: dateFrom
          in: query
          description: Start of **By date range** (inclusive, ISO-8601).
          schema:
            type: string
            format: date-time
        - name: dateTo
          in: query
          description: End of **By date range** (inclusive, ISO-8601).
          schema:
            type: string
            format: date-time
        - name: search
          in: query
          description: >
            Same behavior as the toolbar **“Search by Patient / Alert ID”** field: match against **patient name**
            (display name) and **alert id** (supports partial id text). Server-side search index recommended at scale;
            otherwise implement via supported backend or document client-side filtering limits.
          schema:
            type: string
            example: Jane Doe
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: nextToken
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated alert list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponsePaginatedAlerts'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      operationId: createAlert
      summary: Create an alert
      description: >
        Adds a new alert for the organization in the JWT scope: new `alertId`, initial state typically
        `UNASSIGNED`, grouping/SLA applied, `ALERT_CREATED` activity recorded. Requires permission to create
        alerts. Prefer **`sourceType`: `USER_INTERFACE`** when the origin is this API or the care UI.
      tags: [Alert instances]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlertRequest'
            examples:
              thresholdBreach:
                summary: Monitoring / threshold breach (policy id + evidence)
                value:
                  inputEventId: evt-test-001
                  inputType: THRESHOLD_BREACH
                  sourceType: MONITORING_SERVICE
                  patientId: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
                  triggerTimestamp: '2026-04-27T12:00:00.000Z'
                  priority: P2
                  alertPolicyTemplateVersionId: aptv-0001
                  evidencePayload:
                    metricCode: HR
                    reading: 110
              uiManual:
                summary: Manual create from UI (engagement)
                value:
                  inputType: ENGAGEMENT_TRIGGER
                  sourceType: USER_INTERFACE
                  patientId: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
                  triggerTimestamp: '2026-04-13T12:00:00.000Z'
                  priority: P1
                  triggerSummary: Patient follow-up required
                  evidencePayload:
                    engagementType: FOLLOW_UP
                    channel: IN_APP
      responses:
        '201':
          description: Alert created.
          headers:
            Location:
              description: URL of the new alert (`/v1/alerts/{alertId}`).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseAlertDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Idempotent replay — `inputEventId` already processed; returns existing alert in `data`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseAlertDetail'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/alerts/workflow:
    post:
      operationId: updateAlertWorkflow
      summary: Workflow transitions (single or multi-select)
      description: >
        Same state machine as before, unified: pass **`alertIds`** with one id or many.
        Multiple ids require **identical `alertState`** on every alert or **422**
        (`BULK_HETEROGENEOUS_ALERT_STATE`). With **one** id, `applyToGroup` may resolve/dismiss the whole group.
      tags: [Alert instances]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowMutationRequest'
            examples:
              single:
                summary: Single alert
                value:
                  alertIds: [3fa85f64-5717-4562-b3fc-2c963f66afa6]
                  action: START_WORK
              multi:
                summary: Same transition for many alerts (homogeneous state)
                value:
                  alertIds:
                    - 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    - 4fa85f64-5717-4562-b3fc-2c963f66afa7
                  action: RESOLVE
                  closureComment: Bulk resolved
              group:
                summary: One id + apply to group
                value:
                  alertIds: [3fa85f64-5717-4562-b3fc-2c963f66afa6]
                  action: RESOLVE
                  closureComment: Stabilized
                  applyToGroup: true
      responses:
        '200':
          description: Mutation result; optional `primaryAlert` when one alert updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseWorkflowMutationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /v1/alerts/priority:
    patch:
      operationId: updateAlertPriority
      summary: Change priority (single or multi-select)
      tags: [Alert instances]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriorityMutationRequest'
            examples:
              one:
                value:
                  alertIds: [3fa85f64-5717-4562-b3fc-2c963f66afa6]
                  priority: P1
              many:
                value:
                  alertIds:
                    - 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    - 4fa85f64-5717-4562-b3fc-2c963f66afa7
                  priority: P2
                  comment: Triage bump
      responses:
        '200':
          description: Per-alert outcomes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponseAlertMutationResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/alerts/assignment:
    post:
      operationId: updateAlertAssignment
      summary: Assignment actions (single or multi-select)
      tags: [Alert instances]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentMutationRequest'
