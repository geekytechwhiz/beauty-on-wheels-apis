openapi: 3.0.3
info:
  title: Alert Service API
  version: 1.0.0
  description: >
    Operational REST API for the Alert Service. Alerts are created via **POST /v1/alerts** for authorized
    callers (e.g. care ops UI). Policy definitions live outside this service. List endpoints support filters
    and search; workflow, priority, and assignment use unified endpoints with `alertIds` (one or many).

    **Tenancy:** organization scope is derived from the **JWT** only (no `X-Org-Id` header).
    No optional tracing header is required; correlation may appear in responses (`ProblemDetails.correlationId`, `SuccessResponse.requestId`).

servers:
  - url: https://api.example.com
    description: Production

security:
  - bearerAuth: []

tags:
  - name: Alert instances
    description: >
      Create (POST /v1/alerts), list, detail, unified workflow (POST /v1/alerts/workflow), priority
      (PATCH /v1/alerts/priority), assignment (POST /v1/alerts/assignment) with alertIds,
      notes, and activity timeline.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Tenant scope comes from the JWT organization claim (e.g. `org_id` / `organization_id` — product-defined).
        Do not send a separate org header; the service resolves org from the token for every request.

  parameters:
    alertId:
      name: alertId
      in: path
      required: true
      schema:
        type: string

  schemas:
    SuccessResponse:
      type: object
      properties:
        data:
          description: Response data (can be object, array, or null)
          nullable: true
          oneOf:
            - type: object
            - type: array
        meta:
          type: object
          description: Additional metadata (optional)
          additionalProperties: true
        links:
          type: object
          description: Related resource links (optional)
          additionalProperties:
            type: string
        requestId:
          type: string
          description: Request correlation ID
          example: "req-123"
        message:
          type: string
          description: Success message (optional)
          example: "Operation completed successfully"
      required:
        - data

    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          description: URI reference that identifies the problem type
          default: "about:blank"
          example: "about:blank"
        title:
          type: string
          description: Short, human-readable summary of the problem
          example: "Validation failed"
        status:
          type: integer
          description: HTTP status code
          example: 400
        detail:
          type: string
          description: Human-readable explanation of the problem
          example: "Invalid request data"
        instance:
          type: string
          description: URI reference that identifies the specific occurrence of the problem
        code:
          type: string
          description: Application-specific error code (e.g. INVALID_STATE_TRANSITION, BULK_HETEROGENEOUS_ALERT_STATE)
          example: "VALIDATION_ERROR"
        correlationId:
          type: string
          description: Optional correlation ID for tracing (e.g. server-generated).
          example: "req-123"
        errors:
          type: array
          description: List of validation errors (optional)
          items:
            type: object
            properties:
              field:
                type: string
                description: Field name that has the error
                example: "alertIds"
              message:
                type: string
                description: Error message
                example: "Invalid format"
            required:
              - message
      required:
        - title
        - status

    SuccessResponsePaginatedAlerts:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PaginatedAlerts'

    SuccessResponseAlertDetail:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AlertDetail'

    SuccessResponseWorkflowMutationResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/WorkflowMutationResponse'

    SuccessResponseAlertMutationResult:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AlertMutationResult'

    SuccessResponsePaginatedActivity:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PaginatedActivity'

    SuccessResponseActivityRecord:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ActivityRecord'

    InputType:
      type: string
      enum:
        - THRESHOLD_BREACH
        - MISSED_READING
        - MISSING_DEVICE
        - SYMPTOM_RISK_TRIGGER
        - ENGAGEMENT_TRIGGER

    CreateAlertInputType:
      type: string
      description: POST `/alerts` only — §5.1.3.1 create variants.
      enum:
        - MISSED_READING
        - MISSING_DEVICE

    SourceType:
      type: string
      enum:
        - MONITORING_SERVICE
        - DEVICE_MONITORING
        - DEVICE_WORKFLOW
        - SYMPTOM_ENGINE
        - ENGAGEMENT_SERVICE
        - USER_INTERFACE

    AppliesToType:
      type: string
      enum: [VITAL_SIGN, DEVICE, SYMPTOM, ENGAGEMENT]

    Priority:
      type: string
      enum: [P0, P1, P2, P3]

    AlertState:
      type: string
      enum:
        - UNASSIGNED
        - ASSIGNED
        - IN_PROGRESS
        - WAITING
        - RESOLVED
        - DISMISSED

    SeverityHint:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]

    EvidencePayload:
      type: object
      description: >
        POST `/alerts` only: **`MISSED_READING`** or **`MISSING_DEVICE`**. Required §5.1.3.1 common fields on every
        variant: `eventTimestamp`, `source`, `inputType`, `appliesToType`, `linkedEntityCode`, plus type-specific
        fields only. Strict — no extra properties.
      oneOf:
        - $ref: '#/components/schemas/EvidenceMissedReading'
        - $ref: '#/components/schemas/EvidenceMissingDevice'

    EvidenceMissedReading:
      type: object
      description: >
        **Required:** `eventTimestamp`, `source`, `inputType`, `appliesToType`, `linkedEntityCode`,
        `lastSuccessfulReadingTimestamp`, `missedDuration`, `readingType`. No additional properties.
      required:
        - eventTimestamp
        - source
        - inputType
        - appliesToType
        - linkedEntityCode
        - lastSuccessfulReadingTimestamp
        - missedDuration
        - readingType
      properties:
        eventTimestamp:
          type: string
          format: date-time
        source:
          $ref: '#/components/schemas/SourceType'
        inputType:
          type: string
          enum: [MISSED_READING]
        appliesToType:
          $ref: '#/components/schemas/AppliesToType'
        linkedEntityCode:
          type: string
        lastSuccessfulReadingTimestamp:
          type: string
          format: date-time
        missedDuration:
          type: string
          description: Missed-reading window (e.g. ISO 8601 duration P3D; product convention).
        readingType:
          type: string
      additionalProperties: false

    EvidenceMissingDevice:
      type: object
      description: >
        **Required:** `eventTimestamp`, `source`, `inputType`, `appliesToType`, `linkedEntityCode`, `deviceLinked`.
        No additional properties.
      required:
        - eventTimestamp
        - source
        - inputType
        - appliesToType
        - linkedEntityCode
        - deviceLinked
      properties:
        eventTimestamp:
          type: string
          format: date-time
        source:
          $ref: '#/components/schemas/SourceType'
        inputType:
          type: string
          enum: [MISSING_DEVICE]
        appliesToType:
          $ref: '#/components/schemas/AppliesToType'
        linkedEntityCode:
          type: string
        deviceLinked:
          type: boolean
      additionalProperties: false

    ActivityType:
      type: string
      enum:
        - ALERT_CREATED
        - ALERT_GROUPED
        - ALERT_ASSIGNED
        - ALERT_REASSIGNED
        - ALERT_STATE_CHANGED
        - EVIDENCE_ADDED_OR_UPDATED
        - ALERT_RESOLVED
        - ALERT_DISMISSED
        - SLA_BREACHED
        - NOTE_ADDED
        - PRIORITY_CHANGED

    QueueKind:
      type: string
      description: Team Queue (default) or My Alerts (alerts assigned to the current user).
      enum: [TEAM, MY]
      default: TEAM

    AlertListAssignmentFilter:
      type: string
      description: >
        When present, narrows the list by assignee presence. Omit this parameter entirely when the client does not
        want to filter by assignment status (return both assigned and unassigned according to other filters).
        `UNASSIGNED` — only alerts with no assignee. `ASSIGNED` — only alerts that have a current assignee.
      enum: [UNASSIGNED, ASSIGNED]

    AssignmentAction:
      type: string
      enum: [ASSIGN, ASSIGN_TO_SELF, REASSIGN, UNASSIGN]

    WorkflowAction:
      type: string
      enum: [START_WORK, WAIT, RESUME, RESOLVE, DISMISS]

    CreateAlertRequest:
      type: object
      description: >
        **Required:** `inputEventId`, `inputType`, `sourceType`, `patientId`, `triggerTimestamp`, `evidencePayload`.
        `inputEventId` is provided by the client (e.g. care UI) for idempotent creates.
        **Optional:** `carePlanInstanceId`, `packageAssignmentId`, `severityHint`, `priority`,
        `alertPolicyTemplateVersionId`, `thresholdTemplateVersionId`, `groupingKey`, `triggerSummary`,
        `triggerSummaryTemplateCode`, `triggerSummaryParams` (required when `triggerSummaryTemplateCode` is set; may be `{}`).

        Organization is from the JWT (not in body). `sourceType` must equal `evidencePayload.source`;
        `evidencePayload.inputType` must equal top-level `inputType`. `appliesToType` and `linkedEntityCode`
        are required inside `evidencePayload`.
      required:
        - inputEventId
        - inputType
        - sourceType
        - patientId
        - triggerTimestamp
        - evidencePayload
      properties:
        inputEventId:
          type: string
          description: >
            Required. Client-generated idempotency key (e.g. from UI). Same value retried for the same org returns **409** with the existing alert.
        inputType:
          allOf:
            - $ref: '#/components/schemas/CreateAlertInputType'
          description: Required. `MISSED_READING` or `MISSING_DEVICE`.
        sourceType:
          allOf:
            - $ref: '#/components/schemas/SourceType'
          description: Required. Must match `evidencePayload.source`.
        patientId:
          type: string
          description: Required.
        carePlanInstanceId:
          type: string
          description: Optional. When tied to an active care plan.
        packageAssignmentId:
          type: string
          description: Optional. Package context when relevant.
        triggerTimestamp:
          type: string
          format: date-time
          description: Required. When the condition occurred (not receipt time).
        severityHint:
          allOf:
            - $ref: '#/components/schemas/SeverityHint'
          description: Optional.
        priority:
          allOf:
            - $ref: '#/components/schemas/Priority'
          description: Optional. Resolved priority; derived from policy when omitted.
        alertPolicyTemplateVersionId:
          type: string
          description: Optional. Policy template version.
        thresholdTemplateVersionId:
          type: string
          description: Optional. Threshold template when applicable.
        groupingKey:
          type: string
          description: Optional. May be computed server-side if omitted.
        triggerSummary:
          type: string
          description: Optional. Pre-rendered summary when not using a template.
        triggerSummaryTemplateCode:
          type: string
          description: Optional. Pair with `triggerSummaryParams` when set.
        triggerSummaryParams:
          type: object
          additionalProperties: true
          description: >
            Optional unless `triggerSummaryTemplateCode` is set; then required (may be `{}`). Omit both when using only `triggerSummary`.
        evidencePayload:
          allOf:
            - $ref: '#/components/schemas/EvidencePayload'
          description: Required. Per-`inputType` shape; see `EvidenceMissedReading` or `EvidenceMissingDevice`.

    AlertSummary:
      type: object
      properties:
        alertId:
          type: string
        priority:
          $ref: '#/components/schemas/Priority'
        alertState:
          $ref: '#/components/schemas/AlertState'
        inputType:
          $ref: '#/components/schemas/InputType'
        sourceType:
          $ref: '#/components/schemas/SourceType'
        triggerSummary:
          type: string
        triggerTimestamp:
          type: string
          format: date-time
        groupingKey:
          type: string
        patientId:
          type: string
        patientName:
          type: string
        assignedToUserId:
          type: string
          nullable: true
        assignedToDisplayName:
          type: string
        slaBreachIndicator:
          type: boolean
          description: True when assignment or resolution SLA is breached.
        assignSlaDueAt:
          type: string
          format: date-time
        resolveSlaDueAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    AlertDetail:
      allOf:
        - $ref: '#/components/schemas/AlertSummary'
        - type: object
          properties:
            inputEventId:
              type: string
            orgId:
              type: string
            evidencePayload:
              type: object
              additionalProperties: true
            groupId:
              type: string
              description: Operational group for drill-down and applyToGroup actions.
            assignedAt:
              type: string
              format: date-time
            assignedBy:
              type: string
            statusUpdatedAt:
              type: string
              format: date-time
            statusUpdatedBy:
              type: string
            closureComment:
              type: string
            resolutionCode:
              type: string
            dismissReason:
              type: string
            assignSla:
              type: integer
              description: Assignment SLA window in minutes (from creation).
            resolveSla:
              type: integer
              description: Resolution SLA window in minutes (from assignment).
            assignSlaBreachedAt:
              type: string
              format: date-time
            resolveSlaBreachedAt:
              type: string
              format: date-time
            carePlanInstanceId:
              type: string
            packageAssignmentId:
              type: string
            alertPolicyTemplateVersionId:
              type: string
            thresholdTemplateVersionId:
              type: string

    ActivityRecord:
      type: object
      properties:
        activityId:
          type: string
        alertId:
          type: string
        activityType:
          $ref: '#/components/schemas/ActivityType'
        activityTimestamp:
          type: string
          format: date-time
        performedBy:
          type: string
          description: User ID or SYSTEM.
        performedByDisplayName:
          type: string
        activityComment:
          type: string
        previousState:
          $ref: '#/components/schemas/AlertState'
        newState:
          $ref: '#/components/schemas/AlertState'
        previousPriority:
          $ref: '#/components/schemas/Priority'
        newPriority:
          $ref: '#/components/schemas/Priority'
        previousAssignee:
          type: string
        newAssignee:
          type: string
        evidencePayload:
          type: object
          additionalProperties: true

    AssignmentRequest:
      type: object
      required: [action]
      properties:
        action:
          $ref: '#/components/schemas/AssignmentAction'
        assignToUserId:
          type: string
          description: Required for ASSIGN and REASSIGN.
        comment:
          type: string
          description: Optional; used with REASSIGN.

    AlertIds:
      type: array
      description: One or many alert ids (single-select = array of one element).
      items:
        type: string
      minItems: 1
      maxItems: 100

    WorkflowMutationRequest:
      type: object
      required: [alertIds, action]
      description: >
        Applies the same workflow action to every id in `alertIds`. For **multiple** ids,
        **all listed alerts must share the same `alertState`** or the request fails with 422
        (`BULK_HETEROGENEOUS_ALERT_STATE`) and **none** are updated. For a **single** id,
        normal state-machine rules apply. `applyToGroup` is only valid when `alertIds` has
        exactly one element.
      properties:
        alertIds:
          $ref: '#/components/schemas/AlertIds'
        action:
          $ref: '#/components/schemas/WorkflowAction'
        closureComment:
          type: string
          description: Required for RESOLVE and DISMISS (terminal closure).
        resolutionCode:
          type: string
          description: Optional structured code when resolving.
        dismissReason:
          type: string
          description: Optional structured reason when dismissing.
        comment:
          type: string
          description: Optional for START_WORK, WAIT, and RESUME.
        applyToGroup:
          type: boolean
          default: false
          description: >
            Only when `alertIds` contains exactly one id: when true with RESOLVE or DISMISS,
            applies to all open alerts in the same group. Ignored when multiple ids are present.

    NoteRequest:
      type: object
      required: [comment]
      properties:
        comment:
          type: string

    PriorityMutationRequest:
      type: object
      required: [alertIds, priority]
      properties:
        alertIds:
          $ref: '#/components/schemas/AlertIds'
        priority:
          $ref: '#/components/schemas/Priority'
        comment:
          type: string

    AssignmentMutationRequest:
      allOf:
        - type: object
          required: [alertIds]
          properties:
            alertIds:
              $ref: '#/components/schemas/AlertIds'
        - $ref: '#/components/schemas/AssignmentRequest'

    AlertMutationResult:
      type: object
      description: >
        Per-alert outcomes. For workflow with one id and `applyToGroup`, `affectedCount` may be set.
      properties:
        succeeded:
          type: array
          items:
            type: string
        failed:
          type: array
          items:
            type: object
            required: [alertId, code, message]
            properties:
              alertId:
                type: string
              code:
                type: string
                example: NOT_FOUND
              message:
                type: string
        affectedCount:
          type: integer
          description: Present when `applyToGroup` resolved/dismissed multiple alerts in a group.

    WorkflowMutationResponse:
      allOf:
        - $ref: '#/components/schemas/AlertMutationResult'
        - type: object
          properties:
            primaryAlert:
              $ref: '#/components/schemas/AlertDetail'
              description: Optional; when a single alert was updated, full detail may be returned.

    PaginatedAlerts:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AlertSummary'
        nextToken:
          type: string
          description: Opaque cursor for the next page.

    PaginatedActivity:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActivityRecord'
        nextToken:
          type: string

  responses:
    BadRequest:
      description: Bad request — invalid input data
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "about:blank"
            title: "Validation failed"
            status: 400
            detail: "Invalid request data"
            code: "VALIDATION_ERROR"
            correlationId: "req-123"

    Unauthorized:
      description: Unauthorized — missing or invalid authentication
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "about:blank"
            title: "Unauthorized"
            status: 401
            detail: "Missing or invalid access token"
            code: "UNAUTHORIZED"
            correlationId: "req-123"

    Forbidden:
      description: Forbidden — insufficient permissions
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "about:blank"
            title: "Forbidden"
            status: 403
            detail: "Insufficient permission for this operation"
            code: "FORBIDDEN"
            correlationId: "req-123"

    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "about:blank"
            title: "Not found"
            status: 404
            detail: "Alert not found"
            code: "NOT_FOUND"
            correlationId: "req-123"

    Conflict:
      description: Resource conflict (e.g. idempotent replay)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "about:blank"
            title: "Conflict"
            status: 409
            detail: "Request conflicts with current state"
            code: "CONFLICT"
            correlationId: "req-123"

    UnprocessableEntity:
      description: >
        Unprocessable entity — e.g. `BULK_HETEROGENEOUS_ALERT_STATE`, `INVALID_STATE_TRANSITION`, or request validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "about:blank"
            title: "Unprocessable entity"
            status: 422
            detail: "Invalid state transition or heterogeneous bulk state"
            code: "BULK_HETEROGENEOUS_ALERT_STATE"
            correlationId: "req-123"

    InternalServerError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "about:blank"
            title: "Internal server error"
            status: 500
            detail: "An unexpected error occurred"
            code: "INTERNAL_ERROR"
            correlationId: "req-123"

paths:
  /v1/alerts:
    get:
      operationId: listAlerts
      summary: List alerts (Team Queue or My Alerts)
      description: >
        Supports the **Filters** panel and the list toolbar **search** field used in the UI.
        **Team Queue** vs **My Alerts** maps to `queue` (`TEAM` default, `MY` for the current user’s assignments).
        **Assignment:** omit `assignment` when no assignment filter is needed.
        Use `assignment` (`UNASSIGNED` or `ASSIGNED`) only when filtering by whether an alert has an assignee.
        **`queue=MY`** already restricts to the current user’s assignments.
        **Filter modal:** Priority → `priority`; Status → `state`; Type → `inputType`.
        **Patient-centric / timeline:** optional `patientId` (UUID) restricts the list to alerts for that patient
        (still scoped to the organization from the JWT). Omit for the global Team Queue or My Alerts views.
        **`patientId` may be combined** with `queue`, `state`, `priority`, `inputType`, `assignment`, and
        `dateFrom` / `dateTo` as usual.
        **By date range** → `dateFrom` / `dateTo` (inclusive).
        **Search bar** (`search`) matches **patient name** and/or **alert id** (substring or exact per implementation).
        When `patientId` is set, `search` may still apply (e.g. alert id substring); matching **patient name** is
        redundant if the patient is already fixed by `patientId`.
        Combine filters with `search` as needed; results are paginated with `pageSize` and `nextToken`.
        **Ordering:** which attribute the list is sorted by and ascending vs descending are implementation-defined
        (typically newest first by created time). Date bounds align with the list index timestamp when the server
        applies date-range filtering.
      tags: [Alert instances]
      parameters:
        - name: queue
          in: query
          description: Team Queue (`TEAM`) or My Alerts (`MY`).
          schema:
            $ref: '#/components/schemas/QueueKind'
        - name: state
          in: query
          description: Filter by alert status (UI **Status** dropdown).
          schema:
            $ref: '#/components/schemas/AlertState'
        - name: priority
          in: query
          description: Filter by priority (UI **Priority** dropdown).
          schema:
            $ref: '#/components/schemas/Priority'
        - name: inputType
          in: query
          description: Filter by alert type (UI **Type** dropdown).
          schema:
            $ref: '#/components/schemas/InputType'
        - name: assignment
          in: query
          description: >
            Omit when not filtering by assignment status. When set, `UNASSIGNED` or `ASSIGNED` (see schema).
          schema:
            $ref: '#/components/schemas/AlertListAssignmentFilter'
        - name: patientId
          in: query
          description: >
            When set, return only alerts linked to this patient (UUID). Organization scope comes from the JWT.
            Omit for the default Team Queue or My Alerts list without a patient filter.
          schema:
            type: string
          example: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
        - name: dateFrom
          in: query
          description: Start of **By date range** (inclusive, ISO-8601).
          schema:
            type: string
            format: date-time
        - name: dateTo
          in: query
          description: End of **By date range** (inclusive, ISO-8601).
          schema:
            type: string
            format: date-time
        - name: search
          in: query
          description: >
            Same behavior as the toolbar **“Search by Patient / Alert ID”** field: match against **patient name**
            (display name) and **alert id** (supports partial id text). Server-side search index recommended at scale;
            otherwise implement via supported backend or document client-side filtering limits.
          schema:
            type: string
            example: Jane Doe
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: nextToken
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated alert list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponsePaginatedAlerts'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      operationId: createAlert
      summary: Create an alert
      description: >
        Adds a new alert for the organization in the JWT scope: new `alertId`, initial state typically
        `UNASSIGNED`, grouping/SLA applied, `ALERT_CREATED` activity recorded. Requires permission to create
        alerts. Prefer **`sourceType`: `USER_INTERFACE`** when the origin is this API or the care UI.
      tags: [Alert instances]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlertRequest'
            examples:
              missingDevice:
                summary: Missing device (§5.1.3.1)
                value:
                  inputEventId: ui-missing-device-001
                  inputType: MISSING_DEVICE
