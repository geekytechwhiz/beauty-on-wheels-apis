# Comma-separated browser origins for REST preflight and Lambda responses.
# Override at deploy time with CORS_ALLOWED_ORIGINS (no wildcard when credentials are enabled).
# http://localhost:8081 is the Expo Web dev server.
value: ${env:CORS_ALLOWED_ORIGINS, 'http://localhost:8081,http://127.0.0.1:8081,http://localhost:3000,http://localhost:19006,http://localhost:8080'}
