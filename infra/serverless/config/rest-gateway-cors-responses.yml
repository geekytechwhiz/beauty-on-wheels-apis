# Shared REST API gateway responses. Headers are static; Allow-Origin is echoed
# only when the request Origin is in custom.corsAllowedOrigins.
# The body stays the API Gateway default message envelope.
GatewayResponseDefault4XX:
  Type: AWS::ApiGateway::GatewayResponse
  Properties:
    ResponseType: DEFAULT_4XX
    RestApiId:
      Ref: ApiGatewayRestApi
    ResponseParameters:
      gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,Idempotency-Key,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent,X-Amzn-Trace-Id,X-Correlation-Id,X-Request-Id'"
      gatewayresponse.header.Access-Control-Allow-Methods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"
      gatewayresponse.header.Vary: "'Origin'"
    ResponseTemplates:
      application/json: |
        #set($origin = $input.params("Origin"))
        #if($origin == "")#set($origin = $input.params("origin"))#end
        #set($allowed = "${self:custom.corsAllowedOrigins}")
        #set($match = false)
        #if($allowed == "*")
        #set($match = true)
        #elseif($origin != "")
        #foreach($candidate in $allowed.split(","))
        #if($origin == $candidate.trim())#set($match = true)#end
        #end
        #end
        #if($match && $origin != "")
        #set($context.responseOverride.header.Access-Control-Allow-Origin = $origin)
        #set($context.responseOverride.header.Access-Control-Allow-Credentials = "true")
        #end
        {"message":$context.error.messageString}

