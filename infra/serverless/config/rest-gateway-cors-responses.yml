# Shared REST API gateway responses. GatewayResponse bodies only support simple
# substitutions, not VTL. The previous VTL directives were therefore sent to
# callers verbatim. Gateway failures contain only a generic error message, so
# the request Origin is reflected only for this error surface; normal Lambda
# responses enforce custom.corsAllowedOrigins.
GatewayResponseDefault4XX:
  Type: AWS::ApiGateway::GatewayResponse
  Properties: &gatewayResponseProperties
    ResponseType: DEFAULT_4XX
    RestApiId:
      Ref: ApiGatewayRestApi
    ResponseParameters: &gatewayCorsHeaders
      gatewayresponse.header.Access-Control-Allow-Origin: method.request.header.Origin
      gatewayresponse.header.Access-Control-Allow-Credentials: "'true'"
      gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,Idempotency-Key,X-Requested-With,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent,X-Amzn-Trace-Id,X-Correlation-Id,X-Request-Id'"
      gatewayresponse.header.Access-Control-Allow-Methods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"
      gatewayresponse.header.Vary: "'Origin'"
    ResponseTemplates: &gatewayResponseBody
      application/json: '{"message":$context.error.messageString}'

GatewayResponseDefault5XX:
  Type: AWS::ApiGateway::GatewayResponse
  Properties:
    <<: *gatewayResponseProperties
    ResponseType: DEFAULT_5XX

GatewayResponseUnauthorized:
  Type: AWS::ApiGateway::GatewayResponse
  Properties:
    <<: *gatewayResponseProperties
    ResponseType: UNAUTHORIZED

GatewayResponseAccessDenied:
  Type: AWS::ApiGateway::GatewayResponse
  Properties:
    <<: *gatewayResponseProperties
    ResponseType: ACCESS_DENIED

GatewayResponseMissingAuthenticationToken:
  Type: AWS::ApiGateway::GatewayResponse
  Properties:
    <<: *gatewayResponseProperties
    ResponseType: MISSING_AUTHENTICATION_TOKEN

GatewayResponseExpiredToken:
  Type: AWS::ApiGateway::GatewayResponse
  Properties:
    <<: *gatewayResponseProperties
    ResponseType: EXPIRED_TOKEN

GatewayResponseIntegrationFailure:
  Type: AWS::ApiGateway::GatewayResponse
  Properties:
    <<: *gatewayResponseProperties
    ResponseType: INTEGRATION_FAILURE

GatewayResponseIntegrationTimeout:
  Type: AWS::ApiGateway::GatewayResponse
  Properties:
    <<: *gatewayResponseProperties
    ResponseType: INTEGRATION_TIMEOUT

# These failures are generated before the Lambda proxy integration is invoked.
# Pin their response definitions so an authorizer outage remains visible to
# browser clients as an HTTP error with the same CORS headers as every route.
GatewayResponseAuthorizerFailure:
  Type: AWS::ApiGateway::GatewayResponse
  Properties:
    <<: *gatewayResponseProperties
    ResponseType: AUTHORIZER_FAILURE

GatewayResponseAuthorizerConfigurationError:
  Type: AWS::ApiGateway::GatewayResponse
  Properties:
    <<: *gatewayResponseProperties
    ResponseType: AUTHORIZER_CONFIGURATION_ERROR

GatewayResponseInvalidSignature:
  Type: AWS::ApiGateway::GatewayResponse
  Properties:
    <<: *gatewayResponseProperties
    ResponseType: INVALID_SIGNATURE
