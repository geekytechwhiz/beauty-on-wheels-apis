# Attach to the CodeBuild service role (not the Lambda execution role).
# Required when provider.environment or function env uses ${ssm:...} without inline fallbacks.
Effect: Allow
Action:
  - ssm:GetParameter
  - ssm:GetParameters
  - ssm:GetParametersByPath
Resource:
  - arn:aws:ssm:${aws:region}:${aws:accountId}:parameter/${self:provider.stage}/${self:service}/*
  - arn:aws:ssm:${aws:region}:${aws:accountId}:parameter/${self:provider.stage}/user-service/*
  - arn:aws:ssm:${aws:region}:${aws:accountId}:parameter/${self:provider.stage}/organization-service/*
  - arn:aws:ssm:${aws:region}:${aws:accountId}:parameter/${self:provider.stage}/error-service/*
