name: aws
runtime: nodejs22.x
versionFunctions: false
region: us-east-1
stage: ${opt:stage, 'dev'}
memorySize: 512
timeout: 30

tracing:
  lambda: true
  apiGateway: true

# Requires custom.logRetentionByStage (infra/serverless/config/log-retention-by-stage.yml).
logRetentionInDays: ${self:custom.logRetentionByStage.${self:provider.stage}, '14'}

tags:
  Service: ${self:service}
  Stage: ${self:provider.stage}
  ManagedBy: serverless

deploymentBucket:
  name: ${self:provider.stage}-mvx-${self:service}-bucket
  serverSideEncryption: AES256

logs:
  restApi: ${file(./config/rest-api-logs.yml)}
