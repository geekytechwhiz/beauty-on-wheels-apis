service: authorizer-service

frameworkVersion: '3'

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 128
  timeout: 5
  environment:
    REGION: ${self:provider.region}
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID, ''}
    EXPECTED_AUDIENCE: ${env:EXPECTED_AUDIENCE, env:COGNITO_CLIENT_ID, ''}
    SECRET_MANAGER_NAME: ${env:SECRET_MANAGER_NAME, ''}
    USER_TABLE: ${env:USER_TABLE, ''}
    END_USER_MESSAGING_URL: ${env:END_USER_MESSAGING_URL, ''}
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
  tags:
    Service: ${self:service}
    Stage: ${self:provider.stage}
    ManagedBy: serverless
  iamRoleStatements:
    - Effect: Allow
      Action: secretsmanager:GetSecretValue
      Resource: '*'
    - Effect: Allow
      Action:
        - dynamodb:Query
      Resource: '*'

package:
  individually: true

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    format: cjs
    tsconfig: ../../tsconfig.base.json
    external:
      - aws-sdk
    plugins: esbuild-plugins.js
    resolveExtensions:
      - '.ts'
      - '.js'

functions:
  authorizer:
    handler: src/handler.main
    timeout: 5
    memorySize: 128
    description: OAuth2 / SMART on FHIR Lambda Token Authorizer (JWT via JWKS)
