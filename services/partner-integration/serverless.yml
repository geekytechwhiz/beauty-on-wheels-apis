service: partner-integration

frameworkVersion: '3'

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-offline

provider:
  name: aws
  runtime: nodejs22.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 30
  environment:
    REGION: ${self:provider.region}
    DEFAULT_REGION: ${self:provider.region}
    PARTNER_REGISTRY_ENDPOINT: ${self:custom.partnerRegistryEndpoint.${self:provider.stage}}
    LOG_LEVEL: ${self:custom.logLevel.${self:provider.stage}, 'info'}
    IDEMPOTENCY_TABLE_NAME: ${self:service}-${self:provider.stage}-idempotency
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
  tags:
    Service: ${self:service}
    Stage: ${self:provider.stage}
    ManagedBy: serverless
  iamRoleStatements:
    - Effect: Allow
      Action:
        - logs:CreateLogGroup
        - logs:CreateLogStream
        - logs:PutLogEvents
      Resource: '*'
    - Effect: Allow
      Action:
        - ssm:GetParameter
        - ssm:GetParameters
      Resource: arn:aws:ssm:${self:provider.region}:${aws:accountId}:parameter/*
    - Effect: Allow
      Action:
        - secretsmanager:GetSecretValue
      Resource: arn:aws:secretsmanager:${self:provider.region}:${aws:accountId}:secret:*
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
      Resource: !GetAtt IdempotencyTable.Arn

package:
  individually: true

custom:
  partnerRegistryEndpoint:
    dev: ${env:PARTNER_REGISTRY_ENDPOINT, 'http://localhost:3001'}
    stg: ${env:PARTNER_REGISTRY_ENDPOINT, ''}
    prd: ${env:PARTNER_REGISTRY_ENDPOINT, ''}
  logLevel:
    dev: debug
    stg: info
    prd: warn
  cors:
    origin: ${env:CORS_ORIGIN, '*'}
    headers:
      - Content-Type
      - X-Amz-Date
      - Authorization
      - X-Api-Key
      - X-Correlation-Id
      - Idempotency-Key
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    format: cjs
    tsconfig: ../../tsconfig.base.json
    external:
      - aws-sdk
    plugins: esbuild-plugins.js
    resolveExtensions:
      - '.ts'
      - '.js'

functions:
  health:
    handler: src/handlers/health.main
    events:
      - http:
          path: /health
          method: get
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}

  createOrder:
    handler: src/handlers/createOrder.main
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: /orders
          method: post
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}

  rescheduleOrder:
    handler: src/handlers/rescheduleOrder.main
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: /orders/{orderId}/reschedule
          method: post
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}

  cancelOrder:
    handler: src/handlers/cancelOrder.main
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: /orders/{orderId}/cancel
          method: post
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}

  getOrderStatus:
    handler: src/handlers/getOrderStatus.main
    timeout: 10
    memorySize: 256
    events:
      - http:
          path: /orders/{orderId}/status
          method: get
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}

  getServiceableLocations:
    handler: src/handlers/getServiceableLocations.main
    timeout: 10
    memorySize: 256
    events:
      - http:
          path: /locations/serviceable
          method: get
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}

  getPartnerLocation:
    handler: src/handlers/getPartnerLocation.main
    timeout: 10
    memorySize: 256
    events:
      - http:
          path: /locations/partner
          method: get
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}

  searchPackages:
    handler: src/handlers/searchPackages.main
    timeout: 10
    memorySize: 256
    events:
      - http:
          path: /packages/search
          method: get
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}

  getPackageDetails:
    handler: src/handlers/getPackageDetails.main
    timeout: 10
    memorySize: 256
    events:
      - http:
          path: /packages/details
          method: get
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}

  getBookingSlots:
    handler: src/handlers/getBookingSlots.main
    timeout: 10
    memorySize: 256
    events:
      - http:
          path: /booking-slots
          method: get
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}

  confirmBooking:
    handler: src/handlers/confirmBooking.main
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: /orders/{orderId}/confirm
          method: post
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}

  updatePackage:
    handler: src/handlers/updatePackage.main
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: /packages/{packageCode}
          method: put
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}

  getConsolidatedReport:
    handler: src/handlers/getConsolidatedReport.main
    timeout: 10
    memorySize: 256
    events:
      - http:
          path: /orders/{orderId}/reports/consolidated
          method: get
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}

  getDigitalReport:
    handler: src/handlers/getDigitalReport.main
    timeout: 10
    memorySize: 256
    events:
      - http:
          path: /orders/{orderId}/reports/digital
          method: get
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}

  updateCredit:
    handler: src/handlers/updateCredit.main
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: /orders/{orderId}/credit
          method: put
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}

resources:
  Resources:
    IdempotencyTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.IDEMPOTENCY_TABLE_NAME}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: idempotencyKey
            AttributeType: S
        KeySchema:
          - AttributeName: idempotencyKey
            KeyType: HASH
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
