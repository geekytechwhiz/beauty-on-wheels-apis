service: partner-registry

frameworkVersion: '3'

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin

provider:
  name: aws
  runtime: nodejs22.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 30
  environment:
    REGION: ${self:provider.region}
    INTEGRATION_REGISTRY_TABLE: ${self:custom.integrationRegistryTable.${self:provider.stage}}
    LOG_LEVEL: ${self:custom.logLevel.${self:provider.stage}, 'info'}
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
    DEFAULT_REGION: ${self:provider.region}
  tags:
    Service: ${self:service}
    Stage: ${self:provider.stage}
    ManagedBy: serverless
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:Query
        - dynamodb:BatchGetItem
        - dynamodb:BatchWriteItem
        - dynamodb:DescribeTable
      Resource:
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/integration-registry-*
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/integration-registry-*/index/*

package:
  individually: true

custom:
  integrationRegistryTable:
    dev: integration-registry-dev
    stg: integration-registry-stg
    prd: integration-registry-prd
  logLevel:
    dev: debug
    stg: info
    prd: warn
  cors:
    origin: ${env:CORS_ORIGIN, '*'}
    headers:
      - Content-Type
      - X-Amz-Date
      - Authorization
      - X-Api-Key
      - X-Correlation-Id
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    format: cjs
    tsconfig: ../../tsconfig.base.json
    external:
      - aws-sdk
    plugins: esbuild-plugins.js
    resolveExtensions:
      - '.ts'
      - '.js'

functions:
  health:
    handler: src/handlers/health.main
    events:
      - http:
          path: /health
          method: get
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}

  createPartner:
    handler: src/handlers/createPartner.main
    timeout: 10
    memorySize: 256
    events:
      - http:
          path: /partner
          method: post
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}

  updatePartner:
    handler: src/handlers/updatePartner.main
    timeout: 10
    memorySize: 256
    events:
      - http:
          path: /partner/{id}
          method: patch
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}

  getPartner:
    handler: src/handlers/getPartner.main
    timeout: 5
    memorySize: 256
    events:
      - http:
          path: /partner/{id}
          method: get
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}

  setPartnerCapability:
    handler: src/handlers/setPartnerCapability.main
    timeout: 10
    memorySize: 256
    events:
      - http:
          path: /partner/{id}/capability
          method: put
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}

  linkOrgPartner:
    handler: src/handlers/linkOrgPartner.main
    timeout: 10
    memorySize: 256
    events:
      - http:
          path: /organization/{orgId}/partner
          method: post
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}

  listOrgPartners:
    handler: src/handlers/listOrgPartners.main
    timeout: 10
    memorySize: 256
    events:
      - http:
          path: /organization/{orgId}/partners
          method: get
          cors:
            origin: ${self:custom.cors.origin}
            headers: ${self:custom.cors.headers}
