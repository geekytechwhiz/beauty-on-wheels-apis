service: sso-integration

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  deploymentBucket:
    name: ${self:provider.stage}-mvx-sso-integration-bucket
    serverSideEncryption: AES256
  memorySize: 256
  timeout: 30
  tags:
    Service: ${self:service}
    Stage: ${self:provider.stage}
    ManagedBy: serverless
  environment:
    NODE_ENV: ${self:provider.stage}
    SERVICE_NAME: ${self:service}
    LOG_LEVEL: ${env:LOG_LEVEL, 'info'}
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID, 'us-east-1_AK1HTxdlX'}
    COGNITO_CLIENT_ID: ${env:COGNITO_CLIENT_ID, ''}
    HMS_BASE_URL: ${env:HMS_BASE_URL, 'https://qahms.zmtrutech.com'}
    HMS_API_KEY: ${env:HMS_API_KEY, '03faace2-7d0b-4e77-95b1-82c4a48943d3'}
    HMS_TIMEOUT_MS: ${env:HMS_TIMEOUT_MS, '5000'}
    USER_SERVICE_BASE_URL: ${env:USER_SERVICE_BASE_URL, 'https://e5gv0qum80.execute-api.us-east-1.amazonaws.com/dev'}
    USER_SERVICE_INTERNAL_API_KEY: ${env:USER_SERVICE_INTERNAL_API_KEY, ''}
    ROLE_SERVICE_BASE_URL: ${env:ROLE_SERVICE_BASE_URL, 'https://qtzgcngz60.execute-api.us-east-1.amazonaws.com/dev'}
    ROLE_SERVICE_INTERNAL_API_KEY: ${env:ROLE_SERVICE_INTERNAL_API_KEY, ''}
    RATE_LIMIT_WINDOW_MS: ${env:RATE_LIMIT_WINDOW_MS, '60000'}
    RATE_LIMIT_MAX_REQUESTS: ${env:RATE_LIMIT_MAX_REQUESTS, '100'}
    PATIENT_CREATION_QUEUE_URL: !GetAtt PatientCreationQueue.QueueUrl
  iamRoleStatements:
    - Effect: Allow
      Action:
        - cognito-idp:AdminInitiateAuth
        - cognito-idp:AdminCreateUser
        - cognito-idp:AdminSetUserPassword
        - cognito-idp:AdminUpdateUserAttributes
        - cognito-idp:AdminGetUser
      Resource:
        - !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${env:COGNITO_USER_POOL_ID, "us-east-1_AK1HTxdlX"}'
    # SQS permissions for patient event publishing
    - Effect: Allow
      Action:
        - sqs:SendMessage
        - sqs:SendMessageBatch
        - sqs:GetQueueUrl
        - sqs:GetQueueAttributes
      Resource:
        - !GetAtt PatientCreationQueue.Arn
    # SQS permissions for patient event consumer
    - Effect: Allow
      Action:
        - sqs:ReceiveMessage
        - sqs:DeleteMessage
        - sqs:GetQueueAttributes
      Resource:
        - !GetAtt PatientCreationQueue.Arn

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-offline

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node20
    platform: node
    format: cjs
    tsconfig: ../../tsconfig.base.json
    external:
      - '@aws-sdk/client-cognito-identity-provider'
      - '@aws-sdk/client-sqs'
  dotenv:
    logging: false
  serverless-offline:
    httpPort: 3000
    noPrependStageInUrl: true

functions:
  health:
    handler: src/handlers/health.handler
    description: Health check endpoint
    events:
      - http:
          path: /health
          method: get
          cors: true

  ssoLaunch:
    handler: src/handlers/sso/launch.handler
    description: SSO launch endpoint for TruTech integration
    timeout: 30
    events:
      - http:
          path: /sso/launch
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Correlation-Id
              - X-Request-Id
            allowCredentials: false

  # ---------------------------------------------------------------------------
  # Appointments Endpoints (Phase 1)
  # ---------------------------------------------------------------------------

  appointmentsToday:
    handler: src/handlers/appointments/todays.handler
    description: Get today's appointments for the authenticated doctor
    timeout: 15
    events:
      - http:
          path: /appointments/today
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - X-Correlation-Id
              - X-Request-Id
            allowCredentials: false
          authorizer:
            name: authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:authorizer-service-${self:provider.stage}-authorizer

  patientEMR:
    handler: src/handlers/appointments/patient-emr.handler
    description: Get patient EMR summary for last 3 visits
    timeout: 15
    events:
      - http:
          path: /appointments/{patientId}/emr
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - X-Correlation-Id
              - X-Request-Id
            allowCredentials: false
          request:
            parameters:
              paths:
                patientId: true
          authorizer:
            name: authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:authorizer-service-${self:provider.stage}-authorizer

  # ---------------------------------------------------------------------------
  # Patient Creation Event Consumer (Background Worker)
  # ---------------------------------------------------------------------------

  patientCreationEventConsumer:
    handler: src/handlers/patient-creation-event-consumer.handler
    description: Background worker for processing patient creation events from SQS
    timeout: 60
    memorySize: 512
    reservedConcurrentExecutions: 10
    events:
      - sqs:
          arn: !GetAtt PatientCreationQueue.Arn
          batchSize: 10
          maximumBatchingWindowInSeconds: 5
          functionResponseType: ReportBatchItemFailures

# ---------------------------------------------------------------------------
# CloudFormation Resources
# ---------------------------------------------------------------------------

resources:
  Resources:
    # SQS Queue for Patient Creation Events
    PatientCreationQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:provider.stage}-sso-integration-patient-creation-queue
        VisibilityTimeoutSeconds: 300  # 5 minutes (should be >= Lambda timeout)
        MessageRetentionPeriod: 1209600  # 14 days
        ReceiveMessageWaitTimeSeconds: 0  # Short polling (immediate)
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt PatientCreationDLQ.Arn
          maxReceiveCount: 3  # Retry 3 times before moving to DLQ
        Tags:
          - Key: Service
            Value: ${self:service}
          - Key: Stage
            Value: ${self:provider.stage}
          - Key: ManagedBy
            Value: serverless

    # Dead Letter Queue for Failed Patient Creation Events
    PatientCreationDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:provider.stage}-sso-integration-patient-creation-dlq
        MessageRetentionPeriod: 1209600  # 14 days
        Tags:
          - Key: Service
            Value: ${self:service}
          - Key: Stage
            Value: ${self:provider.stage}
          - Key: ManagedBy
            Value: serverless