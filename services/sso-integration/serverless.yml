service: sso-integration

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}

  deploymentBucket:
    name: ${self:provider.stage}-mvx-sso-integration-bucket
    serverSideEncryption: AES256

  memorySize: 256
  timeout: 120

  tags:
    Service: ${self:service}
    Stage: ${self:provider.stage}
    ManagedBy: serverless

  environment:
    NODE_ENV: ${self:provider.stage}
    SERVICE_NAME: ${self:service}
    LOG_LEVEL: ${env:LOG_LEVEL, 'info'}

  

    # Cognito
    COGNITO_USER_POOL_ID: ${self:custom.stageUrls.${self:provider.stage}.COGNITO_USER_POOL_ID}
    COGNITO_CLIENT_ID: ${self:custom.stageUrls.${self:provider.stage}.COGNITO_CLIENT_ID}
    COGNITO_SSO_COMMON_PASSWORD: Comm@n12
    DOCTOR_ROLE_ID: ${self:custom.stageUrls.${self:provider.stage}.DOCTOR_ROLE_ID}
    PATIENT_ROLE_ID: ${self:custom.stageUrls.${self:provider.stage}.PATIENT_ROLE_ID}
    SUBDOMAIN: qahms
    INTERNAL_SERVICE_TOKEN: ${self:custom.stageUrls.${self:provider.stage}.INTERNAL_SERVICE_TOKEN}
    SSO_DEFAULT_ORGANIZATION_ID: ${self:custom.stageUrls.${self:provider.stage}.SSO_DEFAULT_ORGANIZATION_ID}
    PROVIDER: TRU_TECH

    # TruTech HMS (default)
    TRU_TECH_BASE_URL: ${self:custom.stageUrls.${self:provider.stage}.TRU_TECH_BASE_URL}
    TRU_TECH_API_KEY: ${self:custom.stageUrls.${self:provider.stage}.TRU_TECH_API_KEY}
    TRU_TECH_TIMEOUT_MS: ${env:TRU_TECH_TIMEOUT_MS, '60000'}
    TENANT_HMS_CONFIG: ${env:TENANT_HMS_CONFIG, '{}'}
    BYPASS_SUFFIX_APPOINTMENTS: ${env:BYPASS_SUFFIX_APPOINTMENTS, true}
    # Internal Services
    USER_SERVICE_BASE_URL: ${self:custom.stageUrls.${self:provider.stage}.USER_SERVICE_BASE_URL}
    ROLE_SERVICE_BASE_URL: ${self:custom.stageUrls.${self:provider.stage}.ROLE_SERVICE_BASE_URL}

    RATE_LIMIT_WINDOW_MS: ${env:RATE_LIMIT_WINDOW_MS, '60000'}
    RATE_LIMIT_MAX_REQUESTS: ${env:RATE_LIMIT_MAX_REQUESTS, '100'}

    # Schedule Service
    SCHEDULE_SERVICE_API_URL: ${self:custom.stageUrls.${self:provider.stage}.SCHEDULE_SERVICE_API_URL}
    SCHEDULE_SERVICE_API_TIMEOUT_MS: ${env:SCHEDULE_SERVICE_API_TIMEOUT_MS, '60000'}

    # Package Service
    PACKAGE_SERVICE_API_URL: ${self:custom.stageUrls.${self:provider.stage}.PACKAGE_SERVICE_BASE_URL}
    PACKAGE_SERVICE_API_TIMEOUT_MS: ${env:PACKAGE_SERVICE_API_TIMEOUT_MS, '60000'}

    # Appointment Sync
    BYPASS_PENDING_APPOINTMENT: ${env:BYPASS_PENDING_APPOINTMENT, 'false'}
    APPOINTMENT_SYNC_MAX_RETRIES: ${env:APPOINTMENT_SYNC_MAX_RETRIES, '3'}
    APPOINTMENT_SYNC_RETRY_DELAY_MS: ${env:APPOINTMENT_SYNC_RETRY_DELAY_MS, '5000'}
    APPOINTMENT_SYNC_MAX_RETRY_DELAY_MS: ${env:APPOINTMENT_SYNC_MAX_RETRY_DELAY_MS, '60000'}
    APPOINTMENT_SYNC_CONCURRENCY_LIMIT: ${env:APPOINTMENT_SYNC_CONCURRENCY_LIMIT, '5'}

    # Infrastructure
    PATIENT_CREATION_QUEUE_URL: 
      Ref: PatientCreationQueue
    APPOINTMENT_SYNC_QUEUE_URL:
      Ref: AppointmentSyncQueue
    DOCTOR_PROVISION_QUEUE_URL:
      Ref: DoctorProvisionQueue
    SCHEDULE_CREATION_QUEUE_URL:
      Ref: ScheduleCreationQueue
    PENDING_REPROCESS_QUEUE_URL:
      Ref: PendingAppointmentReprocessQueue
    CANCELLATION_RECONCILIATION_QUEUE_URL:
      Ref: CancellationReconciliationQueue
    ENABLE_CANCELLED_APPOINTMENT_RECONCILIATION: ${env:ENABLE_CANCELLED_APPOINTMENT_RECONCILIATION, 'true'}
    ERROR_MESSAGES_CDN_URL: https://d2p9v61861q1ox.cloudfront.net

    SYNC_LOOKAHEAD_DAYS: ${env:SYNC_LOOKAHEAD_DAYS, '1'} 

    REGISTERED_HMS_DOCTOR_IDS: 4
    INTEGRATION_PROVIDER_AFRICA_HMS: africa-hmsc
    SERVICE_TOKEN_SECRET_ID: ${self:custom.stageUrls.${self:provider.stage}.SECRET_MANAGER_NAME}

  iamRoleStatements:

    - Effect: Allow
      Action:
        - logs:CreateLogGroup
        - logs:CreateLogStream
        - logs:PutLogEvents
      Resource: "*"
    - Effect: Allow
      Action:
        - cognito-idp:AdminInitiateAuth
        - cognito-idp:AdminCreateUser
        - cognito-idp:AdminSetUserPassword
        - cognito-idp:AdminUpdateUserAttributes
        - cognito-idp:AdminGetUser
        - cognito-idp:ListUsers
      Resource:
        - arn:aws:cognito-idp:${self:provider.region}:${aws:accountId}:userpool/${self:custom.stageUrls.${self:provider.stage}.COGNITO_USER_POOL_ID}
    
    - Effect: Allow
      Action:
        - sqs:SendMessage
        - sqs:ReceiveMessage
        - sqs:DeleteMessage
        - sqs:GetQueueAttributes
        - sqs:ChangeMessageVisibility
      Resource:
        - Fn::GetAtt:
            - PatientCreationQueue
            - Arn
        - Fn::GetAtt:
            - PatientCreationDLQ
            - Arn
        - Fn::GetAtt:
            - AppointmentSyncQueue
            - Arn
        - Fn::GetAtt:
            - AppointmentSyncDLQ
            - Arn
        - Fn::GetAtt:
            - ScheduleCreationQueue
            - Arn
        - Fn::GetAtt:
            - ScheduleCreationDLQ
            - Arn
        - Fn::GetAtt:
            - DoctorProvisionQueue
            - Arn
        - Fn::GetAtt:
            - DoctorProvisionDLQ
            - Arn
        - Fn::GetAtt:
            - PendingAppointmentReprocessQueue
            - Arn
        - Fn::GetAtt:
            - PendingAppointmentReprocessDLQ
            - Arn
        - Fn::GetAtt:
            - CancellationReconciliationQueue
            - Arn
        - Fn::GetAtt:
            - CancellationReconciliationDLQ
            - Arn

    - Effect: Allow
      Action:
        - cloudwatch:PutMetricData
      Resource: '*'

    - Effect: Allow
      Action:
        - secretsmanager:GetSecretValue
      Resource:
        - arn:aws:secretsmanager:${self:provider.region}:${aws:accountId}:secret:${self:custom.stageUrls.${self:provider.stage}.SECRET_MANAGER_NAME}*

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-offline

