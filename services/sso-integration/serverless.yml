service: sso-integration

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  deploymentBucket:
    name: ${self:provider.stage}-mvx-sso-integration-bucket
    serverSideEncryption: AES256
  memorySize: 256
  timeout: 30
  tags:
    Service: ${self:service}
    Stage: ${self:provider.stage}
    ManagedBy: serverless
  environment:
    NODE_ENV: ${self:provider.stage}
    SERVICE_NAME: ${self:service}
    LOG_LEVEL: ${env:LOG_LEVEL, 'info'}
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID, 'us-east-1_AK1HTxdlX'}
    COGNITO_CLIENT_ID: ${env:COGNITO_CLIENT_ID, '6v68r2stt9b4rgr3u8348bslsi'}

    # TruTech adapter config (dummy defaults so env.ts validation passes)
    TRU_TECH_BASE_URL: ${env:TRU_TECH_BASE_URL, 'https://qahms.zmtrutech.com'}
    TRU_TECH_API_KEY: ${env:TRU_TECH_API_KEY, '03faace2-7d0b-4e77-95b1-82c4a48943d3'}
    TRU_TECH_TIMEOUT_MS: ${env:TRU_TECH_TIMEOUT_MS, '5000'}

    USER_SERVICE_BASE_URL: ${env:USER_SERVICE_BASE_URL, 'https://e5gv0qum80.execute-api.us-east-1.amazonaws.com/dev'}
    ROLE_SERVICE_BASE_URL: ${env:ROLE_SERVICE_BASE_URL, 'https://qtzgcngz60.execute-api.us-east-1.amazonaws.com/dev'}
    SERVICE_TOKEN_SECRET: ${env:SERVICE_TOKEN_SECRET, 'dummy-service-token-secret-for-local-dev'}
    RATE_LIMIT_WINDOW_MS: ${env:RATE_LIMIT_WINDOW_MS, '60000'}
    RATE_LIMIT_MAX_REQUESTS: ${env:RATE_LIMIT_MAX_REQUESTS, '100'}
    # Schedule Service
    SCHEDULE_SERVICE_API_URL: ${env:SCHEDULE_SERVICE_API_URL, 'https://pyima0ntak.execute-api.us-east-1.amazonaws.com'}
    SCHEDULE_SERVICE_API_TIMEOUT_MS: ${env:SCHEDULE_SERVICE_API_TIMEOUT_MS, '10000'}
    # Appointment Sync
    APPOINTMENT_SYNC_MAX_RETRIES: ${env:APPOINTMENT_SYNC_MAX_RETRIES, '3'}
    APPOINTMENT_SYNC_RETRY_DELAY_MS: ${env:APPOINTMENT_SYNC_RETRY_DELAY_MS, '1000'}
    APPOINTMENT_SYNC_MAX_RETRY_DELAY_MS: ${env:APPOINTMENT_SYNC_MAX_RETRY_DELAY_MS, '10000'}
    APPOINTMENT_SYNC_CONCURRENCY_LIMIT: ${env:APPOINTMENT_SYNC_CONCURRENCY_LIMIT, '5'}

    PATIENT_CREATION_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/542476693486/dev-sso-integration-patient-creation-queue
    ERROR_MESSAGES_CDN_URL: https://d2p9v61861q1ox.cloudfront.net
    SYNC_LOOKAHEAD_DAYS: ${env:SYNC_LOOKAHEAD_DAYS, '1'}
    HMS_SYNC_SCHEDULE_EXPRESSION: ${env:HMS_SYNC_SCHEDULE_EXPRESSION, 'rate(30 minutes)'}
    REGISTERED_HMS_DOCTOR_IDS: 4
    INTEGRATION_PROVIDER_AFRICA_HMS: africa-hms
    
  iamRoleStatements:
    - Effect: Allow
      Action:
        - cognito-idp:AdminInitiateAuth
        - cognito-idp:AdminCreateUser
        - cognito-idp:AdminSetUserPassword
        - cognito-idp:AdminUpdateUserAttributes
        - cognito-idp:AdminGetUser
        - cognito-idp:ListUsers
      Resource:
        - arn:aws:cognito-idp:${self:provider.region}:${aws:accountId}:userpool/${env:COGNITO_USER_POOL_ID, 'us-east-1_AK1HTxdlX'}
    - Effect: Allow
      Action:
        - sqs:SendMessage
        - sqs:ReceiveMessage
        - sqs:DeleteMessage
        - sqs:GetQueueAttributes
      Resource:
        - Fn::GetAtt:
            - PatientCreationQueue
            - Arn
        - Fn::GetAtt:
            - PatientCreationDLQ
            - Arn

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-offline

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node20
    platform: node
    format: cjs
    tsconfig: ../../tsconfig.base.json
    external:
      - '@aws-sdk/client-cognito-identity-provider'
      - '@aws-sdk/client-sqs'
  dotenv:
    logging: false
  serverless-offline:
    httpPort: 3000
    noPrependStageInUrl: true

functions:
  health:
    handler: src/handlers/health.handler
    description: Health check endpoint
    events:
      - http:
          path: /health
          method: get
          cors: true

  ssoLaunch:
    handler: src/handlers/http/sso-launch.handler
    description: SSO launch endpoint for TruTech integration
    timeout: 30
    events:
      - http:
          path: /sso/launch
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Correlation-Id
              - X-Request-Id
            allowCredentials: false

  # ---------------------------------------------------------------------------
  # Appointments Endpoints (Phase 1)
  # ---------------------------------------------------------------------------

  appointmentsToday:
    handler: src/handlers/http/appointments.handler
    description: Get today's appointments for the authenticated doctor
    timeout: 15
    events:
      - http:
          path: /appointments/today
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - X-Correlation-Id
              - X-Request-Id
            allowCredentials: false
          # authorizer:
            # name: authorizer
            # type: token
            # identitySource: method.request.header.Authorization
            # arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:authorizer-service-${self:provider.stage}-authorizer

  patientEMR:
    handler: src/handlers/http/patient-emr.handler
    description: Get patient EMR summary for last 3 visits
    timeout: 15
    events:
      - http:
          path: /appointments/{patientId}/emr
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - X-Correlation-Id
              - X-Request-Id
            allowCredentials: false
          request:
            parameters:
              paths:
                patientId: true
          # authorizer:
          #   name: authorizer
          #   type: token
          #   identitySource: method.request.header.Authorization
          #   arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:authorizer-service-${self:provider.stage}-authorizer

  appointmentSync:
    handler: src/handlers/http/appointment-sync.handler
    description: Sync today&apos;s appointments into schedule service
    timeout: 30
    events:
      - http:
          path: /appointments/sync
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - X-Correlation-Id
              - X-Request-Id
            allowCredentials: false
          # authorizer:
          #   name: authorizer
          #   type: token
          #   identitySource: method.request.header.Authorization
            # arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:authorizer-service-${self:provider.stage}-authorizer
 
  patientCreationEventConsumer:
    handler: src/handlers/events/patient-creation-event-consumer.handler
    description: Background worker for processing patient creation events from SQS
    timeout: 60
    memorySize: 512
    events:
      - sqs:
          arn:
            Fn::GetAtt:
              - PatientCreationQueue
              - Arn
          batchSize: 10
          functionResponseType: ReportBatchItemFailures

  syncHmsAppointments:
    handler: src/handlers/events/sync-hms-appointments.handler
    description: Periodic HMS appointment synchronization from TruTech into schedule service
    timeout: 900
    memorySize: 512
    events:
      - http:
          path: /appointments/sync/hms
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - X-Correlation-Id
              - X-Request-Id
            allowCredentials: false
          authorizer:
            name: authorizer
            type: token
            identitySource: method.request.header.Authorization
            arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:authorizer-service-${self:provider.stage}-authorizer



resources:
  Resources:
    PatientCreationDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:provider.stage}-sso-integration-patient-creation-dlq
        MessageRetentionPeriod: 1209600  # 14 days
        Tags:
          - Key: Service
            Value: ${self:service}
          - Key: Stage
            Value: ${self:provider.stage}
          - Key: ManagedBy
            Value: serverless

    # SQS Queue for Patient Creation Events
    PatientCreationQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:provider.stage}-sso-integration-patient-creation-queue
        VisibilityTimeout: 300
        MessageRetentionPeriod: 1209600
        ReceiveMessageWaitTimeSeconds: 0
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt:
              - PatientCreationDLQ
              - Arn
          maxReceiveCount: 3
        Tags:
          - Key: Service
            Value: ${self:service}
          - Key: Stage
            Value: ${self:provider.stage}
          - Key: ManagedBy
            Value: serverless
    SyncHmsAppointmentsScheduleRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: scheduler.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: InvokeSyncHmsAppointmentsLambda
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - lambda:InvokeFunction
                  Resource:
                    - arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:service}-${self:provider.stage}-syncHmsAppointments
    SyncHmsAppointmentsSchedule:
      Type: AWS::Scheduler::Schedule
      Properties:
        ScheduleExpression: ${env:HMS_SYNC_SCHEDULE_EXPRESSION, 'rate(30 minutes)'}
        FlexibleTimeWindow:
          Mode: FLEXIBLE
          MaximumWindowInMinutes: 5
        State: ENABLED
        Target:
          Arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:service}-${self:provider.stage}-syncHmsAppointments
          RoleArn: !GetAtt SyncHmsAppointmentsScheduleRole.Arn
          Input: |
            {
              "source": "hms-appointments-scheduler"
            }
          RetryPolicy:
            MaximumEventAgeInSeconds: 3600
            MaximumRetryAttempts: 3
