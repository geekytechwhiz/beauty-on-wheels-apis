functions:

  health:
    handler: src/handlers/health.handler
    description: Health check endpoint
    timeout: 30
    events:
      - http:
          path: /health
          method: get
          cors: true

  ssoLaunch:
    handler: src/handlers/http/sso-launch.handler
    description: SSO launch endpoint for TruTech integration
    timeout: 60
    events:
      - http:
          path: /sso/launch
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Correlation-Id
              - X-Request-Id
            allowCredentials: false

  appointmentsToday:
    handler: src/handlers/http/appointments.handler
    description: Get today's appointments for the authenticated doctor
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: /appointments/today
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - X-Correlation-Id
              - X-Request-Id
            allowCredentials: false

  appointmentSync:
    handler: src/handlers/http/appointment-sync.handler
    description: Sync today's appointments into schedule service
    timeout: 120
    memorySize: 512
    events:
      - http:
          path: /appointments/sync
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - X-Correlation-Id
              - X-Request-Id
            allowCredentials: false

  patientCreationEventConsumer:
    handler: src/handlers/events/patient-creation-event-consumer.handler
    description: Background worker for patient creation events
    timeout: 60
    memorySize: 512
    reservedConcurrency: 20
    events:
      - sqs:
          arn:
            Fn::GetAtt:
              - PatientCreationQueue
              - Arn
          batchSize: 5
          functionResponseType: ReportBatchItemFailures

  syncHmsAppointments:
    handler: src/handlers/events/sync-hms-appointments.handler
    description: HMS appointment sync from TruTech (scheduler-only, enqueue-only)
    timeout: 900
    memorySize: 512
    # No HTTP events; triggered only by EventBridge Scheduler (see resources)

  appointmentProcessor:
    handler: src/handlers/events/appointment-processor.handler
    description: Process one appointment per SQS message from AppointmentSyncQueue
    timeout: 120
    memorySize: 512
    reservedConcurrency: 50
    events:
      - sqs:
          arn:
            Fn::GetAtt:
              - AppointmentSyncQueue
              - Arn
          batchSize: 1
          functionResponseType: ReportBatchItemFailures

  doctorProvisionWorker:
    handler: src/handlers/events/doctor-provision-worker.handler
    description: Create doctor then re-enqueue appointment to AppointmentSyncQueue
    timeout: 120
    memorySize: 512
    reservedConcurrency: 20
    events:
      - sqs:
          arn:
            Fn::GetAtt:
              - DoctorProvisionQueue
              - Arn
          batchSize: 1
          functionResponseType: ReportBatchItemFailures

  scheduleCreationWorker:
    handler: src/handlers/events/schedule-creation-worker.handler
    description: Create schedule from ScheduleCreationQueue (async schedule creation)
    timeout: 120
    memorySize: 512
    reservedConcurrency: 30
    events:
      - sqs:
          arn:
            Fn::GetAtt:
              - ScheduleCreationQueue
              - Arn
          batchSize: 1
          functionResponseType: ReportBatchItemFailures

  pendingAppointmentReprocessWorker:
    handler: src/handlers/events/pending-appointment-reprocess-worker.handler
    description: Re-enqueue pending appointments to AppointmentSyncQueue after patient creation
    timeout: 60
    memorySize: 256
    reservedConcurrency: 20
    events:
      - sqs:
          arn:
            Fn::GetAtt:
              - PendingAppointmentReprocessQueue
              - Arn
          batchSize: 1
          functionResponseType: ReportBatchItemFailures

  cancellationReconciliationWorker:
    handler: src/handlers/events/cancellation-reconciliation-worker.handler
    description: Reconcile missing TruTech appointments and cancel confirmed schedules
    timeout: 120
    memorySize: 512
    reservedConcurrency: 20
    events:
      - sqs:
          arn:
            Fn::GetAtt:
              - CancellationReconciliationQueue
              - Arn
          batchSize: 1
          functionResponseType: ReportBatchItemFailures

resources:

  Resources:

    PatientCreationDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:provider.stage}-sso-integration-patient-creation-dlq
        MessageRetentionPeriod: 1209600

    PatientCreationQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:provider.stage}-sso-integration-patient-creation-queue.fifo
        VisibilityTimeout: 300
        MessageRetentionPeriod: 1209600
        ReceiveMessageWaitTimeSeconds: 20
        FifoQueue: true
        ContentBasedDeduplication: false
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt:
              - PatientCreationDLQ
              - Arn
          maxReceiveCount: 3

    AppointmentSyncDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:provider.stage}-sso-integration-appointment-sync-dlq
        MessageRetentionPeriod: 1209600

    AppointmentSyncQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:provider.stage}-sso-integration-appointment-sync-queue
        VisibilityTimeout: 300
        MessageRetentionPeriod: 1209600
        ReceiveMessageWaitTimeSeconds: 0
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt:
              - AppointmentSyncDLQ
              - Arn
          maxReceiveCount: 3

    ScheduleCreationDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:provider.stage}-sso-integration-schedule-creation-dlq
        MessageRetentionPeriod: 1209600

    ScheduleCreationQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:provider.stage}-sso-integration-schedule-creation-queue
        VisibilityTimeout: 300
        MessageRetentionPeriod: 1209600
        ReceiveMessageWaitTimeSeconds: 0
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt:
              - ScheduleCreationDLQ
              - Arn
          maxReceiveCount: 3

    DoctorProvisionDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:provider.stage}-sso-integration-doctor-provision-dlq
        MessageRetentionPeriod: 1209600

    DoctorProvisionQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:provider.stage}-sso-integration-doctor-provision-queue
        VisibilityTimeout: 300
        MessageRetentionPeriod: 1209600
        ReceiveMessageWaitTimeSeconds: 0
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt:
              - DoctorProvisionDLQ
              - Arn
          maxReceiveCount: 3

    PendingAppointmentReprocessDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:provider.stage}-sso-integration-pending-reprocess-dlq
        MessageRetentionPeriod: 1209600

    PendingAppointmentReprocessQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:provider.stage}-sso-integration-pending-reprocess-queue
        VisibilityTimeout: 120
        MessageRetentionPeriod: 1209600
        ReceiveMessageWaitTimeSeconds: 0
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt:
              - PendingAppointmentReprocessDLQ
              - Arn
          maxReceiveCount: 3

    CancellationReconciliationDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:provider.stage}-sso-integration-cancellation-reconciliation-dlq
        MessageRetentionPeriod: 1209600

    CancellationReconciliationQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:provider.stage}-sso-integration-cancellation-reconciliation-queue
        VisibilityTimeout: 300
        MessageRetentionPeriod: 1209600
        ReceiveMessageWaitTimeSeconds: 0
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt:
              - CancellationReconciliationDLQ
              - Arn
          maxReceiveCount: 3

    SyncHmsAppointmentsScheduleRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: scheduler.amazonaws.com
              Action: sts:AssumeRole

        Policies:
          - PolicyName: InvokeSyncHmsAppointmentsLambda
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - lambda:InvokeFunction
                    - lambda:InvokeAsync
                  Resource:
                    - arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:service}-${self:provider.stage}-syncHmsAppointments

    SyncHmsAppointmentsScheduleMorning:
      Type: AWS::Scheduler::Schedule
      Properties:
      # ScheduleExpression: cron(0 9 * * ? *)
        ScheduleExpression: cron(30 11 * * ? *)
        ScheduleExpressionTimezone: Africa/Lusaka
        FlexibleTimeWindow:
          Mode: OFF
        State: ENABLED

        Target:
          Arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:service}-${self:provider.stage}-syncHmsAppointments
          RoleArn: !GetAtt SyncHmsAppointmentsScheduleRole.Arn

          Input: |
            {
              "source": "hms-appointments-scheduler",
              "schedule": "morning"
            }

          RetryPolicy:
            MaximumEventAgeInSeconds: 3600
            MaximumRetryAttempts: 3

    # CloudWatch Alarms: DLQ message count (trigger when any message is in DLQ)
    AlarmAppointmentSyncDLQ:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:provider.stage}-sso-integration-appointment-sync-dlq
        MetricName: ApproximateNumberOfMessagesVisible
        Namespace: AWS/SQS
        Dimensions:
          - Name: QueueName
            Value: ${self:provider.stage}-sso-integration-appointment-sync-dlq
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching

    AlarmScheduleCreationDLQ:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:provider.stage}-sso-integration-schedule-creation-dlq
        MetricName: ApproximateNumberOfMessagesVisible
        Namespace: AWS/SQS
        Dimensions:
          - Name: QueueName
            Value: ${self:provider.stage}-sso-integration-schedule-creation-dlq
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching

    AlarmDoctorProvisionDLQ:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:provider.stage}-sso-integration-doctor-provision-dlq
        MetricName: ApproximateNumberOfMessagesVisible
        Namespace: AWS/SQS
        Dimensions:
          - Name: QueueName
            Value: ${self:provider.stage}-sso-integration-doctor-provision-dlq
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching

    AlarmPendingReprocessDLQ:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:provider.stage}-sso-integration-pending-reprocess-dlq
        MetricName: ApproximateNumberOfMessagesVisible
        Namespace: AWS/SQS
        Dimensions:
          - Name: QueueName
            Value: ${self:provider.stage}-sso-integration-pending-reprocess-dlq
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching

    AlarmPatientCreationDLQ:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:provider.stage}-sso-integration-patient-creation-dlq
        MetricName: ApproximateNumberOfMessagesVisible
        Namespace: AWS/SQS
        Dimensions:
          - Name: QueueName
            Value: ${self:provider.stage}-sso-integration-patient-creation-dlq
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching

    AlarmCancellationReconciliationDLQ:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:provider.stage}-sso-integration-cancellation-reconciliation-dlq
        MetricName: ApproximateNumberOfMessagesVisible
        Namespace: AWS/SQS
        Dimensions:
          - Name: QueueName
            Value: ${self:provider.stage}-sso-integration-cancellation-reconciliation-dlq
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
