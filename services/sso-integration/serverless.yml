service: sso-integration

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}

  deploymentBucket:
    name: ${self:provider.stage}-mvx-sso-integration-bucket
    serverSideEncryption: AES256

  memorySize: 256
  timeout: 120

  tags:
    Service: ${self:service}
    Stage: ${self:provider.stage}
    ManagedBy: serverless

  environment:
    NODE_ENV: ${self:provider.stage}
    SERVICE_NAME: ${self:service}
    LOG_LEVEL: ${env:LOG_LEVEL, 'info'}

    # Cognito
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID, 'us-east-1_AK1HTxdlX'}
    COGNITO_CLIENT_ID: ${env:COGNITO_CLIENT_ID, '6v68r2stt9b4rgr3u8348bslsi'}
    COGNITO_EMAIL_DOMAIN_OVERRIDE: ${env:COGNITO_EMAIL_DOMAIN_OVERRIDE, 'hms.com'}
    COGNITO_SSO_COMMON_PASSWORD: Comm@n123

    INTERNAL_SERVICE_TOKEN: b7c3f2e6d91a4c7e8f0b2d5a6c9e3f417d8a0b5c2e4f6a1d9c7e3b8f2a4d6c1

    # TruTech HMS
    TRU_TECH_BASE_URL: ${env:TRU_TECH_BASE_URL, 'https://qahms.zmtrutech.com'}
    TRU_TECH_API_KEY: ${env:TRU_TECH_API_KEY, '03faace2-7d0b-4e77-95b1-82c4a48943d3'}
    TRU_TECH_TIMEOUT_MS: ${env:TRU_TECH_TIMEOUT_MS, '60000'}

    # Internal Services
    USER_SERVICE_BASE_URL: ${env:USER_SERVICE_BASE_URL, 'https://e5gv0qum80.execute-api.us-east-1.amazonaws.com/dev'}
    ROLE_SERVICE_BASE_URL: ${env:ROLE_SERVICE_BASE_URL, 'https://qtzgcngz60.execute-api.us-east-1.amazonaws.com/dev'}

    RATE_LIMIT_WINDOW_MS: ${env:RATE_LIMIT_WINDOW_MS, '60000'}
    RATE_LIMIT_MAX_REQUESTS: ${env:RATE_LIMIT_MAX_REQUESTS, '100'}

    # Schedule Service
    SCHEDULE_SERVICE_API_URL: ${env:SCHEDULE_SERVICE_API_URL, 'https://pyima0ntak.execute-api.us-east-1.amazonaws.com'}
    SCHEDULE_SERVICE_API_TIMEOUT_MS: ${env:SCHEDULE_SERVICE_API_TIMEOUT_MS, '60000'}

    # Package Service
    PACKAGE_SERVICE_API_URL: ${env:PACKAGE_SERVICE_API_URL, 'https://v1w4b4vunl.execute-api.us-east-1.amazonaws.com/dev'}
    PACKAGE_SERVICE_API_TIMEOUT_MS: ${env:PACKAGE_SERVICE_API_TIMEOUT_MS, '60000'}

    # Appointment Sync
    APPOINTMENT_SYNC_MAX_RETRIES: ${env:APPOINTMENT_SYNC_MAX_RETRIES, '3'}
    APPOINTMENT_SYNC_RETRY_DELAY_MS: ${env:APPOINTMENT_SYNC_RETRY_DELAY_MS, '5000'}
    APPOINTMENT_SYNC_MAX_RETRY_DELAY_MS: ${env:APPOINTMENT_SYNC_MAX_RETRY_DELAY_MS, '60000'}
    APPOINTMENT_SYNC_CONCURRENCY_LIMIT: ${env:APPOINTMENT_SYNC_CONCURRENCY_LIMIT, '5'}

    # Infrastructure
    PATIENT_CREATION_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/542476693486/dev-sso-integration-patient-creation-queue
    ERROR_MESSAGES_CDN_URL: https://d2p9v61861q1ox.cloudfront.net

    SYNC_LOOKAHEAD_DAYS: ${env:SYNC_LOOKAHEAD_DAYS, '1'}
    HMS_SYNC_SCHEDULE_EXPRESSION: ${env:HMS_SYNC_SCHEDULE_EXPRESSION, 'rate(30 minutes)'}

    REGISTERED_HMS_DOCTOR_IDS: 4
    INTEGRATION_PROVIDER_AFRICA_HMS: africa-hms

  iamRoleStatements:
    - Effect: Allow
      Action:
        - cognito-idp:AdminInitiateAuth
        - cognito-idp:AdminCreateUser
        - cognito-idp:AdminSetUserPassword
        - cognito-idp:AdminUpdateUserAttributes
        - cognito-idp:AdminGetUser
        - cognito-idp:ListUsers
      Resource:
        - arn:aws:cognito-idp:${self:provider.region}:${aws:accountId}:userpool/${env:COGNITO_USER_POOL_ID, 'us-east-1_AK1HTxdlX'}

    - Effect: Allow
      Action:
        - sqs:SendMessage
        - sqs:ReceiveMessage
        - sqs:DeleteMessage
        - sqs:GetQueueAttributes
      Resource:
        - Fn::GetAtt:
            - PatientCreationQueue
            - Arn
        - Fn::GetAtt:
            - PatientCreationDLQ
            - Arn

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-offline

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node20
    platform: node
    format: cjs
    tsconfig: ../../tsconfig.base.json
    external:
      - '@aws-sdk/client-cognito-identity-provider'
      - '@aws-sdk/client-sqs'

  dotenv:
    logging: false

  serverless-offline:
    httpPort: 3000
    noPrependStageInUrl: true

functions:

  health:
    handler: src/handlers/health.handler
    description: Health check endpoint
    timeout: 30
    events:
      - http:
          path: /health
          method: get
          cors: true

  ssoLaunch:
    handler: src/handlers/http/sso-launch.handler
    description: SSO launch endpoint for TruTech integration
    timeout: 60
    events:
      - http:
          path: /sso/launch
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Correlation-Id
              - X-Request-Id
            allowCredentials: false

  appointmentsToday:
    handler: src/handlers/http/appointments.handler
    description: Get today's appointments for the authenticated doctor
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: /appointments/today
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - X-Correlation-Id
              - X-Request-Id
            allowCredentials: false

  appointmentSync:
    handler: src/handlers/http/appointment-sync.handler
    description: Sync today's appointments into schedule service
    timeout: 120
    memorySize: 512
    events:
      - http:
          path: /appointments/sync
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - X-Correlation-Id
              - X-Request-Id
            allowCredentials: false

  patientCreationEventConsumer:
    handler: src/handlers/events/patient-creation-event-consumer.handler
    description: Background worker for patient creation events
    timeout: 60
    memorySize: 512
    events:
      - sqs:
          arn:
            Fn::GetAtt:
              - PatientCreationQueue
              - Arn
          batchSize: 10
          functionResponseType: ReportBatchItemFailures

  syncHmsAppointments:
    handler: src/handlers/events/sync-hms-appointments.handler
    description: HMS appointment sync from TruTech
    timeout: 900
    memorySize: 512
    events:
      - http:
          path: /appointments/sync/hms
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - X-Correlation-Id
              - X-Request-Id
            allowCredentials: false

resources:

  Resources:

    PatientCreationDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:provider.stage}-sso-integration-patient-creation-dlq
        MessageRetentionPeriod: 1209600

    PatientCreationQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:provider.stage}-sso-integration-patient-creation-queue
        VisibilityTimeout: 300
        MessageRetentionPeriod: 1209600
        ReceiveMessageWaitTimeSeconds: 0
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt:
              - PatientCreationDLQ
              - Arn
          maxReceiveCount: 3

    SyncHmsAppointmentsScheduleRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: scheduler.amazonaws.com
              Action: sts:AssumeRole

        Policies:
          - PolicyName: InvokeSyncHmsAppointmentsLambda
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - lambda:InvokeFunction
                  Resource:
                    - arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:service}-${self:provider.stage}-syncHmsAppointments

    SyncHmsAppointmentsScheduleMorning:
      Type: AWS::Scheduler::Schedule
      Properties:
        ScheduleExpression: cron(0 9 * * ? *)
        ScheduleExpressionTimezone: Africa/Lusaka
        FlexibleTimeWindow:
          Mode: OFF
        State: ENABLED

        Target:
          Arn: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:service}-${self:provider.stage}-syncHmsAppointments
          RoleArn: !GetAtt SyncHmsAppointmentsScheduleRole.Arn

          Input: |
            {
              "source": "hms-appointments-scheduler",
              "schedule": "morning"
            }

          RetryPolicy:
            MaximumEventAgeInSeconds: 3600
            MaximumRetryAttempts: 3