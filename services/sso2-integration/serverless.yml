service: sso-myvitalrx

frameworkVersion: "3"

# Automatically loads .env file — AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, etc.
# are injected into the process so the AWS SDK picks them up
useDotenv: true

# ─────────────────────────────────────────────
# PLUGINS
# ─────────────────────────────────────────────
plugins:
  - serverless-esbuild        # Bundles TypeScript directly from src/ — no dist/ needed
  - serverless-dynamodb-local # Local DynamoDB for offline development
  - serverless-offline        # Run API Gateway + Lambda locally

# ─────────────────────────────────────────────
# CUSTOM SETTINGS
# ─────────────────────────────────────────────
custom:
  stage: ${opt:stage, 'dev'}

  # ── esbuild (TypeScript bundler) ─────────────
  esbuild:
    bundle: true
    minify: false           # Keep readable for local dev; set true for prod
    sourcemap: true
    target: "node20"
    platform: "node"
    exclude:
      - "@aws-sdk/client-dynamodb"
      - "@aws-sdk/lib-dynamodb"
    watch:
      pattern: ["src/**/*.ts"]

  # ── serverless-offline ───────────────────────
  serverless-offline:
    httpPort: 3000
    lambdaPort: 3001
    host: "0.0.0.0"

  # ── Local DynamoDB ───────────────────────────
  dynamodb:
    stages:
      - dev
    start:
      port: 8000
      inMemory: true
      migrate: true       # Auto-create tables from resources section on start
      seed: false
    seed:
      test:
        sources: []

# ─────────────────────────────────────────────
# PROVIDER
# ─────────────────────────────────────────────
provider:
  name: aws
  runtime: nodejs20.x
  stage: ${self:custom.stage}
  region: ${opt:region, 'us-east-1'}
  memorySize: 256
  timeout: 30
  profile: ${opt:aws-profile, ''}

  environment:
    LAUNCH_TOKENS_TABLE: sso-launch-tokens-${self:custom.stage}
    SESSIONS_TABLE: sso-sessions-${self:custom.stage}
    HMS_CLIENTS_TABLE: sso-hms-clients-${self:custom.stage}
    # Offline: reads JWT_SECRET from env.json / local env var, falls back to a safe default
    # AWS deploy: set JWT_SECRET in CI/CD env or pass via --param="jwtSecret=xxx"
    JWT_SECRET: ${env:JWT_SECRET, 'local-dev-jwt-secret-min-32-characters-here'}
    JWT_EXPIRY: "3600"
    REFRESH_TOKEN_EXPIRY: "86400"
    LAUNCH_TOKEN_TTL: "300"
    MYVITALRX_BASE_URL: "https://app.myvitalrx.com"
    ENV: ${self:custom.stage}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - !GetAtt LaunchTokensTable.Arn
            - !GetAtt SessionsTable.Arn
            - !Sub "${SessionsTable.Arn}/index/*"
            - !GetAtt HmsClientsTable.Arn

# ─────────────────────────────────────────────
# FUNCTIONS
# ─────────────────────────────────────────────
functions:

  # ── 1. Generate Launch Token (HMS → SSO) ─────
  generateLaunchToken:
    handler: src/functions/generateLaunchToken/handler.handler
    description: "HMS calls this to generate a one-time launch token and redirect URL"
    events:
      - http:
          path: /hms/launch
          method: POST
          cors: true

  # ── 2. Validate / Exchange Launch Token ───────
  validateLaunchToken:
    handler: src/functions/validateLaunchToken/handler.handler
    description: "MyVitalRx exchanges launch_token for access_token + refresh_token"
    events:
      - http:
          path: /auth/exchange
          method: POST
          cors: true

  # ── 3. Refresh Token ───────────────────────────
  refreshToken:
    handler: src/functions/refreshToken/handler.handler
    description: "Exchange refresh_token for a new access_token"
    events:
      - http:
          path: /auth/refresh
          method: POST
          cors: true

  # ── 4. Revoke Token (Logout) ───────────────────
  revokeToken:
    handler: src/functions/revokeToken/handler.handler
    description: "Revoke/invalidate a session (logout)"
    events:
      - http:
          path: /auth/revoke
          method: POST
          cors: true
          authorizer:
            name: jwtAuthorizer
            resultTtlInSeconds: 300
            identitySource: method.request.header.Authorization
            type: token

  # ── 5. JWT Lambda Authorizer ───────────────────
  jwtAuthorizer:
    handler: src/functions/jwtAuthorizer/handler.handler
    description: "API Gateway Lambda Authorizer - validates JWT tokens"

  # ── 6. Protected: Get Patient Data ─────────────
  getPatientData:
    handler: src/functions/api/getPatientData/handler.handler
    description: "Protected: Get patient data (HMS accesses via JWT)"
    events:
      - http:
          path: /api/patients/{patientId}
          method: GET
          cors: true
          authorizer:
            name: jwtAuthorizer
            resultTtlInSeconds: 300
            identitySource: method.request.header.Authorization
            type: token

  # ── 7. Protected: Get Health Records ───────────
  getHealthRecords:
    handler: src/functions/api/getHealthRecords/handler.handler
    description: "Protected: Get health records for a patient"
    events:
      - http:
          path: /api/patients/{patientId}/health-records
          method: GET
          cors: true
          authorizer:
            name: jwtAuthorizer
            resultTtlInSeconds: 300
            identitySource: method.request.header.Authorization
            type: token

  # ── 8. Register HMS Client (Admin) ─────────────
  registerHmsClient:
    handler: src/functions/admin/registerHmsClient/handler.handler
    description: "Admin: Register a new HMS client (organization)"
    events:
      - http:
          path: /admin/hms-clients
          method: POST
          cors: true

# ─────────────────────────────────────────────
# DYNAMODB TABLES (CloudFormation resources)
# ─────────────────────────────────────────────
resources:
  Resources:

    # ── Launch Tokens Table ──────────────────────
    LaunchTokensTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: sso-launch-tokens-${self:custom.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: launchToken
            AttributeType: S
        KeySchema:
          - AttributeName: launchToken
            KeyType: HASH
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true

    # ── Sessions Table ───────────────────────────
    SessionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: sso-sessions-${self:custom.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: sessionId
            AttributeType: S
          - AttributeName: refreshToken
            AttributeType: S
        KeySchema:
          - AttributeName: sessionId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: RefreshTokenIndex
            KeySchema:
              - AttributeName: refreshToken
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true

    # ── HMS Clients Table ────────────────────────
    HmsClientsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: sso-hms-clients-${self:custom.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: clientId
            AttributeType: S
        KeySchema:
          - AttributeName: clientId
            KeyType: HASH
