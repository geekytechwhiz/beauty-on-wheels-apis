AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  SSO System - Hospital Management System (HMS) <-> MyVitalRx
  Serverless SSO using Launch Token + JWT pattern on AWS

# ─────────────────────────────────────────────
# GLOBAL SETTINGS
# ─────────────────────────────────────────────
Globals:
  Function:
    Runtime: nodejs20.x
    Architectures: [x86_64]
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        LAUNCH_TOKENS_TABLE: !Ref LaunchTokensTable
        SESSIONS_TABLE: !Ref SessionsTable
        HMS_CLIENTS_TABLE: !Ref HmsClientsTable
        JWT_SECRET: !Sub "{{resolve:ssm:/sso/${Env}/jwt-secret}}"
        JWT_EXPIRY: "3600"           # 1 hour (seconds)
        REFRESH_TOKEN_EXPIRY: "86400" # 24 hours (seconds)
        LAUNCH_TOKEN_TTL: "300"      # 5 minutes (seconds)
        MYVITALRX_BASE_URL: !Sub "https://api.myvitalrx.com"
        ENV: !Ref Env

# ─────────────────────────────────────────────
# PARAMETERS
# ─────────────────────────────────────────────
Parameters:
  Env:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment

# ─────────────────────────────────────────────
# RESOURCES
# ─────────────────────────────────────────────
Resources:

  # ── API Gateway ─────────────────────────────
  SSOApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "sso-api-${Env}"
      StageName: !Ref Env
      Auth:
        DefaultAuthorizer: JwtAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          JwtAuthorizer:
            FunctionArn: !GetAtt JwtAuthorizerFunction.Arn
            Identity:
              Header: Authorization
              ReauthorizeEvery: 300
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Api-Key,X-HMS-Client-Id'"
        AllowOrigin: "'*'"
      GatewayResponses:
        UNAUTHORIZED:
          StatusCode: 401
          ResponseTemplates:
            application/json: '{"error":"Unauthorized","message":"Invalid or missing JWT token"}'
        ACCESS_DENIED:
          StatusCode: 403
          ResponseTemplates:
            application/json: '{"error":"Forbidden","message":"Access denied"}'
      Tags:
        Project: SSO-MyVitalRx
        Environment: !Ref Env

  # ══════════════════════════════════════════
  # LAMBDA FUNCTIONS
  # SAM esbuild bundles TypeScript from src/ directly — no dist/ folder needed
  # ══════════════════════════════════════════

  # ── 1. Generate Launch Token (HMS → SSO) ───
  #    HMS calls this to initiate SSO
  #    Requires X-HMS-Client-Id + X-HMS-Api-Key headers
  GenerateLaunchTokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "sso-generate-launch-token-${Env}"
      CodeUri: src/functions/generateLaunchToken/
      Handler: handler.handler
      Description: "HMS calls this to generate a one-time launch token and redirect URL"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LaunchTokensTable
        - DynamoDBReadPolicy:
            TableName: !Ref HmsClientsTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref SSOApi
            Path: /hms/launch
            Method: POST
            Auth:
              Authorizer: NONE   # HMS uses its own API key auth
      Tags:
        Function: GenerateLaunchToken
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: false
        EntryPoints:
          - handler.ts
        External:
          - "@aws-sdk/client-dynamodb"
          - "@aws-sdk/lib-dynamodb"

  # ── 2. Validate / Exchange Launch Token ────
  #    MyVitalRx calls this to swap launch_token → JWT
  ValidateLaunchTokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "sso-validate-launch-token-${Env}"
      CodeUri: src/functions/validateLaunchToken/
      Handler: handler.handler
      Description: "MyVitalRx exchanges launch_token for access_token + refresh_token"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LaunchTokensTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref SSOApi
            Path: /auth/exchange
            Method: POST
            Auth:
              Authorizer: NONE   # Token exchange is public (launch_token IS the secret)
      Tags:
        Function: ValidateLaunchToken
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: false
        EntryPoints:
          - handler.ts
        External:
          - "@aws-sdk/client-dynamodb"
          - "@aws-sdk/lib-dynamodb"

  # ── 3. Refresh Token ───────────────────────
  RefreshTokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "sso-refresh-token-${Env}"
      CodeUri: src/functions/refreshToken/
      Handler: handler.handler
      Description: "Exchange refresh_token for a new access_token"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref SSOApi
            Path: /auth/refresh
            Method: POST
            Auth:
              Authorizer: NONE
      Tags:
        Function: RefreshToken
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: false
        EntryPoints:
          - handler.ts
        External:
          - "@aws-sdk/client-dynamodb"
          - "@aws-sdk/lib-dynamodb"

  # ── 4. Revoke Token (Logout) ───────────────
  RevokeTokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "sso-revoke-token-${Env}"
      CodeUri: src/functions/revokeToken/
      Handler: handler.handler
      Description: "Revoke/invalidate a session (logout)"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref SSOApi
            Path: /auth/revoke
            Method: POST
            Auth:
              Authorizer: JwtAuthorizer
      Tags:
        Function: RevokeToken
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: false
        EntryPoints:
          - handler.ts
        External:
          - "@aws-sdk/client-dynamodb"
          - "@aws-sdk/lib-dynamodb"

  # ── 5. JWT Lambda Authorizer ───────────────
  #    Protects all /api/* routes
  JwtAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "sso-jwt-authorizer-${Env}"
      CodeUri: src/functions/jwtAuthorizer/
      Handler: handler.handler
      Description: "API Gateway Lambda Authorizer - validates JWT tokens"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SessionsTable
      Tags:
        Function: JwtAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: false
        EntryPoints:
          - handler.ts
        External:
          - "@aws-sdk/client-dynamodb"
          - "@aws-sdk/lib-dynamodb"

  # ── 6. Protected: Get Patient Data ─────────
  GetPatientDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "sso-get-patient-data-${Env}"
      CodeUri: src/functions/api/getPatientData/
      Handler: handler.handler
      Description: "Protected: Get patient data (HMS accesses via JWT)"
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref SSOApi
            Path: /api/patients/{patientId}
            Method: GET
      Tags:
        Function: GetPatientData
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: false
        EntryPoints:
          - handler.ts
        External:
          - "@aws-sdk/client-dynamodb"
          - "@aws-sdk/lib-dynamodb"

  # ── 7. Protected: Get Health Records ───────
  GetHealthRecordsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "sso-get-health-records-${Env}"
      CodeUri: src/functions/api/getHealthRecords/
      Handler: handler.handler
      Description: "Protected: Get health records for a patient"
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref SSOApi
            Path: /api/patients/{patientId}/health-records
            Method: GET
      Tags:
        Function: GetHealthRecords
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: false
        EntryPoints:
          - handler.ts
        External:
          - "@aws-sdk/client-dynamodb"
          - "@aws-sdk/lib-dynamodb"

  # ── 8. HMS Client Management (Admin) ───────
  RegisterHmsClientFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "sso-register-hms-client-${Env}"
      CodeUri: src/functions/admin/registerHmsClient/
      Handler: handler.handler
      Description: "Admin: Register a new HMS client (organization)"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HmsClientsTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref SSOApi
            Path: /admin/hms-clients
            Method: POST
            Auth:
              Authorizer: NONE
      Tags:
        Function: RegisterHmsClient
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: false
        EntryPoints:
          - handler.ts
        External:
          - "@aws-sdk/client-dynamodb"
          - "@aws-sdk/lib-dynamodb"

  # ══════════════════════════════════════════
  # DYNAMODB TABLES
  # ══════════════════════════════════════════

  # ── Launch Tokens Table ────────────────────
  #    Stores one-time launch tokens from HMS
  #    TTL: 5 minutes
  LaunchTokensTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "sso-launch-tokens-${Env}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: launchToken
          AttributeType: S
      KeySchema:
        - AttributeName: launchToken
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: SSO-MyVitalRx
        - Key: Environment
          Value: !Ref Env

  # ── Sessions Table ─────────────────────────
  #    Stores active JWT sessions (refresh tokens)
  #    TTL: 24 hours
  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "sso-sessions-${Env}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
        - AttributeName: refreshToken
          AttributeType: S
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: RefreshTokenIndex
          KeySchema:
            - AttributeName: refreshToken
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: SSO-MyVitalRx
        - Key: Environment
          Value: !Ref Env

  # ── HMS Clients Table ──────────────────────
  #    Registered HMS organizations + API credentials
  HmsClientsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "sso-hms-clients-${Env}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: clientId
          AttributeType: S
      KeySchema:
        - AttributeName: clientId
          KeyType: HASH
      Tags:
        - Key: Project
          Value: SSO-MyVitalRx
        - Key: Environment
          Value: !Ref Env

  # ══════════════════════════════════════════
  # SSM PARAMETER (JWT Secret placeholder)
  # ══════════════════════════════════════════
  JwtSecretParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/sso/${Env}/jwt-secret"
      Type: String
      Value: "CHANGE_ME_USE_SECRETS_MANAGER_IN_PROD"
      Description: "JWT signing secret for SSO tokens"
      Tags:
        Project: SSO-MyVitalRx
        Environment: !Ref Env

# ─────────────────────────────────────────────
# OUTPUTS
# ─────────────────────────────────────────────
Outputs:
  SSOApiUrl:
    Description: "SSO API Gateway URL"
    Value: !Sub "https://${SSOApi}.execute-api.${AWS::Region}.amazonaws.com/${Env}"
    Export:
      Name: !Sub "SSOApiUrl-${Env}"

  GenerateLaunchTokenEndpoint:
    Description: "HMS calls this endpoint to generate a launch token"
    Value: !Sub "https://${SSOApi}.execute-api.${AWS::Region}.amazonaws.com/${Env}/hms/launch"

  ValidateLaunchTokenEndpoint:
    Description: "MyVitalRx calls this endpoint to exchange launch token for JWT"
    Value: !Sub "https://${SSOApi}.execute-api.${AWS::Region}.amazonaws.com/${Env}/auth/exchange"

  LaunchTokensTableName:
    Description: "DynamoDB table for launch tokens"
    Value: !Ref LaunchTokensTable

  SessionsTableName:
    Description: "DynamoDB table for sessions"
    Value: !Ref SessionsTable

  HmsClientsTableName:
    Description: "DynamoDB table for HMS clients"
    Value: !Ref HmsClientsTable
